ch/?api=1&query=Kasugataisha+Manyo+Botanical+Garden+Japan","booking":"","website":""},{"id":"p_b2758cc42835","name":"Kobe Harborland","city":"מסביב לאוסקה","area":"Kobe — אופציונלי","status":"רוצה","kind":"attraction","desc":"אזור נמל מודרני עם קניות, טיילת ואורות בלילה.","duration":"1–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kobe+Harborland+Japan","booking":"","website":""},{"id":"p_7034ba072e1c","name":"Meriken Park","city":"מסביב לאוסקה","area":"Kobe — אופציונלי","status":"רוצה","kind":"attraction","desc":"פארק נמל עם Kobe Port Tower ונוף למים.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Meriken+Park+Japan","booking":"","website":""},{"id":"p_86ad1e064c0e","name":"Kobe Nunobiki Herb Gardens","city":"מסביב לאוסקה","area":"Kobe — אופציונלי","status":"רוצה","kind":"attraction","desc":"גן עשבי תיבול גדול על ההר עם רכבל ונוף לעיר.","duration":"2–3 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kobe+Nunobiki+Herb+Gardens+Japan","booking":"","website":""},{"id":"p_a635db053fed","name":"Kobe Chinatown / Nankinmachi","city":"מסביב לאוסקה","area":"Kobe — אופציונלי","status":"רוצה","kind":"attraction","desc":"צ'יינהטאון קומפקטי עם אוכל רחוב ורחובות צבעוניים.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kobe+Chinatown+%2F+Nankinmachi+Japan","booking":"","website":""},{"id":"p_b3a611b481d6","name":"Himeji Castle","city":"מסביב לאוסקה","area":"Himeji — אופציונלי","status":"רוצה","kind":"attraction","desc":"אחת הטירות המקוריות והמרשימות ביפן.","duration":"2–3 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Himeji+Castle+Japan","booking":"","website":""},{"id":"p_633fbac336c0","name":"Koko-en Garden","city":"מסביב לאוסקה","area":"Himeji — אופציונלי","status":"רוצה","kind":"attraction","desc":"גן יפני יפה ממש ליד Himeji Castle.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Koko-en+Garden+Japan","booking":"","website":""},{"id":"p_9c3132dd3fcc","name":"Ueno Park","city":"טוקיו","area":"Ueno + Ameyoko","status":"רוצה","kind":"attraction","desc":"פארק עירוני גדול שמרכז סביבו מוזיאונים, מקדשים ושבילים. בתקופת סתיו מתאים להליכה רגועה בין עצים ומוזיאונים.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Ueno+Park+Japan","booking":"","website":"","info":"מה זה\nUeno Park הוא אחד המרכזים התרבותיים החשובים בטוקיו. האזור היה קשור בעבר למקדש Kan'ei-ji, ולאחר Meiji הפך לאחד הפארקים הציבוריים הראשונים ביפן.\n\nלמה זה חשוב\nהיום הפארק מרכז סביבו מוזיאונים לאומיים, גן חיות, מקדשים, אגם ושטחים ציבוריים. לכן הוא פחות \"פארק\" במובן הרגיל ויותר רובע תרבות פתוח.\n\nמה לשים לב\nאצלנו הוא משמש כרקמת החיבור בין Tokyo National Museum, National Museum of Nature and Science ו-Ameyoko. כדאי לשים לב למעבר השקט יחסית מהפארק אל השוק הצפוף בהמשך."},{"id":"p_3ff2cc2c2491","name":"Ameyoko Market","city":"טוקיו","area":"Ueno + Ameyoko","status":"רוצה","kind":"attraction","desc":"שוק רחוב צבעוני עם אוכל, מתוקים, ביגוד וחנויות. מתאים לשילוב עם Ueno ו-Akihabara.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Ameyoko+Market+Japan","booking":"","website":"","info":"מה זה\nAmeyoko הוא שוק רחוב צפוף בין Ueno ל-Okachimachi. הוא מזוהה עם התקופה שלאחר מלחמת העולם השנייה, אז נוצרו באזור דוכנים ושווקים שחורים למזון ולמוצרים שקשה היה להשיג.\n\nלמה זה חשוב\nהשם מקושר לעיתים גם ל-\"ame\" כממתקים וגם ל-\"America\" בשל מוצרים אמריקאיים שהגיעו לשוק. כיום זה מקום כאוטי ותוסס של אוכל, בגדים, דגים, תבלינים ומציאות.\n\nמה לשים לב\nהחוויה היא הקצב: קריאות מוכרים, שלטים צפופים ורחובות צרים. זה סיום מצוין ליום Ueno כי הוא מנוגד כמעט לחלוטין לשקט ולסדר של המוזיאונים."},{"id":"p_059773fe3b18","name":"National Museum of Nature and Science","city":"טוקיו","area":"Ueno + Ameyoko","status":"רוצה","kind":"attraction","desc":"מוזיאון טבע ומדע גדול עם דינוזאורים, חלל, מדע וטכנולוגיה.","duration":"1.5–2.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=National+Museum+of+Nature+and+Science+Japan","booking":"","website":"","info":"מה זה\nהמוזיאון הלאומי לטבע ומדע באואנו הוא אחד ממוסדות המדע המרכזיים של יפן. שורשיו במוסד מוזיאלי שהחל ב-1870s, והבניין ההיסטורי של Japan Gallery נפתח ב-1931.\n\nלמה זה חשוב\nהמוזיאון מספר שני סיפורים במקביל: הטבע והאבולוציה בעולם, וההתפתחות המדעית והסביבתית של יפן. הוא משלב specimens, שלדים, טכנולוגיה, גאולוגיה, ביולוגיה והיסטוריה של המדע.\n\nמה לשים לב\nמכיוון שיש לנו זמן מוגבל, אין טעם לנסות לראות הכול. עדיף לבחור כמה galleries שמעניינות אתכם במיוחד ולראות את Japan Gallery כמוקד."},{"id":"p_f6d904a563a7","name":"Tokyo National Museum","city":"טוקיו","area":"Ueno + Ameyoko","status":"רוצה","kind":"attraction","desc":"המוזיאון המרכזי לאמנות והיסטוריה יפנית, בתוך Ueno Park.","duration":"1.5–2.5 ש׳","note":"שובץ ביום Ueno לצד National Museum of Nature and Science.","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+National+Museum+Japan","booking":"","website":"https://www.tnm.jp/?lang=en","info":"מה זה\nTokyo National Museum נוסד ב-1872 והוא המוזיאון הוותיק ביותר מסוגו ביפן. הוא מחזיק באוסף עצום של אמנות, ארכאולוגיה וחפצי תרבות מיפן וממזרח אסיה.\n\nלמה זה חשוב\nאחרי ביקור במקדשים, גנים ורבעים היסטוריים, כאן אפשר לראות את החפצים עצמם: פסלים בודהיסטיים, קרמיקה, קליגרפיה, שריון, חרבות, טקסטיל וציור. האוסף כולל מספר גדול של National Treasures ו-Important Cultural Properties.\n\nמה לשים לב\nבזמן המוגבל שלנו התמקדו ב-Honkan לאמנות יפנית וב-Heiseikan לארכאולוגיה. המוצגים מתחלפים לעיתים קרובות לצורכי שימור, לכן אין \"רשימת חובה\" קבועה."},{"id":"p_20e5debe1afa","name":"Imperial Palace East Gardens","city":"טוקיו","area":"Imperial Palace + Tokyo Station","status":"רוצה","kind":"attraction","desc":"הגנים המזרחיים של הארמון הקיסרי בטוקיו, עם שרידי חומות, גנים ושבילים בלב העיר.","duration":"60–90 דק׳","note":"שובץ ליום Akihabara כדי לא להעמיס על Ginza ולשמור קרבה יחסית למרכז.","maps":"https://www.google.com/maps/search/?api=1&query=Imperial+Palace+East+Gardens+Japan","booking":"","website":"https://www.kunaicho.go.jp/e-event/higashigyoen02.html","info":"מה זה\nהגנים המזרחיים של הארמון הקיסרי יושבים על החלקים המרכזיים של Edo Castle — Honmaru, Ninomaru ו-Sannomaru — ונפתחו לציבור ב-1968.\n\nלמה זה חשוב\nלפני שטוקיו הייתה עיר מודרנית היא הייתה Edo, בירת השוגונות של Tokugawa. כאן היה המרכז הפוליטי של אותה מערכת. היום אין עוד טירה שלמה, אבל החומות, השערים, בסיס ה-tenshu והטופוגרפיה מאפשרים לדמיין את קנה המידה שלה.\n\nמה לשים לב\nחפשו את Tenshudai, שרידי בתי השמירה, חומות האבן ו-Ninomaru Garden. זה מקום שבו דווקא \"מה שלא נשאר\" חשוב להבנת ההיסטוריה. יש בדיקת תיקים בכניסה."},{"id":"p_c1a69e0a9701","name":"Marunouchi","city":"טוקיו","area":"Imperial Palace + Tokyo Station","status":"אולי","kind":"attraction","desc":"האזור האלגנטי בין הארמון לתחנת Tokyo, עם אדריכלות, קניות ובתי קפה.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Marunouchi+Japan","booking":"","website":"","info":"מה זה\nMarunouchi הוא רובע העסקים שבין Tokyo Station לארמון הקיסרי. שמו מתייחס היסטורית לאזור \"בתוך החפיר\" של Edo Castle.\n\nלמה זה חשוב\nבסוף המאה ה-19 ותחילת ה-20 האזור התפתח למרכז עסקים מודרני, ובמידה רבה מייצג את המעבר של טוקיו מבירת shogun לבירת מדינה תעשייתית. כיום גורדי שחקים, בנקים וחברות גדולות מקיפים את בניין Tokyo Station ההיסטורי.\n\nמה לשים לב\nזו הליכת רחוב ולא יעד בודד. הרחבה מול התחנה, השדרות הרחבות והקשר הישיר לארמון יוצרים אחד המקומות שבהם אפשר לקרוא את ההיסטוריה העירונית של טוקיו במרחב."},{"id":"p_f4384d076558","name":"Daikanyama T-Site","city":"טוקיו","area":"Daikanyama + Nakameguro + Shimokitazawa","status":"אולי","kind":"attraction","desc":"מתחם מעוצב של ספרים, אמנות, עיצוב ובתי קפה בשכונת Daikanyama.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Daikanyama+T-Site+Japan","booking":"","website":""},{"id":"p_e7b9e8b2a661","name":"Nakameguro + Meguro River","city":"טוקיו","area":"Daikanyama + Nakameguro + Shimokitazawa","status":"אולי","kind":"attraction","desc":"שכונה נעימה עם בוטיקים, בתי קפה והליכה לאורך נהר Meguro.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Nakameguro+%2B+Meguro+River+Japan","booking":"","website":"","info":"מה זה\nMeguro River מתפתל כמעט שמונה קילומטרים דרך דרום טוקיו. באזור Nakameguro הוא מוקף שבילי הליכה, עצים, בתי קפה, גלריות וחנויות קטנות.\n\nלמה זה חשוב\nהאזור מציג גרסה רגועה ומקומית יותר של טוקיו, דקות נסיעה משיבויה. הוא מפורסם מאוד בעונת הסאקורה, אבל גם מחוץ לעונה הנהר יוצר ציר הליכה שמאט את הקצב העירוני.\n\nמה לשים לב\nאל תחפשו \"אטרקציה אחת\". החוויה היא הליכה לאורך המים והסטייה לסמטאות. בנובמבר/דצמבר זה יהיה הרבה יותר רגוע מאשר בתקופת פריחת הדובדבן."},{"id":"p_d4046a4ceaec","name":"Starbucks Reserve Roastery Tokyo","city":"טוקיו","area":"Daikanyama + Nakameguro + Shimokitazawa","status":"אולי","kind":"food","desc":"סניף הדגל המרשים של Starbucks לאורך Meguro River, בעיצוב Kengo Kuma.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Starbucks+Reserve+Roastery+Tokyo+Japan","booking":"","website":""},{"id":"p_95e762595bff","name":"Shimokitazawa","city":"טוקיו","area":"Daikanyama + Nakameguro + Shimokitazawa","status":"אולי","kind":"attraction","desc":"שכונת היפסטרים עם וינטג׳, תקליטים, בתי קפה וחנויות קטנות.","duration":"1.5–2.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Shimokitazawa+Japan","booking":"","website":"","info":"מה זה\nShimokitazawa, או Shimokita, הוא רובע קטן ובוהמייני מערבית לשיבויה, הידוע בחנויות יד שנייה, תקליטים, תיאטראות קטנים, בתי קפה ומועדוני הופעות.\n\nלמה זה חשוב\nבניגוד להרג'וקו ושיבויה שמזוהים עם טרנדים בקנה מידה גדול, Shimokitazawa בנויה על סצנה עצמאית יותר: מוזיקה חיה, vintage, קולנוע קטן ועסקים מקומיים.\n\nמה לשים לב\nזה אזור של אחר צהריים וערב — הרבה מקומות נפתחים מאוחר יחסית. כדאי להסתובב בלי יעד קשיח ולתת לסמטאות ולמוזיקה להוביל."},{"id":"p_33e228bf3c4f","name":"Osaka Castle","city":"אוסקה","area":"Osaka Castle + Tenjinbashi","status":"רוצה","kind":"attraction","desc":"הטירה המרכזית של אוסקה והפארק שמסביבה. מתאימה לחצי יום של היסטוריה, גנים ותצפית.","duration":"1.5–2.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Osaka+Castle+Japan","booking":"","website":""},{"id":"p_db8ec5eeb85a","name":"Osaka Castle Park","city":"אוסקה","area":"Osaka Castle + Tenjinbashi","status":"רוצה","kind":"attraction","desc":"פארק רחב סביב הטירה עם שבילים, עצים ונקודות צילום.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Osaka+Castle+Park+Japan","booking":"","website":""},{"id":"p_05aa276494c5","name":"Tenjinbashi-suji Shopping Street","city":"אוסקה","area":"Osaka Castle + Tenjinbashi","status":"רוצה","kind":"attraction","desc":"אחד מרחובות הקניות המקורים הארוכים ביפן, עם אוכל, חנויות מקומיות ואווירה אוסקאית יומיומית.","duration":"1.5–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tenjinbashi-suji+Shopping+Street+Japan","booking":"","website":""},{"id":"p_bookoff_super_bazaar_omori","name":"BOOKOFF SUPER BAZAAR SEIYU Omori Store","city":"טוקיו","area":"Omori / Shinagawa","status":"רוצה","kind":"attraction","desc":"סניף BOOKOFF SUPER BAZAAR גדול בטוקיו עם ספרים, CD/DVD/Blu-ray, טלפונים, אלקטרוניקה, מוצרי חשמל, כלי נגינה, אופנה, כרטיסי אספנות, צעצועים, מותגים וכלי בית.","duration":"1.5–2 שעות","note":"לא באקיהברה — מתאים כעצירה נפרדת אם רוצים חוויית BOOKOFF SUPER BAZAAR גדולה.","maps":"https://www.google.com/maps/search/?api=1&query=BOOKOFF+SUPER+BAZAAR+SEIYU+Omori+Store+Tokyo+Japan","booking":"","website":""},{"id":"p_pokemon_center_tokyo_dx","name":"Pokémon Center TOKYO DX","city":"טוקיו","area":"Nihonbashi + Tokyo Station","status":"חובה","kind":"attraction","desc":"Pokémon Center גדול בניהונבאשי, עם מרצ'נדייז רחב, מוצרים בלעדיים ואזור Pokémon Café הסמוך. מתאים לשילוב עם Tokyo Station / Nihonbashi ביום מרכז טוקיו.","duration":"60–90 דק׳","note":"אפשר לשלב עם Pokémon Café אם משיגים הזמנה.","maps":"https://www.google.com/maps/search/?api=1&query=Pokemon+Center+TOKYO+DX+Nihonbashi+Tokyo+Japan","booking":"","website":""},{"name":"GINZA SIX + Rooftop Garden","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"מתחם עיצוב, אמנות וקמעונאות בלב גינזה. הדגש אצלנו הוא על האדריכלות, האמנות הציבורית וגינת הגג הגדולה — לא על עוד סבב קניות.","duration":"45–60 דק׳","note":"משתלב טבעית ביום Ginza. גינת הגג היא החלק החשוב.","maps":"https://www.google.com/maps/search/?api=1&query=GINZA+SIX+Tokyo","booking":"","website":"https://ginza6.tokyo/","id":"p_98d0feba9731","info":"מה זה\nGINZA SIX הוא מתחם עכשווי שמציג היטב את הצד המודרני של גינזה: אדריכלות, אמנות ציבורית, עיצוב וחללי מסחר. אצלנו המיקוד אינו קניות אלא התרבות והבניין.\n\nלמה זה חשוב\nGinza היא אזור שבו מסחר, עיצוב ואמנות התערבבו במשך יותר ממאה שנה. GINZA SIX ממשיך את המסורת הזו בקנה מידה עכשווי: אמנות באטריום, GINZA TSUTAYA BOOKS וגינת גג רחבה.\n\nמה לשים לב\nעלו לגינת הגג והביטו החוצה מעל אחד האזורים הצפופים והיקרים בעיר. זה רגע שממחיש איך טוקיו מנסה להכניס טבע ומרחב ציבורי גם לתוך פיתוח מסחרי צפוף."},{"name":"Kabukiza Theatre","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"בית הקבוקי האייקוני של גינזה. במסלול שלנו זו עצירת אדריכלות ותרבות קצרה מבחוץ/בלובי, בלי לבנות את היום סביב הופעה מלאה.","duration":"20–30 דק׳","note":"קרוב מאוד ל-Ginza Mitsukoshi ול-GINZA SIX.","maps":"https://www.google.com/maps/search/?api=1&query=Kabukiza+Theatre+Ginza+Tokyo","booking":"","website":"https://www.kabukiweb.net/theatres/kabukiza/","id":"p_4b5605ad0dd4","info":"מה זה\nKabukiza הוא בית התיאטרון המרכזי של kabuki בטוקיו וניצב בגינזה מאז סוף המאה ה-19, למרות שהמבנה הוחלף ונבנה מחדש כמה פעמים.\n\nלמה זה חשוב\nKabuki הוא תיאטרון יפני שהתפתח בתקופת Edo ושילב משחק מסוגנן, תלבושות, מוזיקה, במה מורכבת ומסורת שחקנים העוברת במשפחות. החזית המסורתית של Kabukiza יושבת כיום בתוך מתחם מודרני מאוד — עוד דוגמה לשכבות של Ginza.\n\nמה לשים לב\nאצלנו לא מתוכננת הופעה מלאה. המטרה היא לראות את החזית, להבין מהו kabuki ולראות כיצד מסורת ביצועית בת מאות שנים ממשיכה לפעול בלב טוקיו."},{"name":"Ginza Mitsukoshi Depachika","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"קומת האוכל התת-קרקעית של Ginza Mitsukoshi — דוגמה מצוינת לתרבות ה-depachika היפנית. אצלנו זו עצירת התרשמות/נשנוש, לא ארוחה עיקרית.","duration":"30–40 דק׳","note":"Art Aquarium נמצא באותו מתחם, ולכן חיברנו אותם ברצף.","maps":"https://www.google.com/maps/search/?api=1&query=Ginza+Mitsukoshi+Tokyo","booking":"","website":"https://cp.mistore.jp/global/en/ginza.html","id":"p_c2afc1121926","info":"ה-Depachika של Ginza Mitsukoshi הוא עולם אוכל שלם בקומות המרתף של כלבו יפני קלאסי. אפשר לראות שם קונדיטוריה, wagashi, מנות מוכנות, חומרי גלם ומתנות אוכל ברמת תצוגה גבוהה מאוד. המטרה אצלנו היא להכיר את תרבות בתי הכלבו היפנית ולעשות סיבוב קצר לפני Art Aquarium שנמצא באותו מתחם."},{"name":"Tsukiji Outer Market","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"שוק האוכל החיצוני ההיסטורי של צוקיג׳י. השוק הסיטונאי עבר ל-Toyosu, אבל החנויות, הדוכנים והמסעדות של ה-Outer Market ממשיכים לפעול.","duration":"60–75 דק׳","note":"נכנס לבוקר של יום Ginza/Hamarikyu. לצמחוני: לבדוק היטב dashi/fish stock גם במנות שנראות צמחוניות.","maps":"https://www.google.com/maps/search/?api=1&query=Tsukiji+Outer+Market+Tokyo","booking":"","website":"https://www.tsukiji.or.jp/english/","id":"p_6b3bdf9de12d","info":"מה זה\nTsukiji Outer Market הוא האזור המסחרי שנשאר פעיל לאחר שהשוק הסיטונאי הראשי עבר ל-Toyosu ב-2018. עדיין פועלות בו חנויות מתמחות, מסעדות, דוכנים וספקי חומרי גלם.\n\nלמה זה חשוב\nTsukiji הוא שריד חי לכלכלה העירונית שנבנתה סביב אוכל, ים וספקים מקצועיים. בעוד Toyosu מייצג לוגיסטיקה מודרנית וסטרילית, Tsukiji מרגיש צפוף, אנושי ורחובי.\n\nמה לשים לב\nבואו בבוקר. שימו לב לסכינים, תה, אצות, tamagoyaki, wagashi וחומרי גלם — לא רק לסושי. לצמחוני: מנות שנראות ללא בשר עדיין עלולות להכיל dashi מדגים, ולכן צריך לשאול במפורש."}]}</script>

async function fetchJsonTimeout(url, ms){
  const ctl=new AbortController();
  const t=setTimeout(()=>ctl.abort(), ms||6500);
  try{
    const r=await fetch(url,{signal:ctl.signal,cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

function normEntity(s){
  return String(s||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}
function imageQueryName(name){
  if(IMAGE_ALIASES[name]) return IMAGE_ALIASES[name];
  /* Composite itinerary labels are not safe to guess. If there is no explicit alias, use the full card name. */
  return String(name||'').trim();
}
function entityAccepts(query, row){
  const q=normEntity(query);
  const label=normEntity(row&&row.label);
  if(!q || !label) return false;
  /* Correct-only policy: exact entity label or very close containment. */
  if(label===q) return true;
  if(q.length>=10 && (label.includes(q) || q.includes(label))){
    const shorter=Math.min(q.length,label.length), longer=Math.max(q.length,label.length);
    return shorter/longer>=0.78;
  }
  return false;
}

    if(!filename) return null;
    return {
      image:'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(filename)+'?width=1000',
      entityId:hit.id,
      entityLabel:hit.label||query
    };
  }catch(e){ return null; }
}
async function resolveMedia(name){
  const key=String(name||'').trim();
  if(!key) return {};
  const cached=live.media[key];
  if(cached && cached.mediaVersion===67){
    if(cached.youtube || cached.image) return cached;
    if(cached.failedAt && Date.now()-cached.failedAt<MEDIA_FAIL_TTL) return cached;
  }
  const [ytR,imgR]=await Promise.allSettled([youtubeSecondResult(key), strictWikidataImage(key)]);
  const yt=ytR.status==='fulfilled'?ytR.value:null;
  const img=imgR.status==='fulfilled'?imgR.value:null;
  const result={
    mediaVersion:67,
    youtube:yt&&yt.youtube?yt.youtube:'',
    youtubeTitle:yt&&yt.youtubeTitle?yt.youtubeTitle:'',
    videoId:yt&&yt.videoId?yt.videoId:'',
    image:img&&img.image?img.image:'',
    imageEntity:img&&img.entityLabel?img.entityLabel:'',
    imageEntityId:img&&img.entityId?img.entityId:'',
    failedAt:(!(yt&&yt.youtube) && !(img&&img.image))?Date.now():0
  };
  live.media[key]=result;
  saveMediaSoon();
  return result;
}
function paintMedia(el, m){
  if(!el || !el.isConnected) return;
  const name=el.dataset.mediaName||'';
  const imageWrap=el.querySelector('.media-image-wrap');
  if(imageWrap){
    if(m&&m.image){
      imageWrap.classList.add('on');
      imageWrap.innerHTML='<img class="media-image" loading="lazy" referrerpolicy="no-referrer" alt="'+esc(name)+'" src="'+esc(m.image)+'">'
        +'<div class="media-image-note">תמונה מזוהה לפי הישות המדויקת: '+esc(m.imageEntity||name)+'</div>';
    }else{
      imageWrap.classList.remove('on');
      imageWrap.innerHTML='';
    }
  }
  const y=el.querySelector('[data-media-youtube]');
  if(y){
    if(m&&m.youtube){
      y.dataset.href=m.youtube;
      y.textContent='▶ YouTube · תוצאה #2';
    }else{
      /* הכפתור לעולם לא נעלם: במקרה שה-API חסום הוא פותח את החיפוש. */
      y.dataset.href=ytSearchUrl(name);
      y.textContent='▶ YouTube · חיפוש';
    }
  }
  const s=el.querySelector('.media-status');
  if(s){
    s.textContent=(m&&m.image)?'תמונה מדויקת':'אין תמונה מאומתת';
  }
  el.dataset.mediaState='done';
}
async function loadMediaEl(el){
  if(!el || el.dataset.mediaState==='loading' || el.dataset.mediaState==='done') return;
  el.dataset.mediaState='loading';
  const m=await resolveMedia(el.dataset.mediaName||'');
  paintMedia(el,m);
}
function hydrateMedia(){
  if(mediaObserver){ try{mediaObserver.disconnect();}catch(e){} }
  const els=[...document.querySelectorAll('[data-media-name]')];
  els.forEach(el=>{
    const c=live.media[el.dataset.mediaName||''];
    if(c && c.mediaVersion===67 && (c.youtube||c.image||c.failedAt)) paintMedia(el,c);
  });
  const pending=els.filter(el=>el.dataset.mediaState!=='done');
  if(!pending.length) return;
  if('IntersectionObserver' in window){
    mediaObserver=new IntersectionObserver(entries=>{
      entries.forEach(en=>{
        if(en.isIntersecting){
          mediaObserver.unobserve(en.target);
          loadMediaEl(en.target);
        }
      });
    },{rootMargin:'260px 0px'});
    pending.forEach(el=>mediaObserver.observe(el));
  }else{
    pending.slice(0,12).forEach(loadMediaEl);
  }
}
function openMediaYoutube(target){
  const y=target&&target.closest?target.closest('[data-media-youtube]'):null;
  if(!y || !y.dataset.href) return false;
  window.open(y.dataset.href,'_blank','noopener');
  return true;
}

function fmt(min){ if(min==null) return ''; min=((min%(24*60))+(24*60))%(24*60); return pad(Math.floor(min/60))+':'+pad(min%60); }

function todayId(){

function shown(day, index){
  const base=day.items[index];
  const repl=live.replace[base.uid];
  const it=repl? Object.assign({}, base, repl) : base;
  if(it.start==null) return it;
  let extra = live.done[it.uid] ? 0 : (live.delay[day.id]||0);
  for(let i=0;i<index;i++) extra += live.cascade[day.items[i].uid]||0;
  const own = live.cascade[it.uid]||0;
  const start=it.start+extra, end=(it.end==null?it.start:it.end)+extra+own;
  return Object.assign({}, it, {time: fmt(start)+'–'+fmt(end), start, end});
}
function visibleItems(day){
  return day.items.map((it,i)=>({it:shown(day,i), i})).filter(x=>!live.skipped[x.it.uid]);
}
function currentIndex(day){
  const rows=visibleItems(day);
  const hit=rows.find(x=>!live.done[x.it.uid]);
  return hit? hit.i : -1;
}

  const cur=currentIndex(day);
  const current=cur<0? null : shown(day, cur);
  const doneCount=rows.filter(x=>live.done[x.it.uid]).length;
  if(!current){
    html+='<section class="now"><div class="label">היום הסתיים</div><h2>אפשר לחזור</h2><p class="desc">כל מה שבלוח סומן. אם נשאר כוח, הלילה למטה.</p></section>';
  } else {
    const next=rows.find(x=>x.i>cur && !live.done[x.it.uid]);
    html+='<section class="now"><div class="label">עכשיו · נותרו '+(rows.length-doneCount)+'</div>';
    if(current.time) html+='<div class="time">'+esc(current.time)+'</div>';
    html+='<button class="info-btn info-current" data-info-current="'+esc(current.uid)+'" type="button" aria-label="מידע על '+esc(current.name)+'">i</button>';
    html+='<h2>'+esc(current.name)+'</h2>'+mediaBlock(current.name,'hero')+'<p class="desc">'+esc(current.desc||'')+'</p>';
    if(live.notes[current.uid]) html+='<div class="next">הערה: '+esc(live.notes[current.uid])+'</div>';
    if(isFood(current)) html+='<div class="warn">לצמחוני: בלי בשר, דגים, פירות ים ו־dashi.</div>';
    if((live.delay[day.id]||0)>0) html+='<div class="warn">השעות שנותרו הוזזו ב־'+(live.delay[day.id])+' דקות.</div>';
    if(next) html+='<div class="next">הלאה: '+esc(next.it.name)+(current.hop?' · '+esc(current.hop):'')+'</div>';
    html+='<div class="actions">';
    if(current.maps) html+='<a class="btn primary" target="_blank" rel="noopener" href="'+esc(current.maps)+'">Google Maps</a>';
    html+='<button class="btn ghost" id="done" type="button">סיימתי</button></div>';
    if(current.start!=null) html+='<button class="late" id="late" type="button">אחרנו 15 דקות</button>';
    html+='</section>';
  }
  const completedRows=rows.filter(row=>live.done[row.it.uid]);
  if(completedRows.length){
    html+='<div class="block">הושלמו</div>';
    completedRows.forEach(row=>{
      html+='<div class="row-shell"><button class="row done-row" data-undone="'+esc(row.it.uid)+'" type="button">'
        +'<span class="t">'+(row.it.time?esc(row.it.time):'✓')+'</span>'
        +'<span class="n"><span class="done-check">✓</span>'+esc(row.it.name)+'</span>'
        +'<span class="done-hint">סגור · לחץ להחזיר למסלול</span>'
        +'</button><button class="info-btn" data-info-item="'+esc(row.it.uid)+'" type="button" aria-label="מידע על '+esc(row.it.name)+'">i</button></div>';
    });
  }
  let part='';
  rows.forEach(row=>{
    if(live.done[row.it.uid] || row.i===cur) return;
    if(row.it.part && row.it.part!==part){ part=row.it.part; html+='<div class="block">'+esc(part)+'</div>'; }
    html+='<div class="row-shell"><button class="row'+(row.it.transit?' transit':'')+'" data-open="'+esc(row.it.uid)+'" type="button"><span class="t">'+(row.it.time?esc(row.it.time):'הבא')+'</span><span class="n">'+esc(row.it.name)+'</span></button><button class="info-btn" data-info-item="'+esc(row.it.uid)+'" type="button" aria-label="מידע על '+esc(row.it.name)+'">i</button></div>';
    if(row.it.hop) html+='<div class="hop">↓ '+esc(row.it.hop)+'</div>';
  });
  const skipped=day.items.filter(it=>live.skipped[it.uid]);
  if(skipped.length) html+='<button class="fold" id="show-skip" type="button">דולגו · '+skipped.length+'</button><div id="skip-list" class="hidden"></div>';
  if(day.night.length){
    html+='<div class="block">אם נשאר כוח</div><div class="night"><p>לא חלק מהלוח. בוחרים לפי אנרגיה.</p>';
    day.night.forEach(n=>{ html+= n.maps? '<a class="chip" target="_blank" rel="noopener" href="'+esc(n.maps)+'">'+esc(n.name)+'</a>' : '<span class="chip">'+esc(n.name)+'</span>'; });
    html+='</div>';
  }
  return html;
}

function restaurantYoutubeUrl(r){
  return 'https://www.youtube.com/results?search_query='+encodeURIComponent(r.name+' Japan restaurant');
}
function restaurantPhotosUrl(r){
  return 'https://www.google.com/search?tbm=isch&q='+encodeURIComponent(r.name+' '+r.city+' restaurant');
}
function restaurantCityGroup(r){
  if(r.city==='טוקיו') return 'טוקיו';
  if(r.city==='קיוטו') return 'קיוטו';
  if(r.city==='אוסקה') return 'אוסקה';
  if(r.area==='Nara' || r.city==='נארה' || r.city==='מסביב לאוסקה') return 'נארה';
  return r.city||'אחר';
}
function filteredRestaurants(){
  const q=(restaurantQuery||'').trim().toLowerCase();
  return RESTAURANTS.filter(r=>{
    if(restaurantCityFilter!=='הכל' && restaurantCityGroup(r)!==restaurantCityFilter) return false;
    if(restaurantFilter!=='הכל' && r.dietKey!==restaurantFilter) return false;
    if(q && (r.name+' '+r.city+' '+r.area+' '+(r.kind||'')+' '+r.dietLabel+' '+r.dietDetail+' '+r.desc+' '+restaurantCityGroup(r)).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}
function restaurantBadgeClass(key){
  if(key==='vegan') return 'diet-vegan';
  if(key==='vegetarian') return 'diet-vegetarian';
  if(key==='vegan-options') return 'diet-vegan-options';
  if(key==='veg-friendly') return 'diet-veg-friendly';
  return 'diet-unknown';
}

    html+='<p class="restaurant-desc">'+esc(r.desc||'')+'</p>';

    html+='<div class="restaurant-address">'+esc(r.address||'')+'</div>';

function placeCards(rows){
  let html=rows.slice(0,80).map(p=>'<div class="place-card-shell"><button class="card" data-place="'+esc(p.id)+'" type="button" style="width:100%;text-align:right"><b>'+esc(p.name)+'</b><div class="meta">'+esc(p.city)+' · '+esc(p.area)+' · '+esc(planStatus(p))+'</div>'+mediaBlock(p.name,'compact')+'</button><button class="info-btn" data-info-place="'+esc(p.id)+'" type="button" aria-label="מידע על '+esc(p.name)+'">i</button></div>').join('');

function filteredPlaces(){
  return TRIP.places.filter(p=>{
    if(placeFilter==='מלונות') return p.kind==='hotel';
    if(placeFilter==='אוכל') return p.kind==='food';
    if(placeFilter!=='הכל' && p.city!==placeFilter) return false;
    if(isDesk() && placeFilter==='הכל' && tab!=='places'){
      const day=activeDay();
      if(day && day.scope.indexOf(p.city)<0) return false;
    }
    if(query && (p.name+' '+p.area+' '+p.desc).toLowerCase().indexOf(query.toLowerCase())<0) return false;
    return planStatus(p)!=='לא';
  });
}

function renderSheet(){
  if(sheet.mode==='item'){
    const day=activeDay();
    const index=day.items.findIndex(i=>i.uid===sheet.uid);
    const it=shown(day, index);
    let html='<div class="sheet-back" data-close="1"><div class="sheet"><div class="handle"></div>';
    html+='<div class="label">'+esc(it.part||'')+'</div>';
    if(it.time) html+='<div class="time">'+esc(it.time)+'</div>';
    html+='<h2>'+esc(it.name)+'</h2>'+mediaBlock(it.name,'hero')+infoSummaryHtml(it.name,it.desc||'',it.info||'');
    if(isFood(it)) html+='<div class="warn">לצמחוני: בלי בשר, דגים, פירות ים ו־dashi.</div>';
    html+='<p class="sub">הערה</p><textarea id="note">'+esc(live.notes[it.uid]||'')+'</textarea>';
    html+='<div class="menu">';
    if(it.maps) html+='<a target="_blank" rel="noopener" href="'+esc(it.maps)+'">Google Maps</a>';
    if(it.website) html+='<a target="_blank" rel="noopener" href="'+esc(it.website)+'">אתר</a>';
    if(it.start!=null) html+='<button type="button" id="longer">עוד 15 דק׳</button><button type="button" id="shorter">פחות 15 דק׳</button>';
    html+='<button type="button" id="swap">החלף</button><button type="button" id="skip">דלג</button><button type="button" data-close="1">סגור</button>';
    html+='</div></div></div>';
    return html;
  }
  if(sheet.mode==='swap'){
    const day=activeDay();
    const list=swapMatches();
    let html='<div class="sheet-back" data-close="1"><div class="sheet"><div class="handle"></div><h2>החלפה ב'+esc(day.scope.join(' / '))+'</h2>';
    html+='<input class="search" id="swap-q" placeholder="חיפוש" value="'+esc(sheet.q||'')+'">';
    html+='<div id="swap-list">'+swapCards(list)+'</div>';
    html+='</div></div>';
    return html;
  }
  if(sheet.mode==='place'){
    const p=TRIP.places.find(x=>x.id===sheet.id);
    let html='<div class="sheet-back" data-close="1"><div class="sheet"><div class="handle"></div><h2>'+esc(p.name)+'</h2>'+mediaBlock(p.name,'hero')+infoSummaryHtml(p.name,p.desc||'',p.info||'');
    if(p.note) html+='<div class="warn">'+esc(p.note)+'</div>';
    if(appMode==='plan') html+='<div class="block">סטטוס תכנון</div>'+planStatusButtons(p);
    html+='<div class="menu">';
    if(p.maps) html+='<a target="_blank" rel="noopener" href="'+esc(p.maps)+'">Google Maps</a>';
    if(p.website) html+='<a target="_blank" rel="noopener" href="'+esc(p.website)+'">אתר</a>';
    if(p.booking) html+='<a target="_blank" rel="noopener" href="'+esc(p.booking)+'">Booking</a>';
    html+='</div></div></div>';
    return html;
  }
  return '';
}
function swapCards(list){
  return list.map(p=>'<button class="opt" data-pick="'+esc(p.id)+'" type="button"><b>'+esc(p.name)+'</b><div class="meta">'+esc(p.area)+' · '+esc(p.status)+'</div>'+mediaBlock(p.name,'compact')+'</button>').join('');
}
function swapMatches(){
  const day=activeDay();
  const q=(sheet.q||'').trim().toLowerCase();
  return TRIP.places.filter(p=>day.scope.indexOf(p.city)>=0 && planStatus(p)!=='לא' && p.kind!=='hotel' && (!q || (p.name+' '+p.area).toLowerCase().indexOf(q)>=0)).slice(0,30);
}
function markDone(){
  const day=activeDay();
  const i=currentIndex(day);
  if(i<0) return;
  const uid=day.items[i].uid;
  const prev=!!live.done[uid];
  live.done[uid]=true;
  sheet=null; // סוגר כל כרטיס/חלון פתוח
  persist();
  render();   // התחנה שסיימנו הופכת מיד לכרטיס סגור וירוק
  toast('✓ הושלם', ()=>{ live.done[uid]=prev; persist(); render(); document.getElementById('toast').classList.add('hidden'); });
}
function savedHtml(){
  const snap={snapshotId:'snap-'+Date.now().toString(36), savedAt:new Date().toISOString(), version:'v77', live:live};
  const close='</'+'script>';
  let html=document.documentElement.outerHTML;
  if(!html.startsWith('<!DOCTYPE')) html='<!DOCTYPE html>\n'+html;
  html=html.replace(/<div class="app" id="app">[\s\S]*?<!-- \/app -->/,'<div class="app" id="app"></div>\n<!-- /app -->');
  html=html.replace(/<div id="sheet">[\s\S]*?<\/div>\s*<div id="toast"/,'<div id="sheet"></div>\n<div id="toast"');
  const json=JSON.stringify(snap).replace(/</g,'\\u003c');
  html=html.replace(new RegExp('<script id="japan26-full-snapshot" type="application/json">[\\s\\S]*?'+close), '<script id="japan26-full-snapshot" type="application/json">'+json+close);
  return html;
}
async function saveFull(){
  const html=savedHtml();
  const file=new File([html], 'japan_2026_trip_dashboard_v77.html', {type:'text/html'});
  if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:'יפן 2026'});
      toast('נשמר. פותחים את הקובץ החדש מ־Safari');
      return;
    }catch(e){
      if(e && e.name==='AbortError') return;
    }
  }
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='japan_2026_trip_dashboard_v77.html';
  document.body.appendChild(a); a.click(); a.remove();
  toast('אם הקובץ לא נשמר: כפתור השיתוף של Safari, ואז שמור לקבצים');
}

document.querySelector('.modebar').onclick=e=>{
  const b=e.target.closest('[data-mode]');
  if(!b) return;
  appMode=b.dataset.mode==='plan'?'plan':'execute';
  live.appMode=appMode;
  sheet=null; persist(); render();
};
document.querySelector('.nav').onclick=e=>{
  const b=e.target.closest('[data-tab]');
  if(!b) return;
  tab=b.dataset.tab; sheet=null; render();
};
document.getElementById('app').onclick=e=>{
  if(openMediaYoutube(e.target)){ e.preventDefault(); e.stopPropagation(); return; }
  const dayBtn=e.target.closest('[data-day]');
  if(dayBtn){ setDay(dayBtn.dataset.day); return; }
  const ptab=e.target.closest('[data-plan-tab]');
  if(ptab){ planTab=ptab.dataset.planTab; sheet=null; render(); return; }
  const pcity=e.target.closest('[data-plan-city]');
  if(pcity){ planCityFilter=pcity.dataset.planCity; planAreaFilter='הכל'; render(); return; }
  const pkind=e.target.closest('[data-plan-kind]');
  if(pkind){ planKindFilter=pkind.dataset.planKind; render(); return; }
  const psf=e.target.closest('[data-plan-status-filter]');
  if(psf){ planStatusFilter=psf.dataset.planStatusFilter; render(); return; }
  const pst=e.target.closest('[data-plan-id][data-plan-status]');
  if(pst){ setPlanStatus(pst.dataset.planId,pst.dataset.planStatus); render(); return; }
  if(e.target.closest('#done')) return markDone();
  if(e.target.closest('#late')){ const d=activeDay(); live.delay[d.id]=(live.delay[d.id]||0)+15; persist(); render(); return; }
  const infoCurrent=e.target.closest('[data-info-current]');
  if(infoCurrent){ sheet={mode:'item', uid:infoCurrent.dataset.infoCurrent}; render(); return; }
  const infoItem=e.target.closest('[data-info-item]');
  if(infoItem){ sheet={mode:'item', uid:infoItem.dataset.infoItem}; render(); return; }
  const infoPlace=e.target.closest('[data-info-place]');
  if(infoPlace){ sheet={mode:'place', id:infoPlace.dataset.infoPlace}; render(); return; }
  const open=e.target.closest('[data-open]');
  if(open){ sheet={mode:'item', uid:open.dataset.open}; render(); return; }
  const undone=e.target.closest('[data-undone]');
  if(undone){ delete live.done[undone.dataset.undone]; persist(); render(); return; }
  if(e.target.id==='show-skip'){
    const box=document.getElementById('skip-list');
    const day=activeDay();
    box.classList.toggle('hidden');
    box.innerHTML=day.items.filter(it=>live.skipped[it.uid]).map(it=>'<button class="row" data-unskip="'+esc(it.uid)+'" type="button"><span class="n">'+esc(it.name)+'</span></button>').join('');
    return;
  }
  const unskip=e.target.closest('[data-unskip]');
  if(unskip){ delete live.skipped[unskip.dataset.unskip]; persist(); render(); return; }
  const rc=e.target.closest('[data-rcity]');
  if(rc){ restaurantCityFilter=rc.dataset.rcity; render(); return; }
  const rf=e.target.closest('[data-rfilter]');
  if(rf){ restaurantFilter=rf.dataset.rfilter; render(); return; }
  const f=e.target.closest('[data-filter]');
  if(f){ placeFilter=f.dataset.filter; render(); return; }
  const card=e.target.closest('[data-place]');
  if(card){ sheet={mode:'place', id:card.dataset.place}; render(); return; }
  if(e.target.id==='save-full') saveFull();
};
document.getElementById('app').oninput=e=>{
  if(e.target.id==='plan-q'){ planQuery=e.target.value; render(); return; }
  if(e.target.id==='rq'){
    restaurantQuery=e.target.value;
    const rows=filteredRestaurants();
    const count=document.getElementById('restaurant-count');
    const list=document.getElementById('restaurant-list');
    if(count) count.textContent=rows.length+' מקומות';
    if(list) list.innerHTML=restaurantCards(rows);
    return;
  }
  if(e.target.id==='q'){
    query=e.target.value;
    const rows=filteredPlaces();
    const count=document.getElementById('place-count');
    const list=document.getElementById('place-list');
    if(count) count.textContent=rows.length+' במאגר';
    if(list) list.innerHTML=placeCards(rows);
    requestAnimationFrame(hydrateMedia);
  }
};
document.getElementById('app').onchange=e=>{
  if(e.target.id==='plan-area'){ planAreaFilter=e.target.value; render(); return; }
};
document.getElementById('sheet').onclick=e=>{
  if(openMediaYoutube(e.target)){ e.preventDefault(); e.stopPropagation(); return; }
  const pst=e.target.closest('[data-plan-id][data-plan-status]');
  if(pst){ setPlanStatus(pst.dataset.planId,pst.dataset.planStatus); render(); return; }
  if(e.target.dataset.close){ sheet=null; render(); return; }
  if(e.target.id==='skip'){
    const uid=sheet.uid;
    live.skipped[uid]=true; sheet=null; persist(); render();
    toast('דולג', ()=>{ delete live.skipped[uid]; persist(); render(); document.getElementById('toast').classList.add('hidden'); });
    return;
  }
  if(e.target.id==='longer' || e.target.id==='shorter'){
    const delta=e.target.id==='longer'?15:-15;
    live.cascade[sheet.uid]=(live.cascade[sheet.uid]||0)+delta;
    persist(); render(); return;
  }
  if(e.target.id==='swap'){ sheet={mode:'swap', uid:sheet.uid, q:''}; render(); return; }
  const pick=e.target.closest('[data-pick]');
  if(pick){
    const p=TRIP.places.find(x=>x.id===pick.dataset.pick);
    const day=activeDay();
    const it=day.items.find(x=>x.uid===sheet.uid);
    if(p && it && day.scope.indexOf(p.city)>=0){
      live.replace[it.uid]={name:p.name, desc:p.desc||'', maps:p.maps||'', kind:p.kind==='food'?'מסעדה / אוכל':it.kind};
      persist();
    }
    sheet=null; render(); return;
  }
};
document.getElementById('sheet').oninput=e=>{
  if(e.target.id==='note' && sheet){ live.notes[sheet.uid]=e.target.value; persist(); }
  if(e.target.id==='swap-q' && sheet){
    sheet.q=e.target.value;
    const list=document.getElementById('swap-list');
    if(list) list.innerHTML=swapCards(swapMatches());
    requestAnimationFrame(hydrateMedia);
  }
};
render();
matchMedia('(min-width:960px)').addEventListener('change', function(){ render(); });
const onPill=document.querySelector('.pill.on');
if(onPill && onPill.parentElement){
  const box=onPill.parentElement;
  box.scrollLeft = onPill.offsetLeft - (box.clientWidth-onPill.offsetWidth)/2;
}
</script>
</body>
</html>
