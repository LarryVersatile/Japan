בטוחה לצמחונית בלי דגים או dashi.","duration":"30–60 דק׳","note":"טבעוני לחלוטין.","maps":"https://www.google.com/maps/search/?api=1&query=T%27s+Tantan+Tokyo+Station","booking":"","website":"https://foods.jr-cross.co.jp/ts-tantan/"},{"id":"p_fd1aa1ebe25b","name":"Sunshine Aquarium","city":"טוקיו","area":"Ikebukuro","status":"רוצה","kind":"attraction","desc":"אקווריום עירוני עם פינגווינים, לוטרות ותצוגות יצירתיות.","duration":"1.5–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Sunshine+Aquarium+Japan","booking":"","website":"","info":"Sunshine Aquarium נפתח ב־1978 כחלק מ־Sunshine City באיקבוקורו, אחד מפרויקטי ה־mixed-use הגדולים והשאפתניים של טוקיו באותה תקופה. Sunshine 60, המגדל המרכזי, נבנה על האתר שבו עמד בעבר בית הכלא Sugamo — מקום שבו הוחזקו והוצאו להורג גם פושעי מלחמה אחרי 1945 — והפרויקט כולו נועד להפוך את האזור לסמל של טוקיו החדשה. בתוך הקומפלקס נפתח Sunshine International Aquarium על גג World Import Mart. עצם הרעיון היה חריג: אקווריום גדול לא ליד הים אלא גבוה בתוך אזור מסחרי צפוף. בשנת 2010 נסגר המקום לשיפוץ של כמעט שנה ונפתח מחדש באוגוסט 2011 בשם Sunshine Aquarium, עם תפיסה של 'Oasis in the Sky'. אחד הסמלים החדשים הוא Penguins in the Sky, מיכל חיצוני תלוי שבו הפינגווינים נראים כאילו הם שוחים מעל קו הרקיע של Ikebukuro. כך המקום עבר מאקווריום עירוני של שנות ה־70 לחוויה שמנצלת במכוון את הצפיפות והגובה של טוקיו. כשמבקרים, הניגוד הוא החלק המעניין: חיות ימיות ומים מול מגדלים, רכבות ורחובות — טבע שמוצג לא מחוץ לעיר אלא ממש בתוכה.","infoSource":"https://sunshinecity.jp/en/aquarium/area/"},{"id":"p_7021610ad3e5","name":"Bandai Namco Cross Store","city":"טוקיו","area":"Ikebukuro","status":"רוצה","kind":"attraction","desc":"מתחם עם מותגי Bandai Namco, משחקים, דמויות ומרצ׳נדייז.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Bandai+Namco+Cross+Store+Japan","booking":"","website":""},{"id":"p_a2be9c6b2fe0","name":"NAMJATOWN","city":"טוקיו","area":"Ikebukuro","status":"רוצה","kind":"attraction","desc":"פארק indoor קטן ומשונה עם מתקנים, אוכל ודמויות.","duration":"1–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=NAMJATOWN+Japan","booking":"","website":"","info":"NAMJATOWN נפתח ב־6 ביולי 1996 בתוך Sunshine City בשם Sunshine Namja Town, בתקופה שבה חברות המשחקים היפניות חיפשו דרכים להרחיב את העולמות שלהן מעבר למסך. Namco, שהייתה כבר שם ענק בארקיידים ובמשחקים, בנתה כאן פארק מקורה שמבוסס על רחובות, דמויות, חידות ואטרקציות בקנה מידה קטן — לא על רכבות הרים ענקיות. ב־1997 נפתח אזור רוחות ו־yōkai, ובהמשך נוספו אטרקציות ששילבו טכנולוגיה וסיפור. פרק חשוב הגיע ב־2002 עם Ikebukuro Gyoza Stadium, שהיה מהחלוצים של 'food theme parks' ביפן: אוכל אזורי הפך בעצמו לאטרקציה. במשך השנים הפארק הסתגל לעליית anime ו־character collaborations והפך למקום שבו Bandai Namco יכולה להפוך IP דיגיטלי לחלל פיזי. ב־2021 נפתח Nyanja Town של חתולים, ב־2024 נוסף אזור נינג'ה, וב־2026, לציון 30 שנה, נעשה שיפוץ גדול ונוספו אטרקציות חדשות כולל Taiko no Tatsujin בקנה מידה ענק. לכן NAMJATOWN מעניין כהיסטוריה של תעשיית הבידור היפנית עצמה: מארקיידים של שנות ה־80 וה־90, דרך פארקי אוכל ו־character culture, ועד חוויות שמבוססות על IP ומשחקים מוכרים מהטלפון והקונסולה.","infoSource":"https://bandainamco-am.co.jp/tp/namja/NEWS/info/20260618_1.html"},{"id":"p_6b5329e13d24","name":"Animate Ikebukuro","city":"טוקיו","area":"Ikebukuro","status":"רוצה","kind":"attraction","desc":"חנות ענקית לאנימה, מנגה ו-merchandise.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Animate+Ikebukuro+Japan","booking":"","website":""},{"id":"p_d028272c6442","name":"Neco Republic Ikebukuro rescue cat café","city":"טוקיו","area":"Ikebukuro","status":"רוצה","kind":"attraction","desc":"בית קפה עם חתולי הצלה ואימוץ. מתאים יותר למי שמעדיף מודל עם רווחת בעלי חיים.","duration":"60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Neco+Republic+Ikebukuro+rescue+cat+caf%C3%A9+Japan","booking":"","website":"","info":"Neco Republic שייך לדור מאוחר יותר של cat cafés ביפן. בתי קפה עם חתולים הפכו לתופעה יפנית מפורסמת במיוחד בשנות ה־2000, בין היתר משום שהם סיפקו לתושבי ערים צפופות אפשרות לבלות עם בעלי חיים גם כאשר חוזי שכירות ודירות קטנות מקשים להחזיק חיית מחמד. עם הזמן עלתה גם ביקורת סביב רווחת בעלי החיים, ומכאן צמחו מודלים שמחברים את בית הקפה להצלה ואימוץ. Neco Republic נבנה סביב הרעיון הזה: החתולים במקום אינם רק 'עובדי בידור' אלא חתולי rescue, והפעילות נועדה לחשוף אנשים לאימוץ, לגייס תמיכה ולהפחית המתות של חתולים ללא בית. מבחינה תרבותית זהו שינוי מעניין בתוך פורמט מאוד יפני: אטרקציה שנולדה מתוך צפיפות עירונית ותרבות kawaii מקבלת תפקיד חברתי. באיקבוקורו, אזור שמלא ב־character cafés, anime ובידור ממותג, המקום יוצר ניגוד — עדיין חוויה נעימה וחמודה, אבל עם מסר על אחריות. לכן בביקור חשוב לכבד את כללי המגע והצילום ולתת לחתולים לבחור אם להתקרב; זה חלק מההבדל בין rescue café לבין מקום שבו בעל החיים הוא רק תפאורה.","infoSource":"https://www.neco-republic.jp/"},{"id":"p_5dcfa1bddcef","name":"Pokémon Center MEGA TOKYO","city":"טוקיו","area":"Ikebukuro","status":"חובה","kind":"attraction","desc":"אחד ממרכזי Pokémon הגדולים בטוקיו, בתוך Sunshine City באיקבוקורו, עם מבחר גדול של מרצ'נדייז ומוצרים בלעדיים.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Pokemon+Center+MEGA+TOKYO+Sunshine+City+Japan","booking":"","website":""},{"id":"p_0169f1c102f4","name":"Pikachu Sweets by Pokémon Cafe","city":"טוקיו","area":"Ikebukuro","status":"חובה","kind":"food","desc":"דוכן Pokémon Café בסגנון takeaway ליד Pokémon Center MEGA TOKYO, עם משקאות וקינוחים בעיצוב Pokémon.","duration":"20–40 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Pikachu+Sweets+by+Pokemon+Cafe+Sunshine+City+Japan","booking":"","website":""},{"id":"p_f4d7f88e6d14","name":"Rikugien Garden","city":"טוקיו","area":"Autumn Gardens","status":"חובה","kind":"attraction","desc":"גן יפני קלאסי ומרהיב במיוחד בשלכת, לעיתים עם תאורת ערב עונתית.","duration":"1–1.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Rikugien+Garden+Japan","booking":"","website":"","info":"Rikugien נבנה סביב 1702 בידי Yanagisawa Yoshiyasu, יועץ רב־עוצמה של השוגון החמישי Tokugawa Tsunayoshi. הוא קיבל את הקרקע מהשוגון והקדיש שנים לעיצוב גן kaiyū — גן טיול שבו המבקר נע סביב אגם ונחשף בהדרגה לסצנות שונות. אבל Rikugien אינו רק נוף יפה; הוא בנוי סביב שירת waka. Yoshiyasu יצר בתוך הגן ייצוגים של נופים שהוזכרו בשירה יפנית ובקלאסיקות סיניות, כך שהמבקר המשכיל בתקופת Edo היה אמור לזהות רמזים ספרותיים תוך כדי הליכה. אפילו השם Rikugien מתייחס ל'שש הקטגוריות' של שירה, מושג שמקורו בסין והשפיע על מסורת waka. אחרי נפילת שוגונות Tokugawa הגן עבר ידיים, ובתקופת Meiji רכש אותו Iwasaki Yatarō, מייסד Mitsubishi, והשתמש בו כאחוזה שנייה. משפחת Iwasaki שמרה על המקום ותרמה אותו לעיר טוקיו ב־1938. ב־1953 הוא הוכר כ־Special Place of Scenic Beauty. לכן הגן שאנחנו רואים היום שרד בזכות שילוב יוצא דופן של שוגון, פטרון ספרות מהמאה ה־18 ומשפחת תעשיינים מהמאה ה־19. כשמטיילים סביב האגם, כדאי לזכור שהשבילים נועדו ממש 'לערוך' את הנוף — להסתיר תמונה, לפתוח אחרת ולגרום לטבע להיקרא כמו שיר.","infoSource":"https://www.tokyo-park.or.jp/teien/en/rikugien/outline.html"},{"id":"p_b61f77e1a145","name":"Koishikawa Korakuen","city":"טוקיו","area":"Autumn Gardens","status":"רוצה","kind":"attraction","desc":"אחד הגנים היפניים העתיקים בטוקיו, עם בריכות, גשרים ושלכת.","duration":"1–1.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Koishikawa+Korakuen+Japan","booking":"","website":"","info":"Koishikawa Kōrakuen הוא אחד מגני ה־daimyo העתיקים ביותר ששרדו בטוקיו. הוא החל להיבנות ב־1629 עבור Tokugawa Yorifusa, מייסד ענף Mito של משפחת Tokugawa, והושלם בתקופת בנו Tokugawa Mitsukuni — דמות מלומדת שהפכה מאוחר יותר לגיבור תרבות פופ תחת הכינוי Mito Kōmon. Mitsukuni התעניין עמוקות בלימוד ובהיסטוריה והושפע מהמלומד הסיני Zhu Shunshui, פליט משושלת Ming שהגיע ליפן. בהשפעתו שולבו בגן אלמנטים סיניים כמו Full Moon Bridge וייצוג של West Lake. גם השם Kōrakuen מגיע ממשפט קונפוציאני המיוחס ל־Fan Zhongyan: שליט טוב צריך 'לדאוג לפני כולם וליהנות אחרי כולם'. כלומר, אפילו שם הגן היה הצהרה על אידאל של שלטון. הגן בנוי כ־kaiyū, מסלול סביב אגם עם גבעות מלאכותיות, גשרים ונופים שמייצגים מקומות אמיתיים מסין ומיפן. הוא שרד את רעידת Kantō, את המלחמה ואת הפיתוח האורבני העצום סביבו, והיום Tokyo Dome וגורדי שחקים מציצים מעבר לעצים. ההיסטוריה שלו חשובה משום שהיא מזכירה ש־Edo לא הייתה תרבות סגורה בתוך עצמה; האליטה של Tokugawa קראה טקסטים סיניים, הזמינה מלומדים זרים ושילבה רעיונות חיצוניים בתוך נוף יפני.","infoSource":"https://www.tokyo-park.or.jp/teien/en/koishikawa/outline.html"},{"id":"p_e99feaf36cfc","name":"Kiyomizu-dera","city":"קיוטו","area":"Higashiyama + Gion","status":"חובה","kind":"attraction","desc":"מקדש מפורסם על גבעה עם מרפסת עץ ונוף לקיוטו.","duration":"1–1.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kiyomizu-dera+Japan","booking":"","website":"","kyotoCandidate":true,"info":"זהו אחד האתרים המזוהים ביותר עם קיוטו: מקדש בודהיסטי שהשורשים שלו מגיעים למאה ה־8, בנוי על מדרון הר Otowa. מרפסת העץ הגדולה מאפשרת להבין את הקשר בין המקדש, היער והעיר שמתחת. במסמכי המקור הודגש שהגישה והירידה מהמקדש הן חלק מהחוויה, ולכן כדאי להתייחס אליו כפתיחה של רצף Higashiyama ולא כתחנה מבודדת.","kyotoWhy":"להגיע מוקדם. זה אחד המקומות שבהם השעה משנה מאוד את איכות הביקור.","kyotoCombine":"מתחבר טבעית ל־Sannenzaka → Ninenzaka → Kōdai-ji → Yasaka → Gion.","kyotoSources":["1811","תכנון 2025","ELAL"],"youtube":"https://www.youtube.com/results?search_query=Kiyomizu-dera+Kyoto+Japan","kyotoMinutes":60,"kyotoDefaultDay":"3"},{"id":"p_43740fb1fbb4","name":"Sannenzaka","city":"קיוטו","area":"Higashiyama + Gion","status":"חובה","kind":"attraction","desc":"רחוב היסטורי יפה עם בתי עץ, חנויות וממתקים.","duration":"30–45 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Sannenzaka+Japan","booking":"","website":"","kyotoCandidate":true,"info":"המדרון ההיסטורי היורד מאזור Kiyomizu-dera מלא בתי עץ, חנויות קרמיקה, ממתקים ובתי תה. הוא התפתח לאורך נתיב העלייה לרגל למקדש ולכן גם כשהוא מסחרי מאוד היום, המבנה העירוני שלו עדיין קשור לתנועת המבקרים ההיסטורית אל Kiyomizu.","kyotoWhy":"לא צריך 'לסמן וי'. עדיף ללכת לאט ולעצור רק בחנויות שמעניינות באמת.","kyotoCombine":"עם Ninenzaka ו־Yasaka Pagoda באותו רצף הליכה.","kyotoSources":["1811","תכנון 2025"],"youtube":"https://www.youtube.com/results?search_query=Sannenzaka+Kyoto+Japan","kyotoMinutes":38,"kyotoDefaultDay":"3"},{"id":"p_ad0964a285b3","name":"Ninenzaka","city":"קיוטו","area":"Higashiyama + Gion","status":"חובה","kind":"attraction","desc":"סמטה מסורתית פוטוגנית המחברת בין אזור Kiyomizu ל-Gion.","duration":"30–45 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Ninenzaka+Japan","booking":"","website":"","kyotoCandidate":true,"info":"עוד אחת מהסמטאות השמורות של Higashiyama, עם חזיתות מסורתיות, בתי תה וחנויות קטנות. היא מחברת בצורה כמעט מושלמת בין Kiyomizu-dera לבין Kōdai-ji/Gion ולכן הערך שלה הוא גם באווירה וגם בלוגיסטיקה.","kyotoWhy":"צפוף מאוד בשעות השיא; בוקר מוקדם או אחר הצהריים המאוחר נעימים יותר.","kyotoCombine":"Sannenzaka → Ninenzaka → Kōdai-ji.","kyotoSources":["1811","תכנון 2025"],"youtube":"https://www.youtube.com/results?search_query=Ninenzaka+Kyoto+Japan","kyotoMinutes":38,"kyotoDefaultDay":"3"},{"id":"p_8ecae80d31fb","name":"Yasaka Pagoda","city":"קיוטו","area":"Higashiyama + Gion","status":"רוצה","kind":"attraction","desc":"פגודה בולטת בלב Higashiyama, אחת התמונות המזוהות עם קיוטו.","duration":"15–30 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Yasaka+Pagoda+Japan","booking":"","website":"","kyotoCandidate":true,"info":"פגודת Hōkan-ji היא אחד הסמלים המצולמים של Higashiyama. לרוב החוויה החשובה היא המראה שלה מתוך הרחובות המסורתיים ולא ביקור ארוך בתוך האתר.","kyotoWhy":"מתאים כמיקרו־סטופ של 15–20 דקות, לא כעוגן של יום.","kyotoCombine":"בין Ninenzaka/Kiyomizu לבין Yasaka/Gion.","kyotoSources":["v79"],"youtube":"https://www.youtube.com/results?search_query=Yasaka+Pagoda+Kyoto+Japan","kyotoMinutes":22},{"id":"p_beeeb488b665","name":"Kodai-ji","city":"קיוטו","area":"Higashiyama + Gion","status":"רוצה","kind":"attraction","desc":"מקדש וגנים יפים, במיוחד בסתיו ובתאורת ערב.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kodai-ji+Japan","booking":"","website":"","kyotoCandidate":true,"info":"Kōdai-ji נוסד בתחילת המאה ה־17 בידי Nene לזכר בעלה Toyotomi Hideyoshi. הגנים, מבני התה והמסלול על הגבעה נותנים חוויה אינטימית יותר מהאתרים הגדולים. במסמכי המקור הוא הופיע כתחנה חזקה במיוחד בין Ninenzaka ל־Yasaka.","kyotoWhy":"בתחילת דצמבר יכול להיות עדיין יפה מאוד בשלכת מאוחרת; כדאי לבדוק מצב עלים קרוב לנסיעה.","kyotoCombine":"Ninenzaka → Kōdai-ji → Yasaka Shrine → Gion.","kyotoSources":["1811"],"youtube":"https://www.youtube.com/results?search_query=Kodai-ji+Kyoto+Japan","kyotoMinutes":75,"kyotoDefaultDay":"3"},{"id":"p_a2e4e280169b","name":"Maruyama Park","city":"קיוטו","area":"Higashiyama + Gion","status":"רוצה","kind":"attraction","desc":"פארק עירוני ירוק ליד Yasaka Shrine.","duration":"30–45 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Maruyama+Park+Japan","booking":"","website":"","kyotoCandidate":true,"info":"הפארק המרכזי ליד Yasaka Shrine משמש מרחב נשימה בין המקדשים לרובע Gion. הוא פחות 'אתר חובה' ויותר מקום טוב לעצירה, אוכל קטן או מעבר ירוק בין אזורים.","kyotoWhy":"אם היום עמוס אפשר לעבור דרכו בלי להקצות זמן נפרד.","kyotoCombine":"Yasaka Shrine + Gion.","kyotoSources":["v79"],"youtube":"https://www.youtube.com/results?search_query=Maruyama+Park+Kyoto+Japan","kyotoMinutes":38},{"id":"p_b339b9da6202","name":"Yasaka Shrine","city":"קיוטו","area":"Higashiyama + Gion","status":"רוצה","kind":"attraction","desc":"מקדש שינטו מרכזי בכניסה ל-Gion.","duration":"30–45 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Yasaka+Shrine+Japan","booking":"","website":"","kyotoCandidate":true,"info":"מקדש שינטו מרכזי בקצה Gion והבית הרוחני של Gion Matsuri. הוא מספק מעבר מעניין מבודהיזם של Kiyomizu/Kōdai-ji לעולם השינטו, וממנו נכנסים ישירות לרובע Gion.","kyotoWhy":"פתוח לאו atus":"רוצה","kind":"food","desc":"חנות מפורסמת בהדגמות הכנת mochi מהירות.","duration":"15–30 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Nakatanidou+Mochi+Japan","booking":"","website":""},{"id":"p_c33a645ed872","name":"Kasugataisha Manyo Botanical Garden","city":"מסביב לאוסקה","area":"Nara","status":"אולי","kind":"attraction","desc":"גן בוטני סמוך ל-Kasuga Taisha עם כ-250 מיני צמחים המתוארים בשירה יפנית עתיקה; תוספת טובה אם רוצים יותר טבע.","duration":"45–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kasugataisha+Manyo+Botanical+Garden+Japan","booking":"","website":""},{"id":"p_b2758cc42835","name":"Kobe Harborland","city":"מסביב לאוסקה","area":"Kobe — אופציונלי","status":"רוצה","kind":"attraction","desc":"אזור נמל מודרני עם קניות, טיילת ואורות בלילה.","duration":"1–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kobe+Harborland+Japan","booking":"","website":""},{"id":"p_7034ba072e1c","name":"Meriken Park","city":"מסביב לאוסקה","area":"Kobe — אופציונלי","status":"רוצה","kind":"attraction","desc":"פארק נמל עם Kobe Port Tower ונוף למים.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Meriken+Park+Japan","booking":"","website":""},{"id":"p_86ad1e064c0e","name":"Kobe Nunobiki Herb Gardens","city":"מסביב לאוסקה","area":"Kobe — אופציונלי","status":"רוצה","kind":"attraction","desc":"גן עשבי תיבול גדול על ההר עם רכבל ונוף לעיר.","duration":"2–3 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kobe+Nunobiki+Herb+Gardens+Japan","booking":"","website":""},{"id":"p_a635db053fed","name":"Kobe Chinatown / Nankinmachi","city":"מסביב לאוסקה","area":"Kobe — אופציונלי","status":"רוצה","kind":"attraction","desc":"צ'יינהטאון קומפקטי עם אוכל רחוב ורחובות צבעוניים.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kobe+Chinatown+%2F+Nankinmachi+Japan","booking":"","website":""},{"id":"p_b3a611b481d6","name":"Himeji Castle","city":"מסביב לאוסקה","area":"Himeji — אופציונלי","status":"רוצה","kind":"attraction","desc":"אחת הטירות המקוריות והמרשימות ביפן.","duration":"2–3 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Himeji+Castle+Japan","booking":"","website":""},{"id":"p_633fbac336c0","name":"Koko-en Garden","city":"מסביב לאוסקה","area":"Himeji — אופציונלי","status":"רוצה","kind":"attraction","desc":"גן יפני יפה ממש ליד Himeji Castle.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Koko-en+Garden+Japan","booking":"","website":""},{"id":"p_9c3132dd3fcc","name":"Ueno Park","city":"טוקיו","area":"Ueno + Ameyoko","status":"רוצה","kind":"attraction","desc":"פארק עירוני גדול שמרכז סביבו מוזיאונים, מקדשים ושבילים. בתקופת סתיו מתאים להליכה רגועה בין עצים ומוזיאונים.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Ueno+Park+Japan","booking":"","website":"","info":"Ueno Park יושב על קרקע שהייתה פעם חלק מאחד המתחמים הדתיים והפוליטיים החשובים של Edo. במאה ה־17 הקימה שוגונות Tokugawa כאן את Kan'ei-ji, מקדש גדול שנועד להגן רוחנית על העיר מצפון־מזרח, כיוון שנחשב מסוכן במסורת היפנית. המקדש היה קשור ישירות למשפחת Tokugawa, וחלק מהשוגונים אף נקברו בו. ב־1868, כאשר שלטון Tokugawa קרס, התחולל באזור Battle of Ueno בין לוחמי shōgitai שנשארו נאמנים לשוגון לבין כוחות ממשלת Meiji. הקרב והאש הרסו חלק גדול מ־Kan'ei-ji. במקום לשקם את המתחם בממדיו הישנים, ממשלת Meiji הפכה את השטח לאחד הפארקים הציבוריים הראשונים ביפן ב־1873. זו הייתה החלטה אידאולוגית כמעט: קרקע דתית־פיאודלית הפכה למרחב ציבורי של המדינה החדשה. בהמשך נבנו כאן מוזיאונים, גן חיות, מוסדות אמנות ותערוכות לאומיות, וב־1924 הקיסר Taishō העביר רשמית את הפארק לעיר — מכאן השם Ueno Onshi Park, 'הפארק הקיסרי שהוענק'. לכן יום המוזיאונים שלנו עובר למעשה בשטח שמספר את המעבר משוגונות, דרך מלחמת אזרחים, למדינת Meiji שמקדשת חינוך, מדע ותרבות ציבורית.","infoSource":"https://www.gotokyo.org/en/destinations/northern-tokyo/ueno/index.html"},{"id":"p_3ff2cc2c2491","name":"Ameyoko Market","city":"טוקיו","area":"Ueno + Ameyoko","status":"רוצה","kind":"attraction","desc":"שוק רחוב צבעוני עם אוכל, מתוקים, ביגוד וחנויות. מתאים לשילוב עם Ueno ו-Akihabara.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Ameyoko+Market+Japan","booking":"","website":"","info":"Ameyoko הוא אחד המקומות שבהם אפשר עדיין להרגיש משהו מטוקיו של השנים הראשונות אחרי 1945. האזור הצפוף בין Ueno ל־Okachimachi הפך לאחר המלחמה לשוק שחור שבו אנשים ניסו להשיג מזון, ביגוד ומוצרים שלא היו זמינים דרך מערכת הקיצוב. מקור השם עצמו משקף את התקופה: לפי הסבר אחד ame מגיע מ־ameya, מוכרי ממתקים, משום שבאזור נמכרו כמויות גדולות של sweets; לפי הסבר אחר הוא קוצר מ־America, משום שמוצרים אמריקאיים וצבאיים הגיעו לשוק דרך ערוצים לא רשמיים. עם התאוששות הכלכלה עבר Ameyoko בהדרגה ממקום של הישרדות למרכז מסחר עממי וזול. כיום פועלות לאורך כחצי קילומטר מאות חנויות של דגים, תבלינים, בגדים, קוסמטיקה ומזון בינלאומי. מה שמעניין הוא שהאופי של השוק עדיין שונה מאוד מהסדר של בתי הכלבו היפניים: מוכרים קוראים בקול, שלטים נערמים, וסחורה נשפכת כמעט אל הרחוב. אחרי יום ב־Ueno Park ובמוזיאונים הלאומיים, המעבר ל־Ameyoko הוא כמעט מעבר בין שתי גרסאות של יפן שלאחר המלחמה — מצד אחד מדינה שבונה מוסדות, ומצד אחר אזרחים שבונים מחדש את הכלכלה מלמטה.","infoSource":"https://www.gotokyo.org/en/spot/71/"},{"id":"p_059773fe3b18","name":"National Museum of Nature and Science","city":"טוקיו","area":"Ueno + Ameyoko","status":"רוצה","kind":"attraction","desc":"מוזיאון טבע ומדע גדול עם דינוזאורים, חלל, מדע וטכנולוגיה.","duration":"1.5–2.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=National+Museum+of+Nature+and+Science+Japan","booking":"","website":"","info":"National Museum of Nature and Science נולד כחלק מהמאמץ של יפן בתקופת Meiji ללמוד, למיין ולהציג ידע מדעי באופן מודרני. כבר ב־1871 הוקם ב־Yushima Seidō חלל תצוגה של משרד החינוך, וב־1872 נערכה שם תערוכה ציבורית. בשנת 1877 הוקם ב־Ueno מוסד שנחשב רשמית לנקודת ההתחלה של המוזיאון. הוא עבר שינויים ושמות רבים, אבל המטרה נשארה דומה: לבנות ביפן מוסד לאומי שמחבר טבע, מדע, טכנולוגיה וחינוך. רעידת Kantō של 1923 הייתה קטסטרופה למוזיאון — המבנים והדגימות נפגעו קשות — ובעקבותיה נבנה ב־1931 בניין חדש ב־Ueno, Japan Gallery של היום. המבנה עצמו הפך מאוחר יותר ל־Important Cultural Property. אחרי המלחמה התרחבו המחקר והאוספים, וב־2006–2007 אורגנו התצוגות מחדש ל־Japan Gallery ו־Global Gallery. המוזיאון חשוב משום שהוא מספר לא רק על דינוזאורים או בעלי חיים אלא גם על ההיסטוריה של המדע היפני: כיצד מדינת Meiji אימצה שיטות מחקר מערביות, כיצד יפן בנתה תעשייה וטכנולוגיה, וכיצד חוקרים מקומיים חקרו את הארכיפלג. ביום שלנו כדאי להתרכז ב־Japan Gallery, משום שהיא נותנת הקשר מקומי לטבע, לאנשים ולתעשייה של יפן ולא רק עוד מוזיאון מדע כללי.","infoSource":"https://www.kahaku.go.jp/english/"},{"id":"p_f6d904a563a7","name":"Tokyo National Museum","city":"טוקיו","area":"Ueno + Ameyoko","status":"רוצה","kind":"attraction","desc":"המוזיאון המרכזי לאמנות והיסטוריה יפנית, בתוך Ueno Park.","duration":"1.5–2.5 ש׳","note":"שובץ ביום Ueno לצד National Museum of Nature and Science.","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+National+Museum+Japan","booking":"","website":"https://www.tnm.jp/?lang=en","info":"Tokyo National Museum הוא המוזיאון העתיק ביותר ביפן מסוגו, וההיסטוריה שלו קשורה ישירות לפרויקט המודרניזציה של Meiji. בשנת 1872 ארגן משרד החינוך תערוכה ב־Yushima Seidō; האירוע נחשב ללידת המוזיאון. המטרה הראשונית הייתה רחבה מאוד — לא רק אמנות, אלא גם טבע, תעשייה, ספרייה ואפילו גן חיות — משום שממשלת Meiji ראתה במוזיאון כלי לחינוך הציבור ולהצגת יפן כמדינה מודרנית. ב־1882 עבר המוסד ל־Ueno, על שטח שהיה קודם חלק מ־Kan'ei-ji ונפגע ב־Boshin War. הבניין הראשי הראשון תוכנן בידי האדריכל הבריטי Josiah Conder ונחנך בנוכחות הקיסר Meiji. רעידת Kantō של 1923 פגעה קשות במתחם, וב־1938 נפתח Honkan החדש שאנחנו רואים כיום, בסגנון שמחבר מבנה מודרני עם גג בהשראה יפנית. במהלך המלחמה פונו חלק מהאוצרות כדי להגן עליהם. אחרי 1945 קיבל המוסד את שמו הנוכחי והמשיך להרחיב את האוסף. היום הוא מחזיק National Treasures רבים, פסלים בודהיסטיים, קליגרפיה, קרמיקה, שריון, חרבות וטקסטיל. המוזיאון עצמו הוא לכן חלק מהסיפור שהוא מספר: מקום שבו יפן המודרנית החליטה מה מתוך עברה צריך להיאסף, להישמר ולהפוך ל'מורשת לאומית'.","infoSource":"https://www.tnm.jp/modules/r_free_page/index.php?id=155&lang=en"},{"id":"p_20e5debe1afa","name":"Imperial Palace East Gardens","city":"טוקיו","area":"Imperial Palace + Tokyo Station","status":"רוצה","kind":"attraction","desc":"הגנים המזרחיים של הארמון הקיסרי בטוקיו, עם שרידי חומות, גנים ושבילים בלב העיר.","duration":"60–90 דק׳","note":"שובץ ליום Akihabara כדי לא להעמיס על Ginza ולשמור קרבה יחסית למרכז.","maps":"https://www.google.com/maps/search/?api=1&query=Imperial+Palace+East+Gardens+Japan","booking":"","website":"https://www.kunaicho.go.jp/e-event/higashigyoen02.html","info":"Imperial Palace East Gardens יושבים על הלב של Edo Castle, המקום שממנו שלטה שוגונות Tokugawa ביפן במשך יותר מ־250 שנה. אחרי ש־Tokugawa Ieyasu קבע את בסיסו ב־Edo בסוף המאה ה־16, הורחבה הטירה בהדרגה למערכת עצומה של חפירים, שערים, חומות ומתחמים. Honmaru היה הליבה הפנימית, Ninomaru ו־Sannomaru הקיפו אותו, וכאן חיו ופעלו השוגון, משפחתו והמנגנון המנהלי. ה־tenshu, המגדל הראשי, היה מהגדולים ביפן, אך נשרף ב־1657 ב־Great Fire of Meireki ולא נבנה מחדש; בסיס האבן Tenshudai עדיין נמצא בגן. ב־1868, עם נפילת השוגונות, עבר הקיסר מקיוטו לטוקיו והטירה הפכה לארמון קיסרי. חלקים גדולים נהרסו בשריפות, רעידות אדמה ומלחמה, והארמון המודרני נבנה מחדש אחרי 1945. בשנת 1960 החליטה הממשלה להפוך את חלקי Honmaru, Ninomaru ו־Sannomaru לשטח ציבורי, וה־East Gardens נפתחו ב־1968. לכן זהו מקום שבו דווקא החסר חשוב: אין טירת samurai שלמה, אבל החומות, בתי השמירה, השערים והבסיס העצום מאפשרים להבין את קנה המידה של מרכז הכוח של Edo. כאשר רואים את Otemachi ומגדלי Marunouchi מעבר לחומות, רואים כיצד בירת השוגון הפכה למרכז שלטוני ופיננסי מודרני בלי לשנות את המרכז הגאוגרפי שלה.","infoSource":"https://www.kunaicho.go.jp/en/visit/event/higashigyoen/index.html"},{"id":"p_c1a69e0a9701","name":"Marunouchi","city":"טוקיו","area":"Imperial Palace + Tokyo Station","status":"אולי","kind":"attraction","desc":"האזור האלגנטי בין הארמון לתחנת Tokyo, עם אדריכלות, קניות ובתי קפה.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Marunouchi+Japan","booking":"","website":"","info":"Marunouchi פירושו בערך 'בתוך המעגל', והשם מתייחס למיקומו בתוך מערכת החפירים של Edo Castle. בתקופת Tokugawa האזור בין הטירה לבין מה שהוא היום Tokyo Station היה מלא באחוזות של daimyo שנדרשו לשהות בבירה כחלק ממערכת sankin-kōtai. אחרי רסטורציית Meiji האחוזות נעלמו והשטח הפך לרכוש ממשלתי, עם קסרקטינים ומגרשי אימון של המשמר הקיסרי. בשנת 1890 רכשה Mitsubishi שטח עצום ב־Marunouchi לבקשת הממשלה. Yanosuke Iwasaki, מנהיג החברה, דמיין רובע עסקים בסגנון London ו־Manhattan שיתאים למדינה מודרנית. Mitsubishi Building No. 1 נפתח ב־1894, ובהמשך נבנו עוד מבני לבנים שזכו לכינוי 'London Block'. פתיחת Tokyo Station ב־1914 הפכה את האזור למרכז עסקי לאומי. Marunouchi Building המקורי, שנפתח ב־1923, היה אז בניין ענק וחדשני ושרד הן את רעידת Kantō והן את הפצצות המלחמה לפני שהוחלף ב־2002. היום גורדי זכוכית מסתירים במידה רבה את השכבה הישנה, אבל הגאוגרפיה נשארה: מצד אחד הארמון, מצד שני התחנה ובאמצע מרכז הפיננסים. הליכה קצרה כאן מספרת את המעבר של יפן מאחוזות samurai לקפיטליזם תאגידי תוך פחות ממאה שנה.","infoSource":"https://www.mitsubishi.com/en/profile/history/outline/"},{"id":"p_f4384d076558","name":"Daikanyama T-Site","city":"טוקיו","area":"Daikanyama + Nakameguro + Shimokitazawa","status":"אולי","kind":"attraction","desc":"מתחם מעוצב של ספרים, אמנות, עיצוב ובתי קפה בשכונת Daikanyama.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Daikanyama+T-Site+Japan","booking":"","website":""},{"id":"p_e7b9e8b2a661","name":"Nakameguro + Meguro River","city":"טוקיו","area":"Daikanyama + Nakameguro + Shimokitazawa","status":"אולי","kind":"attraction","desc":"שכונה נעימה עם בוטיקים, בתי קפה והליכה לאורך נהר Meguro.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Nakameguro+%2B+Meguro+River+Japan","booking":"","website":"","info":"Meguro River הוא ציר מים באורך כמעט שמונה קילומטרים שעובר דרך חלקים שונים של דרום־מערב טוקיו לפני שהוא מגיע למפרץ. האזור של Nakameguro היה בעבר הרבה יותר כפרי ותעשייתי מהדימוי האופנתי שלו היום. הנהר שימש לניקוז ולפעילות מקומית, ובמהלך המודרניזציה של טוקיו הוסדרו הגדות והזרימה כדי להתמודד עם הצפות ועם התפשטות העיר. עם התפתחות הרכבות וקישור Nakameguro לשיבויה ולמרכז, השכונה הפכה בהדרגה לאזור מגורים. במחצית השנייה של המאה ה־20 ובמיוחד בעשורים האחרונים הגיעו מעצבים, בתי קפה, מסעדות וגלריות, והנהר הפך ממערכת תשתית למרחב בילוי. נטיעת עצי sakura לאורך הגדות הפכה אותו לאחד מאתרי הפריחה המפורסמים בטוקיו, והפסטיבל השנתי מושך המונים באביב. גם תשתיות הרכבת קיבלו שימוש חדש: ב־2016 פותח Nakameguro Koukashita מתחת למסילה כמסדרון של מסעדות וחנויות. לכן הסיפור של Nakameguro הוא לא של אנדרטה אחת אלא של שינוי עירוני טיפוסי לטוקיו — נהר פונקציונלי ושכונה שקטה שהפכו בהדרגה למרחב ציבורי ולמרכז תרבות עירוני בלי לאבד את קנה המידה המקומי.","infoSource":"https://www.gotokyo.org/en/spot/103/index.html"},{"id":"p_d4046a4ceaec","name":"Starbucks Reserve Roastery Tokyo","city":"טוקיו","area":"Daikanyama + Nakameguro + Shimokitazawa","status":"אולי","kind":"food","desc":"סניף הדגל המרשים של Starbucks לאורך Meguro River, בעיצוב Kengo Kuma.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Starbucks+Reserve+Roastery+Tokyo+Japan","booking":"","website":""},{"id":"p_95e762595bff","name":"Shimokitazawa","city":"טוקיו","area":"Daikanyama + Nakameguro + Shimokitazawa","status":"אולי","kind":"attraction","desc":"שכונת היפסטרים עם וינטג׳, תקליטים, בתי קפה וחנויות קטנות.","duration":"1.5–2.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Shimokitazawa+Japan","booking":"","website":"","info":"Shimokitazawa, או Shimokita, הייתה בעבר אזור חקלאי מחוץ לליבה של טוקיו. הרחובות הצרים והמפותלים שלה הם שריד לתקופה שבה לא תוכננו עבור מכוניות אלא סביב שדות וכפרים. לפי JNTO, ההתפתחות המודרנית של האזור התחזקה אחרי רעידת Kantō של 1923, כאשר תושבים חיפשו מגורים מחוץ למרכז הצפוף והפגוע. אחרי מלחמת העולם השנייה התפתח כאן גם שוק שפנה לחיילים אמריקאים, וההשפעה המערבית הצטרפה לאופי המקומי. כאשר קווי Odakyu ו־Keio חיברו את השכונה בקלות ל־Shinjuku ול־Shibuya, השכירות היחסית נמוכה והמבנים הקטנים משכו סטודנטים, מוזיקאים, שחקנים ועסקים עצמאיים. משנות ה־70 וה־80 נוצרה כאן סצנה חזקה של live houses, תיאטרון קטן, קולנוע וחנויות יד שנייה, והשם Shimokita הפך כמעט למותג של תרבות אלטרנטיבית. בשנים האחרונות הורדת חלק מקו Odakyu מתחת לאדמה יצרה שטחים ציבוריים ומסחריים חדשים, והיה חשש שהפיתוח ימחק את האופי הישן; במקום זאת נוצר שילוב מורכב בין חדש לישן. לכן הרחובות הצרים, חנויות ה־vintage והופעות המוזיקה אינם רק 'וייב היפסטרי' — הם תוצאה של מאה שנה של הגירה פנימית, תרבות אמריקאית אחרי המלחמה וכלכלה שאפשרה ליוצרים לחיות קרוב למרכז.","infoSource":"https://www.japan.travel/en/spot/2108/"},{"id":"p_33e228bf3c4f","name":"Osaka Castle","city":"אוסקה","area":"Osaka Castle + Tenjinbashi","status":"רוצה","kind":"attraction","desc":"הטירה המרכזית של אוסקה והפארק שמסביבה. מתאימה לחצי יום של היסטוריה, גנים ותצפית.","duration":"1.5–2.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Osaka+Castle+Japan","booking":"","website":""},{"id":"p_db8ec5eeb85a","name":"Osaka Castle Park","city":"אוסקה","area":"Osaka Castle + Tenjinbashi","status":"רוצה","kind":"attraction","desc":"פארק רחב סביב הטירה עם שבילים, עצים ונקודות צילום.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Osaka+Castle+Park+Japan","booking":"","website":""},{"id":"p_05aa276494c5","name":"Tenjinbashi-suji Shopping Street","city":"אוסקה","area":"Osaka Castle + Tenjinbashi","status":"רוצה","kind":"attraction","desc":"אחד מרחובות הקניות המקורים הארוכים ביפן, עם אוכל, חנויות מקומיות ואווירה אוסקאית יומיומית.","duration":"1.5–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tenjinbashi-suji+Shopping+Street+Japan","booking":"","website":""},{"id":"p_bookoff_super_bazaar_omori","name":"BOOKOFF SUPER BAZAAR SEIYU Omori Store","city":"טוקיו","area":"Omori / Shinagawa","status":"רוצה","kind":"attraction","desc":"סניף BOOKOFF SUPER BAZAAR גדול בטוקיו עם ספרים, CD/DVD/Blu-ray, טלפונים, אלקטרוניקה, מוצרי חשמל, כלי נגינה, אופנה, כרטיסי אספנות, צעצועים, מותגים וכלי בית.","duration":"1.5–2 שעות","note":"לא באקיהברה — מתאים כעצירה נפרדת אם רוצים חוויית BOOKOFF SUPER BAZAAR גדולה.","maps":"https://www.google.com/maps/search/?api=1&query=BOOKOFF+SUPER+BAZAAR+SEIYU+Omori+Store+Tokyo+Japan","booking":"","website":""},{"id":"p_pokemon_center_tokyo_dx","name":"Pokémon Center TOKYO DX","city":"טוקיו","area":"Nihonbashi + Tokyo Station","status":"חובה","kind":"attraction","desc":"Pokémon Center גדול בניהונבאשי, עם מרצ'נדייז רחב, מוצרים בלעדיים ואזור Pokémon Café הסמוך. מתאים לשילוב עם Tokyo Station / Nihonbashi ביום מרכז טוקיו.","duration":"60–90 דק׳","note":"אפשר לשלב עם Pokémon Café אם משיגים הזמנה.","maps":"https://www.google.com/maps/search/?api=1&query=Pokemon+Center+TOKYO+DX+Nihonbashi+Tokyo+Japan","booking":"","website":""},{"name":"GINZA SIX + Rooftop Garden","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"מתחם עיצוב, אמנות וקמעונאות בלב גינזה. הדגש אצלנו הוא על האדריכלות, האמנות הציבורית וגינת הגג הגדולה — לא על עוד סבב קניות.","duration":"45–60 דק׳","note":"משתלב טבעית ביום Ginza. גינת הגג היא החלק החשוב.","maps":"https://www.google.com/maps/search/?api=1&query=GINZA+SIX+Tokyo","booking":"","website":"https://ginza6.tokyo/","id":"p_98d0feba9731","info":"GINZA SIX נפתח ב־2017 על מגרש שבו פעל במשך עשרות שנים Matsuzakaya Ginza, בית כלבו שהשורשים של החברה שלו מגיעים עוד לתקופת Edo. הפרויקט החדש איחד כמה חלקות גדולות בלב Ginza ונועד להיות יותר מקניון: האדריכל Yoshio Taniguchi תכנן את המעטפת, ובתוך הבניין שולבו אמנות ציבורית, חללי תרבות, תיאטרון Noh, GINZA TSUTAYA BOOKS וגינת גג גדולה. האטריום מארח עבודות אמנות מתחלפות בקנה מידה עצום, מה שממשיך מסורת ארוכה של בתי כלבו יפניים כנותני חסות לתרבות ולא רק כחנויות. גם הגג חשוב בהקשר של Ginza: זה אחד האזורים היקרים והצפופים במדינה, ובכל זאת הוקצה שטח גדול למרחב פתוח עם צמחייה ותצפית. הבניין מספר משהו על ההיסטוריה המתמשכת של Ginza מאז Meiji — רובע שמנסה בכל דור להציג את הגרסה החדשה ביותר של יפן דרך מסחר, ארכיטקטורה וטכנולוגיה. במקום שבו פעם היה בית כלבו קלאסי נבנה מתחם שמציג אמנות עכשווית ו־design לצד מותגי יוקרה. לכן כשעולים לגג, כדאי לראות את Ginza כמעבדה של מודרניות יפנית יותר מאשר רק אזור קניות.","infoSource":"https://ginza6.tokyo/art_en/"},{"name":"Kabukiza Theatre","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"בית הקבוקי האייקוני של גינזה. במסלול שלנו זו עצירת אדריכלות ותרבות קצרה מבחוץ/בלובי, בלי לבנות את היום סביב הופעה מלאה.","duration":"20–30 דק׳","note":"קרוב מאוד ל-Ginza Mitsukoshi ול-GINZA SIX.","maps":"https://www.google.com/maps/search/?api=1&query=Kabukiza+Theatre+Ginza+Tokyo","booking":"","website":"https://www.kabukiweb.net/theatres/kabukiza/","id":"p_4b5605ad0dd4","info":"Kabukiza נפתח לראשונה בנובמבר 1889, בתקופת Meiji, כאשר יפן ניסתה להגדיר מחדש את התרבות שלה מול המערב. המייסד Fukuchi Gen'ichirō היה עיתונאי ורפורמטור שרצה להעלות את מעמדו של kabuki ולהציג אותו כתיאטרון לאומי מכובד. המבנה הראשון שילב חזית מערבית ופנים יפני, ביטוי מושלם של תקופת Meiji. מאז ההיסטוריה של Kabukiza היא כמעט רצף של אסונות ושיקום. ב־1911 נבנה תיאטרון שני בסגנון יפני מפואר; הוא נשרף ב־1921 בגלל תקלה חשמלית. בזמן הבנייה מחדש פגעה רעידת Kantō של 1923 ועיכבה את הפרויקט. המבנה השלישי נפתח ב־1925 ונכנס ל'תור זהב' של kabuki, אך נהרס בהפצצות טוקיו במאי 1945. למרות מחסור חמור בחומרי בניין אחרי המלחמה, נבנה תיאטרון רביעי על בסיס חלקים ששרדו והוא נפתח ב־1951 — מעשה שהפך לסמל של חזרת התרבות לחיים אחרי ההרס. ב־2010 נסגר המבנה לשיקום מלא, וב־2013 נפתח Kabukiza החמישי, ששומר במכוון על הגגות, הקימורים והחזית המסורתית אך מחובר למגדל משרדים מודרני. לכן גם בלי לראות הצגה, הבניין עצמו מספר את ההיסטוריה של kabuki במאה ה־20: מסורת שעברה שריפה, רעידת אדמה, מלחמה ומודרניזציה ועדיין נמצאת בדיוק באותו מקום.","infoSource":"https://www.kabukiweb.net/about/theatre/history_kabukiza_theatre/"},{"name":"Ginza Mitsukoshi Depachika","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"קומת האוכל התת-קרקעית של Ginza Mitsukoshi — דוגמה מצוינת לתרבות ה-depachika היפנית. אצלנו זו עצירת התרשמות/נשנוש, לא ארוחה עיקרית.","duration":"30–40 דק׳","note":"Art Aquarium נמצא באותו מתחם, ולכן חיברנו אותם ברצף.","maps":"https://www.google.com/maps/search/?api=1&query=Ginza+Mitsukoshi+Tokyo","booking":"","website":"https://cp.mistore.jp/global/en/ginza.html","id":"p_c2afc1121926","info":"ה-Depachika של Ginza Mitsukoshi הוא עולם אוכל שלם בקומות המרתף של כלבו יפני קלאסי. אפשר לראות שם קונדיטוריה, wagashi, מנות מוכנות, חומרי גלם ומתנות אוכל ברמת תצוגה גבוהה מאוד. המטרה אצלנו היא להכיר את תרבות בתי הכלבו היפנית ולעשות סיבוב קצר לפני Art Aquarium שנמצא באותו מתחם."},{"name":"Tsukiji Outer Market","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"שוק האוכל החיצוני ההיסטורי של צוקיג׳י. השוק הסיטונאי עבר ל-Toyosu, אבל החנויות, הדוכנים והמסעדות של ה-Outer Market ממשיכים לפעול.","duration":"60–75 דק׳","note":"נכנס לבוקר של יום Ginza/Hamarikyu. לצמחוני: לבדוק היטב dashi/fish stock גם במנות שנראות צמחוניות.","maps":"https://www.google.com/maps/search/?api=1&query=Tsukiji+Outer+Market+Tokyo","booking":"","website":"https://www.tsukiji.or.jp/english/","id":"p_6b3bdf9de12d","info":"Tsukiji מתחיל בכלל מאסון. בשנת 1657 החריבה Great Fire of Meireki חלקים עצומים של Edo, והשוגונות החליטה לייבש שטח מן המפרץ כדי ליצור קרקע חדשה — מכאן השם Tsuki-ji, 'אדמה בנויה'. במשך זמן רב האזור כלל מקדשים ובתי samurai ולא היה מזוהה דווקא עם דגים. שוק הדגים הגיע לכאן רק אחרי אסון נוסף: רעידת Kantō של 1923 הרסה את Nihonbashi Fish Market, שפעל במרכז Edo/Tokyo מאות שנים. הממשלה בחרה להעביר את השוק ל־Tsukiji ובנתה מתקן סיטונאי מודרני שנפתח ב־1935. המעבר לא היה פשוט; סוחרים ותיקים נאלצו להסתגל ממבנה מסחרי פרטי למערכת של שוק סיטונאי מפוקח, והוויכוחים סביב זכויות וסדרי מסחר נמשכו שנים. בזמן המלחמה פעילות השוק הוגבלה, ולאחר הכיבוש האמריקאי היא נבנתה מחדש. בתקופת הצמיחה Tsukiji הפך לשוק הדגים הגדול והמפורסם בעולם וסמל בינלאומי של sushi. עם הזמן המבנים הזדקנו והעומס גדל, וב־2018 עבר השוק הסיטונאי ל־Toyosu. אבל מאות חנויות, ספקים ומסעדות מחוץ למתחם הרשמי נשארו — זהו Outer Market של היום. לכן זה לא 'שוק ישן שנשאר אחרי המעבר' אלא שכונה מסחרית שהצליחה לשרוד אובדן של המוסד המרכזי שלה. סכינים, אצות, tea, tamagoyaki וחומרי גלם מספרים את הסיפור לא פחות מהדגים.","infoSource":"https://www.tsukiji.or.jp/english/"},{"id":"ky_nishiki_tenmangu","name":"Nishiki Tenmangū","city":"קיוטו","area":"Central Kyoto","status":"רוצה","kind":"attraction","duration":"20–30 דק׳","kyotoMinutes":25,"desc":"מקדש שינטו קטן בקצה המזרחי של Nishiki Market, מוקדש ל-Sugawara no Michizane.","info":"Nishiki Tenmangū יושב ממש במקום שבו שוק Nishiki מתחבר לאזור Teramachi/Shinkyōgoku. הוא קטן, אבל זו בדיוק הסיבה שהוא שימושי: הוא מוסיף שכבת שינטו וחיי שכונה ליום שמבוסס אחרת על אוכל וקניות. במסמך 1711 הוא הוצג כמעבר טבעי מהשוק אל הארקדות.","kyotoWhy":"כמעט אפס סטייה מהמסלול אם עושים Nishiki; תמורה גבוהה לזמן קצר.","kyotoCombine":"Nishiki Market → Nishiki Tenmangū → Teramachi → Shinkyōgoku.","kyotoSources":["1711"],"maps":"https://www.google.com/maps/search/?api=1&query=Nishiki+Tenmangu+Kyoto","youtube":"https://www.youtube.com/results?search_query=Nishiki+Tenmangu+Kyoto","website":"","kyotoCandidate":true,"note":"","booking":""},{"id":"ky_gion_corner","name":"Gion Corner","city":"קיוטו","area":"Higashiyama + Gion","status":"אולי","kind":"experience","duration":"60–75 דק׳","kyotoMinutes":70,"desc":"מופע מבוא לכמה אמנויות מסורתיות יפניות במקום אחד, בלב Gion.","info":"Gion Corner הופיע בגיליונות המקור כ-POI בקיוטו. היתרון שלו הוא ריכוז של כמה אמנויות במה ומסורות לערב אחד, כך שהוא יכול לתת הקשר למה שרואים ברחובות Gion בלי לחפש מופע מלא של תחום אחד.","kyotoWhy":"טוב אם רוצים ערב תרבותי מובנה במקום עוד שיטוט חופשי.","kyotoCombine":"Gion / Yasaka / Pontocho בערב.","kyotoSources":["Japan 2025"],"maps":"https://www.google.com/maps/search/?api=1&query=Gion+Corner+Kyoto","youtube":"https://www.youtube.com/results?search_query=Gion+Corner+Kyoto+Japan","website":"","kyotoCandidate":true,"note":"","booking":""},{"id":"ky_yasui_konpiragu","name":"Yasui Konpiragu Shrine","city":"קיוטו","area":"Higashiyama + Gion","status":"אולי","kind":"attraction","duration":"20–35 דק׳","kyotoMinutes":30,"desc":"מקדש שינטו קטן ומוזר יחסית, ידוע באבן Enkiri/Enmusubi ובטקסי 'ניתוק קשרים רעים וחיבור קשרים טובים'.","info":"במסמך 'יפן' הופיע תיאור מפורט של טקס שבו כותבים על katashiro מה רוצים לנתק, עוברים דרך פתח באבן ומדביקים את הפתק. זהו Yasui Konpiragu. זו חוויה יפנית מאוד שונה מהאתרים הגדולים ויכולה להיות עצירה קצרה ומעניינת בין Kiyomizu/Gion.","kyotoWhy":"ייחודי, קצר, ומוסיף חוויה פעילה במקום עוד מקדש 'לראות'.","kyotoCombine":"Kōdai-ji / Gion / Kennin-ji.","kyotoSources":["יפן.docx"],"maps":"https://www.google.com/maps/search/?api=1&query=Yasui+Konpiragu+Shrine+Kyoto","youtube":"https://www.youtube.com/results?search_query=Yasui+Konpiragu+Shrine+Kyoto","website":"","kyotoCandidate":true,"note":"","booking":""},{"id":"ky_okazaki_canal","name":"Okazaki Canal","city":"קיוטו","area":"Nanzen-ji + Eikando","status":"אולי","kind":"attraction","duration":"30–45 דק׳","kyotoMinutes":40,"desc":"תעלה באזור Okazaki, קרובה ל-Nanzen-ji ולמוזיאונים; הליכה עירונית נעימה לצד מים.","info":"מאמר אל-על הזכיר את תעלת Okazaki כאחד מנופי קיוטו. היא פחות יעד עצמאי ויותר קטע מעבר מוצלח שמחבר בין Nanzen-ji, אזור המוזיאונים והעיר המודרנית. בתחילת דצמבר הערך תלוי במזג האוויר ובצבעי העונה.","kyotoWhy":"טוב אם רוצים יום מזרח Kyoto פחות צפוף ועם יותר הליכה פתוחה.","kyotoCombine":"Nanzen-ji / Eikandō / Heian-Okazaki area.","kyotoSources":["ELAL"],"maps":"https://www.google.com/maps/search/?api=1&query=Okazaki+Canal+Kyoto","youtube":"https://www.youtube.com/results?search_query=Okazaki+Canal+Kyoto","website":"","kyotoCandidate":true,"note":"","booking":""},{"id":"ky_tofukuji","name":"Tōfuku-ji","city":"קיוטו","area":"Fushimi","status":"רוצה","kind":"attraction","duration":"75–100 דק׳","kyotoMinutes":90,"desc":"מקדש Zen גדול עם גשר Tsūtenkyō, עמק מייפלים וגני Hōjō מודרניים.","info":"במסמך 2111 Tōfuku-ji הוא החוליה המרכזית בין Fushimi Inari לרובע הסאקה. הוא אחד ממקדשי הזן הגדולים בקיוטו ושמו משלב את Tōdai-ji ו-Kōfuku-ji מנארה. Tsūtenkyō חוצה עמק מלא מייפלים, ולכן בסוף נובמבר/תחילת דצמבר המקום יכול להיות מהחזקים בעיר לשלכת.","kyotoWhy":"אם השלכת עדיין טובה ב-1–3 בדצמבר, זו אחת התוספות הכי חזקות למסלול.","kyotoCombine":"Fushimi Inari → Tōfuku-ji → Fushimi Sake District.","kyotoSources":["2111"],"maps":"https://www.google.com/maps/search/?api=1&query=Tofuku-ji+Temple+Kyoto","youtube":"https://www.youtube.com/results?search_query=Tofukuji+Kyoto+autumn","website":"https://tofukuji.jp/english/","kyotoCandidate":true,"note":"","booking":""},{"id":"ky_gekkeikan","name":"Gekkeikan Ōkura Sake Museum","city":"קיוטו","area":"Fushimi","status":"רוצה","kind":"experience","duration":"60–75 דק׳","kyotoMinutes":65,"desc":"מוזיאון במבשלת sake היסטורית שמסביר את ייצור הסאקה והמסורת של Fushimi.","info":"המסמך 2111 הציע את המוזיאון כעוגן של אזור הסאקה, לא רק כטעימה. התצוגות מציגות כלי ייצור מסורתיים, תפקיד המים, האורז, koji והתסיסה. כך Fushimi הופך משכונה יפה לסיפור של תעשייה ומלאכה מקומית.","kyotoWhy":"מוסיף תוכן אמיתי לרובע Fushimi; טוב גם אם לא שותים הרבה.","kyotoCombine":"Fushimi Sake District + canal walk.","kyotoSources":["2111"],"maps":"https://www.google.com/maps/search/?api=1&query=Gekkeikan+Okura+Sake+Museum+Kyoto","youtube":"https://www.youtube.com/results?search_query=Gekkeikan+Okura+Sake+Museum+Kyoto","website":"","kyotoCandidate":true,"note":"","booking":""},{"id":"ky_fushimi_canal","name":"Fushimi Canal & Brewery Streets","city":"קיוטו","area":"Fushimi","status":"רוצה","kind":"attraction","duration":"45–75 דק׳","kyotoMinutes":60,"desc":"הליכה רגועה בין תעלות, בתי מבשלה, מחסנים וגשרים ברובע Fushimi.","info":"במסמך 2111 הודגש שלא כדאי להפוך את אזור הסאקה רק לביקור במוזיאון. אחרי Gekkeikan מומלץ להסתובב ברחובות, לראות את הבנייה המסורתית, חביות הסאקה והתעלות ששימשו בעבר להובלה. זה חלק נינוח ושונה לחלוטין מהמסלול של המקדשים.","kyotoWhy":"מוסיף 'קיוטו חיה' ושקטה, כמעט בלי לחץ של אתר רשמי.","kyotoCombine":"Gekkeikan + Fushimi Sake District.","kyotoSources":["2111"],"maps":"https://www.google.com/maps/search/?api=1&query=Fushimi+Sake+District+Kyoto+canal","youtube":"https://www.youtube.com/results?search_query=Fushimi+sake+district+Kyoto+walk","website":"","kyotoCandidate":true,"note":"","booking":""},{"id":"ky_manga_museum","name":"Kyoto International Manga Museum","city":"קיוטו","area":"Central Kyoto","status":"רוצה","kind":"experience","duration":"60–120 דק׳","kyotoMinutes":90,"desc":"מוזיאון/ספרייה עם מאות אלפי פריטי מנגה, תערוכות והיסטוריה של המדיום.","info":"במסמך 2211 המוזיאון נבחר בכוונה כדי להראות צד אחר של יפן מעבר למקדשים. הוא שוכן בבית ספר לשעבר מ-1929 ומשלב מוזיאון מחקרי עם ספרייה שבה אפשר ממש לקחת ספרים ולקרוא. נכון לסתיו 2026 מתקיימת בו גם תערוכה על 40 שנות Manga באירופה.","kyotoWhy":"מתאים מאוד לעניין שלכם ב-Nintendo/תרבות פופ ונותן גיוון ביום של קיוטו.","kyotoCombine":"Nijo Castle / Kyoto Gyoen / tea ceremony.","kyotoSources":["2211"],"maps":"https://www.google.com/maps/search/?api=1&query=Kyoto+International+Manga+Museum","youtube":"https://www.youtube.com/results?search_query=Kyoto+International+Manga+Museum","website":"https://kyotomm.jp/en/","infoSource":"https://kyoto.travel/en/destinations/kyoto-international-manga-museum/","kyotoCandidate":true,"note":"","booking":""},{"id":"ky_cooking_class","name":"Traditional Kyoto Cooking Class","city":"קיוטו","area":"Central Kyoto","status":"אולי","kind":"experience","duration":"2–3 ש׳","kyotoMinutes":150,"desc":"סדנת בישול מעשית של אוכל קיוטואי/יפני — חוויה במקום עוד אתר.","info":"מסמך 2211 בנה יום 'Living Kyoto' שמתחיל בבישול, כדי להבין את העיר דרך חומרי גלם וטכניקות ולא רק דרך מבנים. זו פעילות ארוכה יחסית, אבל היא נותנת זיכרון וחוויה משות async function fetchJsonTimeout(url, ms){
  const ctl=new AbortController();
  const t=setTimeout(()=>ctl.abort(), ms||6500);
  try{
    const r=await fetch(url,{signal:ctl.signal,cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
async function youtubeSecondResult(name){
  const q=encodeURIComponent(name+' Japan travel');
  const endpoints=[
    'https://yewtu.be/api/v1/search?q='+q+'&type=video&sort_by=relevance',
    'https://inv.nadeko.net/api/v1/search?q='+q+'&type=video&sort_by=relevance',
    'https://invidious.nerdvpn.de/api/v1/search?q='+q+'&type=video&sort_by=relevance',
    'https://invidious.privacyredirect.com/api/v1/search?q='+q+'&type=video&sort_by=relevance'
  ];
  for(const url of endpoints){
    try{
      const rows=await fetchJsonTimeout(url,6200);
      const vids=Array.isArray(rows)?rows.filter(v=>v && v.videoId):[];
      if(vids.length>=2){
        const v=vids[1]; /* תמיד התוצאה השנייה */
        return {
          videoId:v.videoId,
          youtube:'https://www.youtube.com/watch?v='+encodeURIComponent(v.videoId),
          youtubeTitle:v.title||''
        };
      }
    }catch(e){}
  }
  return null;
}
function normEntity(s){
  return String(s||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}
function imageQueryName(name){
  if(IMAGE_ALIASES[name]) return IMAGE_ALIASES[name];
  /* Composite itinerary labels are not safe to guess. If there is no explicit alias, use the full card name. */
  return String(name||'').trim();
}
function entityAccepts(query, row){
  const q=normEntity(query);
  const label=normEntity(row&&row.label);
  if(!q || !label) return false;
  /* Correct-only policy: exact entity label or very close containment. */
  if(label===q) return true;
  if(q.length>=10 && (label.includes(q) || q.includes(label))){
    const shorter=Math.min(q.length,label.length), longer=Math.max(q.length,label.length);
    return shorter/longer>=0.78;
  }
  return false;
}
async function strictWikidataImage(name){
  const query=imageQueryName(name);
  if(!query) return null;
  try{
    const search='https://www.wikidata.org/w/api.php?origin=*&action=wbsearchentities'
      +'&search='+encodeURIComponent(query)+'&language=en&uselang=en&type=item&limit=6&format=json';
    const j=await fetchJsonTimeout(search,6500);
    const rows=Array.isArray(j&&j.search)?j.search:[];
    const hit=rows.find(r=>entityAccepts(query,r));
    if(!hit || !hit.id) return null;

    const detail='https://www.wikidata.org/w/api.php?origin=*&action=wbgetentities'
      +'&ids='+encodeURIComponent(hit.id)+'&props=claims|labels|descriptions&languages=en&format=json';
    const d=await fetchJsonTimeout(detail,6500);
    const ent=d&&d.entities&&d.entities[hit.id];
    const p18=ent&&ent.claims&&ent.claims.P18&&ent.claims.P18[0];
    const filename=p18&&p18.mainsnak&&p18.mainsnak.datavalue&&p18.mainsnak.datavalue.value;
    if(!filename) return null;
    return {
      image:'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(filename)+'?width=1000',
      entityId:hit.id,
      entityLabel:hit.label||query
    };
  }catch(e){ return null; }
}
async function resolveMedia(name){
  const key=String(name||'').trim();
  if(!key) return {};
  const cached=live.media[key];
  if(cached && cached.mediaVersion===67){
    if(cached.youtube || cached.image) return cached;
    if(cached.failedAt && Date.now()-cached.failedAt<MEDIA_FAIL_TTL) return cached;
  }
  const [ytR,imgR]=await Promise.allSettled([youtubeSecondResult(key), strictWikidataImage(key)]);
  const yt=ytR.status==='fulfilled'?ytR.value:null;
  const img=imgR.status==='fulfilled'?imgR.value:null;
  const result={
    mediaVersion:67,
    youtube:yt&&yt.youtube?yt.youtube:'',
    youtubeTitle:yt&&yt.youtubeTitle?yt.youtubeTitle:'',
    videoId:yt&&yt.videoId?yt.videoId:'',
    image:img&&img.image?img.image:'',
    imageEntity:img&&img.entityLabel?img.entityLabel:'',
    imageEntityId:img&&img.entityId?img.entityId:'',
    failedAt:(!(yt&&yt.youtube) && !(img&&img.image))?Date.now():0
  };
  live.media[key]=result;
  saveMediaSoon();
  return result;
}

        +'<div class="media-image-note">תמונה מזוהה לפי הישות המדויקת: '+esc(m.imageEntity||name)+'</div>';
    }else{

      y.textContent='▶ YouTube · תוצאה #2';
    }else{
      /* הכפתור לעולם לא נעלם: במקרה שה-API חסום הוא פותח את החיפוש. */
      y.dataset.href=ytSearchUrl(name);
      y.textContent='▶ YouTube · חיפוש';
    }
  }
  const s=el.querySelector('.media-status');
  if(s){
    s.textContent=(m&&m.image)?'תמונה מדויקת':'אין תמונה מאומתת';
  }
  el.dataset.mediaState='done';
}
async function loadMediaEl(el){
  if(!el || el.dataset.mediaState==='loading' || el.dataset.mediaState==='done') return;
  el.dataset.mediaState='loading';
  const m=await resolveMedia(el.dataset.mediaName||'');
  paintMedia(el,m);
}
function hydrateMedia(){
  if(mediaObserver){ try{mediaObserver.disconnect();}catch(e){} }
  const els=[...document.querySelectorAll('[data-media-name]')];
  els.forEach(el=>{
    const c=live.media[el.dataset.mediaName||''];
    if(c && c.mediaVersion===67 && (c.youtube||c.image||c.failedAt)) paintMedia(el,c);
  });
  const pending=els.filter(el=>el.dataset.mediaState!=='done');
  if(!pending.length) return;
  if('IntersectionObserver' in window){
    mediaObserver=new IntersectionObserver(entries=>{
      entries.forEach(en=>{
        if(en.isIntersecting){
          mediaObserver.unobserve(en.target);
          loadMediaEl(en.target);
        }
      });
    },{rootMargin:'260px 0px'});
    pending.forEach(el=>mediaObserver.observe(el));
  }else{
    pending.slice(0,12).forEach(loadMediaEl);
  }
}
function openMediaYoutube(target){
  const y=target&&target.closest?target.closest('[data-media-youtube]'):null;
  if(!y || !y.dataset.href) return false;
  window.open(y.dataset.href,'_blank','noopener');
  return true;
}

function todayId(){

function activeDay(){

function shown(day, index){
  const base=day.items[index];
  const repl=live.replace[base.uid];
  const it=repl? Object.assign({}, base, repl) : base;
  if(it.start==null) return it;
  let extra = live.done[it.uid] ? 0 : (live.delay[day.id]||0);
  for(let i=0;i<index;i++) extra += live.cascade[day.items[i].uid]||0;
  const own = live.cascade[it.uid]||0;
  const start=it.start+extra, end=(it.end==null?it.start:it.end)+extra+own;
  return Object.assign({}, it, {time: fmt(start)+'–'+fmt(end), start, end});
}
function visibleItems(day){
  return day.items.map((it,i)=>({it:shown(day,i), i})).filter(x=>!live.skipped[x.it.uid]);
}
function currentIndex(day){
  const rows=visibleItems(day);
  const hit=rows.find(x=>!live.done[x.it.uid]);

}

function scheduledDaysForPlace(p){

function kyotoExportOrderMap(day){
  const d=KYOTO_VIDEO_ROUTE.find(x=>String(x.day)===String(day));

}
function kyotoExportRows(day,highOnly){
  const ord=kyotoExportOrderMap(day);
  const rank={'חובה':0,'רוצה':1,'אולי':2,'לא':3};
  return TRIP.places.filter(p=>{
    if(!p.kyotoCandidate || kyotoAssignment(p)!==String(day) || planStatus(p)==='לא') return false;
    if(highOnly && !['חובה','רוצה'].includes(planStatus(p))) return false;
    return true;
  }).sort((a,b)=>{
    const ao=ord.has(a.id)?ord.get(a.id):999, bo=ord.has(b.id)?ord.get(b.id):999;
    return ao-bo || (rank[planStatus(a)]??9)-(rank[planStatus(b)]??9) || (a.area||'').localeCompare(b.area||'') || a.name.localeCompare(b.name);

function kyotoLocationLabel(p){ return [p.name,p.area,'Kyoto','Japan'].filter(Boolean).join(', '); }

function kyotoDirectionsUrl(rows){
  if(!rows.length) return '';
  if(rows.length===1) return rows[0].maps || ('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(kyotoLocationLabel(rows[0])));

  return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(origin)+'&destination='+encodeURIComponent(dest)+(wp?'&waypoints='+encodeURIComponent(wp):'')+'&dir_action=navigate';

  for(let i=0;i<rows.length;i+=9){
    let part=rows.slice(i,i+10);
    if(i>0 && rows[i-1] && part[0]!==rows[i-1]) part=[rows[i-1]].concat(rows.slice(i,i+9));
    chunks.push(part);
  }
  return chunks.map((r,i)=>'<a class="route" target="_blank" rel="noopener" href="'+esc(kyotoDirectionsUrl(r))+'">🗺️ מסלול Maps'+(chunks.length>1?' '+(i+1):'')+'</a>').join('');

    if(row.it.part && row.it.part!==part){ part=row.it.part; html+='<div class="block">'+esc(part)+'</div>'; }
    html+='<div class="row-shell"><button class="row'+(row.it.transit?' transit':'')+'" data-open="'+esc(row.it.uid)+'" type="button"><span class="t">'+(row.it.time?esc(row.it.time):'הבא')+'</span><span class="n">'+esc(row.it.name)+'</span></button><button class="info-btn" data-info-item="'+esc(row.it.uid)+'" type="button" aria-label="מידע על '+esc(row.it.name)+'">i</button></div>';
    if(row.it.hop) html+='<div class="hop">↓ '+esc(row.it.hop)+'</div>';
  });
  const skipped=day.items.filter(it=>live.skipped[it.uid]);
  if(skipped.length) html+='<button class="fold" id="show-skip" type="button">דולגו · '+skipped.length+'</button><div id="skip-list" class="hidden"></div>';
  if(day.night.length){
    html+='<div class="block">אם נשאר כוח</div><div class="night"><p>לא חלק מהלוח. בוחרים לפי אנרגיה.</p>';
    day.night.forEach(n=>{ html+= n.maps? '<a class="chip" target="_blank" rel="noopener" href="'+esc(n.maps)+'">'+esc(n.name)+'</a>' : '<span class="chip">'+esc(n.name)+'</span>'; });
    html+='</div>';
  }
  return html;
}

function restaurantYoutubeUrl(r){

}
function restaurantPhotosUrl(r){
  return 'https://www.google.com/search?tbm=isch&q='+encodeURIComponent(r.name+' '+r.city+' restaurant');
}
function restaurantCityGroup(r){
  if(r.city==='טוקיו') return 'טוקיו';
  if(r.city==='קיוטו') return 'קיוטו';
  if(r.city==='אוסקה') return 'אוסקה';
  if(r.area==='Nara' || r.city==='נארה' || r.city==='מסביב לאוסקה') return 'נארה';
  return r.city||'אחר';
}
function filteredRestaurants(){
  const q=(restaurantQuery||'').trim().toLowerCase();
  return RESTAURANTS.filter(r=>{
    if(restaurantCityFilter!=='הכל' && restaurantCityGroup(r)!==restaurantCityFilter) return false;
    if(restaurantFilter!=='הכל' && r.dietKey!==restaurantFilter) return false;
    if(q && (r.name+' '+r.city+' '+r.area+' '+(r.kind||'')+' '+r.dietLabel+' '+r.dietDetail+' '+r.desc+' '+restaurantCityGroup(r)).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}
function restaurantBadgeClass(key){
  if(key==='vegan') return 'diet-vegan';
  if(key==='vegetarian') return 'diet-vegetarian';

function markDone(){

}
function savedHtml(){
  const snap={snapshotId:'snap-'+Date.now().toString(36), savedAt:new Date().toISOString(), version:'v87', live:live};
  const close='</'+'script>';
  let html=document.documentElement.outerHTML;
  if(!html.startsWith('<!DOCTYPE')) html='<!DOCTYPE html>\n'+html;
  html=html.replace(/<div class="app" id="app">[\s\S]*?<!-- \/app -->/,'<div class="app" id="app"></div>\n<!-- /app -->');
  html=html.replace(/<div id="sheet">[\s\S]*?<\/div>\s*<div id="toast"/,'<div id="sheet"></div>\n<div id="toast"');
  const json=JSON.stringify(snap).replace(/</g,'\\u003c');
  html=html.replace(new RegExp('<script id="japan26-full-snapshot" type="application/json">[\\s\\S]*?'+close), '<script id="japan26-full-snapshot" type="application/json">'+json+close);
  return html;
}

  a.download='japan_2026_trip_dashboard_v82_kyoto_maps_export.html';
  document.body.appendChild(a); a.click(); a.remove();
  toast('אם הקובץ לא נשמר: כפתור השיתוף של Safari, ואז שמור לקבצים');
}

document.querySelector('.modebar').onclick=e=>{
  const b=e.target.closest('[data-mode]');
  if(!b) return;
  appMode=b.dataset.mode==='plan'?'plan':'execute';
  live.appMode=appMode;
  sheet=null; persist(); render();
};
document.querySelector('.nav').onclick=e=>{
  const b=e.target.closest('[data-tab]');
  if(!b) return;
  tab=b.dataset.tab; sheet=null; render();
};
document.getElementById('app').onclick=e=>{
  if(openMediaYoutube(e.target)){ e.preventDefault(); e.stopPropagation(); return; }
  const dayBtn=e.target.closest('[data-day]');
  if(dayBtn){ setDay(dayBtn.dataset.day); return; }
  const ptab=e.target.closest('[data-plan-tab]');
  if(ptab){ planTab=ptab.dataset.planTab; sheet=null; render(); return; }
  const pcity=e.target.closest('[data-plan-city]');
  if(pcity){ planCityFilter=pcity.dataset.planCity; planAreaFilter='הכל'; render(); return; }
  const pkind=e.target.closest('[data-plan-kind]');
  if(pkind){ planKindFilter=pkind.dataset.planKind; render(); return; }
  const psf=e.target.closest('[data-plan-status-filter]');
  if(psf){ planStatusFilter=psf.dataset.planStatusFilter; render(); return; }
  const pst=e.target.closest('[data-plan-id][data-plan-status]');
  if(pst){ setPlanStatus(pst.dataset.planId,pst.dataset.planStatus); render(); return; }
  if(e.target.closest('#apply-video-route')){ applyKyotoVideoRoute(); render(); return; }
  const kexp=e.target.closest('[data-kexport]');
  if(kexp){
    const action=kexp.dataset.kexport, day=kexp.dataset.kday||'', high=kexp.dataset.khigh==='1';
    if(action==='csv') downloadKyotoCsv(day,high);
    else if(action==='allcsv') downloadKyotoAllCsv(high);
    else if(action==='threecsv') downloadKyotoThreeCsv(high);
    else if(action==='kml') downloadKyotoKml(day,high);
    else if(action==='kmlall') downloadKyotoKml('',high);
    else if(action==='copy') copyKyoto([day],high);
    else if(action==='copyall') copyKyoto(['1','2','3'],high);
    return;
  }
  const kassign=e.target.closest('[data-kyoto-id][data-kyoto-day]');
  if(kassign){ setKyotoAssignment(kassign.dataset.kyotoId,kassign.dataset.kyotoDay); render(); return; }
  const karea=e.target.closest('[data-kyoto-area]');
  if(karea){ kyotoAreaFilter=karea.dataset.kyotoArea; render(); return; }
  const kkind=e.target.closest('[data-kyoto-kind]');
  if(kkind){ kyotoKindFilter=kkind.dataset.kyotoKind; render(); return; }
  const kassf=e.target.closest('[data-kyoto-assignment]');
  if(kassf){ kyotoAssignmentFilter=kassf.dataset.kyotoAssignment; render(); return; }
  if(e.target.closest('#done')) return markDone();
  if(e.target.closest('#late')){ const d=activeDay(); live.delay[d.id]=(live.delay[d.id]||0)+15; persist(); render(); return; }
  const infoCurrent=e.target.closest('[data-info-current]');
  if(infoCurrent){ sheet={mode:'item', uid:infoCurrent.dataset.infoCurrent}; render(); return; }
  const infoItem=e.target.closest('[data-info-item]');
  if(infoItem){ sheet={mode:'item', uid:infoItem.dataset.infoItem}; render(); return; }
  const infoPlace=e.target.closest('[data-info-place]');
  if(infoPlace){ sheet={mode:'place', id:infoPlace.dataset.infoPlace}; render(); return; }
  const open=e.target.closest('[data-open]');
  if(open){ sheet={mode:'item', uid:open.dataset.open}; render(); return; }
  const undone=e.target.closest('[data-undone]');
  if(undone){ delete live.done[undone.dataset.undone]; persist(); render(); return; }
  if(e.target.id==='show-skip'){
    const box=document.getElementById('skip-list');
    const day=activeDay();
    box.classList.toggle('hidden');
    box.innerHTML=day.items.filter(it=>live.skipped[it.uid]).map(it=>'<button class="row" data-unskip="'+esc(it.uid)+'" type="button"><span class="n">'+esc(it.name)+'</span></button>').join('');
    return;
  }
  const unskip=e.target.closest('[data-unskip]');
  if(unskip){ delete live.skipped[unskip.dataset.unskip]; persist(); render(); return; }
  const rc=e.target.closest('[data-rcity]');
  if(rc){ restaurantCityFilter=rc.dataset.rcity; render(); return; }
  const rf=e.target.closest('[data-rfilter]');
  if(rf){ restaurantFilter=rf.dataset.rfilter; render(); return; }
  const f=e.target.closest('[data-filter]');
  if(f){ placeFilter=f.dataset.filter; render(); return; }
  const card=e.target.closest('[data-place]');
  if(card){ sheet={mode:'place', id:card.dataset.place}; render(); return; }
  if(e.target.id==='save-full') saveFull();
};
document.getElementById('app').oninput=e=>{
  if(e.target.id==='kyoto-q'){ kyotoQuery=e.target.value; render(); return; }
  if(e.target.id==='plan-q'){ planQuery=e.target.value; render(); return; }
  if(e.target.id==='rq'){
    restaurantQuery=e.target.value;
    const rows=filteredRestaurants();
    const count=document.getElementById('restaurant-count');
    const list=document.getElementById('restaurant-list');
    if(count) count.textContent=rows.length+' מקומות';
    if(list) list.innerHTML=restaurantCards(rows);
    return;
  }
  if(e.target.id==='q'){
    query=e.target.value;
    const rows=filteredPlaces();
    const count=document.getElementById('place-count');
    const list=document.getElementById('place-list');
    if(count) count.textContent=rows.length+' במאגר';
    if(list) list.innerHTML=placeCards(rows);
    requestAnimationFrame(hydrateMedia);
  }
};
document.getElementById('app').onchange=e=>{
  if(e.target.id==='plan-area'){ planAreaFilter=e.target.value; render(); return; }
};
document.getElementById('sheet').onclick=e=>{
  if(openMediaYoutube(e.target)){ e.preventDefault(); e.stopPropagation(); return; }
  const pst=e.target.closest('[data-plan-id][data-plan-status]');
  if(pst){ setPlanStatus(pst.dataset.planId,pst.dataset.planStatus); render(); return; }
  if(e.target.dataset.close){ sheet=null; render(); return; }
  if(e.target.id==='skip'){
    const uid=sheet.uid;
    live.skipped[uid]=true; sheet=null; persist(); render();
    toast('דולג', ()=>{ delete live.skipped[uid]; persist(); render(); document.getElementById('toast').classList.add('hidden'); });
    return;
  }
  if(e.target.id==='longer' || e.target.id==='shorter'){
    const delta=e.target.id==='longer'?15:-15;
    live.cascade[sheet.uid]=(live.cascade[sheet.uid]||0)+delta;
    persist(); render(); return;
  }
  if(e.target.id==='swap'){ sheet={mode:'swap', uid:sheet.uid, q:''}; render(); return; }
  const pick=e.target.closest('[data-pick]');
  if(pick){
    const p=TRIP.places.find(x=>x.id===pick.dataset.pick);
    const day=activeDay();
    const it=day.items.find(x=>x.uid===sheet.uid);
    if(p && it && day.scope.indexOf(p.city)>=0){
      live.replace[it.uid]={name:p.name, desc:p.desc||'', maps:p.maps||'', kind:p.kind==='food'?'מסעדה / אוכל':it.kind};
      persist();
    }
    sheet=null; render(); return;
  }
};
document.getElementById('sheet').oninput=e=>{
  if(e.target.id==='note' && sheet){ live.notes[sheet.uid]=e.target.value; persist(); }
  if(e.target.id==='swap-q' && sheet){
    sheet.q=e.target.value;
    const list=document.getElementById('swap-list');
    if(list) list.innerHTML=swapCards(swapMatches());
    requestAnimationFrame(hydrateMedia);
  }
};
render();
matchMedia('(min-width:960px)').addEventListener('change', function(){ render(); });
const onPill=document.querySelector('.pill.on');
if(onPill && onPill.parentElement){
  const box=onPill.parentElement;
  box.scrollLeft = onPill.offsetLeft - (box.clientWidth-onPill.offsetWidth)/2;
}
</script>
</body>
</html>
