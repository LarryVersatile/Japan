+ Harajuku","status":"רוצה","kind":"attraction","desc":"רחוב אופנתי בין שיבויה להראג'וקו עם בוטיקים, קפה וחנויות מיוחדות.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Cat+Street+Japan","booking":"","website":"","info":"Cat Street הוא אחד הרחובות שמספרים בצורה הטובה ביותר את השינוי של Harajuku משכונת מגורים שקטה לאזור המזוהה בעולם עם אופנת רחוב. בניגוד ל־Takeshita Street, שהפכה צפופה, צבעונית ומסחרית מאוד, Cat Street התפתחה כציר צדדי בין Harajuku לשיבויה והפכה עם השנים למקום שבו חנויות עצמאיות, מותגי streetwear, בתי קפה ובוטיקים קטנים יכלו להתקיים מחוץ לשדרה הראשית. בשנות ה־80 וה־90, כאשר מגזיני אופנה יפניים התחילו לתעד צעירים ברחובות Harajuku ולא רק דגמים באולפנים, רחובות הצד באזור קיבלו חשיבות תרבותית: הם היו המקום שבו סגנונות נולדו, נצפו, צולמו והועתקו. Cat Street משקפת את המעבר הזה מתרבות צעירה ספונטנית לתעשיית אופנה שלמה, אבל עדיין נשאר בה משהו פחות רשמי מהחנויות הגדולות של Omotesando. כשעוברים בה, כדאי לראות את הרחוב עצמו כארכיון חי של אופנת Tokyo street: מבנים נמוכים, חללים שהוסבו שוב ושוב, חנויות קטנות ליד מותגים גלובליים, ומעבר הדרגתי מאוד מהאווירה של Harajuku אל Shibuya. זה אינו אתר עם 'אירוע היסטורי אחד', אלא מקום שבו תהליך תרבותי של כמה עשורים התרחש ממש ברחוב.","infoSource":"https://www.gotokyo.org/en/destinations/western-tokyo/harajuku/index.html"},{"id":"p_e70c6ae645e4","name":"Omotesando","city":"טוקיו","area":"Shibuya + Harajuku","status":"רוצה","kind":"attraction","desc":"שדרה אלגנטית עם אדריכלות, חנויות דגל ובתי קפה.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Omotesando+Japan","booking":"","website":"","info":"Omotesandō פירושו 'דרך הגישה הקדמית', והשם שלה מזכיר שהשדרה נוצרה בראש ובראשונה כדרך הטקסית המובילה אל Meiji Jingu, שנחנך ב־1920. עצי ה־zelkova שלאורך הרחוב והפנסים המסורתיים עדיין משמרים משהו מהתפקיד המקורי הזה. אחרי מלחמת העולם השנייה השתנה האזור במהירות: סמוך ל־Harajuku הוקם Washington Heights עבור הצבא האמריקאי, והנוכחות האמריקאית הכניסה לאזור השפעות של אופנה, מוזיקה וסגנון חיים מערבי. לקראת אולימפיאדת טוקיו 1964, כאשר Washington Heights פונה וחלק מהשטח הפך לכפר האולימפי, Harajuku ו־Omotesando הפכו לחשופים עוד יותר לתיירים, ספורטאים ותרבות בינלאומית. משנות ה־70 וה־80 החלו מותגים ובתי אופנה להשתמש בשדרה כבמת תצוגה, ובהמשך הגיעו אדריכלים מהבולטים בעולם: Tadao Ando תכנן את Omotesando Hills, Herzog & de Meuron את Prada Aoyama, ואחרים יצרו חזיתות שהפכו את הרחוב למעין מוזיאון אדריכלות פתוח. לכן Omotesando מעניינת דווקא בגלל הסתירה שלה: שדרה שנולדה כדרך למקדש לזכר קיסר Meiji הפכה בתוך מאה שנה לאחד המרכזים הבולטים של אופנה, אדריכלות וגלובליזציה ביפן.","infoSource":"https://www.gotokyo.org/en/destinations/western-tokyo/aoyama-and-omotesando/index.html"},{"id":"p_7e208fa562af","name":"Takeshita Street","city":"טוקיו","area":"Shibuya + Harajuku","status":"רוצה","kind":"attraction","desc":"רחוב צבעוני בהראג'וקו עם אופנה צעירה, מתוקים וחנויות קטנות.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Takeshita+Street+Japan","booking":"","website":"","info":"Takeshita-dori הפכה לסמל של Harajuku בעיקר משנות ה־70 וה־80, אבל הסיפור מתחיל כבר אחרי מלחמת העולם השנייה. באזור הסמוך פעל Washington Heights, מתחם מגורים אמריקאי, והמפגש עם חיילים, משפחות אמריקאיות, מוזיקה ומותגים מחו\"ל יצר סביב Harajuku סביבה שונה מאוד משכונות אחרות בטוקיו. אחרי אולימפיאדת 1964 ופתיחת האזור מחדש לציבור, צעירים החלו להגיע לכאן בסופי שבוע. בשנות ה־70 הופיעה תרבות ה־Takenoko-zoku — קבוצות צעירים בלבוש צבעוני שרקדו ברחובות — ובהמשך התפתחו סגנונות כמו Lolita, visual kei, decora וגרסאות שונות של kawaii. Takeshita Street הפכה לגרסה המסחרית והמרוכזת של התהליך הזה: חנויות בגדים זולות, purikura, קרפים, אביזרים, מוזיקה וטרנדים שמתחלפים במהירות. בשנות ה־90 מגזינים יפניים צילמו צעירים ברחובות Harajuku והפיצו את המראה שלהם ברחבי המדינה, ומאוחר יותר האינטרנט הפך את האזור למותג עולמי. כשעוברים ברחוב היום, קל לראות רק את הצפיפות והמתוקים, אבל מאחוריהם יש סיפור של תת־תרבות שנולדה מהרחוב, צברה כוח מסחרי, ולבסוף הפכה לאחד הייצואים התרבותיים המוכרים ביותר של יפן.","infoSource":"https://www.gotokyo.org/en/spot/48/index.html"},{"id":"p_6b26a3271a88","name":"Meiji Jingu Shrine","city":"טוקיו","area":"Shibuya + Harajuku","status":"חובה","kind":"attraction","desc":"מקדש שינטו חשוב בתוך יער גדול ושקט בלב טוקיו.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Meiji+Jingu+Japan","booking":"","website":"","info":"Meiji Jingu הוא אתר צעיר יחסית, אבל כדי להבין אותו צריך לחזור ל־1868 ולרסטורציית Meiji, התקופה שבה יפן סיימה יותר מ־250 שנות שלטון Tokugawa והחלה להפוך במהירות למדינה מודרנית. הקיסר Meiji, ששלט עד מותו ב־1912, הפך בדיעבד לסמל של המעבר הזה: ביטול המבנה הפיאודלי, הקמת צבא לאומי, תיעוש, רכבות, חינוך מודרני והרחבת הקשרים עם המערב. לאחר מותו של הקיסר ושל אשתו, הקיסרית Shōken, עלתה דרישה ציבורית להקים להם מקדש בטוקיו. המקדש הושלם ונחנך ב־1 בנובמבר 1920, אבל אחד הדברים המדהימים ביותר בו הוא דווקא היער. הוא לא היה כאן במשך מאות שנים: כ־100,000 עצים נתרמו מכל רחבי יפן, ועשרות אלפי מתנדבים סייעו בנטיעה. מומחי יערנות תכננו את הצמחייה כך שבתוך כמאה שנה ייווצר יער כמעט עצמאי שלא ידרוש טיפול מתמיד. כלומר, האנשים שתכננו אותו בראשית המאה ה־20 תכננו למעשה את הנוף שאנחנו רואים היום. רוב מבני המקדש המקוריים נשרפו בהפצצות טוקיו ב־1945 ונבנו מחדש ב־1958 בעזרת תרומות ציבוריות, בעוד היער שרד. לאורך הדרך רואים חביות סאקה מול חביות יין צרפתי — שילוב שמזכיר את תקופת Meiji עצמה: יפן שקלטה רעיונות מערביים בלי לוותר על זהותה. לכן מה שנראה כמו מקדש עתיק בתוך יער עתיק הוא למעשה אנדרטה לאומית מהמאה ה־20 שנבנתה בכוונה כדי לחבר בין יפן המודרנית למסורת Shinto עתיקה.","infoSource":"https://www.meijijingu.or.jp/en/about/establishment/"},{"id":"p_fec2263640bb","name":"Yoyogi Park","city":"טוקיו","area":"Shibuya + Harajuku","status":"רוצה","kind":"attraction","desc":"פארק גדול ונעים ליד Meiji Jingu, טוב להפסקה ירוקה.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Yoyogi+Park+Japan","booking":"","website":"","info":"Yoyogi Park נראה היום כמו פארק עירוני רגוע, אבל הקרקע שלו עברה כמעט כל שלב אפשרי בהיסטוריה המודרנית של יפן. בשנת 1910 נערכה באזור הטיסה הממונעת הראשונה ביפן, אירוע שסימל את כניסת המדינה לעידן התעופה. בשנות ה־30 וה־40 השתמש הצבא הקיסרי בשטח לאימונים ולמצעדים, כך שהפארק הירוק של היום היה אז חלק מהמנגנון הצבאי של יפן. לאחר הכניעה ב־1945 השתלט הצבא האמריקאי על האזור והקים כאן את Washington Heights, מתחם מגורים גדול לחיילים ולמשפחותיהם. במשך כמעט שני עשורים התקיימה בלב טוקיו שכונה אמריקאית סגורה יחסית, והנוכחות שלה השפיעה גם על Harajuku הסמוכה. לקראת אולימפיאדת טוקיו 1964 פונה המתחם, וחלק מהשטח הפך לכפר האולימפי — רגע שבו יפן רצתה להציג לעולם מדינה חדשה, משוקמת וטכנולוגית. לאחר האולימפיאדה הפך חלק גדול מהאזור ל־Yoyogi Park, שנפתח לציבור. לכן הפארק מספר מסלול יוצא דופן: חלוציות תעופתית, מיליטריזם, כיבוש אמריקאי, אולימפיאדה ואז מרחב ציבורי פתוח. גם תרבות סוף השבוע — מוזיקאים, רקדנים, קבוצות תחביב ו־people watching — מתאימה לסיום הזה: מקום שפעם נשלט בידי צבא הפך לאחד המרחבים הציבוריים החופשיים ביותר במרכז טוקיו.","infoSource":"https://www.gotokyo.org/en/spot/21/"},{"id":"p_5f0b3c6d23e4","name":"Reissue 3D Latte Art","city":"טוקיו","area":"Shibuya + Harajuku","status":"רוצה","kind":"food","desc":"בית קפה מפורסם בלאטה-ארט תלת-ממדי שמצויר לפי בקשה.","duration":"45–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Reissue+3D+Latte+Art+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_190b1ed4a6be","name":"Aoyama","city":"טוקיו","area":"Shibuya + Harajuku","status":"אולי","kind":"attraction","desc":"המשך טבעי מ-Omotesando: אדריכלות, אופנה, רחובות מעוצבים ובתי קפה. מתאים להליכה בדרך לשיבויה.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Aoyama+Japan","booking":"","website":"","info":"Aoyama הוא שם של שכונה מודרנית ומתוחכמת, אבל הוא מגיע ממשפחת samurai. בתקופת Edo הייתה באזור אחוזה של משפחת Aoyama, ומשם נשאר השם. לאחר רסטורציית Meiji השתנה כל החלק המערבי של טוקיו: אחוזות של daimyo וסמוראים פורקו, דרכים חדשות נסללו, מוסדות ציבוריים הוקמו והעיר התפשטה מערבה. אחד האתרים שמספרים את השינוי הזה הוא Aoyama Cemetery, שנפתח ב־1874 והיה מבתי הקברות הציבוריים הראשונים ביפן; נקברו בו אנשי ממשל, צבא, תרבות וגם זרים שחיו ביפן בתקופת המודרניזציה. במאה ה־20, במיוחד אחרי המלחמה, האזור התפתח בהדרגה למרכז של עיצוב, אופנה, אדריכלות וגלריות, כאשר קרבתו ל־Omotesando ול־Shibuya משכה מותגים ויוצרים. מה שמיוחד ב־Aoyama הוא שההיסטוריה לא מוצגת כאן דרך טירה או מקדש אחד, אלא דרך שכבות עירוניות: שמות של משפחות samurai, בית קברות של יפן המודרנית המוקדמת, שדרות ירוקות ומבנים עכשוויים של אדריכלים בינלאומיים. לכן כדאי להתייחס לאזור כולו כאל סיפור של טוקיו שעברה מאחוזות פיאודליות לבירת עיצוב עולמית.","infoSource":"https://www.gotokyo.org/en/destinations/western-tokyo/aoyama-and-omotesando/index.html"},{"id":"hotel_shibuya_stream","name":"Shibuya STREAM HOTEL","city":"טוקיו","area":"Shibuya + Harajuku","status":"אולי","kind":"hotel","desc":"מלון 4★ במיקום מרכזי מאוד בשיבויה, צמוד לאזור Shibuya Stream ובמרחק הליכה קצר מ-Shibuya Station. בחירה נוחה במיוחד אם רוצים לישון בתוך מרכז הפעילות של שיבויה.","duration":"לינה","note":"המלצת מלון 4★ · מיקום מרכזי","maps":"https://www.google.com/maps/search/?api=1&query=Shibuya+STREAM+HOTEL+Tokyo+Japan","booking":"https://www.booking.com/hotel/jp/shibuya-stream-excel-tokyu.html","website":"","historyNotApplicable":true},{"id":"hotel_hyatt_house_shibuya","name":"Hyatt House Tokyo Shibuya","city":"טוקיו","area":"Shibuya + Harajuku","status":"אולי","kind":"hotel","desc":"מלון 4★ בשיבויה, מרכזי מאוד ונוח לטיול רגלי באזור Shibuya/Harajuku. אופציה טובה אם חשובים חדרים מרווחים יותר ומיקום חזק.","duration":"לינה","note":"המלצת מלון 4★ · Shibuya","maps":"https://www.google.com/maps/search/?api=1&query=Hyatt+House+Tokyo+Shibuya+Japan","booking":"https://www.booking.com/hotel/jp/hyatt-house-tokyo-shibuya.html","website":"","historyNotApplicable":true},{"id":"food_shunju_shibuya","name":"Shunju Shibuya Bunkamuradori","city":"טוקיו","area":"Shibuya + Harajuku","status":"רוצה","kind":"food","desc":"מסעדה שמתאימה טוב לזוג עם העדפות שונות: יש אפשרויות רגילות לאוכל כללי ובמקביל אפשרות טבעונית/צמחונית שמוצהר עליה ללא fish stock.","duration":"60–90 דק׳","note":"לצמחונית: לבקש ללא בשר, דגים, פירות ים ו-dashi על בסיס דגים.","maps":"https://www.google.com/maps/search/?api=1&query=Shunju+Shibuya+Bunkamuradori+Tokyo","booking":"","website":"http://shunju.com/shibuya","historyNotApplicable":true},{"id":"p_1f01628dcb82","name":"ALPAKA Harajuku Harakado","city":"טוקיו","area":"Shibuya + Harajuku","status":"חובה","kind":"shop","desc":"חנות ALPAKA ב־2F של Tokyu Plaza Harajuku “Harakado”. תיקים, EDC ואביזרי נשיאה. שעות פתיחה: 11:00–21:00.","duration":"30–40 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=ALPAKA+Tokyu+Plaza+Harajuku+Harakado+Tokyo","booking":"","website":"https://www.alpakagear.jp/","historyNotApplicable":true},{"id":"p_a683417402d9","name":"Shinjuku Gyoen","city":"טוקיו","area":"Shinjuku","status":"חובה","kind":"attraction","desc":"גן ענק עם גנים יפניים, מדשאות ועצי שלכת. אחד המקומות היפים בסתיו.","duration":"1.5–2.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Shinjuku+Gyoen+Japan","booking":"","website":"","info":"ההיסטוריה של Shinjuku Gyoen מתחילה ב־1590, כאשר Tokugawa Ieyasu העניק שטח עצום באזור ל־Naitō Kiyonari, אחד מאנשיו. משפחת Naitō בנתה כאן אחוזת פרברים וגן, וב־1772 נפתח Tamagawa-en, גן שניזון מעודפי המים של אמת Tamagawa. אחרי רסטורציית Meiji רכשה הממשלה את השטח, וב־1872 הקימה בו תחנת ניסויים חקלאית שנועדה לקדם חקלאות מודרנית: גידלו כאן אלפי זני פירות וירקות, ערכו ניסויים בגידול תולעי משי ובקר, ובהמשך נבנו חממות מודרניות. ב־1879 עבר האתר לבית הקיסרי והפך לגן בוטני קיסרי. בתחילת המאה ה־20 ביקש Fukuba Hayato, איש מפתח בהיסטוריה של הגננות היפנית, מהאדריכל והגנן הצרפתי Henri Martinet לתכנן את הגן מחדש; ב־1906 הושלם הבסיס למראה הנוכחי, שילוב של גן יפני, גן צרפתי פורמלי וגן נוף אנגלי. הגן שימש אירועים קיסריים, וב־1927 הוקם בו Kyu-Goryo-Tei לציון נישואיו של יורש העצר Hirohito. בהפצצות 1945 כמעט כל הגן נשרף, מלבד כמה מבנים, והוא נפתח לציבור כגן לאומי ב־1949. ב־1989 נערכו בו טקסי ההלוויה הממלכתיים של הקיסר Shōwa. לכן כשמטיילים בין שלושת סגנונות הגן, למעשה עוברים דרך ארבע תקופות: Edo הפיאודלית, Meiji המודרנית, יפן הקיסרית ויפן הדמוקרטית שלאחר המלחמה.","infoSource":"https://policies.env.go.jp/national-garden/shinjukugyoen/english/intro/history/"},{"id":"p_7fc78f62377c","name":"Tokyo Metropolitan Government Observatory","city":"טוקיו","area":"Shinjuku","status":"רוצה","kind":"attraction","desc":"תצפית חינמית מגובה רב על טוקיו.","duration":"45–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+Metropolitan+Government+Observatory+Japan","booking":"","website":"","info":"Tokyo Metropolitan Government Building הוא הרבה יותר מתצפית חינמית. הבניין הושלם במרץ 1991, לאחר שהבנייה החלה ב־1988, והוא תוכנן בידי Kenzo Tange — האדריכל היפני שתכנן גם את Yoyogi National Gymnasium לאולימפיאדת 1964 והיה מהדמויות החשובות באדריכלות המודרנית ביפן. הבניין הראשי מגיע לגובה 243 מטר, וכשהושלם היה הגבוה ביפן. זה חשוב משום שהוא נבנה ממש בשיא תקופת 'כלכלת הבועה', כאשר מחירי הקרקע והאמונה בצמיחה היפנית הגיעו לשיא; קנה המידה והצורה הכמעט־קתדרלית שלו משקפים את הביטחון של אותה תקופה. זמן קצר לאחר פתיחתו התפוצצה הבועה הכלכלית, ולכן המבנה הפך בדיעבד גם לאנדרטה לאופטימיות של סוף שנות ה־80. הקומות ה־45, בגובה כ־202 מטר, נפתחו לתצפית על העיר. עוד פרט תרבותי משעשע: הבניין הופיע כמעט מיד בקולנוע היפני ונפגע ב־Godzilla vs. King Ghidorah מ־1991, כאילו טוקיו לא הספיקה אפילו להתרגל אליו לפני שהקולנוע כבר הרס אותו. מהתצפית כדאי לראות את מערב Shinjuku כמכלול — אזור גורדי השחקים שהחל להתפתח בשנות ה־70 והפך לסמל של טוקיו העסקית.","infoSource":"https://www.locationbox.metro.tokyo.lg.jp/english/locatabi_eng/list/530/"},{"id":"p_208f559c06c5","name":"3D Cat Billboard","city":"טוקיו","area":"Shinjuku","status":"רוצה","kind":"attraction","desc":"מסך תלת-ממדי מפורסם עם חתול ענק ליד תחנת שינג'וקו.","duration":"10–15 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=3D+Cat+Billboard+Japan","booking":"","website":"","info":"ה־3D Cat של שינג'וקו הוא דוגמה לאתר שנולד כמעט בן־לילה והפך לחלק מהזהות של העיר. ביולי 2021 הופיע החתול על Cross Shinjuku Vision, מסך LED ענק ופינתי מול היציאה המזרחית של Shinjuku Station. האפקט אינו הולוגרמה אלא אנימציה אנמורפית: התמונה מתוכננת לזווית צפייה מסוימת, והקיר הפינתי הופך בעין למעין קופסה עמוקה שבה החתול ישן, קם, מיילל ומתקרב לשפה. בתוך ימים הסרטונים שלו התפשטו בעולם, בתקופה שבה יפן עדיין הייתה כמעט סגורה לתיירים בגלל מגפת הקורונה. לכן החתול הפך לסמל מוזר של טוקיו דווקא בזמן שרוב העולם לא יכול היה להגיע אליה. הוא גם מראה שינוי מעניין בתרבות הפרסום היפנית: במקום שלט שמנסה רק למכור מוצר, המסך עצמו הפך לבידור עירוני ולדמות שהציבור מחפש. זהו אתר ללא 'היסטוריה עתיקה', אבל יש לו סיפור מאוד טוקיואי — טכנולוגיית פרסום שהפכה בתוך כמה שבועות לאטרקציה תיירותית ולחלק מהנוף התרבותי של Shinjuku.","infoSource":"https://shinjuku.xspace.tokyo/en/"},{"id":"p_8a8d7e75cc62","name":"Godzilla Head","city":"טוקיו","area":"Shinjuku","status":"רוצה","kind":"attraction","desc":"ראש גודזילה ענק על מלון Gracery באזור Kabukicho.","duration":"15–30 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Godzilla+Head+Japan","booking":"","website":"","info":"Godzilla Head הוצב ב־2015 על Shinjuku Toho Building, שנבנה על האתר שבו עמד במשך שנים Shinjuku Koma Theater. הראש נמצא בערך 50 מטר מעל הרחוב — בכוונה בגובה של Godzilla בסרט המקורי מ־1954 — ולכן הוא נראה כאילו המפלצת באמת מציצה מעל Kabukicho. אבל כדי להבין למה זה יותר מגימיק צריך לחזור ל־1954: Godzilla נוצר בידי אולפני Toho פחות מעשור אחרי הירושימה ונגסאקי ובאותה שנה שבה תקרית ספינת הדיג Lucky Dragon No. 5 עוררה מחדש ביפן פחד מקרינה גרעינית. הסרט הראשון הפך את המפלצת לדימוי של הרס, נשק אטומי וחרדה מטכנולוגיה בלתי נשלטת. עם השנים Godzilla השתנה מאיום טראומטי גם לגיבור תרבות פופ, אך נשאר אחד היצורים המזוהים ביותר עם הקולנוע היפני. כאשר בניין Toho החדש נפתח ב־2015, עיריית Shinjuku העניקה ל־Godzilla 'תעודת תושב' ומינתה אותו לשגריר תיירות של השכונה. הרחוב המוביל לבניין קיבל ב־2016 את השם Godzilla Road. כך דמות שהרסה את טוקיו שוב ושוב על המסך הפכה רשמית לתושבת העיר ולכלי לקידום התיירות שלה.","infoSource":"https://www.toho.co.jp/en/our-moments/2026/09/2.html"},{"id":"p_a2f5862d9e12","name":"Tokyu Kabukicho Tower","city":"טוקיו","area":"Shinjuku","status":"רוצה","kind":"attraction","desc":"מתחם בילוי עם אוכל, משחקים, אירועים וחיי לילה.","duration":"1–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tokyu+Kabukicho+Tower+Japan","booking":"","website":"","info":"Tokyu Kabukicho Tower נפתח באפריל 2023, אבל האתר שעליו הוא עומד קשור לבידור של Shinjuku כבר יותר משבעים שנה. ב־1950 נערכה באזור Tokyo Industrial Culture Exposition, וחלק מהמתקנים שנבנו לאירוע שימשו בסיס לפיתוח מתחמי בילוי. ב־1956 נפתח כאן Shinjuku Tokyu Cultural Hall, ובהמשך המתחם התפתח ל־Shinjuku TOKYU MILANO — מרכז קולנוע ובידור שפעל עד סוף 2014. לאחר הסגירה פעל במקום באופן זמני VR ZONE SHINJUKU, ואז נהרס המתחם לטובת המגדל החדש. Tokyu Kabukicho Tower, בגובה כ־225 מטר, תוכנן בכוונה בלי קומות משרדים טיפוסיות: יש בו קולנוע, תיאטרון, אולם הופעות, מלונות, משחקים וחיי לילה, כלומר הוא ממשיך את ההיסטוריה של הקרקע כאתר בידור ולא משנה אותה לחלוטין. האדריכלית Yuko Nagayama תכננה חזית שמושפעת מדימויים של מים ומזרקה, רמז לקשר ההיסטורי של האזור למקורות מים. אפילו אולם הקולנוע החדש נשען על מסורת תרבותית רצינית — Ryuichi Sakamoto שימש יועץ למערכת הסאונד. לכן המגדל הוא שכבה חדשה על רצף של Shinjuku בידורי שהתחיל הרבה לפניו.","infoSource":"https://www.tokyu-kabukicho-tower.jp/about/"},{"id":"p_dccbcb1531f3","name":"Omoide Yokocho","city":"טוקיו","area":"Shinjuku","status":"רוצה","kind":"attraction","desc":"סמטאות קטנות וצפופות עם יקיטורי ואווירת טוקיו ישנה.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Omoide+Yokocho+Japan","booking":"","website":"","info":"Omoide Yokocho נראה היום כמו פינה נוסטלגית שנבנתה במיוחד לתיירים, אבל המקור שלו נמצא בטוקיו ההרוסה של אחרי 1945. סביב תחנת Shinjuku, כמו ליד תחנות רבות בעיר, התפתחו שווקים שחורים שבהם נמכר מזון שקשה היה להשיג בתקופת הקיצוב. בשר היה יקר ומפוקח, ולכן מוכרים רבים השתמשו בחלקי פנים של חזיר ובקר שהיו קלים יותר להשגה, צלו אותם על שיפודים ומכרו לצד אלכוהול זול. בהדרגה דוכנים זמניים הפכו למסעדות קטנות וקבועות. פיתוח תחנת Shinjuku, שריפות ותכניות בנייה צמצמו במשך השנים חלקים גדולים מהשוק, אבל מקבץ הסמטאות הנוכחי שרד. השם 'Omoide Yokocho' — סמטת הזיכרונות — הוטבע מאוחר יותר ומתאים היטב למקום, משום שקנה המידה שלו כמעט הפוך לשינג'וקו המודרנית: חנויות של כמה מטרים רבועים, דלפקים עם מספר קטן של מושבים ומטבחים שפונים ישירות לסמטה. עבורנו, בגלל התפריטים המבוססים בעיקר על בשר, זה פחות מקום לארוחה ויותר אתר היסטורי חי של תקופת השיקום — זיכרון של השנים שבהן טוקיו הייתה ענייה, צפופה ומאלתרת, הרבה לפני גורדי השחקים שסביבה.","infoSource":"https://www.gotokyo.org/en/spot/63/index.html"},{"id":"p_027c44d6b4fc","name":"Golden Gai","city":"טוקיו","area":"Shinjuku","status":"רוצה","kind":"attraction","desc":"אזור ברים זעירים וסמטאות לילה מפורסמות.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Golden+Gai+Japan","booking":"","website":"","info":"Golden Gai הוא אחד המקומות הבודדים ב־Shinjuku ששמרו כמעט בשלמות על קנה המידה של טוקיו שאחרי מלחמת העולם השנייה. האזור התחיל כחלק משווקים ומתחמי בילוי לא־רשמיים שנוצרו אחרי 1945, ובתחילת שנות ה־50 התפתח לרובע של ברים קטנים. במשך השנים הוא היה גם חלק מאזורי המין של Shinjuku, אך לאחר חקיקה מחמירה יותר בסוף שנות ה־50 עבר בהדרגה לזהות של ברים ומועדונים. דווקא המגבלות הפיזיות — מבנים זעירים, סמטאות צרות ומגרשים קטנים — הפכו אותו למקום שבו שכר נמוך יחסית אפשר לבעלי ברים עצמאיים ליצור חללים אישיים מאוד. משנות ה־60 וה־70 Golden Gai נקשר לסופרים, אנשי תיאטרון, במאי קולנוע, עיתונאים ואמנים, וחלק מהברים הפכו למעין סלון אינטלקטואלי לא רשמי. בזמן שבשאר Shinjuku נהרסו רחובות שלמים ונבנו גורדי שחקים, Golden Gai שרד לחצי נדל\"ן, שריפות ותכניות פיתוח. כיום פועלים בו מאות ברים בתוך כמה שורות סמטאות בלבד. כשנכנסים, כדאי לזכור שהצפיפות אינה תפאורה רטרו; היא מבנה עירוני אמיתי שנשאר כמעט בטעות מתקופה שהעיר מסביבו מחקה.","infoSource":"https://www.gotokyo.org/en/spot/62/index.html"},{"id":"p_69152dbe3158","name":"Isetan Shinjuku","city":"טוקיו","area":"Shinjuku","status":"אולי","kind":"attraction","desc":"כלבו יפני קלאסי; קומת האוכל וה-gourmet basement היא האטרקציה העיקרית ומתאימה לפתיחת היום לפני Shinjuku Gyoen.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Isetan+Shinjuku+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_5762610a0e09","name":"ASICS FLAGSHIP SHINJUKU","city":"טוקיו","area":"Shinjuku","status":"רוצה","kind":"shop","desc":"חנות הדגל הרשמית של ASICS בשינג'וקו, 4 קומות וכ־605 מ״ר. כתובת: 3-17-5 Shinjuku, Shinjuku-ku, Tokyo 160-0022. שעות פתיחה: 11:00–20:00.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=ASICS+FLAGSHIP+SHINJUKU+3-17-5+Shinjuku+Tokyo","booking":"","website":"https://www.asics.com/jp/ja-jp/mk/asics-flagship-shinjuku","historyNotApplicable":true},{"id":"p_ef60b433ce43","name":"Senso-ji","city":"טוקיו","area":"Asakusa + Kappabashi","status":"חובה","kind":"attraction","desc":"המקדש הבודהיסטי המפורסם באסאקוסה, עם שערים מרשימים ואווירה מסורתית.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Senso-ji+Japan","booking":"","website":"","info":"Sensō-ji הוא המקדש הבודהיסטי העתיק ביותר בטוקיו, והסיפור שלו מתחיל לפי המסורת בשנת 628. שני אחים דייגים, Hinokuma Hamanari ו־Takenari, משו מן Sumida River פסל קטן של Kannon, בודהיסטווה של החמלה. ראש הכפר Haji no Nakatomo זיהה את הדמות, הפך את ביתו למקום תפילה, וב־645 בנה הנזיר Shōkai אולם מסודר. לפי מסורת המקדש, Shōkai קיבל בחלום הוראה להסתיר את הפסל, ולכן הדמות המרכזית של Sensō-ji מוגדרת עד היום hibutsu — 'בודהה נסתר' שאינו מוצג לציבור. בתקופת Edo הפך Sensō-ji למוקד עלייה לרגל עצום. המוני מבקרים יצרו סביבו שוק, דוכני מזון, בידור, תיאטרון ומסחר, ולכן המקדש לא רק שרד בתוך Asakusa אלא עזר ממש ליצור את השכונה. גם הקשר לשוגונות חשוב: Tokugawa Ieyasu והשליטים שאחריו ראו במקדש אתר בעל מעמד מרכזי, ותרמו לשיקום מבנים. ההיסטוריה הפיזית של Sensō-ji מלאה באסונות — רעידות אדמה, שריפות ומלחמה. האולם המרכזי והפגודה נחרבו בהפצצות טוקיו ב־10 במרץ 1945 ונבנו מחדש לאחר המלחמה בעזרת תרומות של מאמינים. הפגודה הנוכחית הושלמה ב־1973 ואף כוללת שרידים בודהיסטיים שהוענקו מסרי לנקה. לכן כשעומדים במתחם היום, חשוב להבין שהמסורת היא בת כמעט 1,400 שנה, גם אם חלק מהעץ והבטון סביבנו חדש הרבה יותר.","infoSource":"https://www.senso-ji.jp/english/"},{"id":"p_386647abeb53","name":"Kaminarimon","city":"טוקיו","area":"Asakusa + Kappabashi","status":"רוצה","kind":"attraction","desc":"שער הרעם האייקוני בכניסה ל-Senso-ji.","duration":"10–20 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kaminarimon+Japan","booking":"","website":"","info":"Kaminarimon, 'שער הרעם', הוא הכניסה המזוהה ביותר עם Sensō-ji, אבל השער שאנחנו רואים היום הוא רק הפרק האחרון בסדרה ארוכה של בנייה, שריפות ושיקום. לפי מסורת Sensō-ji, השער הראשון הוקם בשנת 942 בידי המפקד Taira no Kinmasa. בשני צדדיו הוצבו Fūjin, אל הרוח, ו־Raijin, אל הרעם, שנועדו להגן על המקדש מפני אסונות טבע. במהלך מאות השנים השער נשרף ונבנה שוב ושוב. השריפה הגדולה האחרונה התרחשה ב־1865, ומאותו רגע נשארה הכניסה ללא השער המפורסם במשך כמעט מאה שנה. רק ב־1960 נבנה Kaminarimon מחדש במימון Konosuke Matsushita, מייסד Matsushita Electric — החברה שנודעה מאוחר יותר כ־Panasonic. לפי הסיפור שמספר המקדש, Matsushita סבל מבעיה רפואית, התפלל ב־Sensō-ji וכאשר מצבו השתפר החליט לממן את השיקום. הפנס האדום העצום במרכז השער הפך מאז לאחד הסמלים המצולמים ביותר של יפן. לכן מה שנראה כמו 'שער מסורתי עתיק' הוא למעשה מבנה מודרני יחסית שממשיך מסורת בת יותר מאלף שנה, וגם מספר סיפור מאוד יפני של שיקום אחרי אסון: ההמשכיות של האתר חשובה יותר מכך שכל חומר פיזי יהיה מקורי.","infoSource":"https://www.senso-ji.jp/english/"},{"id":"p_656904250ddc","name":"Nakamise Street","city":"טוקיו","area":"Asakusa + Kappabashi","status":"רוצה","kind":"attraction","desc":"רחוב קניות מסורתי בין Kaminarimon ל-Senso-ji, עם מזכרות וממתקים.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Nakamise+Street+Japan","booking":"","website":"","info":"Nakamise הוא לא סתם רחוב מזכרות בדרך ל־Sensō-ji; הוא תוצאה ישירה של מאות שנות עלייה לרגל למקדש. לפי ההיסטוריה הרשמית של הרחוב, בין 1688 ל־1735 קיבלו תושבים שסייעו בשירותי Sensō-ji זכות מיוחדת להפעיל דוכנים לאורך דרך הגישה. כך נוצר מודל שבו המקדש משך קהל, והקהל יצר כלכלה של תה, ממתקים, צעצועים, חפצי פולחן ומזכרות. בתקופת Edo היו כאן אזורים של בתי תה וחנויות קטנות, והרחוב נחשב לאחד ממרכזי המסחר המסודרים של עיירת־המקדש. רסטורציית Meiji שינתה הכול: הממשלה החדשה החרימה חלק מקרקעות המקדשים וב־1885 הורתה לסוחרי Nakamise לעזוב; באותה שנה נבנו במקומם חנויות לבנים בסגנון מערבי, סמל מובהק של המודרניזציה החדשה. גם המבנים האלה לא שרדו — הם נהרסו ברעידת Kantō של 1923, ונבנו מחדש ב־1925 מבטון מזוין עם חזיתות אדומות בסגנון מסורתי. בפצצות 1945 נשרפו פנים החנויות, ושוב בעלי העסקים המקומיים שיקמו את הרחוב. לכן Nakamise של היום אינו רצף של חנויות בנות 300 שנה, אלא מסורת מסחרית בת מאות שנים ששרדה שינויי משטר, רעידת אדמה ומלחמה באמצעות בנייה מחדש שוב ושוב.","infoSource":"https://www.asakusa-nakamise.jp/e-history.html"},{"id":"p_ca552bc36394","name":"Kappabashi Street","city":"טוקיו","area":"Asakusa + Kappabashi","status":"רוצה","kind":"attraction","desc":"רחוב כלי המטבח של טוקיו: סכינים, כלי קרמיקה ודגמי אוכל מפלסטיק.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kappabashi+Street+Japan","booking":"","website":"","info":"Kappabashi Dougu Street מספר את ההיסטוריה של טוקיו דרך הכלים שמאחורי המסעדה. לפי אגודת הרחוב הרשמית, סוחרים החלו להתרכז באזור סביב 1912, בתחילת תקופת Taishō, ומכרו כלים ישנים, חומרה וציוד שימושי. עם הגידול העצום של טוקיו ותרבות האוכל העירונית, האזור התפתח בהדרגה למרכז מקצועי של מסעדנים: סכינים, כלי חרס, lacquerware, תנורים, מקררים, שלטים, noren, תבניות, בגדי טבחים, אריזות וכל פרט קטן שמאפשר למסעדה לפעול. אחת התעשיות המזוהות עם Kappabashi היא shokuhin sampuru — דגמי מזון מלאכותיים שנוצרו ביפן במאה ה־20 והפכו לכלי שיווק כמעט בכל מסעדה. גם שם הרחוב עטוף באגדה. לפי אחת הגרסאות, השם קשור ל־kappa — יצורי מים מיתולוגיים — שלכאורה עזרו לסוחר בשם Kihachi לחפור תעלות ניקוז באזור בתחילת המאה ה־19; גרסה אחרת קושרת אותו למעילי גשם, kappa, שיובשו על גשר סמוך. האזור עצמו סבל מהצפות, כולל השיטפון הגדול של 1910, ולכן סיפורי המים אינם מקריים. כשמסתובבים כאן, רואים למעשה תשתית של תרבות האוכל היפנית — לא את המנה על השולחן, אלא את כל המערכת המקצועית שמאפשרת לה להתקיים.","infoSource":"https://www.gotokyo.org/en/destinations/eastern-tokyo/asakusa/"},{"id":"p_30fa14841797","name":"Hat Coffee / 3D Foam Art","city":"טוקיו","area":"Asakusa + Kappabashi","status":"רוצה","kind":"food","desc":"קפה באסאקוסה עם קצף תלת-ממדי בעיצובים מיוחדים.","duration":"45–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Hat+Coffee+%2F+3D+Foam+Art+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_7abbe0abd0e8","name":"Sumida River","city":"טוקיו","area":"Asakusa + Kappabashi","status":"רוצה","kind":"attraction","desc":"נהר סומידה עובר לצד Asakusa ונותן נקודות תצפית יפות לכיוון Skytree ו-Asahi Beer Hall. מתאים להליכה קצרה או שיט.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Sumida+River+Japan","booking":"","website":"","info":"Sumida River הוא אחד הצירים המרכזיים שעליהם נבנתה Edo, טוקיו שלפני 1868. בתקופה שבה כבישים יבשתיים היו איטיים וצפופים, נהרות ותעלות היו מערכת התחבורה של העיר: אורז, עץ, דגים, סחורות ואנשים נעו במים אל מרכז Edo. הנהר קשור גם לסיפור המיתי של Sensō-ji, משום שלפי המסורת פסל Kannon שעליו נוסד המקדש נמצא בו בשנת 628. אבל במהלך תקופת Edo ה־Sumida היה גם מרחב בילוי. לאורך גדותיו התפתחו בתי תה, אזורי hanami, שיט ופסטיבלים, והנהר מופיע שוב ושוב בהדפסי ukiyo-e של אמנים כמו Hiroshige. מסורת הזיקוקים של Sumida קשורה למאה ה־18: ב־1733 נערכו זיקוקים לאורך הנהר במסגרת טקסים לזכר קורבנות רעב ומגפות, ומכאן התפתחה מסורת קיץ מפורסמת. במאה ה־20 השתנה הנהר עם תיעוש, גשרים מודרניים ופרויקטים של בקרת הצפות, אך הוא נשאר ציר שמחבר בין Asakusa, המפרץ והעיר התחתונה. כשעומדים היום בטיילת ורואים את Tokyo Skytree, הגשרים ואת בנייני Asahi, הנוף נראה מודרני לחלוטין — אבל המים הם אותה תשתית שהפכה את Edo כבר במאה ה־18 לאחת הערים הגדולות בעולם.","infoSource":"https://www.gotokyo.org/en/see-and-do/nature/waterfront/history-by-the-water.html"},{"id":"p_d61087502c85","name":"Asahi Beer Hall","city":"טוקיו","area":"Asakusa + Kappabashi","status":"אולי","kind":"attraction","desc":"מבנה אדריכלי אייקוני ליד נהר סומידה, מזוהה עם הפסל המוזהב שעל הגג. עצירה קצרה וצילום בדרך ל-Skytree.","duration":"15–30 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Asahi+Beer+Hall+Japan","booking":"","website":"","info":"המתחם של Asahi על גדת Sumida הוא אתר צעיר יחסית, אך הוא הפך בתוך כמה עשורים לאחד הסמלים האדריכליים המזוהים ביותר עם Asakusa. Asahi Beer Hall והבניינים הסמוכים הושלמו ב־1989, בשיא כלכלת הבועה היפנית — תקופה שבה חברות יפניות השקיעו סכומים עצומים באדריכלות, עיצוב ותדמית בינלאומית. האלמנט המפורסם ביותר הוא Flamme d'Or, 'להבת הזהב', פסל ענק שתכנן המעצב הצרפתי Philippe Starck. הכוונה הרשמית הייתה לסמל את 'הלב הבוער' של Asahi ואת השאיפה של החברה לעתיד, אבל הצורה המוזרה מיד הולידה כינויים ובדיחות, והיא הפכה לדוגמה קלאסית לאופן שבו הציבור יכול לתת לבניין משמעות שונה מזו שהתכוון אליה האדריכל. העובדה שמבנה כל כך פוסט־מודרני יושב דקות ספורות מ־Sensō-ji היא חלק מהקסם: באותו קו ראייה אפשר לקבל מקדש עם שורשים במאה ה־7, אדריכלות תאגידית של שנות ה־80 ו־Tokyo Skytree של המאה ה־21. הזווית הטובה ביותר להבין את כל השכבות האלה היא מאזור Azumabashi, כאשר שלושת התקופות מופיעות יחד.","infoSource":"https://www.gotokyo.org/en/destinations/eastern-tokyo/asakusa/index.html"},{"id":"p_akihabara_retro_game_shopping","name":"Akihabara Retro Game Shopping — Surugaya, Trader, Super Potato, Sofmap, Jan-gle, Retro Game Camp & BOOKOFF","city":"טוקיו","area":"Akihabara","status":"חובה","kind":"shop","desc":"מסלול קניות רטרו וגיימינג בתוך Akihabara. כל החנויות נמצאות באותו אזור הליכה, אבל לא באותו בניין.\n\n• Surugaya (駿河屋) — כמה סניפים באזור. Akihabara Station Store ליד התחנה; Akihabara Game Store ממוקד יותר בגיימינג ורטרו.\n• Trader Akihabara Honten (トレーダー) — חנות יד שנייה וגיימינג מוכרת באזור.\n• Super Potato Akihabara — חנות רטרו אייקונית עם מבחר גדול מאוד; לרוב יקרה יותר אבל כיפית לשיטוט.\n• Sofmap AKIBA Amusement — משחקי קונסולה חדשים ויד שנייה, לצד הובי, figures ואנימה.\n• Jan-gle Akihabara — יד שנייה של משחקים, קונסולות, מחשבים, טלפונים וגאדג'טים.\n• Retro Game Camp — חנות רטרו עם Famicom, Super Famicom, N64, PlayStation, Saturn ועוד.\n• BOOKOFF Akihabara Eki-mae — ליד התחנה; יד שנייה עם משחקים, מדיה, אלקטרוניקה ו-TCG.","duration":"3–5 שעות","note":"מומלץ לעשות את כולן כבלוק אחד של Akihabara: להתחיל ליד התחנה ב-BOOKOFF / Surugaya Station Store, להמשיך לכיוון Chuo-dori ולסיים באזור Super Potato / Retro Game Camp / Sofmap.","maps":"https://www.google.com/maps/search/?api=1&query=Akihabara+retro+game+stores+Tokyo+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_28a61513471b","name":"Mandarake Complex","city":"טוקיו","area":"Akihabara","status":"רוצה","kind":"attraction","desc":"בניין רב קומות לאספנות, מנגה, אנימה, צעצועים ופריטי וינטג׳.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Mandarake+Complex+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_7199c1652ee4","name":"Radio Kaikan","city":"טוקיו","area":"Akihabara","status":"רוצה","kind":"attraction","desc":"בניין מלא בחנויות figures, cards, anime ותחביבים.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Radio+Kaikan+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_0505b23231b6","name":"GiGO Arcades","city":"טוקיו","area":"Akihabara","status":"רוצה","kind":"attraction","desc":"משחקיות יפניות עם claw machines, rhythm games ועוד.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=GiGO+Arcades+Japan","booking":"","website":"","info":"הארקיידים של GiGO באקיהברה הם פרק חדש בסיפור הרבה יותר ארוך של משחקי הווידאו היפניים. במשך עשרות שנים שלטי SEGA היו חלק כמעט בלתי נפרד מהנוף של Akihabara. SEGA, שהחלה את דרכה בעסקי מכונות בידור ופעלה בעוצמה בעולם הארקייד, הייתה אחראית למכונות ומשחקים ששינו את התחום, מ־Out Run ו־Virtua Fighter ועד מערכות גדולות ואקספרימנטליות. בשנות ה־90 הארקייד היפני היה מקום שבו טכנולוגיה חדישה הגיעה לעיתים לציבור לפני הבית: גרפיקה תלת־ממדית, מכונות מרוצים, משחקי קצב ומערכות רשת. עם ירידת שוק הארקייד והשינויים בעסקי SEGA, פעילות מרכזי הבידור עברה ל־GENDA. בשנת 2022 הוכרז כי סניפי SEGA יעברו בהדרגה למותג GiGO, וגם Akihabara קיבלה את השלטים החדשים. מבחינה תרבותית זה היה רגע כמעט נוסטלגי: אחד הסמלים של 'Electric Town' נעלם, אבל החוויה עצמה נשארה. לכן כשנכנסים ל־GiGO, שווה לעלות מעבר לקומת crane games. בקומות של rhythm games, fighting games ומכונות ייחודיות עדיין מרגישים את המסורת של יפן כמדינה שבה הארקייד היה במשך עשרות שנים מעבדת משחקים, ספורט תחרותי ומקום מפגש חברתי.","infoSource":"https://www.gendagigo.jp/company_profile/history"},{"id":"p_f95ddf35c266","name":"Yodobashi Akiba","city":"טוקיו","area":"Akihabara","status":"רוצה","kind":"attraction","desc":"כלבו ענק של אלקטרוניקה, צילום, מחשבים וגאדג'טים.","duration":"60–120 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Yodobashi+Akiba+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_0ec86a8c9e36","name":"Kanda Myojin","city":"טוקיו","area":"Akihabara","status":"רוצה","kind":"attraction","desc":"מקדש שינטו ליד Akihabara, פופולרי גם בקרב קהילת הטכנולוגיה.","duration":"30–45 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kanda+Myojin+Japan","booking":"","website":"","info":"Kanda Myojin הוא אחד האתרים שבהם ההיסטוריה הפיאודלית של טוקיו והתרבות הטכנולוגית של Akihabara מתחברות בצורה כמעט מושלמת. לפי מסורת המקדש הוא נוסד בשנת 730 באזור שנמצא כיום ליד Otemachi. במאה ה־14 נוסף לפולחן Taira no Masakado, לוחם ומורד מהמאה ה־10 שהפך לאחר מותו לדמות רוחנית עוצמתית ומעט מאיימת. סביב קברו של Masakado סופרו במשך דורות סיפורים על אסונות ומזל רע, וב־1309 הוא הונצח במקדש כדי להרגיע את רוחו. הפרק החשוב הבא מגיע בשנת 1600: לפני קרב Sekigahara, Tokugawa Ieyasu התפלל כאן לניצחון. הקרב שהכריע את מאבקי האיחוד התרחש ביום Kanda Matsuri, והניצחון הפך את המקדש לאתר בעל משמעות מיוחדת עבור שוגונות Tokugawa. לאחר הקמת Edo הוא הועבר למיקומו הנוכחי והפך למעין 'מקדש מגן' של העיר. גם הוא נהרס ונבנה מחדש כמה פעמים; המבנה הנוכחי נבנה מבטון מזוין ב־1934, דבר שעזר לו לשרוד את הפצצות המלחמה טוב יותר ממבני עץ רבים. במאה ה־21 נוצרה שכבה חדשה: בגלל הקרבה ל־Akihabara, חברות IT, יזמי טכנולוגיה וחובבי מחשבים מגיעים לבקש ברכה, והמקדש מוכר גם קמעות הקשורים לאבטחת מידע ומכשירים אלקטרוניים. זהו מקום שבו רוחו של מורד מהמאה ה־10 חיה כמה דקות מחנויות גיימינג.","infoSource":"https://www.kandamyoujin.or.jp/profile/"},{"id":"p_05b3c2408b26","name":"Maid Café experience","city":"טוקיו","area":"Akihabara","status":"אולי","kind":"attraction","desc":"בתי קפה קונספטואליים הם חלק מהתרבות של Akihabara. אפשר לבחור אחד איכותי אם מסקרן אתכם לחוות את הצד הייחודי של השכונה.","duration":"45–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Maid+Caf%C3%A9+experience+Japan","booking":"","website":"","info":"Maid café הוא לא מסורת עתיקה אלא תופעה שנולדה מהשינוי של Akihabara בסוף המאה ה־20 ותחילת המאה ה־21. אחרי המלחמה Akihabara הייתה מרכז לאלקטרוניקה; בשנות ה־80 וה־90, עם התרחבות משחקי המחשב, anime, manga ו־doujinshi, האזור הפך בהדרגה גם לבירת תרבות otaku. מתוך העולם הזה צמחו בתי קפה שבהם צוות לבוש כ־maid מדבר אל הלקוחות בשפה תיאטרלית ומכניס אותם לעולם בדיוני של 'אחוזה'. at-home cafe, אחד המותגים המזוהים ביותר עם הז'אנר, פתח את הסניף הראשון שלו ב־2004 בתוך Don Quijote Akihabara. לפי ההיסטוריה הרשמית של המקום, בשנים הראשונות אפילו לא היו נהלים מסודרים — החוויה התפתחה תוך כדי עבודה, ומלצריות כמו hitomi עזרו לעצב את הטקסים, המילים והסגנון שהפכו מאוחר יותר לסטנדרט עולמי. הביטוי Moe Moe Kyun, המזוהה עם הז'אנר, הפך לסמל של אותה תרבות. בתוך עשור maid cafés עברו מתופעה מוזרה של מעריצים לאטרקציה בינלאומית שמזוהה עם יפן. לכן חוויה כזו מעניינת פחות בגלל האוכל ויותר מפני שהיא מציגה רגע שבו דימויים ממשחקים ואנימה יצאו מהמסך והפכו לצורת שירות, תיאטרון ומרחב חברתי אמיתי.","infoSource":"https://www.maidcafe-athome.com/about-us"},{"id":"p_a28928d6f1bd","name":"Karaoke / Japanese arcade experience","city":"טוקיו","area":"Akihabara","status":"אולי","kind":"attraction","desc":"חוויה יפנית קלאסית של karaoke או arcade מעבר לשופינג בגיימינג.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Karaoke+%2F+Japanese+arcade+experience+Japan","booking":"","website":"","info":"Karaoke הוא אחד החידושים התרבותיים היפניים שהפכו כל כך גלובליים עד שקל לשכוח את המקור. המונח מחבר kara, 'ריק', עם orchestra, והוא הופיע ביפן בתחילת שנות ה־70 סביב מכונות שהשמיעו ליווי מוזיקלי ללא הזמר. אחד השמות המזוהים ביותר עם ההמצאה הוא Daisuke Inoue, מוזיקאי מקובה שבנה מערכת שאפשרה ללקוחות לשיר עם ליווי מוקלט. בשנים הראשונות karaoke התקיים בעיקר בברים, אבל בשנות ה־80 התפתח מודל ה־karaoke box — חדר פרטי לקבוצה קטנה — שהפך את החוויה מביצוע מול קהל לבילוי חברתי נגיש. המודל הזה התפשט בכל יפן והפך לחלק מחיי עבודה, דייטים וחברות. הארקיידים צמחו במקביל מתעשיית amusement ויצרו תרבות עירונית משלהם: משחקי לחימה, קצב, מרוצים, photo booths ומכונות פרסים. שתיהן חולקות רעיון יפני מעניין — לקחת פעילות שיכולה להיות מביכה או רועשת ולהכניס אותה למסגרת מאוד מסודרת, טכנולוגית ומבוקרת. לכן karaoke ו־game center אינם רק בילוי; הם חתיכה אמיתית מההיסטוריה של תרבות הפנאי העירונית ביפן אחרי שנות ה־70.","infoSource":"https://www.gotokyo.org/en/see-and-do/index.html"},{"id":"p_bic_camera_akiba","name":"Bic Camera AKIBA","city":"טוקיו","area":"Akihabara","status":"רוצה","kind":"attraction","desc":"חנות אלקטרוניקה ענקית באקיהברה עם מצלמות, גאדג'טים, קונסולות, משחקים, אביזרים, מוצרי חשמל ומבחר גדול של מוצרים יפניים.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Bic+Camera+AKIBA+Tokyo+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_kotobukiya_akihabara","name":"Kotobukiya Akihabara","city":"טוקיו","area":"Akihabara","status":"רוצה","kind":"attraction","desc":"חנות גדולה של דמויות, מודלים, אנימה, גיימינג ומרצ'נדייז. חזקה במיוחד ב-collectibles, figures ומוצרים בלעדיים.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kotobukiya+Akihabara+Tokyo+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_eb527edeaba2","name":"Unicorn Gundam","city":"טוקיו","area":"Odaiba","status":"רוצה","kind":"attraction","desc":"פסל Unicorn Gundam ענק מול DiverCity עם מופעי תאורה בזמנים מסוימים.","duration":"20–30 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Unicorn+Gundam+Japan","booking":"","website":"","info":"פסל Unicorn Gundam הוצב מחוץ ל־DiverCity בשנת 2017 והחליף את פסל RX-78-2 שעמד שם קודם. גובהו כ־19.7 מטר, כמעט 'בקנה מידה אמיתי' ביחס ל־mobile suit הבדיוני, והוא יכול לשנות חלקים מהחזות שלו באמצעות תאורה ומנגנונים כדי לדמות את המעבר בין Unicorn Mode ל־Destroy Mode. המשמעות התרבותית שלו מגיעה הרבה לפני 2017. Mobile Suit Gundam עלתה לטלוויזיה ב־1979 ויצרה שינוי גדול בז'אנר הרובוטים היפני. במקום רובוט־על כמעט קסום שנלחם ברעים, הסדרה הציגה מכונות צבאיות כחלק ממלחמה פוליטית, עם חיילים, אזרחים ודילמות מוסריות. מכאן נולד ז'אנר ה־'real robot'. בתחילה הסדרה לא הייתה הצלחה מסחררת, אבל שידורים חוזרים ודגמי הפלסטיק Gunpla הפכו אותה לתופעה עצומה. במהלך עשרות שנים Gundam הפכה למערכת של anime, סרטים, משחקים, צעצועים, דגמים ותעשיית תחביבים עולמית. הפסל באודאיבה הוא לכן יותר מדמות גדולה לצילום: הוא מעין אנדרטה פיזית לתופעה שבה אנימה, עיצוב תעשייתי, הנדסה מדומיינת ומסחר הפכו לחלק מהזהות התרבותית של יפן.","infoSource":"https://www.gotokyo.org/en/destinations/southern-tokyo/odaiba/index.html"},{"id":"p_c42e1561fc9e","name":"DiverCity Tokyo Plaza","city":"טוקיו","area":"Odaiba","status":"רוצה","kind":"attraction","desc":"קניון גדול עם Gundam Base, אופנה, אוכל ובידור.","duration":"1–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=DiverCity+Tokyo+Plaza+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_7df5e0b09679","name":"Gundam Base Tokyo","city":"טוקיו","area":"Odaiba","status":"רוצה","kind":"attraction","desc":"חנות ומתחם Gundam גדול עם דגמים ותצוגות.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Gundam+Base+Tokyo+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_5d705cb8bf99","name":"Tokyo Joypolis","city":"טוקיו","area":"Odaiba","status":"חובה","kind":"attraction","desc":"פארק indoor של SEGA עם מתקנים, משחקי VR וחוויות אינטראקטיביות.","duration":"2–4 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+Joypolis+Japan","booking":"","website":"","info":"Tokyo Joypolis נפתח באודאיבה ביולי 1996 על ידי SEGA, בתקופה שבה החברה ותעשיית המשחקים היפנית היו בשיא כוחן. שנות ה־90 היו העידן של Saturn, Virtua Fighter, מכונות arcade גדולות וניסיונות להפוך משחק וידאו לחוויה פיזית. SEGA כבר הפעילה מרכזי בידור, אבל Joypolis היה שאפתני יותר: פארק שעשועים מקורה ששילב מתקנים גדולים, VR, motion simulators וגרסאות מיוחדות של משחקי arcade. זה היה רעיון כמעט עתידני לזמנו — לקחת טכנולוגיה שהייתה מזוהה עם מסך ומכונה ולהפוך אותה לסביבה שלמה. המיקום באודאיבה התאים בדיוק: בשנות ה־90 טוקיו ניסתה להפוך את אזור המפרץ לרובע עתידני של תערוכות, טכנולוגיה ובידור. גם כאשר SEGA יצאה בהדרגה משוק הקונסולות ועברה שינויים עסקיים, Joypolis המשיך לפעול, ולכן הוא נשאר שריד חי לאופטימיות הטכנולוגית של שנות ה־90. כשנכנסים, החלק המעניין ביותר מבחינה היסטורית הוא לא מכונת crane רגילה אלא המתקנים שמחברים תנועה, וידאו וסימולציה — בדיוק החזון ש־SEGA ניסתה למכור באמצע שנות ה־90.","infoSource":"https://www.sega.jp/history/companyTimeline/en/"},{"id":"p_81964c659a9f","name":"DECKS Tokyo Beach","city":"טוקיו","area":"Odaiba","status":"רוצה","kind":"attraction","desc":"מרכז קניות ובידור על קו המים.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=DECKS+Tokyo+Beach+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_40052b920664","name":"Odaiba Seaside Park","city":"טוקיו","area":"Odaiba","status":"רוצה","kind":"attraction","desc":"טיילת ונוף יפה למפרץ, Rainbow Bridge וטוקיו.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Odaiba+Seaside+Park+Japan","booking":"","website":"","info":"Odaiba נראית כמו אחד האזורים החדשים והעתידניים של טוקיו, אבל השם שלה מגיע מאמצע המאה ה־19. בשנת 1853 הגיע קומודור Matthew Perry עם 'הספינות השחורות' ודרש מיפן לפתוח את נמלי המסחר שלה. שוגונות Tokugawa, שחששה מהתקפה ימית על Edo, החלה לבנות סדרה של איים מבוצרים במפרץ; daiba פירושו בערך סוללת תותחים או עמדה מבוצרת. לא כל האיים שתוכננו הושלמו, אבל כמה מהם נשארו והפכו לבסיס של Odaiba. במהלך המאה ה־20 חוברו חלקים באמצעות ייבוש ים, ובשנות ה־80 וה־90 ניסתה טוקיו להפוך את האזור ל־waterfront עתידני של עסקים, תערוכות ובידור. התכנית הראשונית הייתה שאפתנית מדי, והאטה אחרי קריסת כלכלת הבועה, אבל Odaiba התפתחה בהדרגה לרובע שאנחנו רואים היום. Odaiba Seaside Park הוא מקום טוב לקרוא בו את כל השכבות: שרידים של איים מבוצרים מהמאה ה־19, חוף מלאכותי, Rainbow Bridge שנפתח ב־1993 וגורדי שחקים של סוף המאה ה־20. לכן הנוף היפה של המפרץ הוא גם סיפור על שינוי מוחלט בתפקיד של המקום — מאזור שנועד להגן על Edo מפני זרים לרובע שמזמין מבקרים מכל העולם.","infoSource":"https://www.gotokyo.org/en/spot/39/index.html"},{"id":"p_95dea67df142","name":"Statue of Liberty replica","city":"טוקיו","area":"Odaiba","status":"רוצה","kind":"attraction","desc":"פסל החירות הקטן של Odaiba עם רקע של המפרץ.","duration":"10–20 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Statue+of+Liberty+replica+Japan","booking":"","website":"","info":"פסל החירות של Odaiba נראה לעיתים כמו ניסיון לייצר 'ניו יורק קטנה', אבל יש לו היסטוריה דיפלומטית קונקרטית. ב־1998, במסגרת 'שנת צרפת ביפן', הוצב באודאיבה פסל חירות צרפתי באופן זמני לציון הקשרים בין צרפת ליפן. הנוף שלו מול Rainbow Bridge הפך לפופולרי מאוד, וכאשר הפסל הוחזר לצרפת בסיום האירועים נוצר לחץ ציבורי להשאיר משהו דומה במקום. בשנת 2000 הוצב העתק קבוע שנעשה על בסיס הפסל הצרפתי. הוא קטן בהרבה מהפסל בניו יורק — בערך שביעית מגודלו — אבל בגלל זווית הצילום והגשר ברקע הוא נראה מרשים הרבה יותר. הסיפור שלו מתאים מאוד ל־Odaiba של שנות ה־90: רובע חדש שרצה להציג את טוקיו כעיר גלובלית, פתוחה ובינלאומית, ולכן אימץ במרחב הציבורי סמל מערבי מפורסם והפך אותו לחלק מהזהות המקומית. כשמצלמים את הפסל עם Rainbow Bridge ו־Tokyo Tower ברקע, מקבלים כמעט סיכום חזותי של הרעיון הזה — סמלים גלובליים ויפניים שנאספו יחד בנוף מלאכותי שנבנה כולו בידי אדם.","infoSource":"https://www.gotokyo.org/en/spot/363/index.html"},{"id":"p_a1f64434108f","name":"teamLab Planets","city":"טוקיו","area":"Toyosu + Ariake","status":"רוצה","kind":"attraction","desc":"חוויה דיגיטלית immersive שבה הולכים בתוך מים, מראות ואור.","duration":"1.5–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=teamLab+Planets+Japan","booking":"","website":"","info":"teamLab Planets נפתח ב־Toyosu בשנת 2018 כמוזיאון זמני, אבל ההצלחה שלו הובילה להארכת הפעילות שוב ושוב. teamLab עצמו הוא קולקטיב יפני שהוקם ב־2001 ומחבר אמנים, מתכנתים, מהנדסים, אנימטורים, אדריכלים ומתמטיקאים. כבר מהעבודות המוקדמות שלו הקבוצה ניסתה לערער את הרעיון המערבי הקלאסי של יצירת אמנות כעצם נפרד שתלוי על קיר. ב־Planets המבקר נכנס לתוך העבודה: הולכים יחפים, עוברים במים, שוקעים בחללים רכים ונכנסים לסביבות של אור, מראות וצליל שמשתנות לפי תנועה ונוכחות. המוזיאון נבנה בתקופה שבה Tokyo Bay הפכה למעבדה של תרבות דיגיטלית ואטרקציות חדשות, והוא מתאים מאוד ל־Toyosu — אזור תעשייתי ומסחרי שעבר שינוי מהיר למגורים, שוק חדש ותיירות. מה שמעניין היסטורית הוא ש־teamLab הפכה בתוך פחות משני עשורים מקבוצת יוצרים טכנולוגית יפנית לשם עולמי, ו־Planets הוא אחד האתרים שבהם זה קרה. הוא גם מראה שינוי באופן שבו מוזיאונים חושבים על קהל: לא עוד צפייה פסיבית, אלא גוף המבקר הופך לחלק מהיצירה עצמה.","infoSource":"https://www.teamlab.art/e/planets/"},{"id":"p_d640ee8241ae","name":"Small Worlds","city":"טוקיו","area":"Toyosu + Ariake","status":"רוצה","kind":"attraction","desc":"מוזיאון מיניאטורות ענק עם ערים, חלל, אנימה ומערכות מכניות.","duration":"1.5–2.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Small+Worlds+Japan","booking":"","website":"","info":"SMALL WORLDS ב־Ariake הוא מוזיאון חדש יחסית, אבל הוא נשען על מסורת יפנית ארוכה של דגמים, מיניאטורות ודיורמות. ביפן של המאה ה־20 התפתחה תרבות תחביבים עצומה סביב רכבות מודל, דגמי פלסטיק, mecha, Gunpla ומיניאטורות אדריכליות; היא חיברה דיוק טכני עם storytelling ועם הנאה מפרטים קטנים. SMALL WORLDS לוקח את המסורת הזו ומרחיב אותה באמצעות 3D scanning, תאורה מתוזמנת, מנגנוני תנועה ואוטומציה. חלק מהעולמות מבוססים על תעופה וחלל, אחרים על Evangelion ועל סביבות בדיוניות. הדבר המעניין הוא לא רק הקנה מידה אלא הרעיון שמודל יכול להיות מערכת חיה: מטוסים נעים, יום הופך ללילה, רכבות יוצאות בזמן ודמויות זעירות מספרות סיפורים מקבילים. המיקום ב־Ariake מתאים גם הוא להיסטוריה החדשה של Tokyo Bay — אזור של תערוכות, טכנולוגיה ומתקנים גדולים שנבנו על אדמה מיובשת. לכן הביקור הוא פחות 'מוזיאון צעצועים' ויותר מבט על תרבות יפנית של model-making, שבה דיוק, הנדסה ודמיון מתקיימים יחד.","infoSource":"https://smallworlds.jp/en/"},{"id":"p_4536e43127c9","name":"Toyosu Market","city":"טוקיו","area":"Toyosu + Ariake","status":"רוצה","kind":"attraction","desc":"שוק הסיטונאות המודרני של טוקיו עם מסעדות ותצפיות על פעילות השוק.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Toyosu+Market+Japan","booking":"","website":"","info":"Toyosu Market הוא התחנה החדשה ביותר בסיפור של שוקי הדגים של טוקיו, סיפור שמתחיל לפני יותר מארבע מאות שנה. בתחילת תקופת Edo הזמין Tokugawa Ieyasu דייגים מאוסקה לספק דגים לטירת Edo. בשנת 1610 קיבלו חלקם רשות למכור לציבור את העודפים, וכך התפתח שוק Nihonbashi. במשך כ־200 שנה הוא היה מרכז סחר הדגים של העיר. רעידת Kantō של 1923 החריבה את השוק והעניקה לממשלה הזדמנות לבנות מערכת מודרנית יותר; Tsukiji Market נפתח ב־1935 במתקן מתקדם שכלל מסילה ורציף. אחרי המלחמה גדלה טוקיו במהירות, וב־1963 כבר עברה אוכלוסייתה עשרה מיליון תושבים. Tsukiji, שתוכנן לעיר קטנה בהרבה, סבל מצפיפות ותשתיות מיושנות. אחרי עשרות שנות דיון נבחר Toyosu כאתר החדש, והשוק נפתח ב־2018. מעניין במיוחד שהאדמה המיובשת של Toyosu מכילה גם פסולת בנייה מרעידת 1923 — אותו אסון שהוביל מלכתחילה למעבר מ־Nihonbashi ל־Tsukiji. למרות המבנה החדש והסטרילי, המסורת נמשכת: מכירות פומביות עדיין משתמשות במחוות יד עתיקות, ויש עסקים שפעלו כבר בשוק Nihonbashi. זהו מקום שבו הלוגיסטיקה המודרנית ביותר יושבת על רצף מסחרי בן ארבע מאות שנה.","infoSource":"https://www.toyosu-market.or.jp/en/history-of-the-tokyo-fish-market/"},{"id":"p_8a15beabf088","name":"Senkyaku Banrai","city":"טוקיו","area":"Toyosu + Ariake","status":"רוצה","kind":"attraction","desc":"מתחם בסגנון יפני מסורתי עם אוכל, חנויות ואונסן רגליים/מרחצאות.","duration":"1–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Senkyaku+Banrai+Japan","booking":"","website":"","info":"Toyosu Senkyaku Banrai נפתח בפברואר 2024, כך שאין לו 'היסטוריה עתיקה' במובן הרגיל, אבל דווקא בגלל זה הוא מעניין כפרויקט שמנסה לייצר זיכרון היסטורי באופן מודע. שמו, 千客万来, פירושו בערך 'אלף אורחים באים, עשרת אלפים חוזרים' — ביטוי מסחרי שמאחל שגשוג ותנועה מתמדת של לקוחות. המתחם נבנה ליד Toyosu Market לאחר המעבר מ־Tsukiji, כדי לתת למבקרים חוויית אוכל ותיירות שהשוק הסיטונאי החדש והסגור יחסית אינו מספק. האדריכלות והרחובות תוכננו במכוון כדי להזכיר עיירת שוק מתקופת Edo: חזיתות עץ, סמטאות, שלטים ודוכנים. אבל חשוב להבין שזה אינו רובע היסטורי משומר — זו פרשנות עכשווית ל־Edo שנבנתה במאה ה־21. בתוך הפרויקט נמצא גם Tokyo Toyosu Manyo Club, שמביא מי מעיינות חמים מ־Hakone ו־Yugawara. כשמבקרים כאן אחרי Tsukiji ו־Toyosu Market, אפשר ממש להשוות בין שלושה דורות של 'שוק': מסחר אורגני היסטורי, תשתית סיטונאית מודרנית, ומתחם תיירות חדש שמנסה לעצב מחדש את זיכרון השוק.","infoSource":"https://www.gotokyo.org/en/spot/1858/index.html"},{"id":"p_a3d833975f7f","name":"teamLab Borderless","city":"טוקיו","area":"Azabudai + Roppongi","status":"חובה","kind":"attraction","desc":"מוזיאון אמנות דיגיטלית ללא מסלול קבוע, עם חללים שמשתנים ומתחברים זה לזה.","duration":"2–3 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=teamLab+Borderless+Japan","booking":"","website":"","info":"teamLab Borderless נפתח לראשונה ב־Odaiba בשנת 2018 תחת השם MORI Building DIGITAL ART MUSEUM: teamLab Borderless. המוזיאון היה ניסוי שאפתני: במקום לסדר יצירות בתוך חדרים נפרדים, teamLab יצרה עבודות דיגיטליות שיכולות 'לנדוד' מחדר לחדר, לפגוש עבודות אחרות ולהשתנות בהתאם למבקרים. ההצלחה הייתה עצומה, והמקום הפך לאחד מאתרי האמנות הדיגיטלית המזוהים ביותר עם טוקיו. בשנת 2022 הוא נסגר כחלק מהפיתוח מחדש של Odaiba, ובפברואר 2024 נפתח מחדש ב־Azabudai Hills. המעבר עצמו מספר משהו על טוקיו: אטרקציה שנולדה באזור waterfront עתידני הפכה לעוגן תרבותי בפרויקט התחדשות יוקרתי בלב העיר. הרעיון של Borderless — ביטול גבולות בין יצירה ליצירה, בין חלל לצופה ובין אמנות לטכנולוגיה — מתאים גם להיסטוריה של teamLab כקולקטיב שהוקם ב־2001 בידי יוצרים מתחומים שונים. אין כאן מסלול כרונולוגי או 'חדרים שחייבים לסמן'; דווקא האפשרות ללכת לאיבוד היא חלק מהיצירה. מבחינה היסטורית זהו אחד המקומות שממחישים איך יפן של המאה ה־21 הפכה טכנולוגיה דיגיטלית לשפה מוזיאלית בפני עצמה.","infoSource":"https://www.teamlab.art/e/tokyo/"},{"id":"p_db77d368e9f8","name":"Azabudai Hills","city":"טוקיו","area":"Azabudai + Roppongi","status":"רוצה","kind":"attraction","desc":"מתחם חדש ומעוצב עם אדריכלות, אוכל, חנויות ושטחים ירוקים.","duration":"60–120 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Azabudai+Hills+Japan","booking":"","website":"","info":"Azabudai Hills נפתח בנובמבר 2023, אבל מאחוריו עומד תהליך תכנון ופינוי־בינוי שנמשך יותר משלושים שנה. Mori Building התחילה לעבוד עם בעלי הקרקע באזור כבר בסוף שנות ה־80, בשטח שהיה מורכב מרחובות צרים, בתים קטנים ומגרשים מפוצלים. במקום לבנות מגדל בודד, הפרויקט תוכנן כ־'Modern Urban Village' — עיר בתוך עיר שמחברת מגורים, משרדים, בית ספר, חנויות, תרבות, מרפאות ושטחים ירוקים. Mori JP Tower הפך עם פתיחתו לאחד הבניינים הגבוהים ביפן, אבל האידיאולוגיה של הפרויקט נמצאת דווקא בקרקע: כ־24,000 מ\"ר של שטח ירוק, פי כמה מהמצב שהיה לפני הבנייה. Azabudai הוא חלק מרצף ארוך של Mori Building שהתחיל ב־Roppongi Hills ומנסה לפתור את הצפיפות של טוקיו באמצעות בנייה אנכית וריכוז שימושים. הוא גם קלט לתוכו את teamLab Borderless, שעבר מ־Odaiba, וכך הפך תרבות דיגיטלית לעוגן של שכונת־על חדשה. כשמטיילים כאן, כדאי להבין שהגנים, השבילים והמבנים אינם תוצאה אורגנית אלא עיר שתוכננה כמעט מאפס במשך דור שלם — ניסוי אורבני שמנסה להגדיר כיצד תיראה טוקיו במאה ה־21.","infoSource":"https://www.azabudai-hills.com/about/index.html"},{"id":"p_106fc40eca1f","name":"Tokyo Tower","city":"טוקיו","area":"Azabudai + Roppongi","status":"רוצה","kind":"attraction","desc":"המגדל האייקוני של טוקיו עם תצפיות ועיצוב רטרו.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+Tower+Japan","booking":"","website":"","info":"Tokyo Tower הושלם ב־23 בדצמבר 1958, בתקופה שבה יפן הייתה בעיצומה של התאוששות כלכלית מהירה אחרי מלחמת העולם השנייה. תפקידו המקורי היה מאוד מעשי: טוקיו קיבלה עוד ועוד תחנות טלוויזיה, והעיר הייתה זקוקה למגדל שידור מרכזי במקום אנטנות נפרדות. המהנדס Tachu Naitō תכנן מגדל פלדה בגובה 333 מטר, גבוה במעט מ־Eiffel Tower, ובזמן השלמתו הוא היה ממבני הפלדה העצמאיים הגבוהים בעולם. המבנה הוקם במהירות יוצאת דופן, תוך שימוש בכמות פלדה עצומה בתקופה שבה המדינה עדיין בנתה מחדש תשתיות. אבל כמעט מיד הוא הפך מסתם אנטנה לסמל. סוף שנות ה־50 ותחילת שנות ה־60 היו השנים שבהן טלוויזיה נכנסה לבתים, יפן הציגה צמיחה כלכלית מרשימה והכינה את עצמה לאולימפיאדת 1964. Tokyo Tower הופיעה בסרטים, anime ופרסומות, ולעיתים קרובות נהרסה על המסך בידי kaiju בדיוק משום שכל צופה יפני זיהה אותה. לאחר הקמת Tokyo Skytree ב־2012 חלק מתפקידי השידור עברו אליו, אך Tokyo Tower נשארה סמל רגשי של תקופת Shōwa. כשמביטים בה היום, רואים לא רק חיקוי של Paris אלא אנדרטה לביטחון החדש של יפן שלאחר המלחמה.","infoSource":"https://gallery.tokyotower.co.jp/en/"},{"id":"p_78d11b41d6a0","name":"Roppongi Hills","city":"טוקיו","area":"Azabudai + Roppongi","status":"רוצה","kind":"attraction","desc":"מתחם עירוני עם קניות, אמנות ותצפיות.","duration":"60–120 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Roppongi+Hills+Japan","booking":"","website":"","info":"Roppongi Hills נפתח ב־2003 אחרי תהליך פיתוח שנמשך יותר מ־15 שנה וכלל משא ומתן עם מאות בעלי קרקע. Mori Building, בהובלת Minoru Mori, רצתה ליצור 'עיר אנכית' שבה מגורים, עבודה, תרבות, מסחר ופנאי מתקיימים יחד כדי לצמצם נסיעות ולהחזיר חיים למרכז העיר. אבל הקרקע שעליה נבנה הפרויקט נושאת היסטוריה מוקדמת בהרבה. בתקופת Edo היה כאן חלק מאחוזת משפחת Mōri, ואפילו שם הגן Mōri Garden משמר את הקשר הזה. ב־1849 נולד באזור Nogi Maresuke, לימים גנרל מפורסם מתקופת Meiji. במאה ה־20 פעלו באזור מתקני תעשייה ומשרדי TV Asahi, ורק בסוף המאה התחיל האיחוד מחדש של החלקות. עם פתיחת Mori Tower ב־2003 הפך המקום לאחד מסמלי טוקיו של תחילת המאה ה־21 — פרויקט ענק שמשלב מוזיאון לאמנות עכשווית ותצפית בראש מגדל מסחרי. Roppongi Hills גם השפיע על פרויקטים מאוחרים יותר של Mori, כולל Toranomon ו־Azabudai Hills. לכן זהו אתר חשוב להבנת האופן שבו טוקיו מחדשת את עצמה: לא בהכרח על ידי מחיקת שכונה אחת ובניית גורד שחקים יחיד, אלא באמצעות יצירת מערכת עירונית שלמה בתוך מתחם אחד.","infoSource":"https://www.roppongihills.com/green/mohri/history.html"},{"id":"p_0b25a69b8bc4","name":"Mori Art Museum","city":"טוקיו","area":"Azabudai + Roppongi","status":"רוצה","kind":"attraction","desc":"מוזיאון לאמנות עכשווית בקומות העליונות של Roppongi Hills.","duration":"1–1.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Mori+Art+Museum+Japan","booking":"","website":"","info":"Mori Art Museum נפתח באוקטובר 2003 בראש Mori Tower כחלק מהרעיון של Roppongi Hills כ־'Cultural Heart of the City'. Minoru Mori האמין שמרכז עסקים ומגורים חדש אינו יכול להסתפק במשרדים ובחנויות, ולכן הציב מוזיאון לאמנות עכשווית במקום יוקרתי במיוחד — הקומות העליונות של אחד המגדלים החדשים בעיר. תערוכת הפתיחה, Happiness: A Survival Guide for Art and Life, כבר סימנה את הכיוון: לא מוזיאון שמסתפק באוסף היסטורי, אלא מוסד שבוחן נושאים חברתיים ועכשוויים דרך אמנות. במשך השנים המוזיאון הפך למקום חשוב לאמנות מאסיה וליוצרים בינלאומיים, והוא בחר לפעול בעיקר באמצעות תערוכות מתחלפות ולא לבנות אוסף קבוע ענק. גם שעות הפתיחה המאוחרות יחסית היו חלק מהרעיון — אמנות כחלק מחיי העיר ולא טקס שמסתיים אחר הצהריים. המיקום הגבוה יוצר קשר ישיר עם Tokyo City View הסמוכה: אפשר לעבור מתערוכה שעוסקת בחברה, טכנולוגיה או זהות ולצאת מיד לנוף של המטרופולין עצמו. לכן ההיסטוריה של המוזיאון קשורה פחות ליצירה אחת מפורסמת ויותר לניסוי עירוני: האם מוזיאון יכול להיות חלק טבעי מקניון, מגדל משרדים ושכונת מגורים בלי לאבד רצינות תרבותית.","infoSource":"https://www.mori.art.museum/en/about/index.html"},{"id":"p_051c180ce8e0","name":"Tokyo City View","city":"טוקיו","area":"Azabudai + Roppongi","status":"רוצה","kind":"attraction","desc":"תצפית גבוהה על העיר מ-Roppongi Hills.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+City+View+Japan","booking":"","website":"","info":"Tokyo City View נפתח יחד עם Roppongi Hills ב־2003 בקומה ה־52 של Mori Tower, בגובה של כ־250 מטר מעל פני הים. התצפית לא נבנתה כחלל נפרד לחלוטין מהמוזיאון הסמוך אלא כחלק מאותו חזון: תרבות, אמנות והעיר עצמה אמורות להיות חוויה אחת. החלונות הגדולים והחלל הגבוה נותנים זווית שונה מאוד מ־Shibuya Sky. מכאן Tokyo Tower נמצא כמעט 'בגובה העיניים', ואפשר להבין טוב יותר את היחסים בין Roppongi, Azabudai, מפרץ טוקיו והמרכז הישן של העיר. במשך השנים שימש החלל גם לתערוכות ואירועי תרבות, כך שהנוף עצמו הפך לרקע של תצוגה. היסטורית, התצפית היא חלק מתקופה שבה טוקיו החלה לבנות יותר ויותר מרחבים ציבוריים בראש מגדלים פרטיים — דרך להפוך גובה, שהיה בעבר בעיקר פונקציה של משרדים, לחוויה עירונית. אם Shibuya Sky מספרת את סיפור שיבויה הצעירה והמתחדשת, Tokyo City View מספרת את סיפור טוקיו העסקית־תרבותית של תחילת שנות ה־2000, עם Tokyo Tower הוותיקה מצד אחד ו־Azabudai החדשה מצד אחר.","infoSource":"https://tcv.roppongihills.com/en/enjoy/intro/"},{"id":"p_ee87744fa175","name":"21_21 Design Sight","city":"טוקיו","area":"Azabudai + Roppongi","status":"רוצה","kind":"attraction","desc":"מוזיאון/חלל עיצוב במתחם Tokyo Midtown שתוכנן בשיתוף Tadao Ando, עם תערוכות מתחלפות של עיצוב ותרבות.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=21_21+Design+Sight+Japan","booking":"","website":"","info":"21_21 DESIGN SIGHT נולד מתוך ויכוח מתמשך ביפן על השאלה מדוע למדינה שמייצרת כל כך הרבה עיצוב, אדריכלות וטכנולוגיה אין מוסד מרכזי שמלמד את הציבור לחשוב על design כחלק מהחיים. Issey Miyake דיבר כבר משנות ה־70 וה־80 עם יוצרים כמו Isamu Noguchi, Ikko Tanaka, Shiro Kuramata ו־Tadao Ando על הצורך במוזיאון כזה. ב־2003 הוא פרסם בעיתון Asahi Shimbun מאמר שקרא להקים 'מוזיאון לעיצוב', והדיון קיבל תנופה מעשית. בעזרת Mitsui Fudosan ותומכים נוספים נפתח 21_21 DESIGN SIGHT ב־Tokyo Midtown במרץ 2007. Tadao Ando תכנן את המבנה, שרובו קבור מתחת לאדמה; הגג נראה כיריעת פלדה ענקית המקופלת כלפי מטה והוא נוצר כמחווה לרעיון A Piece of Cloth של Miyake. אפילו השם בנוי כרעיון: 20/20 הוא ראייה תקינה, ו־21_21 אמור לרמוז ליכולת 'לראות מעבר'. המקום אינו מוזיאון עם אוסף קבוע אלא מעבדה של תערוכות על חיי יום־יום, חומרים, אוכל, שפה, טכנולוגיה ועיצוב. בשנת 2017, לציון עשור, נוסף Gallery 3. בזמן הביקור שלנו בדצמבר 2026 מוצגת לפי התכנית הרשמית תערוכה שמתחילה מן Hōjōki, טקסט יפני מהמאה ה־13 על ארעיות ומגורים, ומחברת אותו לשאלות של ארכיטקטורה קטנה וחיים מודרניים. לכן גם הבניין וגם התערוכה מספרים היסטוריה: ניסיון של מעצבים יפנים להפוך design ממוצר יפה לדרך לחשוב על חברה.","infoSource":"https://www.2121designsight.jp/en/designsight/"},{"id":"p_01c9510fb4ff","name":"MUJI Ginza","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"סניף דגל רב קומות של MUJI עם עיצוב, מוצרים, אוכל ומלון.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=MUJI+Ginza+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_657bf5ebbd80","name":"UNIQLO Ginza","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"סניף ענק ורב קומות של UNIQLO.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=UNIQLO+Ginza+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_80c211cfa03c","name":"Sony Park Ginza","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"מתחם תרבות/טכנולוגיה של Sony עם תערוכות מתחלפות.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Sony+Park+Ginza+Japan","booking":"","website":"","info":"Ginza Sony Park הוא פרויקט חדש, אבל הוא ממשיך סיפור שהתחיל ב־1966. באותה שנה פתח Akio Morita, ממייסדי Sony, את Sony Building בפינת Sukiyabashi בגינזה. הבניין היה חלון ראווה לטכנולוגיה יפנית בתקופה שבה Sony עצמה הפכה מסמל של שיקום תעשייתי למותג עולמי של רדיו, טלוויזיה ואלקטרוניקה. פרט קטן בתכנון הפך חשוב במיוחד: Morita השאיר בפינת המגרש שטח ציבורי של כ־33 מ\"ר במקום לנצל כל סנטימטר לבנייה, וכינה אותו 'Garden of Ginza'. במשך יותר מחמישים שנה Sony Building אירח השקות, תצוגות ומוצרים שהציגו לקהל את 'העתיד'. הבניין נסגר ב־2017. במקום להקים מיד מגדל חדש, Sony הרסה אותו ופתחה ב־2018 פארק זמני פתוח, Ginza Sony Park, כדי לבדוק מה יכול להיות מרחב ציבורי במגרש מסחרי יקר. ההצלחה הובילה לפרויקט הקבוע שנפתח ב־2025. הבניין החדש נמוך בכוונה מהשכנים וממשיך את הרעיון של 'Park of Ginza' — מקום של מוזיקה, אוכל, אמנות וטכנולוגיה ולא חנות דגל רגילה. לכן ההיסטוריה של האתר היא למעשה היסטוריה של Sony עצמה: מחברת אלקטרוניקה שמציגה מוצרים בחלון ראווה לחברה שמנסה להשתמש באותו מגרש כדי לחשוב מחדש על הקשר בין מותג, עיר ומרחב ציבורי.","infoSource":"https://www.sonypark.com/e/"},{"id":"p_6d2193c973f2","name":"Nissan Crossing","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"חלל תצוגה עתידני של Nissan עם רכבים וטכנולוגיה.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Nissan+Crossing+Japan","booking":"","website":"","info":"NISSAN CROSSING נמצא בצומת Ginza 4-chome, אחד הצמתים הסמליים של יפן המודרנית, ולכן עצם המיקום שלו חשוב. Ginza שימשה מאז תקופת Meiji חלון ראווה לטכנולוגיה חדשה, תאורה, בתי כלבו, אופנה ותרבות צריכה. Nissan השתמשה במשך שנים באזור כדי להציג מכוניות לא רק כאמצעי תחבורה אלא כסמל של תעשייה יפנית מודרנית. החלל הנוכחי נפתח ב־2016 כחלק מבניין GINZA PLACE, במקום שבו פעל קודם Nissan Gallery. הוא תוכנן סביב רעיון של תנועה וספירלה, ומשמש להצגת concept cars, רכבים חדשים, עיצוב וטכנולוגיות Intelligent Mobility. ההיסטוריה הרחבה יותר היא של תעשיית הרכב היפנית עצמה: אחרי מלחמת העולם השנייה חברות כמו Nissan הפכו ממפעלים מקומיים ליצואניות גלובליות והיו חלק מרכזי מהצמיחה הכלכלית של יפן בשנות ה־60 עד ה־80. הצבת מכוניות ניסיוניות בלב Ginza ממשיכה מסורת של הרובע כמקום שבו הציבור פוגש את 'החדש' לפני שהוא הופך ליומיומי. לכן אין דגם אחד שחייבים לראות; מה שמעניין הוא לראות כיצד Nissan מספרת בכל תקופה מחדש את הסיפור של העתיד — מכניקה, חשמל, אוטונומיה וקישוריות — בתוך שכונה שכבר יותר ממאה שנה משמשת במה למודרניות יפנית.","infoSource":"https://www.nissan.co.jp/CROSSING/"},{"id":"p_b276344cf52a","name":"Art Aquarium Museum","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"מיצגי אמנות ותאורה סביב אקווריומים של דגי זהב.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Art+Aquarium+Museum+Japan","booking":"","website":"","info":"Art Aquarium Museum Ginza הוא מוסד חדש, אבל הסיפור שהוא מציג מתחיל מאות שנים קודם. דגי זהב הגיעו ליפן מסין בתקופת Muromachi, בתחילה כחיית נוי יקרה שהייתה זמינה בעיקר לאליטות. בתקופת Edo, עם התפתחות טכניקות גידול וירידת המחירים, goldfish הפכו לחלק מתרבות הפנאי העירונית. משפחות החלו לגדל אותם, מגדלים פיתחו זנים חדשים, והדגים הופיעו באמנות, בצעצועים, בפסטיבלים וב־ukiyo-e. אמנים כמו Utagawa Kuniyoshi השתמשו בדגי זהב בצורה הומוריסטית ואנושית, ובמהלך מאות השנים התפתחו ביפן זנים כמו ranchu, ryukin ו־tosakin. Art Aquarium לוקח את המסורת הזאת ומתרגם אותה לשפה של המאה ה־21: מיכלים פיסוליים, תאורה, מוזיקה, כלי Kutani ומוטיבים של מקדשים וגנים. הגרסה הקבועה בגינזה נפתחה בתוך Ginza Mitsukoshi, כלומר בתוך בית כלבו — עוד חיבור יפני בין תרבות, מסחר ובידור. חשוב להבין שהחוויה אינה 'מוזיאון היסטורי לדגי זהב' אלא פרשנות עכשווית לתרבות גידול עתיקה. כשמסתכלים מעבר לאפקטים, שווה לשים לב להבדלים בין הזנים ולזכור שבמשך מאות שנים המראה שלהם עוצב ממש בידי מגדלים יפנים.","infoSource":"https://artaquarium.jp/enjoy/tradition/"},{"id":"p_4a9b510ea92c","name":"Hamarikyu Gardens","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"גן יפני היסטורי עם בריכות, בית תה וניגוד יפה לגורדי השחקים.","duration":"1–1.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Hamarikyu+Gardens+Japan","booking":"","website":"","info":"Hamarikyu הוא אחד המקומות שבהם אפשר לראות ממש את הגאוגרפיה של Edo בתוך טוקיו המודרנית. בשנת 1654 מילא Matsudaira Tsunashige, אחיו הצעיר של השוגון הרביעי Tokugawa Ietsuna, חלק מהמים הרדודים של Edo Bay ובנה על הקרקע החדשה את Kōfu Hama-yashiki, אחוזת חוף. כאשר בנו, Tokugawa Ienobu, הפך לשוגון השישי, עבר האתר לבעלות השוגונות ושמו שונה ל־Hama Goten — 'ארמון החוף'. שוגונים המשיכו להרחיב ולשנות אותו במשך יותר ממאה שנה, והגן קיבל את צורתו הבסיסית בתקופת השוגון ה־11 Ienari. האלמנט החשוב ביותר הוא Shioiri-no-ike, בריכת גאות שמחוברת למי המפרץ ומפלסה משתנה עם הגאות והשפל — מערכת שהייתה אופיינית לגני daimyo על קו המים וכמעט נעלמה מטוקיו. בשטח היו גם מתקנים לציד ברווזים, פעילות של האליטה השוגונית. אחרי רסטורציית Meiji ב־1868 עבר הגן למשפחה הקיסרית והפך Hama Detached Palace. רעידת 1923 והפצצות 1945 פגעו במבנים ובצמחייה, ולאחר המלחמה הועבר האתר לעיר ונפתח לציבור. כשעומדים בבית התה על האגם ורואים מאחור את גורדי השחקים של Shiodome, מקבלים באותו פריים גן של שוגונים מהמאה ה־17, היסטוריה קיסרית מהמאה ה־19 וטוקיו העסקית של המאה ה־21.","infoSource":"https://www.tokyo-park.or.jp/teien/en/hama-rikyu/outline.html"},{"id":"p_35264dbe4296","name":"Tokyo Character Street","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"מסדרון חנויות דמויות בתחנת Tokyo: anime, TV, mascots ועוד.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+Character+Street+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_cd5be653a74b","name":"Tokyo Station Marunouchi","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"חזית הלבנים ההיסטורית של תחנת טוקיו והאזור המודרני סביבה.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+Station+Marunouchi+Japan","booking":"","website":"","info":"Tokyo Station נפתחה ב־1914 כבניין השער של הבירה המודרנית. האדריכל Tatsuno Kingo, מהאבות של האדריכלות היפנית המודרנית, תכנן חזית לבנים אדומות ארוכה עם כיפות גדולות בקצוות. התחנה נבנתה בתקופה שבה יפן כבר הפכה למעצמה תעשייתית ואימפריאלית, והרכבת הייתה אחד הסמלים המרכזיים של המדינה החדשה. המבנה הוכיח את חוזקו ברעידת Kantō של 1923 ושרד אותה יחסית היטב, אבל בהפצצות טוקיו ב־1945 נשרפו הגגות, הכיפות והקומה השלישית. בגלל מחסור בחומרים אחרי המלחמה שוקמה התחנה במהירות בצורה פשוטה יותר: הכיפות הוחלפו בגגות מתומנים והקומה השלישית לא נבנתה מחדש. במשך יותר משישים שנה זה היה המראה המוכר. ב־2003 הוכר המבנה כ־Important Cultural Property, וב־2007 התחיל פרויקט שחזור ענק שהתבסס על תכניות, צילומים וממצאים מקוריים. ב־2012 חזרה התחנה כמעט למראה של 1914, כולל הכיפות והקומה השלישית. לכן הבניין שאנחנו רואים היום הוא לא 'ישן לחלוטין' ולא 'חדש' — הוא שחזור מדויק יחסית של עבר שנפגע במלחמה. כדאי להיכנס מתחת לכיפות ולראות את העיטורים, ואז לצאת לכיכר Marunouchi ולהבין עד כמה התחנה הפכה לציר שמחבר בין הרכבת הלאומית, רובע העסקים והארמון הקיסרי.","infoSource":"https://www.gotokyo.org/en/story/walks-and-tours/tokyo-architecture-tokyo-station/index.html"},{"id":"food_ts_tantan","name":"T’s Tantan Tokyo Station","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"food","desc":"ראמן טבעוני בתחנת Tokyo Station. מקום נוח מאוד לארוחה מהירה ובטוחה לצמחונית בלי דגים או dashi.","duration":"30–60 דק׳","note":"טבעוני לחלוטין.","maps":"https://www.google.com/maps/search/?api=1&query=T%27s+Tantan+Tokyo+Station","booking":"","website":"https://foods.jr-cross.co.jp/ts-tantan/","historyNotApplicable":true},{"id":"p_fd1aa1ebe25b","name":"Sunshine Aquarium","city":"טוקיו","area":"Ikebukuro","status":"רוצה","kind":"attraction","desc":"אקווריום עירוני עם פינגווינים, לוטרות ותצוגות יצירתיות.","duration":"1.5–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Sunshine+Aquarium+Japan","booking":"","website":"","info":"Sunshine Aquarium נפתח ב־1978 כחלק מ־Sunshine City באיקבוקורו, אחד מפרויקטי ה־mixed-use הגדולים והשאפתניים של טוקיו באותה תקופה. Sunshine 60, המגדל המרכזי, נבנה על האתר שבו עמד בעבר בית הכלא Sugamo — מקום שבו הוחזקו והוצאו להורג גם פושעי מלחמה אחרי 1945 — והפרויקט כולו נועד להפוך את האזור לסמל של טוקיו החדשה. בתוך הקומפלקס נפתח Sunshine International Aquarium על גג World Import Mart. עצם הרעיון היה חריג: אקווריום גדול לא ליד הים אלא גבוה בתוך אזור מסחרי צפוף. בשנת 2010 נסגר המקום לשיפוץ של כמעט שנה ונפתח מחדש באוגוסט 2011 בשם Sunshine Aquarium, עם תפיסה של 'Oasis in the Sky'. אחד הסמלים החדשים הוא Penguins in the Sky, מיכל חיצוני תלוי שבו הפינגווינים נראים כאילו הם שוחים מעל קו הרקיע של Ikebukuro. כך המקום עבר מאקווריום עירוני של שנות ה־70 לחוויה שמנצלת במכוון את הצפיפות והגובה של טוקיו. כשמבקרים, הניגוד הוא החלק המעניין: חיות ימיות ומים מול מגדלים, רכבות ורחובות — טבע שמוצג לא מחוץ לעיר אלא ממש בתוכה.","infoSource":"https://sunshinecity.jp/en/aquarium/area/"},{"id":"p_7021610ad3e5","name":"Bandai Namco Cross Store","city":"טוקיו","area":"Ikebukuro","status":"רוצה","kind":"attraction","desc":"מתחם עם מותגי Bandai Namco, משחקים, דמויות ומרצ׳נדייז.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Bandai+Namco+Cross+Store+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_a2be9c6b2fe0","name":"NAMJATOWN","city":"טוקיו","area":"Ikebukuro","status":"רוצה","kind":"attraction","desc":"פארק indoor קטן ומשונה עם מתקנים, אוכל ודמויות.","duration":"1–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=NAMJATOWN+Japan","booking":"","website":"","info":"NAMJATOWN נפתח ב־6 ביולי 1996 בתוך Sunshine City בשם Sunshine Namja Town, בתקופה שבה חברות המשחקים היפניות חיפשו דרכים להרחיב את העולמות שלהן מעבר למסך. Namco, שהייתה כבר שם ענק בארקיידים ובמשחקים, בנתה כאן פארק מקורה שמבוסס על רחובות, דמויות, חידות ואטרקציות בקנה מידה קטן — לא על רכבות הרים ענקיות. ב־1997 נפתח אזור רוחות ו־yōkai, ובהמשך נוספו אטרקציות ששילבו טכנולוגיה וסיפור. פרק חשוב הגיע ב־2002 עם Ikebukuro Gyoza Stadium, שהיה מהחלוצים של 'food theme parks' ביפן: אוכל אזורי הפך בעצמו לאטרקציה. במשך השנים הפארק הסתגל לעליית anime ו־character collaborations והפך למקום שבו Bandai Namco יכולה להפוך IP דיגיטלי לחלל פיזי. ב־2021 נפתח Nyanja Town של חתולים, ב־2024 נוסף אזור נינג'ה, וב־2026, לציון 30 שנה, נעשה שיפוץ גדול ונוספו אטרקציות חדשות כולל Taiko no Tatsujin בקנה מידה ענק. לכן NAMJATOWN מעניין כהיסטוריה של תעשיית הבידור היפנית עצמה: מארקיידים של שנות ה־80 וה־90, דרך פארקי אוכל ו־character culture, ועד חוויות שמבוססות על IP ומשחקים מוכרים מהטלפון והקונסולה.","infoSource":"https://bandainamco-am.co.jp/tp/namja/NEWS/info/20260618_1.html"},{"id":"p_6b5329e13d24","name":"Animate Ikebukuro","city":"טוקיו","area":"Ikebukuro","status":"רוצה","kind":"attraction","desc":"חנות ענקית לאנימה, מנגה ו-merchandise.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Animate+Ikebukuro+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_d028272c6442","name":"Neco Republic Ikebukuro rescue cat café","city":"טוקיו","area":"Ikebukuro","status":"רוצה","kind":"attraction","desc":"בית קפה עם חתולי הצלה ואימוץ. מתאים יותר למי שמעדיף מודל עם רווחת בעלי חיים.","duration":"60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Neco+Republic+Ikebukuro+rescue+cat+caf%C3%A9+Japan","booking":"","website":"","info":"Neco Republic שייך לדור מאוחר יותר של cat cafés ביפן. בתי קפה עם חתולים הפכו לתופעה יפנית מפורסמת במיוחד בשנות ה־2000, בין היתר משום שהם סיפקו לתושבי ערים צפופות אפשרות לבלות עם בעלי חיים גם כאשר חוזי שכירות ודירות קטנות מקשים להחזיק חיית מחמד. עם הזמן עלתה גם ביקורת סביב רווחת בעלי החיים, ומכאן צמחו מודלים שמחברים את בית הקפה להצלה ואימוץ. Neco Republic נבנה סביב הרעיון הזה: החתולים במקום אינם רק 'עובדי בידור' אלא חתולי rescue, והפעילות נועדה לחשוף אנשים לאימוץ, לגייס תמיכה ולהפחית המתות של חתולים ללא בית. מבחינה תרבותית זהו שינוי מעניין בתוך פורמט מאוד יפני: אטרקציה שנולדה מתוך צפיפות עירונית ותרבות kawaii מקבלת תפקיד חברתי. באיקבוקורו, אזור שמלא ב־character cafés, anime ובידור ממותג, המקום יוצר ניגוד — עדיין חוויה נעימה וחמודה, אבל עם מסר על אחריות. לכן בביקור חשוב לכבד את כללי המגע והצילום ולתת לחתולים לבחור אם להתקרב; זה חלק מההבדל בין rescue café לבין מקום שבו בעל החיים הוא רק תפאורה.","infoSource":"https://www.neco-republic.jp/"},{"id":"p_5dcfa1bddcef","name":"Pokémon Center MEGA TOKYO","city":"טוקיו","area":"Ikebukuro","status":"חובה","kind":"attraction","desc":"אחד ממרכזי Pokémon הגדולים בטוקיו, בתוך Sunshine City באיקבוקורו, עם מבחר גדול של מרצ'נדייז ומוצרים בלעדיים.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Pokemon+Center+MEGA+TOKYO+Sunshine+City+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_0169f1c102f4","name":"Pikachu Sweets by Pokémon Cafe","city":"טוקיו","area":"Ikebukuro","status":"חובה","kind":"food","desc":"דוכן Pokémon Café בסגנון takeaway ליד Pokémon Center MEGA TOKYO, עם משקאות וקינוחים בעיצוב Pokémon.","duration":"20–40 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Pikachu+Sweets+by+Pokemon+Cafe+Sunshine+City+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_f4d7f88e6d14","name":"Rikugien Garden","city":"טוקיו","area":"Autumn Gardens","status":"חובה","kind":"attraction","desc":"גן יפני קלאסי ומרהיב במיוחד בשלכת, לעיתים עם תאורת ערב עונתית.","duration":"1–1.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Rikugien+Garden+Japan","booking":"","website":"","info":"Rikugien נבנה סביב 1702 בידי Yanagisawa Yoshiyasu, יועץ רב־עוצמה של השוגון החמישי Tokugawa Tsunayoshi. הוא קיבל את הקרקע מהשוגון והקדיש שנים לעיצוב גן kaiyū — גן טיול שבו המבקר נע סביב אגם ונחשף בהדרגה לסצנות שונות. אבל Rikugien אינו רק נוף יפה; הוא בנוי סביב שירת waka. Yoshiyasu יצר בתוך הגן ייצוגים של נופים שהוזכרו בשירה יפנית ובקלאסיקות סיניות, כך שהמבקר המשכיל בתקופת Edo היה אמור לזהות רמזים ספרותיים תוך כדי הליכה. אפילו השם Rikugien מתייחס ל'שש הקטגוריות' של שירה, מושג שמקורו בסין והשפיע על מסורת waka. אחרי נפילת שוגונות Tokugawa הגן עבר ידיים, ובתקופת Meiji רכש אותו Iwasaki Yatarō, מייסד Mitsubishi, והשתמש בו כאחוזה שנייה. משפחת Iwasaki שמרה על המקום ותרמה אותו לעיר טוקיו ב־1938. ב־1953 הוא הוכר כ־Special Place of Scenic Beauty. לכן הגן שאנחנו רואים היום שרד בזכות שילוב יוצא דופן של שוגון, פטרון ספרות מהמאה ה־18 ומשפחת תעשיינים מהמאה ה־19. כשמטיילים סביב האגם, כדאי לזכור שהשבילים נועדו ממש 'לערוך' את הנוף — להסתיר תמונה, לפתוח אחרת ולגרום לטבע להיקרא כמו שיר.","infoSource":"https://www.tokyo-park.or.jp/teien/en/rikugien/outline.html"},{"id":"p_b61f77e1a145","name":"Koishikawa Korakuen","city":"טוקיו","area":"Autumn Gardens","status":"רוצה","kind":"attraction","desc":"אחד הגנים היפניים העתיקים בטוקיו, עם בריכות, גשרים ושלכת.","duration":"1–1.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Koishikawa+Korakuen+Japan","booking":"","website":"","info":"Koishikawa Kōrakuen הוא אחד מגני ה־daimyo העתיקים ביותר ששרדו בטוקיו. הוא החל להיבנות ב־1629 עבור Tokugawa Yorifusa, מייסד ענף Mito של משפחת Tokugawa, והושלם בתקופת בנו Tokugawa Mitsukuni — דמות מלומדת שהפכה מאוחר יותר לגיבור תרבות פופ תחת הכינוי Mito Kōmon. Mitsukuni התעניין עמוקות בלימוד ובהיסטוריה והושפע מהמלומד הסיני Zhu Shunshui, פליט משושלת Ming שהגיע ליפן. בהשפעתו שולבו בגן אלמנטים סיניים כמו Full Moon Bridge וייצוג של West Lake. גם השם Kōrakuen מגיע ממשפט קונפוציאני המיוחס ל־Fan Zhongyan: שליט טוב צריך 'לדאוג לפני כולם וליהנות אחרי כולם'. כלומר, אפילו שם הגן היה הצהרה על אידאל של שלטון. הגן בנוי כ־kaiyū, מסלול סביב אגם עם גבעות מלאכותיות, גשרים ונופים שמייצגים מקומות אמיתיים מסין ומיפן. הוא שרד את רעידת Kantō, את המלחמה ואת הפיתוח האורבני העצום סביבו, והיום Tokyo Dome וגורדי שחקים מציצים מעבר לעצים. ההיסטוריה שלו חשובה משום שהיא מזכירה ש־Edo לא הייתה תרבות סגורה בתוך עצמה; האליטה של Tokugawa קראה טקסטים סיניים, הזמינה מלומדים זרים ושילבה רעיונות חיצוניים בתוך נוף יפני.","infoSource":"https://www.tokyo-park.or.jp/teien/en/koishikawa/outline.html"},{"id":"p_e99feaf36cfc","name":"Kiyomizu-dera","city":"קיוטו","area":"Higashiyama + Gion","status":"חובה","kind":"attraction","desc":"מקדש מפורסם על גבעה עם מרפסת עץ ונוף לקיוטו.","duration":"1–1.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kiyomizu-dera+Japan","booking":"","website":"","kyotoCandidate":true,"info":"זהו אחד האתרים המזוהים ביותר עם קיוטו: מקדש בודהיסטי שהשורשים שלו מגיעים למאה ה־8, בנוי על מדרון הר Otowa. מרפסת העץ הגדולה מאפשרת להבין את הקשר בין המקדש, היער והעיר שמתחת. במסמכי המקור הודגש שהגישה והירידה מהמקדש הן חלק מהחוויה, ולכן כדאי להתייחס אליו כפתיחה של רצף Higashiyama ולא כתחנה מבודדת.","kyotoWhy":"להגיע מוקדם. זה אחד המקומות שבהם השעה משנה מאוד את איכות הביקור.","kyotoCombine":"מתחבר טבעית ל־Sannenzaka → Ninenzaka → Kōdai-ji → Yasaka → Gion.","kyotoSources":["1811","תכנון 2025","ELAL"],"youtube":"https://www.youtube.com/results?search_query=Kiyomizu-dera+Kyoto+Japan","kyotoMinutes":60,"kyotoDefaultDay":"3"},{"id":"p_43740fb1fbb4","name":"Sannenzaka","city":"קיוטו","area":"Higashiyama + Gion","status":"חובה","kind":"attraction","desc":"רחוב היסטורי יפה עם בתי עץ, חנויות וממתקים.","duration":"30–45 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Sannenzaka+Japan","booking":"","website":"","kyotoCandidate":true,"info":"המדרון ההיסטורי היורד מאזור Kiyomizu-dera מלא בתי עץ, חנויות קרמיקה, ממתקים ובתי תה. הוא התפתח לאורך נתיב העלייה לרגל למקדש ולכן גם כשהוא מסחרי מאוד היום, המבנה העירוני שלו עדיין קשור לתנועת המבקרים ההיסטורית אל Kiyomizu.","kyotoWhy":"לא צריך 'לסמן וי'. עדיף ללכת לאט ולעצור רק בחנויות שמעניינות באמת.","kyotoCombine":"עם Ninenzaka ו־Yasaka Pagoda באותו רצף הליכה.","kyotoSources":["1811","תכנון 2025"],"youtube":"https://www.youtube.com/results?search_query=Sannenzaka+Kyoto+Japan","kyotoMinutes":38,"kyotoDefaultDay":"3"},{"id":"p_ad0964a285b3","name":"Ninenzaka","city":"קיוטו","area":"Higashiyama + Gion","status":"חובה","kind":"attraction","desc":"סמטה מסורתית פוטוגנית המחברת בין אזור Kiyomizu ל-Gion.","duration":"30–45 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Ninenzaka+Japan","booking":"","website":"","kyotoCandidate":true,"info":"עוד אחת מהסמטאות השמורות של Higashiyama, עם חזיתות מסורתיות, בתי תה וחנויות קטנות. היא מחברת בצורה כמעט מושלמת בין Kiyomizu-dera לבין Kōdai-ji/Gion ולכן הערך שלה הוא גם באווירה וגם בלוגיסטיקה.","kyotoWhy":"צפוף מאוד בשעות השיא; בוקר מוקדם או אחר הצהריים המאוחר נעימים יותר.","kyotoCombine":"Sannenzaka → Ninenzaka → Kōdai-ji.","kyotoSources":["1811","תכנון 2025"],"youtube":"https://www.youtube.com/results?search_query=Ninenzaka+Kyoto+Japan","kyotoMinutes":38,"kyotoDefaultDay":"3"},{"id":"p_8ecae80d31fb","name":"Yasaka Pagoda","city":"קיוטו","area":"Higashiyama + Gion","status":"רוצה","kind":"attraction","desc":"פגודה בולטת בלב Higashiyama, אחת התמונות המזוהות עם קיוטו.","duration":"15–30 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Yasaka+Pagoda+Japan","booking":"","website":"","kyotoCandidate":true,"info":"פגודת Hōkan-ji היא אחד הסמלים המצולמים של Higashiyama. לרוב החוויה החשובה היא המראה שלה מתוך הרחובות המסורתיים ולא ביקור ארוך בתוך האתר.","kyotoWhy":"מתאים כמיקרו־סטופ של 15–20 דקות, לא כעוגן של יום.","kyotoCombine":"בין Ninenzaka/Kiyomizu לבין Yasaka/Gion.","kyotoSources":["v79"],"youtube":"https://www.youtube.com/results?search_query=Yasaka+Pagoda+Kyoto+Japan","kyotoMinutes":22},{"id":"p_beeeb488b665","name":"Kodai-ji","city":"קיוטו","area":"Higashiyama + Gion","status":"רוצה","kind":"attraction","desc":"מקדש וגנים יפים, במיוחד בסתיו ובתאורת ערב.","duration":"60–90 דק׳","note":"",
