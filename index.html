:"Shibuya + Harajuku","status":"רוצה","kind":"attraction","desc":"מעבר החציה האייקוני של שיבויה, מוקף במסכי ענק ומרכזי קניות.","duration":"15–30 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Shibuya+Crossing+Japan","booking":"","website":"","info":"מעבר החציה של שיבויה הוא תוצר של הפיכתה של Shibuya לצומת תחבורה, מסחר ותרבות צעירה במאה ה־20. כיום עד כאלף אנשים יכולים לחצות אותו במחזור אור אחד, אבל הסיפור האנושי המזוהה ביותר עם המקום הוא Hachikō: כלב אקיטה שחיכה בתחנה לבעליו, פרופ׳ Hidesaburō Ueno, גם לאחר מותו ב־1925, במשך כמעט תשע שנים. הפסל שלו ליד התחנה הפך לנקודת מפגש לאומית ולסמל של נאמנות. כשמגיעים, כדאי לחצות פעם אחת בתוך הקהל ואז לצפות על אותו מרחב מלמעלה; כך רואים איך תחבורה, מסכים, מסחר וסיפור מקומי קטן הפכו יחד לאחד הדימויים המזוהים ביותר עם טוקיו.","infoSource":"https://www.gotokyo.org/en/spot/78/index.html"},{"id":"p_3af3a17396e1","name":"Shibuya Sky","city":"טוקיו","area":"Shibuya + Harajuku","status":"חובה","kind":"attraction","desc":"תצפית פתוחה מעל שיבויה עם נוף 360° של טוקיו. הכי יפה לקראת שקיעה.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Shibuya+Sky+Japan","booking":"","website":"","info":"SHIBUYA SKY נפתח ב־2019 כחלק מ־Shibuya Scramble Square, פרויקט ענק של התחדשות סביב תחנת Shibuya. המגדל מתנשא לכ־230 מטר והתצפית מגיעה לכ־229 מטר וכוללת גג פתוח של 360°. החשיבות שלו היא דווקא חדשה: Shibuya, שהייתה מזוהה בעיקר עם תרבות רחוב ואופנה בגובה הקרקע, הפכה גם למרכז של אדריכלות, עסקים והתחדשות עירונית. מהגג אפשר לקרוא את העיר כמעט כמו מפה — מעבר החציה ממש מתחת, הירק של Meiji Jingu ו־Yoyogi בצד אחד וגורדי השחקים של Shinjuku בצד אחר. סביב שקיעה רואים את טוקיו משתנה מאור יום לרשת עצומה של אורות.","infoSource":"https://www.shibuya-scramble-square.com/en/"},{"id":"p_a58598c2bd69","name":"MEGA Don Quijote","city":"טוקיו","area":"Shibuya + Harajuku","status":"רוצה","kind":"attraction","desc":"חנות ענקית עם אוכל, קוסמטיקה, גאדג'טים, מתנות ודברים יפניים מוזרים.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=MEGA+Don+Quijote+Japan","booking":"","website":""},{"id":"p_c64d09b98edc","name":"Cat Street","city":"טוקיו","area":"Shibuya + Harajuku","status":"רוצה","kind":"attraction","desc":"רחוב אופנתי בין שיבויה להראג'וקו עם בוטיקים, קפה וחנויות מיוחדות.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Cat+Street+Japan","booking":"","website":"","info":"Cat Street הוא הכינוי העממי לציר הולכי רגל המחבר בין Harajuku לשיבויה. הוא התפתח לאורך אזור שהיה קשור בעבר לתוואי של נהר Shibuya והפך במחצית השנייה של המאה ה־20 לזירה של אופנת רחוב, בוטיקים ותרבות יצירתית. בניגוד ל־Takeshita-dori, הוא משקף גרסה בוגרת ושקטה יותר של תרבות Harajuku. אין כאן אירוע היסטורי יחיד גדול; הסיפור הוא שינוי עירוני — תשתית שהפכה לטיילת ורחוב שהפך למעבדה של אופנה ועיצוב. שווה להסתכל גם על הסמטאות, המבנים וחזיתות הבטון, לא רק על החנויות.","infoSource":"https://www.gotokyo.org/en/destinations/western-tokyo/harajuku/index.html"},{"id":"p_e70c6ae645e4","name":"Omotesando","city":"טוקיו","area":"Shibuya + Harajuku","status":"רוצה","kind":"attraction","desc":"שדרה אלגנטית עם אדריכלות, חנויות דגל ובתי קפה.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Omotesando+Japan","booking":"","website":"","info":"Omotesandō פירושו 'דרך הגישה הקדמית', משום שהשדרה נבנתה כציר הגישה הראשי אל Meiji Jingu שנחנך ב־1920. אחרי מלחמת העולם השנייה ובמיוחד סביב אולימפיאדת 1964 האזור השתנה במהירות והפך בהדרגה לאחת מזירות האדריכלות והאופנה החשובות בטוקיו. בתי אופנה בינלאומיים בחרו להציב כאן מבנים שתוכננו בידי אדריכלים בולטים, כך שהבניין עצמו לעיתים מעניין לא פחות מהמותג שבתוכו. זה מקום מצוין לראות כיצד דרך שנולדה מתוך הקשר דתי הפכה בתוך מאה שנה לבמה של עיצוב עכשווי, בלי שהקשר המקורי ל־Meiji Jingu נעלם.","infoSource":"https://www.gotokyo.org/en/destinations/western-tokyo/aoyama-and-omotesando/index.html"},{"id":"p_7e208fa562af","name":"Takeshita Street","city":"טוקיו","area":"Shibuya + Harajuku","status":"רוצה","kind":"attraction","desc":"רחוב צבעוני בהראג'וקו עם אופנה צעירה, מתוקים וחנויות קטנות.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Takeshita+Street+Japan","booking":"","website":"","info":"Takeshita-dori הפך בעיקר משנות ה־70 וה־80 לאחד המרכזים המזוהים עם אופנת צעירים ביפן. Harajuku הסמוכה ל־Washington Heights האמריקאי נחשפה אחרי המלחמה להשפעות מערביות, ובהמשך צעירים החלו להגיע בסופי שבוע וליצור סגנונות לבוש עצמאיים. בשנות ה־80 וה־90 נולדו באזור תתי־תרבויות כמו Lolita, decora ו־visual kei, והמסחר התפתח סביבן. Takeshita הפכה לגרסה המרוכזת וההמונית של התהליך הזה — קוואי, purikura, קרפים וטרנדים מתחלפים. מה שמעניין כאן הוא לראות איך תרבות שנוצרה מלמטה על ידי צעירים הפכה עם הזמן למותג בינלאומי של יפן.","infoSource":"https://www.gotokyo.org/en/spot/48/index.html"},{"id":"p_6b26a3271a88","name":"Meiji Jingu Shrine","city":"טוקיו","area":"Shibuya + Harajuku","status":"חובה","kind":"attraction","desc":"מקדש שינטו חשוב בתוך יער גדול ושקט בלב טוקיו.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Meiji+Jingu+Japan","booking":"","website":"","info":"Meiji Jingu הוקם ב־1920 לזכר הקיסר Meiji והקיסרית Shōken, אחרי מותם ב־1912 וב־1914. המקום מספר את סיפור המעבר של יפן ממשטר פיאודלי למדינה מודרנית ומתועשת. גם היער סביבו מתוכנן: כ־100,000 עצים נתרמו מכל רחבי יפן, והמתכננים בנו יער שאמור להתחדש בעצמו לאורך דורות. רוב מבני המקדש נשרפו בהפצצות 1945 ונבנו מחדש ב־1958, בעוד היער שרד. בדרך פנימה חפשו את שערי ה־torii, חביות הסאקה וחביות היין הצרפתי — שילוב שממחיש היטב את תקופת Meiji: אימוץ השפעות זרות לצד שמירה על זהות יפנית. זה אינו 'מקדש עתיק בתוך יער עתיק', אלא אנדרטה מודרנית שנבנתה בכוונה בשפה של מסורת עתיקה.","infoSource":"https://www.meijijingu.or.jp/en/about/establishment/"},{"id":"p_fec2263640bb","name":"Yoyogi Park","city":"טוקיו","area":"Shibuya + Harajuku","status":"רוצה","kind":"attraction","desc":"פארק גדול ונעים ליד Meiji Jingu, טוב להפסקה ירוקה.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Yoyogi+Park+Japan","booking":"","website":"","info":"השטח של Yoyogi Park עבר כמה גלגולים שמספרים כמעט את כל ההיסטוריה המודרנית של יפן. ב־1910 נערכה בו הטיסה הממונעת הראשונה ביפן; בהמשך הצבא הקיסרי השתמש באזור לאימונים ומצעדים; אחרי 1945 הכוחות האמריקאיים הקימו כאן את מתחם המגורים Washington Heights; לקראת אולימפיאדת טוקיו 1964 שימש השטח חלק מהכפר האולימפי. אחר כך הוא הפך לפארק ציבורי. לכן הדשא והעצים של היום יושבים על שכבות של תעופה, צבא, כיבוש אמריקאי ואולימפיאדה. בסופי שבוע התרבות הספונטנית של רקדנים, מוזיקאים וקבוצות תחביב היא חלק מהזהות שלו לא פחות מהנוף.","infoSource":"https://www.gotokyo.org/en/spot/21/"},{"id":"p_5f0b3c6d23e4","name":"Reissue 3D Latte Art","city":"טוקיו","area":"Shibuya + Harajuku","status":"רוצה","kind":"food","desc":"בית קפה מפורסם בלאטה-ארט תלת-ממדי שמצויר לפי בקשה.","duration":"45–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Reissue+3D+Latte+Art+Japan","booking":"","website":""},{"id":"p_190b1ed4a6be","name":"Aoyama","city":"טוקיו","area":"Shibuya + Harajuku","status":"אולי","kind":"attraction","desc":"המשך טבעי מ-Omotesando: אדריכלות, אופנה, רחובות מעוצבים ובתי קפה. מתאים להליכה בדרך לשיבויה.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Aoyama+Japan","booking":"","website":"","info":"Aoyama נקראת על שם משפחת Aoyama, שהחזיקה אחוזות באזור בתקופת Edo. לאחר Meiji האזור השתנה יחד עם מערב טוקיו, ובמאה ה־20 התפתח לשכונה המזוהה עם עיצוב, אמנות, אדריכלות ואופנה יוקרתית. הסמיכות ל־Omotesando ול־Meiji Jingu Gaien יצרה מרחב פחות כאוטי משיבויה אך עדיין מרכזי מאוד. מה שמעניין כאן הוא המרקם: גלריות ומבנים עכשוויים לצד רחובות שקטים ועצים. זה אזור שמראה שטוקיו לא בנויה רק ממרכזים רועשים — כמה דקות מהניאון של Shibuya אפשר לקרוא את אותה מודרניזציה דרך אדריכלות ופרטי עיצוב.","infoSource":"https://www.gotokyo.org/en/destinations/western-tokyo/aoyama-and-omotesando/index.html"},{"id":"hotel_shibuya_stream","name":"Shibuya STREAM HOTEL","city":"טוקיו","area":"Shibuya + Harajuku","status":"אולי","kind":"hotel","desc":"מלון 4★ במיקום מרכזי מאוד בשיבויה, צמוד לאזור Shibuya Stream ובמרחק הליכה קצר מ-Shibuya Station. בחירה נוחה במיוחד אם רוצים לישון בתוך מרכז הפעילות של שיבויה.","duration":"לינה","note":"המלצת מלון 4★ · מיקום מרכזי","maps":"https://www.google.com/maps/search/?api=1&query=Shibuya+STREAM+HOTEL+Tokyo+Japan","booking":"https://www.booking.com/hotel/jp/shibuya-stream-excel-tokyu.html","website":""},{"id":"hotel_hyatt_house_shibuya","name":"Hyatt House Tokyo Shibuya","city":"טוקיו","area":"Shibuya + Harajuku","status":"אולי","kind":"hotel","desc":"מלון 4★ בשיבויה, מרכזי מאוד ונוח לטיול רגלי באזור Shibuya/Harajuku. אופציה טובה אם חשובים חדרים מרווחים יותר ומיקום חזק.","duration":"לינה","note":"המלצת מלון 4★ · Shibuya","maps":"https://www.google.com/maps/search/?api=1&query=Hyatt+House+Tokyo+Shibuya+Japan","booking":"https://www.booking.com/hotel/jp/hyatt-house-tokyo-shibuya.html","website":""},{"id":"food_shunju_shibuya","name":"Shunju Shibuya Bunkamuradori","city":"טוקיו","area":"Shibuya + Harajuku","status":"רוצה","kind":"food","desc":"מסעדה שמתאימה טוב לזוג עם העדפות שונות: יש אפשרויות רגילות לאוכל כללי ובמקביל אפשרות טבעונית/צמחונית שמוצהר עליה ללא fish stock.","duration":"60–90 דק׳","note":"לצמחונית: לבקש ללא בשר, דגים, פירות ים ו-dashi על בסיס דגים.","maps":"https://www.google.com/maps/search/?api=1&query=Shunju+Shibuya+Bunkamuradori+Tokyo","booking":"","website":"http://shunju.com/shibuya"},{"id":"p_1f01628dcb82","name":"ALPAKA Harajuku Harakado","city":"טוקיו","area":"Shibuya + Harajuku","status":"חובה","kind":"shop","desc":"חנות ALPAKA ב־2F של Tokyu Plaza Harajuku “Harakado”. תיקים, EDC ואביזרי נשיאה. שעות פתיחה: 11:00–21:00.","duration":"30–40 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=ALPAKA+Tokyu+Plaza+Harajuku+Harakado+Tokyo","booking":"","website":"https://www.alpakagear.jp/"},{"id":"p_a683417402d9","name":"Shinjuku Gyoen","city":"טוקיו","area":"Shinjuku","status":"חובה","kind":"attraction","desc":"גן ענק עם גנים יפניים, מדשאות ועצי שלכת. אחד המקומות היפים בסתיו.","duration":"1.5–2.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Shinjuku+Gyoen+Japan","booking":"","website":"","info":"Shinjuku Gyoen התחיל כחלק מאחוזת משפחת Naitō שניתנה ב־1590 על ידי Tokugawa Ieyasu. אחרי רסטורציית Meiji הוא הפך ב־1872 לתחנת ניסויים חקלאית, אחר כך לגן בוטני קיסרי, ובתחילת המאה ה־20 הוזמן Henri Martinet מצרפת לתכנן מחדש את השטח. ב־1906 נוצר הבסיס לגן שאנו מכירים היום — שילוב של גן יפני, גן צרפתי פורמלי וגן נוף אנגלי. רוב המקום נחרב בהפצצות 1945 ונפתח לציבור כגן לאומי ב־1949; ב־1989 נערכו בו גם טקסי הלוויה הממלכתיים של הקיסר Shōwa. כדאי להשוות בכוונה בין שלושת סגנונות הגן: זו דרך ממש לראות בעיניים כיצד יפן של Meiji אימצה רעיונות מערביים בלי למחוק את המסורת המקומית.","infoSource":"https://policies.env.go.jp/national-garden/shinjukugyoen/english/intro/history/"},{"id":"p_7fc78f62377c","name":"Tokyo Metropolitan Government Observatory","city":"טוקיו","area":"Shinjuku","status":"רוצה","kind":"attraction","desc":"תצפית חינמית מגובה רב על טוקיו.","duration":"45–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+Metropolitan+Government+Observatory+Japan","booking":"","website":"","info":"בניין ממשלת מטרופולין טוקיו נפתח ב־1991 ותוכנן בידי Kenzo Tange, מהאדריכלים היפנים החשובים במאה ה־20. עם השלמתו היה הבניין הגבוה ביפן וסימל את השאפתנות של טוקיו בסוף תקופת הבועה הכלכלית. שני המגדלים שלו מזכירים קתדרלה מודרנית, אבל זהו למעשה בניין ממשלתי פעיל. קומות התצפית נמצאות בגובה כ־202 מטר ופתוחות ללא תשלום. פרט תרבותי משעשע: הבניין כבר 'נהרס' על המסך בסרט Godzilla vs. King Ghidorah מ־1991, זמן קצר לאחר שנחנך. מהתצפית שווה לחפש את Fuji ביום בהיר ואת קו גורדי השחקים של מערב Shinjuku.","infoSource":"https://www.locationbox.metro.tokyo.lg.jp/english/locatabi_eng/list/530/"},{"id":"p_208f559c06c5","name":"3D Cat Billboard","city":"טוקיו","area":"Shinjuku","status":"רוצה","kind":"attraction","desc":"מסך תלת-ממדי מפורסם עם חתול ענק ליד תחנת שינג'וקו.","duration":"10–15 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=3D+Cat+Billboard+Japan","booking":"","website":"","info":"החתול התלת־ממדי של שינג'וקו הופיע ביולי 2021 על Cross Shinjuku Vision, מול היציאה המזרחית של התחנה, והפך בתוך זמן קצר לתופעה בינלאומית ברשת. האפקט אינו הולוגרמה: זהו מסך LED פינתי שעליו נבנית אנימציה אנמורפית שמנצלת פרספקטיבה כדי לגרום לחתול להיראות כאילו הוא יושב בתוך קופסה עמוקה ויוצא אל הרחוב. מבחינה היסטורית זה אתר צעיר מאוד, אבל הוא מספר משהו אמיתי על טוקיו של שנות ה־2020 — עיר שבה פרסום דיגיטלי יכול להפוך לאטרקציה ציבורית ולדמות עירונית. עמדו באזור הכיכר שמול המסך; שם האשליה עובדת בצורה הטובה ביותר.","infoSource":"https://shinjuku.xspace.tokyo/en/"},{"id":"p_8a8d7e75cc62","name":"Godzilla Head","city":"טוקיו","area":"Shinjuku","status":"רוצה","kind":"attraction","desc":"ראש גודזילה ענק על מלון Gracery באזור Kabukicho.","duration":"15–30 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Godzilla+Head+Japan","booking":"","website":"","info":"ראש Godzilla הוצב ב־2015 על Shinjuku Toho Building שנבנה במקום Shinjuku Koma Theater, מוסד בידור שפעל שם יותר מחמישה עשורים. הראש נמצא בערך 50 מטר מעל הרחוב — הגובה של Godzilla בסרט המקורי מ־1954 — ולכן הוא נראה כאילו המפלצת באמת מציצה מעל Kabukicho. Godzilla נולד בידי Toho ב־1954 בתקופה שבה יפן עדיין התמודדה עם זיכרון ההפצצות והחרדה מהעידן האטומי, והדמות הפכה לאחד הסמלים התרבותיים של הקולנוע היפני. ב־2015 עיריית Shinjuku אפילו העניקה ל־Godzilla 'תעודת תושב' ומינתה אותו לשגריר תיירות. כיום הראש שואג ומואר בשעות קבועות.","infoSource":"https://www.toho.co.jp/en/our-moments/2026/09/2.html"},{"id":"p_a2f5862d9e12","name":"Tokyu Kabukicho Tower","city":"טוקיו","area":"Shinjuku","status":"רוצה","kind":"attraction","desc":"מתחם בילוי עם אוכל, משחקים, אירועים וחיי לילה.","duration":"1–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tokyu+Kabukicho+Tower+Japan","booking":"","website":"","info":"Tokyu Kabukicho Tower נפתח באפריל 2023, אבל האתר קשור לבידור כבר עשרות שנים. ב־1956 נפתח כאן Shinjuku Tokyu Cultural Hall, ובהמשך המתחם נודע כ־Shinjuku TOKYU MILANO ושימש מוקד קולנוע ובידור עד סגירתו ב־2014. המגדל החדש — כ־225 מטר ו־48 קומות — נבנה במכוון כהמשך למסורת הזו: קולנוע, תיאטרון, אולם הופעות, מלונות וחיי לילה, ולא מגדל משרדים רגיל. מערכת הסאונד באולמות הקולנוע קיבלה ייעוץ מהמלחין Ryuichi Sakamoto. כדאי להסתכל עליו מול הסמטאות הנמוכות של Kabukicho — זה מפגש חד בין שינג'וקו של אחרי המלחמה לשינג'וקו של המאה ה־21.","infoSource":"https://www.tokyu-kabukicho-tower.jp/about/"},{"id":"p_dccbcb1531f3","name":"Omoide Yokocho","city":"טוקיו","area":"Shinjuku","status":"רוצה","kind":"attraction","desc":"סמטאות קטנות וצפופות עם יקיטורי ואווירת טוקיו ישנה.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Omoide+Yokocho+Japan","booking":"","website":"","info":"Omoide Yokocho ליד היציאה המערבית של Shinjuku Station צמח מהכאוס שאחרי מלחמת העולם השנייה. בתקופת המחסור והקיצוב התפתח באזור שוק שחור שבו נמכרו מזון ומשקאות, ובהדרגה הדוכנים הפכו למסעדות וברים זעירים. השם 'סמטת הזיכרונות' מתאים למקום שנשאר בקנה מידה שכמעט נעלם משינג'וקו: דלפקים של כמה מושבים, פנסים, מטבחים פתוחים וריח גריל בין גורדי שחקים ורכבות. אצלנו זה פחות יעד אוכל, משום שרוב המקומות מתמחים ב־yakitori ובבשר, ויותר אתר שממחיש איך נראו מוקדי האוכל והבילוי הפשוטים של טוקיו בתקופת השיקום שלאחר המלחמה.","infoSource":"https://www.gotokyo.org/en/spot/63/index.html"},{"id":"p_027c44d6b4fc","name":"Golden Gai","city":"טוקיו","area":"Shinjuku","status":"רוצה","kind":"attraction","desc":"אזור ברים זעירים וסמטאות לילה מפורסמות.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Golden+Gai+Japan","booking":"","website":"","info":"Golden Gai הוא אחד השרידים הבולטים לשינג'וקו של השנים שאחרי מלחמת העולם השנייה. האזור התחיל כרובע שוק ובילוי לא רשמי, ובשנות ה־50 קיבל את המבנה של סמטאות צפופות ומבנים קטנים שאנו רואים היום. במשך השנים הוא נקשר במיוחד לסופרים, אנשי קולנוע, אמנים ועיתונאים, כאשר כל בר זעיר בנה קהילה קבועה משלו. בניגוד לחלקים גדולים של Shinjuku שנהרסו ונבנו מחדש, Golden Gai שמר על קנה מידה של שתי קומות ורחובות צרים ולכן הוא מרגיש כמו קפסולת זמן. חלק מהברים עדיין מיועדים לקבועים בלבד; יש לכבד איסורי צילום, עישון ושתייה ברחוב.","infoSource":"https://www.gotokyo.org/en/spot/62/index.html"},{"id":"p_69152dbe3158","name":"Isetan Shinjuku","city":"טוקיו","area":"Shinjuku","status":"אולי","kind":"attraction","desc":"כלבו יפני קלאסי; קומת האוכל וה-gourmet basement היא האטרקציה העיקרית ומתאימה לפתיחת היום לפני Shinjuku Gyoen.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Isetan+Shinjuku+Japan","booking":"","website":""},{"id":"p_5762610a0e09","name":"ASICS FLAGSHIP SHINJUKU","city":"טוקיו","area":"Shinjuku","status":"רוצה","kind":"shop","desc":"חנות הדגל הרשמית של ASICS בשינג'וקו, 4 קומות וכ־605 מ״ר. כתובת: 3-17-5 Shinjuku, Shinjuku-ku, Tokyo 160-0022. שעות פתיחה: 11:00–20:00.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=ASICS+FLAGSHIP+SHINJUKU+3-17-5+Shinjuku+Tokyo","booking":"","website":"https://www.asics.com/jp/ja-jp/mk/asics-flagship-shinjuku"},{"id":"p_ef60b433ce43","name":"Senso-ji","city":"טוקיו","area":"Asakusa + Kappabashi","status":"חובה","kind":"attraction","desc":"המקדש הבודהיסטי המפורסם באסאקוסה, עם שערים מרשימים ואווירה מסורתית.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Senso-ji+Japan","booking":"","website":"","info":"Sensō-ji הוא המקדש הבודהיסטי העתיק ביותר בטוקיו. לפי המסורת, ב־628 שני אחים דייגים משו מנהר Sumida פסל קטן של Kannon, בודהיסטווה של החמלה. ראש הכפר זיהה את משמעות הפסל והפך את ביתו למקום תפילה; ב־645 נבנה אולם מסודר, והדמות הקדושה הוגדרה כ־hibutsu — 'בודהה נסתר' שאינו מוצג לציבור. בתקופת Edo הפך המקדש למוקד עלייה לרגל עצום, וסביבו צמחו דוכנים, תיאטראות, מסעדות ורחובות מסחר — כלומר Sensō-ji ממש עזר ליצור את Asakusa העירונית. רוב המבנים נהרסו בהפצצות 1945 ונבנו מחדש לאחר המלחמה, ולכן המקום הוא גם סיפור על המשכיות של טקס ומקום למרות אובדן המבנה המקורי.","infoSource":"https://www.senso-ji.jp/english/"},{"id":"p_386647abeb53","name":"Kaminarimon","city":"טוקיו","area":"Asakusa + Kappabashi","status":"רוצה","kind":"attraction","desc":"שער הרעם האייקוני בכניסה ל-Senso-ji.","duration":"10–20 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kaminarimon+Japan","booking":"","website":"","info":"Kaminarimon, 'שער הרעם', הוא הכניסה המזוהה ביותר עם Sensō-ji. המסורת של המקדש מייחסת את השער הראשון לשנת 942, ובצדדיו עומדות דמויות Fūjin, אל הרוח, ו־Raijin, אל הרעם. השער נהרס ונבנה שוב פעמים רבות; המבנה הקודם נשרף ב־1865, והגרסה הנוכחית הושלמה ב־1960 בתרומה של Konosuke Matsushita, מייסד Panasonic, לאחר שלפי המסורת התפלל ב־Sensō-ji והחלים ממחלה. הפנס האדום הענק במרכז הפך לסמל של Asakusa. לכן זה יותר משער לצילום: הוא מחבר פולחן עתיק, שריפות, שיקום לאחר המלחמה וסיפור של תעשיין מודרני שהחזיר לאתר את הסמל שלו.","infoSource":"https://www.senso-ji.jp/english/"},{"id":"p_656904250ddc","name":"Nakamise Street","city":"טוקיו","area":"Asakusa + Kappabashi","status":"רוצה","kind":"attraction","desc":"רחוב קניות מסורתי בין Kaminarimon ל-Senso-ji, עם מזכרות וממתקים.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Nakamise+Street+Japan","booking":"","website":"","info":"Nakamise הוא אחד מרחובות המסחר העתיקים ביפן. בין 1688 ל־1735 קיבלו תושבים שסייעו בשירותי Sensō-ji זכות לפתוח דוכנים לאורך דרך העלייה למקדש, וכך נולד רחוב שבו דת, עלייה לרגל ומסחר מזינים זה את זה. בתקופת Edo נמכרו כאן תה, צעצועים, ממתקים ומזכרות. לאחר רסטורציית Meiji בוטלו זכויות הסוחרים והחנויות פונו; הרחוב נבנה מחדש, נפגע ברעידת Kantō של 1923 ושוב בהפצצות 1945, ושוקם בכל פעם. המבנים אינם בני 300 שנה, אבל המסורת המסחרית כן. כשעוברים בו, כדאי לחשוב שהרחוב קיים מלכתחילה משום שמיליוני אנשים היו בדרכם למקדש.","infoSource":"https://www.asakusa-nakamise.jp/e-history.html"},{"id":"p_ca552bc36394","name":"Kappabashi Street","city":"טוקיו","area":"Asakusa + Kappabashi","status":"רוצה","kind":"attraction","desc":"רחוב כלי המטבח של טוקיו: סכינים, כלי קרמיקה ודגמי אוכל מפלסטיק.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kappabashi+Street+Japan","booking":"","website":"","info":"Kappabashi Dougu Street התפתח בתחילת המאה ה־20 כאזור של סוחרי ציוד למסעדות וכלי מטבח, והיום משתרע כ־800 מטר עם יותר מ־170 עסקים. הסיפור שלו קשור לעליית תרבות המסעדות העירונית של טוקיו: כשהעיר גדלה, נוצר צורך בריכוז של סכינים, סירים, כלי חרס, שלטים, noren, תבניות וכל פרט שמסעדה צריכה. אחד הסמלים הם דגמי המזון מפלסטיק — sampuru — תעשייה יפנית שהתפתחה במאה ה־20 כדי להציג ללקוחות מנות לפני ההזמנה. הרחוב חושף את 'מאחורי הקלעים' של המטבח היפני: לא רק אוכל, אלא מערכת של מלאכות מדויקות ותשתית שמאפשרת למסעדה להיראות ולעבוד כפי שהיא עובדת.","infoSource":"https://www.gotokyo.org/en/destinations/eastern-tokyo/asakusa/"},{"id":"p_30fa14841797","name":"Hat Coffee / 3D Foam Art","city":"טוקיו","area":"Asakusa + Kappabashi","status":"רוצה","kind":"food","desc":"קפה באסאקוסה עם קצף תלת-ממדי בעיצובים מיוחדים.","duration":"45–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Hat+Coffee+%2F+3D+Foam+Art+Japan","booking":"","website":""},{"id":"p_7abbe0abd0e8","name":"Sumida River","city":"טוקיו","area":"Asakusa + Kappabashi","status":"רוצה","kind":"attraction","desc":"נהר סומידה עובר לצד Asakusa ונותן נקודות תצפית יפות לכיוון Skytree ו-Asahi Beer Hall. מתאים להליכה קצרה או שיט.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Sumida+River+Japan","booking":"","website":"","info":"נהר Sumida היה עורק חיים של Edo הרבה לפני שהיה נוף לתיירים. סחורות שהגיעו למפרץ הועברו בנהרות ובתעלות אל תוך העיר, ועל גדות המים התפתחו מחסנים, שווקים, מסעדות ורבעי סוחרים. הנהר קשור גם ישירות למסורת Sensō-ji, משום שלפי הסיפור פסל Kannon שעליו נוסד המקדש נמצא בו בשנת 628. בתקופת Edo הפכו הגדות גם למרחב בילוי, שיט, hanami וזיקוקים, והדפסי ukiyo-e תיעדו שוב ושוב את הנהר והגשרים. כשעומדים היום בטיילת ורואים את Tokyo Skytree ואת Asahi Hall, כדאי לזכור שהמים אינם רק רקע יפה אלא אחת הסיבות שבגללן Edo הצליחה להפוך לעיר ענקית כבר במאה ה־18.","infoSource":"https://www.gotokyo.org/en/see-and-do/nature/waterfront/history-by-the-water.html"},{"id":"p_d61087502c85","name":"Asahi Beer Hall","city":"טוקיו","area":"Asakusa + Kappabashi","status":"אולי","kind":"attraction","desc":"מבנה אדריכלי אייקוני ליד נהר סומידה, מזוהה עם הפסל המוזהב שעל הגג. עצירה קצרה וצילום בדרך ל-Skytree.","duration":"15–30 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Asahi+Beer+Hall+Japan","booking":"","website":"","info":"Asahi Super Dry Hall והבניינים הסמוכים נפתחו ב־1989 כחלק ממתחם המטה של Asahi על גדת Sumida. האלמנט המפורסם הוא Flamme d'Or, פסל זהוב שתכנן Philippe Starck. הכוונה הייתה לסמל את 'הלב הבוער' של Asahi, אבל הצורה החריגה הפכה מיד לנושא לבדיחות ולכינויים והפכה בעצמה לאייקון של Asakusa המודרנית. זה בדיוק מה שהופך את האתר למעניין: דקות מ־Sensō-ji בן מאות השנים עומד אובייקט פוסט־מודרני מתקופת הבועה היפנית שתוכנן בידי מעצב צרפתי עבור מותג בירה יפני. הזווית הטובה ביותר היא מאזור Azumabashi, שם רואים יחד את הלהבה, בניין Asahi ו־Tokyo Skytree.","infoSource":"https://www.gotokyo.org/en/destinations/eastern-tokyo/asakusa/index.html"},{"id":"p_akihabara_retro_game_shopping","name":"Akihabara Retro Game Shopping — Surugaya, Trader, Super Potato, Sofmap, Jan-gle, Retro Game Camp & BOOKOFF","city":"טוקיו","area":"Akihabara","status":"חובה","kind":"shop","desc":"מסלול קניות רטרו וגיימינג בתוך Akihabara. כל החנויות נמצאות באותו אזור הליכה, אבל לא באותו בניין.\n\n• Surugaya (駿河屋) — כמה סניפים באזור. Akihabara Station Store ליד התחנה; Akihabara Game Store ממוקד יותר בגיימינג ורטרו.\n• Trader Akihabara Honten (トレーダー) — חנות יד שנייה וגיימינג מוכרת באזור.\n• Super Potato Akihabara — חנות רטרו אייקונית עם מבחר גדול מאוד; לרוב יקרה יותר אבל כיפית לשיטוט.\n• Sofmap AKIBA Amusement — משחקי קונסולה חדשים ויד שנייה, לצד הובי, figures ואנימה.\n• Jan-gle Akihabara — יד שנייה של משחקים, קונסולות, מחשבים, טלפונים וגאדג'טים.\n• Retro Game Camp — חנות רטרו עם Famicom, Super Famicom, N64, PlayStation, Saturn ועוד.\n• BOOKOFF Akihabara Eki-mae — ליד התחנה; יד שנייה עם משחקים, מדיה, אלקטרוניקה ו-TCG.","duration":"3–5 שעות","note":"מומלץ לעשות את כולן כבלוק אחד של Akihabara: להתחיל ליד התחנה ב-BOOKOFF / Surugaya Station Store, להמשיך לכיוון Chuo-dori ולסיים באזור Super Potato / Retro Game Camp / Sofmap.","maps":"https://www.google.com/maps/search/?api=1&query=Akihabara+retro+game+stores+Tokyo+Japan","booking":"","website":""},{"id":"p_28a61513471b","name":"Mandarake Complex","city":"טוקיו","area":"Akihabara","status":"רוצה","kind":"attraction","desc":"בניין רב קומות לאספנות, מנגה, אנימה, צעצועים ופריטי וינטג׳.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Mandarake+Complex+Japan","booking":"","website":""},{"id":"p_7199c1652ee4","name":"Radio Kaikan","city":"טוקיו","area":"Akihabara","status":"רוצה","kind":"attraction","desc":"בניין מלא בחנויות figures, cards, anime ותחביבים.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Radio+Kaikan+Japan","booking":"","website":""},{"id":"p_0505b23231b6","name":"GiGO Arcades","city":"טוקיו","area":"Akihabara","status":"רוצה","kind":"attraction","desc":"משחקיות יפניות עם claw machines, rhythm games ועוד.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=GiGO+Arcades+Japan","booking":"","website":"","info":"הארקיידים של GiGO באקיהברה הם יורשים של תקופה שבה שלטי SEGA היו חלק מהנוף של האזור. ב־2021 SEGA העבירה את פעילות מרכזי הבידור שלה ל־GENDA, וב־2022 יצאה מהבעלות והמותג הוחלף ל־GiGO. למרות שינוי השם, התרבות עצמה נמשכה: crane games, משחקי קצב, fighting games, מרוצים ומשחקי ארקייד יפניים. SEGA עצמה תרמה רבות להיסטוריה של הארקייד העולמי, עם כותרים כמו Virtua Fighter ומכונות חדשניות כמו R360. לכן הביקור מעניין לא רק כ'משחקים', אלא כשריד חי לעידן שבו יפן הובילה את תרבות הארקייד הגלובלית. אל תישארו רק בקומת הפרסים; הקומות העליונות בדרך כלל מספרות טוב יותר את הסיפור.","infoSource":"https://www.gendagigo.jp/company_profile/history"},{"id":"p_f95ddf35c266","name":"Yodobashi Akiba","city":"טוקיו","area":"Akihabara","status":"רוצה","kind":"attraction","desc":"כלבו ענק של אלקטרוניקה, צילום, מחשבים וגאדג'טים.","duration":"60–120 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Yodobashi+Akiba+Japan","booking":"","website":""},{"id":"p_0ec86a8c9e36","name":"Kanda Myojin","city":"טוקיו","area":"Akihabara","status":"רוצה","kind":"attraction","desc":"מקדש שינטו ליד Akihabara, פופולרי גם בקרב קהילת הטכנולוגיה.","duration":"30–45 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kanda+Myojin+Japan","booking":"","website":"","info":"Kanda Myojin מייחס את ייסודו לשנת 730, והוא קשור עמוק להיסטוריה של Edo. אחד הסיפורים המרתקים הוא של Taira no Masakado, מורד מהמאה ה־10 שהפך לאחר מותו לדמות רוחנית עוצמתית; לאחר אסונות שיוחסו לרוחו, הוא הונצח במקדש ב־1309. ב־1600, לפני קרב Sekigahara, נערכו כאן תפילות לניצחון של Tokugawa Ieyasu; הניצחון הגיע ביום Kanda Matsuri והמקדש זכה בחסות השוגונות. כיום תחום החסות שלו כולל Kanda, Nihonbashi, Otemachi, Marunouchi ו־Akihabara, ולכן נוצר חיבור נדיר בין מסורת לטכנולוגיה: חברות IT ומפתחים מגיעים לברכות, וקמעות הקשורים למחשבים נמכרים לצד טקסי Shinto עתיקים.","infoSource":"https://www.kandamyoujin.or.jp/profile/"},{"id":"p_05b3c2408b26","name":"Maid Café experience","city":"טוקיו","area":"Akihabara","status":"אולי","kind":"attraction","desc":"בתי קפה קונספטואליים הם חלק מהתרבות של Akihabara. אפשר לבחור אחד איכותי אם מסקרן אתכם לחוות את הצד הייחודי של השכונה.","duration":"45–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Maid+Caf%C3%A9+experience+Japan","booking":"","website":"","info":"Maid cafés נולדו מתוך תרבות ה־otaku של Akihabara בסוף שנות ה־90 ותחילת שנות ה־2000. הרעיון לקח דימוי של maid ממשחקי מחשב ואנימה והפך אותו לחוויית שירות תיאטרלית: העובדות פונות לאורחים כ־'master' או 'princess', מבצעות טקסים סביב אוכל ומשקה ומשלבות שירה, משחקים וצילום. at-home cafe, אחד המותגים החשובים, פתח את הסניף הראשון שלו באקיהברה ב־2004 והפך את הסגנון למיינסטרים תיירותי. זו פחות חוויית אוכל ויותר performance שבו הלקוח משתתף בעולם בדיוני עם חוקים משלו. מבחינה תרבותית זה מעניין משום שהוא מראה איך דימויים מאנימה ומשחקים יצאו מהמסך והפכו לחלל פיזי ולצורת בילוי.","infoSource":"https://www.maidcafe-athome.com/about-us"},{"id":"p_a28928d6f1bd","name":"Karaoke / Japanese arcade experience","city":"טוקיו","area":"Akihabara","status":"אולי","kind":"attraction","desc":"חוויה יפנית קלאסית של karaoke או arcade מעבר לשופינג בגיימינג.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Karaoke+%2F+Japanese+arcade+experience+Japan","booking":"","website":"","info":"ה־karaoke נולד ביפן בתחילת שנות ה־70, ושמו מחבר kara — 'ריק' — עם orchestra. בתחילה הוא התקיים בעיקר בברים עם מכונות ליווי מוזיקלי, אבל בשנות ה־80 התפתח מודל ה־karaoke box: חדרים פרטיים לקבוצות קטנות, שהפכו את הפעילות מבמה ציבורית לבילוי יומיומי עם חברים, עמיתים לעבודה ואפילו לבד. הארקיידים היפניים התפתחו במקביל והפכו למעבדות של משחקי קצב, לחימה, מירוצים ומכונות פרסים. השילוב בין השניים מספר הרבה על תרבות הבילוי העירונית ביפן: אינטנסיבית וטכנולוגית, אבל לעיתים קרובות פרטית ומאורגנת בתוך חללים קטנים. אם עושים karaoke, שעה אחת מספיקה כדי להבין את הפורמט.","infoSource":"https://www.gotokyo.org/en/see-and-do/index.html"},{"id":"p_bic_camera_akiba","name":"Bic Camera AKIBA","city":"טוקיו","area":"Akihabara","status":"רוצה","kind":"attraction","desc":"חנות אלקטרוניקה ענקית באקיהברה עם מצלמות, גאדג'טים, קונסולות, משחקים, אביזרים, מוצרי חשמל ומבחר גדול של מוצרים יפניים.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Bic+Camera+AKIBA+Tokyo+Japan","booking":"","website":""},{"id":"p_kotobukiya_akihabara","name":"Kotobukiya Akihabara","city":"טוקיו","area":"Akihabara","status":"רוצה","kind":"attraction","desc":"חנות גדולה של דמויות, מודלים, אנימה, גיימינג ומרצ'נדייז. חזקה במיוחד ב-collectibles, figures ומוצרים בלעדיים.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kotobukiya+Akihabara+Tokyo+Japan","booking":"","website":""},{"id":"p_eb527edeaba2","name":"Unicorn Gundam","city":"טוקיו","area":"Odaiba","status":"רוצה","kind":"attraction","desc":"פסל Unicorn Gundam ענק מול DiverCity עם מופעי תאורה בזמנים מסוימים.","duration":"20–30 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Unicorn+Gundam+Japan","booking":"","website":"","info":"פסל Unicorn Gundam מחוץ ל־DiverCity הוצב ב־2017 והחליף את פסל RX-78-2 הקודם. גובהו כ־19.7 מטר, והוא כמעט 'בקנה מידה אמיתי' ביחס לרובוט הבדיוני. Gundam עצמו נולד ב־1979 עם Mobile Suit Gundam ושינה את ז'אנר הרובוטים באנימה: במקום מכונות קסומות של גיבורי־על, הסדרה הציגה mobile suits ככלי מלחמה בתוך עימות פוליטי ומוסרי מורכב. מכאן צמחה תעשייה עצומה של סדרות, משחקים ודגמי Gunpla. הפסל באודאיבה חשוב כי הוא מוציא תרבות מסך אל המרחב הציבורי בקנה מידה אדריכלי — מעין אנדרטה לאנימה כחלק מהזהות התרבותית והכלכלית של יפן.","infoSource":"https://www.gotokyo.org/en/destinations/southern-tokyo/odaiba/index.html"},{"id":"p_c42e1561fc9e","name":"DiverCity Tokyo Plaza","city":"טוקיו","area":"Odaiba","status":"רוצה","kind":"attraction","desc":"קניון גדול עם Gundam Base, אופנה, אוכל ובידור.","duration":"1–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=DiverCity+Tokyo+Plaza+Japan","booking":"","website":""},{"id":"p_7df5e0b09679","name":"Gundam Base Tokyo","city":"טוקיו","area":"Odaiba","status":"רוצה","kind":"attraction","desc":"חנות ומתחם Gundam גדול עם דגמים ותצוגות.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Gundam+Base+Tokyo+Japan","booking":"","website":""},{"id":"p_5d705cb8bf99","name":"Tokyo Joypolis","city":"טוקיו","area":"Odaiba","status":"חובה","kind":"attraction","desc":"פארק indoor של SEGA עם מתקנים, משחקי VR וחוויות אינטראקטיביות.","duration":"2–4 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+Joypolis+Japan","booking":"","website":"","info":"Tokyo Joypolis נפתח באודאיבה ביולי 1996 על ידי SEGA, בתקופה שבה תעשיית המשחקים היפנית הייתה בשיא השפעתה הגלובלית. כבר מההתחלה הוא תוכנן כפארק שעשועים דיגיטלי מקורה המשלב arcade, מתקנים גדולים, VR וטכנולוגיות אינטראקטיביות — לא כארקייד רגיל. זה היה מהלך אופייני ל־SEGA של שנות ה־90, שניסתה לטשטש את הגבול בין משחק וידאו, מכונה פיזית ופארק שעשועים. המקום שרד גם אחרי ש־SEGA עברה שינויים עסקיים גדולים, ולכן הוא שריד חי לתקופה שבה יפן הובילה חזק את תרבות המשחק העולמית. כדי להבין את הזהות שלו, עדיף לבחור מתקנים שמשלבים תנועה וטכנולוגיה ולא רק מכונות arcade רגילות.","infoSource":"https://www.sega.jp/history/companyTimeline/en/"},{"id":"p_81964c659a9f","name":"DECKS Tokyo Beach","city":"טוקיו","area":"Odaiba","status":"רוצה","kind":"attraction","desc":"מרכז קניות ובידור על קו המים.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=DECKS+Tokyo+Beach+Japan","booking":"","website":""},{"id":"p_40052b920664","name":"Odaiba Seaside Park","city":"טוקיו","area":"Odaiba","status":"רוצה","kind":"attraction","desc":"טיילת ונוף יפה למפרץ, Rainbow Bridge וטוקיו.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Odaiba+Seaside+Park+Japan","booking":"","website":"","info":"Odaiba נראית עתידנית, אבל שמה מחזיר לאמצע המאה ה־19. אחרי הגעת 'הספינות השחורות' של קומודור Perry ב־1853, שוגונות Tokugawa בנתה איים מבוצרים במפרץ כדי להגן על Edo מתקיפה ימית; daiba פירושו סוללת תותחים. חלק מהאיים חוברו בהמשך באמצעות ייבוש ים ופיתוח, ובסוף המאה ה־20 האזור תוכנן מחדש כרובע waterfront של בידור, תערוכות וטכנולוגיה. Odaiba Seaside Park יושב על הנוף המלאכותי הזה ומציע משהו חריג בטוקיו — מרחב פתוח מול מים וחוף מלאכותי. לקראת ערב כדאי לחשוב על האבולוציה של המקום: מתשתית צבאית שנועדה להרחיק זרים, לרובע שמכוון במפורש לתיירות בינלאומית ותרבות פופ.","infoSource":"https://www.gotokyo.org/en/spot/39/index.html"},{"id":"p_95dea67df142","name":"Statue of Liberty replica","city":"טוקיו","area":"Odaiba","status":"רוצה","kind":"attraction","desc":"פסל החירות הקטן של Odaiba עם רקע של המפרץ.","duration":"10–20 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Statue+of+Liberty+replica+Japan","booking":"","website":"","info":"פסל החירות באודאיבה הגיע לכאן כחלק מ'שנת צרפת ביפן' בשנים 1998–1999, כאשר העתק צרפתי הוצב זמנית על קו המים כסמל לקשרים בין המדינות. הפסל הפך פופולרי כל כך שאחרי שהעותק המקורי הוחזר לצרפת, נוצר העתק קבוע שנחנך ב־2000. הוא בערך שביעית מגודל הפסל בניו יורק, והקומפוזיציה עם Rainbow Bridge ברקע יוצרת בכוונה נוף גלובלי מאוד. זהו פרט מעניין בהיסטוריה של Odaiba: רובע שנבנה על איים מלאכותיים והפך בשנות ה־90 לחלון ראווה של טוקיו החדשה אימץ גם סמל מערבי מובהק והפך אותו לחלק מהזהות המקומית.","infoSource":"https://www.gotokyo.org/en/spot/363/index.html"},{"id":"p_a1f64434108f","name":"teamLab Planets","city":"טוקיו","area":"Toyosu + Ariake","status":"רוצה","kind":"attraction","desc":"חוויה דיגיטלית immersive שבה הולכים בתוך מים, מראות ואור.","duration":"1.5–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=teamLab+Planets+Japan","booking":"","website":"","info":"teamLab Planets נפתח ב־Toyosu ב־2018 כחוויה זמנית שתוכננה לשנים ספורות אך הוארכה שוב ושוב בשל הצלחתה. teamLab, קולקטיב יפני שהוקם ב־2001 ומשלב אמנים, מתכנתים, מהנדסים ואדריכלים, בנה כאן מוזיאון שבו המבקר אינו עומד מול היצירה אלא נכנס לתוכה פיזית — לעיתים יחף ובמים. הרעיון הוא לערער את הגבול בין גוף, אור, צליל וסביבה; עבודות מגיבות לתנועה ולנוכחות ולכן שני ביקורים אינם זהים לגמרי. מה שחשוב בביקור הוא לא למהר לצלם כל דבר: בכמה מהחללים האפקט עובד דווקא כשעומדים, זזים לאט ומרגישים את שינויי המרחב.","infoSource":"https://www.teamlab.art/e/planets/"},{"id":"p_d640ee8241ae","name":"Small Worlds","city":"טוקיו","area":"Toyosu + Ariake","status":"רוצה","kind":"attraction","desc":"מוזיאון מיניאטורות ענק עם ערים, חלל, אנימה ומערכות מכניות.","duration":"1.5–2.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Small+Worlds+Japan","booking":"","website":"","info":"SMALL WORLDS הוא מוזיאון מיניאטורות גדול ב־Ariake המשתמש בדגמים בקנה מידה של כ־1:80, 3D scanning, תאורה ומנגנוני תנועה כדי ליצור עולמות שלמים. בין המתחמים יש שדה תעופה פעיל במיניאטורה, מרכז חלל ועולמות המבוססים על Evangelion. הוא ממשיך מסורת יפנית חזקה של model-making — מדגמי רכבות ודיאורמות ועד Gunpla — ומחבר אותה לטכנולוגיות ייצור דיגיטליות. הדבר המעניין הוא רמת הסיפור בתוך הפרטים: לא רק 'בניינים קטנים' אלא אנשים, תקלות, תנועה, יום ולילה ואירועים זעירים שנבנו כדי להתגלות מקרוב. נסו להתכופף לגובה הדמויות ולשנות את זווית הראייה; אז המודל מתחיל להרגיש כמו עיר ולא כמו ויטרינה.","infoSource":"https://smallworlds.jp/en/"},{"id":"p_4536e43127c9","name":"Toyosu Market","city":"טוקיו","area":"Toyosu + Ariake","status":"רוצה","kind":"attraction","desc":"שוק הסיטונאות המודרני של טוקיו עם מסעדות ותצפיות על פעילות השוק.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Toyosu+Market+Japan","booking":"","website":"","info":"Toyosu Market הוא הפרק החדש ביותר בסיפור בן יותר מ־400 שנה של שוקי הדגים של טוקיו. בראשית תקופת Edo הזמין Tokugawa Ieyasu דייגים מאוסקה לספק דגים לטירה, ומתוך הפעילות הזו צמח שוק Nihonbashi. אחרי רעידת Kantō של 1923 נהרס השוק ונבנה מחדש ב־Tsukiji, שנפתח ב־1935. עם צמיחת טוקיו Tsukiji הפך צפוף מדי, וב־2018 עבר השוק הסיטונאי למתקן החדש ב־Toyosu. האתר נבנה על אדמה מיובשת שחלקה נוצרה מפסולת של בניינים שנהרסו ברעידת 1923 — מעגל היסטורי מעניין. גם כיום מכירות פומביות משתמשות במחוות יד מסורתיות, וחלק מהעסקים פועלים ברצף עוד מימי Nihonbashi.","infoSource":"https://www.toyosu-market.or.jp/en/history-of-the-tokyo-fish-market/"},{"id":"p_8a15beabf088","name":"Senkyaku Banrai","city":"טוקיו","area":"Toyosu + Ariake","status":"רוצה","kind":"attraction","desc":"מתחם בסגנון יפני מסורתי עם אוכל, חנויות ואונסן רגליים/מרחצאות.","duration":"1–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Senkyaku+Banrai+Japan","booking":"","website":"","info":"Toyosu Senkyaku Banrai נפתח בפברואר 2024 ליד Toyosu Market. שמו פירושו בערך 'אלף אורחים באים, עשרת אלפים חוזרים', ביטוי המזוהה עם שגשוג מסחרי. המתחם חדש לחלוטין, אבל עוצב במכוון כדי להזכיר רחובות שוק של Edo: סמטאות, חזיתות עץ ודוכני אוכל שמנסים ליצור חיבור בין שוק הדגים המודרני ביותר של טוקיו לבין הדימוי ההיסטורי של שוק עירוני. זהו מקום מעניין דווקא משום שהוא אינו אותנטי עתיק — הוא פרשנות מודרנית ומתוכננת להיסטוריה. כדאי להשוות אותו ל־Tsukiji: האחד צמח אורגנית במשך עשרות שנים, השני נבנה ב־2024 כדי לייצר חוויית שוק מודעת לעצמה.","infoSource":"https://www.gotokyo.org/en/spot/1858/index.html"},{"id":"p_a3d833975f7f","name":"teamLab Borderless","city":"טוקיו","area":"Azabudai + Roppongi","status":"חובה","kind":"attraction","desc":"מוזיאון אמנות דיגיטלית ללא מסלול קבוע, עם חללים שמשתנים ומתחברים זה לזה.","duration":"2–3 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=teamLab+Borderless+Japan","booking":"","website":"","info":"teamLab Borderless נפתח לראשונה ב־Odaiba ב־2018 כמוזיאון של teamLab ו־Mori Building, נסגר ב־2022 עם פיתוח מחדש של האזור ונפתח מחדש בפברואר 2024 ב־Azabudai Hills. המושג 'Borderless' הוא לב החוויה: יצירות אינן כלואות בחדרים, אלא נודדות בין חללים, נפגשות ומשתנות בהתאם לנוכחות המבקרים. לכן אין מסלול נכון ואין בהכרח שלטים ליד כל יצירה. המעבר מ־Odaiba ל־Azabudai הוא גם סיפור עירוני: מוסד דיגיטלי שנולד באזור waterfront עתידני הפך לעוגן תרבותי בפרויקט התחדשות בלב העיר. בניגוד ל־Planets, כאן החוויה היא של שיטוט, אובדן גבולות וגילוי.","infoSource":"https://www.teamlab.art/e/tokyo/"},{"id":"p_db77d368e9f8","name":"Azabudai Hills","city":"טוקיו","area":"Azabudai + Roppongi","status":"רוצה","kind":"attraction","desc":"מתחם חדש ומעוצב עם אדריכלות, אוכל, חנויות ושטחים ירוקים.","duration":"60–120 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Azabudai+Hills+Japan","booking":"","website":"","info":"Azabudai Hills נפתח ב־2023 אחרי יותר משלושה עשורים של תכנון ופינוי־בינוי מורכב בשטח של כ־8.1 הקטר. Mori Building הגדירה אותו כ־Modern Urban Village סביב שני רעיונות: Green ו־Wellness. לפני הפיתוח האזור היה פסיפס צפוף של רחובות צרים ובניינים קטנים; הפרויקט איחד קרקע, בנה מגדלים, מגורים, בית ספר, גלריות, מסחר ו־teamLab Borderless, ובמקביל הגדיל את השטח הירוק לכ־24,000 מ״ר — יותר מפי חמישה מהמצב הקודם. מבחינה היסטורית הוא מייצג שלב חדש בהתחדשות טוקיו: לא עוד מגדל יחיד אלא 'עיר בתוך עיר'. הסתכלו בעיקר על המרחבים שבין הבניינים, כי שם נמצא הרעיון האורבני האמיתי.","infoSource":"https://www.azabudai-hills.com/about/index.html"},{"id":"p_106fc40eca1f","name":"Tokyo Tower","city":"טוקיו","area":"Azabudai + Roppongi","status":"רוצה","kind":"attraction","desc":"המגדל האייקוני של טוקיו עם תצפיות ועיצוב רטרו.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+Tower+Japan","booking":"","website":"","info":"Tokyo Tower הושלם ב־23 בדצמבר 1958, אחרי כשנה וחצי של בנייה, לפי תכנון הנדסי בהובלת Tachu Naitō. בגובה 333 מטר הוא עבר אז את Eiffel Tower והיה למגדל הפלדה העצמאי הגבוה בעולם. תפקידו המקורי היה פרקטי: לאחד את שידורי הטלוויזיה של טוקיו במגדל מרכזי בתקופה שבה הטלוויזיה הפכה למדיה לאומית. אבל המשמעות שלו חרגה מטכנולוגיה — הוא נבנה בשנות הצמיחה הכלכלית המהירה והפך לסמל של ההתאוששות היפנית אחרי מלחמת העולם השנייה. זמן קצר אחר כך הגיעו טלוויזיה צבעונית ואולימפיאדת 1964. כיום Skytree גבוה ממנו, אבל Tokyo Tower עדיין מספר טוב יותר את הסיפור של טוקיו של תקופת Shōwa: אופטימיות, הנדסה ותשוקה להוכיח שהעיר חזרה למרכז העולם.","infoSource":"https://gallery.tokyotower.co.jp/en/"},{"id":"p_78d11b41d6a0","name":"Roppongi Hills","city":"טוקיו","area":"Azabudai + Roppongi","status":"רוצה","kind":"attraction","desc":"מתחם עירוני עם קניות, אמנות ותצפיות.","duration":"60–120 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Roppongi+Hills+Japan","booking":"","website":"","info":"Roppongi Hills נפתח באפריל 2003 לאחר תהליך פיתוח שנמשך יותר מ־15 שנה ושילב מאות בעלי קרקע. Mori Building רצתה ליצור 'עיר אנכית' שבה עבודה, מגורים, תרבות, מסחר ופנאי מתקיימים יחד, והפרויקט הפך למודל לפרויקטים מאוחרים יותר. לקרקע יש היסטוריה מוקדמת בהרבה: חלק מהאזור היה אחוזת Mōri מתקופת Edo; ב־1849 נולד כאן Nogi Maresuke, לימים גנרל מפורסם, ובמאה ה־20 פעלו במקום בין היתר מפעל של Nikka Whisky ומתחמי TV Asahi. Mōri Garden שבמתחם משמר זיכרון מהעבר הזה. Roppongi Hills לכן אינו רק 'קניון עם מגדל', אלא שכבה חדשה שנבנתה על אתר שעבר מאחוזת daimyo לתעשייה, טלוויזיה ולבסוף פרויקט עירוני־תרבותי.","infoSource":"https://www.roppongihills.com/green/mohri/history.html"},{"id":"p_0b25a69b8bc4","name":"Mori Art Museum","city":"טוקיו","area":"Azabudai + Roppongi","status":"רוצה","kind":"attraction","desc":"מוזיאון לאמנות עכשווית בקומות העליונות של Roppongi Hills.","duration":"1–1.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Mori+Art+Museum+Japan","booking":"","website":"","info":"Mori Art Museum נפתח באוקטובר 2003 בקומות העליונות של Mori Tower כחלק מהחזון של Roppongi Hills להיות 'Cultural Heart of the City'. מייסד הפרויקט, Mori Minoru, רצה שמוזיאון לאמנות עכשווית יהיה חלק מהחיים העירוניים ולא בניין מבודד. תערוכת הפתיחה, Happiness: A Survival Guide for Art and Life, כבר הציגה את הקו הזה — חיבור בין אמנות לשאלות רחבות של חיים וחברה. לאורך השנים המוזיאון בנה מוניטין בתערוכות של אמנות ואדריכלות עכשווית מיפן ומאסיה לצד יוצרים בינלאומיים. הוא אינו נשען על אוסף קבוע גדול אלא על תערוכות מתחלפות, ולכן חשוב לבדוק סמוך לביקור מה מוצג בפועל.","infoSource":"https://www.mori.art.museum/en/about/index.html"},{"id":"p_051c180ce8e0","name":"Tokyo City View","city":"טוקיו","area":"Azabudai + Roppongi","status":"רוצה","kind":"attraction","desc":"תצפית גבוהה על העיר מ-Roppongi Hills.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+City+View+Japan","booking":"","website":"","info":"Tokyo City View נפתח יחד עם Roppongi Hills ב־2003 בקומה ה־52 של Mori Tower, בגובה של כ־250 מטר מעל פני הים. החלל תוכנן כתצפית מקורה עם תקרה בגובה כ־11 מטר וחלונות זכוכית מהרצפה עד התקרה, אבל מראש לא היה רק 'קומה עם נוף': הוא משמש גם גלריה לאירועים ותערוכות שמחברות תרבות פופ, אמנות והנוף העירוני. זה מתאים לחזון של Roppongi Hills כמרכז תרבותי, שבו התצפית ומוזיאון Mori יושבים זה ליד זה. מכאן Tokyo Tower נמצא קרוב מאוד לעין, ואפשר לראות גם Skytree, Rainbow Bridge ולעיתים Fuji. זו זווית שונה מאוד מ־Shibuya Sky.","infoSource":"https://tcv.roppongihills.com/en/enjoy/intro/"},{"id":"p_ee87744fa175","name":"21_21 Design Sight","city":"טוקיו","area":"Azabudai + Roppongi","status":"רוצה","kind":"attraction","desc":"מוזיאון/חלל עיצוב במתחם Tokyo Midtown שתוכנן בשיתוף Tadao Ando, עם תערוכות מתחלפות של עיצוב ותרבות.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=21_21+Design+Sight+Japan","booking":"","website":"","info":"21_21 DESIGN SIGHT נולד מחלום של Issey Miyake ליצור ביפן מקום שמלמד 'לראות' עיצוב. כבר משנות ה־70 וה־80 הוא דיבר על הצורך במוזיאון עיצוב עם יוצרים כמו Isamu Noguchi, Ikko Tanaka, Shiro Kuramata ו־Tadao Ando; מאמר שפרסם ב־2003 האיץ את היוזמה, והמקום נפתח ב־Tokyo Midtown ב־2007. Tadao Ando תכנן מבנה שרובו שקוע בקרקע, עם גג פלדה מקופל שמרמז על רעיון A Piece of Cloth של Miyake. אפילו השם 21_21 משחק על ראייה חדה ועל 'נקודת מבט'. בזמן הביקור שלנו, 8/12/2026, מוצגת לפי התוכנית הרשמית Learning from “Hōjōki”: Tiny Architecture Reweaves Life, שלוקחת טקסט יפני מהמאה ה־13 ובוחנת דרכו מגורים קטנים, ארכיטקטורה וחיים. כדאי להסתכל על הבניין לא פחות מאשר על התערוכה.","infoSource":"https://www.2121designsight.jp/en/designsight/"},{"id":"p_01c9510fb4ff","name":"MUJI Ginza","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"סניף דגל רב קומות של MUJI עם עיצוב, מוצרים, אוכל ומלון.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=MUJI+Ginza+Japan","booking":"","website":""},{"id":"p_657bf5ebbd80","name":"UNIQLO Ginza","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"סניף ענק ורב קומות של UNIQLO.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=UNIQLO+Ginza+Japan","booking":"","website":""},{"id":"p_80c211cfa03c","name":"Sony Park Ginza","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"מתחם תרבות/טכנולוגיה של Sony עם תערוכות מתחלפות.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Sony+Park+Ginza+Japan","booking":"","website":"","info":"Ginza Sony Park ממשיך סיפור שהתחיל ב־1966, כאשר Akio Morita, ממייסדי Sony, פתח את Sony Building בגינזה. בפינת הבניין הוא השאיר שטח ציבורי קטן של כ־33 מ״ר שכינה 'Garden of Ginza' — מחווה חריגה ברחוב מסחרי יקר. הבניין נסגר ב־2017, ובמקום להקים מיד מגדל חדש Sony פתחה ב־2018 פארק זמני פתוח שהפך בעצמו להצלחה. הגרסה החדשה של Ginza Sony Park נפתחה ב־2025, בבניין שנבנה נמוך בכוונה מהסביבה כדי ליצור תחושת פתיחות. הרעיון הוא לא חנות דגל רגילה אלא מרחב ציבורי של מוזיקה, אמנות, אוכל וטכנולוגיה. לכן המקום מעניין גם כפרויקט עירוני: חברה פרטית בחרה לשמר רעיון של 'מרווח' פתוח בלב אחד האזורים היקרים בעיר.","infoSource":"https://www.sonypark.com/e/"},{"id":"p_6d2193c973f2","name":"Nissan Crossing","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"חלל תצוגה עתידני של Nissan עם רכבים וטכנולוגיה.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Nissan+Crossing+Japan","booking":"","website":"","info":"NISSAN CROSSING יושב בצומת Ginza 4-chome, אחד הצמתים הסמליים ביותר של טוקיו, וממשיך מסורת של Nissan להציג בגינזה את הצד החדשני של החברה. החלל הנוכחי נפתח כחלק מ־GINZA PLACE ב־2016 ונועד להיות פחות showroom של מכירות ויותר במה לטכנולוגיה, design ו־Intelligent Mobility. העובדה שחברת רכב מציבה כאן concept cars וטכנולוגיות עתידיות מתאימה להיסטוריה של Ginza כחלון ראווה ליפן המודרנית מאז Meiji — אזור שבו חידושים מערביים, תאורה, בתי כלבו ומותגים הופיעו מוקדם יחסית. אין דגם אחד שחייבים לראות כי התצוגה משתנה; מה שמעניין הוא האופן שבו המכונית מוצגת כאובייקט של עיצוב וטכנולוגיה בלב רובע מסחר היסטורי.","infoSource":"https://www.nissan.co.jp/CROSSING/"},{"id":"p_b276344cf52a","name":"Art Aquarium Museum","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"מיצגי אמנות ותאורה סביב אקווריומים של דגי זהב.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Art+Aquarium+Museum+Japan","booking":"","website":"","info":"Art Aquarium Ginza הוא מוסד עכשווי, אבל חומר הגלם שלו — goldfish — נושא היסטוריה יפנית ארוכה. דגי זהב הגיעו ליפן מסין כבר בתקופת Muromachi, ובתקופת Edo גידולם התפשט מעבר לאליטות והפך לתרבות פנאי עירונית. אמנים כמו Utagawa Kuniyoshi שילבו goldfish ב־ukiyo-e, ובמהלך השנים פותחו ביפן זנים מקומיים רבים. המוזיאון משתמש בדגים חיים בתוך מיצבי תאורה, כלי זכוכית, Kutani ware ומוטיבים מסורתיים כדי להפוך מסורת גידול וצפייה למופע עכשווי. כדאי להסתכל גם על הזנים עצמם — ryukin, ranchu, tosakin ואחרים — ולא רק על האפקטים. חשוב להבין שזה אינו מוזיאון טבע קלאסי אלא מפגש בין בעלי חיים, מסורת דקורטיבית ו־entertainment מודרני.","infoSource":"https://artaquarium.jp/enjoy/tradition/"},{"id":"p_4a9b510ea92c","name":"Hamarikyu Gardens","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"גן יפני היסטורי עם בריכות, בית תה וניגוד יפה לגורדי השחקים.","duration":"1–1.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Hamarikyu+Gardens+Japan","booking":"","website":"","info":"Hamarikyu התחיל באמצע המאה ה־17 כאשר Matsudaira Tsunashige, קרוב למשפחת Tokugawa, ייבש חלק מהמים הרדודים של Edo Bay ובנה שם אחוזה. כאשר בנו Ienobu הפך לשוגון השישי, האתר עבר לבעלות השוגונות ונודע כ־Hama Goten — 'ארמון החוף'. שוגונים המשיכו לשנות את הגן במשך יותר ממאה שנה, והוא קיבל את צורתו הבסיסית בתקופת השוגון ה־11 Ienari. המאפיין ההיסטורי החשוב ביותר הוא Shioiri-no-ike, בריכה שמקבלת מי ים מהמפרץ וגובהה משתנה עם הגאות — השריד הפעיל היחיד מסוג זה בגני טוקיו. אחרי רסטורציית Meiji הפך המקום לארמון משנה קיסרי וב־1945 הועבר לעיר. הניגוד בין בית התה והבריכה לבין גורדי השחקים של Shiodome הוא מהנופים הטובים בעיר להבנת 350 שנות שינוי.","infoSource":"https://www.tokyo-park.or.jp/teien/en/hama-rikyu/outline.html"},{"id":"p_35264dbe4296","name":"Tokyo Character Street","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"מסדרון חנויות דמויות בתחנת Tokyo: anime, TV, mascots ועוד.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+Character+Street+Japan","booking":"","website":""},{"id":"p_cd5be653a74b","name":"Tokyo Station Marunouchi","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"חזית הלבנים ההיסטורית של תחנת טוקיו והאזור המודרני סביבה.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+Station+Marunouchi+Japan","booking":"","website":"","info":"Tokyo Station נפתחה ב־1914 כבניין השער של הבירה המודרנית, לפי תכנון האדריכל Tatsuno Kingo. חזית Marunouchi האדומה שרדה את רעידת Kantō של 1923 כמעט ללא נזק משמעותי, אבל בהפצצות 1945 נשרפו הגגות וחלקים נרחבים; בשיקום שלאחר המלחמה נבנתה התחנה בגובה נמוך יותר וללא הכיפות המקוריות. בין 2007 ל־2012 בוצע פרויקט שימור גדול שהחזיר את הקומה השלישית ואת הכיפות לפי התכנון ההיסטורי, תוך התאמה לתשתיות של תחנה שמשרתת היום רכבות עירוניות ו־Shinkansen לכל המדינה. הבניין הוכר כ־Important Cultural Property. צאו לכיכר Marunouchi לראות את החזית בשלמותה ואז היכנסו מתחת לכיפות — שם מרגישים היטב את החיבור בין היסטוריה לתחנת־על מודרנית.","infoSource":"https://www.gotokyo.org/en/story/walks-and-tours/tokyo-architecture-tokyo-station/index.html"},{"id":"food_ts_tantan","name":"T’s Tantan Tokyo Station","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"food","desc":"ראמן טבעוני בתחנת Tokyo Station. מקום נוח מאוד לארוחה מהירה ובטוחה לצמחונית בלי דגים או dashi.","duration":"30–60 דק׳","note":"טבעוני לחלוטין.","maps":"https://www.google.com/maps/search/?api=1&query=T%27s+Tantan+Tokyo+Station","booking":"","website":"https://foods.jr-cross.co.jp/ts-tantan/"},{"id":"p_fd1aa1ebe25b","name":"Sunshine Aquarium","city":"טוקיו","area":"Ikebukuro","status":"רוצה","kind":"attraction","desc":"אקווריום עירוני עם פינגווינים, לוטרות ותצוגות יצירתיות.","duration":"1.5–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Sunshine+Aquarium+Japan","booking":"","website":"","info":"Sunshine Aquarium נפתח ב־1978 כחלק מ־Sunshine City, על גג World Import Mart באיקבוקורו, והיה אחד האקווריומים העירוניים הגבוהים והחריגים ביפן. ב־2011 עבר שיפוץ גדול והוגדר מחדש כ־'Oasis in the Sky'. במקום לנסות לחקות אקווריום חופי גדול, הוא משתמש דווקא במיקום בתוך צפיפות עירונית: מיכלים וחיות מים מול שמיים וגורדי שחקים. המוצג המזוהה ביותר הוא Penguins in the Sky, שבו פינגווינים שוחים במיכל תלוי ונראים כאילו הם 'עפים' מעל טוקיו. למקום יש גם פעילות שימור, כולל פרויקטים הקשורים לשוניות אלמוגים. ההיסטוריה שלו מספרת כיצד Ikebukuro של שנות ה־70 ניסה לבנות עיר שלמה בתוך קומפלקס אחד — מסחר, משרדים, בידור ואפילו אקווריום על הגג.","infoSource":"https://sunshinecity.jp/en/aquarium/area/"},{"id":"p_7021610ad3e5","name":"Bandai Namco Cross Store","city":"טוקיו","area":"Ikebukuro","status":"רוצה","kind":"attraction","desc":"מתחם עם מותגי Bandai Namco, משחקים, דמויות ומרצ׳נדייז.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Bandai+Namco+Cross+Store+Japan","booking":"","website":""},{"id":"p_a2be9c6b2fe0","name":"NAMJATOWN","city":"טוקיו","area":"Ikebukuro","status":"רוצה","kind":"attraction","desc":"פארק indoor קטן ומשונה עם מתקנים, אוכל ודמויות.","duration":"1–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=NAMJATOWN+Japan","booking":"","website":"","info":"NAMJATOWN נפתח ב־6 ביולי 1996 ב־Sunshine City תחת השם Sunshine Namja Town, וב־2026 הוא חוגג 30 שנה. Bandai Namco בנתה אותו כפארק מקורה שמבוסס על 'עיר' של סמטאות, דמויות, משחקים ואוכל — לא על רכבות הרים ענקיות. ב־2002 נפתח בו Ikebukuro Gyoza Stadium, אחד החלוצים של food theme parks; בהמשך נוספו אזורי רוחות, חתולים ונינג'ה ושיתופי פעולה עם anime הפכו לחלק מרכזי מהזהות. ב־2026 בוצע שיפוץ משמעותי לרגל 30 שנה ונוספה בין היתר אטרקציית Taiko no Tatsujin גדולה. זו דוגמה טובה לאופן שבו Bandai Namco עברה ממשחקים ומכונות ארקייד ל־location-based entertainment — עולם פיזי שמבוסס על דמויות ו־IP.","infoSource":"https://bandainamco-am.co.jp/tp/namja/NEWS/info/20260618_1.html"},{"id":"p_6b5329e13d24","name":"Animate Ikebukuro","city":"טוקיו","area":"Ikebukuro","status":"רוצה","kind":"attraction","desc":"חנות ענקית לאנימה, מנגה ו-merchandise.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Animate+Ikebukuro+Japan","booking":"","website":""},{"id":"p_d028272c6442","name":"Neco Republic Ikebukuro rescue cat café","city":"טוקיו","area":"Ikebukuro","status":"רוצה","kind":"attraction","desc":"בית קפה עם חתולי הצלה ואימוץ. מתאים יותר למי שמעדיף מודל עם רווחת בעלי חיים.","duration":"60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Neco+Republic+Ikebukuro+rescue+cat+caf%C3%A9+Japan","booking":"","website":"","info":"Neco Republic מייצג גל חדש יותר של cat cafés ביפן: במקום להחזיק חתולים רק כחלק מבילוי, המודל משלב בית קפה עם הצלה, חשיפה לאימוץ וגיוס תמיכה לרווחת חתולים. בכך הוא לוקח פורמט שהפך לסמל תיירותי יפני ומוסיף לו תפקיד חברתי. החתולים במקום הם בעלי חיים עם היסטוריה ואפשרות לבית חדש, ולכן הביקור שונה מחוויה שבה החיות הן רק תפאורה. זה מעניין במיוחד בתוך Ikebukuro, אזור שמלא ב־character cafés ובידור ממוסחר: כאן הקשר עם בעלי החיים נועד גם לעודד אחריות. בביקור חשוב לכבד את כללי המגע, השינה, ההאכלה והצילום ולתת לחתולים לבחור אם להתקרב.","infoSource":"https://www.neco-republic.jp/"},{"id":"p_5dcfa1bddcef","name":"Pokémon Center MEGA TOKYO","city":"טוקיו","area":"Ikebukuro","status":"חובה","kind":"attraction","desc":"אחד ממרכזי Pokémon הגדולים בטוקיו, בתוך Sunshine City באיקבוקורו, עם מבחר גדול של מרצ'נדייז ומוצרים בלעדיים.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Pokemon+Center+MEGA+TOKYO+Sunshine+City+Japan","booking":"","website":""},{"id":"p_0169f1c102f4","name":"Pikachu Sweets by Pokémon Cafe","city":"טוקיו","area":"Ikebukuro","status":"חובה","kind":"food","desc":"דוכן Pokémon Café בסגנון takeaway ליד Pokémon Center MEGA TOKYO, עם משקאות וקינוחים בעיצוב Pokémon.","duration":"20–40 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Pikachu+Sweets+by+Pokemon+Cafe+Sunshine+City+Japan","booking":"","website":""},{"id":"p_f4d7f88e6d14","name":"Rikugien Garden","city":"טוקיו","area":"Autumn Gardens","status":"חובה","kind":"attraction","desc":"גן יפני קלאסי ומרהיב במיוחד בשלכת, לעיתים עם תאורת ערב עונתית.","duration":"1–1.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Rikugien+Garden+Japan","booking":"","website":"","info":"Rikugien נבנה ב־1702 בידי Yanagisawa Yoshiyasu, יועץ קרוב לשוגון החמישי Tokugawa Tsunayoshi. הוא לא תכנן 'פארק טבעי' אלא נוף ספרותי: גבעות מלאכותיות, אגם ואיים נבנו סביב דימויים מתוך שירת waka וקלאסיקות סיניות, והגן כלל ייצוגים של עשרות נופים ספרותיים. אפילו השם Rikugien מתייחס ל'שש הקטגוריות' של השירה. בתקופת Meiji רכש אותו Iwasaki Yatarō, מייסד Mitsubishi, ומשפחת Iwasaki תרמה אותו לעיר טוקיו ב־1938; ב־1953 הוכר כ־Special Place of Scenic Beauty. זהו גן שצריך 'לקרוא' בהליכה: בכל סיבוב השביל מסתיר ומגלה תמונה חדשה. חשוב למסלול שלנו: תאורת השלכת המיוחדת של 2026 מסתיימת ב־6/12, ולכן ב־9/12 זה ביקור יום רגיל.","infoSource":"https://www.tokyo-park.or.jp/teien/en/rikugien/outline.html"},{"id":"p_b61f77e1a145","name":"Koishikawa Korakuen","city":"טוקיו","area":"Autumn Gardens","status":"רוצה","kind":"attraction","desc":"אחד הגנים היפניים העתיקים בטוקיו, עם בריכות, גשרים ושלכת.","duration":"1–1.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Koishikawa+Korakuen+Japan","booking":"","website":"","info":"Koishikawa Kōrakuen החל להיבנות ב־1629 עבור Tokugawa Yorifusa, מייסד ענף Mito של משפחת Tokugawa, והושלם בימי בנו Mitsukuni. Mitsukuni היה מלומד והושפע מהחוקר הסיני Zhu Shunshui, ולכן הגן משלב נופים ורעיונות סיניים עם מסורת גן יפנית: Full Moon Bridge, ייצוגים של נופים סיניים ומוטיבים ספרותיים. גם השם Kōrakuen מגיע מטקסט קונפוציאני על שליט שצריך 'לדאוג לפני העם וליהנות אחריו'. הגן בנוי סביב אגם וגבעות ומיועד לשיטוט שבו הנוף משתנה כל הזמן. כיום Tokyo Dome והעיר המודרנית מציצים מעבר לעצים, מה שמחדד כמה נדיר שהגן הזה שרד בלב טוקיו במשך כמעט ארבע מאות שנה.","infoSource":"https://www.tokyo-park.or.jp/teien/en/koishikawa/outline.html"},{"id":"p_e99feaf36cfc","name":"Kiyomizu-dera","city":"קיוטו","area":"Higashiyama + Gion","status":"חובה","kind":"attraction","desc":"מקדש מפורסם על גבעה עם מרפסת עץ ונוף לקיוטו.","duration":"1–1.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kiyomizu-dera+Japan","booking":"","website":""},{"id":"p_43740fb1fbb4","name":"Sannenzaka","city":"קיוטו","area":"Higashiyama + Gion","status":"חובה","kind":"attraction","desc":"רחוב היסטורי יפה עם בתי עץ, חנויות וממתקים.","duration":"30–45 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Sannenzaka+Japan","booking":"","website":""},{"id":"p_ad0964a285b3","name":"Ninenzaka","city":"קיוטו","area":"Higashiyama + Gion","status":"חובה","kind":"attraction","desc":"סמטה מסורתית פוטוגנית המחברת בין אזור Kiyomizu ל-Gion.","duration":"30–45 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Ninenzaka+Japan","booking":"","website":""},{"id":"p_8ecae80d31fb","name":"Yasaka Pagoda","city":"קיוטו","area":"Higashiyama + Gion","status":"רוצה","kind":"attraction","desc":"פגודה בולטת בלב Higashiyama, אחת התמונות המזוהות עם קיוטו.","duration":"15–30 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Yasaka+Pagoda+Japan","booking":"","website":""},{"id":"p_beeeb488b665","name":"Kodai-ji","city":"קיוטו","area":"Higashiyama + Gion","status":"רוצה","kind":"attraction","desc":"מקדש וגנים יפים, במיוחד בסתיו ובתאורת ערב.","duration":"60–90 דק׳","note":"","maps":"ht ","maps":"https://www.google.com/maps/search/?api=1&query=Kobe+Harborland+Japan","booking":"","website":""},{"id":"p_7034ba072e1c","name":"Meriken Park","city":"מסביב לאוסקה","area":"Kobe — אופציונלי","status":"רוצה","kind":"attraction","desc":"פארק נמל עם Kobe Port Tower ונוף למים.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Meriken+Park+Japan","booking":"","website":""},{"id":"p_86ad1e064c0e","name":"Kobe Nunobiki Herb Gardens","city":"מסביב לאוסקה","area":"Kobe — אופציונלי","status":"רוצה","kind":"attraction","desc":"גן עשבי תיבול גדול על ההר עם רכבל ונוף לעיר.","duration":"2–3 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kobe+Nunobiki+Herb+Gardens+Japan","booking":"","website":""},{"id":"p_a635db053fed","name":"Kobe Chinatown / Nankinmachi","city":"מסביב לאוסקה","area":"Kobe — אופציונלי","status":"רוצה","kind":"attraction","desc":"צ'יינהטאון קומפקטי עם אוכל רחוב ורחובות צבעוניים.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kobe+Chinatown+%2F+Nankinmachi+Japan","booking":"","website":""},{"id":"p_b3a611b481d6","name":"Himeji Castle","city":"מסביב לאוסקה","area":"Himeji — אופציונלי","status":"רוצה","kind":"attraction","desc":"אחת הטירות המקוריות והמרשימות ביפן.","duration":"2–3 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Himeji+Castle+Japan","booking":"","website":""},{"id":"p_633fbac336c0","name":"Koko-en Garden","city":"מסביב לאוסקה","area":"Himeji — אופציונלי","status":"רוצה","kind":"attraction","desc":"גן יפני יפה ממש ליד Himeji Castle.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Koko-en+Garden+Japan","booking":"","website":""},{"id":"p_9c3132dd3fcc","name":"Ueno Park","city":"טוקיו","area":"Ueno + Ameyoko","status":"רוצה","kind":"attraction","desc":"פארק עירוני גדול שמרכז סביבו מוזיאונים, מקדשים ושבילים. בתקופת סתיו מתאים להליכה רגועה בין עצים ומוזיאונים.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Ueno+Park+Japan","booking":"","website":"","info":"Ueno Park יושב על שטח שהיה בתקופת Edo חלק ממקדש Kan'ei-ji, מקדש חשוב של משפחת Tokugawa שנבנה כדי להגן רוחנית על Edo מצפון־מזרח. ב־1868, בזמן מלחמת Boshin, התחולל באזור קרב Ueno בין כוחות השוגונות לשלטון Meiji, וחלקים גדולים מהמקדש נהרסו. לאחר מכן בחרה ממשלת Meiji להפוך את השטח לפארק ציבורי; Ueno היה בין הפארקים הציבוריים הראשונים ביפן. בהמשך רוכזו סביבו מוזיאונים לאומיים, גן חיות ומוסדות אמנות, ולכן הוא הפך למעין רובע תרבות לאומי. כשעוברים בין המוזיאונים, למעשה הולכים על קרקע שמספרת את המעבר משלטון Tokugawa למדינת Meiji — ממקדש של השוגון למרחב ציבורי של חינוך, מדע ותרבות.","infoSource":"https://www.gotokyo.org/en/destinations/northern-tokyo/ueno/index.html"},{"id":"p_3ff2cc2c2491","name":"Ameyoko Market","city":"טוקיו","area":"Ueno + Ameyoko","status":"רוצה","kind":"attraction","desc":"שוק רחוב צבעוני עם אוכל, מתוקים, ביגוד וחנויות. מתאים לשילוב עם Ueno ו-Akihabara.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Ameyoko+Market+Japan","booking":"","website":"","info":"Ameyoko התפתח במיוחד בשנים שאחרי מלחמת העולם השנייה, כאשר סביב המסילה בין Ueno ל־Okachimachi נוצר שוק שחור למזון ולמוצרים שקשה היה להשיג בתקופת הקיצוב. יש כמה הסברים לשם: ame יכול להתייחס לממתקים שנמכרו כאן, אך רבים קישרו אותו גם ל־'America' בגלל מוצרים אמריקאיים שהגיעו לשוק. במשך העשורים שאחרי המלחמה עבר המקום מכלכלת הישרדות למסחר עממי, וכיום פועלות לאורך כ־500 מטר מאות חנויות ודוכנים. העניין ההיסטורי הוא הניגוד ל־Ueno Park והמוזיאונים הסמוכים: כמה דקות ממוסדות לאומיים מסודרים נכנסים למרחב שנולד מכלכלה לא־רשמית של טוקיו החרבה אחרי 1945. הקולות, הצפיפות והשלטים הם חלק מהחוויה לא פחות מהמוצרים.","infoSource":"https://www.gotokyo.org/en/spot/71/"},{"id":"p_059773fe3b18","name":"National Museum of Nature and Science","city":"טוקיו","area":"Ueno + Ameyoko","status":"רוצה","kind":"attraction","desc":"מוזיאון טבע ומדע גדול עם דינוזאורים, חלל, מדע וטכנולוגיה.","duration":"1.5–2.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=National+Museum+of+Nature+and+Science+Japan","booking":"","website":"","info":"המוזיאון הלאומי לטבע ומדע הוא אחד ממוסדות המדע הוותיקים ביפן, עם שורשים בשנות ה־1870 של תקופת Meiji — שנים שבהן המדינה השקיעה בכוונה באיסוף, קטלוג וחינוך מדעי כחלק מהמודרניזציה. הבניין ההיסטורי של Japan Gallery נפתח ב־1931, וצורתו מלמעלה מזכירה מטוס, סמל לאמונה של אותה תקופה במדע ובטכנולוגיה. האוספים עוסקים בטבע, אבולוציה, גאולוגיה, ביולוגיה והיסטוריה של המדע והטכנולוגיה ביפן. זה אינו רק 'מוזיאון לילדים': הוא מספר כיצד יפן עברה ממדינה שנפתחה מחדש לעולם במאה ה־19 למעצמה מדעית ותעשייתית. בזמן המוגבל שלנו עדיף להתמקד ב־Japan Gallery ובכמה נושאים שמעניינים אתכם במקום לנסות לראות הכול.","infoSource":"https://www.kahaku.go.jp/english/"},{"id":"p_f6d904a563a7","name":"Tokyo National Museum","city":"טוקיו","area":"Ueno + Ameyoko","status":"רוצה","kind":"attraction","desc":"המוזיאון המרכזי לאמנות והיסטוריה יפנית, בתוך Ueno Park.","duration":"1.5–2.5 ש׳","note":"שובץ ביום Ueno לצד National Museum of Nature and Science.","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+National+Museum+Japan","booking":"","website":"https://www.tnm.jp/?lang=en","info":"Tokyo National Museum נוסד ב־1872, כאשר נערכה ב־Yushima Seidō תערוכה שנחשבת לפתיחת המוזיאון הראשון ביפן. עצם ההקמה קשורה למדינת Meiji החדשה, שניסתה לקטלג, לשמר ולהציג את התרבות היפנית בזמן של מודרניזציה מהירה. המוסד עבר ל־Ueno ב־1882 וכיום מחזיק אוסף עצום של אמנות, ארכאולוגיה, פסלים בודהיסטיים, קרמיקה, טקסטיל, קליגרפיה, שריון וחרבות, ובהם National Treasures ו־Important Cultural Properties רבים. אחרי ביקור במקדשים וגנים, כאן אפשר לראות את החפצים עצמם מאותן תקופות. המוצגים מתחלפים לעיתים קרובות לצורכי שימור, ולכן אין 'יצירת חובה' קבועה; בזמן שלנו עדיף להתמקד ב־Honkan ובחלקים נבחרים של Heiseikan.","infoSource":"https://www.tnm.jp/modules/r_free_page/index.php?id=155&lang=en"},{"id":"p_20e5debe1afa","name":"Imperial Palace East Gardens","city":"טוקיו","area":"Imperial Palace + Tokyo Station","status":"רוצה","kind":"attraction","desc":"הגנים המזרחיים של הארמון הקיסרי בטוקיו, עם שרידי חומות, גנים ושבילים בלב העיר.","duration":"60–90 דק׳","note":"שובץ ליום Akihabara כדי לא להעמיס על Ginza ולשמור קרבה יחסית למרכז.","maps":"https://www.google.com/maps/search/?api=1&query=Imperial+Palace+East+Gardens+Japan","booking":"","website":"https://www.kunaicho.go.jp/e-event/higashigyoen02.html","info":"ה־East Gardens יושבים על הלב ההיסטורי של Edo Castle — אזורי Honmaru, Ninomaru ו־Sannomaru שבהם פעלה שוגונות Tokugawa. מ־1603 ועד 1868 מכאן נוהלה בפועל יפן. הטירה הייתה מערכת עצומה של חומות, שערים וחפירים; המגדל הראשי נשרף ב־1657 ב־Great Fire of Meireki ולא נבנה מחדש, ולכן היום רואים בעיקר את בסיס האבן Tenshudai. אחרי רסטורציית Meiji עבר האתר למשפחה הקיסרית, וחלקים מהשטח נפתחו לציבור כגנים ב־1968. העובדה שאין 'טירה שלמה' היא חלק מהסיפור: החומות והטופוגרפיה מאפשרות לדמיין את קנה המידה של Edo Castle ואת הדרך שבה טוקיו המודרנית נבנתה ממש סביב מרכז הכוח הישן.","infoSource":"https://www.kunaicho.go.jp/en/visit/event/higashigyoen/index.html"},{"id":"p_c1a69e0a9701","name":"Marunouchi","city":"טוקיו","area":"Imperial Palace + Tokyo Station","status":"אולי","kind":"attraction","desc":"האזור האלגנטי בין הארמון לתחנת Tokyo, עם אדריכלות, קניות ובתי קפה.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Marunouchi+Japan","booking":"","website":"","info":"Marunouchi פירושו 'בתוך המעגל', רמז לחפירים שהקיפו את Edo Castle. בתקופת Tokugawa האזור היה מלא באחוזות של daimyo סמוך למרכז השלטון. אחרי Meiji הפכה הקרקע לרכוש ממשלתי ולמתחם צבאי, וב־1890 רכש Mitsubishi שטחים עצומים באזור מתוך חזון להקים רובע עסקים מערבי. ב־1894 הושלם Mitsubishi Ichigokan, ובהמשך נבנו שורות של מבני לבנים שכונו 'London Block'. פתיחת Tokyo Station ב־1914 הפכה את Marunouchi למרכז עסקי לאומי. Marunouchi Building המקורי מ־1923 שרד גם את רעידת Kantō וגם את הפצצות המלחמה. היום גורדי זכוכית ניצבים בין התחנה לארמון, אבל הגיאוגרפיה עדיין מספרת את המעבר מאחוזות סמוראים, דרך מדינת Meiji ו־Mitsubishi, אל לב הפיננסים של יפן.","infoSource":"https://www.mitsubishi.com/en/profile/history/outline/"},{"id":"p_f4384d076558","name":"Daikanyama T-Site","city":"טוקיו","area":"Daikanyama + Nakameguro + Shimokitazawa","status":"אולי","kind":"attraction","desc":"מתחם מעוצב של ספרים, אמנות, עיצוב ובתי קפה בשכונת Daikanyama.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Daikanyama+T-Site+Japan","booking":"","website":""},{"id":"p_e7b9e8b2a661","name":"Nakameguro + Meguro River","city":"טוקיו","area":"Daikanyama + Nakameguro + Shimokitazawa","status":"אולי","kind":"attraction","desc":"שכונה נעימה עם בוטיקים, בתי קפה והליכה לאורך נהר Meguro.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Nakameguro+%2B+Meguro+River+Japan","booking":"","website":"","info":"Meguro River מתפתל כמעט שמונה קילומטרים דרך דרום טוקיו אל המפרץ. Nakameguro הייתה בעבר הרבה יותר כפרית ותעשייתית מהדימוי האופנתי שלה היום, והנהר עצמו עבר הסדרה הנדסית והפך בחלקים רבים לתעלה עירונית. עם התפתחות מסילות הרכבת והקרבה לשיבויה, השכונה הפכה בהדרגה לאזור מגורים, מסעדות ותרבות יצירתית. בשנים האחרונות בתי קפה, גלריות וחנויות קטנות הפכו את גדות הנהר למוקד טיול, ובעונת הסאקורה הוא אחד מאתרי הפריחה המפורסמים בטוקיו. מחוץ לעונה רואים טוב יותר את המרקם העירוני: גשרים קטנים, בתים ושבילים שמאפשרים לעיר להאט. ההיסטוריה כאן היא שינוי של ציר מים שימושי למרחב ציבורי ואורח חיים.","infoSource":"https://www.gotokyo.org/en/spot/103/index.html"},{"id":"p_d4046a4ceaec","name":"Starbucks Reserve Roastery Tokyo","city":"טוקיו","area":"Daikanyama + Nakameguro + Shimokitazawa","status":"אולי","kind":"food","desc":"סניף הדגל המרשים של Starbucks לאורך Meguro River, בעיצוב Kengo Kuma.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Starbucks+Reserve+Roastery+Tokyo+Japan","booking":"","website":""},{"id":"p_95e762595bff","name":"Shimokitazawa","city":"טוקיו","area":"Daikanyama + Nakameguro + Shimokitazawa","status":"אולי","kind":"attraction","desc":"שכונת היפסטרים עם וינטג׳, תקליטים, בתי קפה וחנויות קטנות.","duration":"1.5–2.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Shimokitazawa+Japan","booking":"","website":"","info":"Shimokitazawa הייתה במקור אזור חקלאי מחוץ למרכז טוקיו. אחרי רעידת Kantō של 1923 אנשים עברו לאזור בחיפוש אחר מגורים בטוחים וזולים יותר, והצמיחה התחזקה במיוחד אחרי מלחמת העולם השנייה. הרחובות הצרים והלא־סדורים של הכפר הישן נשארו במידה רבה, ולכן השכונה לא קיבלה את רשת הרחובות הרחבה של מרכזים חדשים. משנות ה־70 וה־80 היא התפתחה למוקד של תיאטרון קטן, מוזיקה חיה, קולנוע עצמאי וחנויות יד שנייה; הקרבה לשיבויה ושינג'וקו לצד שכירות זולה יחסית משכה צעירים ויוצרים. זו שכונה שמספרת איך פריפריה כפרית הפכה למרכז תרבות אלטרנטיבית בלי להפוך לרובע גורדי שחקים.","infoSource":"https://www.japan.travel/en/spot/2108/"},{"id":"p_33e228bf3c4f","name":"Osaka Castle","city":"אוסקה","area":"Osaka Castle + Tenjinbashi","status":"רוצה","kind":"attraction","desc":"הטירה המרכזית של אוסקה והפארק שמסביבה. מתאימה לחצי יום של היסטוריה, גנים ותצפית.","duration":"1.5–2.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Osaka+Castle+Japan","booking":"","website":""},{"id":"p_db8ec5eeb85a","name":"Osaka Castle Park","city":"אוסקה","area":"Osaka Castle + Tenjinbashi","status":"רוצה","kind":"attraction","desc":"פארק רחב סביב הטירה עם שבילים, עצים ונקודות צילום.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Osaka+Castle+Park+Japan","booking":"","website":""},{"id":"p_05aa276494c5","name":"Tenjinbashi-suji Shopping Street","city":"אוסקה","area":"Osaka Castle + Tenjinbashi","status":"רוצה","kind":"attraction","desc":"אחד מרחובות הקניות המקורים הארוכים ביפן, עם אוכל, חנויות מקומיות ואווירה אוסקאית יומיומית.","duration":"1.5–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tenjinbashi-suji+Shopping+Street+Japan","booking":"","website":""},{"id":"p_bookoff_super_bazaar_omori","name":"BOOKOFF SUPER BAZAAR SEIYU Omori Store","city":"טוקיו","area":"Omori / Shinagawa","status":"רוצה","kind":"attraction","desc":"סניף BOOKOFF SUPER BAZAAR גדול בטוקיו עם ספרים, CD/DVD/Blu-ray, טלפונים, אלקטרוניקה, מוצרי חשמל, כלי נגינה, אופנה, כרטיסי אספנות, צעצועים, מותגים וכלי בית.","duration":"1.5–2 שעות","note":"לא באקיהברה — מתאים כעצירה נפרדת אם רוצים חוויית BOOKOFF SUPER BAZAAR גדולה.","maps":"https://www.google.com/maps/search/?api=1&query=BOOKOFF+SUPER+BAZAAR+SEIYU+Omori+Store+Tokyo+Japan","booking":"","website":""},{"id":"p_pokemon_center_tokyo_dx","name":"Pokémon Center TOKYO DX","city":"טוקיו","area":"Nihonbashi + Tokyo Station","status":"חובה","kind":"attraction","desc":"Pokémon Center גדול בניהונבאשי, עם מרצ'נדייז רחב, מוצרים בלעדיים ואזור Pokémon Café הסמוך. מתאים לשילוב עם Tokyo Station / Nihonbashi ביום מרכז טוקיו.","duration":"60–90 דק׳","note":"אפשר לשלב עם Pokémon Café אם משיגים הזמנה.","maps":"https://www.google.com/maps/search/?api=1&query=Pokemon+Center+TOKYO+DX+Nihonbashi+Tokyo+Japan","booking":"","website":""},{"name":"GINZA SIX + Rooftop Garden","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"מתחם עיצוב, אמנות וקמעונאות בלב גינזה. הדגש אצלנו הוא על האדריכלות, האמנות הציבורית וגינת הגג הגדולה — לא על עוד סבב קניות.","duration":"45–60 דק׳","note":"משתלב טבעית ביום Ginza. גינת הגג היא החלק החשוב.","maps":"https://www.google.com/maps/search/?api=1&query=GINZA+SIX+Tokyo","booking":"","website":"https://ginza6.tokyo/","id":"p_98d0feba9731","info":"GINZA SIX נפתח ב־2017 על האתר שבו עמד קודם Matsuzakaya Ginza, אחד מבתי הכלבו הוותיקים באזור. הפרויקט איחד כמה חלקות גדולות בלב גינזה ונבנה סביב רעיון של מסחר כתרבות: מעבר לחנויות יש בו אמנות ציבורית, תערוכות, GINZA TSUTAYA BOOKS וגינת גג רחבה. האטריום המרכזי מארח יצירות מתחלפות של אמנים יפנים ובינלאומיים, כך שהמבנה מתפקד במידה מסוימת גם כגלריה ציבורית. גינת הגג מעניינת משום שהיא מכניסה שטח פתוח ממש מעל אחד הרחובות היקרים והצפופים ביפן. אצלנו כדאי להתייחס למקום פחות כקניון ויותר כחלק מהסיפור של Ginza — אזור שמאז Meiji משתמש באדריכלות, חדשנות ותצוגה כדי להציג בכל דור את 'היפן החדשה'.","infoSource":"https://ginza6.tokyo/art_en/"},{"name":"Kabukiza Theatre","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"בית הקבוקי האייקוני של גינזה. במסלול שלנו זו עצירת אדריכלות ותרבות קצרה מבחוץ/בלובי, בלי לבנות את היום סביב הופעה מלאה.","duration":"20–30 דק׳","note":"קרוב מאוד ל-Ginza Mitsukoshi ול-GINZA SIX.","maps":"https://www.google.com/maps/search/?api=1&query=Kabukiza+Theatre+Ginza+Tokyo","booking":"","website":"https://www.kabukiweb.net/theatres/kabukiza/","id":"p_4b5605ad0dd4","info":"Kabukiza נפתח לראשונה ב־1889, בשיא תקופת Meiji, כחלק מניסיון להציג kabuki כאמנות במה לאומית מכובדת בתקופה שבה יפן הגדירה את עצמה מחדש מול המערב. ההיסטוריה של הבניין היא רצף של הרס ושיקום: הוא נבנה מחדש ב־1911, נשרף מתקלה חשמלית ב־1921, הבנייה שלאחר מכן נפגעה ברעידת Kantō של 1923, המבנה השלישי נפתח ב־1925 ונחרב בהפצצות טוקיו ב־1945. התיאטרון שלאחר המלחמה נפתח ב־1951, והגרסה החמישית והנוכחית נפתחה ב־2013 תוך שמירה על חזית מסורתית לצד מגדל מודרני. לכן Kabukiza הוא לא רק בניין יפה אלא סיפור על ההתמדה של kabuki דרך שריפות, רעידות אדמה, מלחמה ומודרניזציה.","infoSource":"https://www.kabukiweb.net/about/theatre/history_kabukiza_theatre/"},{"name":"Ginza Mitsukoshi Depachika","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"קומת האוכל התת-קרקעית של Ginza Mitsukoshi — דוגמה מצוינת לתרבות ה-depachika היפנית. אצלנו זו עצירת התרשמות/נשנוש, לא ארוחה עיקרית.","duration":"30–40 דק׳","note":"Art Aquarium נמצא באותו מתחם, ולכן חיברנו אותם ברצף.","maps":"https://www.google.com/maps/search/?api=1&query=Ginza+Mitsukoshi+Tokyo","booking":"","website":"https://cp.mistore.jp/global/en/ginza.html","id":"p_c2afc1121926","info":"ה-Depachika של Ginza Mitsukoshi הוא עולם אוכל שלם בקומות המרתף של כלבו יפני קלאסי. אפשר לראות שם קונדיטוריה, wagashi, מנות מוכנות, חומרי גלם ומתנות אוכל ברמת תצוגה גבוהה מאוד. המטרה אצלנו היא להכיר את תרבות בתי הכלבו היפנית ולעשות סיבוב קצר לפני Art Aquarium שנמצא באותו מתחם."},{"name":"Tsukiji Outer Market","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"שוק האוכל החיצוני ההיסטורי של צוקיג׳י. השוק הסיטונאי עבר ל-Toyosu, אבל החנויות, הדוכנים והמסעדות של ה-Outer Market ממשיכים לפעול.","duration":"60–75 דק׳","note":"נכנס לבוקר של יום Ginza/Hamarikyu. לצמחוני: לבדוק היטב dashi/fish stock גם במנות שנראות צמחוניות.","maps":"https://www.google.com/maps/search/?api=1&query=Tsukiji+Outer+Market+Tokyo","booking":"","website":"https://www.tsukiji.or.jp/english/","id":"p_6b3bdf9de12d","info":"Tsukiji פירושו 'אדמה בנויה', משום שהאזור יובש מהים אחרי Great Fire of Meireki ב־1657. שוק הדגים הגיע לכאן הרבה יותר מאוחר: רעידת Kantō של 1923 החריבה את שוק Nihonbashi, והממשלה העבירה את הפעילות ל־Tsukiji; השוק הסיטונאי החדש נפתח ב־1935 והפך במשך עשרות שנים ללב אספקת המזון של טוקיו. ב־2018 עברו המכירות הפומביות והסיטונאות המרכזית ל־Toyosu, אבל מאות חנויות, מסעדות וספקים נשארו ב־Outer Market. לכן המקום אינו 'השוק הישן שקפא בזמן' אלא רובע מסחרי שהתאים את עצמו אחרי מעבר הליבה שלו. הסתכלו מעבר לסושי: סכינים, אצות, katsuo-bushi, tamagoyaki, תה וכלי מטבח מספרים טוב יותר את התפקיד של Tsukiji כמקום של אנשי מקצוע.","infoSource":"https://www.tsukiji.or.jp/english/"}]}</script>

async function fetchJsonTimeout(url, ms){
  const ctl=new AbortController();
  const t=setTimeout(()=>ctl.abort(), ms||6500);
  try{
    const r=await fetch(url,{signal:ctl.signal,cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

function normEntity(s){
  return String(s||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}
function imageQueryName(name){
  if(IMAGE_ALIASES[name]) return IMAGE_ALIASES[name];
  /* Composite itinerary labels are not safe to guess. If there is no explicit alias, use the full card name. */
  return String(name||'').trim();
}
function entityAccepts(query, row){
  const q=normEntity(query);
  const label=normEntity(row&&row.label);
  if(!q || !label) return false;
  /* Correct-only policy: exact entity label or very close containment. */
  if(label===q) return true;
  if(q.length>=10 && (label.includes(q) || q.includes(label))){
    const shorter=Math.min(q.length,label.length), longer=Math.max(q.length,label.length);
    return shorter/longer>=0.78;
  }
  return false;
}
