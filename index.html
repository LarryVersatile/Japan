,"items":[{"uid":"2026-12-07-0","part":"בוקר","time":"09:00–10:00","start":540,"end":600,"name":"Tsukiji Outer Market","kind":"אטרקציה","desc":"שוק האוכל החיצוני ההיסטורי של Tsukiji. חנויות, חומרי גלם, ממתקים, כלי מטבח ודוכנים — בעוד השוק הסיטונאי עצמו עבר ל-Toyosu.","maps":"https://www.google.com/maps/search/?api=1&query=Tsukiji+Outer+Market+Tokyo","website":"https://www.tsukiji.or.jp/english/","hop":"הליכה כ-1 ק״מ ל-Hamarikyu","transit":false,"info":"מה זה\nTsukiji Outer Market הוא האזור המסחרי שנשאר פעיל לאחר שהשוק הסיטונאי הראשי עבר ל-Toyosu ב-2018. עדיין פועלות בו חנויות מתמחות, מסעדות, דוכנים וספקי חומרי גלם.\n\nלמה זה חשוב\nTsukiji הוא שריד חי לכלכלה העירונית שנבנתה סביב אוכל, ים וספקים מקצועיים. בעוד Toyosu מייצג לוגיסטיקה מודרנית וסטרילית, Tsukiji מרגיש צפוף, אנושי ורחובי.\n\nמה לשים לב\nבואו בבוקר. שימו לב לסכינים, תה, אצות, tamagoyaki, wagashi וחומרי גלם — לא רק לסושי. לצמחוני: מנות שנראות ללא בשר עדיין עלולות להכיל dashi מדגים, ולכן צריך לשאול במפורש."},{"uid":"2026-12-07-1","part":"בוקר","time":"10:10–11:05","start":610,"end":665,"name":"Hamarikyu Gardens","kind":"אטרקציה","desc":"גן יפני היסטורי עם בריכות, בית תה וניגוד יפה לגורדי השחקים.","maps":"https://www.google.com/maps/search/?api=1&query=Hamarikyu+Gardens+Japan","website":"","hop":"הליכה / מטרו קצר ל-Ginza","transit":false,"info":"מה זה\nHamarikyu הוא גן daimyo גדול מתקופת Edo על שפת מפרץ טוקיו. תחילתו במאה ה-17, כאשר חלק מהים יובש ונבנתה במקום אחוזה של משפחת Tokugawa. לאחר Meiji הוא הפך לארמון נלווה של המשפחה הקיסרית ולבסוף נפתח לציבור.\n\nלמה זה חשוב\nהמאפיין הייחודי ביותר הוא Shioiri-no-ike — בריכה שמקבלת מי ים מהמפרץ ומפלסה משתנה עם הגאות והשפל. זו הבריכה הפעילה היחידה מסוג זה שנותרה בטוקיו.\n\nמה לשים לב\nחפשו את בריכת הגאות, את בית התה Nakajima-no-ochaya ואת האורן העתיק. הניגוד בין גן של shogun לבין גורדי השחקים של Shiodome הוא אחד הניגודים היפים במסלול."},{"uid":"2026-12-07-2","part":"בוקר","time":"11:15–11:40","start":675,"end":700,"name":"Kabukiza Theatre","kind":"אטרקציה","desc":"עצירה קצרה בבית הקבוקי האייקוני של גינזה — אדריכלות ותרבות, בלי להקדיש שעות להופעה מלאה.","maps":"https://www.google.com/maps/search/?api=1&query=Kabukiza+Theatre+Ginza+Tokyo","website":"https://www.kabukiweb.net/theatres/kabukiza/","hop":"הליכה 0.4 ק״מ","transit":false,"info":"מה זה\nKabukiza הוא בית התיאטרון המרכזי של kabuki בטוקיו וניצב בגינזה מאז סוף המאה ה-19, למרות שהמבנה הוחלף ונבנה מחדש כמה פעמים.\n\nלמה זה חשוב\nKabuki הוא תיאטרון יפני שהתפתח בתקופת Edo ושילב משחק מסוגנן, תלבושות, מוזיקה, במה מורכבת ומסורת שחקנים העוברת במשפחות. החזית המסורתית של Kabukiza יושבת כיום בתוך מתחם מודרני מאוד — עוד דוגמה לשכבות של Ginza.\n\nמה לשים לב\nאצלנו לא מתוכננת הופעה מלאה. המטרה היא לראות את החזית, להבין מהו kabuki ולראות כיצד מסורת ביצועית בת מאות שנים ממשיכה לפעול בלב טוקיו."},{"uid":"2026-12-07-3","part":"בוקר","time":"11:45–12:15","start":705,"end":735,"name":"Ginza Mitsukoshi Depachika","kind":"אטרקציה","desc":"קומת האוכל התת-קרקעית של Mitsukoshi — הצצה לתרבות ה-depachika. לא הארוחה העיקרית של היום.","maps":"https://www.google.com/maps/search/?api=1&query=Ginza+Mitsukoshi+Tokyo","website":"https://cp.mistore.jp/global/en/ginza.html","hop":"באותו בניין של Art Aquarium","transit":false,"info":"ה-Depachika של Ginza Mitsukoshi הוא עולם אוכל שלם בקומות המרתף של כלבו יפני קלאסי. אפשר לראות שם קונדיטוריה, wagashi, מנות מוכנות, חומרי גלם ומתנות אוכל ברמת תצוגה גבוהה מאוד. המטרה אצלנו היא להכיר את תרבות בתי הכלבו היפנית ולעשות סיבוב קצר לפני Art Aquarium שנמצא באותו מתחם."},{"uid":"2026-12-07-4","part":"צהריים","time":"12:20–13:15","start":740,"end":795,"name":"Art Aquarium Museum","kind":"אטרקציה","desc":"מיצגי אמנות ותאורה סביב אקווריומים של דגי זהב בתוך Ginza Mitsukoshi.","maps":"https://www.google.com/maps/search/?api=1&query=Art+Aquarium+Museum+Ginza","website":"","hop":"הליכה 0.2 ק״מ","transit":false,"info":"מה זה\nArt Aquarium Museum Ginza משתמש בדגי זהב חיים כחלק ממיצבי אור, צבע, מוזיקה ואקווריומים פיסוליים. התצוגות שואבות מוטיבים ממקדשים, גנים, פנסים ודוגמאות יפניות.\n\nלמה זה חשוב\ngoldfish הגיעו ליפן מסין והפכו לאורך מאות שנים לחלק מתרבות נוי, גידול עונתי ופסטיבלים. המוזיאון לוקח מסורת זו והופך אותה למופע עכשווי ואינסטגרמי.\n\nמה לשים לב\nיש במקום מגוון גדול מאוד של זני goldfish. נסו להסתכל גם על הדגים עצמם ולא רק על התאורה. חשוב לזכור שזו חוויית בידור-אמנות עם בעלי חיים, לא מוזיאון טבע."},{"uid":"2026-12-07-5","part":"צהריים","time":"13:20–13:45","start":800,"end":825,"name":"Nissan Crossing","kind":"אטרקציה","desc":"חלל תצוגה עתידני של Nissan עם רכבים וטכנולוגיה.","maps":"https://www.google.com/maps/search/?api=1&query=Nissan+Crossing+Ginza","website":"","hop":"הליכה 0.2 ק״מ","transit":false,"info":"מה זה\nNISSAN CROSSING הוא חלל תצוגה וטכנולוגיה בצומת Ginza 4-chome. Nissan מגדירה אותו כמרכז להצגת Intelligent Mobility ורעיונות על עתיד הנהיגה.\n\nלמה זה חשוב\nהחלל עצמו תוכנן סביב מוטיב \"Spiral\" ומנסה להציג רכב לא כמוצר בלבד אלא כחלק מתרבות עיצוב וטכנולוגיה. המיקום בגינזה מדגיש את החיבור בין מסורת מסחרית לחדשנות.\n\nמה לשים לב\nהמכוניות מתחלפות, ולכן אין דגם אחד שחייבים לראות. כדאי להתרכז בפרטי העיצוב, ממשקי הרכב ובאופן שבו Nissan מספרת סיפור על תחבורה עתידית."},{"uid":"2026-12-07-6","part":"צהריים","time":"13:50–14:30","start":830,"end":870,"name":"Sony Park Ginza","kind":"אטרקציה","desc":"מתחם תרבות/טכנולוגיה של Sony עם תערוכות מתחלפות.","maps":"https://www.google.com/maps/search/?api=1&query=Sony+Park+Ginza+Japan","website":"","hop":"הליכה 0.6 ק״מ","transit":false,"info":"מה זה\nGinza Sony Park הוא מרחב עירוני/תרבותי של Sony בלב Ginza, במקום שבו עמד בעבר Sony Building. הרעיון הוא פחות \"חנות דגל\" ויותר פארק עירוני אנכי שמארח מוזיקה, תערוכות, טכנולוגיה ואירועים מתחלפים.\n\nלמה זה חשוב\nSony משתמשת באתר כדי לבחון מה יכול להיות מרחב ציבורי בבעלות פרטית באחד הרחובות היקרים ביפן. זה מתאים מאוד לסיפור של Ginza: מסחר, עיצוב, טכנולוגיה ותרבות באותו מקום.\n\nמה לשים לב\nהתוכן משתנה, ולכן מה שחשוב הוא המבנה והאירוע שפועל בזמן הביקור. בדקו סמוך ל-7/12 מה מוצג בפועל."},{"uid":"2026-12-07-7","part":"אחה״צ","time":"14:35–15:25","start":875,"end":925,"name":"GINZA SIX + Rooftop Garden","kind":"אטרקציה","desc":"אדריכלות, אמנות ציבורית וגינת גג גדולה מעל גינזה. זו עצירת תרבות/עיצוב, לא עוד בלוק קניות.","maps":"https://www.google.com/maps/search/?api=1&query=GINZA+SIX+Tokyo","website":"https://ginza6.tokyo/","hop":"נסיעה קצרה ל-Tokyo Station","transit":false,"info":"מה זה\nGINZA SIX הוא מתחם עכשווי שמציג היטב את הצד המודרני של גינזה: אדריכלות, אמנות ציבורית, עיצוב וחללי מסחר. אצלנו המיקוד אינו קניות אלא התרבות והבניין.\n\nלמה זה חשוב\nGinza היא אזור שבו מסחר, עיצוב ואמנות התערבבו במשך יותר ממאה שנה. GINZA SIX ממשיך את המסורת הזו בקנה מידה עכשווי: אמנות באטריום, GINZA TSUTAYA BOOKS וגינת גג רחבה.\n\nמה לשים לב\nעלו לגינת הגג והביטו החוצה מעל אחד האזורים הצפופים והיקרים בעיר. זה רגע שממחיש איך טוקיו מנסה להכניס טבע ומרחב ציבורי גם לתוך פיתוח מסחרי צפוף."},{"uid":"2026-12-07-8","part":"אחה״צ","time":"15:45–16:35","start":945,"end":995,"name":"T’s Tantan Tokyo Station","kind":"מסעדה / אוכל","desc":"ראמן טבעוני בתחנת Tokyo Station — ארוחה בטוחה ללא בשר, דגים או dashi.","maps":"https://www.google.com/maps/search/?api=1&query=T%27s+Tantan+Tokyo+Station","website":"","hop":"הליכה / רכבת קצרה","transit":false},{"uid":"2026-12-07-9","part":"אחה״צ","time":"16:50–17:40","start":1010,"end":1060,"name":"Pokémon Center TOKYO DX","kind":"אטרקציה","desc":"Pokémon Center גדול בניהונבאשי עם מרצ'נדייז רחב ומוצרים בלעדיים.","maps":"https://www.google.com/maps/search/?api=1&query=Pokemon+Center+TOKYO+DX+Nihonbashi","website":"","hop":"הליכה / מטרו קצר","transit":false},{"uid":"2026-12-07-10","part":"ערב","time":"17:50–18:15","start":1070,"end":1095,"name":"Tokyo Station Marunouchi","kind":"אטרקציה","desc":"חזית הלבנים ההיסטורית של תחנת טוקיו והאזור המודרני סביבה.","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+Station+Marunouchi+Japan","website":"","hop":"הליכה 0.5 ק״מ","transit":false,"info":"מה זה\nTokyo Station נפתחה ב-1914 כבירתה התחבורתית של יפן המודרנית. בניין Marunouchi האדום תוכנן על ידי האדריכל Tatsuno Kingo.\n\nלמה זה חשוב\nהתחנה שרדה כמעט ללא נזק את רעידת Kanto של 1923, נפגעה בהפצצות 1945 ושוקמה בפשטות לאחר המלחמה. בין 2007 ל-2012 בוצע שימור ושחזור מקיף שהחזיר את המראה המקורי בן שלוש הקומות. ב-2003 הבניין הוכר כנכס תרבות חשוב.\n\nמה לשים לב\nעמדו בכיכר Marunouchi והסתכלו על כל החזית, ואז היכנסו לאולמות הכיפות. מסביב נמצא רובע עסקים מודרני מאוד — שוב שכבה היסטורית שנשמרת בתוך עיר מתחדשת."},{"uid":"2026-12-07-11","part":"ערב","time":"18:20–18:55","start":1100,"end":1135,"name":"Tokyo Character Street","kind":"חנות","desc":"מסדרון חנויות דמויות בתחנת Tokyo: anime, TV, mascots ועוד.","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+Character+Street","website":"","hop":"הליכה / מטרו קצר ל-Ginza","transit":false},{"uid":"2026-12-07-12","part":"ערב / קניות","time":"19:05–19:40","start":1145,"end":1180,"name":"MUJI Ginza","kind":"חנות","desc":"סניף דגל רב קומות של MUJI.","maps":"https://www.google.com/maps/search/?api=1&query=MUJI+Ginza+Japan","website":"","hop":"הליכה 0.5 ק״מ","transit":false},{"uid":"2026-12-07-13","part":"ערב / קניות","time":"19:45–20:20","start":1185,"end":1220,"name":"UNIQLO Ginza","kind":"חנות","desc":"סניף ענק ורב קומות של UNIQLO.","maps":"https://www.google.com/maps/search/?api=1&query=UNIQLO+Ginza+Japan","website":"","hop":"","transit":false}],"night":[]},{"id":"2026-12-08","date":"08/12","dow":"שלישי","title":"Azabudai + Roppongi","subtitle":"אמנות ביום, תצפית בשקיעה, BOOKOFF בסוף","base":"טוקיו","scope":["טוקיו"],"empty":false,"items":[{"uid":"2026-12-08-0","part":"בוקר","time":"09:30–12:00","start":570,"end":720,"name":"teamLab Borderless","kind":"אטרקציה","desc":"מוזיאון אמנות דיגיטלית ללא מסלול קבוע, עם חללים שמשתנים ומתחברים זה לזה.","maps":"https://www.google.com/maps/search/?api=1&query=teamLab+Borderless+Japan","website":"","hop":"הליכה 0.2 ק״מ","transit":false,"info":"מה זה\nteamLab Borderless הוא מוזיאון דיגיטלי ב-Azabudai Hills שבו העבודות אינן נשארות בתוך \"חדר\" אחד. דימויים נעים בין חללים, מגיבים למבקרים ומתחברים לעבודות אחרות.\n\nלמה זה חשוב\nהרעיון של \"Borderless\" הוא לבטל גבולות: בין יצירה ליצירה, בין המבקר לחלל ובין אמנות לטכנולוגיה. בניגוד ל-Planets, שבו הגוף והחומריות מאוד מרכזיים, כאן הדגש הוא על שיטוט, אובדן כיוון וגילוי.\n\nמה לשים לב\nאין מסלול נכון. אל תנסו לסמן חדרים כ-V; חזרו למקומות כי הם יכולים להשתנות. זה אחד המקומות שבהם כדאי להשאיר סקרנות במקום תוכנית קשיחה."},{"uid":"2026-12-08-1","part":"בוקר","time":"12:05–13:05","start":725,"end":785,"name":"Azabudai Hills","kind":"אטרקציה","desc":"מתחם חדש ומעוצב עם אדריכלות, אוכל, חנויות ושטחים ירוקים.","maps":"https://www.google.com/maps/search/?api=1&query=Azabudai+Hills+Japan","website":"","hop":"הליכה 1.4 ק״מ","transit":false,"info":"מה זה\nAzabudai Hills הוא פרויקט עירוני ענק שנפתח ב-2023 אחרי יותר משלושה עשורים של תכנון. הרעיון הרשמי הוא \"Modern Urban Village\" עם דגש על Green & Wellness.\n\nלמה זה חשוב\nהמתחם מציג תפיסה יפנית עכשווית של עיר צפופה: גורד שחקים גבוה מאוד, מגורים, משרדים, בתי ספר, אמנות, אוכל ושירותים — אבל גם כ-24,000 מ\"ר של שטחים ירוקים, פי כמה מהמצב שהיה לפני הפיתוח.\n\nמה לשים לב\nאחרי teamLab, צאו החוצה והסתכלו על הטופוגרפיה, הגנים והקשרים בין הבניינים. החלק המעניין הוא לא רק גובה Mori JP Tower אלא הניסיון להפוך פיתוח פרטי ל\"רחוב ושכונה\"."},{"uid":"2026-12-08-2","part":"צהריים","time":"13:25–14:35","start":805,"end":875,"name":"21_21 Design Sight","kind":"אטרקציה","desc":"מוזיאון/חלל עיצוב במתחם Tokyo Midtown שתוכנן בשיתוף Tadao Ando, עם תערוכות מתחלפות של עיצוב ותרבות.","maps":"https://www.google.com/maps/search/?api=1&query=21_21+Design+Sight+Japan","website":"","hop":"הליכה 1.1 ק״מ","transit":false,"info":"מה זה\n21_21 DESIGN SIGHT הוא מרכז לתערוכות עיצוב ב-Tokyo Midtown, שנוסד מתוך חזונו של Issey Miyake ונפתח ב-2007. האדריכל Tadao Ando תכנן את המבנה, שרובו קבור מתחת לאדמה.\n\nלמה זה חשוב\nהמקום לא מציג \"כיסאות יפים\" בלבד, אלא משתמש בעיצוב כדי להסתכל מחדש על חיי יום-יום. הגג נוצר כרעיון של יריעת פלדה אחת מקופלת, בהשראת תפיסת A Piece of Cloth של Miyake.\n\nמה לשים לב\nב-8/12/2026, לפי התוכנית הרשמית הנוכחית, מוצגת התערוכה Learning from “Hōjōki”: Tiny Architecture Reweaves Life, המבוססת על הטקסט מהמאה ה-13 ובוחנת מגורים מינימליים וחיים דרך מבנים זעירים. שימו לב גם לבניין עצמו לפני שנכנסים."},{"uid":"2026-12-08-3","part":"צהריים","time":"14:50–16:15","start":890,"end":975,"name":"Mori Art Museum","kind":"אטרקציה","desc":"מוזיאון לאמנות עכשווית בקומות העליונות של Roppongi Hills.","maps":"https://www.google.com/maps/search/?api=1&query=Mori+Art+Museum+Japan","website":"","hop":"הליכה 0.1 ק״מ","transit":false,"info":"מה זה\nMori Art Museum הוא מוזיאון לאמנות עכשווית בראש Mori Tower, שנפתח ב-2003. הוא מתמקד באמנות חזותית, אדריכלות ועיצוב עכשוויים עם דגש בינלאומי ואסייתי.\n\nלמה זה חשוב\nהמוזיאון הוקם כחלק מהרעיון של Roppongi Hills כ\"מרכז תרבותי עירוני\". המיקום שלו גבוה מעל העיר אינו מקרי: המוזיאון אמור להיות חלק מחיי העיר ולא מוסד מבודד.\n\nמה לשים לב\nהאיכות תלויה מאוד בתערוכה המתחלפת, ולכן כדאי לקרוא עליה סמוך לביקור. אל תצפו ל\"אוסף קבוע של קלאסיקות\"; זה מקום של רעיונות עכשוויים, נושאים חברתיים וניסויים חזותיים."},{"uid":"2026-12-08-4","part":"שקיעה + ערב","time":"16:20–17:10","start":980,"end":1030,"name":"Roppongi Hills","kind":"אטרקציה","desc":"מתחם עירוני עם קניות, אמנות ותצפיות.","maps":"https://www.google.com/maps/search/?api=1&query=Roppongi+Hills+Japan","website":"","hop":"הליכה 1.8 ק״מ","transit":false,"info":"מה זה\nRoppongi Hills הוא מתחם עירוני ענק שנפתח ב-2003 אחרי תהליך פיתוח של יותר מ-15 שנה. הוא כולל משרדים, מגורים, קולנוע, מסחר, מלון, מוזיאון ותצפית סביב Mori Tower.\n\nלמה זה חשוב\nהפרויקט נבנה סביב רעיון של \"Cultural Heart of the City\" — עיר אנכית שבה אמנות, עבודה, מגורים ובילוי מתקיימים יחד. הוא הפך מודל לפרויקטים מאוחרים יותר של Mori Building, כולל Azabudai Hills.\n\nמה לשים לב\nהנקודה המעניינת היא החיבור בין Mori Art Museum ו-Tokyo City View בראש המגדל לבין הרחובות, האמנות הציבורית והמרחבים הירוקים למטה."},{"uid":"2026-12-08-5","part":"שקיעה + ערב","time":"17:20–18:00","start":1040,"end":1080,"name":"נסיעה ל-Omori","kind":"מעבר","desc":"","maps":"","website":"","hop":"","transit":true},{"uid":"2026-12-08-6","part":"שקיעה + ערב","time":"18:20–19:50","start":1100,"end":1190,"name":"BOOKOFF SUPER BAZAAR SEIYU Omori Store","kind":"חנות","desc":"סניף BOOKOFF SUPER BAZAAR גדול בטוקיו עם ספרים, CD/DVD/Blu-ray, טלפונים, אלקטרוניקה, מוצרי חשמל, כלי נגינה, אופנה, כרטיסי אספנות, צעצועים, מותגים","maps":"https://www.google.com/maps/search/?api=1&query=BOOKOFF+SUPER+BAZAAR+SEIYU+Omori+Store+Tokyo+Japan","website":"","hop":"","transit":false}],"night":[{"name":"Tokyo City View","desc":"תצפית גבוהה על העיר מ-Roppongi Hills.","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+City+View+Japan"},{"name":"Tokyo Tower","desc":"המגדל האייקוני של טוקיו עם תצפיות ועיצוב רטרו.","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+Tower+Japan"}]},{"id":"2026-12-09","date":"09/12","dow":"רביעי","title":"Autumn Gardens → Ikebukuro","subtitle":"יום יציאה, מסיימים מוקדם","base":"טוקיו · טיסה 23:00","scope":["טוקיו"],"empty":false,"items":[{"uid":"2026-12-09-0","part":"בוקר","time":"09:00–10:00","start":540,"end":600,"name":"Koishikawa Korakuen","kind":"אטרקציה","desc":"אחד הגנים היפניים העתיקים בטוקיו, עם בריכות, גשרים ושלכת.","maps":"https://www.google.com/maps/search/?api=1&query=Koishikawa+Korakuen+Japan","website":"","hop":"רכבת 3.3 ק״מ","transit":false,"info":"מה זה\nKoishikawa Kōrakuen הוא אחד מגני ה-daimyo העתיקים בטוקיו. הוא החל להיבנות ב-1629 עבור ענף Mito של משפחת Tokugawa והושלם בתקופת Tokugawa Mitsukuni.\n\nלמה זה חשוב\nהגן משלב מסורות יפניות עם השפעה סינית ברורה. Mitsukuni שילב בו רעיונות של המלומד הסיני Zhu Shunshui, כולל גשר Full Moon וייצוגים של נופים סיניים. אפילו השם Kōrakuen מגיע מטקסט סיני על שליט ש\"דואג לפני העם ונהנה אחריו\".\n\nמה לשים לב\nחפשו את השילוב בין אגם מרכזי, גבעות, גשרים ומסלולים שמסתירים וחושפים את הנוף. זה גן שנועד לחוות תוך הליכה, לא מנקודת תצפית אחת."},{"uid":"2026-12-09-1","part":"בוקר","time":"10:25–11:25","start":625,"end":685,"name":"Rikugien Garden","kind":"אטרקציה","desc":"גן יפני קלאסי ומרהיב במיוחד בשלכת, לעיתים עם תאורת ערב עונתית.","maps":"https://www.google.com/maps/search/?api=1&query=Rikugien+Garden+Japan","website":"","hop":"","transit":false,"info":"מה זה\nRikugien הוא גן טיול מתקופת Edo שנבנה סביב 1702 עבור Yanagisawa Yoshiyasu, מקורב לשוגון Tokugawa Tsunayoshi. שמו ורבים מהנופים בתוכו מבוססים על מסורת שירת waka.\n\nלמה זה חשוב\nזהו לא \"טבע פראי\" אלא נוף ספרותי מתוכנן: גבעות, אגם, איים ושבילים יוצרים רמזים למקומות ולשירים. בתקופת Meiji הגן עבר למשפחת Iwasaki, מייסדי Mitsubishi, ובהמשך נתרם לעיר טוקיו.\n\nמה לשים לב\nהליכה איטית סביב האגם חשובה יותר מסימון נקודות. שימו לב לשינויי זווית ולמסגור של הנוף. חשוב: תאורת השלכת המיוחדת של 2026 מתקיימת 25/11–6/12 בלבד; בביקור שלנו ב-9/12 זהו ביקור יום רגיל."},{"uid":"2026-12-09-2","part":"בוקר","time":"11:25–11:55","start":685,"end":715,"name":"נסיעה ל-Ikebukuro","kind":"מעבר","desc":"","maps":"","website":"","hop":"","transit":true},{"uid":"2026-12-09-3","part":"צהריים","time":"12:00–13:00","start":720,"end":780,"name":"Neco Republic Ikebukuro rescue cat café","kind":"אטרקציה","desc":"בית קפה עם חתולי הצלה ואימוץ. מתאים יותר למי שמעדיף מודל עם רווחת בעלי חיים.","maps":"https://www.google.com/maps/search/?api=1&query=Neco+Republic+Ikebukuro+rescue+cat+caf%C3%A9+Japan","website":"","hop":"הליכה 0.9 ק״מ","transit":false,"info":"מה זה\nNeco Republic הוא מודל של rescue cat café: בית קפה שבו החתולים מגיעים ממערך הצלה ואימוץ, והמטרה היא לא רק בילוי אלא גם חשיפה לאימוץ ולרווחת חתולים.\n\nלמה זה חשוב\ncat cafés מזוהים מאוד עם יפן, אבל כאן יש שכבה נוספת של social enterprise. הביקור מציג איך קונספט מסחרי יכול לשמש גם לקידום הצלה ואימוץ.\n\nמה לשים לב\nיש לכבד את כללי המקום לגבי מגע, צילום והאכלה. זו חוויה שקטה יחסית, ולכן מתאימה כהפסקה בין גנים לאזור Sunshine City."},{"uid":"2026-12-09-4","part":"צהריים","time":"13:10–14:40","start":790,"end":880,"name":"Sunshine Aquarium","kind":"אטרקציה","desc":"אקווריום עירוני עם פינגווינים, לוטרות ותצוגות יצירתיות.","maps":"https://www.google.com/maps/search/?api=1&query=Sunshine+Aquarium+Japan","website":"","hop":"הליכה 0.1 ק״מ","transit":false,"info":"מה זה\nSunshine Aquarium נמצא על גג מתחם Sunshine City באיקבוקורו ונחשב לאחד האקווריומים העירוניים הגבוהים והיוצאי דופן בטוקיו.\n\nלמה זה חשוב\nהקונספט הוא \"oasis in the sky\": להביא מערכות מים וחיות אל לב אזור צפוף וגבוה. המוצג המפורסם ביותר, Penguins in the Sky, משתמש במיכל תלוי כך שהפינגווינים נראים כאילו הם שוחים מעל קו הרקיע.\n\nמה לשים לב\nהחלק החיצוני על הגג הוא מה שמבדיל אותו מאקווריומים רגילים. שימו לב לשילוב בין בעלי החיים לבין בנייני Ikebukuro ברקע."},{"uid":"2026-12-09-5","part":"צהריים","time":"14:45–15:45","start":885,"end":945,"name":"NAMJATOWN","kind":"אטרקציה","desc":"פארק indoor קטן ומשונה עם מתקנים, אוכל ודמויות.","maps":"https://www.google.com/maps/search/?api=1&query=NAMJATOWN+Japan","website":"","hop":"הליכה 0.1 ק״מ","transit":false,"info":"מה זה\nNAMJATOWN הוא פארק שעשועים מקורה של Bandai Namco בתוך Sunshine City. הוא בנוי כעולם של סמטאות ותפאורות, עם משחקים, אטרקציות, דמויות ואוכל.\n\nלמה זה חשוב\nזו דוגמה לסוג בידור יפני שאינו \"פארק ענק\" כמו Disney או USJ אלא עולם indoor קומפקטי שמערבב arcade, storytelling, character culture ותפאורה.\n\nמה לשים לב\nהחוויה תלויה מאוד באטרקציות ובשיתופי הפעולה הפעילים בזמן הביקור. אצלנו זה stop גמיש — אם האנרגיה נמוכה אפשר לקצר בלי לפגוע ביום."},{"uid":"2026-12-09-6","part":"צהריים","time":"15:50–16:20","start":950,"end":980,"name":"Pikachu Sweets by Pokémon Cafe","kind":"מסעדה / אוכל","desc":"דוכן Pokémon Café בסגנון takeaway ליד Pokémon Center MEGA TOKYO, עם משקאות וקינוחים בעיצוב Pokémon.","maps":"https://www.google.com/maps/search/?api=1&query=Pikachu+Sweets+by+Pokemon+Cafe+Sunshine+City+Japan","website":"","hop":"הליכה 0.1 ק״מ","transit":false},{"uid":"2026-12-09-7","part":"צהריים","time":"16:25–17:25","start":985,"end":1045,"name":"Pokémon Center MEGA TOKYO","kind":"אטרקציה","desc":"אחד ממרכזי Pokémon הגדולים בטוקיו, בתוך Sunshine City באיקבוקורו, עם מבחר גדול של מרצ'נדייז ומוצרים בלעדיים.","maps":"https://www.google.com/maps/search/?api=1&query=Pokemon+Center+MEGA+TOKYO+Sunshine+City+Japan","website":"","hop":"","transit":false},{"uid":"2026-12-09-8","part":"יציאה","time":"17:25–18:15","start":1045,"end":1095,"name":"חזרה למלון / איסוף מזוודות","kind":"מעבר","desc":"","maps":"","website":"","hop":"","transit":true},{"uid":"2026-12-09-9","part":"יציאה","time":"18:15","start":1095,"end":1095,"name":"יציאה לשדה התעופה","kind":"מעבר","desc":"","maps":"","website":"","hop":"","transit":true}],"night":[]}],"places":[{"id":"p_4921768b0a22","name":"Shibuya PARCO — Nintendo, Pokémon, CAPCOM, JUMP, JoJo & SEGA","city":"טוקיו","area":"Shibuya + Harajuku","status":"חובה","kind":"attraction","desc":"מרכז גיימינג ותרבות פופ מרוכז ב־6F של Shibuya PARCO. באותה קומה נמצאים Nintendo TOKYO, Pokémon Center Shibuya, CAPCOM STORE TOKYO, JUMP SHOP, THE★JOJO WORLD ו־SEGA STORE TOKYO. מומלץ להקדיש 1.5–2.5 שעות כדי לעבור בין כל החנויות, לקנות מוצרים בלעדיים ולצלם בלי להתרוצץ בין אזורים שונים.","duration":"1.5–2.5 שעות","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Shibuya+PARCO+Tokyo+Japan","booking":"","website":""},{"id":"p_d72692980dd3","name":"Shibuya Crossing","city":"טוקיו","area":"Shibuya + Harajuku","status":"רוצה","kind":"attraction","desc":"מעבר החציה האייקוני של שיבויה, מוקף במסכי ענק ומרכזי קניות.","duration":"15–30 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Shibuya+Crossing+Japan","booking":"","website":"","info":"מה זה\nמעבר החציה של שיבויה הפך לאחד הסמלים המזוהים ביותר עם טוקיו המודרנית. כאשר האור מתחלף, הולכי רגל חוצים בו-זמנית מכמה כיוונים, ולעיתים יותר מאלף איש נכנסים לצומת במחזור אחד.\n\nלמה זה חשוב\nשיבויה היא מרכז של אופנה, מוזיקה, תרבות צעירה וטרנדים, והמעבר ממחיש בצורה כמעט מושלמת את האופן שבו טוקיו יכולה להיות צפופה מאוד ובכל זאת מתפקדת בסדר ובזרימה. הוא פחות \"אטרקציה\" ויותר רגע של התבוננות בעיר עצמה.\n\nמה לשים לב\nחצו פעם אחת כחלק מהקהל ואז הסתכלו עליו גם מלמעלה. מ-SHIBUYA SKY מתקבלת התמונה הרחבה ביותר של הצומת ושל המבנה העירוני סביבו."},{"id":"p_3af3a17396e1","name":"Shibuya Sky","city":"טוקיו","area":"Shibuya + Harajuku","status":"חובה","kind":"attraction","desc":"תצפית פתוחה מעל שיבויה עם נוף 360° של טוקיו. הכי יפה לקראת שקיעה.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Shibuya+Sky+Japan","booking":"","website":"","info":"מה זה\nSHIBUYA SKY הוא מתחם תצפית בראש Shibuya Scramble Square, בגובה של כ-229 מטר מעל שיבויה. החוויה מחולקת למעבר כלפי מעלה, גלריה פנימית ותצפית גג פתוחה של 360 מעלות.\n\nלמה זה חשוב\nזה המקום שבו אפשר להבין את קנה המידה של טוקיו אחרי יום של הליכה בגובה הרחוב. מלמעלה רואים כיצד שיבויה, הרג'וקו, שינג'וקו והמרכז העירוני מתחברים לרצף עצום של בנייה ותנועה.\n\nמה לשים לב\nהגג הפתוח הוא החלק המרכזי. לקראת שקיעה אפשר לראות את העיר עוברת מאור יום למיליוני אורות. מזג אוויר ורוח יכולים להשפיע על פתיחת אזורי הגג, ולכן שווה להשאיר מעט גמישות."},{"id":"p_a58598c2bd69","name":"MEGA Don Quijote","city":"טוקיו","area":"Shibuya + Harajuku","status":"רוצה","kind":"attraction","desc":"חנות ענקית עם אוכל, קוסמטיקה, גאדג'טים, מתנות ודברים יפניים מוזרים.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=MEGA+Don+Quijote+Japan","booking":"","website":""},{"id":"p_c64d09b98edc","name":"Cat Street","city":"טוקיו","area":"Shibuya + Harajuku","status":"רוצה","kind":"attraction","desc":"רחוב אופנתי בין שיבויה להראג'וקו עם בוטיקים, קפה וחנויות מיוחדות.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Cat+Street+Japan","booking":"","website":"","info":"מה זה\nCat Street הוא ציר הולכי רגל המחבר באופן טבעי בין הרג'וקו לשיבויה. הוא פחות צבעוני וצפוף מ-Takeshita Street ויותר מזוהה עם אופנת רחוב, בוטיקים, עיצוב ובתי קפה.\n\nלמה זה חשוב\nהרחוב מדגים שלתרבות הצעירה של טוקיו יש כמה שכבות. Takeshita מייצגת את הצד הקוואי, הזול וההמוני יותר; Cat Street מציגה גרסה בוגרת, עיצובית ואורבנית יותר של אותה סצנה.\n\nמה לשים לב\nאל תתמקדו רק בחנויות. שימו לב לסמטאות הצדדיות, לחזיתות הבניינים ולאופן שבו הרחוב הופך בהדרגה מהרג'וקו לשיבויה."},{"id":"p_e70c6ae645e4","name":"Omotesando","city":"טוקיו","area":"Shibuya + Harajuku","status":"רוצה","kind":"attraction","desc":"שדרה אלגנטית עם אדריכלות, חנויות דגל ובתי קפה.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Omotesando+Japan","booking":"","website":"","info":"מה זה\nOmotesando היא שדרה רחבה ומוצלת שהייתה במקור דרך הגישה אל Meiji Jingu. כיום היא אחת משדרות האדריכלות, האופנה והעיצוב החשובות בטוקיו.\n\nלמה זה חשוב\nזהו מקום מצוין לראות כיצד טוקיו משתמשת במסחר כזירה לאדריכלות עכשווית. לאורך הרחוב נמצאים מבנים של אדריכלים בינלאומיים ויפניים, ולכן החוויה היא לא רק חנויות אלא חזיתות, חומרים, חללים וקנה מידה.\n\nמה לשים לב\nהסתכלו כלפי מעלה ולא רק לחלונות הראווה: זכוכית, בטון, גאומטריה לא רגילה ועצי ה-zelkova יוצרים שדרה מאוד שונה מ-Takeshita הסמוכה."},{"id":"p_7e208fa562af","name":"Takeshita Street","city":"טוקיו","area":"Shibuya + Harajuku","status":"רוצה","kind":"attraction","desc":"רחוב צבעוני בהראג'וקו עם אופנה צעירה, מתוקים וחנויות קטנות.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Takeshita+Street+Japan","booking":"","website":"","info":"מה זה\nTakeshita-dori הוא רחוב הולכי רגל קצר וצפוף ליד תחנת Harajuku, המזוהה במשך עשרות שנים עם אופנת צעירים, kawaii, תתי-תרבויות, קרפים, purikura וטרנדים חולפים.\n\nלמה זה חשוב\nהרג'וקו לא הפך למרכז תרבות צעירה בגלל קניונים שתכננו זאת מלמעלה. צעירים החלו להתכנס באזור וליצור סגנונות משל עצמם, והמסחר הגיע בעקבות התרבות. הרחוב הוא תוצאה של התהליך הזה.\n\nמה לשים לב\nמעבר לצפיפות, הסתכלו על לבוש, אריזות, גרפיקה ואופן הצגת המוצרים. זו דוגמה טובה לכוח של kawaii כתרבות חזותית ולא רק כמשהו \"חמוד\"."},{"id":"p_6b26a3271a88","name":"Meiji Jingu Shrine","city":"טוקיו","area":"Shibuya + Harajuku","status":"חובה","kind":"attraction","desc":"מקדש שינטו חשוב בתוך יער גדול ושקט בלב טוקיו.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Meiji+Jingu+Japan","booking":"","website":"","info":"מה זה\nMeiji Jingu הוא מקדש שינטו שהוקם ב-1920 ומוקדש לקיסר Meiji ולקיסרית Shōken. הקיסר Meiji מזוהה עם התקופה שבה יפן עברה משלטון פיאודלי למדינה מודרנית ומתועשת.\n\nלמה זה חשוב\nהיער סביב המקדש נראה עתיק וטבעי, אבל הוא תוכנן וניטע במיוחד לקראת הקמת המקדש. כ-100,000 עצים נתרמו מכל רחבי יפן, והמתכננים בנו \"יער של העתיד\" שאמור היה להתחדש בעצמו במשך מאות שנים. לכן זה לא מקדש עתיק בתוך יער עתיק, אלא יצירה מודרנית המשתמשת בשפה של מסורת עתיקה.\n\nמה לשים לב\nהמעבר דרך שערי ה-torii מסמן מעבר מהעיר למרחב קדוש. חפשו גם את חביות הסאקה ואת חביות היין הצרפתי: יחד הן יוצרות סמל יפה לתקופת Meiji — קליטת השפעות מערביות בלי לוותר על זהות יפנית. במקדש עצמו כדאי להתבונן בטקסי הטהרה, הקידה, המנחה והתפילה ולא להרגיש שחייבים לבצע הכול."},{"id":"p_fec2263640bb","name":"Yoyogi Park","city":"טוקיו","area":"Shibuya + Harajuku","status":"רוצה","kind":"attraction","desc":"פארק גדול ונעים ליד Meiji Jingu, טוב להפסקה ירוקה.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Yoyogi+Park+Japan","booking":"","website":"","info":"מה זה\nYoyogi Park הוא אחד הפארקים העירוניים הגדולים במרכז טוקיו. לפני שהפך לפארק, השטח שימש בין היתר בסיס אימונים צבאי, לאחר המלחמה את מתחם Washington Heights האמריקאי, ובאולימפיאדת טוקיו 1964 חלקים ממנו שימשו ככפר האולימפי.\n\nלמה זה חשוב\nהפארק מציג שכבה אחרת לגמרי של טוקיו: לא גן יפני מעוצב ולא אתר דתי, אלא מרחב ציבורי שבו תושבים נפגשים, מתאמנים, רוקדים, עושים פיקניק ומציגים תת-תרבויות שונות.\n\nמה לשים לב\nהחוויה כאן היא בעיקר people-watching. בסופי שבוע במיוחד אפשר לפגוש קבוצות ריקוד, מוזיקאים ואנשים עם תחביבים יוצאי דופן. אצלנו זו עצירה ירוקה וקלה בין Meiji Jingu להרג'וקו."},{"id":"p_5f0b3c6d23e4","name":"Reissue 3D Latte Art","city":"טוקיו","area":"Shibuya + Harajuku","status":"רוצה","kind":"food","desc":"בית קפה מפורסם בלאטה-ארט תלת-ממדי שמצויר לפי בקשה.","duration":"45–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Reissue+3D+Latte+Art+Japan","booking":"","website":""},{"id":"p_190b1ed4a6be","name":"Aoyama","city":"טוקיו","area":"Shibuya + Harajuku","status":"אולי","kind":"attraction","desc":"המשך טבעי מ-Omotesando: אדריכלות, אופנה, רחובות מעוצבים ובתי קפה. מתאים להליכה בדרך לשיבויה.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Aoyama+Japan","booking":"","website":"","info":"מה זה\nAoyama היא שכונה אלגנטית ליד Omotesando, המזוהה עם אדריכלות, גלריות, עיצוב, מסעדות ובוטיקים. היא מרגישה רגועה ובוגרת יותר משיבויה והרג'וקו הסמוכות.\n\nלמה זה חשוב\nהאזור מדגים צד של טוקיו שבו תרבות עכשווית נוצרת דרך אדריכלות, עיצוב ופרטים קטנים ולא דרך שלטי ניאון. GO TOKYO מגדיר את Aoyama/Omotesando כאחד האזורים הבולטים בעיר לאמנות ואדריכלות.\n\nמה לשים לב\nאם עוברים באזור, כדאי להתייחס אליו כהליכת רחוב: מבנים, סמטאות, חזיתות, חללים ירוקים וקצב עירוני שונה — לא כרשימת חנויות."},{"id":"hotel_shibuya_stream","name":"Shibuya STREAM HOTEL","city":"טוקיו","area":"Shibuya + Harajuku","status":"אולי","kind":"hotel","desc":"מלון 4★ במיקום מרכזי מאוד בשיבויה, צמוד לאזור Shibuya Stream ובמרחק הליכה קצר מ-Shibuya Station. בחירה נוחה במיוחד אם רוצים לישון בתוך מרכז הפעילות של שיבויה.","duration":"לינה","note":"המלצת מלון 4★ · מיקום מרכזי","maps":"https://www.google.com/maps/search/?api=1&query=Shibuya+STREAM+HOTEL+Tokyo+Japan","booking":"https://www.booking.com/hotel/jp/shibuya-stream-excel-tokyu.html","website":""},{"id":"hotel_hyatt_house_shibuya","name":"Hyatt House Tokyo Shibuya","city":"טוקיו","area":"Shibuya + Harajuku","status":"אולי","kind":"hotel","desc":"מלון 4★ בשיבויה, מרכזי מאוד ונוח לטיול רגלי באזור Shibuya/Harajuku. אופציה טובה אם חשובים חדרים מרווחים יותר ומיקום חזק.","duration":"לינה","note":"המלצת מלון 4★ · Shibuya","maps":"https://www.google.com/maps/search/?api=1&query=Hyatt+House+Tokyo+Shibuya+Japan","booking":"https://www.booking.com/hotel/jp/hyatt-house-tokyo-shibuya.html","website":""},{"id":"food_shunju_shibuya","name":"Shunju Shibuya Bunkamuradori","city":"טוקיו","area":"Shibuya + Harajuku","status":"רוצה","kind":"food","desc":"מסעדה שמתאימה טוב לזוג עם העדפות שונות: יש אפשרויות רגילות לאוכל כללי ובמקביל אפשרות טבעונית/צמחונית שמוצהר עליה ללא fish stock.","duration":"60–90 דק׳","note":"לצמחונית: לבקש ללא בשר, דגים, פירות ים ו-dashi על בסיס דגים.","maps":"https://www.google.com/maps/search/?api=1&query=Shunju+Shibuya+Bunkamuradori+Tokyo","booking":"","website":"http://shunju.com/shibuya"},{"id":"p_1f01628dcb82","name":"ALPAKA Harajuku Harakado","city":"טוקיו","area":"Shibuya + Harajuku","status":"חובה","kind":"shop","desc":"חנות ALPAKA ב־2F של Tokyu Plaza Harajuku “Harakado”. תיקים, EDC ואביזרי נשיאה. שעות פתיחה: 11:00–21:00.","duration":"30–40 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=ALPAKA+Tokyu+Plaza+Harajuku+Harakado+Tokyo","booking":"","website":"https://www.alpakagear.jp/"},{"id":"p_a683417402d9","name":"Shinjuku Gyoen","city":"טוקיו","area":"Shinjuku","status":"חובה","kind":"attraction","desc":"גן ענק עם גנים יפניים, מדשאות ועצי שלכת. אחד המקומות היפים בסתיו.","duration":"1.5–2.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Shinjuku+Gyoen+Japan","booking":"","website":"","info":"מה זה\nShinjuku Gyoen הוא אחד הגנים העירוניים החשובים בטוקיו. ההיסטוריה שלו מתחילה באחוזת משפחת Naito מתקופת Edo, ממשיכה בתחנת ניסויים חקלאית של ממשלת Meiji, גן בוטני קיסרי, גן קיסרי ולבסוף גן לאומי שנפתח לציבור ב-1949.\n\nלמה זה חשוב\nהגן הוא מעין מפה פיזית של המודרניזציה היפנית. במקום אחד נפגשים גן יפני מסורתי, גן צרפתי פורמלי וגן נוף אנגלי. השילוב ממחיש כיצד יפן אימצה רעיונות מערביים בלי למחוק את המסורת המקומית.\n\nמה לשים לב\nהתמקדו בגן היפני, בבריכות, בגשרים וב-Kyu-Goryo-Tei, ואז השוו למבנה הסימטרי של הגן הצרפתי ולמדשאות האנגליות. בסוף נובמבר העלים המשתנים והניגוד בין עצים לגורדי השחקים הם חלק מרכזי מהחוויה."},{"id":"p_7fc78f62377c","name":"Tokyo Metropolitan Government Observatory","city":"טוקיו","area":"Shinjuku","status":"רוצה","kind":"attraction","desc":"תצפית חינמית מגובה רב על טוקיו.","duration":"45–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+Metropolitan+Government+Observatory+Japan","booking":"","website":"","info":"מה זה\nבניין ממשלת מטרופולין טוקיו בשינג'וקו תוכנן על ידי האדריכל Kenzo Tange. התצפיות במגדלים נמצאות בקומה ה-45, בגובה של כ-202 מטר, והכניסה אליהן חופשית.\n\nלמה זה חשוב\nזהו מבט עירוני שונה מ-SHIBUYA SKY. כאן אתם נמצאים במרכז אזור גורדי השחקים של מערב שינג'וקו, בתוך בניין ממשלתי שמייצג את שאיפות הבנייה של טוקיו בסוף המאה ה-20.\n\nמה לשים לב\nביום בהיר ניתן לראות מרחק רב מאוד, ולעיתים גם את הר פוג'י. בערב חזית הבניין משמשת גם למופע projection mapping בשם Tokyo Night & Light. אצלנו זו תצפית חינמית ומשלימה, לא תחליף ל-SHIBUYA SKY."},{"id":"p_208f559c06c5","name":"3D Cat Billboard","city":"טוקיו","area":"Shinjuku","status":"רוצה","kind":"attraction","desc":"מסך תלת-ממדי מפורסם עם חתול ענק ליד תחנת שינג'וקו.","duration":"10–15 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=3D+Cat+Billboard+Japan","booking":"","website":"","info":"מה זה\nמסך ה-3D Cat ליד יציאת East של Shinjuku Station הוא דוגמה מפורסמת לפרסום אנמורפי: האנימציה מותאמת לזווית הצפייה כך שהחתול נראה כאילו הוא יושב בתוך חלל תלת-ממדי ויוצא ממנו.\n\nלמה זה חשוב\nזהו לא אתר היסטורי אלא רגע קטן שמראה עד כמה פרסום, אנימציה, מסכים ותרבות דמויות נטמעים ברחוב היפני. הוא הפך לסמל עכשווי של שינג'וקו בדיוק משום שהוא משתמש בבניין עצמו כחלק מהאשליה.\n\nמה לשים לב\nעמדו בזווית הרחוב שממנה המסך נראה \"עמוק\". האנימציות מתחלפות, ולכן החוויה קצרה; אין צורך לבנות סביבה ביקור ארוך."},{"id":"p_8a8d7e75cc62","name":"Godzilla Head","city":"טוקיו","area":"Shinjuku","status":"רוצה","kind":"attraction","desc":"ראש גודזילה ענק על מלון Gracery באזור Kabukicho.","duration":"15–30 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Godzilla+Head+Japan","booking":"","website":"","info":"מה זה\nראש Godzilla הענק נמצא מעל מתחם Toho Cinemas/Hotel Gracery בקבוקיצ'ו. הוא הוצב כחלק ממיתוג המתחם סביב אחת הדמויות המזוהות ביותר עם הקולנוע היפני.\n\nלמה זה חשוב\nGodzilla נולד בקולנוע היפני של שנות ה-50 והפך הרבה מעבר למפלצת קולנועית: הוא קשור לחרדות של העידן האטומי, להרס עירוני, לטכנולוגיה ולתרבות הפופ היפנית. לראות אותו מעל רחובות שינג'וקו מחבר בין הקולנוע לבין העיר שבה הדמות שוב ושוב \"הרסה\" את טוקיו על המסך.\n\nמה לשים לב\nהחוויה כאן היא בעיקר הרחוב והקנה מידה. בלילה התאורה והבניינים מסביב הופכים את הראש לחלק טבעי מקו הרקיע של Kabukicho."},{"id":"p_a2f5862d9e12","name":"Tokyu Kabukicho Tower","city":"טוקיו","area":"Shinjuku","status":"רוצה","kind":"attraction","desc":"מתחם בילוי עם אוכל, משחקים, אירועים וחיי לילה.","duration":"1–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tokyu+Kabukicho+Tower+Japan","booking":"","website":"","info":"מה זה\nTokyu Kabukicho Tower הוא מגדל בידור שנפתח ב-2023 ומתנשא לכ-225 מטר. הוא משלב מלונות, קולנוע, תיאטרון, הופעות, אוכל ואמנות בתוך אחד מאזורי הלילה הצפופים ביותר בטוקיו.\n\nלמה זה חשוב\nהפרויקט נבנה סביב הרעיון של \"להעמיק במה שאתה אוהב\" ומנסה להפוך את Kabukicho ממקום של חיי לילה בלבד למרכז תרבות ובידור. גם האמנות המוזמנת בבניין מתייחסת לזיכרונות ולהיסטוריה של השכונה.\n\nמה לשים לב\nאל תתייחסו אליו כקניון. כדאי לראות את חללי הבידור, האמנות והאדריכלות ולחשוב על הניגוד בין המגדל החדש לסמטאות הישנות של Golden Gai ו-Omoide Yokocho."},{"id":"p_dccbcb1531f3","name":"Omoide Yokocho","city":"טוקיו","area":"Shinjuku","status":"רוצה","kind":"attraction","desc":"סמטאות קטנות וצפופות עם יקיטורי ואווירת טוקיו ישנה.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Omoide+Yokocho+Japan","booking":"","website":"","info":"מה זה\nOmoide Yokocho הוא מקבץ סמטאות זעירות ליד ה-West Exit של Shinjuku Station. שורשיו בשוק הפתוח שנוצר על חורבות טוקיו מיד אחרי מלחמת העולם השנייה.\n\nלמה זה חשוב\nהיום נותרו בו עשרות ברים ומסעדות קטנות, וחלק גדול מהקסם הוא בקנה המידה: דלפקים צפופים, עשן, פנסים, מטבחים כמעט על הרחוב. זהו שריד חי של שינג'וקו מתקופת Showa בתוך אזור שעבר בנייה מחדש בקנה מידה עצום.\n\nמה לשים לב\nגם בלי לאכול, עצם ההליכה בסמטאות שווה. בגלל התפריטים הבשריים מאוד, אצלנו זה בעיקר אתר אווירה ולא יעד ארוחה לצמחוני."},{"id":"p_027c44d6b4fc","name":"Golden Gai","city":"טוקיו","area":"Shinjuku","status":"רוצה","kind":"attraction","desc":"אזור ברים זעירים וסמטאות לילה מפורסמות.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Golden+Gai+Japan","booking":"","website":"","info":"מה זה\nGolden Gai הוא אזור של שש סמטאות צפופות ובהן מאות ברים זעירים, רבים מהם עם מספר קטן מאוד של מושבים. צורת הרחובות והמבנים נשמרה באופן חריג ביחס לשינג'וקו המודרנית.\n\nלמה זה חשוב\nשורשי האזור מגיעים לשנים שאחרי מלחמת העולם השנייה, והוא שומר על תחושת טוקיו של שנות ה-50 לפני גל הבנייה והמודרניזציה המואץ. במשך השנים הוא נקשר גם לעולם האמנות, הקולנוע והספרות.\n\nמה לשים לב\nזו חוויית לילה ואווירה, לא \"אטרקציה\" קלאסית. חלק מהברים מיועדים לקבועים בלבד ואחרים מקבלים תיירים; יש לכבד איסורי צילום, עישון ושתייה ברחוב."},{"id":"p_69152dbe3158","name":"Isetan Shinjuku","city":"טוקיו","area":"Shinjuku","status":"אולי","kind":"attraction","desc":"כלבו יפני קלאסי; קומת האוכל וה-gourmet basement היא האטרקציה העיקרית ומתאימה לפתיחת היום לפני Shinjuku Gyoen.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Isetan+Shinjuku+Japan","booking":"","website":""},{"id":"p_5762610a0e09","name":"ASICS FLAGSHIP SHINJUKU","city":"טוקיו","area":"Shinjuku","status":"רוצה","kind":"shop","desc":"חנות הדגל הרשמית של ASICS בשינג'וקו, 4 קומות וכ־605 מ״ר. כתובת: 3-17-5 Shinjuku, Shinjuku-ku, Tokyo 160-0022. שעות פתיחה: 11:00–20:00.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=ASICS+FLAGSHIP+SHINJUKU+3-17-5+Shinjuku+Tokyo","booking":"","website":"https://www.asics.com/jp/ja-jp/mk/asics-flagship-shinjuku"},{"id":"p_ef60b433ce43","name":"Senso-ji","city":"טוקיו","area":"Asakusa + Kappabashi","status":"חובה","kind":"attraction","desc":"המקדש הבודהיסטי המפורסם באסאקוסה, עם שערים מרשימים ואווירה מסורתית.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Senso-ji+Japan","booking":"","website":"","info":"מה זה\nSensō-ji הוא המקדש הבודהיסטי העתיק ביותר בטוקיו ומוקדש ל-Kannon, הבודהיסטווה של החמלה. לפי המסורת, בשנת 628 שני דייגים משו פסל של Kannon מנהר Sumida; ראש הכפר הפך את ביתו למקום תפילה וב-645 נבנה אולם המקדש.\n\nלמה זה חשוב\nהסיפור של Sensō-ji הוא גם הסיפור של Asakusa. זרם עולי הרגל יצר סביב המקדש מסחר, אוכל, מופעים ובתי מלאכה — כלומר, המרכז הדתי עזר לבנות את העיר שסביבו. הדמות הקדושה הראשית היא hibutsu, \"בודהה נסתר\", ולכן המאמינים אינם רואים את הפסל שעליו נבנה כל האתר.\n\nמה לשים לב\nשימו לב לריח הקטורת, לטקסי הטהרה, לאולם המרכזי ולפגודה. המבנים הנוכחיים הם ברובם שחזורים שלאחר מלחמת העולם השנייה — תזכורת לכך שביפן המשכיות של מקום וטקס יכולה להיות חשובה לא פחות מהחומר המקורי."},{"id":"p_386647abeb53","name":"Kaminarimon","city":"טוקיו","area":"Asakusa + Kappabashi","status":"רוצה","kind":"attraction","desc":"שער הרעם האייקוני בכניסה ל-Senso-ji.","duration":"10–20 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kaminarimon+Japan","booking":"","website":"","info":"מה זה\nKaminarimon, \"שער הרעם\", הוא השער החיצוני המפורסם של Sensō-ji. לפי המקדש, השער נבנה לראשונה בשנת 942. פסלי Fūjin, אל הרוח, ו-Raijin, אל הרעם, מגינים על הכניסה.\n\nלמה זה חשוב\nהשער אינו רק רקע לצילום. הוא מסמן מעבר מהעיר למסלול העלייה לרגל אל המקדש ומציג כיצד בודהיזם יפני השתלב לאורך הדורות עם דמויות וכוחות טבע ממסורות שונות.\n\nמה לשים לב\nהפנס האדום הענק הוא הסמל המזוהה ביותר עם Asakusa. השער הנוכחי נבנה מחדש ב-1960 לאחר שהקודם נשרף במאה ה-19."},{"id":"p_656904250ddc","name":"Nakamise Street","city":"טוקיו","area":"Asakusa + Kappabashi","status":"רוצה","kind":"attraction","desc":"רחוב קניות מסורתי בין Kaminarimon ל-Senso-ji, עם מזכרות וממתקים.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Nakamise+Street+Japan","booking":"","website":"","info":"מה זה\nNakamise הוא רחוב הגישה המסחרי שבין Kaminarimon ל-Sensō-ji, ונחשב לאחד מרחובות המסחר העתיקים ביפן. שורשיו בתקופת Edo, כאשר מי שסייעו בשירותי המקדש קיבלו זכות להפעיל דוכנים לאורך הדרך.\n\nלמה זה חשוב\nזהו דוגמה ברורה לקשר בין עלייה לרגל למסחר: אנשים באו למקדש, ולכן נוצרה סביבם כלכלה של תה, מתוקים, צעצועים, מזכרות ועבודות יד. כך דת, עיר ומסחר הפכו למערכת אחת.\n\nמה לשים לב\nמעבר למזכרות, חפשו ningyō-yaki, rice crackers, wagashi ומלאכות מסורתיות. הרחוב צפוף מאוד, ולכן עדיף להתייחס אליו כמעבר איטי לכיוון המקדש ולא כמשימת קניות."},{"id":"p_ca552bc36394","name":"Kappabashi Street","city":"טוקיו","area":"Asakusa + Kappabashi","status":"רוצה","kind":"attraction","desc":"רחוב כלי המטבח של טוקיו: סכינים, כלי קרמיקה ודגמי אוכל מפלסטיק.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kappabashi+Street+Japan","booking":"","website":"","info":"מה זה\nKappabashi Dougu Street הוא רחוב המתמחה בציוד למסעדות ומטבחים. סוחרי כלים החלו להתרכז באזור בראשית המאה ה-20, וכיום הרחוב באורך כ-800 מטר כולל יותר מ-170 עסקים.\n\nלמה זה חשוב\nזה אחד המקומות הטובים להבין שהאוכל היפני הוא גם תעשייה של מלאכה מדויקת: סכינים, כלי חרס, לכה, תבניות, שילוט, וילונות noren ודגמי אוכל מפלסטיק. הרחוב חושף את התשתית שמאחורי המסעדה היפנית.\n\nמה לשים לב\nגם בלי לקנות, הסתכלו על סכיני המטבח ועל דגמי המזון הריאליסטיים. לשם Kappabashi יש אגדות שונות, כולל סיפור על kappa שעזרו בחפירת תעלות ניקוז — ולכן דמויות kappa מופיעות ברחוב."},{"id":"p_30fa14841797","name":"Hat Coffee / 3D Foam Art","city":"טוקיו","area":"Asakusa + Kappabashi","status":"רוצה","kind":"food","desc":"קפה באסאקוסה עם קצף תלת-ממדי בעיצובים מיוחדים.","duration":"45–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Hat+Coffee+%2F+3D+Foam+Art+Japan","booking":"","website":""},{"id":"p_7abbe0abd0e8","name":"Sumida River","city":"טוקיו","area":"Asakusa + Kappabashi","status":"רוצה","kind":"attraction","desc":"נהר סומידה עובר לצד Asakusa ונותן נקודות תצפית יפות לכיוון Skytree ו-Asahi Beer Hall. מתאים להליכה קצרה או שיט.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Sumida+River+Japan","booking":"","website":"","info":"מה זה\nנהר Sumida עובר לצד Asakusa ונשפך למפרץ טוקיו. הוא היה נתיב תחבורה, מסחר, דיג וחיבור למפרץ עוד לפני שטוקיו הפכה למטרופולין המודרני.\n\nלמה זה חשוב\nהנהר מחבר ישירות לסיפור Sensō-ji, משום שלפי המסורת פסל Kannon נמצא בו בשנת 628. מעבר לממד הדתי, נתיבי המים היו חיוניים לצמיחתה של Edo כעיר ענקית.\n\nמה לשים לב\nמהטיילת אפשר לראות את Asahi Beer Hall, Tokyo Skytree וגשרים שונים. אחרי הרחובות הצפופים של Asakusa, הנהר נותן פתאום תחושת מרחב ומראה את העיר מזווית אחרת."},{"id":"p_d61087502c85","name":"Asahi Beer Hall","city":"טוקיו","area":"Asakusa + Kappabashi","status":"אולי","kind":"attraction","desc":"מבנה אדריכלי אייקוני ליד נהר סומידה, מזוהה עם הפסל המוזהב שעל הגג. עצירה קצרה וצילום בדרך ל-Skytree.","duration":"15–30 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Asahi+Beer+Hall+Japan","booking":"","website":"","info":"מה זה\nמתחם Asahi ליד נהר Sumida מזוהה במיוחד עם האלמנט הזהוב הגדול שעל גג Asahi Super Dry Hall, שעוצב על ידי Philippe Starck.\n\nלמה זה חשוב\nהבניין הוא דוגמה לאופן שבו טוקיו מאמצת אדריכלות וסמליות מסחרית כנקודת ציון עירונית. הצורה הזהובה הפכה לאחד הפרטים המזוהים ביותר בקו הרקיע של Asakusa.\n\nמה לשים לב\nהזווית הטובה ביותר היא מעבר לנהר או מאזור Azumabashi. יחד עם Tokyo Skytree היא יוצרת ניגוד מוחלט ל-Sensō-ji המסורתי שנמצא דקות הליכה משם."},{"id":"p_akihabara_retro_game_shopping","name":"Akihabara Retro Game Shopping — Surugaya, Trader, Super Potato, Sofmap, Jan-gle, Retro Game Camp & BOOKOFF","city":"טוקיו","area":"Akihabara","status":"חובה","kind":"shop","desc":"מסלול קניות רטרו וגיימינג בתוך Akihabara. כל החנויות נמצאות באותו אזור הליכה, אבל לא באותו בניין.\n\n• Surugaya (駿河屋) — כמה סניפים באזור. Akihabara Station Store ליד התחנה; Akihabara Game Store ממוקד יותר בגיימינג ורטרו.\n• Trader Akihabara Honten (トレーダー) — חנות יד שנייה וגיימינג מוכרת באזור.\n• Super Potato Akihabara — חנות רטרו אייקונית עם מבחר גדול מאוד; לרוב יקרה יותר אבל כיפית לשיטוט.\n• Sofmap AKIBA Amusement — משחקי קונסולה חדשים ויד שנייה, לצד הובי, figures ואנימה.\n• Jan-gle Akihabara — יד שנייה של משחקים, קונסולות, מחשבים, טלפונים וגאדג'טים.\n• Retro Game Camp — חנות רטרו עם Famicom, Super Famicom, N64, PlayStation, Saturn ועוד.\n• BOOKOFF Akihabara Eki-mae — ליד התחנה; יד שנייה עם משחקים, מדיה, אלקטרוניקה ו-TCG.","duration":"3–5 שעות","note":"מומלץ לעשות את כולן כבלוק אחד של Akihabara: להתחיל ליד התחנה ב-BOOKOFF / Surugaya Station Store, להמשיך לכיוון Chuo-dori ולסיים באזור Super Potato / Retro Game Camp / Sofmap.","maps":"https://www.google.com/maps/search/?api=1&query=Akihabara+retro+game+stores+Tokyo+Japan","booking":"","website":""},{"id":"p_28a61513471b","name":"Mandarake Complex","city":"טוקיו","area":"Akihabara","status":"רוצה","kind":"attraction","desc":"בניין רב קומות לאספנות, מנגה, אנימה, צעצועים ופריטי וינטג׳.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Mandarake+Complex+Japan","booking":"","website":""},{"id":"p_7199c1652ee4","name":"Radio Kaikan","city":"טוקיו","area":"Akihabara","status":"רוצה","kind":"attraction","desc":"בניין מלא בחנויות figures, cards, anime ותחביבים.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Radio+Kaikan+Japan","booking":"","website":""},{"id":"p_0505b23231b6","name":"GiGO Arcades","city":"טוקיו","area":"Akihabara","status":"רוצה","kind":"attraction","desc":"משחקיות יפניות עם claw machines, rhythm games ועוד.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=GiGO+Arcades+Japan","booking":"","website":"","info":"מה זה\nGiGO מייצגת את תרבות ה-game center היפנית: קומות של crane games, rhythm games, racing, fighting, photo booths ומשחקי ארקייד שאינם בהכרח נפוצים מחוץ ליפן.\n\nלמה זה חשוב\nAkihabara מזוהה עם אלקטרוניקה, anime ו-otaku, אבל הארקייד הוא החלק הפעיל והחברתי של התרבות הזו. המותג GiGO ירש בשנים האחרונות רבים מהסניפים שהיו מזוהים בעבר עם SEGA.\n\nמה לשים לב\nאל תישארו רק ב-crane games בקומה הראשונה. הקומות העליונות בדרך כלל מעניינות יותר לחובבי משחקי קצב וארקייד יפני. זו חוויה של צליל, אור וקצב לא פחות ממשחק."},{"id":"p_f95ddf35c266","name":"Yodobashi Akiba","city":"טוקיו","area":"Akihabara","status":"רוצה","kind":"attraction","desc":"כלבו ענק של אלקטרוניקה, צילום, מחשבים וגאדג'טים.","duration":"60–120 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Yodobashi+Akiba+Japan","booking":"","website":""},{"id":"p_0ec86a8c9e36","name":"Kanda Myojin","city":"טוקיו","area":"Akihabara","status":"רוצה","kind":"attraction","desc":"מקדש שינטו ליד Akihabara, פופולרי גם בקרב קהילת הטכנולוגיה.","duration":"30–45 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kanda+Myojin+Japan","booking":"","website":"","info":"מה זה\nKanda Myojin הוא מקדש שינטו עתיק שמייחס את הקמתו לשנת 730. בתקופת Edo הוא הפך למקדש מגן מרכזי של העיר, והיה קשור גם לבית Tokugawa.\n\nלמה זה חשוב\nהמיקום שלו ליד Akihabara יצר חיבור יוצא דופן בין מסורת לטכנולוגיה. כיום אנשי עסקים, תושבים ואפילו חברות טכנולוגיה מגיעים לבקש ברכה להצלחה, והופיעו בו גם omamori וקמעות הקשורים למחשבים ואלקטרוניקה.\n\nמה לשים לב\nחשוב לראות את הניגוד: כמה דקות מארקיידים ואנימה, ואתם בתוך מקדש עם מאות שנות היסטוריה. זה אחד המקומות הטובים להבין שטוקיו לא מחלקת \"ישן\" ו\"חדש\" לאזורים נפרדים."},{"id":"p_05b3c2408b26","name":"Maid Café experience","city":"טוקיו","area":"Akihabara","status":"אולי","kind":"attraction","desc":"בתי קפה קונספטואליים הם חלק מהתרבות של Akihabara. אפשר לבחור אחד איכותי אם מסקרן אתכם לחוות את הצד הייחודי של השכונה.","duration":"45–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Maid+Caf%C3%A9+experience+Japan","booking":"","website":"","info":"מה זה\nMaid cafés הם בתי קפה תיאטרליים שנולדו מתוך תרבות ה-otaku של Akihabara. הצוות לבוש בדמויות \"maid\" ומבצע טקסי הגשה, משחקים ושפה מוגזמת שמדמה עולם פנטזיה.\n\nלמה זה חשוב\nזו פחות חוויית אוכל ויותר performance culture. היא מדגימה איך anime, role-play, שירות ותיירות התערבבו לכדי ז'אנר בילוי יפני ייחודי.\n\nמה לשים לב\nהחוויה מאוד ממוסחרת בכוונה; זה חלק מהעניין. כדאי להבין מראש כללי צילום, minimum order ותשלום על פעילויות נוספות. לא כל מקום מתאים לכל אחד, ולכן זה אופציונלי."},{"id":"p_a28928d6f1bd","name":"Karaoke / Japanese arcade experience","city":"טוקיו","area":"Akihabara","status":"אולי","kind":"attraction","desc":"חוויה יפנית קלאסית של karaoke או arcade מעבר לשופינג בגיימינג.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Karaoke+%2F+Japanese+arcade+experience+Japan","booking":"","website":"","info":"מה זה\nKaraoke ביפן מתרחש בדרך כלל בחדר פרטי לקבוצה קטנה ולא על במה מול קהל. יחד עם game centers הוא חלק מחיי הבילוי היומיומיים של צעירים ומבוגרים בערים.\n\nלמה זה חשוב\nשתי החוויות מציגות צד פחות \"תיירותי\" ויותר שימושי של התרבות העירונית: בילוי אחרי עבודה, עם חברים או לבד. ביפן גם solo karaoke הוא דבר מקובל.\n\nמה לשים לב\nאם עושים karaoke, כדאי להזמין שעה אחת ולא להפוך את הערב כולו לזה. בארקייד נסו משחקים שאין בבית — rhythm, taiko או מכונות יפניות ייחודיות."},{"id":"p_bic_camera_akiba","name":"Bic Camera AKIBA","city":"טוקיו","area":"Akihabara","status":"רוצה","kind":"attraction","desc":"חנות אלקטרוניקה ענקית באקיהברה עם מצלמות, גאדג'טים, קונסולות, משחקים, אביזרים, מוצרי חשמל ומבחר גדול של מוצרים יפניים.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Bic+Camera+AKIBA+Tokyo+Japan","booking":"","website":""},{"id":"p_kotobukiya_akihabara","name":"Kotobukiya Akihabara","city":"טוקיו","area":"Akihabara","status":"רוצה","kind":"attraction","desc":"חנות גדולה של דמויות, מודלים, אנימה, גיימינג ומרצ'נדייז. חזקה במיוחד ב-collectibles, figures ומוצרים בלעדיים.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kotobukiya+Akihabara+Tokyo+Japan","booking":"","website":""},{"id":"p_eb527edeaba2","name":"Unicorn Gundam","city":"טוקיו","area":"Odaiba","status":"רוצה","kind":"attraction","desc":"פסל Unicorn Gundam ענק מול DiverCity עם מופעי תאורה בזמנים מסוימים.","duration":"20–30 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Unicorn+Gundam+Japan","booking":"","website":"","info":"מה זה\nפסל Unicorn Gundam מחוץ ל-DiverCity הוא דגם כמעט בגודל \"אמיתי\" של ה-mobile suit מסדרת Gundam, בגובה כ-19.7 מטר.\n\nלמה זה חשוב\nGundam, שהחל ב-1979, היה משמעותי בהתפתחות ז'אנר ה-\"real robot\": רובוטים כטכנולוגיה צבאית מורכבת ולא רק גיבורי-על ענקיים. מאז הפך למערכת עצומה של anime, design, models, games ומוצרים.\n\nמה לשים לב\nהפסל מחבר תרבות פופ למרחב הציבורי בקנה מידה אדריכלי. בשעות מסוימות יש תאורה ושינויי תצורה, ולכן שווה לבדוק את לוח התצוגות באותו יום."},{"id":"p_c42e1561fc9e","name":"DiverCity Tokyo Plaza","city":"טוקיו","area":"Odaiba","status":"רוצה","kind":"attraction","desc":"קניון גדול עם Gundam Base, אופנה, אוכל ובידור.","duration":"1–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=DiverCity+Tokyo+Plaza+Japan","booking":"","website":""},{"id":"p_7df5e0b09679","name":"Gundam Base Tokyo","city":"טוקיו","area":"Odaiba","status":"רוצה","kind":"attraction","desc":"חנות ומתחם Gundam גדול עם דגמים ותצוגות.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Gundam+Base+Tokyo+Japan","booking":"","website":""},{"id":"p_5d705cb8bf99","name":"Tokyo Joypolis","city":"טוקיו","area":"Odaiba","status":"חובה","kind":"attraction","desc":"פארק indoor של SEGA עם מתקנים, משחקי VR וחוויות אינטראקטיביות.","duration":"2–4 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+Joypolis+Japan","booking":"","website":"","info":"מה זה\nTokyo Joypolis הוא פארק שעשועים מקורה באודאיבה המשלב מתקנים פיזיים, משחקי וידאו, חוויות אינטראקטיביות ואלמנטים דיגיטליים.\n\nלמה זה חשוב\nהוא מראה כיצד תעשיית המשחקים היפנית חיברה במשך שנים בין arcade לבין amusement park. זו חוויה מאוד \"יפן עירונית\": טכנולוגיה, רעש, תאורה ומתקנים בתוך בניין ולא פארק חיצוני.\n\nמה לשים לב\nהוא מתאים במיוחד אם מזג האוויר גרוע או אם נשאר כוח בערב. אין חובה לעשות את כל המתקנים; אפשר להיכנס ולבחור רק חוויות שמעניינות אתכם."},{"id":"p_81964c659a9f","name":"DECKS Tokyo Beach","city":"טוקיו","area":"Odaiba","status":"רוצה","kind":"attraction","desc":"מרכז קניות ובידור על קו המים.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=DECKS+Tokyo+Beach+Japan","booking":"","website":""},{"id":"p_40052b920664","name":"Odaiba Seaside Park","city":"טוקיו","area":"Odaiba","status":"רוצה","kind":"attraction","desc":"טיילת ונוף יפה למפרץ, Rainbow Bridge וטוקיו.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Odaiba+Seaside+Park+Japan","booking":"","website":"","info":"מה זה\nOdaiba Seaside Park הוא פארק חוף על מפרץ טוקיו עם חוף מלאכותי, טיילת ותצפיות ל-Rainbow Bridge ולקו הרקיע של העיר.\n\nלמה זה חשוב\nOdaiba בנויה על איים מלאכותיים. המקור של האזור במבצרי חוף שנבנו בשלהי תקופת Edo, ובהמשך הוא הפך לפרויקט ענק של פיתוח waterfront. לכן הנוף כאן הוא נוף \"מתוכנן\" כמעט לחלוטין.\n\nמה לשים לב\nלקראת שקיעה כדאי להאט: אור יום → שקיעה → Rainbow Bridge מואר → קו הרקיע. זה אחד המקומות הנדירים במסלול שבהם טוקיו נראית מרחוק ובגובה העיניים ולא מלמעלה."},{"id":"p_95dea67df142","name":"Statue of Liberty replica","city":"טוקיו","area":"Odaiba","status":"רוצה","kind":"attraction","desc":"פסל החירות הקטן של Odaiba עם רקע של המפרץ.","duration":"10–20 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Statue+of+Liberty+replica+Japan","booking":"","website":"","info":"מה זה\nפסל החירות של Odaiba הוא העתק של פסל בפריז. הפסל הצרפתי הוצב באודאיבה באופן זמני בשנים 1998–1999 במסגרת אירועי ידידות צרפת–יפן, ולאחר הצלחתו נוצר העתק קבוע.\n\nלמה זה חשוב\nהפסל הוא דוגמה משעשעת לאופן שבו Odaiba בנויה מסמלים גלובליים, אדריכלות חדשה ומרחבים מתוכננים. הוא הפך לחלק מהזהות של האי למרות שאין לו קשר היסטורי עמוק ליפן.\n\nמה לשים לב\nהקומפוזיציה הקלאסית היא הפסל, Rainbow Bridge וקו הרקיע מאחור. גובהו עם הבסיס כ-11 מטר, בערך שביעית מפסל ניו יורק."},{"id":"p_a1f64434108f","name":"teamLab Planets","city":"טוקיו","area":"Toyosu + Ariake","status":"רוצה","kind":"attraction","desc":"חוויה דיגיטלית immersive שבה הולכים בתוך מים, מראות ואור.","duration":"1.5–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=teamLab+Planets+Japan","booking":"","website":"","info":"מה זה\nteamLab Planets הוא מוזיאון אמנות דיגיטלית אימרסיבי ב-Toyosu. חלק מהעבודות דורשות הליכה יחפה במים או דרך חללים שבהם הגבול בין גוף, אור, מראה, צליל וסביבה כמעט נעלם.\n\nלמה זה חשוב\nהעבודה של teamLab אינה מתייחסת לאמנות כאובייקט שתולים על קיר. המבקר עצמו הופך לחלק מהיצירה, והיצירה משתנה בהתאם לתנועה, תאורה וחלל. זה ממשיך רעיון שחוזר במסלול: היחסים בין אדם, טבע וטכנולוגיה.\n\nמה לשים לב\nאל תמהרו לצלם כל דבר. כמה מהחללים עובדים טוב יותר כשפשוט עומדים בהם. לבשו בגדים שמתאימים למים ולרצפות מראה, והגיעו לפי חלון הכניסה המוזמן."},{"id":"p_d640ee8241ae","name":"Small Worlds","city":"טוקיו","area":"Toyosu + Ariake","status":"רוצה","kind":"attraction","desc":"מוזיאון מיניאטורות ענק עם ערים, חלל, אנימה ומערכות מכניות.","duration":"1.5–2.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Small+Worlds+Japan","booking":"","website":"","info":"מה זה\nSMALL WORLDS הוא מוזיאון מיניאטורות ב-Ariake. התצוגות כוללות ערים, שדות תעופה, חלל, Evangelion ועולמות בדיוניים שנבנו בקנה מידה קטן עם תאורה, תנועה והמון פרטים.\n\nלמה זה חשוב\nמיניאטורות הן חיבור בין craft, engineering ו-storytelling. במקום להסתכל על אובייקט בודד, אתם מסתכלים על מערכת שלמה — אנשים, רכבות, מטוסים, בניינים וסיפורים זעירים.\n\nמה לשים לב\nהתכופפו לגובה של הדמויות ונסו לראות את העולם \"מבפנים\". התצוגה מעניינת במיוחד למי שאוהב מודלים, מכניקה ו-Evangelion."},{"id":"p_4536e43127c9","name":"Toyosu Market","city":"טוקיו","area":"Toyosu + Ariake","status":"רוצה","kind":"attraction","desc":"שוק הסיטונאות המודרני של טוקיו עם מסעדות ותצפיות על פעילות השוק.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Toyosu+Market+Japan","booking":"","website":"","info":"מה זה\nToyosu Market הוא השוק הסיטונאי המרכזי שאליו עברו פעילויות Tsukiji ב-2018. זהו מתחם מודרני עצום שבו מתבצעת הפצה סיטונאית של דגים, פירות ים, ירקות ופירות לעיר.\n\nלמה זה חשוב\nTsukiji Outer Market מציג את החזית המסחרית והאנושית של תרבות האוכל; Toyosu מציג את תשתית הלוגיסטיקה המודרנית שמאחוריה. המבקרים צופים במסחר ובתפעול דרך מסלולים ייעודיים, משום שהשטחים המקצועיים אינם שוק קמעונאי רגיל.\n\nמה לשים לב\nאם רוצים לראות פעילות אמיתית צריך להגיע מוקדם. בדקו מראש את לוח ימי הפעילות, כי בימי סגירה אין כניסה גם לחלק מהחנויות והמסעדות שבמתחם."},{"id":"p_8a15beabf088","name":"Senkyaku Banrai","city":"טוקיו","area":"Toyosu + Ariake","status":"רוצה","kind":"attraction","desc":"מתחם בסגנון יפני מסורתי עם אוכל, חנויות ואונסן רגליים/מרחצאות.","duration":"1–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Senkyaku+Banrai+Japan","booking":"","website":"","info":"מה זה\nToyosu Senkyaku Banrai הוא מתחם אוכל, מסחר ומרחצאות שנפתח ליד Toyosu Market. העיצוב שואב השראה מרחובות Edo ומשלב שוק אוכל עם Tokyo Toyosu Manyo Club.\n\nלמה זה חשוב\nזה לא \"שוק היסטורי\" אלא פרשנות מודרנית ומבויימת לתרבות שוק יפנית. הוא מנסה לחבר את חומרי הגלם של Toyosu עם חוויית אוכל נגישה לקהל הרחב.\n\nמה לשים לב\nהערך עבורנו הוא המעבר בין Toyosu המקצועי והפונקציונלי לבין הרחוב המעוצב והמכוון לתייר. לצמחוני צריך לבדוק היטב dashi ומרכיבים מן החי."},{"id":"p_a3d833975f7f","name":"teamLab Borderless","city":"טוקיו","area":"Azabudai + Roppongi","status":"חובה","kind":"attraction","desc":"מוזיאון אמנות דיגיטלית ללא מסלול קבוע, עם חללים שמשתנים ומתחברים זה לזה.","duration":"2–3 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=teamLab+Borderless+Japan","booking":"","website":"","info":"מה זה\nteamLab Borderless הוא מוזיאון דיגיטלי ב-Azabudai Hills שבו העבודות אינן נשארות בתוך \"חדר\" אחד. דימויים נעים בין חללים, מגיבים למבקרים ומתחברים לעבודות אחרות.\n\nלמה זה חשוב\nהרעיון של \"Borderless\" הוא לבטל גבולות: בין יצירה ליצירה, בין המבקר לחלל ובין אמנות לטכנולוגיה. בניגוד ל-Planets, שבו הגוף והחומריות מאוד מרכזיים, כאן הדגש הוא על שיטוט, אובדן כיוון וגילוי.\n\nמה לשים לב\nאין מסלול נכון. אל תנסו לסמן חדרים כ-V; חזרו למקומות כי הם יכולים להשתנות. זה אחד המקומות שבהם כדאי להשאיר סקרנות במקום תוכנית קשיחה."},{"id":"p_db77d368e9f8","name":"Azabudai Hills","city":"טוקיו","area":"Azabudai + Roppongi","status":"רוצה","kind":"attraction","desc":"מתחם חדש ומעוצב עם אדריכלות, אוכל, חנויות ושטחים ירוקים.","duration":"60–120 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Azabudai+Hills+Japan","booking":"","website":"","info":"מה זה\nAzabudai Hills הוא פרויקט עירוני ענק שנפתח ב-2023 אחרי יותר משלושה עשורים של תכנון. הרעיון הרשמי הוא \"Modern Urban Village\" עם דגש על Green & Wellness.\n\nלמה זה חשוב\nהמתחם מציג תפיסה יפנית עכשווית של עיר צפופה: גורד שחקים גבוה מאוד, מגורים, משרדים, בתי ספר, אמנות, אוכל ושירותים — אבל גם כ-24,000 מ\"ר של שטחים ירוקים, פי כמה מהמצב שהיה לפני הפיתוח.\n\nמה לשים לב\nאחרי teamLab, צאו החוצה והסתכלו על הטופוגרפיה, הגנים והקשרים בין הבניינים. החלק המעניין הוא לא רק גובה Mori JP Tower אלא הניסיון להפוך פיתוח פרטי ל\"רחוב ושכונה\"."},{"id":"p_106fc40eca1f","name":"Tokyo Tower","city":"טוקיו","area":"Azabudai + Roppongi","status":"רוצה","kind":"attraction","desc":"המגדל האייקוני של טוקיו עם תצפיות ועיצוב רטרו.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+Tower+Japan","booking":"","website":"","info":"מה זה\nTokyo Tower הוא מגדל תקשורת ותצפית בגובה 333 מטר, שנפתח ב-1958. הוא נבנה בתקופה שבה יפן התאוששה במהירות אחרי המלחמה והטלוויזיה הפכה לטכנולוגיה לאומית מרכזית.\n\nלמה זה חשוב\nלפני Skytree ולפני גורדי השחקים החדשים, Tokyo Tower היה הסמל של \"יפן החדשה\": הנדסה, שידור, צמיחה ואופטימיות. העיצוב מזכיר את Eiffel Tower, אבל התפקיד והמשמעות שלו נטועים עמוק בטוקיו של תקופת Showa.\n\nמה לשים לב\nגם אם לא עולים לתצפית, המגדל משמעותי כאלמנט בקו הרקיע. מ-Azabudai או Roppongi אפשר לראות אותו משתנה מאוד בין יום ללילה."},{"id":"p_78d11b41d6a0","name":"Roppongi Hills","city":"טוקיו","area":"Azabudai + Roppongi","status":"רוצה","kind":"attraction","desc":"מתחם עירוני עם קניות, אמנות ותצפיות.","duration":"60–120 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Roppongi+Hills+Japan","booking":"","website":"","info":"מה זה\nRoppongi Hills הוא מתחם עירוני ענק שנפתח ב-2003 אחרי תהליך פיתוח של יותר מ-15 שנה. הוא כולל משרדים, מגורים, קולנוע, מסחר, מלון, מוזיאון ותצפית סביב Mori Tower.\n\nלמה זה חשוב\nהפרויקט נבנה סביב רעיון של \"Cultural Heart of the City\" — עיר אנכית שבה אמנות, עבודה, מגורים ובילוי מתקיימים יחד. הוא הפך מודל לפרויקטים מאוחרים יותר של Mori Building, כולל Azabudai Hills.\n\nמה לשים לב\nהנקודה המעניינת היא החיבור בין Mori Art Museum ו-Tokyo City View בראש המגדל לבין הרחובות, האמנות הציבורית והמרחבים הירוקים למטה."},{"id":"p_0b25a69b8bc4","name":"Mori Art Museum","city":"טוקיו","area":"Azabudai + Roppongi","status":"רוצה","kind":"attraction","desc":"מוזיאון לאמנות עכשווית בקומות העליונות של Roppongi Hills.","duration":"1–1.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Mori+Art+Museum+Japan","booking":"","website":"","info":"מה זה\nMori Art Museum הוא מוזיאון לאמנות עכשווית בראש Mori Tower, שנפתח ב-2003. הוא מתמקד באמנות חזותית, אדריכלות ועיצוב עכשוויים עם דגש בינלאומי ואסייתי.\n\nלמה זה חשוב\nהמוזיאון הוקם כחלק מהרעיון של Roppongi Hills כ\"מרכז תרבותי עירוני\". המיקום שלו גבוה מעל העיר אינו מקרי: המוזיאון אמור להיות חלק מחיי העיר ולא מוסד מבודד.\n\nמה לשים לב\nהאיכות תלויה מאוד בתערוכה המתחלפת, ולכן כדאי לקרוא עליה סמוך לביקור. אל תצפו ל\"אוסף קבוע של קלאסיקות\"; זה מקום של רעיונות עכשוויים, נושאים חברתיים וניסויים חזותיים."},{"id":"p_051c180ce8e0","name":"Tokyo City View","city":"טוקיו","area":"Azabudai + Roppongi","status":"רוצה","kind":"attraction","desc":"תצפית גבוהה על העיר מ-Roppongi Hills.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+City+View+Japan","booking":"","website":"","info":"מה זה\nTokyo City View היא תצפית בקומה ה-52 של Mori Tower, בגובה כ-250 מטר מעל פני הים, עם חלונות מהרצפה עד התקרה ונוף פנורמי לטוקיו.\n\nלמה זה חשוב\nהתצפית נותנת זווית שונה מ-Shibuya Sky: מכאן Tokyo Tower נמצא ממש מולכם, ו-Roppongi/Azabudai נראים כמרכז העיר. החלל משמש לעיתים גם לתערוכות שמחברות אמנות עם נוף.\n\nמה לשים לב\nבימים בהירים אפשר לראות גם את Skytree ולעיתים את Fuji. אם כבר עליתם ל-Shibuya Sky, כדאי לראות כאן את הנוף כמסגרת משלימה ולא כעוד \"תצפית זהה\"."},{"id":"p_ee87744fa175","name":"21_21 Design Sight","city":"טוקיו","area":"Azabudai + Roppongi","status":"רוצה","kind":"attraction","desc":"מוזיאון/חלל עיצוב במתחם Tokyo Midtown שתוכנן בשיתוף Tadao Ando, עם תערוכות מתחלפות של עיצוב ותרבות.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=21_21+Design+Sight+Japan","booking":"","website":"","info":"מה זה\n21_21 DESIGN SIGHT הוא מרכז לתערוכות עיצוב ב-Tokyo Midtown, שנוסד מתוך חזונו של Issey Miyake ונפתח ב-2007. האדריכל Tadao Ando תכנן את המבנה, שרובו קבור מתחת לאדמה.\n\nלמה זה חשוב\nהמקום לא מציג \"כיסאות יפים\" בלבד, אלא משתמש בעיצוב כדי להסתכל מחדש על חיי יום-יום. הגג נוצר כרעיון של יריעת פלדה אחת מקופלת, בהשראת תפיסת A Piece of Cloth של Miyake.\n\nמה לשים לב\nב-8/12/2026, לפי התוכנית הרשמית הנוכחית, מוצגת התערוכה Learning from “Hōjōki”: Tiny Architecture Reweaves Life, המבוססת על הטקסט מהמאה ה-13 ובוחנת מגורים מינימליים וחיים דרך מבנים זעירים. שימו לב גם לבניין עצמו לפני שנכנסים."},{"id":"p_01c9510fb4ff","name":"MUJI Ginza","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"סניף דגל רב קומות של MUJI עם עיצוב, מוצרים, אוכל ומלון.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=MUJI+Ginza+Japan","booking":"","website":""},{"id":"p_657bf5ebbd80","name":"UNIQLO Ginza","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"סניף ענק ורב קומות של UNIQLO.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=UNIQLO+Ginza+Japan","booking":"","website":""},{"id":"p_80c211cfa03c","name":"Sony Park Ginza","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"מתחם תרבות/טכנולוגיה של Sony עם תערוכות מתחלפות.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Sony+Park+Ginza+Japan","booking":"","website":"","info":"מה זה\nGinza Sony Park הוא מרחב עירוני/תרבותי של Sony בלב Ginza, במקום שבו עמד בעבר Sony Building. הרעיון הוא פחות \"חנות דגל\" ויותר פארק עירוני אנכי שמארח מוזיקה, תערוכות, טכנולוגיה ואירועים מתחלפים.\n\nלמה זה חשוב\nSony משתמשת באתר כדי לבחון מה יכול להיות מרחב ציבורי בבעלות פרטית באחד הרחובות היקרים ביפן. זה מתאים מאוד לסיפור של Ginza: מסחר, עיצוב, טכנולוגיה ותרבות באותו מקום.\n\nמה לשים לב\nהתוכן משתנה, ולכן מה שחשוב הוא המבנה והאירוע שפועל בזמן הביקור. בדקו סמוך ל-7/12 מה מוצג בפועל."},{"id":"p_6d2193c973f2","name":"Nissan Crossing","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"חלל תצוגה עתידני של Nissan עם רכבים וטכנולוגיה.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Nissan+Crossing+Japan","booking":"","website":"","info":"מה זה\nNISSAN CROSSING הוא חלל תצוגה וטכנולוגיה בצומת Ginza 4-chome. Nissan מגדירה אותו כמרכז להצגת Intelligent Mobility ורעיונות על עתיד הנהיגה.\n\nלמה זה חשוב\nהחלל עצמו תוכנן סביב מוטיב \"Spiral\" ומנסה להציג רכב לא כמוצר בלבד אלא כחלק מתרבות עיצוב וטכנולוגיה. המיקום בגינזה מדגיש את החיבור בין מסורת מסחרית לחדשנות.\n\nמה לשים לב\nהמכוניות מתחלפות, ולכן אין דגם אחד שחייבים לראות. כדאי להתרכז בפרטי העיצוב, ממשקי הרכב ובאופן שבו Nissan מספרת סיפור על תחבורה עתידית."},{"id":"p_b276344cf52a","name":"Art Aquarium Museum","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"מיצגי אמנות ותאורה סביב אקווריומים של דגי זהב.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Art+Aquarium+Museum+Japan","booking":"","website":"","info":"מה זה\nArt Aquarium Museum Ginza משתמש בדגי זהב חיים כחלק ממיצבי אור, צבע, מוזיקה ואקווריומים פיסוליים. התצוגות שואבות מוטיבים ממקדשים, גנים, פנסים ודוגמאות יפניות.\n\nלמה זה חשוב\ngoldfish הגיעו ליפן מסין והפכו לאורך מאות שנים לחלק מתרבות נוי, גידול עונתי ופסטיבלים. המוזיאון לוקח מסורת זו והופך אותה למופע עכשווי ואינסטגרמי.\n\nמה לשים לב\nיש במקום מגוון גדול מאוד של זני goldfish. נסו להסתכל גם על הדגים עצמם ולא רק על התאורה. חשוב לזכור שזו חוויית בידור-אמנות עם בעלי חיים, לא מוזיאון טבע."},{"id":"p_4a9b510ea92c","name":"Hamarikyu Gardens","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"גן יפני היסטורי עם בריכות, בית תה וניגוד יפה לגורדי השחקים.","duration":"1–1.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Hamarikyu+Gardens+Japan","booking":"","website":"","info":"מה זה\nHamarikyu הוא גן daimyo גדול מתקופת Edo על שפת מפרץ טוקיו. תחילתו במאה ה-17, כאשר חלק מהים יובש ונבנתה במקום אחוזה של משפחת Tokugawa. לאחר Meiji הוא הפך לארמון נלווה של המשפחה הקיסרית ולבסוף נפתח לציבור.\n\nלמה זה חשוב\nהמאפיין הייחודי ביותר הוא Shioiri-no-ike — בריכה שמקבלת מי ים מהמפרץ ומפלסה משתנה עם הגאות והשפל. זו הבריכה הפעילה היחידה מסוג זה שנותרה בטוקיו.\n\nמה לשים לב\nחפשו את בריכת הגאות, את בית התה Nakajima-no-ochaya ואת האורן העתיק. הניגוד בין גן של shogun לבין גורדי השחקים של Shiodome הוא אחד הניגודים היפים במסלול."},{"id":"p_35264dbe4296","name":"Tokyo Character Street","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"מסדרון חנויות דמויות בתחנת Tokyo: anime, TV, mascots ועוד.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+Character+Street+Japan","booking":"","website":""},{"id":"p_cd5be653a74b","name":"Tokyo Station Marunouchi","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"חזית הלבנים ההיסטורית של תחנת טוקיו והאזור המודרני סביבה.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+Station+Marunouchi+Japan","booking":"","website":"","info":"מה זה\nTokyo Station נפתחה ב-1914 כבירתה התחבורתית של יפן המודרנית. בניין Marunouchi האדום תוכנן על ידי האדריכל Tatsuno Kingo.\n\nלמה זה חשוב\nהתחנה שרדה כמעט ללא נזק את רעידת Kanto של 1923, נפגעה בהפצצות 1945 ושוקמה בפשטות לאחר המלחמה. בין 2007 ל-2012 בוצע שימור ושחזור מקיף שהחזיר את המראה המקורי בן שלוש הקומות. ב-2003 הבניין הוכר כנכס תרבות חשוב.\n\nמה לשים לב\nעמדו בכיכר Marunouchi והסתכלו על כל החזית, ואז היכנסו לאולמות הכיפות. מסביב נמצא רובע עסקים מודרני מאוד — שוב שכבה היסטורית שנשמרת בתוך עיר מתחדשת."},{"id":"food_ts_tantan","name":"T’s Tantan Tokyo Station","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"food","desc":"ראמן טבעוני בתחנת Tokyo Station. מקום נוח מאוד לארוחה מהירה ובטוחה לצמחונית בלי דגים או dashi.","duration":"30–60 דק׳","note":"טבעוני לחלוטין.","maps":"https://www.google.com/maps/search/?api=1&query=T%27s+Tantan+Tokyo+Station","booking":"","website":"https://foods.jr-cross.co.jp/ts-tantan/"},{"id":"p_fd1aa1ebe25b","name":"Sunshine Aquarium","city":"טוקיו","area":"Ikebukuro","status":"רוצה","kind":"attraction","desc":"אקווריום עירוני עם פינגווינים, לוטרות ותצוגות יצירתיות.","duration":"1.5–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Sunshine+Aquarium+Japan","booking":"","website":"","info":"מה זה\nSunshine Aquarium נמצא על גג מתחם Sunshine City באיקבוקורו ונחשב לאחד האקווריומים העירוניים הגבוהים והיוצאי דופן בטוקיו.\n\nלמה זה חשוב\nהקונספט הוא \"oasis in the sky\": להביא מערכות מים וחיות אל לב אזור צפוף וגבוה. המוצג המפורסם ביותר, Penguins in the Sky, משתמש במיכל תלוי כך שהפינגווינים נראים כאילו הם שוחים מעל קו הרקיע.\n\nמה לשים לב\nהחלק החיצוני על הגג הוא מה שמבדיל אותו מאקווריומים רגילים. שימו לב לשילוב בין בעלי החיים לבין בנייני Ikebukuro ברקע."},{"id":"p_7021610ad3e5","name":"Bandai Namco Cross Store","city":"טוקיו","area":"Ikebukuro","status":"רוצה","kind":"attraction","desc":"מתחם עם מותגי Bandai Namco, משחקים, דמויות ומרצ׳נדייז.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Bandai+Namco+Cross+Store+Japan","booking":"","website":""},{"id":"p_a2be9c6b2fe0","name":"NAMJATOWN","city":"טוקיו","area":"Ikebukuro","status":"רוצה","kind":"attraction","desc":"פארק indoor קטן ומשונה עם מתקנים, אוכל ודמויות.","duration":"1–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=NAMJATOWN+Japan","booking":"","website":"","info":"מה זה\nNAMJATOWN הוא פארק שעשועים מקורה של Bandai Namco בתוך Sunshine City. הוא בנוי כעולם של סמטאות ותפאורות, עם משחקים, אטרקציות, דמויות ואוכל.\n\nלמה זה חשוב\nזו דוגמה לסוג בידור יפני שאינו \"פארק ענק\" כמו Disney או USJ אלא עולם indoor קומפקטי שמערבב arcade, storytelling, character culture ותפאורה.\n\nמה לשים לב\nהחוויה תלויה מאוד באטרקציות ובשיתופי הפעולה הפעילים בזמן הביקור. אצלנו זה stop גמיש — אם האנרגיה נמוכה אפשר לקצר בלי לפגוע ביום."},{"id":"p_6b5329e13d24","name":"Animate Ikebukuro","city":"טוקיו","area":"Ikebukuro","status":"רוצה","kind":"attraction","desc":"חנות ענקית לאנימה, מנגה ו-merchandise.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Animate+Ikebukuro+Japan","booking":"","website":""},{"id":"p_d028272c6442","name":"Neco Republic Ikebukuro rescue cat café","city":"טוקיו","area":"Ikebukuro","status":"רוצה","kind":"attraction","desc":"בית קפה עם חתולי הצלה ואימוץ. מתאים יותר למי שמעדיף מודל עם רווחת בעלי חיים.","duration":"60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Neco+Republic+Ikebukuro+rescue+cat+caf%C3%A9+Japan","booking":"","website":"","info":"מה זה\nNeco Republic הוא מודל של rescue cat café: בית קפה שבו החתולים מגיעים ממערך הצלה ואימוץ, והמטרה היא לא רק בילוי אלא גם חשיפה לאימוץ ולרווחת חתולים.\n\nלמה זה חשוב\ncat cafés מזוהים מאוד עם יפן, אבל כאן יש שכבה נוספת של social enterprise. הביקור מציג איך קונספט מסחרי יכול לשמש גם לקידום הצלה ואימוץ.\n\nמה לשים לב\nיש לכבד את כללי המקום לגבי מגע, צילום והאכלה. זו חוויה שקטה יחסית, ולכן מתאימה כהפסקה בין גנים לאזור Sunshine City."},{"id":"p_5dcfa1bddcef","name":"Pokémon Center MEGA TOKYO","city":"טוקיו","area":"Ikebukuro","status":"חובה","kind":"attraction","desc":"אחד ממרכזי Pokémon הגדולים בטוקיו, בתוך Sunshine City באיקבוקורו, עם מבחר גדול של מרצ'נדייז ומוצרים בלעדיים.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Pokemon+Center+MEGA+TOKYO+Sunshine+City+Japan","booking":"","website":""},{"id":"p_0169f1c102f4","name":"Pikachu Sweets by Pokémon Cafe","city":"טוקיו","area":"Ikebukuro","status":"חובה","kind":"food","desc":"דוכן Pokémon Café בסגנון takeaway ליד Pokémon Center MEGA TOKYO, עם משקאות וקינוחים בעיצוב Pokémon.","duration":"20–40 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Pikachu+Sweets+by+Pokemon+Cafe+Sunshine+City+Japan","booking":"","website":""},{"id":"p_f4d7f88e6d14","name":"Rikugien Garden","city":"טוקיו","area":"Autumn Gardens","status":"חובה","kind":"attraction","desc":"גן יפני קלאסי ומרהיב במיוחד בשלכת, לעיתים עם תאורת ערב עונתית.","duration":"1–1.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Rikugien+Garden+Japan","booking":"","website":"","info":"מה זה\nRikugien הוא גן טיול מתקופת Edo שנבנה סביב 1702 עבור Yanagisawa Yoshiyasu, מקורב לשוגון Tokugawa Tsunayoshi. שמו ורבים מהנופים בתוכו מבוססים על מסורת שירת waka.\n\nלמה זה חשוב\nזהו לא \"טבע פראי\" אלא נוף ספרותי מתוכנן: גבעות, אגם, איים ושבילים יוצרים רמזים למקומות ולשירים. בתקופת Meiji הגן עבר למשפחת Iwasaki, מייסדי Mitsubishi, ובהמשך נתרם לעיר טוקיו.\n\nמה לשים לב\nהליכה איטית סביב האגם חשובה יותר מסימון נקודות. שימו לב לשינויי זווית ולמסגור של הנוף. חשוב: תאורת השלכת המיוחדת של 2026 מתקיימת 25/11–6/12 בלבד; בביקור שלנו ב-9/12 זהו ביקור יום רגיל."},{"id":"p_b61f77e1a145","name":"Koishikawa Korakuen","city":"טוקיו","area":"Autumn Gardens","status":"רוצה","kind":"attraction","desc":"אחד הגנים היפניים העתיקים בטוקיו, עם בריכות, גשרים ושלכת.","duration":"1–1.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Koishikawa+Korakuen+Japan","booking":"","website":"","info":"מה זה\nKoishikawa Kōrakuen הוא אחד מגני ה-daimyo העתיקים בטוקיו. הוא החל להיבנות ב-1629 עבור ענף Mito של משפחת Tokugawa והושלם בתקופת Tokugawa Mitsukuni.\n\nלמה זה חשוב\nהגן משלב מסורות יפניות עם השפעה סינית ברורה. Mitsukuni שילב בו רעיונות של המלומד הסיני Zhu Shunshui, כולל גשר Full Moon וייצוגים של נופים סיניים. אפילו השם Kōrakuen מגיע מטקסט סיני על שליט ש\"דואג לפני העם ונהנה אחריו\".\n\nמה לשים לב\nחפשו את השילוב בין אגם מרכזי, גבעות, גשרים ומסלולים שמסתירים וחושפים את הנוף. זה גן שנועד לחוות תוך הליכה, לא מנקודת תצפית אחת."},{"id":"p_e99feaf36cfc","name":"Kiyomizu-dera","city":"קיוטו","area":"Higashiyama + Gion","status":"חובה","kind":"attraction","desc":"מקדש מפורסם על גבעה עם מרפסת עץ ונוף לקיוטו.","duration":"1–1.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kiyomizu-dera+Japan","booking":"","website":""},{"id":"p_43740fb1fbb4","name":"Sannenzaka","city":"קיוטו","area":"Higashiyama + Gion","status":"חובה","kind":"attraction","desc":"רחוב היסטורי יפה עם בתי עץ, חנויות וממתקים.","duration":"30–45 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Sannenzaka+Japan","booking":"","website":""},{"id":"p_ad0964a285b3","name":"Ninenzaka","city":"קיוטו","area":"Higashiyama + Gion","status":"חובה","kind":"attraction","desc":"סמטה מסורתית פוטוגנית המחברת בין אזור Kiyomizu ל-Gion.","duration":"30–45 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Ninenzaka+Japan","booking":"","website":""},{"id":"p_8ecae80d31fb","name":"Yasaka Pagoda","city":"קיוטו","area":"Higashiyama + Gion","status":"רוצה","kind":"attraction","desc":"פגודה בולטת בלב Higashiyama, אחת התמונות המזוהות עם קיוטו.","duration":"15–30 דק׳","note":"","maps":"https://ww
