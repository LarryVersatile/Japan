<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07090d">
<title>יפן 2026 · v78</title>
<style>
  :root { --bg:#07090d; --card:#141a24; --line:#2a3444; --text:#f4f7fb; --muted:#93a0b3; --blue:#8ebcff; --ink:#071018; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust:100%; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; overflow-x:hidden; max-width:100%; }
  button, a { touch-action:manipulation; }
  button, input, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  a { color:var(--blue); }
  .app { width:min(480px,100%); margin:0 auto; min-height:100dvh; padding: 12px 16px calc(28px + env(safe-area-inset-bottom)); }
  .dow { color:var(--blue); font-size:13px; font-weight:700; }
  h1 { font-size:34px; line-height:1.05; margin:4px 0 0; }
  .sub { color:var(--muted); margin:6px 0 12px; font-size:15px; }
  .days { display:flex; gap:8px; overflow-x:auto; max-width:100%; padding-bottom:8px; margin:0 -16px 14px; padding-inline:16px; scroll-snap-type:x mandatory; overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch; }
  .days::-webkit-scrollbar { display:none; }
  .pill { flex:0 0 auto; scroll-snap-align:start; min-width:72px; min-height:52px; border-radius:16px; border:1px solid var(--line); background:#10151d; color:var(--text); }
  .pill.on { background:var(--blue); color:var(--ink); border-color:var(--blue); }
  .pill b { display:block; font-size:16px; }
  .pill span { font-size:11px; opacity:.75; }
  .now { background:#102033; border:1px solid #3c6288; border-radius:24px; padding:16px; }
  .label { color:#b7d4ff; font-size:13px; font-weight:800; }
  .time { direction:ltr; unicode-bidi:isolate; display:inline-block; margin-top:8px; font-size:22px; font-weight:750; font-variant-numeric:tabular-nums; }
  .now h2, .sheet h2 { margin:4px 0 8px; font-size:26px; line-height:1.2; overflow-wrap:anywhere; }
  .desc { margin:0; color:#d5deea; font-size:16px; line-height:1.45; }
  .next { margin-top:12px; color:#c5d4e6; font-size:15px; }
  .warn { margin-top:8px; color:#ffd98a; font-size:14px; }
  .actions { display:flex; gap:8px; margin-top:14px; }
  .btn { min-height:48px; border-radius:14px; border:0; padding:12px 14px; font-weight:800; text-decoration:none; display:flex; align-items:center; justify-content:center; }
  .primary { background:var(--blue); color:var(--ink); flex:1; }
  .ghost { background:transparent; color:#d7e6f8; border:1px solid #4d6986; }
  .late { width:100%; margin-top:8px; min-height:44px; border-radius:12px; border:1px solid var(--line); background:transparent; color:#c9d6e6; }
  .mymaps-link {
    width:100%; min-height:44px; margin:8px 0 2px; border-radius:12px;
    border:1px solid #315e87; background:#102033; color:#cfe8ff;
    display:flex; align-items:center; justify-content:center; text-decoration:none; font-weight:800;
  }
  .block { margin:18px 0 8px; color:var(--muted); font-size:13px; font-weight:800; }
  .row { width:100%; min-height:58px; display:flex; flex-direction:column; align-items:stretch; gap:2px; text-align:right; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; margin-top:8px; }
  .row-shell, .place-card-shell { position:relative; }
  .row-shell .row, .place-card-shell .card { padding-inline-start:54px; }
  .info-btn {
    position:absolute; left:11px; top:50%; transform:translateY(-50%);
    width:34px; height:34px; min-width:34px; min-height:34px; padding:0;
    border-radius:50%; border:1px solid #56708e; background:#152233; color:#cfe6ff;
    font-family:Georgia,serif; font-size:19px; font-weight:900; line-height:1;
    display:flex; align-items:center; justify-content:center; z-index:3;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
  }
  .info-btn:active { transform:translateY(-50%) scale(.96); }
  .now { position:relative; }
  .now .info-btn.info-current { top:18px; left:16px; transform:none; }
  .now .info-btn.info-current:active { transform:scale(.96); }
  .info-summary {
    margin:12px 0; padding:13px 14px; border-radius:16px;
    background:#0e1824; border:1px solid #29435f; color:#dce8f6;
  }
  .info-summary h3 { margin:0 0 8px; font-size:15px; color:#9fcaff; }
  .info-summary p { margin:0; font-size:16px; line-height:1.55; white-space:pre-line; }
  .info-facts { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .info-fact {
    display:inline-flex; padding:5px 8px; border-radius:999px;
    border:1px solid #33475f; color:#afc1d6; font-size:12px; background:#121c28;
  }
  .info-source {
    display:inline-flex; margin-top:12px; min-height:38px; align-items:center; padding:7px 10px;
    border-radius:10px; border:1px solid #355574; background:#132235; color:#a9d2ff;
    text-decoration:none; font-size:13px; font-weight:800;
  }
  .row .t { direction:ltr; unicode-bidi:isolate; color:var(--blue); font-weight:700; font-size:15px; text-align:left; }
  .row .n { font-weight:700; font-size:17px; overflow-wrap:anywhere; }
  .row.transit .n { color:#b7c3d4; font-weight:650; }
  .row.done-row {
    background:#10281c;
    border-color:#2f7d50;
    color:#dff7e8;
    min-height:52px;
  }
  .row.done-row .t { color:#76d69b; }
  .row.done-row .n { color:#e7fff0; }
  .row.done-row .done-check {
    color:#65d88f;
    font-weight:900;
    margin-left:6px;
  }
  .done-hint { color:#76a98a; font-size:11px; margin-top:2px; }

  .hop { color:var(--muted); font-size:13px; padding:6px 6px 0; }
  .fold { width:100%; margin-top:14px; min-height:44px; border:0; background:transparent; color:var(--muted); text-align:right; }
  .night { margin-top:8px; }
  .night p { color:var(--muted); font-size:14px; margin:0 0 8px; }
  .chip { display:inline-block; margin:0 0 8px 8px; padding:10px 12px; border-radius:999px; background:#161222; color:#e4dcff; border:1px solid #3c345c; font-size:14px; text-decoration:none; }
  .chrome { position:sticky; top:0; z-index:12; background:rgba(7,9,13,.97); backdrop-filter:blur(18px); border-bottom:1px solid var(--line); }
  .modebar { display:flex; gap:6px; padding:calc(7px + env(safe-area-inset-top)) 16px 6px; }
  .modebar button { flex:1; min-height:42px; border-radius:13px; border:1px solid #273447; background:#0e141d; color:#98a9bd; font-weight:850; font-size:14px; }
  .modebar button.on { background:#dbeafe; color:#0a1626; border-color:#dbeafe; box-shadow:0 0 0 1px rgba(255,255,255,.05) inset; }
  .modebar button span { margin-left:5px; }
  .nav { position:static; z-index:10; display:flex; justify-content:center; gap:8px; padding:5px 16px 8px; background:transparent; border-bottom:0; }
  .planning-mode .nav { display:none; }
  .nav button { flex:1; max-width:160px; min-height:48px; border-radius:14px; border:0; background:transparent; color:var(--muted); font-weight:700; }
  .nav button.on { background:#182232; color:#fff; }
  .search { width:100%; min-height:48px; border-radius:14px; border:1px solid var(--line); background:#10151d; padding:0 12px; font-size:16px; }
  .filters { display:flex; gap:8px; overflow-x:auto; margin:12px 0; }
  .filters button { flex:0 0 auto; min-height:40px; border-radius:999px; border:1px solid var(--line); background:#10151d; padding:0 12px; }
  .filters button.on { background:var(--blue); color:var(--ink); border-color:var(--blue); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; margin-top:8px; }
  .card b { font-size:16px; }
  .meta { color:var(--muted); font-size:13px; margin-top:4px; }
  .sheet-back { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; z-index:20; }
  .sheet { width:min(480px,100%); margin:0 auto; background:#121821; border-radius:22px 22px 0 0; padding:12px 16px calc(16px + env(safe-area-inset-bottom)); max-height:86dvh; overflow:auto; }
  .handle { width:42px; height:5px; border-radius:99px; background:#314055; margin:4px auto 12px; }
  textarea { width:100%; min-height:88px; border-radius:14px; border:1px solid var(--line); background:#0d1219; padding:12px; font-size:16px; }
  .menu { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .menu button, .menu a { min-height:44px; border-radius:12px; border:1px solid var(--line); background:#182232; color:#e7eef8; padding:10px 12px; text-decoration:none; }
  .opt { width:100%; text-align:right; background:#101722; border:1px solid var(--line); border-radius:14px; padding:12px; margin-top:8px; }
  .toast { position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:30; background:#182232; border:1px solid var(--line); border-radius:14px; padding:12px; display:flex; justify-content:space-between; align-items:center; gap:8px; }


  /* v77 — Planning mode */
  .plan-wrap { max-width:1180px; margin:0 auto; }
  .plan-hero { padding:4px 0 8px; }
  .plan-hero h1 { margin:0 0 5px; }
  .plan-hero .sub { max-width:820px; }
  .plan-tabs { display:flex; gap:7px; overflow-x:auto; margin:12px 0 14px; padding-bottom:2px; }
  .plan-tabs button { flex:0 0 auto; min-height:42px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:#101722; color:#c4d0df; font-weight:800; }
  .plan-tabs button.on { background:#dbeafe; color:#0a1626; border-color:#dbeafe; }
  .plan-toolbar { display:grid; gap:9px; margin-bottom:14px; }
  .plan-filter-row { display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; }
  .plan-filter-row::-webkit-scrollbar,.plan-tabs::-webkit-scrollbar{display:none}
  .plan-filter-row button { flex:0 0 auto; min-height:38px; padding:0 11px; border:1px solid var(--line); border-radius:999px; background:#101722; color:#b9c7d8; font-weight:750; font-size:13px; }
  .plan-filter-row button.on { background:#24354a; border-color:#496784; color:#fff; }
  .plan-select { width:100%; min-height:46px; border-radius:14px; border:1px solid var(--line); background:#10151d; color:var(--text); padding:0 12px; font-size:15px; }
  .plan-summary { display:flex; flex-wrap:wrap; gap:7px; margin:10px 0 14px; }
  .plan-summary span { padding:6px 9px; border-radius:999px; border:1px solid #2d3c50; background:#101722; color:#aebed2; font-size:12px; font-weight:800; }
  .plan-section-title { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:20px 0 8px; }
  .plan-section-title h2 { font-size:18px; margin:0; }
  .plan-section-title span { color:var(--muted); font-size:12px; }
  .plan-grid { display:grid; grid-template-columns:1fr; gap:10px; }
  .plan-card { position:relative; border:1px solid var(--line); border-radius:18px; background:var(--card); overflow:hidden; }
  .plan-card.status-must { border-color:#8a6b2f; box-shadow:0 0 0 1px rgba(240,190,82,.07) inset; }
  .plan-card.status-want { border-color:#315d83; }
  .plan-card.status-maybe { border-color:#4b5360; }
  .plan-card.status-no { opacity:.58; }
  .plan-card-body { padding:13px; }
  .plan-card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .plan-card-title { margin:0; font-size:18px; line-height:1.25; }
  .plan-card .meta { margin-top:5px; }
  .plan-card-desc { margin:9px 0 0; color:#c9d5e4; font-size:14px; line-height:1.45; }
  .plan-route { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .plan-route span { padding:5px 8px; border-radius:999px; background:#10281c; border:1px solid #2f7d50; color:#c9f6d9; font-size:11px; font-weight:850; }
  .plan-route .not-scheduled { background:#171b22; border-color:#38404b; color:#9ba9ba; }
  .plan-status { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin-top:11px; }
  .plan-status button { min-height:38px; border-radius:10px; border:1px solid #2b384a; background:#101722; color:#aebdd0; font-size:12px; font-weight:850; padding:4px 3px; }
  .plan-status button.on[data-plan-status="חובה"] { background:#493816; border-color:#9b7531; color:#ffe5a3; }
  .plan-status button.on[data-plan-status="רוצה"] { background:#102b44; border-color:#3976a6; color:#cdeaff; }
  .plan-status button.on[data-plan-status="אולי"] { background:#292d35; border-color:#606976; color:#e0e6ee; }
  .plan-status button.on[data-plan-status="לא"] { background:#351c20; border-color:#7b3d47; color:#ffc8ce; }
  .plan-card-actions { display:flex; gap:7px; margin-top:9px; }
  .plan-card-actions a,.plan-card-actions button { min-height:38px; border-radius:10px; border:1px solid var(--line); background:#151e2a; color:#dce8f6; padding:7px 10px; text-decoration:none; font-size:12px; font-weight:800; }
  .plan-info-mini { width:36px; height:36px; min-width:36px; border-radius:50%; border:1px solid #56708e; background:#152233; color:#cfe6ff; font-family:Georgia,serif; font-weight:900; font-size:18px; }
  .plan-day-route { border:1px solid var(--line); border-radius:16px; padding:9px 11px; background:#0d131c; margin-bottom:12px; }
  .plan-day-line { display:grid; grid-template-columns:70px 1fr; gap:8px; padding:7px 0; border-bottom:1px solid #1c2633; }
  .plan-day-line:last-child { border-bottom:0; }
  .plan-day-line .t { direction:ltr; color:#8fbce6; font-size:12px; }
  .plan-day-line .n { font-size:13px; font-weight:750; }
  .plan-note { border:1px solid #32445a; background:#101b29; color:#b9cae0; border-radius:14px; padding:10px 12px; font-size:13px; line-height:1.45; margin:10px 0 14px; }
  .plan-empty { padding:24px 12px; text-align:center; color:var(--muted); border:1px dashed #344153; border-radius:16px; }
  @media(min-width:760px){ .plan-grid{grid-template-columns:repeat(2,minmax(0,1fr));} .plan-toolbar.two{grid-template-columns:1fr 1fr;} }

  /* v69 — Restaurants tab */
  .restaurant-head { margin-bottom:12px; }
  .restaurant-head h1 { margin-bottom:4px; }
  .restaurant-note { color:var(--muted); font-size:13px; line-height:1.45; margin:0 0 12px; }
  .restaurant-search { margin-bottom:10px; }
  .restaurant-filters { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; }
  .restaurant-filters::-webkit-scrollbar { display:none; }
  .restaurant-filters button {
    flex:0 0 auto; min-height:38px; border-radius:999px; padding:0 12px;
    border:1px solid var(--line); background:#10151d; color:var(--text); font-weight:750;
  }
  .restaurant-filters button.on { background:var(--blue); color:var(--ink); border-color:var(--blue); }
  .restaurant-grid { display:grid; grid-template-columns:1fr; gap:12px; }
  .restaurant-card {
    border:1px solid var(--line); border-radius:18px; overflow:hidden; background:var(--card);
  }
  .restaurant-photo-wrap { width:100%; aspect-ratio:16/9; background:#0c1118; overflow:hidden; }
  .restaurant-photo {
    display:block; width:100%; height:100%; object-fit:cover; background:#0c1118;
  }
  .restaurant-body { padding:13px; }
  .restaurant-topline { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .restaurant-name { margin:0; font-size:19px; line-height:1.2; }
  .diet-badge {
    flex:0 0 auto; display:inline-flex; align-items:center; min-height:28px; padding:4px 9px;
    border-radius:999px; font-size:11px; font-weight:900; border:1px solid;
  }
  .diet-vegan { color:#bff6d1; border-color:#2f7d50; background:#10281c; }
  .diet-vegetarian { color:#d5f5c4; border-color:#5d7c39; background:#1b2812; }
  .diet-vegan-options { color:#bfeef0; border-color:#39717a; background:#10282d; }
  .diet-veg-friendly { color:#ffe4a8; border-color:#766031; background:#2a2110; }
  .diet-unknown { color:#c4cfdd; border-color:#435064; background:#171d26; }
  .restaurant-verify { margin-top:8px; color:#88a1bc; font-size:11px; line-height:1.35; }
  .saved-japan { display:inline-flex; align-items:center; margin-inline-start:6px; padding:3px 7px; border-radius:999px; border:1px solid #4b3c63; background:#1b1625; color:#d8c9ef; font-size:10px; font-weight:800; }
  .restaurant-meta { color:var(--muted); font-size:12px; margin-top:5px; }
  .restaurant-desc { color:#d5deea; line-height:1.45; font-size:14px; margin:9px 0 0; }
  .restaurant-diet { margin-top:9px; font-size:13px; line-height:1.42; color:#dce7f4; }
  .restaurant-address {
    margin-top:10px; color:#aebbc9; font-size:12px; line-height:1.35; direction:ltr; text-align:left;
  }
  .restaurant-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:12px; }
  .restaurant-actions a {
    min-height:42px; display:flex; align-items:center; justify-content:center; text-align:center;
    border-radius:11px; border:1px solid var(--line); background:#182232; color:#e9f1fb;
    font-size:12px; font-weight:850; text-decoration:none; padding:8px 9px;
  }
  .restaurant-actions a.map { background:#17304a; border-color:#315e87; color:#cfe8ff; }
  .restaurant-actions a.youtube { background:#2a1515; border-color:#6a3535; color:#ffbcbc; }
  .restaurant-actions a.menu { background:#18251a; border-color:#3f6847; color:#cef0d3; }
  .restaurant-actions a.photos { background:#251b32; border-color:#57406f; color:#e5d4ff; }
  @media (min-width: 760px) {
    .restaurant-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  }
  @media (min-width: 1180px) {
    .restaurant-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
  }

  .hidden { display:none !important; }
  @media (min-width: 960px) {
    .nav button[data-tab="places"] { display:none; }
    .app { width:min(1240px,100%); padding:22px 28px 48px; }
    .work { display:grid; grid-template-columns:220px minmax(0,1fr) 320px; gap:22px; align-items:start; }
    .rail, .side { position:sticky; top:76px; max-height:calc(100dvh - 96px); overflow:auto; }
    .rail-title { color:var(--muted); font-size:13px; font-weight:800; margin:0 0 8px; }
    .daylink { width:100%; text-align:right; border:1px solid transparent; background:transparent; border-radius:12px; padding:8px 10px; margin-top:4px; }
    .daylink b { display:block; font-size:15px; }
    .daylink span { display:block; color:var(--muted); font-size:12px; line-height:1.35; }
    .daylink.on { background:#182232; border-color:#3c6288; }
    .work .days { display:none; }
    .work .row { flex-direction:row; align-items:center; gap:14px; }
    .work .row .t { min-width:112px; font-size:15px; }
    .work h1 { font-size:28px; }
    .sheet-back { align-items:center; padding:24px; }
    .sheet { width:min(560px,100%); border-radius:22px; max-height:80dvh; }
  }

  /* v67 — strict attraction image + always-visible YouTube */
  .media-card { margin-top:10px; border:1px solid #2a3444; border-radius:14px; overflow:hidden; background:#0d1219; }
  .media-card.compact { margin-top:8px; }
  .media-image-wrap { display:none; width:100%; aspect-ratio:16/9; background:#0d1219; }
  .media-image-wrap.on { display:block; }
  .media-image { display:block; width:100%; height:100%; object-fit:cover; background:#0d1219; }
  .media-image-note { padding:6px 9px; font-size:10px; color:#8290a4; background:#0d1219; border-top:1px solid #202938; }
  .media-actions { display:flex; gap:8px; padding:8px; background:#111823; }
  .media-youtube, .media-status {
    flex:1; display:flex; align-items:center; justify-content:center;
    min-height:40px; padding:9px 12px; border-radius:11px;
    font-size:12px; font-weight:800; text-align:center;
  }
  .media-youtube { border:1px solid #653737; background:#261313; color:#ffb8b8; cursor:pointer; }
  .media-youtube:active { opacity:.72; }
  .media-status { border:1px solid #2a3444; background:#141c28; color:#96a4b8; }
  .media-card.hero { margin:12px 0 2px; }
  .media-card.hero .media-youtube { min-height:44px; font-size:13px; }

</style>
</head>
<body>
<header class="chrome">
  <div class="modebar" aria-label="מצב עבודה">
    <button type="button" data-mode="execute" class="on"><span>▶</span> ביצוע</button>
    <button type="button" data-mode="plan"><span>◫</span> תכנון</button>
  </div>
  <nav class="nav">
    <button type="button" data-tab="today" class="on">היום</button>
    <button type="button" data-tab="restaurants">מסעדות</button>
    <button type="button" data-tab="places">מקומות</button>
    <button type="button" data-tab="more">עוד</button>
  </nav>
</header>
<div class="app" id="app"></div>
<!-- /app -->

ל היום יושבים על שכבות של תעופה, צבא, כיבוש אמריקאי ואולימפיאדה. בסופי שבוע התרבות הספונטנית של רקדנים, מוזיקאים וקבוצות תחביב היא חלק מהזהות שלו לא פחות מהנוף.","infoSource":"https://www.gotokyo.org/en/spot/21/"},{"uid":"2026-11-26-2","part":"בוקר","time":"11:15–12:05","start":675,"end":725,"name":"Reissue 3D Latte Art","kind":"מסעדה / אוכל","desc":"בית קפה מפורסם בלאטה-ארט תלת-ממדי שמצויר לפי בקשה.","maps":"https://www.google.com/maps/search/?api=1&query=Reissue+3D+Latte+Art+Japan","website":"","hop":"הליכה 0.7 ק״מ","transit":false},{"uid":"2026-11-26-3","part":"בוקר","time":"12:15–13:15","start":735,"end":795,"name":"Takeshita Street","kind":"אטרקציה","desc":"רחוב צבעוני בהראג'וקו עם אופנה צעירה, מתוקים וחנויות קטנות.","maps":"https://www.google.com/maps/search/?api=1&query=Takeshita+Street+Japan","website":"","hop":"הליכה 0.5 ק״מ","transit":false,"info":"Takeshita-dori הפך בעיקר משנות ה־70 וה־80 לאחד המרכזים המזוהים עם אופנת צעירים ביפן. Harajuku הסמוכה ל־Washington Heights האמריקאי נחשפה אחרי המלחמה להשפעות מערביות, ובהמשך צעירים החלו להגיע בסופי שבוע וליצור סגנונות לבוש עצמאיים. בשנות ה־80 וה־90 נולדו באזור תתי־תרבויות כמו Lolita, decora ו־visual kei, והמסחר התפתח סביבן. Takeshita הפכה לגרסה המרוכזת וההמונית של התהליך הזה — קוואי, purikura, קרפים וטרנדים מתחלפים. מה שמעניין כאן הוא לראות איך תרבות שנוצרה מלמטה על ידי צעירים הפכה עם הזמן למותג בינלאומי של יפן.","infoSource":"https://www.gotokyo.org/en/spot/48/index.html"},{"uid":"2026-11-26-4","part":"צהריים","time":"13:20–13:55","start":800,"end":835,"name":"ALPAKA Harajuku Harakado","kind":"חובה · חנות","desc":"חנות ALPAKA ב־2F של Tokyu Plaza Harajuku “Harakado”. תיקים, EDC ואביזרי נשיאה. שעות פתיחה: 11:00–21:00.","maps":"https://www.google.com/maps/search/?api=1&query=ALPAKA+Tokyu+Plaza+Harajuku+Harakado+Tokyo","website":"https://www.alpakagear.jp/","hop":"הליכה 0.2 ק״מ","transit":false},{"uid":"2026-11-26-5","part":"צהריים","time":"14:00–14:45","start":840,"end":885,"name":"Omotesando","kind":"אטרקציה","desc":"שדרה אלגנטית עם אדריכלות, חנויות דגל ובתי קפה.","maps":"https://www.google.com/maps/search/?api=1&query=Omotesando+Japan","website":"","hop":"הליכה 0.6 ק״מ","transit":false,"info":"Omotesandō פירושו 'דרך הגישה הקדמית', משום שהשדרה נבנתה כציר הגישה הראשי אל Meiji Jingu שנחנך ב־1920. אחרי מלחמת העולם השנייה ובמיוחד סביב אולימפיאדת 1964 האזור השתנה במהירות והפך בהדרגה לאחת מזירות האדריכלות והאופנה החשובות בטוקיו. בתי אופנה בינלאומיים בחרו להציב כאן מבנים שתוכננו בידי אדריכלים בולטים, כך שהבניין עצמו לעיתים מעניין לא פחות מהמותג שבתוכו. זה מקום מצוין לראות כיצד דרך שנולדה מתוך הקשר דתי הפכה בתוך מאה שנה לבמה של עיצוב עכשווי, בלי שהקשר המקורי ל־Meiji Jingu נעלם.","infoSource":"https://www.gotokyo.org/en/destinations/western-tokyo/aoyama-and-omotesando/index.html"},{"uid":"2026-11-26-6","part":"צהריים","time":"14:50–15:35","start":890,"end":935,"name":"Cat Street","kind":"אטרקציה","desc":"רחוב אופנתי בין שיבויה להראג'וקו עם בוטיקים, קפה וחנויות מיוחדות.","maps":"https://www.google.com/maps/search/?api=1&query=Cat+Street+Japan","website":"","hop":"הליכה 1.2 ק״מ","transit":false,"info":"Cat Street הוא הכינוי העממי לציר הולכי רגל המחבר בין Harajuku לשיבויה. הוא התפתח לאורך אזור שהיה קשור בעבר לתוואי של נהר Shibuya והפך במחצית השנייה של המאה ה־20 לזירה של אופנת רחוב, בוטיקים ותרבות יצירתית. בניגוד ל־Takeshita-dori, הוא משקף גרסה בוגרת ושקטה יותר של תרבות Harajuku. אין כאן אירוע היסטורי יחיד גדול; הסיפור הוא שינוי עירוני — תשתית שהפכה לטיילת ורחוב שהפך למעבדה של אופנה ועיצוב. שווה להסתכל גם על הסמטאות, המבנים וחזיתות הבטון, לא רק על החנויות.","infoSource":"https://www.gotokyo.org/en/destinations/western-tokyo/harajuku/index.html"},{"uid":"2026-11-26-7","part":"שקיעה + ערב","time":"16:00–17:15","start":960,"end":1035,"name":"Shibuya Sky","kind":"אטרקציה","desc":"תצפית פתוחה מעל שיבויה עם נוף 360° של טוקיו. הכי יפה לקראת שקיעה.","maps":"https://www.google.com/maps/search/?api=1&query=Shibuya+Sky+Japan","website":"","hop":"הליכה 0.8 ק״מ","transit":false,"info":"SHIBUYA SKY נפתח ב־2019 כחלק מ־Shibuya Scramble Square, פרויקט ענק של התחדשות סביב תחנת Shibuya. המגדל מתנשא לכ־230 מטר והתצפית מגיעה לכ־229 מטר וכוללת גג פתוח של 360°. החשיבות שלו היא דווקא חדשה: Shibuya, שהייתה מזוהה בעיקר עם תרבות רחוב ואופנה בגובה הקרקע, הפכה גם למרכז של אדריכלות, עסקים והתחדשות עירונית. מהגג אפשר לקרוא את העיר כמעט כמו מפה — מעבר החציה ממש מתחת, הירק של Meiji Jingu ו־Yoyogi בצד אחד וגורדי השחקים של Shinjuku בצד אחר. סביב שקיעה רואים את טוקיו משתנה מאור יום לרשת עצומה של אורות.","infoSource":"https://www.shibuya-scramble-square.com/en/"},{"uid":"2026-11-26-8","part":"שקיעה + ערב","time":"17:25–19:00","start":1045,"end":1140,"name":"Shibuya PARCO — Nintendo, Pokémon, CAPCOM, JUMP, JoJo & SEGA","kind":"חנות","desc":"מרכז גיימינג ותרבות פופ מרוכז ב־6F של Shibuya PARCO. באותה קומה נמצאים Nintendo TOKYO, Pokémon Center Shibuya, CAPCOM STORE TOKYO, JUMP SHOP, THE","maps":"https://www.google.com/maps/search/?api=1&query=Shibuya+PARCO+Tokyo+Japan","website":"","hop":"הליכה 0.6 ק״מ","transit":false},{"uid":"2026-11-26-9","part":"שקיעה + ערב","time":"19:05–20:00","start":1145,"end":1200,"name":"Shunju Shibuya Bunkamuradori","kind":"מסעדה / אוכל","desc":"מסעדה שמתאימה טוב לזוג עם העדפות שונות: יש אפשרויות רגילות לאוכל כללי ובמקביל אפשרות טבעונית/צמחונית שמוצהר עליה ללא fish stock.","maps":"https://www.google.com/maps/search/?api=1&query=Shunju+Shibuya+Bunkamuradori+Tokyo","website":"","hop":"הליכה 0.3 ק״מ","transit":false}],"night":[{"name":"Shibuya Crossing","desc":"מעבר החציה האייקוני של שיבויה, מוקף במסכי ענק ומרכזי קניות.","maps":"https://www.google.com/maps/search/?api=1&query=Shibuya+Crossing+Japan"},{"name":"MEGA Don Quijote","desc":"חנות ענקית עם אוכל, קוסמטיקה, גאדג'טים, מתנות ודברים יפניים מוזרים.","maps":"https://www.google.com/maps/search/?api=1&query=MEGA+Don+Quijote+Japan"}]},{"id":"2026-11-27","date":"27/11","dow":"שישי","title":"Shinjuku","subtitle":"גן ביום, תצפית בשקיעה, לילה + קניות Ikebukuro","base":"טוקיו","scope":["טוקיו"],"empty":false,"items":[{"uid":"2026-11-27-0","part":"בוקר","time":"09:00–11:00","start":540,"end":660,"name":"Shinjuku Gyoen","kind":"אטרקציה","desc":"גן ענק עם גנים יפניים, מדשאות ועצי שלכת. אחד המקומות היפים בסתיו.","maps":"https://www.google.com/maps/search/?api=1&query=Shinjuku+Gyoen+Japan","website":"","hop":"הליכה 1.2 ק״מ","transit":false,"info":"Shinjuku Gyoen התחיל כחלק מאחוזת משפחת Naitō שניתנה ב־1590 על ידי Tokugawa Ieyasu. אחרי רסטורציית Meiji הוא הפך ב־1872 לתחנת ניסויים חקלאית, אחר כך לגן בוטני קיסרי, ובתחילת המאה ה־20 הוזמן Henri Martinet מצרפת לתכנן מחדש את השטח. ב־1906 נוצר הבסיס לגן שאנו מכירים היום — שילוב של גן יפני, גן צרפתי פורמלי וגן נוף אנגלי. רוב המקום נחרב בהפצצות 1945 ונפתח לציבור כגן לאומי ב־1949; ב־1989 נערכו בו גם טקסי הלוויה הממלכתיים של הקיסר Shōwa. כדאי להשוות בכוונה בין שלושת סגנונות הגן: זו דרך ממש לראות בעיניים כיצד יפן של Meiji אימצה רעיונות מערביים בלי למחוק את המסורת המקומית.","infoSource":"https://policies.env.go.jp/national-garden/shinjukugyoen/english/intro/history/"},{"uid":"2026-11-27-1","part":"בוקר","time":"11:15–11:30","start":675,"end":690,"name":"3D Cat Billboard","kind":"אטרקציה","desc":"מסך תלת-ממדי מפורסם עם חתול ענק ליד תחנת שינג'וקו.","maps":"https://www.google.com/maps/search/?api=1&query=3D+Cat+Billboard+Japan","website":"","hop":"הליכה 0.5 ק״מ","transit":false,"info":"החתול התלת־ממדי של שינג'וקו הופיע ביולי 2021 על Cross Shinjuku Vision, מול היציאה המזרחית של התחנה, והפך בתוך זמן קצר לתופעה בינלאומית ברשת. האפקט אינו הולוגרמה: זהו מסך LED פינתי שעליו נבנית אנימציה אנמורפית שמנצלת פרספקטיבה כדי לגרום לחתול להיראות כאילו הוא יושב בתוך קופסה עמוקה ויוצא אל הרחוב. מבחינה היסטורית זה אתר צעיר מאוד, אבל הוא מספר משהו אמיתי על טוקיו של שנות ה־2020 — עיר שבה פרסום דיגיטלי יכול להפוך לאטרקציה ציבורית ולדמות עירונית. עמדו באזור הכיכר שמול המסך; שם האשליה עובדת בצורה הטובה ביותר.","infoSource":"https://shinjuku.xspace.tokyo/en/"},{"uid":"2026-11-27-2","part":"בוקר","time":"11:40–12:00","start":700,"end":720,"name":"Godzilla Head","kind":"אטרקציה","desc":"ראש גודזילה ענק על מלון Gracery באזור Kabukicho.","maps":"https://www.google.com/maps/search/?api=1&query=Godzilla+Head+Japan","website":"","hop":"הליכה 0.3 ק״מ","transit":false,"info":"ראש Godzilla הוצב ב־2015 על Shinjuku Toho Building שנבנה במקום Shinjuku Koma Theater, מוסד בידור שפעל שם יותר מחמישה עשורים. הראש נמצא בערך 50 מטר מעל הרחוב — הגובה של Godzilla בסרט המקורי מ־1954 — ולכן הוא נראה כאילו המפלצת באמת מציצה מעל Kabukicho. Godzilla נולד בידי Toho ב־1954 בתקופה שבה יפן עדיין התמודדה עם זיכרון ההפצצות והחרדה מהעידן האטומי, והדמות הפכה לאחד הסמלים התרבותיים של הקולנוע היפני. ב־2015 עיריית Shinjuku אפילו העניקה ל־Godzilla 'תעודת תושב' ומינתה אותו לשגריר תיירות. כיום הראש שואג ומואר בשעות קבועות.","infoSource":"https://www.toho.co.jp/en/our-moments/2026/09/2.html"},{"uid":"2026-11-27-3","part":"צהריים","time":"13:25–14:30","start":805,"end":870,"name":"הפסקת צהריים /","kind":"מעבר","desc":"","maps":"","website":"","hop":"","transit":true},{"uid":"2026-11-27-4","part":"שקיעה + ערב","time":"15:30–16:30","start":930,"end":990,"name":"Tokyo Metropolitan Government Observatory","kind":"אטרקציה","desc":"תצפית חינמית מגובה רב על טוקיו.","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+Metropolitan+Government+Observatory+Japan","website":"","hop":"הליכה 1.1 ק״מ","transit":false,"info":"בניין ממשלת מטרופולין טוקיו נפתח ב־1991 ותוכנן בידי Kenzo Tange, מהאדריכלים היפנים החשובים במאה ה־20. עם השלמתו היה הבניין הגבוה ביפן וסימל את השאפתנות של טוקיו בסוף תקופת הבועה הכלכלית. שני המגדלים שלו מזכירים קתדרלה מודרנית, אבל זהו למעשה בניין ממשלתי פעיל. קומות התצפית נמצאות בגובה כ־202 מטר ופתוחות ללא תשלום. פרט תרבותי משעשע: הבניין כבר 'נהרס' על המסך בסרט Godzilla vs. King Ghidorah מ־1991, זמן קצר לאחר שנחנך. מהתצפית שווה לחפש את Fuji ביום בהיר ואת קו גורדי השחקים של מערב Shinjuku.","infoSource":"https://www.locationbox.metro.tokyo.lg.jp/english/locatabi_eng/list/530/"},{"uid":"2026-11-27-5","part":"שקיעה + ערב","time":"16:40–17:10","start":1000,"end":1030,"name":"נסיעה Shinjuku → Ikebukuro","kind":"מעבר","desc":"","maps":"","website":"","hop":"","transit":true},{"uid":"2026-11-27-6","part":"שקיעה + ערב","time":"17:20–18:10","start":1040,"end":1090,"name":"Bandai Namco Cross Store","kind":"חנות","desc":"מתחם עם מותגי Bandai Namco, משחקים, דמויות ומרצ׳נדייז.","maps":"https://www.google.com/maps/search/?api=1&query=Bandai+Namco+Cross+Store+Japan","website":"","hop":"הליכה 0.7 ק״מ","transit":false},{"uid":"2026-11-27-7","part":"שקיעה + ערב","time":"18:15–19:15","start":1095,"end":1155,"name":"Animate Ikebukuro","kind":"חנות","desc":"חנות ענקית לאנימה, מנגה ו-merchandise.","maps":"https://www.google.com/maps/search/?api=1&query=Animate+Ikebukuro+Japan","website":"","hop":"","transit":false}],"night":[{"name":"Tokyu Kabukicho Tower","desc":"מתחם בילוי עם אוכל, משחקים, אירועים וחיי לילה.","maps":"https://www.google.com/maps/search/?api=1&query=Tokyu+Kabukicho+Tower+Japan"},{"name":"Omoide Yokocho","desc":"סמטאות קטנות וצפופות עם יקיטורי ואווירת טוקיו ישנה.","maps":"https://www.google.com/maps/search/?api=1&query=Omoide+Yokocho+Japan"},{"name":"Golden Gai","desc":"אזור ברים זעירים וסמטאות לילה מפורסמות.","maps":"https://www.google.com/maps/search/?api=1&query=Golden+Gai+Japan"}]},{"id":"2026-11-28","date":"28/11","dow":"שבת","title":"Asakusa → Ueno · שני המוזיאונים","subtitle":"מקדשים, רחובות, מוזיאון ושוק","base":"טוקיו","scope":["טוקיו"],"empty":false,"items":[{"uid":"2026-11-28-0","part":"בוקר","time":"08:45–09:25","start":525,"end":565,"name":"Sumida River","kind":"אטרקציה","desc":"נהר סומידה עובר לצד Asakusa ונותן נקודות תצפית יפות לכיוון Skytree ו-Asahi Beer Hall. מתאים להליכה קצרה או שיט.","maps":"https://www.google.com/maps/search/?api=1&query=Sumida+River+Japan","website":"","hop":"הליכה 0.7 ק״מ","transit":false,"info":"נהר Sumida היה עורק חיים של Edo הרבה לפני שהיה נוף לתיירים. סחורות שהגיעו למפרץ הועברו בנהרות ובתעלות אל תוך העיר, ועל גדות המים התפתחו מחסנים, שווקים, מסעדות ורבעי סוחרים. הנהר קשור גם ישירות למסורת Sensō-ji, משום שלפי הסיפור פסל Kannon שעליו נוסד המקדש נמצא בו בשנת 628. בתקופת Edo הפכו הגדות גם למרחב בילוי, שיט, hanami וזיקוקים, והדפסי ukiyo-e תיעדו שוב ושוב את הנהר והגשרים. כשעומדים היום בטיילת ורואים את Tokyo Skytree ואת Asahi Hall, כדאי לזכור שהמים אינם רק רקע יפה אלא אחת הסיבות שבגללן Edo הצליחה להפוך לעיר ענקית כבר במאה ה־18.","infoSource":"https://www.gotokyo.org/en/see-and-do/nature/waterfront/history-by-the-water.html"},{"uid":"2026-11-28-1","part":"בוקר","time":"09:30–09:45","start":570,"end":585,"name":"Kaminarimon","kind":"אטרקציה","desc":"שער הרעם האייקוני בכניסה ל-Senso-ji.","maps":"https://www.google.com/maps/search/?api=1&query=Kaminarimon+Japan","website":"","hop":"הליכה 0.5 ק״מ","transit":false,"info":"Kaminarimon, 'שער הרעם', הוא הכניסה המזוהה ביותר עם Sensō-ji. המסורת של המקדש מייחסת את השער הראשון לשנת 942, ובצדדיו עומדות דמויות Fūjin, אל הרוח, ו־Raijin, אל הרעם. השער נהרס ונבנה שוב פעמים רבות; המבנה הקודם נשרף ב־1865, והגרסה הנוכחית הושלמה ב־1960 בתרומה של Konosuke Matsushita, מייסד Panasonic, לאחר שלפי המסורת התפלל ב־Sensō-ji והחלים ממחלה. הפנס האדום הענק במרכז הפך לסמל של Asakusa. לכן זה יותר משער לצילום: הוא מחבר פולחן עתיק, שריפות, שיקום לאחר המלחמה וסיפור של תעשיין מודרני שהחזיר לאתר את הסמל שלו.","infoSource":"https://www.senso-ji.jp/english/"},{"uid":"2026-11-28-2","part":"בוקר","time":"09:45–10:55","start":585,"end":655,"name":"Senso-ji","kind":"אטרקציה","desc":"המקדש הבודהיסטי המפורסם באסאקוסה, עם שערים מרשימים ואווירה מסורתית.","maps":"https://www.google.com/maps/search/?api=1&query=Senso-ji+Japan","website":"","hop":"הליכה 0.4 ק״מ","transit":false,"info":"Sensō-ji הוא המקדש הבודהיסטי העתיק ביותר בטוקיו. לפי המסורת, ב־628 שני אחים דייגים משו מנהר Sumida פסל קטן של Kannon, בודהיסטווה של החמלה. ראש הכפר זיהה את משמעות הפסל והפך את ביתו למקום תפילה; ב־645 נבנה אולם מסודר, והדמות הקדושה הוגדרה כ־hibutsu — 'בודהה נסתר' שאינו מוצג לציבור. בתקופת Edo הפך המקדש למוקד עלייה לרגל עצום, וסביבו צמחו דוכנים, תיאטראות, מסעדות ורחובות מסחר — כלומר Sensō-ji ממש עזר ליצור את Asakusa העירונית. רוב המבנים נהרסו בהפצצות 1945 ונבנו מחדש לאחר המלחמה, ולכן המקום הוא גם סיפור על המשכיות של טקס ומקום למרות אובדן המבנה המקורי.","infoSource":"https://www.senso-ji.jp/english/"},{"uid":"2026-11-28-3","part":"בוקר","time":"11:00–11:45","start":660,"end":705,"name":"Nakamise Street","kind":"אטרקציה","desc":"רחוב קניות מסורתי בין Kaminarimon ל-Senso-ji, עם מזכרות וממתקים.","maps":"https://www.google.com/maps/search/?api=1&query=Nakamise+Street+Japan","website":"","hop":"הליכה 0.8 ק״מ","transit":false,"info":"Nakamise הוא אחד מרחובות המסחר העתיקים ביפן. בין 1688 ל־1735 קיבלו תושבים שסייעו בשירותי Sensō-ji זכות לפתוח דוכנים לאורך דרך העלייה למקדש, וכך נולד רחוב שבו דת, עלייה לרגל ומסחר מזינים זה את זה. בתקופת Edo נמכרו כאן תה, צעצועים, ממתקים ומזכרות. לאחר רסטורציית Meiji בוטלו זכויות הסוחרים והחנויות פונו; הרחוב נבנה מחדש, נפגע ברעידת Kantō של 1923 ושוב בהפצצות 1945, ושוקם בכל פעם. המבנים אינם בני 300 שנה, אבל המסורת המסחרית כן. כשעוברים בו, כדאי לחשוב שהרחוב קיים מלכתחילה משום שמיליוני אנשים היו בדרכם למקדש.","infoSource":"https://www.asakusa-nakamise.jp/e-history.html"},{"uid":"2026-11-28-4","part":"בוקר","time":"11:50–12:40","start":710,"end":760,"name":"Hat Coffee / 3D Foam Art","kind":"מסעדה / אוכל","desc":"קפה באסאקוסה עם קצף תלת-ממדי בעיצובים מיוחדים.","maps":"https://www.google.com/maps/search/?api=1&query=Hat+Coffee+%2F+3D+Foam+Art+Japan","website":"","hop":"הליכה 0.9 ק״מ","transit":false},{"uid":"2026-11-28-5","part":"צהריים","time":"12:50–14:05","start":770,"end":845,"name":"Kappabashi Street","kind":"אטרקציה","desc":"רחוב כלי המטבח של טוקיו: סכינים, כלי קרמיקה ודגמי אוכל מפלסטיק.","maps":"https://www.google.com/maps/search/?api=1&query=Kappabashi+Street+Japan","website":"","hop":"","transit":false,"info":"Kappabashi Dougu Street התפתח בתחילת המאה ה־20 כאזור של סוחרי ציוד למסעדות וכלי מטבח, והיום משתרע כ־800 מטר עם יותר מ־170 עסקים. הסיפור שלו קשור לעליית תרבות המסעדות העירונית של טוקיו: כשהעיר גדלה, נוצר צורך בריכוז של סכינים, סירים, כלי חרס, שלטים, noren, תבניות וכל פרט שמסעדה צריכה. אחד הסמלים הם דגמי המזון מפלסטיק — sampuru — תעשייה יפנית שהתפתחה במאה ה־20 כדי להציג ללקוחות מנות לפני ההזמנה. הרחוב חושף את 'מאחורי הקלעים' של המטבח היפני: לא רק אוכל, אלא מערכת של מלאכות מדויקות ותשתית שמאפשרת למסעדה להיראות ולעבוד כפי שהיא עובדת.","infoSource":"https://www.gotokyo.org/en/destinations/eastern-tokyo/asakusa/"},{"uid":"2026-11-28-6","part":"צהריים","time":"14:05–14:25","start":845,"end":865,"name":"נסיעה / הליכה ל-Ueno","kind":"מעבר","desc":"","maps":"","website":"","hop":"","transit":true},{"uid":"2026-11-28-7","part":"אחה״צ","time":"14:25–14:50","start":865,"end":890,"name":"Ueno Park","kind":"אטרקציה","desc":"פארק אואנו — מעבר ירוק ונעים בין מתחמי התרבות והמוזיאונים.","maps":"https://www.google.com/maps/search/?api=1&query=Ueno+Park+Tokyo","website":"","hop":"הליכה 0.4 ק״מ","transit":false,"info":"Ueno Park יושב על שטח שהיה בתקופת Edo חלק ממקדש Kan'ei-ji, מקדש חשוב של משפחת Tokugawa שנבנה כדי להגן רוחנית על Edo מצפון־מזרח. ב־1868, בזמן מלחמת Boshin, התחולל באזור קרב Ueno בין כוחות השוגונות לשלטון Meiji, וחלקים גדולים מהמקדש נהרסו. לאחר מכן בחרה ממשלת Meiji להפוך את השטח לפארק ציבורי; Ueno היה בין הפארקים הציבוריים הראשונים ביפן. בהמשך רוכזו סביבו מוזיאונים לאומיים, גן חיות ומוסדות אמנות, ולכן הוא הפך למעין רובע תרבות לאומי. כשעוברים בין המוזיאונים, למעשה הולכים על קרקע שמספרת את המעבר משלטון Tokugawa למדינת Meiji — ממקדש של השוגון למרחב ציבורי של חינוך, מדע ותרבות.","infoSource":"https://www.gotokyo.org/en/destinations/northern-tokyo/ueno/index.html"},{"uid":"2026-11-28-8","part":"אחה״צ","time":"14:55–15:55","start":895,"end":955,"name":"Tokyo National Museum","kind":"אטרקציה","desc":"המוזיאון המרכזי לאמנות, עתיקות והיסטוריה חומרית של יפן. ביקור ממוקד של כשעה כדי לראות Highlights בלי להפוך את היום ליום מוזיאונים בלבד.","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+National+Museum+Ueno","website":"https://www.tnm.jp/?lang=en","hop":"הליכה 0.6 ק״מ","transit":false,"info":"Tokyo National Museum נוסד ב־1872, כאשר נערכה ב־Yushima Seidō תערוכה שנחשבת לפתיחת המוזיאון הראשון ביפן. עצם ההקמה קשורה למדינת Meiji החדשה, שניסתה לקטלג, לשמר ולהציג את התרבות היפנית בזמן של מודרניזציה מהירה. המוסד עבר ל־Ueno ב־1882 וכיום מחזיק אוסף עצום של אמנות, ארכאולוגיה, פסלים בודהיסטיים, קרמיקה, טקסטיל, קליגרפיה, שריון וחרבות, ובהם National Treasures ו־Important Cultural Properties רבים. אחרי ביקור במקדשים וגנים, כאן אפשר לראות את החפצים עצמם מאותן תקופות. המוצגים מתחלפים לעיתים קרובות לצורכי שימור, ולכן אין 'יצירת חובה' קבועה; בזמן שלנו עדיף להתמקד ב־Honkan ובחלקים נבחרים של Heiseikan.","infoSource":"https://www.tnm.jp/modules/r_free_page/index.php?id=155&lang=en"},{"uid":"2026-11-28-9","part":"אחה״צ","time":"16:00–16:55","start":960,"end":1015,"name":"National Museum of Nature and Science","kind":"אטרקציה","desc":"מוזיאון מדע וטבע גדול באואנו. נשאר במסלול; הביקור מתקצר מעט כדי לאפשר גם את Tokyo National Museum.","maps":"https://www.google.com/maps/search/?api=1&query=National+Museum+of+Nature+and+Science+Tokyo","website":"","hop":"הליכה 1.0 ק״מ","transit":false,"info":"המוזיאון הלאומי לטבע ומדע הוא אחד ממוסדות המדע הוותיקים ביפן, עם שורשים בשנות ה־1870 של תקופת Meiji — שנים שבהן המדינה השקיעה בכוונה באיסוף, קטלוג וחינוך מדעי כחלק מהמודרניזציה. הבניין ההיסטורי של Japan Gallery נפתח ב־1931, וצורתו מלמעלה מזכירה מטוס, סמל לאמונה של אותה תקופה במדע ובטכנולוגיה. האוספים עוסקים בטבע, אבולוציה, גאולוגיה, ביולוגיה והיסטוריה של המדע והטכנולוגיה ביפן. זה אינו רק 'מוזיאון לילדים': הוא מספר כיצד יפן עברה ממדינה שנפתחה מחדש לעולם במאה ה־19 למעצמה מדעית ותעשייתית. בזמן המוגבל שלנו עדיף להתמקד ב־Japan Gallery ובכמה נושאים שמעניינים אתכם במקום לנסות לראות הכול.","infoSource":"https://www.kahaku.go.jp/english/"},{"uid":"2026-11-28-10","part":"ערב","time":"17:05–18:00","start":1025,"end":1080,"name":"Ameyoko Market","kind":"אטרקציה","desc":"רחוב שוק צפוף ותוסס ליד Ueno עם אוכל, חנויות ואווירת ערב.","maps":"https://www.google.com/maps/search/?api=1&query=Ameyoko+Market+Tokyo","website":"","hop":"","transit":false,"info":"Ameyoko התפתח במיוחד בשנים שאחרי מלחמת העולם השנייה, כאשר סביב המסילה בין Ueno ל־Okachimachi נוצר שוק שחור למזון ולמוצרים שקשה היה להשיג בתקופת הקיצוב. יש כמה הסברים לשם: ame יכול להתייחס לממתקים שנמכרו כאן, אך רבים קישרו אותו גם ל־'America' בגלל מוצרים אמריקאיים שהגיעו לשוק. במשך העשורים שאחרי המלחמה עבר המקום מכלכלת הישרדות למסחר עממי, וכיום פועלות לאורך כ־500 מטר מאות חנויות ודוכנים. העניין ההיסטורי הוא הניגוד ל־Ueno Park והמוזיאונים הסמוכים: כמה דקות ממוסדות לאומיים מסודרים נכנסים למרחב שנולד מכלכלה לא־רשמית של טוקיו החרבה אחרי 1945. הקולות, הצפיפות והשלטים הם חלק מהחוויה לא פחות מהמוצרים.","infoSource":"https://www.gotokyo.org/en/spot/71/"}],"night":[]},{"id":"2026-11-29","date":"29/11","dow":"ראשון","title":"Imperial Palace East Gardens → Akihabara","subtitle":"מקדש בבוקר, רטרו ביום, קניות בסוף","base":"טוקיו","scope":["טוקיו"],"empty":false,"items":[{"uid":"2026-11-29-0","part":"בוקר","time":"09:00–10:15","start":540,"end":615,"name":"Imperial Palace East Gardens","kind":"אטרקציה","desc":"הגנים המזרחיים של הארמון הקיסרי — שרידי Edo Castle, חומות, גנים ושבילים בלב טוקיו.","maps":"https://www.google.com/maps/search/?api=1&query=Imperial+Palace+East+Gardens+Tokyo","website":"https://www.kunaicho.go.jp/e-event/higashigyoen02.html","hop":"נסיעה קצרה / הליכה ל-Kanda","transit":false,"info":"ה־East Gardens יושבים על הלב ההיסטורי של Edo Castle — אזורי Honmaru, Ninomaru ו־Sannomaru שבהם פעלה שוגונות Tokugawa. מ־1603 ועד 1868 מכאן נוהלה בפועל יפן. הטירה הייתה מערכת עצומה של חומות, שערים וחפירים; המגדל הראשי נשרף ב־1657 ב־Great Fire of Meireki ולא נבנה מחדש, ולכן היום רואים בעיקר את בסיס האבן Tenshudai. אחרי רסטורציית Meiji עבר האתר למשפחה הקיסרית, וחלקים מהשטח נפתחו לציבור כגנים ב־1968. העובדה שאין 'טירה שלמה' היא חלק מהסיפור: החומות והטופוגרפיה מאפשרות לדמיין את קנה המידה של Edo Castle ואת הדרך שבה טוקיו המודרנית נבנתה ממש סביב מרכז הכוח הישן.","infoSource":"https://www.kunaicho.go.jp/en/visit/event/higashigyoen/index.html"},{"uid":"2026-11-29-1","part":"בוקר","time":"10:15–10:40","start":615,"end":640,"name":"נסיעה / הליכה ל-Akihabara","kind":"נסיעה","desc":"מעבר מאזור הארמון ל-Kanda / Akihabara.","maps":"","website":"","hop":"","transit":true},{"uid":"2026-11-29-2","part":"בוקר","time":"10:40–11:20","start":640,"end":680,"name":"Kanda Myojin","kind":"אטרקציה","desc":"מקדש שינטו היסטורי המזוהה היום גם עם Akihabara ותרבות הטכנולוגיה.","maps":"https://www.google.com/maps/search/?api=1&query=Kanda+Myojin+Tokyo","website":"","hop":"הליכה 0.8 ק״מ","transit":false,"info":"Kanda Myojin מייחס את ייסודו לשנת 730, והוא קשור עמוק להיסטוריה של Edo. אחד הסיפורים המרתקים הוא של Taira no Masakado, מורד מהמאה ה־10 שהפך לאחר מותו לדמות רוחנית עוצמתית; לאחר אסונות שיוחסו לרוחו, הוא הונצח במקדש ב־1309. ב־1600, לפני קרב Sekigahara, נערכו כאן תפילות לניצחון של Tokugawa Ieyasu; הניצחון הגיע ביום Kanda Matsuri והמקדש זכה בחסות השוגונות. כיום תחום החסות שלו כולל Kanda, Nihonbashi, Otemachi, Marunouchi ו־Akihabara, ולכן נוצר חיבור נדיר בין מסורת לטכנולוגיה: חברות IT ומפתחים מגיעים לברכות, וקמעות הקשורים למחשבים נמכרים לצד טקסי Shinto עתיקים.","infoSource":"https://www.kandamyoujin.or.jp/profile/"},{"uid":"2026-11-29-3","part":"בוקר","time":"11:30–12:15","start":690,"end":735,"name":"GiGO Arcades","kind":"אטרקציה","desc":"ארקיידים בלב Akihabara — crane games, rhythm games ומשחקי וידאו.","maps":"https://www.google.com/maps/search/?api=1&query=GiGO+Akihabara+Tokyo","website":"","hop":"הליכה 0.4 ק״מ","transit":false,"info":"הארקיידים של GiGO באקיהברה הם יורשים של תקופה שבה שלטי SEGA היו חלק מהנוף של האזור. ב־2021 SEGA העבירה את פעילות מרכזי הבידור שלה ל־GENDA, וב־2022 יצאה מהבעלות והמותג הוחלף ל־GiGO. למרות שינוי השם, התרבות עצמה נמשכה: crane games, משחקי קצב, fighting games, מרוצים ומשחקי ארקייד יפניים. SEGA עצמה תרמה רבות להיסטוריה של הארקייד העולמי, עם כותרים כמו Virtua Fighter ומכונות חדשניות כמו R360. לכן הביקור מעניין לא רק כ'משחקים', אלא כשריד חי לעידן שבו יפן הובילה את תרבות הארקייד הגלובלית. אל תישארו רק בקומת הפרסים; הקומות העליונות בדרך כלל מספרות טוב יותר את הסיפור.","infoSource":"https://www.gendagigo.jp/company_profile/history"},{"uid":"2026-11-29-4","part":"צהריים","time":"12:20–15:20","start":740,"end":920,"name":"Akihabara Retro Game Shopping — Surugaya, Trader, Super Potato, Sofmap, Jan-gle, Retro Game Camp & BOOKOFF","kind":"קניות","desc":"בלוק הקניות המרכזי לרטרו וגיימינג. קוצר מעט כדי לפנות מקום לגנים בבוקר.","maps":"https://www.google.com/maps/search/?api=1&query=Akihabara+Tokyo","website":"","hop":"הליכה 0.6 ק״מ","transit":false},{"uid":"2026-11-29-5","part":"אחה״צ","time":"15:25–16:25","start":925,"end":985,"name":"Mandarake Complex","kind":"חנות","desc":"קומפלקס רב-קומות של manga, anime, toys, collectibles ופריטי יד שנייה.","maps":"https://www.google.com/maps/search/?api=1&query=Mandarake+Complex+Akihabara","website":"","hop":"הליכה 0.8 ק״מ","transit":false},{"uid":"2026-11-29-6","part":"אחה״צ","time":"16:30–17:25","start":990,"end":1045,"name":"Radio Kaikan","kind":"חנות","desc":"בניין אייקוני של Akihabara עם חנויות figures, cards, hobby ו-collectibles.","maps":"https://www.google.com/maps/search/?api=1&query=Akihabara+Radio+Kaikan","website":"","hop":"הליכה 0.5 ק״מ","transit":false},{"uid":"2026-11-29-7","part":"ערב","time":"17:30–18:10","start":1050,"end":1090,"name":"Kotobukiya Akihabara","kind":"חנות","desc":"חנות דגל ל-figures, character goods ו-merchandise.","maps":"https://www.google.com/maps/search/?api=1&query=Kotobukiya+Akihabara","website":"","hop":"הליכה 0.7 ק״מ","transit":false},{"uid":"2026-11-29-8","part":"ערב","time":"18:15–18:50","start":1095,"end":1130,"name":"Bic Camera AKIBA","kind":"חנות","desc":"אלקטרוניקה, גיימינג ומוצרים יפניים.","maps":"https://www.google.com/maps/search/?api=1&query=Bic+Camera+AKIBA","website":"","hop":"הליכה 0.8 ק״מ","transit":false},{"uid":"2026-11-29-9","part":"ערב","time":"18:55–20:00","start":1135,"end":1200,"name":"Yodobashi Akiba","kind":"חנות","desc":"מתחם אלקטרוניקה ענק ליד Akihabara Station.","maps":"https://www.google.com/maps/search/?api=1&query=Yodobashi+Akiba","website":"","hop":"","transit":false}],"night":[]},{"id":"2026-11-30","date":"30/11","dow":"שני","title":"Toyosu → Ariake → Odaiba","subtitle":"indoor, נוף מים וערב","base":"טוקיו","scope":["טוקיו"],"empty":false,"items":[{"uid":"2026-11-30-0","part":"בוקר","time":"08:45–10:00","start":525,"end":600,"name":"Toyosu Market","kind":"חנות","desc":"שוק הסיטונאות המודרני של טוקיו עם מסעדות ותצפיות על פעילות השוק.","maps":"https://www.google.com/maps/search/?api=1&query=Toyosu+Market+Japan","website":"","hop":"הליכה 1.3 ק״מ","transit":false,"info":"Toyosu Market הוא הפרק החדש ביותר בסיפור בן יותר מ־400 שנה של שוקי הדגים של טוקיו. בראשית תקופת Edo הזמין Tokugawa Ieyasu דייגים מאוסקה לספק דגים לטירה, ומתוך הפעילות הזו צמח שוק Nihonbashi. אחרי רעידת Kantō של 1923 נהרס השוק ונבנה מחדש ב־Tsukiji, שנפתח ב־1935. עם צמיחת טוקיו Tsukiji הפך צפוף מדי, וב־2018 עבר השוק הסיטונאי למתקן החדש ב־Toyosu. האתר נבנה על אדמה מיובשת שחלקה נוצרה מפסולת של בניינים שנהרסו ברעידת 1923 — מעגל היסטורי מעניין. גם כיום מכירות פומביות משתמשות במחוות יד מסורתיות, וחלק מהעסקים פועלים ברצף עוד מימי Nihonbashi.","infoSource":"https://www.toyosu-market.or.jp/en/history-of-the-tokyo-fish-market/"},{"uid":"2026-11-30-1","part":"בוקר","time":"10:15–12:00","start":615,"end":720,"name":"teamLab Planets","kind":"אטרקציה","desc":"חוויה דיגיטלית immersive שבה הולכים בתוך מים, מראות ואור.","maps":"https://www.google.com/maps/search/?api=1&query=teamLab+Planets+Japan","website":"","hop":"הליכה 0.8 ק״מ","transit":false,"info":"teamLab Planets נפתח ב־Toyosu ב־2018 כחוויה זמנית שתוכננה לשנים ספורות אך הוארכה שוב ושוב בשל הצלחתה. teamLab, קולקטיב יפני שהוקם ב־2001 ומשלב אמנים, מתכנתים, מהנדסים ואדריכלים, בנה כאן מוזיאון שבו המבקר אינו עומד מול היצירה אלא נכנס לתוכה פיזית — לעיתים יחף ובמים. הרעיון הוא לערער את הגבול בין גוף, אור, צליל וסביבה; עבודות מגיבות לתנועה ולנוכחות ולכן שני ביקורים אינם זהים לגמרי. מה שחשוב בביקור הוא לא למהר לצלם כל דבר: בכמה מהחללים האפקט עובד דווקא כשעומדים, זזים לאט ומרגישים את שינויי המרחב.","infoSource":"https://www.teamlab.art/e/planets/"},{"uid":"2026-11-30-2","part":"צהריים","time":"12:05–13:20","start":725,"end":800,"name":"Senkyaku Banrai","kind":"אטרקציה","desc":"מתחם בסגנון יפני מסורתי עם אוכל, חנויות ואונסן רגליים/מרחצאות.","maps":"https://www.google.com/maps/search/?api=1&query=Senkyaku+Banrai+Japan","website":"","hop":"רכבת 3.1 ק״מ","transit":false,"info":"Toyosu Senkyaku Banrai נפתח בפברואר 2024 ליד Toyosu Market. שמו פירושו בערך 'אלף אורחים באים, עשרת אלפים חוזרים', ביטוי המזוהה עם שגשוג מסחרי. המתחם חדש לחלוטין, אבל עוצב במכוון כדי להזכיר רחובות שוק של Edo: סמטאות, חזיתות עץ ודוכני אוכל שמנסים ליצור חיבור בין שוק הדגים המודרני ביותר של טוקיו לבין הדימוי ההיסטורי של שוק עירוני. זהו מקום מעניין דווקא משום שהוא אינו אותנטי עתיק — הוא פרשנות מודרנית ומתוכננת להיסטוריה. כדאי להשוות אותו ל־Tsukiji: האחד צמח אורגנית במשך עשרות שנים, השני נבנה ב־2024 כדי לייצר חוויית שוק מודעת לעצמה.","infoSource":"https://www.gotokyo.org/en/spot/1858/index.html"},{"uid":"2026-11-30-3","part":"צהריים","time":"13:40–15:30","start":820,"end":930,"name":"Small Worlds","kind":"אטרקציה","desc":"מוזיאון מיניאטורות ענק עם ערים, חלל, אנימה ומערכות מכניות.","maps":"https://www.google.com/maps/search/?api=1&query=Small+Worlds+Japan","website":"","hop":"רכבת 3.2 ק״מ","transit":false,"info":"SMALL WORLDS הוא מוזיאון מיניאטורות גדול ב־Ariake המשתמש בדגמים בקנה מידה של כ־1:80, 3D scanning, תאורה ומנגנוני תנועה כדי ליצור עולמות שלמים. בין המתחמים יש שדה תעופה פעיל במיניאטורה, מרכז חלל ועולמות המבוססים על Evangelion. הוא ממשיך מסורת יפנית חזקה של model-making — מדגמי רכבות ודיאורמות ועד Gunpla — ומחבר אותה לטכנולוגיות ייצור דיגיטליות. הדבר המעניין הוא רמת הסיפור בתוך הפרטים: לא רק 'בניינים קטנים' אלא אנשים, תקלות, תנועה, יום ולילה ואירועים זעירים שנבנו כדי להתגלות מקרוב. נסו להתכופף לגובה הדמויות ולשנות את זווית הראייה; אז המודל מתחיל להרגיש כמו עיר ולא כמו ויטרינה.","infoSource":"https://smallworlds.jp/en/"},{"uid":"2026-11-30-4","part":"צהריים","time":"15:45–16:20","start":945,"end":980,"name":"Odaiba Seaside Park","kind":"אטרקציה","desc":"טיילת ונוף יפה למפרץ, Rainbow Bridge וטוקיו.","maps":"https://www.google.com/maps/search/?api=1&query=Odaiba+Seaside+Park+Japan","website":"","hop":"הליכה 0.5 ק״מ","transit":false,"info":"Odaiba נראית עתידנית, אבל שמה מחזיר לאמצע המאה ה־19. אחרי הגעת 'הספינות השחורות' של קומודור Perry ב־1853, שוגונות Tokugawa בנתה איים מבוצרים במפרץ כדי להגן על Edo מתקיפה ימית; daiba פירושו סוללת תותחים. חלק מהאיים חוברו בהמשך באמצעות ייבוש ים ופיתוח, ובסוף המאה ה־20 האזור תוכנן מחדש כרובע waterfront של בידור, תערוכות וטכנולוגיה. Odaiba Seaside Park יושב על הנוף המלאכותי הזה ומציע משהו חריג בטוקיו — מרחב פתוח מול מים וחוף מלאכותי. לקראת ערב כדאי לחשוב על האבולוציה של המקום: מתשתית צבאית שנועדה להרחיק זרים, לרובע שמכוון במפורש לתיירות בינלאומית ותרבות פופ.","infoSource":"https://www.gotokyo.org/en/spot/39/index.html"},{"uid":"2026-11-30-5","part":"צהריים","time":"16:20–16:35","start":980,"end":995,"name":"Statue of Liberty replica","kind":"אטרקציה","desc":"פסל החירות הקטן של Odaiba עם רקע של המפרץ.","maps":"https://www.google.com/maps/search/?api=1&query=Statue+of+Liberty+replica+Japan","website":"","hop":"הליכה 1.0 ק״מ","transit":false,"info":"פסל החירות באודאיבה הגיע לכאן כחלק מ'שנת צרפת ביפן' בשנים 1998–1999, כאשר העתק צרפתי הוצב זמנית על קו המים כסמל לקשרים בין המדינות. הפסל הפך פופולרי כל כך שאחרי שהעותק המקורי הוחזר לצרפת, נוצר העתק קבוע שנחנך ב־2000. הוא בערך שביעית מגודל הפסל בניו יורק, והקומפוזיציה עם Rainbow Bridge ברקע יוצרת בכוונה נוף גלובלי מאוד. זהו פרט מעניין בהיסטוריה של Odaiba: רובע שנבנה על איים מלאכותיים והפך בשנות ה־90 לחלון ראווה של טוקיו החדשה אימץ גם סמל מערבי מובהק והפך אותו לחלק מהזהות המקומית.","infoSource":"https://www.gotokyo.org/en/spot/363/index.html"},{"uid":"2026-11-30-6","part":"ערב","time":"16:45–17:45","start":1005,"end":1065,"name":"DiverCity Tokyo Plaza","kind":"אטרקציה","desc":"קניון גדול עם Gunda Sun","kind":"אטרקציה","desc":"פסל-מבנה אייקוני ומוזר מ-Expo '70, עם חלל פנימי ייחודי.","maps":"https://www.google.com/maps/search/?api=1&query=Tower+of+the+Sun+Japan","website":"","hop":"","transit":false},{"uid":"2026-12-06-2","part":"בוקר","time":"","start":null,"end":null,"name":"Osaka Castle","kind":"אטרקציה","desc":"אופציונלי כחלופה ל-EXPOCITY, לא בנוסף אם רוצים יום רגוע.","maps":"https://www.google.com/maps/search/?api=1&query=Osaka+Castle+Japan","website":"","hop":"","transit":false},{"uid":"2026-12-06-3","part":"צהריים","time":"","start":null,"end":null,"name":"Tenjinbashi-suji Shopping Street","kind":"חנות","desc":"אופציונלי אם בוחרים במסלול העירוני במקום EXPOCITY.","maps":"https://www.google.com/maps/search/?api=1&query=Tenjinbashi-suji+Shopping+Street+Japan","website":"","hop":"","transit":false},{"uid":"2026-12-06-4","part":"צהריים","time":"","start":null,"end":null,"name":"Nintendo OSAKA","kind":"חנות","desc":"חנות Nintendo גדולה בתוך Daimaru Umeda.","maps":"https://www.google.com/maps/search/?api=1&query=Nintendo+OSAKA+Japan","website":"","hop":"","transit":false},{"uid":"2026-12-06-5","part":"צהריים","time":"","start":null,"end":null,"name":"Umeda Sky Building","kind":"אטרקציה","desc":"בניין אייקוני עם Floating Garden Observatory.","maps":"https://www.google.com/maps/search/?api=1&query=Umeda+Sky+Building+Japan","website":"","hop":"","transit":false},{"uid":"2026-12-06-6","part":"ערב","time":"","start":null,"end":null,"name":"Shinkansen לטוקיו","kind":"אטרקציה","desc":"","maps":"https://www.google.com/maps/search/?api=1&query=Shinkansen+%D7%9C%D7%98%D7%95%D7%A7%D7%99%D7%95+Japan","website":"","hop":"","transit":false},{"uid":"2026-12-06-7","part":"ערב","time":"","start":null,"end":null,"name":"T's Tantan Tokyo Station","kind":"מסעדה / קפה","desc":"אם זמן ההגעה מתאים.","maps":"https://www.google.com/maps/search/?api=1&query=T%27s+Tantan+Tokyo+Station+Japan","website":"","hop":"","transit":false}],"night":[]},{"id":"2026-12-07","date":"07/12","dow":"שני","title":"Tsukiji → Hamarikyu → Ginza → Nihonbashi / Tokyo Station","subtitle":"Ginza מלא · קניות בסוף","base":"טוקיו","scope":["טוקיו"],"empty":false,"items":[{"uid":"2026-12-07-0","part":"בוקר","time":"09:00–10:00","start":540,"end":600,"name":"Tsukiji Outer Market","kind":"אטרקציה","desc":"שוק האוכל החיצוני ההיסטורי של Tsukiji. חנויות, חומרי גלם, ממתקים, כלי מטבח ודוכנים — בעוד השוק הסיטונאי עצמו עבר ל-Toyosu.","maps":"https://www.google.com/maps/search/?api=1&query=Tsukiji+Outer+Market+Tokyo","website":"https://www.tsukiji.or.jp/english/","hop":"הליכה כ-1 ק״מ ל-Hamarikyu","transit":false,"info":"Tsukiji פירושו 'אדמה בנויה', משום שהאזור יובש מהים אחרי Great Fire of Meireki ב־1657. שוק הדגים הגיע לכאן הרבה יותר מאוחר: רעידת Kantō של 1923 החריבה את שוק Nihonbashi, והממשלה העבירה את הפעילות ל־Tsukiji; השוק הסיטונאי החדש נפתח ב־1935 והפך במשך עשרות שנים ללב אספקת המזון של טוקיו. ב־2018 עברו המכירות הפומביות והסיטונאות המרכזית ל־Toyosu, אבל מאות חנויות, מסעדות וספקים נשארו ב־Outer Market. לכן המקום אינו 'השוק הישן שקפא בזמן' אלא רובע מסחרי שהתאים את עצמו אחרי מעבר הליבה שלו. הסתכלו מעבר לסושי: סכינים, אצות, katsuo-bushi, tamagoyaki, תה וכלי מטבח מספרים טוב יותר את התפקיד של Tsukiji כמקום של אנשי מקצוע.","infoSource":"https://www.tsukiji.or.jp/english/"},{"uid":"2026-12-07-1","part":"בוקר","time":"10:10–11:05","start":610,"end":665,"name":"Hamarikyu Gardens","kind":"אטרקציה","desc":"גן יפני היסטורי עם בריכות, בית תה וניגוד יפה לגורדי השחקים.","maps":"https://www.google.com/maps/search/?api=1&query=Hamarikyu+Gardens+Japan","website":"","hop":"הליכה / מטרו קצר ל-Ginza","transit":false,"info":"Hamarikyu התחיל באמצע המאה ה־17 כאשר Matsudaira Tsunashige, קרוב למשפחת Tokugawa, ייבש חלק מהמים הרדודים של Edo Bay ובנה שם אחוזה. כאשר בנו Ienobu הפך לשוגון השישי, האתר עבר לבעלות השוגונות ונודע כ־Hama Goten — 'ארמון החוף'. שוגונים המשיכו לשנות את הגן במשך יותר ממאה שנה, והוא קיבל את צורתו הבסיסית בתקופת השוגון ה־11 Ienari. המאפיין ההיסטורי החשוב ביותר הוא Shioiri-no-ike, בריכה שמקבלת מי ים מהמפרץ וגובהה משתנה עם הגאות — השריד הפעיל היחיד מסוג זה בגני טוקיו. אחרי רסטורציית Meiji הפך המקום לארמון משנה קיסרי וב־1945 הועבר לעיר. הניגוד בין בית התה והבריכה לבין גורדי השחקים של Shiodome הוא מהנופים הטובים בעיר להבנת 350 שנות שינוי.","infoSource":"https://www.tokyo-park.or.jp/teien/en/hama-rikyu/outline.html"},{"uid":"2026-12-07-2","part":"בוקר","time":"11:15–11:40","start":675,"end":700,"name":"Kabukiza Theatre","kind":"אטרקציה","desc":"עצירה קצרה בבית הקבוקי האייקוני של גינזה — אדריכלות ותרבות, בלי להקדיש שעות להופעה מלאה.","maps":"https://www.google.com/maps/search/?api=1&query=Kabukiza+Theatre+Ginza+Tokyo","website":"https://www.kabukiweb.net/theatres/kabukiza/","hop":"הליכה 0.4 ק״מ","transit":false,"info":"Kabukiza נפתח לראשונה ב־1889, בשיא תקופת Meiji, כחלק מניסיון להציג kabuki כאמנות במה לאומית מכובדת בתקופה שבה יפן הגדירה את עצמה מחדש מול המערב. ההיסטוריה של הבניין היא רצף של הרס ושיקום: הוא נבנה מחדש ב־1911, נשרף מתקלה חשמלית ב־1921, הבנייה שלאחר מכן נפגעה ברעידת Kantō של 1923, המבנה השלישי נפתח ב־1925 ונחרב בהפצצות טוקיו ב־1945. התיאטרון שלאחר המלחמה נפתח ב־1951, והגרסה החמישית והנוכחית נפתחה ב־2013 תוך שמירה על חזית מסורתית לצד מגדל מודרני. לכן Kabukiza הוא לא רק בניין יפה אלא סיפור על ההתמדה של kabuki דרך שריפות, רעידות אדמה, מלחמה ומודרניזציה.","infoSource":"https://www.kabukiweb.net/about/theatre/history_kabukiza_theatre/"},{"uid":"2026-12-07-3","part":"בוקר","time":"11:45–12:15","start":705,"end":735,"name":"Ginza Mitsukoshi Depachika","kind":"אטרקציה","desc":"קומת האוכל התת-קרקעית של Mitsukoshi — הצצה לתרבות ה-depachika. לא הארוחה העיקרית של היום.","maps":"https://www.google.com/maps/search/?api=1&query=Ginza+Mitsukoshi+Tokyo","website":"https://cp.mistore.jp/global/en/ginza.html","hop":"באותו בניין של Art Aquarium","transit":false,"info":"ה-Depachika של Ginza Mitsukoshi הוא עולם אוכל שלם בקומות המרתף של כלבו יפני קלאסי. אפשר לראות שם קונדיטוריה, wagashi, מנות מוכנות, חומרי גלם ומתנות אוכל ברמת תצוגה גבוהה מאוד. המטרה אצלנו היא להכיר את תרבות בתי הכלבו היפנית ולעשות סיבוב קצר לפני Art Aquarium שנמצא באותו מתחם."},{"uid":"2026-12-07-4","part":"צהריים","time":"12:20–13:15","start":740,"end":795,"name":"Art Aquarium Museum","kind":"אטרקציה","desc":"מיצגי אמנות ותאורה סביב אקווריומים של דגי זהב בתוך Ginza Mitsukoshi.","maps":"https://www.google.com/maps/search/?api=1&query=Art+Aquarium+Museum+Ginza","website":"","hop":"הליכה 0.2 ק״מ","transit":false,"info":"Art Aquarium Ginza הוא מוסד עכשווי, אבל חומר הגלם שלו — goldfish — נושא היסטוריה יפנית ארוכה. דגי זהב הגיעו ליפן מסין כבר בתקופת Muromachi, ובתקופת Edo גידולם התפשט מעבר לאליטות והפך לתרבות פנאי עירונית. אמנים כמו Utagawa Kuniyoshi שילבו goldfish ב־ukiyo-e, ובמהלך השנים פותחו ביפן זנים מקומיים רבים. המוזיאון משתמש בדגים חיים בתוך מיצבי תאורה, כלי זכוכית, Kutani ware ומוטיבים מסורתיים כדי להפוך מסורת גידול וצפייה למופע עכשווי. כדאי להסתכל גם על הזנים עצמם — ryukin, ranchu, tosakin ואחרים — ולא רק על האפקטים. חשוב להבין שזה אינו מוזיאון טבע קלאסי אלא מפגש בין בעלי חיים, מסורת דקורטיבית ו־entertainment מודרני.","infoSource":"https://artaquarium.jp/enjoy/tradition/"},{"uid":"2026-12-07-5","part":"צהריים","time":"13:20–13:45","start":800,"end":825,"name":"Nissan Crossing","kind":"אטרקציה","desc":"חלל תצוגה עתידני של Nissan עם רכבים וטכנולוגיה.","maps":"https://www.google.com/maps/search/?api=1&query=Nissan+Crossing+Ginza","website":"","hop":"הליכה 0.2 ק״מ","transit":false,"info":"NISSAN CROSSING יושב בצומת Ginza 4-chome, אחד הצמתים הסמליים ביותר של טוקיו, וממשיך מסורת של Nissan להציג בגינזה את הצד החדשני של החברה. החלל הנוכחי נפתח כחלק מ־GINZA PLACE ב־2016 ונועד להיות פחות showroom של מכירות ויותר במה לטכנולוגיה, design ו־Intelligent Mobility. העובדה שחברת רכב מציבה כאן concept cars וטכנולוגיות עתידיות מתאימה להיסטוריה של Ginza כחלון ראווה ליפן המודרנית מאז Meiji — אזור שבו חידושים מערביים, תאורה, בתי כלבו ומותגים הופיעו מוקדם יחסית. אין דגם אחד שחייבים לראות כי התצוגה משתנה; מה שמעניין הוא האופן שבו המכונית מוצגת כאובייקט של עיצוב וטכנולוגיה בלב רובע מסחר היסטורי.","infoSource":"https://www.nissan.co.jp/CROSSING/"},{"uid":"2026-12-07-6","part":"צהריים","time":"13:50–14:30","start":830,"end":870,"name":"Sony Park Ginza","kind":"אטרקציה","desc":"מתחם תרבות/טכנולוגיה של Sony עם תערוכות מתחלפות.","maps":"https://www.google.com/maps/search/?api=1&query=Sony+Park+Ginza+Japan","website":"","hop":"הליכה 0.6 ק״מ","transit":false,"info":"Ginza Sony Park ממשיך סיפור שהתחיל ב־1966, כאשר Akio Morita, ממייסדי Sony, פתח את Sony Building בגינזה. בפינת הבניין הוא השאיר שטח ציבורי קטן של כ־33 מ״ר שכינה 'Garden of Ginza' — מחווה חריגה ברחוב מסחרי יקר. הבניין נסגר ב־2017, ובמקום להקים מיד מגדל חדש Sony פתחה ב־2018 פארק זמני פתוח שהפך בעצמו להצלחה. הגרסה החדשה של Ginza Sony Park נפתחה ב־2025, בבניין שנבנה נמוך בכוונה מהסביבה כדי ליצור תחושת פתיחות. הרעיון הוא לא חנות דגל רגילה אלא מרחב ציבורי של מוזיקה, אמנות, אוכל וטכנולוגיה. לכן המקום מעניין גם כפרויקט עירוני: חברה פרטית בחרה לשמר רעיון של 'מרווח' פתוח בלב אחד האזורים היקרים בעיר.","infoSource":"https://www.sonypark.com/e/"},{"uid":"2026-12-07-7","part":"אחה״צ","time":"14:35–15:25","start":875,"end":925,"name":"GINZA SIX + Rooftop Garden","kind":"אטרקציה","desc":"אדריכלות, אמנות ציבורית וגינת גג גדולה מעל גינזה. זו עצירת תרבות/עיצוב, לא עוד בלוק קניות.","maps":"https://www.google.com/maps/search/?api=1&query=GINZA+SIX+Tokyo","website":"https://ginza6.tokyo/","hop":"נסיעה קצרה ל-Tokyo Station","transit":false,"info":"GINZA SIX נפתח ב־2017 על האתר שבו עמד קודם Matsuzakaya Ginza, אחד מבתי הכלבו הוותיקים באזור. הפרויקט איחד כמה חלקות גדולות בלב גינזה ונבנה סביב רעיון של מסחר כתרבות: מעבר לחנויות יש בו אמנות ציבורית, תערוכות, GINZA TSUTAYA BOOKS וגינת גג רחבה. האטריום המרכזי מארח יצירות מתחלפות של אמנים יפנים ובינלאומיים, כך שהמבנה מתפקד במידה מסוימת גם כגלריה ציבורית. גינת הגג מעניינת משום שהיא מכניסה שטח פתוח ממש מעל אחד הרחובות היקרים והצפופים ביפן. אצלנו כדאי להתייחס למקום פחות כקניון ויותר כחלק מהסיפור של Ginza — אזור שמאז Meiji משתמש באדריכלות, חדשנות ותצוגה כדי להציג בכל דור את 'היפן החדשה'.","infoSource":"https://ginza6.tokyo/art_en/"},{"uid":"2026-12-07-8","part":"אחה״צ","time":"15:45–16:35","start":945,"end":995,"name":"T’s Tantan Tokyo Station","kind":"מסעדה / אוכל","desc":"ראמן טבעוני בתחנת Tokyo Station — ארוחה בטוחה ללא בשר, דגים או dashi.","maps":"https://www.google.com/maps/search/?api=1&query=T%27s+Tantan+Tokyo+Station","website":"","hop":"הליכה / רכבת קצרה","transit":false},{"uid":"2026-12-07-9","part":"אחה״צ","time":"16:50–17:40","start":1010,"end":1060,"name":"Pokémon Center TOKYO DX","kind":"אטרקציה","desc":"Pokémon Center גדול בניהונבאשי עם מרצ'נדייז רחב ומוצרים בלעדיים.","maps":"https://www.google.com/maps/search/?api=1&query=Pokemon+Center+TOKYO+DX+Nihonbashi","website":"","hop":"הליכה / מטרו קצר","transit":false},{"uid":"2026-12-07-10","part":"ערב","time":"17:50–18:15","start":1070,"end":1095,"name":"Tokyo Station Marunouchi","kind":"אטרקציה","desc":"חזית הלבנים ההיסטורית של תחנת טוקיו והאזור המודרני סביבה.","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+Station+Marunouchi+Japan","website":"","hop":"הליכה 0.5 ק״מ","transit":false,"info":"Tokyo Station נפתחה ב־1914 כבניין השער של הבירה המודרנית, לפי תכנון האדריכל Tatsuno Kingo. חזית Marunouchi האדומה שרדה את רעידת Kantō של 1923 כמעט ללא נזק משמעותי, אבל בהפצצות 1945 נשרפו הגגות וחלקים נרחבים; בשיקום שלאחר המלחמה נבנתה התחנה בגובה נמוך יותר וללא הכיפות המקוריות. בין 2007 ל־2012 בוצע פרויקט שימור גדול שהחזיר את הקומה השלישית ואת הכיפות לפי התכנון ההיסטורי, תוך התאמה לתשתיות של תחנה שמשרתת היום רכבות עירוניות ו־Shinkansen לכל המדינה. הבניין הוכר כ־Important Cultural Property. צאו לכיכר Marunouchi לראות את החזית בשלמותה ואז היכנסו מתחת לכיפות — שם מרגישים היטב את החיבור בין היסטוריה לתחנת־על מודרנית.","infoSource":"https://www.gotokyo.org/en/story/walks-and-tours/tokyo-architecture-tokyo-station/index.html"},{"uid":"2026-12-07-11","part":"ערב","time":"18:20–18:55","start":1100,"end":1135,"name":"Tokyo Character Street","kind":"חנות","desc":"מסדרון חנויות דמויות בתחנת Tokyo: anime, TV, mascots ועוד.","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+Character+Street","website":"","hop":"הליכה / מטרו קצר ל-Ginza","transit":false},{"uid":"2026-12-07-12","part":"ערב / קניות","time":"19:05–19:40","start":1145,"end":1180,"name":"MUJI Ginza","kind":"חנות","desc":"סניף דגל רב קומות של MUJI.","maps":"https://www.google.com/maps/search/?api=1&query=MUJI+Ginza+Japan","website":"","hop":"הליכה 0.5 ק״מ","transit":false},{"uid":"2026-12-07-13","part":"ערב / קניות","time":"19:45–20:20","start":1185,"end":1220,"name":"UNIQLO Ginza","kind":"חנות","desc":"סניף ענק ורב קומות של UNIQLO.","maps":"https://www.google.com/maps/search/?api=1&query=UNIQLO+Ginza+Japan","website":"","hop":"","transit":false}],"night":[]},{"id":"2026-12-08","date":"08/12","dow":"שלישי","title":"Azabudai + Roppongi","subtitle":"אמנות ביום, תצפית בשקיעה, BOOKOFF בסוף","base":"טוקיו","scope":["טוקיו"],"empty":false,"items":[{"uid":"2026-12-08-0","part":"בוקר","time":"09:30–12:00","start":570,"end":720,"name":"teamLab Borderless","kind":"אטרקציה","desc":"מוזיאון אמנות דיגיטלית ללא מסלול קבוע, עם חללים שמשתנים ומתחברים זה לזה.","maps":"https://www.google.com/maps/search/?api=1&query=teamLab+Borderless+Japan","website":"","hop":"הליכה 0.2 ק״מ","transit":false,"info":"teamLab Borderless נפתח לראשונה ב־Odaiba ב־2018 כמוזיאון של teamLab ו־Mori Building, נסגר ב־2022 עם פיתוח מחדש של האזור ונפתח מחדש בפברואר 2024 ב־Azabudai Hills. המושג 'Borderless' הוא לב החוויה: יצירות אינן כלואות בחדרים, אלא נודדות בין חללים, נפגשות ומשתנות בהתאם לנוכחות המבקרים. לכן אין מסלול נכון ואין בהכרח שלטים ליד כל יצירה. המעבר מ־Odaiba ל־Azabudai הוא גם סיפור עירוני: מוסד דיגיטלי שנולד באזור waterfront עתידני הפך לעוגן תרבותי בפרויקט התחדשות בלב העיר. בניגוד ל־Planets, כאן החוויה היא של שיטוט, אובדן גבולות וגילוי.","infoSource":"https://www.teamlab.art/e/tokyo/"},{"uid":"2026-12-08-1","part":"בוקר","time":"12:05–13:05","start":725,"end":785,"name":"Azabudai Hills","kind":"אטרקציה","desc":"מתחם חדש ומעוצב עם אדריכלות, אוכל, חנויות ושטחים ירוקים.","maps":"https://www.google.com/maps/search/?api=1&query=Azabudai+Hills+Japan","website":"","hop":"הליכה 1.4 ק״מ","transit":false,"info":"Azabudai Hills נפתח ב־2023 אחרי יותר משלושה עשורים של תכנון ופינוי־בינוי מורכב בשטח של כ־8.1 הקטר. Mori Building הגדירה אותו כ־Modern Urban Village סביב שני רעיונות: Green ו־Wellness. לפני הפיתוח האזור היה פסיפס צפוף של רחובות צרים ובניינים קטנים; הפרויקט איחד קרקע, בנה מגדלים, מגורים, בית ספר, גלריות, מסחר ו־teamLab Borderless, ובמקביל הגדיל את השטח הירוק לכ־24,000 מ״ר — יותר מפי חמישה מהמצב הקודם. מבחינה היסטורית הוא מייצג שלב חדש בהתחדשות טוקיו: לא עוד מגדל יחיד אלא 'עיר בתוך עיר'. הסתכלו בעיקר על המרחבים שבין הבניינים, כי שם נמצא הרעיון האורבני האמיתי.","infoSource":"https://www.azabudai-hills.com/about/index.html"},{"uid":"2026-12-08-2","part":"צהריים","time":"13:25–14:35","start":805,"end":875,"name":"21_21 Design Sight","kind":"אטרקציה","desc":"מוזיאון/חלל עיצוב במתחם Tokyo Midtown שתוכנן בשיתוף Tadao Ando, עם תערוכות מתחלפות של עיצוב ותרבות.","maps":"https://www.google.com/maps/search/?api=1&query=21_21+Design+Sight+Japan","website":"","hop":"הליכה 1.1 ק״מ","transit":false,"info":"21_21 DESIGN SIGHT נולד מחלום של Issey Miyake ליצור ביפן מקום שמלמד 'לראות' עיצוב. כבר משנות ה־70 וה־80 הוא דיבר על הצורך במוזיאון עיצוב עם יוצרים כמו Isamu Noguchi, Ikko Tanaka, Shiro Kuramata ו־Tadao Ando; מאמר שפרסם ב־2003 האיץ את היוזמה, והמקום נפתח ב־Tokyo Midtown ב־2007. Tadao Ando תכנן מבנה שרובו שקוע בקרקע, עם גג פלדה מקופל שמרמז על רעיון A Piece of Cloth של Miyake. אפילו השם 21_21 משחק על ראייה חדה ועל 'נקודת מבט'. בזמן הביקור שלנו, 8/12/2026, מוצגת לפי התוכנית הרשמית Learning from “Hōjōki”: Tiny Architecture Reweaves Life, שלוקחת טקסט יפני מהמאה ה־13 ובוחנת דרכו מגורים קטנים, ארכיטקטורה וחיים. כדאי להסתכל על הבניין לא פחות מאשר על התערוכה.","infoSource":"https://www.2121designsight.jp/en/designsight/"},{"uid":"2026-12-08-3","part":"צהריים","time":"14:50–16:15","start":890,"end":975,"name":"Mori Art Museum","kind":"אטרקציה","desc":"מוזיאון לאמנות עכשווית בקומות העליונות של Roppongi Hills.","maps":"https://www.google.com/maps/search/?api=1&query=Mori+Art+Museum+Japan","website":"","hop":"הליכה 0.1 ק״מ","transit":false,"info":"Mori Art Museum נפתח באוקטובר 2003 בקומות העליונות של Mori Tower כחלק מהחזון של Roppongi Hills להיות 'Cultural Heart of the City'. מייסד הפרויקט, Mori Minoru, רצה שמוזיאון לאמנות עכשווית יהיה חלק מהחיים העירוניים ולא בניין מבודד. תערוכת הפתיחה, Happiness: A Survival Guide for Art and Life, כבר הציגה את הקו הזה — חיבור בין אמנות לשאלות רחבות של חיים וחברה. לאורך השנים המוזיאון בנה מוניטין בתערוכות של אמנות ואדריכלות עכשווית מיפן ומאסיה לצד יוצרים בינלאומיים. הוא אינו נשען על אוסף קבוע גדול אלא על תערוכות מתחלפות, ולכן חשוב לבדוק סמוך לביקור מה מוצג בפועל.","infoSource":"https://www.mori.art.museum/en/about/index.html"},{"uid":"2026-12-08-4","part":"שקיעה + ערב","time":"16:20–17:10","start":980,"end":1030,"name":"Roppongi Hills","kind":"אטרקציה","desc":"מתחם עירוני עם קניות, אמנות ותצפיות.","maps":"https://www.google.com/maps/search/?api=1&query=Roppongi+Hills+Japan","website":"","hop":"הליכה 1.8 ק״מ","transit":false,"info":"Roppongi Hills נפתח באפריל 2003 לאחר תהליך פיתוח שנמשך יותר מ־15 שנה ושילב מאות בעלי קרקע. Mori Building רצתה ליצור 'עיר אנכית' שבה עבודה, מגורים, תרבות, מסחר ופנאי מתקיימים יחד, והפרויקט הפך למודל לפרויקטים מאוחרים יותר. לקרקע יש היסטוריה מוקדמת בהרבה: חלק מהאזור היה אחוזת Mōri מתקופת Edo; ב־1849 נולד כאן Nogi Maresuke, לימים גנרל מפורסם, ובמאה ה־20 פעלו במקום בין היתר מפעל של Nikka Whisky ומתחמי TV Asahi. Mōri Garden שבמתחם משמר זיכרון מהעבר הזה. Roppongi Hills לכן אינו רק 'קניון עם מגדל', אלא שכבה חדשה שנבנתה על אתר שעבר מאחוזת daimyo לתעשייה, טלוויזיה ולבסוף פרויקט עירוני־תרבותי.","infoSource":"https://www.roppongihills.com/green/mohri/history.html"},{"uid":"2026-12-08-5","part":"שקיעה + ערב","time":"17:20–18:00","start":1040,"end":1080,"name":"נסיעה ל-Omori","kind":"מעבר","desc":"","maps":"","website":"","hop":"","transit":true},{"uid":"2026-12-08-6","part":"שקיעה + ערב","time":"18:20–19:50","start":1100,"end":1190,"name":"BOOKOFF SUPER BAZAAR SEIYU Omori Store","kind":"חנות","desc":"סניף BOOKOFF SUPER BAZAAR גדול בטוקיו עם ספרים, CD/DVD/Blu-ray, טלפונים, אלקטרוניקה, מוצרי חשמל, כלי נגינה, אופנה, כרטיסי אספנות, צעצועים, מותגים","maps":"https://www.google.com/maps/search/?api=1&query=BOOKOFF+SUPER+BAZAAR+SEIYU+Omori+Store+Tokyo+Japan","website":"","hop":"","transit":false}],"night":[{"name":"Tokyo City View","desc":"תצפית גבוהה על העיר מ-Roppongi Hills.","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+City+View+Japan"},{"name":"Tokyo Tower","desc":"המגדל האייקוני של טוקיו עם תצפיות ועיצוב רטרו.","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+Tower+Japan"}]},{"id":"2026-12-09","date":"09/12","dow":"רביעי","title":"Autumn Gardens → Ikebukuro","subtitle":"יום יציאה, מסיימים מוקדם","base":"טוקיו · טיסה 23:00","scope":["טוקיו"],"empty":false,"items":[{"uid":"2026-12-09-0","part":"בוקר","time":"09:00–10:00","start":540,"end":600,"name":"Koishikawa Korakuen","kind":"אטרקציה","desc":"אחד הגנים היפניים העתיקים בטוקיו, עם בריכות, גשרים ושלכת.","maps":"https://www.google.com/maps/search/?api=1&query=Koishikawa+Korakuen+Japan","website":"","hop":"רכבת 3.3 ק״מ","transit":false,"info":"Koishikawa Kōrakuen החל להיבנות ב־1629 עבור Tokugawa Yorifusa, מייסד ענף Mito של משפחת Tokugawa, והושלם בימי בנו Mitsukuni. Mitsukuni היה מלומד והושפע מהחוקר הסיני Zhu Shunshui, ולכן הגן משלב נופים ורעיונות סיניים עם מסורת גן יפנית: Full Moon Bridge, ייצוגים של נופים סיניים ומוטיבים ספרותיים. גם השם Kōrakuen מגיע מטקסט קונפוציאני על שליט שצריך 'לדאוג לפני העם וליהנות אחריו'. הגן בנוי סביב אגם וגבעות ומיועד לשיטוט שבו הנוף משתנה כל הזמן. כיום Tokyo Dome והעיר המודרנית מציצים מעבר לעצים, מה שמחדד כמה נדיר שהגן הזה שרד בלב טוקיו במשך כמעט ארבע מאות שנה.","infoSource":"https://www.tokyo-park.or.jp/teien/en/koishikawa/outline.html"},{"uid":"2026-12-09-1","part":"בוקר","time":"10:25–11:25","start":625,"end":685,"name":"Rikugien Garden","kind":"אטרקציה","desc":"גן יפני קלאסי ומרהיב במיוחד בשלכת, לעיתים עם תאורת ערב עונתית.","maps":"https://www.google.com/maps/search/?api=1&query=Rikugien+Garden+Japan","website":"","hop":"","transit":false,"info":"Rikugien נבנה ב־1702 בידי Yanagisawa Yoshiyasu, יועץ קרוב לשוגון החמישי Tokugawa Tsunayoshi. הוא לא תכנן 'פארק טבעי' אלא נוף ספרותי: גבעות מלאכותיות, אגם ואיים נבנו סביב דימויים מתוך שירת waka וקלאסיקות סיניות, והגן כלל ייצוגים של עשרות נופים ספרותיים. אפילו השם Rikugien מתייחס ל'שש הקטגוריות' של השירה. בתקופת Meiji רכש אותו Iwasaki Yatarō, מייסד Mitsubishi, ומשפחת Iwasaki תרמה אותו לעיר טוקיו ב־1938; ב־1953 הוכר כ־Special Place of Scenic Beauty. זהו גן שצריך 'לקרוא' בהליכה: בכל סיבוב השביל מסתיר ומגלה תמונה חדשה. חשוב למסלול שלנו: תאורת השלכת המיוחדת של 2026 מסתיימת ב־6/12, ולכן ב־9/12 זה ביקור יום רגיל.","infoSource":"https://www.tokyo-park.or.jp/teien/en/rikugien/outline.html"},{"uid":"2026-12-09-2","part":"בוקר","time":"11:25–11:55","start":685,"end":715,"name":"נסיעה ל-Ikebukuro","kind":"מעבר","desc":"","maps":"","website":"","hop":"","transit":true},{"uid":"2026-12-09-3","part":"צהריים","time":"12:00–13:00","start":720,"end":780,"name":"Neco Republic Ikebukuro rescue cat café","kind":"אטרקציה","desc":"בית קפה עם חתולי הצלה ואימוץ. מתאים יותר למי שמעדיף מודל עם רווחת בעלי חיים.","maps":"https://www.google.com/maps/search/?api=1&query=Neco+Republic+Ikebukuro+rescue+cat+caf%C3%A9+Japan","website":"","hop":"הליכה 0.9 ק״מ","transit":false,"info":"Neco Republic מייצג גל חדש יותר של cat cafés ביפן: במקום להחזיק חתולים רק כחלק מבילוי, המודל משלב בית קפה עם הצלה, חשיפה לאימוץ וגיוס תמיכה לרווחת חתולים. בכך הוא לוקח פורמט שהפך לסמל תיירותי יפני ומוסיף לו תפקיד חברתי. החתולים במקום הם בעלי חיים עם היסטוריה ואפשרות לבית חדש, ולכן הביקור שונה מחוויה שבה החיות הן רק תפאורה. זה מעניין במיוחד בתוך Ikebukuro, אזור שמלא ב־character cafés ובידור ממוסחר: כאן הקשר עם בעלי החיים נועד גם לעודד אחריות. בביקור חשוב לכבד את כללי המגע, השינה, ההאכלה והצילום ולתת לחתולים לבחור אם להתקרב.","infoSource":"https://www.neco-republic.jp/"},{"uid":"2026-12-09-4","part":"צהריים","time":"13:10–14:40","start":790,"end":880,"name":"Sunshine Aquarium","kind":"אטרקציה","desc":"אקווריום עירוני עם פינגווינים, לוטרות ותצוגות יצירתיות.","maps":"https://www.google.com/maps/search/?api=1&query=Sunshine+Aquarium+Japan","website":"","hop":"הליכה 0.1 ק״מ","transit":false,"info":"Sunshine Aquarium נפתח ב־1978 כחלק מ־Sunshine City, על גג World Import Mart באיקבוקורו, והיה אחד האקווריומים העירוניים הגבוהים והחריגים ביפן. ב־2011 עבר שיפוץ גדול והוגדר מחדש כ־'Oasis in the Sky'. במקום לנסות לחקות אקווריום חופי גדול, הוא משתמש דווקא במיקום בתוך צפיפות עירונית: מיכלים וחיות מים מול שמיים וגורדי שחקים. המוצג המזוהה ביותר הוא Penguins in the Sky, שבו פינגווינים שוחים במיכל תלוי ונראים כאילו הם 'עפים' מעל טוקיו. למקום יש גם פעילות שימור, כולל פרויקטים הקשורים לשוניות אלמוגים. ההיסטוריה שלו מספרת כיצד Ikebukuro של שנות ה־70 ניסה לבנות עיר שלמה בתוך קומפלקס אחד — מסחר, משרדים, בידור ואפילו אקווריום על הגג.","infoSource":"https://sunshinecity.jp/en/aquarium/area/"},{"uid":"2026-12-09-5","part":"צהריים","time":"14:45–15:45","start":885,"end":945,"name":"NAMJATOWN","kind":"אטרקציה","desc":"פארק indoor קטן ומשונה עם מתקנים, אוכל ודמויות.","maps":"https://www.google.com/maps/search/?api=1&query=NAMJATOWN+Japan","website":"","hop":"הליכה 0.1 ק״מ","transit":false,"info":"NAMJATOWN נפתח ב־6 ביולי 1996 ב־Sunshine City תחת השם Sunshine Namja Town, וב־2026 הוא חוגג 30 שנה. Bandai Namco בנתה אותו כפארק מקורה שמבוסס על 'עיר' של סמטאות, דמויות, משחקים ואוכל — לא על רכבות הרים ענקיות. ב־2002 נפתח בו Ikebukuro Gyoza Stadium, אחד החלוצים של food theme parks; בהמשך נוספו אזורי רוחות, חתולים ונינג'ה ושיתופי פעולה עם anime הפכו לחלק מרכזי מהזהות. ב־2026 בוצע שיפוץ משמעותי לרגל 30 שנה ונוספה בין היתר אטרקציית Taiko no Tatsujin גדולה. זו דוגמה טובה לאופן שבו Bandai Namco עברה ממשחקים ומכונות ארקייד ל־location-based entertainment — עולם פיזי שמבוסס על דמויות ו־IP.","infoSource":"https://bandainamco-am.co.jp/tp/namja/NEWS/info/20260618_1.html"},{"uid":"2026-12-09-6","part":"צהריים","time":"15:50–16:20","start":950,"end":980,"name":"Pikachu Sweets by Pokémon Cafe","kind":"מסעדה / אוכל","desc":"דוכן Pokémon Café בסגנון takeaway ליד Pokémon Center MEGA TOKYO, עם משקאות וקינוחים בעיצוב Pokémon.","maps":"https://www.google.com/maps/search/?api=1&query=Pikachu+Sweets+by+Pokemon+Cafe+Sunshine+City+Japan","website":"","hop":"הליכה 0.1 ק״מ","transit":false},{"uid":"2026-12-09-7","part":"צהריים","time":"16:25–17:25","start":985,"end":1045,"name":"Pokémon Center MEGA TOKYO","kind":"אטרקציה","desc":"אחד ממרכזי Pokémon הגדולים בטוקיו, בתוך Sunshine City באיקבוקורו, עם מבחר גדול של מרצ'נדייז ומוצרים בלעדיים.","maps":"https://www.google.com/maps/search/?api=1&query=Pokemon+Center+MEGA+TOKYO+Sunshine+City+Japan","website":"","hop":"","transit":false},{"uid":"2026-12-09-8","part":"יציאה","time":"17:25–18:15","start":1045,"end":1095,"name":"חזרה למלון / איסוף מזוודות","kind":"מעבר","desc":"","maps":"","website":"","hop":"","transit":true},{"uid":"2026-12-09-9","part":"יציאה","time":"18:15","start":1095,"end":1095,"name":"יציאה לשדה התעופה","kind":"מעבר","desc":"","maps":"","website":"","hop":"","transit":true}],"night":[]}],"places":[{"id":"p_4921768b0a22","name":"Shibuya PARCO — Nintendo, Pokémon, CAPCOM, JUMP, JoJo & SEGA","city":"טוקיו","area":"Shibuya + Harajuku","status":"חובה","kind":"attraction","desc":"מרכז גיימינג ותרבות פופ מרוכז ב־6F של Shibuya PARCO. באותה קומה נמצאים Nintendo TOKYO, Pokémon Center Shibuya, CAPCOM STORE TOKYO, JUMP SHOP, THE★JOJO WORLD ו־SEGA STORE TOKYO. מומלץ להקדיש 1.5–2.5 שעות כדי לעבור בין כל החנויות, לקנות מוצרים בלעדיים ולצלם בלי להתרוצץ בין אזורים שונים.","duration":"1.5–2.5 שעות","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Shibuya+PARCO+Tokyo+Japan","booking":"","website":""},{"id":"p_d72692980dd3","name":"Shibuya Crossing","city":"טוקיו","area"
