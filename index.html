60–75 דק׳","kyotoMinutes":65,"desc":"מוזיאון במבשלת sake היסטורית שמסביר את ייצור הסאקה והמסורת של Fushimi.","info":"המסמך 2111 הציע את המוזיאון כעוגן של אזור הסאקה, לא רק כטעימה. התצוגות מציגות כלי ייצור מסורתיים, תפקיד המים, האורז, koji והתסיסה. כך Fushimi הופך משכונה יפה לסיפור של תעשייה ומלאכה מקומית.","kyotoWhy":"מוסיף תוכן אמיתי לרובע Fushimi; טוב גם אם לא שותים הרבה.","kyotoCombine":"Fushimi Sake District + canal walk.","kyotoSources":["2111"],"maps":"https://www.google.com/maps/search/?api=1&query=Gekkeikan+Okura+Sake+Museum+Kyoto","youtube":"https://www.youtube.com/results?search_query=Gekkeikan+Okura+Sake+Museum+Kyoto","website":"","kyotoCandidate":true,"note":"","booking":""},{"id":"ky_fushimi_canal","name":"Fushimi Canal & Brewery Streets","city":"קיוטו","area":"Fushimi","status":"רוצה","kind":"attraction","duration":"45–75 דק׳","kyotoMinutes":60,"desc":"הליכה רגועה בין תעלות, בתי מבשלה, מחסנים וגשרים ברובע Fushimi.","info":"במסמך 2111 הודגש שלא כדאי להפוך את אזור הסאקה רק לביקור במוזיאון. אחרי Gekkeikan מומלץ להסתובב ברחובות, לראות את הבנייה המסורתית, חביות הסאקה והתעלות ששימשו בעבר להובלה. זה חלק נינוח ושונה לחלוטין מהמסלול של המקדשים.","kyotoWhy":"מוסיף 'קיוטו חיה' ושקטה, כמעט בלי לחץ של אתר רשמי.","kyotoCombine":"Gekkeikan + Fushimi Sake District.","kyotoSources":["2111"],"maps":"https://www.google.com/maps/search/?api=1&query=Fushimi+Sake+District+Kyoto+canal","youtube":"https://www.youtube.com/results?search_query=Fushimi+sake+district+Kyoto+walk","website":"","kyotoCandidate":true,"note":"","booking":""},{"id":"ky_manga_museum","name":"Kyoto International Manga Museum","city":"קיוטו","area":"Central Kyoto","status":"רוצה","kind":"experience","duration":"60–120 דק׳","kyotoMinutes":90,"desc":"מוזיאון/ספרייה עם מאות אלפי פריטי מנגה, תערוכות והיסטוריה של המדיום.","info":"במסמך 2211 המוזיאון נבחר בכוונה כדי להראות צד אחר של יפן מעבר למקדשים. הוא שוכן בבית ספר לשעבר מ-1929 ומשלב מוזיאון מחקרי עם ספרייה שבה אפשר ממש לקחת ספרים ולקרוא. נכון לסתיו 2026 מתקיימת בו גם תערוכה על 40 שנות Manga באירופה.","kyotoWhy":"מתאים מאוד לעניין שלכם ב-Nintendo/תרבות פופ ונותן גיוון ביום של קיוטו.","kyotoCombine":"Nijo Castle / Kyoto Gyoen / tea ceremony.","kyotoSources":["2211"],"maps":"https://www.google.com/maps/search/?api=1&query=Kyoto+International+Manga+Museum","youtube":"https://www.youtube.com/results?search_query=Kyoto+International+Manga+Museum","website":"https://kyotomm.jp/en/","infoSource":"https://kyoto.travel/en/destinations/kyoto-international-manga-museum/","kyotoCandidate":true,"note":"","booking":""},{"id":"ky_cooking_class","name":"Traditional Kyoto Cooking Class","city":"קיוטו","area":"Central Kyoto","status":"אולי","kind":"experience","duration":"2–3 ש׳","kyotoMinutes":150,"desc":"סדנת בישול מעשית של אוכל קיוטואי/יפני — חוויה במקום עוד אתר.","info":"מסמך 2211 בנה יום 'Living Kyoto' שמתחיל בבישול, כדי להבין את העיר דרך חומרי גלם וטכניקות ולא רק דרך מבנים. זו פעילות ארוכה יחסית, אבל היא נותנת זיכרון וחוויה משותפת. חשוב לבחור סדנה שמסוגלת לתת תפריט צמחוני אמיתי בלי fish/dashi.","kyotoWhy":"חוויה פעילה ואישית; שווה אם אתם רוצים פחות sightseeing קלאסי.","kyotoCombine":"Manga Museum / tea ceremony / kaiseki באותו יום.","kyotoSources":["2211"],"maps":"https://www.google.com/maps/search/?api=1&query=Kyoto+cooking+class","youtube":"https://www.youtube.com/results?search_query=Kyoto+cooking+class+Japanese+food","website":"","kyotoCandidate":true,"note":"","booking":""},{"id":"ky_tea_ceremony_central","name":"Traditional Tea Ceremony — Central Kyoto","city":"קיוטו","area":"Central Kyoto","status":"רוצה","kind":"experience","duration":"60–90 דק׳","kyotoMinutes":75,"desc":"טקס תה מודרך בחדר tatami מסורתי, עם matcha ו-wagashi.","info":"מסמך 2211 מתייחס ל-chanoyu כחוויה מרכזית בקיוטו: לא רק שתיית matcha, אלא שילוב של אדריכלות, קרמיקה, קליגרפיה, תנועה, מתוקים ואירוח. זו דרך מעולה להבין את האסתטיקה שמופיעה אחר כך גם בגנים וב-kaiseki.","kyotoWhy":"אם בוחרים חוויה תרבותית אחת בקיוטו, זו מועמדת חזקה.","kyotoCombine":"Kyoto Gyoen / sato — Italian restaurant (source)","city":"קיוטו","area":"Central Kyoto","status":"אולי","kind":"food","duration":"60–90 דק׳","kyotoMinutes":75,"desc":"מסעדה איטלקית שהופיעה בגיליונות Japan 2025 כאופציית אוכל בקיוטו.","info":"המלצה מהמקור הישן. הכרטיס נשמר כדי שהמידע לא ילך לאיבוד, אך אין לנו כרגע אימות מעודכן של תפריט או התאמה לצמחוני ללא dashi/דגים.","kyotoWhy":"אופציה לגיוון אם רוצים ערב לא יפני; דורש אימות.","kyotoCombine":"Central Kyoto.","kyotoSources":["Japan 2025"],"maps":"https://www.google.com/maps/search/?api=1&query=Misato+Italian+restaurant+Kyoto","youtube":"https://www.youtube.com/results?search_query=Misato+Kyoto+restaurant","website":"","kyotoCandidate":true,"note":"","booking":""},{"id":"ky_beit_shalom","name":"Beit Shalom Kyoto — source POI","city":"קיוטו","area":"Central Kyoto","status":"אולי","kind":"other","duration":"לא ידוע","kyotoMinutes":0,"desc":"נקודת POI שהופיעה בגיליונות Japan 2025; לא שובצה למסלול והמקור אינו כולל הסבר מספק.","info":"הפריט נשמר במאגר מטעמי שלמות בלבד. מכיוון שהגיליון הישן לא נתן הקשר למהות הביקור או למה הוא חשוב, לא נכון להמליץ עליו אוטומטית. אם השם מוכר לכם או היה מאחוריו צורך מסוים, אפשר להשאיר; אחרת ניתן לסמן 'לא רוצה'.","kyotoWhy":"נשמר כדי לא למחוק מידע מהמקור; דורש החלטה שלכם.","kyotoCombine":"לא ידוע.","kyotoSources":["Japan 2025"],"maps":"https://www.google.com/maps/search/?api=1&query=Beit+Shalom+Kyoto","youtube":"https://www.youtube.com/results?search_query=Beit+Shalom+Kyoto","website":"","kyotoCandidate":true,"note":"","booking":""},{"id":"osaka-hozenji-temple","name":"Hozen-ji Temple","city":"אוסקה","area":"Namba / Dotonbori","kind":"מקדש","status":"רוצה","duration":"20–30 דק׳","desc":"מקדש קטן ואווירה מסורתית בלב Namba; משתלב טבעית בין Kuromon ל-Dotonbori.","maps":"https://www.google.com/maps/search/?api=1&query=Hozen-ji+Temple+Osaka","website":"","youtube":"https://www.youtube.com/results?search_query=Hozen-ji+Temple+Osaka","info":"Hozen-ji הוא מקדש קטן של זרם Jodo שמסתתר בתוך אחד האזורים המסחריים העמוסים ביותר של Namba. במשך השנים נבנו סביבו דוכנים ומקומות אוכל ששירתו מתפללים ומבקרים, ומהם התפתחה בהמשך Hozenji Yokocho. כך נוצר סביב מקדש דתי קטן אחד מאזורי האוכל והבילוי המזוהים ביותר עם אוסקה.\n\nהדמות המפורסמת ביותר במקדש היא Mizukake Fudo — פסל Fudo Myoo שכיום מכוסה כמעט כולו בטחב. המבקרים שופכים עליו מים בזמן תפילה, וההרגל הזה, שחזר על עצמו במשך שנים רבות, הוא שיצר את שכבת הטחב העבה. המתחם נפגע קשות בהפצצות של מלחמת העולם השנייה, אבל המקדש והסמטה שסביבו שוקמו. בגלל המיקום שלו, Hozen-ji הוא דוגמה טובה לחיבור האופייני לאוסקה בין דת, מסחר, אוכל וחיי יום־יום — לא מקדש מבודד אלא חלק מרקמה עירונית צפופה.","infoSource":"https://osaka-info.jp/experience/en/osaka/spot/207","historyVerified":true},{"id":"osaka-hozenji-yokocho","name":"Hozenji Yokocho Alley","city":"אוסקה","area":"Namba / Dotonbori","kind":"רחוב / ערב","status":"חובה","duration":"30–45 דק׳","desc":"סמטה מסורתית קטנה ליד Dotonbori; מצוינת לשעות ערב וצילום.","maps":"https://www.google.com/maps/search/?api=1&query=Hozenji+Yokocho+Osaka","website":"","youtube":"https://www.youtube.com/results?search_query=Hozenji+Yokocho+Osaka","info":"Hozenji Yokocho נולדה מתוך השטח של Hozen-ji Temple. בתחילה פעלו ליד המקדש דוכנים ועסקים ששירתו את המתפללים; בהדרגה הם הפכו לרצועה של מסעדות, ברים ומקומות בילוי. שתי הסמטאות הצרות, שאורכן כ־80 מטר ורוחבן כ־3 מטר, קיבלו אופי שמזוהה מאוד עם Naniwa הישנה — אבני ריצוף, מסעדות קטנות ואווירה אינטימית שמנוגדת לניאון של Dotonbori הסמוך.\n\nהמקדש והסמטה נהרסו בהפצצות בתקופת מלחמת העולם השנייה ונבנו מחדש. אחרי המלחמה הפך המקום לסמל תרבותי גם בזכות הספר “Meoto Zenzai” של Sakunosuke Oda והשיר “Tsuki no Hozenji Yokocho”. לאורך השנים האזור ספג גם שריפות נוספות, אך שוקם שוב ושוב תוך שמירה על אופיו. לכן הסמטה מעניינת לא רק כאזור אוכל אלא כדוגמה ליכולת של Namba לשמר זיכרון עירוני בתוך מרכז מסחרי אינטנסיבי.","infoSource":"https://www.osaka-info.jp/en/spot/hozenji-yokocho/","historyVerified":true},{"id":"osaka-shitennoji","name":"Shitenno-ji Temple","city":"אוסקה","area":"Tennoji","kind":"מקדש","status":"רוצה","duration":"60–75 דק׳","desc":"אחד המקדשים הבודהיסטיים העתיקים ביפן; משתלב טוב לפני Shinsekai.","maps":"https://www.google.com/maps/search/?api=1&query=Shitenno-ji+Temple+Osaka","website":"","youtube":"https://www.youtube.com/results?search_query=Shitenno-ji+Temple+Osaka","info":"Shitenno-ji נחשב לאחד המקדשים הבודהיסטיים העתיקים ביותר ביפן ולמקדש הראשון שהוקם בחסות מדינתית. לפי המסורת הוא נוסד בשנת 593 בידי Prince Shotoku, דמות מרכזית בתהליך שבו הבודהיזם קיבל מעמד חשוב במערכת השלטון והתרבות של יפן הקדומה.\n\nהסידור של המבנים המרכזיים — שער, פגודה, אולם הזהב ואולם ההרצאות על ציר אחד — הפך לדגם אדריכלי חשוב שמכונה Shitennoji-style. במשך יותר מ־1,400 שנה נהרסו המבנים שוב ושוב בשריפות, מלחמות ואסונות טבע. גם במלחמת העולם השנייה נגרם למתחם נזק כבד, ורוב המבנים שרואים היום הם שחזורים לאחר המלחמה שנבנו לפי מחקר ותיעוד היסטורי. למרות זאת, האתר עצמו והמסורת הדתית רציפים במשך מאות שנים. לכן Shitenno-ji חשוב פחות בגלל “אותנטיות” של כל קורת עץ ויותר בגלל הרצף: אותו מקום ממשיך לשמש מוקד בודהיסטי מאז התקופה שבה יפן עדיין עיצבה את מוסדות המדינה הראשונים שלה.","infoSource":"https://osaka-info.jp/en/special/kita-minami/course01/","historyVerified":true},{"id":"usj-minion-park","name":"Minion Park","city":"אוסקה","area":"USJ","kind":"פארק שעשועים","status":"רוצה","duration":"45–90 דק׳","desc":"אזור Minions בתוך Universal Studios Japan.","maps":"https://www.google.com/maps/search/?api=1&query=Minion+Park+Universal+Studios+Japan","website":"https://www.usj.co.jp/web/en/us","youtube":"https://www.youtube.com/results?search_query=Minion+Park+USJ","historyNotApplicable":true},{"id":"usj-citywalk","name":"Universal CityWalk Osaka","city":"אוסקה","area":"USJ","kind":"אזור בילוי","status":"אולי","duration":"45–90 דק׳","desc":"מתחם מסעדות וקניות מחוץ ל-USJ; מתאים לפני/אחרי הפארק.","maps":"https://www.google.com/maps/search/?api=1&query=Universal+CityWalk+Osaka","website":"https://ucw.jp/","youtube":"https://www.youtube.com/results?search_query=Universal+CityWalk+Osaka","historyNotApplicable":true},{"id":"osaka-opt-osaka-museum-of-history","name":"Osaka Museum of History","city":"אוסקה","area":"Osaka Castle","kind":"מוזיאון","status":"אולי","duration":"60–90 דק׳","desc":"מוזיאון היסטוריה ליד Osaka Castle; אופציה טובה אם רוצים להעמיק ביום ההיסטורי.","maps":"https://www.google.com/maps/search/?api=1&query=Osaka+Museum+of+History","website":"","youtube":"https://www.youtube.com/results?search_query=Osaka+Museum+of+History","info":"Osaka Museum of History נפתח ב־2001, אבל המיקום שלו מחבר אותו להיסטוריה של יותר מ־1,300 שנה. הבניין עומד ליד שרידי Naniwa-no-Miya — מתחם הארמון שבו שכן מרכז שלטוני בתקופה שבה אוסקה, שנקראה אז Naniwa, הייתה אחת מבירות יפן הקדומות. חלק מהשרידים הארכאולוגיים נגישים גם במסגרת המוזיאון.\n\nהתצוגה בנויה מלמעלה למטה: בקומות העליונות מתחילים ב־Naniwa Palace ובתקופות הקדומות, ואז יורדים דרך ימי הביניים, תקופת Edo והעיר המודרנית. אחת המטרות היא להראות שאוסקה לא התחילה עם Dotonbori או עם Toyotomi Hideyoshi, אלא הייתה מרכז פוליטי, נמל בינלאומי ומוקד מסחרי הרבה קודם. החלונות הגדולים פונים לכיוון Osaka Castle, כך שאפשר להשוות בין שתי תקופות שלטוניות שונות — Naniwa העתיקה מול הטירה של תקופת האיחוד הפיאודלי.","infoSource":"https://osaka-info.jp/en/spot/osaka-museum-history/","historyVerified":true},{"id":"osaka-opt-osaka-aquarium-kaiyukan","name":"Osaka Aquarium Kaiyukan","city":"אוסקה","area":"Osaka Bay","kind":"אקווריום","status":"רוצה","duration":"2–3 ש׳","desc":"אחד האקווריומים הגדולים והמפורסמים ביפן.","maps":"https://www.google.com/maps/search/?api=1&query=Osaka+Aquarium+Kaiyukan","website":"","youtube":"https://www.youtube.com/results?search_query=Osaka+Aquarium+Kaiyukan","info":"Kaiyukan נפתח ב־20 ביולי 1990 כחלק מפיתוח מחדש של אזור Tempozan במפרץ אוסקה. הוא נולד בתקופה שבה אוסקה השקיעה רבות בהחייאת אזור הנמל ובהפיכת החוף המערבי של העיר למוקד תרבות ותיירות. כבר בתוך 40 יום עבר האקווריום את רף מיליון המבקרים.\n\nהרעיון האוצרותי מבוסס על “Ring of Fire” ו־“Ring of Life”: הקשר בין חגורת הרי הגעש המקיפה את האוקיינוס השקט לבין ריכוזי החיים והמערכות האקולוגיות שסביבה. המסלול בנוי כמסע אנכי, שבו המבקר יורד סביב מיכל Pacific Ocean הגדול דרך בתי גידול שונים. התפיסה הושפעה גם מה־Gaia hypothesis של James Lovelock — הרעיון שכדור הארץ והחיים עליו הם מערכת מקושרת. לכן Kaiyukan הוא דוגמה מעניינת לאקווריום שנבנה מראש סביב רעיון מדעי ולא רק סביב “אוסף חיות”.","infoSource":"https://www.kaiyukan.com/company/about/history/","historyVerified":true},{"id":"osaka-opt-tempozan-harbor-village","name":"Tempozan Harbor Village","city":"אוסקה","area":"Osaka Bay","kind":"אזור","status":"אולי","duration":"45–75 דק׳","desc":"מתחם נמל ליד Kaiyukan עם גלגל ענק, חנויות ואוכל.","maps":"https://www.google.com/maps/search/?api=1&query=Tempozan+Harbor+Village+Osaka","website":"","youtube":"https://www.youtube.com/results?search_query=Tempozan+Harbor+Village+Osaka"},{"id":"osaka-opt-lalaport-expocity","name":"LaLaport / EXPOCITY","city":"אוסקה","area":"Suita / Expo","kind":"קניות / בילוי","status":"אולי","duration":"2–3 ש׳","desc":"מתחם קניות ובילוי גדול ליד Expo Park.","maps":"https://www.google.com/maps/search/?api=1&query=EXPOCITY+Osaka","website":"","youtube":"https://www.youtube.com/results?search_query=EXPOCITY+Osaka","historyNotApplicable":true},{"id":"osaka-opt-tenjinbashi-suji","name":"Tenjinbashi-suji","city":"אוסקה","area":"Kita / Tenma","kind":"רחוב קניות","status":"אולי","duration":"1–2 ש׳","desc":"אחד מרחובות הקניות המקורים הארוכים ביפן.","maps":"https://www.google.com/maps/search/?api=1&query=Tenjinbashi-suji+Osaka","website":"","youtube":"https://www.youtube.com/results?search_query=Tenjinbashi-suji+Osaka","historyNotApplicable":true},{"id":"osaka-opt-shinsaibashi","name":"Shinsaibashi","city":"אוסקה","area":"Namba / Shinsaibashi","kind":"קניות","status":"רוצה","duration":"1–2 ש׳","desc":"רחוב הקניות המרכזי שמתחבר ל-Dotonbori.","maps":"https://www.google.com/maps/search/?api=1&query=Shinsaibashi+Osaka","website":"","youtube":"https://www.youtube.com/results?search_query=Shinsaibashi+Osaka","info":"Shinsaibashi הוא שם של אזור מסחרי שהתפתח סביב Shinsaibashi-suji וגשר Shinsaibashi ההיסטורי. במשך מאות שנים היה זה אחד מצירי הקניות המרכזיים של אוסקה, ובתקופת Edo כבר פעלו בו חנויות שפנו לסוחרים, בעלי מלאכה ותושבי העיר.\n\nעם המודרניזציה של אוסקה בתקופות Meiji ו־Taishō הפך Shinsaibashi למוקד של אופנה, תרבות עירונית וקמעונאות מודרנית. חנויות כלבו, בוטיקים, בתי קפה ומותגים מערביים הפכו את האזור למקום שבו טרנדים חדשים הגיעו לעיר מוקדם יחסית.\n\nהיום האזור משתרע הרבה מעבר לרחוב אחד — מ־Midosuji במזרח ועד Amerikamura במערב, ומ־Nagahori עד Dotonbori. הערך שלו למטייל הוא לא רק קניות: הוא מחבר פיזית והיסטורית בין מרכזי המסחר, האופנה והבידור של Osaka Minami.","infoSource":"https://osaka-info.jp/en/spot/shinsaibashi-suji-shopping-street/","historyVerified":true},{"id":"osaka-guide-abeno-harukas-300-observatory","name":"Abeno Harukas 300 Observatory","city":"אוסקה","area":"Tennoji","kind":"תצפית","status":"אולי","duration":"60–90 דק׳","desc":"תצפית מגובה 300 מטר מעל אוסקה.","maps":"https://www.google.com/maps/search/?api=1&query=Abeno+Harukas+300+Osaka","website":"","youtube":"https://www.youtube.com/results?search_query=Abeno+Harukas+300+Osaka","info":"Abeno Harukas 300 הוא מצפה בראש גורד השחקים Abeno Harukas, שנפתח ב־2014 כחלק מפרויקט התחדשות גדול באזור Tennoji. הבניין מתנשא לגובה 300 מטר והיה במשך שנים הבניין הגבוה ביותר ביפן. השם Harukas נגזר ממילה יפנית עתיקה שמשמעותה “להאיר” או “להבהיר”.\n\nהתצפית נמצאת בקומות 58–60 והיא חלק מתפיסה של “עיר אנכית”: תחבורה, מסחר, מוזיאון, משרדים, מלון ותצפית בתוך קומפלקס אחד. מבחינה עירונית, Harukas מסמל את הניסיון לחזק מחדש את דרום אוסקה כמרכז משמעותי מול Umeda בצפון ו־Namba במרכז. מהתצפית אפשר לראות את המבנה הגאוגרפי של Kansai — מפרץ אוסקה, אזור Sakai, מרכז העיר ורכסי ההרים — ולכן זה מקום טוב להבין ממנו איך אוסקה בנויה ולא רק לצלם נוף.","infoSource":"https://discover.osaka-info.jp/en/spots/abeno-harukas","historyVerified":true},{"id":"osaka-guide-legoland-discovery-center-osaka","name":"LEGOLAND Discovery Center Osaka","city":"אוסקה","area":"Osaka Bay","kind":"אטרקציה","status":"אולי","duration":"2–3 ש׳","desc":"אטרקציית LEGO מקורה באזור Tempozan.","maps":"https://www.google.com/maps/search/?api=1&query=LEGOLAND+Discovery+Center+Osaka","website":"","youtube":"https://www.youtube.com/results?search_query=LEGOLAND+Discovery+Center+Osaka","historyNotApplicable":true},{"id":"osaka-guide-osaka-museum-of-housing-and-living","name":"Osaka Museum of Housing and Living","city":"אוסקה","area":"Tenjinbashi / Kita","kind":"מוזיאון","status":"אולי","duration":"1.5–2 ש׳","desc":"מוזיאון עם שחזור רחובות אוסקה מתקופת Edo.","maps":"https://www.google.com/maps/search/?api=1&query=Osaka+Museum+of+Housing+and+Living","website":"","youtube":"https://www.youtube.com/results?search_query=Osaka+Museum+of+Housing+and+Living","info":"Osaka Museum of Housing and Living הוא המוזיאון הראשון ביפן שהתמקד באופן שיטתי בהיסטוריה של מגורים וחיי יום־יום. במקום להציג רק חפצים בתוך ויטרינות, הוא משחזר בקנה מידה מלא רחוב של Osaka מתקופת Edo המאוחרת, בערך בשנות Tenpo ‏(1830–1844).\n\nהרחוב המשוחזר מבוסס על מחקר היסטורי של machiya — בתי העיר של סוחרים ובעלי מלאכה. התאורה והקול משתנים לאורך “היום”, והקישוטים מתחלפים לפי עונות וחגים, כדי להראות כיצד העיר נראתה וחיה ולא רק כיצד נבנתה. קומות נוספות עוסקות בשינויים במגורים מתקופת Meiji דרך Taisho ועד Showa, כולל המודרניזציה, רעידות אדמה, מלחמה וצמיחה עירונית. זה מקום חשוב במיוחד להבנת אוסקה כי הוא מספר את ההיסטוריה מלמטה: לא דרך שוגונים וטירות, אלא דרך מטבח, חנות, רחוב ובית של אדם רגיל.","infoSource":"https://osaka-info.jp/experience/en/osaka/spot/241","historyVerified":true},{"id":"osaka-guide-tombori-river-cruise","name":"Tombori River Cruise","city":"אוסקה","area":"Dotonbori","kind":"שייט","status":"אולי","duration":"20–30 דק׳","desc":"שייט קצר בתעלת Dotonbori.","maps":"https://www.google.com/maps/search/?api=1&query=Tombori+River+Cruise+Osaka","website":"","youtube":"https://www.youtube.com/results?search_query=Tombori+River+Cruise+Osaka"},{"id":"osaka-guide-osaka-water-bus-aqua-liner","name":"Osaka Water Bus (Aqua-Liner)","city":"אוסקה","area":"Osaka Castle / Nakanoshima","kind":"שייט","status":"אולי","duration":"40–60 דק׳","desc":"שייט עירוני לאורך הנהרות של אוסקה.","maps":"https://www.google.com/maps/search/?api=1&query=Osaka+Water+Bus+Aqua+Liner","website":"","youtube":"https://www.youtube.com/results?search_query=Osaka+Water+Bus+Aqua+Liner"},{"id":"osaka-guide-solaniwa-onsen","name":"Solaniwa Onsen","city":"אוסקה","area":"Bentencho","kind":"Onsen","status":"אולי","duration":"2–4 ש׳","desc":"מתחם אונסן גדול בסגנון Edo.","maps":"https://www.google.com/maps/search/?api=1&query=Solaniwa+Onsen+Osaka","website":"","youtube":"https://www.youtube.com/results?search_query=Solaniwa+Onsen+Osaka"},{"id":"osaka-guide-street-go-karting","name":"Street Go-Karting","city":"אוסקה","area":"Central Osaka","kind":"חוויה","status":"לא","duration":"1–2 ש׳","desc":"חוויה מוטורית ברחובות העיר; נשמרת כאופציה בלבד.","maps":"https://www.google.com/maps/search/?api=1&query=Street+Go+Karting+Osaka","website":"","youtube":"https://www.youtube.com/results?search_query=Street+Go+Karting+Osaka"},{"id":"osaka-guide-ostec-exhibition-hall","name":"OSTEC Exhibition Hall","city":"אוסקה","area":"Hommachi","kind":"מוזיאון / מדע","status":"אולי","duration":"45–75 דק׳","desc":"Osaka Science & Technology Center — תצוגות מדע וטכנולוגיה.","maps":"https://www.google.com/maps/search/?api=1&query=OSTEC+Exhibition+Hall+Osaka","website":"","youtube":"https://www.youtube.com/results?search_query=OSTEC+Exhibition+Hall+Osaka","info":"OSTEC Exhibition Hall הוא אולם תצוגה של Osaka Science and Technology Center שמוקדש לטכנולוגיה תעשייתית ומדע שימושי. בניגוד למוזיאון מדע קלאסי שמציג בעיקר ניסויים עקרוניים, כאן הדגש הוא על טכנולוגיות שפיתחו חברות ומוסדות מחקר יפניים ושנכנסו לחיי היום־יום.\n\nכ־30 חברות וגופים מציגים טכנולוגיות בתחומים כמו חומרים, אנרגיה, תקשורת, סביבה ובריאות. חלק גדול מהתצוגות אינטראקטיבי — סימולציות, בדיקות, משחקי למידה ומוצגים של מוצרים אמיתיים.\n\nהמרכז משקף מסורת חזקה של Kansai כאזור תעשייתי, הנדסי ומחקרי, ולא רק כמרכז תיירות. הוא מתאים במיוחד אם רוצים לראות צד אחר של אוסקה: העיר כמרכז של תעשייה, מחקר ופיתוח ולא רק אוכל, קניות ובידור.","infoSource":"https://osaka-info.jp/experience/en/osaka/spot/578","historyVerified":true},{"id":"osaka-guide-osaka-prefectural-nakanoshima-library","name":"Osaka Prefectural Nakanoshima Library","city":"אוסקה","area":"Nakanoshima","kind":"ספרייה / אדריכלות","status":"אולי","duration":"30–60 דק׳","desc":"מבנה היסטורי מרשים בנקאנושימה.","maps":"https://www.google.com/maps/search/?api=1&query=Osaka+Prefectural+Nakanoshima+Library","website":"","youtube":"https://www.youtube.com/results?search_query=Osaka+Prefectural+Nakanoshima+Library","info":"Osaka Prefectural Nakanoshima Library נבנתה בשנת 1904 בזכות תרומה של משפחת Sumitomo, אחת ממשפחות העסקים החשובות ביותר בתולדות אוסקה. המבנה תוכנן בסגנון ניאו־קלאסי מערבי, עם אבן, עמודים וכיפה — הצהרה ברורה של יפן מתקופת Meiji שרצתה להציג את עצמה כמדינה מודרנית בעלת מוסדות ידע ציבוריים.\n\nבשנת 1922 נוספו האגפים הצדדיים, גם הם במימון משפחת Sumitomo. הספרייה שימשה לא רק לאחסון ספרים אלא כסמל לתפקיד החדש של Nakanoshima כמוקד של כלכלה, מנהל ותרבות. הבניין המרכזי והאגפים מוגדרים נכסי תרבות חשובים של יפן. מעניין במיוחד לראות אותו בהקשר הסביבתי: בקרבתו נמצאים Osaka City Central Public Hall, הבנק של יפן ומבני ממשל — כולם חלק מהניסיון להפוך את אזור הנהרות של אוסקה לרובע אזרחי מודרני בראשית המאה ה־20.","infoSource":"https://osaka-info.jp/en/spot/osaka-prefectural-nakanoshima-library/","historyVerified":true},{"id":"osaka-guide-osaka-nakanoshima-museum-of-art-public-spaces","name":"Osaka Nakanoshima Museum of Art — public spaces","city":"אוסקה","area":"Nakanoshima","kind":"מוזיאון / אמנות","status":"אולי","duration":"30–60 דק׳","desc":"האזורים הציבוריים של המוזיאון; תערוכות מסוימות בתשלום.","maps":"https://www.google.com/maps/search/?api=1&query=Osaka+Nakanoshima+Museum+of+Art","website":"","youtube":"https://www.youtube.com/results?search_query=Osaka+Nakanoshima+Museum+of+Art","info":"Osaka Nakanoshima Museum of Art נפתח בשנת 2022, אבל הרעיון להקים מוזיאון מודרני לאמנות באוסקה התחיל כבר בשנות ה־80. במשך עשרות שנים אספה העיר אוסף גדול של אמנות מודרנית ועכשווית, עיצוב ויצירות של אמנים מאוסקה ומיפן, עוד לפני שהיה לה מבנה ייעודי.\n\nהמוזיאון נבנה ב־Nakanoshima — אזור שמזוהה עם מוסדות ציבור, תרבות ועסקים מאז תקופת Meiji. האדריכלות שלו בולטת כקובייה שחורה גדולה, ובתוכה חללים ציבוריים רחבים שמאפשרים תנועה ומפגש גם בלי להיכנס לתערוכה בתשלום.\n\nהאוסף כולל אמנות יפנית ומערבית מן המאה ה־19 ואילך, עיצוב, צילום ויצירות הקשורות להתפתחות העיר. לכן גם האזורים הציבוריים מעניינים כחלק מפרויקט עירוני ארוך שנים: ניסיון לתת לאוסקה מוסד מרכזי לאמנות מודרנית בתוך הרובע האזרחי ההיסטורי שלה.","infoSource":"https://nakka-art.jp/en/about/","historyVerified":true},{"id":"osaka-guide-osaka-city-museum-of-fine-arts-free-areas","name":"Osaka City Museum of Fine Arts — free areas","city":"אוסקה","area":"Tennoji","kind":"מוזיאון / אמנות","status":"אולי","duration":"30–60 דק׳","desc":"אזורים חינמיים בלבד; תערוכות מיוחדות עשויות להיות בתשלום.","maps":"https://www.google.com/maps/search/?api=1&query=Osaka+City+Museum+of+Fine+Arts","website":"","youtube":"https://www.youtube.com/results?search_query=Osaka+City+Museum+of+Fine+Arts","info":"Osaka City Museum of Fine Arts נפתח בשנת 1936 בתוך Tennoji Park. השטח שעליו הוא עומד היה קודם חלק מאחוזת משפחת Sumitomo. המשפחה תרמה לעיר את הקרקע ואת גן Keitakuen הסמוך כדי שיוקם במקום מוסד אמנות ציבורי — עוד דוגמה להשפעה הגדולה של הון פרטי על מוסדות התרבות של אוסקה בראשית המאה ה־20.\n\nהאוסף של המוזיאון כולל אלפי יצירות, במיוחד אמנות יפנית וסינית, ציורים, פיסול ואומנויות דקורטיביות. חלק מהפריטים הגיעו ממקדשים ומקדשי שינטו וכוללים נכסי תרבות חשובים. הבניין עצמו הוכר כנכס תרבות מוחשי רשום. לכן גם אם נכנסים רק לאזורים הציבוריים, שווה להבין שזה אינו מוזיאון חדש בתוך קניון אלא אחד ממוסדות האמנות הוותיקים בעיר, שנבנה כחלק מתפיסה של Tennoji כמרכז ציבורי של תרבות, גנים, גן חיות וחינוך.","infoSource":"https://osaka-info.jp/spot/osaka-museum-fine-arts/","historyVerified":true},{"id":"osaka-guide-osaka-mint-museum","name":"Osaka Mint Museum","city":"אוסקה","area":"Kita / Temma","kind":"מוזיאון","status":"אולי","duration":"45–75 דק׳","desc":"מוזיאון המטבעה של יפן באוסקה.","maps":"https://www.google.com/maps/search/?api=1&query=Osaka+Mint+Museum","website":"","youtube":"https://www.youtube.com/results?search_query=Osaka+Mint+Museum","info":"Japan Mint Museum מספר את הסיפור של מוסד שהיה קריטי למודרניזציה של יפן. המטבעה הממשלתית באוסקה הוקמה בראשית תקופת Meiji כחלק מהרפורמות שנועדו ליצור מערכת מטבע אחידה ומודרנית למדינה שנפתחה למסחר בינלאומי.\n\nהבניין שבו פועל המוזיאון נבנה ב־1911 כתחנת כוח תרמית עבור מתחם המטבעה, והוא אחד המבנים המערביים מלבנים שנותרו במקום מתקופת Meiji. בשנת 1969 הוסב המבנה למוזיאון, תוך שמירה על מראהו ההיסטורי. התצוגה עוסקת בתהליך ייצור מטבעות ומדליות, בדוגמאות מיפן ומהעולם ובטכנולוגיות החריטה וההטבעה. מעבר לנומיסמטיקה, המקום חשוב כי הוא מראה כיצד המדינה החדשה של תקופת Meiji בנתה תשתית כלכלית מודרנית — כסף אחיד, טכנולוגיה תעשייתית ומוסדות ממשלתיים — כחלק מהמעבר המהיר מפיאודליזם למדינת לאום מודרנית.","infoSource":"https://osaka-info.jp/en/spot/mint-museum/","historyVerified":true},{"id":"osaka-guide-duskin-museum-mister-donut-museum","name":"Duskin Museum (Mister Donut Museum)","city":"אוסקה","area":"Suita","kind":"מוזיאון","status":"אולי","duration":"60–90 דק׳","desc":"מוזיאון Duskin / Mister Donut.","maps":"https://www.google.com/maps/search/?api=1&query=Duskin+Museum+Mister+Donut+Osaka","website":"","youtube":"https://www.youtube.com/results?search_query=Duskin+Museum+Mister+Donut+Osaka","info":"Duskin Museum נפתח ב־Suita, העיר שבה נוסדה חברת Duskin, כדי לספר שני סיפורים שונים שהפכו לחלק מחיי היומיום ביפן: ניקיון ביתי ומוצרי Mister Donut.\n\nDuskin נוסדה ב־1963 ופיתחה ביפן תרבות חדשה של מוצרי ניקיון להשכרה ושימוש ב“מטליות כימיות” שאוספות אבק בלי מים. בשנת 1971 החברה הביאה ליפן את Mister Donut מארצות הברית, והמותג הפך עם השנים לאחת מרשתות הדונאטס המוכרות במדינה.\n\nהמוזיאון מחולק לשני חלקים: אזור שמספר את ההיסטוריה והטכנולוגיה של ניקיון, ואזור Mister Donut שמתמקד בהתפתחות המותג, תהליך ההכנה והתרבות סביב הדונאט. זהו לא אתר היסטורי עתיק, אבל הוא כן מוזיאון שמספר סיפור מעניין על צריכה, מזון ושינוי באורח החיים היפני מאז שנות ה־60.","infoSource":"https://www.duskin-museum.jp/","historyVerified":true},{"id":"osaka-guide-wahaha-kamigata","name":"Wahaha Kamigata","city":"אוסקה","area":"Namba","kind":"תרבות / בידור","status":"אולי","duration":"60–90 דק׳","desc":"מרכז לתרבות הבמה הקומית Kamigata.","maps":"https://www.google.com/maps/search/?api=1&query=Wahaha+Kamigata+Osaka","website":"","youtube":"https://www.youtube.com/results?search_query=Wahaha+Kamigata+Osaka","historyNotApplicable":true},{"id":"osaka-guide-osaka-sewerage-science-museum","name":"Osaka Sewerage Science Museum","city":"אוסקה","area":"Konohana","kind":"מוזיאון / מדע","status":"אולי","duration":"60–90 דק׳","desc":"מוזיאון מדע ותשתיות סביב מערכת הביוב העירונית.","maps":"https://www.google.com/maps/search/?api=1&query=Osaka+Sewerage+Science+Museum","website":"","youtube":"https://www.youtube.com/results?search_query=Osaka+Sewerage+Science+Museum","info":"Osaka Sewerage Science Museum הוא מוזיאון מדעי שמציג מערכת שכמעט תמיד מוסתרת מהעין: התשתית שמאפשרת לעיר מודרנית של מיליוני תושבים להתמודד עם מי ביוב וגשמים.\n\nהתערוכות מסבירות מה קורה למים אחרי שהם נעלמים מהכיור או האסלה, כיצד מנקים אותם, ואיך מערכות ניקוז מגינות על אוסקה מהצפות. הנושא משמעותי במיוחד בעיר נמוכה, מרובת נהרות ותעלות, שבה שליטה במים הייתה תמיד תנאי להתפתחות עירונית.\n\nהמוזיאון בנוי כמרכז חווייתי עם תצוגות שאפשר לגעת ולהפעיל, ולכן הוא יותר “מדע ותשתיות” מאשר היסטוריה קלאסית. הערך שלו הוא בהצגת השכבה הבלתי נראית של העיר — אותה מערכת הנדסית שבלעדיה מרכז עיר צפוף כמו אוסקה לא היה יכול לתפקד.","infoSource":"https://osaka-info.jp/en/spot/osaka-sewerage-science-museum/","historyVerified":true},{"id":"osaka-guide-nakanoshima-park","name":"Nakanoshima Park","city":"אוסקה","area":"Nakanoshima","kind":"פארק","status":"אולי","duration":"30–60 דק׳","desc":"פארק מרכזי בין הנהרות, מתאים לשילוב עם Kitahama/Yodoyabashi.","maps":"https://www.google.com/maps/search/?api=1&query=Nakanoshima+Park+Osaka","website":"","youtube":"https://www.youtube.com/results?search_query=Nakanoshima+Park+Osaka","info":"Nakanoshima Park הוקם בשנת 1891 והיה הפארק העירוני הציבורי הראשון של אוסקה. המיקום שלו משמעותי: האי Nakanoshima, בין הנהרות Dojima ו־Tosabori, היה בתקופת Edo מרכז של מחסני האורז והסחורות של הדאימיו מכל רחבי יפן — חלק מהמערכת שבזכותה כונתה אוסקה “המטבח של האומה”.\n\nבתקופת Meiji השתנה האי ממוקד מסחרי למרכז אזרחי מודרני. סביבו נבנו ספרייה, אולם ציבורי, בנקים ומוסדות מנהל, והפארק הפך למרחב בילוי עירוני חדש. כבר בשנותיו הראשונות היו בו בתי קפה, מסעדות, במה ל־Noh ואפילו מלון לאורחים מחו״ל. כיום הוא מזוהה עם גן הוורדים ועם המבנים ההיסטוריים שסביבו, אבל הערך שלו הוא בעיקר בהקשר: זהו המקום שבו אפשר לראות כיצד אוסקה עברה מעיר סוחרים של תקופת Edo לעיר מוסדות מודרנית של תקופת Meiji.","infoSource":"https://www.osaka-info.jp/en/spot/nakanoshima-park/","historyVerified":true}]}</script>

    if(spec && spec.priority) p.status=spec.priority;
  }
});
function videoRoutePlace(name){ return TRIP.places.find(p=>p.name===name); }
function applyKyotoVideoRoute(){
  if(!live.kyotoAssign || typeof live.kyotoAssign!=='object') live.kyotoAssign={};
  KYOTO_VIDEO_ROUTE.forEach(d=>d.items.forEach(([name])=>{
    const p=videoRoutePlace(name);
    if(p) live.kyotoAssign[p.id]=d.day;
  }));
  KYOTO_MYMAPS_MISSING.forEach(x=>{
    const p=videoRoutePlace(x.name);
    if(p) live.kyotoAssign[p.id]=x.day;
  });
  persist();
}
function kyotoVideoStop(name,time,idx){
  const p=videoRoutePlace(name);
  if(!p) return '';
  return '<div class="kyoto-video-stop"><span class="kyoto-video-num">'+idx+'</span><div><b>'+esc(p.name)+'</b><small>בסרטון '+esc(time)+' · '+esc(p.area||'')+'</small></div><div class="vlinks"><button type="button" data-info-place="'+esc(p.id)+'">כרטיס</button><a target="_blank" rel="noopener" href="'+esc(p.maps)+'">Maps</a><a target="_blank" rel="noopener" href="'+esc(kyotoYoutubeUrl(p))+'">YouTube</a></div></div>';
}
function renderKyotoMyMapsMissing(){
  return '<div class="kyoto-video-options"><h4>נוספו לאחר השוואה מול 3 קבצי My Maps · ללא מסעדות</h4>'
    +'<p class="sub">אלה 9 נקודות שהיו בקבצים שלך ולא הופיעו במסלול הראשי של הסרטון. Nanzen-ji לא מופיע כאן כי הוא כבר היה ברשימת ה״אם נשאר זמן״ של הסרטון. השיבוץ ליום הוא הצעה גאוגרפית בלבד — לא החלטה סופית.</p>'
    +'<div class="kyoto-video-days">'
    +['1','2','3'].map(day=>{
      const rows=KYOTO_MYMAPS_MISSING.filter(x=>x.day===day);
      if(!rows.length) return '';
      return '<div class="kyoto-video-day"><h4>תוספות מוצעות ליום '+day+'</h4>'
        +rows.map((x,i)=>{
          const p=videoRoutePlace(x.name); if(!p) return '';
          const light=x.priority==='חובה'?'🟢🟢':x.priority==='רוצה'?'🟢':x.priority==='אולי'?'🟠':'🔴';
          return '<div class="kyoto-video-stop"><span class="kyoto-video-num">'+(i+1)+'</span><div><b>'+esc(p.name)+'</b><small>'+light+' '+esc(x.priority)+' · '+esc(x.duration)+' · '+esc(x.source)+'<br>'+esc(x.why)+'</small></div><div class="vlinks"><button type="button" data-info-place="'+esc(p.id)+'">כרטיס</button><a target="_blank" rel="noopener" href="'+esc(p.maps)+'">Maps</a><a target="_blank" rel="noopener" href="'+esc(kyotoYoutubeUrl(p))+'">YouTube</a></div></div>';

        +'</div>';
    }).join('')
    +'</div></div>';
}

  h+='<div class="kyoto-video-days">'+KYOTO_VIDEO_ROUTE.map(d=>'<div class="kyoto-video-day"><h4>'+esc(d.title)+'</h4><p class="sub">'+esc(d.subtitle)+'</p>'+d.items.map((x,i)=>kyotoVideoStop(x[0],x[1],i+1)).join('')+'</div>').join('')+'</div>';

  h+='<div class="plan-note" style="margin-top:10px"><b>מבנה הלינה עודכן:</b> 30/11 הוא יום מעבר Tokyo→Kyoto ולא נספר כאחד משלושת הימים. 01/12, 02/12 ו־03/12 הם שלושה ימים מלאים בקיוטו. רק בבוקר 04/12 יוצאים לנארה, ומשם ממשיכים לאוסקה.</div>';

}

async function fetchJsonTimeout(url, ms){
  const ctl=new AbortController();
  const t=setTimeout(()=>ctl.abort(), ms||6500);
  try{
    const r=await fetch(url,{signal:ctl.signal,cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
async function youtubeSecondResult(name){
  const q=encodeURIComponent(name+' Japan travel');
  const endpoints=[
    'https://yewtu.be/api/v1/search?q='+q+'&type=video&sort_by=relevance',
    'https://inv.nadeko.net/api/v1/search?q='+q+'&type=video&sort_by=relevance',
    'https://invidious.nerdvpn.de/api/v1/search?q='+q+'&type=video&sort_by=relevance',
    'https://invidious.privacyredirect.com/api/v1/search?q='+q+'&type=video&sort_by=relevance'
  ];
  for(const url of endpoints){
    try{
      const rows=await fetchJsonTimeout(url,6200);
      const vids=Array.isArray(rows)?rows.filter(v=>v && v.videoId):[];
      if(vids.length>=2){
        const v=vids[1]; /* תמיד התוצאה השנייה */
        return {
          videoId:v.videoId,
          youtube:'https://www.youtube.com/watch?v='+encodeURIComponent(v.videoId),
          youtubeTitle:v.title||''
        };
      }
    }catch(e){}
  }
  return null;
}
function normEntity(s){
  return String(s||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}
function imageQueryName(name){
  if(IMAGE_ALIASES[name]) return IMAGE_ALIASES[name];
  /* Composite itinerary labels are not safe to guess. If there is no explicit alias, use the full card name. */
  return String(name||'').trim();
}

function verifiedStaticImage(name){
  const key=String(name||'').trim();
  const direct=VERIFIED_IMAGES[key];
  if(direct) return {image:direct,imageEntity:key,imageEntityId:'verified-web',verifiedSource:'static'};
  const alias=IMAGE_ALIASES[key];
  if(alias && VERIFIED_IMAGES[alias]) return {image:VERIFIED_IMAGES[alias],imageEntity:alias,imageEntityId:'verified-web',verifiedSource:'static'};
  return null;
}
function entityAccepts(query, row){
  const q=normEntity(query);
  const label=normEntity(row&&row.label);
  if(!q || !label) return false;
  /* Correct-only policy: exact entity label or very close containment. */
  if(label===q) return true;
  if(q.length>=10 && (label.includes(q) || q.includes(label))){
    const shorter=Math.min(q.length,label.length), longer=Math.max(q.length,label.length);
    return shorter/longer>=0.78;
  }
  return false;
}
function jsonpMedia(url, timeoutMs){
  return new Promise((resolve,reject)=>{
    const cb='japan26jsonp_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const sc=document.createElement('script');
    let done=false;
    const clean=()=>{try{delete window[cb]}catch(e){}; if(sc.parentNode)sc.parentNode.removeChild(sc);};
    const timer=setTimeout(()=>{ if(done)return; done=true; clean(); reject(new Error('JSONP timeout')); }, timeoutMs||8500);
    window[cb]=(data)=>{ if(done)return; done=true; clearTimeout(timer); clean(); resolve(data); };
    sc.onerror=()=>{ if(done)return; done=true; clearTimeout(timer); clean(); reject(new Error('JSONP failed')); };
    sc.src=url+(url.includes('?')?'&':'?')+'callback='+encodeURIComponent(cb);
    document.head.appendChild(sc);
  });
}
async function strictWikidataImage(name){
  const query=imageQueryName(name);
  if(!query) return null;
  try{
    const search='https://www.wikidata.org/w/api.php?action=wbsearchentities'
      +'&search='+encodeURIComponent(query)+'&language=en&uselang=en&type=item&limit=8&format=json';
    const j=await jsonpMedia(search,8500);
    const rows=Array.isArray(j&&j.search)?j.search:[];
    const hit=rows.find(r=>entityAccepts(query,r));
    if(!hit || !hit.id) return null;
    const detail='https://www.wikidata.org/w/api.php?action=wbgetentities'
      +'&ids='+encodeURIComponent(hit.id)+'&props=claims|labels|descriptions&languages=en&format=json';
    const d=await jsonpMedia(detail,8500);
    const ent=d&&d.entities&&d.entities[hit.id];
    const p18=ent&&ent.claims&&ent.claims.P18&&ent.claims.P18[0];
    const filename=p18&&p18.mainsnak&&p18.mainsnak.datavalue&&p18.mainsnak.datavalue.value;
    if(!filename) return null;
    return {
      image:'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(filename)+'?width=1000',
      entityId:hit.id,
      entityLabel:hit.label||query
    };
  }catch(e){ return null; }
}

async function strictWikipediaImage(name){
  const query=imageQueryName(name);
  if(!query) return null;
  const fetchTitle=async(title)=>{
    const u='https://en.wikipedia.org/w/api.php?action=query&prop=pageimages|info&piprop=thumbnail&pithumbsize=1000&redirects=1&titles='+encodeURIComponent(title)+'&format=json';
    const j=await jsonpMedia(u,8500);
    const pages=j&&j.query&&j.query.pages?Object.values(j.query.pages):[];
    const p=pages.find(x=>x && !x.missing && x.thumbnail && x.thumbnail.source);
    if(!p) return null;
    const titleOk=entityAccepts(query,{label:p.title}) || entityAccepts(imageQueryName(name),{label:p.title});
    if(!titleOk) return null;
    return {image:p.thumbnail.source,entityId:'wikipedia:'+p.pageid,entityLabel:p.title};
  };
  try{
    const direct=await fetchTitle(query);
    if(direct) return direct;
  }catch(e){}
  try{
    const su='https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent('intitle:"'+query+'" Japan')+'&srlimit=6&format=json';
    const sj=await jsonpMedia(su,8500);
    const rows=(sj&&sj.query&&sj.query.search)||[];
    const hit=rows.find(r=>entityAccepts(query,{label:r.title}));
    if(hit) return await fetchTitle(hit.title);
  }catch(e){}
  return null;
}

async function resolveMedia(name){
  const key=String(name||'').trim();
  if(!key) return {};
  const staticHit=verifiedStaticImage(key);
  if(staticHit){
    const cached=Object.assign({mediaVersion:106,youtube:'',youtubeTitle:'',videoId:'',failedAt:0},staticHit);
    live.media[key]=cached; saveMediaSoon(); return cached;
  }
  const cached=live.media[key];
  if(cached && cached.mediaVersion===106){
    if(cached.youtube || cached.image) return cached;
    if(cached.failedAt && Date.now()-cached.failedAt<MEDIA_FAIL_TTL) return cached;
  }
  const [ytR,wdR,wpR]=await Promise.allSettled([youtubeSecondResult(key), strictWikidataImage(key), strictWikipediaImage(key)]);
  const yt=ytR.status==='fulfilled'?ytR.value:null;
  const wd=wdR.status==='fulfilled'?wdR.value:null;
  const wp=wpR.status==='fulfilled'?wpR.value:null;
  const img=(wd&&wd.image)?wd:((wp&&wp.image)?wp:null);
  const result={
    mediaVersion:106,
    youtube:yt&&yt.youtube?yt.youtube:'',
    youtubeTitle:yt&&yt.youtubeTitle?yt.youtubeTitle:'',
    videoId:yt&&yt.videoId?yt.videoId:'',
    image:img&&img.image?img.image:'',
    imageEntity:img&&img.entityLabel?img.entityLabel:'',
    imageEntityId:img&&img.entityId?img.entityId:'',
    failedAt:(!(yt&&yt.youtube) && !(img&&img.image))?Date.now():0
  };
  live.media[key]=result;
  saveMediaSoon();
  return result;
}
function paintMedia(el, m){
  if(!el || !el.isConnected) return;
  const name=el.dataset.mediaName||'';
  const imageWrap=el.querySelector('.media-image-wrap');
  if(imageWrap){
    if(m&&m.image){
      imageWrap.classList.add('on');
      imageWrap.innerHTML='<img class="media-image" loading="lazy" referrerpolicy="no-referrer" alt="'+esc(name)+'" src="'+esc(m.image)+'">'
        +'<div class="media-image-note">תמונה מאומתת: '+esc(m.imageEntity||name)+'</div>';
    }else{
      imageWrap.classList.remove('on');
      imageWrap.innerHTML='<div class="m-no-verified-image">📷<small>אין תמונה מאומתת של המקום</small></div>';

    }
  }
  const y=el.querySelector('[data-media-youtube]');
  if(y){
    if(m&&m.youtube){
      y.dataset.href=m.youtube;
      y.textContent='▶ YouTube · תוצאה #2';
    }else{
      /* הכפתור לעולם לא נעלם: במקרה שה-API חסום הוא פותח את החיפוש. */
      y.dataset.href=ytSearchUrl(name);
      y.textContent='▶ YouTube · חיפוש';
    }
  }
  const s=el.querySelector('.media-status');
  if(s){
    s.textContent=(m&&m.image)?'תמונה מדויקת':'אין תמונה מאומתת';
  }
  el.dataset.mediaState='done';
}
async function loadMediaEl(el){
  if(!el || el.dataset.mediaState==='loading' || el.dataset.mediaState==='done') return;
  el.dataset.mediaState='loading';
  const m=await resolveMedia(el.dataset.mediaName||'');
  paintMedia(el,m);
}
function hydrateMedia(){
  if(mediaObserver){ try{mediaObserver.disconnect();}catch(e){} }
  const els=[...document.querySelectorAll('[data-media-name]')];
  els.forEach(el=>{
    const key=el.dataset.mediaName||'';
    const sh=verifiedStaticImage(key);
    if(sh){ const c=Object.assign({mediaVersion:106,youtube:'',failedAt:0},sh); live.media[key]=c; paintMedia(el,c); return; }
    const c=live.media[key];
    if(c && c.mediaVersion===106 && (c.youtube||c.image||c.failedAt)) paintMedia(el,c);
  });
  const pending=els.filter(el=>el.dataset.mediaState!=='done');
  if(!pending.length) return;
  if('IntersectionObserver' in window){
    mediaObserver=new IntersectionObserver(entries=>{
      entries.forEach(en=>{
        if(en.isIntersecting){
          mediaObserver.unobserve(en.target);
          loadMediaEl(en.target);
        }
      });
    },{rootMargin:'260px 0px'});
    pending.forEach(el=>mediaObserver.observe(el));
  }else{
    pending.slice(0,12).forEach(loadMediaEl);
  }
}
function openMediaYoutube(target){
  const y=target&&target.closest?target.closest('[data-media-youtube]'):null;
  if(!y || !y.dataset.href) return false;
  window.open(y.dataset.href,'_blank','noopener');
  return true;
}

function pad(n){ return String(n).padStart(2,'0'); }
function fmt(min){ if(min==null) return ''; min=((min%(24*60))+(24*60))%(24*60); return pad(Math.floor(min/60))+':'+pad(min%60); }
function dayById(id){ return TRIP.days.find(d=>d.id===id); }
function todayId(){
  const n=new Date();
  return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate());
}
function activeDay(){
  const today=todayId();
  if(TRIP.days.some(d=>d.id===today)) return dayById(today);
  if(live.dayId && dayById(live.dayId)) return dayById(live.dayId);
  return TRIP.days.find(d=>!d.empty) || TRIP.days[0];
}
function setDay(id, opts){

function isFood(it){ return /אוכל|מסעדה|קפה/.test(it.kind||'') || /ראמן|קפה|מסעדה/.test(it.name||''); }
function shown(day, index){
  const base=day.items[index];
  const repl=live.replace[base.uid];
  const it=repl? Object.assign({}, base, repl) : base;
  if(it.start==null) return it;
  let extra = live.done[it.uid] ? 0 : (live.delay[day.id]||0);
  for(let i=0;i<index;i++) extra += live.cascade[day.items[i].uid]||0;
  const own = live.cascade[it.uid]||0;
  const start=it.start+extra, end=(it.end==null?it.start:it.end)+extra+own;
  return Object.assign({}, it, {time: fmt(start)+'–'+fmt(end), start, end});
}
function visibleItems(day){
  return day.items.map((it,i)=>({it:shown(day,i), i})).filter(x=>!live.skipped[x.it.uid]);
}
function currentIndex(day){
  const rows=visibleItems(day);
  const hit=rows.find(x=>!live.done[x.it.uid]);
  return hit? hit.i : -1;
}
function persist(){ saveLive(live); }
function toast(text, undo){

function normalizeInfoName(name){
  return (name||'').toLowerCase()
    .replace(/[—–-]/g,' ')
    .replace(/[^\w\u0590-\u05FF]+/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function placeForInfo(name){
  if(!name) return null;
  let p=TRIP.places.find(x=>x.name===name);
  if(p) return p;
  const n=normalizeInfoName(name);
  p=TRIP.places.find(x=>normalizeInfoName(x.name)===n);
  if(p) return p;
  return null;
}
function infoData(name, fallbackDesc, fallbackInfo){
  const p=placeForInfo(name);
  const summary=(fallbackInfo || (p&&p.info) || fallbackDesc || (p&&p.desc) || 'אין כרגע סיכום נוסף למקום הזה.');
  const facts=[];
  if(p&&p.area) facts.push(p.area);
  if(p&&p.duration) facts.push('זמן מומלץ: '+p.duration);
  if(p&&p.note) facts.push(p.note);
  const source=(p&&p.infoSource)||'';
  return {summary, facts, source};
}
function infoSummaryHtml(name, fallbackDesc, fallbackInfo){

    +(d.facts.length?'<div class="info-facts">'+d.facts.map(x=>'<span class="info-fact">'+esc(x)+'</span>').join('')+'</div>':'')
    +(d.source?'<a class="info-source" target="_blank" rel="noopener" href="'+esc(d.source)+'">מקור מידע מאומת</a>':'')
    +'</div>';
}

function planStatus(p){
  return (live.plan&&live.plan[p.id]) || p.status || 'אולי';
}
function planStatusClass(status){

}
function planStatusButtons(p){

  return '<div class="plan-status">'+vals.map(x=>'<button type="button" data-plan-id="'+esc(p.id)+'" data-plan-status="'+esc(x[0])+'" class="'+(cur===x[0]?'on':'')+'">'+x[1]+'</button>').join('')+'</div>';

function setPlanStatus(id,status){

if(!live.kyotoAssign || typeof live.kyotoAssign!=='object') live.kyotoAssign={};

function scheduledDaysForPlace(p){
  const target=normalizeInfoName(p.name);
  const hits=[];
  TRIP.days.forEach(d=>{
    for(const it of d.items){
      const rep=live.replace&&live.replace[it.uid];
      const n=normalizeInfoName(rep&&rep.name?rep.name:it.name);
      if(n===target){ hits.push(d); break; }
    }
  });
  return hits;
}
function scheduledPlaceIdsForDay(day){
  const ids=new Set();
  day.items.forEach(it=>{
    const rep=live.replace&&live.replace[it.uid];
    const name=rep&&rep.name?rep.name:it.name;
    const p=placeForInfo(name);
    if(p) ids.add(p.id);
  });
  return ids;
}
function planKindLabel(p){

}

function planCards(rows,limit){
  const list=rows.slice(0,limit||120);
  let h=list.length?'<div class="plan-grid">'+list.map(planCard).join('')+'</div>':'<div class="plan-empty">אין מקומות שמתאימים לסינון הזה.</div>';

function planningBaseRows(){
  const q=planQuery.trim().toLowerCase();
  return TRIP.places.filter(p=>{
    if(planCityFilter!=='הכל' && p.city!==planCityFilter) return false;
    if(planKindFilter!=='הכל'){
      const map={'אטרקציות':'attraction','חנויות':'shop','אוכל':'food','מלונות':'hotel'};
      if(p.kind!==map[planKindFilter]) return false;
    }
    if(planStatusFilter!=='הכל' && planStatus(p)!==planStatusFilter) return false;
    if(q && (p.name+' '+p.city+' '+p.area+' '+(p.desc||'')+' '+(p.info||'')).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}
function planSort(rows){
  const rank={'חובה':0,'רוצה':1,'אולי':2,'לא':3};
  return rows.slice().sort((a,b)=>{
    const sa=scheduledDaysForPlace(a).length?0:1, sb=scheduledDaysForPlace(b).length?0:1;
    return sa-sb || (rank[planStatus(a)]??9)-(rank[planStatus(b)]??9) || a.area.localeCompare(b.area) || a.name.localeCompare(b.name);
  });
}
function planningFilters(includeArea){

function kyotoCandidateRows(){

  if(mobilePlaceFilter==='must') rows=rows.filter(p=>planStatus(p)==='חובה');
  if(mobilePlaceFilter==='want') rows=rows.filter(p=>planStatus(p)==='רוצה');
  if(mobilePlaceFilter==='food') rows=rows.filter(p=>/אוכל|מסעד|food|restaurant|ramen|cafe/i.test((p.kind||'')+' '+p.name));

const KYOTO_MYMAPS_URL='https://www.google.com/maps/d/u/0/edit?mid=1_J3VtAh7aeQm4eNmhs2IENs4dfl31Ks';
function kyotoExportOrderMap(day){
  const d=KYOTO_VIDEO_ROUTE.find(x=>String(x.day)===String(day));
  const m=new Map();
  if(d) d.items.forEach((x,i)=>{ const p=videoRoutePlace(x[0]); if(p) m.set(p.id,i); });
  return m;
}
function kyotoExportRows(day,highOnly){
  const ord=kyotoExportOrderMap(day);
  const rank={'חובה':0,'רוצה':1,'אולי':2,'לא':3};
  return TRIP.places.filter(p=>{
    if(!p.kyotoCandidate || kyotoAssignment(p)!==String(day) || planStatus(p)==='לא') return false;
    if(highOnly && !['חובה','רוצה'].includes(planStatus(p))) return false;
    return true;
  }).sort((a,b)=>{
    const ao=ord.has(a.id)?ord.get(a.id):999, bo=ord.has(b.id)?ord.get(b.id):999;
    return ao-bo || (rank[planStatus(a)]??9)-(rank[planStatus(b)]??9) || (a.area||'').localeCompare(b.area||'') || a.name.localeCompare(b.name);
  });
}
function kyotoLocationLabel(p){ return [p.name,p.area,'Kyoto','Japan'].filter(Boolean).join(', '); }
function csvCell(v){
  const x=String(v==null?'':v).replace(/\r?\n/g,' ');
  return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;
}
function xmlEsc(v){ return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c])); }
function downloadTextFile(name,text,type){
  const blob=new Blob([text],{type:type||'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),800);
}
function kyotoCsv(rows,dayLabel){
  const head=['Day','Order','Name','Location','Area','Type','Priority','Duration','Description','Google Maps','YouTube'];
  const body=rows.map((p,i)=>[dayLabel,i+1,p.name,kyotoLocationLabel(p),p.area||'',kyotoKindLabel(p),planStatus(p),p.duration||'',p.desc||'',p.maps||'',kyotoYoutubeUrl(p)]);
  return '\ufeff'+[head].concat(body).map(r=>r.map(csvCell).join(',')).join('\r\n');
}
function kyotoKmlFolder(day,rows){
  return '<Folder><name>'+xmlEsc('Kyoto · Day '+day)+'</name>'+rows.map((p,i)=>'<Placemark><name>'+xmlEsc((i+1)+'. '+p.name)+'</name><address>'+xmlEsc(kyotoLocationLabel(p))+'</address><description>'+xmlEsc('Priority: '+planStatus(p)+' | Area: '+(p.area||'')+' | '+(p.desc||'')+' | Maps: '+(p.maps||''))+'</description><ExtendedData><Data name="Day"><value>'+xmlEsc(day)+'</value></Data><Data name="Priority"><value>'+xmlEsc(planStatus(p))+'</value></Data><Data name="Google Maps"><value>'+xmlEsc(p.maps||'')+'</value></Data></ExtendedData></Placemark>').join('')+'</Folder>';
}

function kyotoCopyText(days,highOnly){

function kyotoDirectionsUrl(rows){
  if(!rows.length) return '';
  if(rows.length===1) return rows[0].maps || ('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(kyotoLocationLabel(rows[0])));
  const r=rows.slice(0,10), origin=kyotoLocationLabel(r[0]), dest=kyotoLocationLabel(r[r.length-1]);
  const wp=r.slice(1,-1).map(kyotoLocationLabel).join('|');
  return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(origin)+'&destination='+encodeURIComponent(dest)+(wp?'&waypoints='+encodeURIComponent(wp):'')+'&dir_action=navigate';
}
function kyotoRouteLinks(day){
  const rows=kyotoExportRows(day,false);
  if(!rows.length) return '<span class="sub">אין נקודות משובצות</span>';
  const chunks=[];
  for(let i=0;i<rows.length;i+=9){
    let part=rows.slice(i,i+10);
    if(i>0 && rows[i-1] && part[0]!==rows[i-1]) part=[rows[i-1]].concat(rows.slice(i,i+9));
    chunks.push(part);
  }
  return chunks.map((r,i)=>'<a class="route" target="_blank" rel="noopener" href="'+esc(kyotoDirectionsUrl(r))+'">🗺️ מסלול Maps'+(chunks.length>1?' '+(i+1):'')+'</a>').join('');

let mobilePlanView='home';
let mobilePlaceFilter='all';
let mobilePlaceQuery='';
function mobileCityKey(day){
  const c=dayCityLabel(day);
  if(c==='קיוטו') return 'kyoto';
  if(c==='אוסקה') return 'osaka';
  const idx=TRIP.days.findIndex(d=>d.id===day.id);
  return idx>=12?'return':'tokyo';
}
function mobileCityEmoji(key){ return key==='kyoto'?'⛩️':key==='osaka'?'🏯':key==='return'?'🌃':'🗼'; }
function mobilePartIcon(part){
  const x=String(part||'');
  if(x.includes('בוקר')) return '☀️'; if(x.includes('צהר')) return '🍜'; if(x.includes('שקיעה')) return '🌇'; if(x.includes('ערב')) return '🌙'; return '📍';
}

function mobileOperationalIcon(name){
  const n=String(name||'');
  if(/צ[׳']ק.?אאוט|נסיעה|Tokyo → Kyoto|מעבר/.test(n)) return '🚄';
  if(/צ[׳']ק.?אין|מלון|Hotel/i.test(n)) return '🏨';
  if(/ארוחה|ראמן|Ramen|Mochi|Cafe|Coffee|Sweets/i.test(n)) return '🍜';
  if(/ערב|מנוחה|Downtown|Pontocho|Kamogawa/.test(n)) return '🌙';
  return '📍';
}
function isOperationalMobileItem(name){
  const n=String(name||'');
  return /צ[׳']ק.?אאוט|צ[׳']ק.?אין|התארגנות|חזרה למרכז|מנוחה|ערב קל|ערב רגוע|ערב אחרון|ארוחה קלה/.test(n);
}

function mobilePhotoForPlace(p){
  const key=(p&&p.name)||'';
  return '<span class="m-mobile-media media-card compact" data-media-name="'+esc(key)+'" data-media-state="idle"><span class="media-image-wrap"></span></span>';
}
function mobilePhotoForName(name,city){
  const place=TRIP.places.find(p=>p.name===name);
  if(!place && isOperationalMobileItem(name)) return '<span class="m-op-icon">'+mobileOperationalIcon(name)+'</span>';
  return mobilePhotoForPlace(place||{name:name,city:city||activeDay().scope[0]||'טוקיו'});
}
function mobileThumb(name, fallback){
  const m=(typeof MEDIA_CACHE!=='undefined'&&MEDIA_CACHE[name])||null;
  if(m&&m.image) return '<img loading="lazy" alt="" src="'+esc(m.image)+'">';
  return fallback;
}
function mobilePlaceRows(limit){
  const day=activeDay();
  const q=mobilePlaceQuery.trim().toLowerCase();
  let rows=TRIP.places.filter(p=>day.scope.indexOf(p.city)>=0);
  if(q) rows=rows.filter(p=>(p.name+' '+(p.area||'')+' '+(p.kind||'')+' '+(p.desc||'')).toLowerCase().includes(q));
  rows=planSort(rows);
  if(limit) rows=rows.slice(0,limit);
  return rows.map(p=>{

let revealActiveDateAfterRender=false;
function revealActiveDate(){
  const active=document.querySelector('.mx-date.on, .m-date-pill.on');
  if(!active) return false;
  const rail=active.closest('.mx-dates, .m-day-scroll');
  if(!rail) return false;
  const target=active.offsetLeft-(rail.clientWidth-active.offsetWidth)/2;
  const oldSnap=rail.style.scrollSnapType;
  rail.style.scrollSnapType='none';
  try{ rail.scrollTo({left:target,top:0,behavior:'auto'}); }
  catch(e){ rail.scrollLeft=target; }
  requestAnimationFrame(()=>{ rail.style.scrollSnapType=oldSnap; });
  return true;
}
function settleActiveDate(){
  revealActiveDate();
  setTimeout(revealActiveDate,60);
  setTimeout(revealActiveDate,180);
}

  revealActiveDateAfterRender=true;
}

    if(mobilePlanView==='home') root.innerHTML=renderMobileHome();

    else root.innerHTML=renderMobileExecute();
  }
  else if(window.innerWidth<760) root.innerHTML=renderPlanningMobile();
  else if(appMode==='plan') root.innerHTML=renderPlanning();
  else if(tab==='today') root.innerHTML=renderToday();
  else if(tab==='weather') root.innerHTML=renderWeather();

  html+='<h1>'+esc(day.date)+'</h1><p class="sub">'+esc(day.title)+(day.subtitle?' · '+esc(day.subtitle):'')+'</p>';
  html+='<a class="mymaps-link" target="_blank" rel="noopener" href="https://www.google.com/maps/d/u/0/edit?mid=1_J3VtAh7aeQm4eNmhs2IENs4dfl31Ks&ll=35.660636463289485%2C139.73541419999998&z=12">🗺️ Japan 2026 ב־Google My Maps</a>';
  if(day.empty){
    html+='<section class="now"><div class="label">יום הגעה</div><h2>בלי תכנון</h2><p class="desc">נוחתים בערך ב־13:00. היום נשאר פתוח בכוונה.</p></section>';
    return html;
  }
  const rows=visibleItems(day);
  const cur=currentIndex(day);
  const current=cur<0? null : shown(day, cur);
  const doneCount=rows.filter(x=>live.done[x.it.uid]).length;
  if(!current){
    html+='<section class="now"><div class="label">היום הסתיים</div><h2>אפשר לחזור</h2><p class="desc">כל מה שבלוח סומן. אם נשאר כוח, הלילה למטה.</p></section>';
  } else {
    const next=rows.find(x=>x.i>cur && !live.done[x.it.uid]);
    html+='<section class="now"><div class="label">עכשיו · נותרו '+(rows.length-doneCount)+'</div>';
    if(current.time) html+='<div class="time">'+esc(current.time)+'</div>';
    html+='<button class="info-btn info-current" data-info-current="'+esc(current.uid)+'" type="button" aria-label="מידע על '+esc(current.name)+'">i</button>';
    html+='<h2>'+esc(current.name)+'</h2>'+mediaBlock(current.name,'hero')+'<p class="desc">'+esc(current.desc||'')+'</p>';
    if(live.notes[current.uid]) html+='<div class="next">הערה: '+esc(live.notes[current.uid])+'</div>';
    if(isFood(current)) html+='<div class="warn">לצמחוני: בלי בשר, דגים, פירות ים ו־dashi.</div>';
    if((live.delay[day.id]||0)>0) html+='<div class="warn">השעות שנותרו הוזזו ב־'+(live.delay[day.id])+' דקות.</div>';
    if(next) html+='<div class="next">הלאה: '+esc(next.it.name)+(current.hop?' · '+esc(current.hop):'')+'</div>';
    html+='<div class="actions">';
    if(current.maps) html+='<a class="btn primary" target="_blank" rel="noopener" href="'+esc(current.maps)+'">Google Maps</a>';
    html+='<button class="btn ghost" id="done" type="button">סיימתי</button></div>';
    if(current.start!=null) html+='<button class="late" id="late" type="button">אחרנו 15 דקות</button>';
    html+='</section>';
  }
  const completedRows=rows.filter(row=>live.done[row.it.uid]);
  if(completedRows.length){
    html+='<div class="block">הושלמו</div>';
    completedRows.forEach(row=>{
      html+='<div class="row-shell"><button class="row done-row" data-undone="'+esc(row.it.uid)+'" type="button">'
        +'<span class="t">'+(row.it.time?esc(row.it.time):'✓')+'</span>'
        +'<span class="n"><span class="done-check">✓</span>'+esc(row.it.name)+'</span>'
        +'<span class="done-hint">סגור · לחץ להחזיר למסלול</span>'
        +'</button><button class="info-btn" data-info-item="'+esc(row.it.uid)+'" type="button" aria-label="מידע על '+esc(row.it.name)+'">i</button></div>';
    });
  }
  let part='';
  rows.forEach(row=>{
    if(live.done[row.it.uid] || row.i===cur) return;
    if(row.it.part && row.it.part!==part){ part=row.it.part; html+='<div class="block">'+esc(part)+'</div>'; }
    html+='<div class="row-shell"><button class="row'+(row.it.transit?' transit':'')+'" data-open="'+esc(row.it.uid)+'" type="button"><span class="t">'+(row.it.time?esc(row.it.time):'הבא')+'</span><span class="n">'+esc(row.it.name)+'</span></button><button class="info-btn" data-info-item="'+esc(row.it.uid)+'" type="button" aria-label="מידע על '+esc(row.it.name)+'">i</button></div>';
    if(row.it.hop) html+='<div class="hop">↓ '+esc(row.it.hop)+'</div>';
  });
  const skipped=day.items.filter(it=>live.skipped[it.uid]);
  if(skipped.length) html+='<button class="fold" id="show-skip" type="button">דולגו · '+skipped.length+'</button><div id="skip-list" class="hidden"></div>';
  if(day.night.length){
    html+='<div class="block">אם נשאר כוח</div><div class="night"><p>לא חלק מהלוח. בוחרים לפי אנרגיה.</p>';
    day.night.forEach(n=>{ html+= n.maps? '<a class="chip" target="_blank" rel="noopener" href="'+esc(n.maps)+'">'+esc(n.name)+'</a>' : '<span class="chip">'+esc(n.name)+'</span>'; });
    html+='</div>';
  }
  return html;
}

function restaurantYoutubeUrl(r){

}
function restaurantPhotosUrl(r){
  return 'https://www.google.com/search?tbm=isch&q='+encodeURIComponent(r.name+' '+r.city+' restaurant');
}
function restaurantCityGroup(r){
  if(r.city==='טוקיו') return 'טוקיו';
  if(r.city==='קיוטו') return 'קיוטו';
  if(r.city==='אוסקה') return 'אוסקה';
  if(r.area==='Nara' || r.city==='נארה' || r.city==='מסביב לאוסקה') return 'נארה';
  return r.city||'אחר';
}
function filteredRestaurants(){

  return RESTAURANTS.filter(r=>{
    if(restaurantCityFilter!=='הכל' && restaurantCityGroup(r)!==restaurantCityFilter) return false;
    if(restaurantFilter!=='הכל' && r.dietKey!==restaurantFilter) return false;
    if(q && (r.name+' '+r.city+' '+r.area+' '+(r.kind||'')+' '+r.dietLabel+' '+r.dietDetail+' '+r.desc+' '+restaurantCityGroup(r)).toLowerCase().indexOf(q)<0) return false;

  });

function restaurantBadgeClass(key){

function filteredPlaces(){
  return TRIP.places.filter(p=>{
    if(placeFilter==='מלונות') return p.kind==='hotel';
    if(placeFilter==='אוכל') return p.kind==='food';
    if(placeFilter!=='הכל' && p.city!==placeFilter) return false;
    if(isDesk() && placeFilter==='הכל' && tab!=='places'){
      const day=activeDay();
      if(day && day.scope.indexOf(p.city)<0) return false;
    }
    if(query && (p.name+' '+p.area+' '+p.desc).toLowerCase().indexOf(query.toLowerCase())<0) return false;
    return planStatus(p)!=='לא';
  });
}


const WEATHER_CITIES={
  'טוקיו':{name:'טוקיו',lat:35.6762,lon:139.6503},
  'קיוטו':{name:'קיוטו',lat:35.0116,lon:135.7681},
  'אוסקה':{name:'אוסקה',lat:34.6937,lon:135.5023},
  'נארה':{name:'נארה',lat:34.6851,lon:135.8048}
};
let weatherState={loading:false,error:'',updated:null,data:{},current:{}};

function weatherCityForDay(day){
  const label=dayCityLabel(day)||'';
  if(label.includes('קיוטו')) return 'קיוטו';
  if(label.includes('אוסקה')) return 'אוסקה';
  if(label.includes('נארה')) return 'נארה';
  return 'טוקיו';
}
function weatherCodeInfo(code){
  const c=Number(code);
  if(c===0) return ['☀️','בהיר'];
  if(c===1) return ['🌤️','בהיר בעיקר'];
  if(c===2) return ['⛅','מעונן חלקית'];
  if(c===3) return ['☁️','מעונן'];
  if(c===45||c===48) return ['🌫️','ערפל'];
  if([51,53,55,56,57].includes(c)) return ['🌦️','טפטוף'];
  if([61,63,65,66,67].includes(c)) return ['🌧️','גשם'];
  if([71,73,75,77].includes(c)) return ['🌨️','שלג'];
  if([80,81,82].includes(c)) return ['🌦️','ממטרים'];
  if([85,86].includes(c)) return ['🌨️','ממטרי שלג'];
  if([95,96,99].includes(c)) return ['⛈️','סופת רעמים'];
  return ['🌡️','מזג אוויר'];
}
function fmtWeatherNum(v,digits=0){
  const n=Number(v);
  return Number.isFinite(n)?n.toFixed(digits):'—';
}
function tripIso(day){
  // TRIP uses dd/mm in 2026.
  const parts=String(day.date||'').split('/');
  if(parts.length!==2) return '';
  return '2026-'+String(parts[1]).padStart(2,'0')+'-'+String(parts[0]).padStart(2,'0');
}
async function loadWeather(force=false){
  if(weatherState.loading) return;
  if(weatherState.updated && !force && (Date.now()-weatherState.updated)<30*60*1000) return;
  weatherState.loading=true; weatherState.error='';
  if(tab==='weather') render();
  try{
    const entries=await Promise.all(Object.entries(WEATHER_CITIES).map(async ([key,c])=>{
      const url='https://api.open-meteo.com/v1/forecast?latitude='+encodeURIComponent(c.lat)
        +'&longitude='+encodeURIComponent(c.lon)
        +'&current=temperature_2m,weather_code,wind_speed_10m'
        +'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max'
        +'&forecast_days=16&timezone=Asia%2FTokyo';
      const r=await fetch(url,{cache:'no-store'});
      if(!r.ok) throw new Error('Weather HTTP '+r.status);
      const j=await r.json();
      return [key,j];
    }));
    weatherState.data={}; weatherState.current={};
    entries.forEach(([key,j])=>{
      weatherState.current[key]=j.current||{};
      const d=j.daily||{}, byDate={};
      (d.time||[]).forEach((date,i)=>{
        byDate[date]={
          code:d.weather_code?.[i],
          tmax:d.temperature_2m_max?.[i],
          tmin:d.temperature_2m_min?.[i],
          pop:d.precipitation_probability_max?.[i],
          rain:d.precipitation_sum?.[i],
          wind:d.wind_speed_10m_max?.[i]
        };
      });
      weatherState.data[key]=byDate;
    });
    weatherState.updated=Date.now();
  }catch(err){
    weatherState.error='לא הצלחתי להתחבר לשירות מזג האוויר. בדוק חיבור לאינטרנט ולחץ רענן.';
  }finally{
    weatherState.loading=false;
    if(tab==='weather') render();
  }
}
function renderWeather(){
  const updated=weatherState.updated
    ? new Date(weatherState.updated).toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'})
    : 'עדיין לא עודכן';
  let h='<section class="weather-hero"><div class="label">Live Weather · Open-Meteo</div><h1>מזג אוויר לאורך הטיול</h1>';
  h+='<p>הטאב מתחבר לאינטרנט בכל פתיחה ומציג תחזית חיה לפי העיר של כל יום. תחזית יומית אמינה זמינה עד כ־16 ימים קדימה; ימים רחוקים יותר ייפתחו אוטומטית ככל שנתקרב לתאריך.</p>';
  h+='<div class="weather-toolbar"><button type="button" id="weather-refresh"'+(weatherState.loading?' disabled':'')+'>'+(weatherState.loading?'מעדכן…':'↻ רענן עכשיו')+'</button><span class="weather-updated">עדכון אחרון: '+esc(updated)+'</span></div></section>';
  if(weatherState.error) h+='<div class="weather-error">'+esc(weatherState.error)+'</div>';
  h+='<div class="weather-city-now">';
  ['טוקיו','קיוטו','אוסקה'].forEach(city=>{
    const cur=weatherState.current[city]||{};
    const info=weatherCodeInfo(cur.weather_code);
    h+='<div class="weather-now-card"><b>'+city+' · עכשיו</b><span class="big">'+info[0]+' '+fmtWeatherNum(cur.temperature_2m)+'°</span><div class="sub">'+info[1]+' · רוח '+fmtWeatherNum(cur.wind_speed_10m)+' קמ״ש</div></div>';
  });
  h+='</div><div class="weather-grid">';
  TRIP.days.forEach(day=>{
    const city=weatherCityForDay(day), iso=tripIso(day), wx=(weatherState.data[city]||{})[iso];
    if(wx){
      const info=weatherCodeInfo(wx.code);
      h+='<article class="weather-day available"><div class="top"><div><div class="date">'+esc(day.date)+' · '+esc(day.dow)+'</div><div class="city">'+esc(city)+' · '+esc(day.title||'')+'</div></div><div class="weather-icon">'+info[0]+'</div></div>';
      h+='<div class="weather-condition">'+info[1]+'</div><div class="weather-values">'
        +'<div class="weather-value"><small>מקסימום</small><b>'+fmtWeatherNum(wx.tmax)+'°C</b></div>'
        +'<div class="weather-value"><small>מינימום</small><b>'+fmtWeatherNum(wx.tmin)+'°C</b></div>'
        +'<div class="weather-value"><small>סיכוי לגשם</small><b>'+fmtWeatherNum(wx.pop)+'%</b></div>'
        +'<div class="weather-value"><small>כמות גשם</small><b>'+fmtWeatherNum(wx.rain,1)+' מ״מ</b></div>'
        +'<div class="weather-value"><small>רוח מקס׳</small><b>'+fmtWeatherNum(wx.wind)+' קמ״ש</b></div>'
        +'</div></article>';
    }else{
      h+='<article class="weather-day unavailable"><div class="top"><div><div class="date">'+esc(day.date)+' · '+esc(day.dow)+'</div><div class="city">'+esc(city)+' · '+esc(day.title||'')+'</div></div><div class="weather-icon">🗓️</div></div>'
        +'<div class="weather-condition">עדיין אין תחזית יומית אמינה</div>'
        +'<div class="weather-wait">התאריך עדיין מחוץ לטווח התחזית החיה. הכרטיס יתעדכן אוטומטית כשהיום ייכנס לטווח של כ־16 ימים.</div></article>';
    }
  });
  h+='</div><div class="weather-source">מקור נתונים: Open‑Meteo. התחזית מתעדכנת מהאינטרנט ואינה נשמרת כתחזית קבועה בקובץ. תחזיות משתנות, במיוחד ככל שטווח הזמן ארוך יותר.</div>';
  return h;
}

    let html='<div class="sheet-back" data-close="1"><div class="sheet"><div class="handle"></div><h2>החלפה ב'+esc(day.scope.join(' / '))+'</h2>';
    html+='<input class="search" id="swap-q" placeholder="חיפוש" value="'+esc(sheet.q||'')+'">';
    html+='<div id="swap-list">'+swapCards(list)+'</div>';

  }
  if(sheet.mode==='place'){
    const p=TRIP.places.find(x=>x.id===sheet.id);

function swapCards(list){
  return list.map(p=>'<button class="opt" data-pick="'+esc(p.id)+'" type="button"><b>'+esc(p.name)+'</b><div class="meta">'+esc(p.area)+' · '+esc(p.status)+'</div>'+mediaBlock(p.name,'compact')+'</button>').join('');

function swapMatches(){
  const day=activeDay();
  const q=(sheet.q||'').trim().toLowerCase();
  return TRIP.places.filter(p=>day.scope.indexOf(p.city)>=0 && planStatus(p)!=='לא' && p.kind!=='hotel' && (!q || (p.name+' '+p.area).toLowerCase().indexOf(q)>=0)).slice(0,30);
}
function markDone(){
  const day=activeDay();
  const i=currentIndex(day);
  if(i<0) return;
  const uid=day.items[i].uid;
  const prev=!!live.done[uid];
  live.done[uid]=true;
  sheet=null; // סוגר כל כרטיס/חלון פתוח
  persist();
  render();   // התחנה שסיימנו הופכת מיד לכרטיס סגור וירוק
  toast('✓ הושלם', ()=>{ live.done[uid]=prev; persist(); render(); document.getElementById('toast').classList.add('hidden'); });
}
function savedHtml(){
  const snap={snapshotId:'snap-'+Date.now().toString(36), savedAt:new Date().toISOString(), version:'v99', live:live};
  const close='</'+'script>';
  let html=document.documentElement.outerHTML;
  if(!html.startsWith('<!DOCTYPE')) html='<!DOCTYPE html>\n'+html;
  html=html.replace(/<div class="app" id="app">[\s\S]*?<!-- \/app -->/,'<div class="app" id="app"></div>\n<!-- /app -->');
  html=html.replace(/<div id="sheet">[\s\S]*?<\/div>\s*<div id="toast"/,'<div id="sheet"></div>\n<div id="toast"');
  const json=JSON.stringify(snap).replace(/</g,'\\u003c');
  html=html.replace(new RegExp('<script id="japan26-full-snapshot" type="application/json">[\\s\\S]*?'+close), '<script id="japan26-full-snapshot" type="application/json">'+json+close);
  return html;
}
async function saveFull(){
  const html=savedHtml();
  const file=new File([html], 'japan_2026_trip_dashboard_v102_images_map_modes.html', {type:'text/html'});
  if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:'יפן 2026'});
      toast('נשמר. פותחים את הקובץ החדש מ־Safari');
      return;
    }catch(e){
      if(e && e.name==='AbortError') return;
    }
  }
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='japan_2026_trip_dashboard_v108_dedicated_execute.html';
  document.body.appendChild(a); a.click(); a.remove();
  toast('אם הקובץ לא נשמר: כפתור השיתוף של Safari, ואז שמור לקבצים');
}

    else if(action==='kml') downloadKyotoKml(day,high);
    else if(action==='kmlall') downloadKyotoKml('',high);

    else if(action==='copyall') copyKyoto(['1','2','3'],high);

  }

  if(kassign){ setKyotoAssignment(kassign.dataset.kyotoId,kassign.dataset.kyotoDay); render(); return; }
  const karea=e.target.closest('[data-kyoto-area]');

  }
  const unskip=e.target.closest('[data-unskip]');
  if(unskip){ delete live.skipped[unskip.dataset.unskip]; persist(); render(); return; }
  const opt=e.target.closest('[data-osaka-plan-tab]');
  if(opt){ osakaPlanTab=opt.dataset.osakaPlanTab; render(); return; }
  const rv=e.target.closest('[data-restaurant-view]');
  if(rv){ restaurantView=rv.dataset.restaurantView; render(); return; }
  const hc=e.target.closest('[data-hotel-city]');
  if(hc){ hotelCityView=hc.dataset.hotelCity; render(); return; }
  const rc=e.target.closest('[data-rcity]');
  if(rc){ restaurantCityFilter=rc.dataset.rcity; render(); return; }
  const rf=e.target.closest('[data-rfilter]');
  if(rf){ restaurantFilter=rf.dataset.rfilter; render(); return; }
  const f=e.target.closest('[data-filter]');
  if(f){ placeFilter=f.dataset.filter; render(); return; }
  const card=e.target.closest('[data-place]');
  if(card){ sheet={mode:'place', id:card.dataset.place}; render(); return; }
  if(e.target.id==='weather-refresh'){ loadWeather(true); return; }
  if(e.target.id==='save-full') saveFull();
};
document.getElementById('app').oninput=e=>{
  if(e.target.id==='mobile-place-q'){ mobilePlaceQuery=e.target.value; render(); return; }
  if(e.target.id==='kyoto-q'){ kyotoQuery=e.target.value; render(); return; }
  if(e.target.id==='plan-q'){ planQuery=e.target.value; render(); return; }
  if(e.target.id==='rq'){
    restaurantQuery=e.target.value;
    const rows=filteredRestaurants();
    const count=document.getElementById('restaurant-count');
    const list=document.getElementById('restaurant-list');
    if(count) count.textContent=rows.length+' מקומות';
    if(list) list.innerHTML=restaurantCards(rows);
    return;
  }
  if(e.target.id==='q'){
    query=e.target.value;
    const rows=filteredPlaces();
    const count=document.getElementById('place-count');
    const list=document.getElementById('place-list');
    if(count) count.textContent=rows.length+' במאגר';
    if(list) list.innerHTML=placeCards(rows);
    requestAnimationFrame(hydrateMedia);
  }
};
document.getElementById('app').onchange=e=>{
  if(e.target.id==='plan-area'){ planAreaFilter=e.target.value; render(); return; }
};
document.getElementById('sheet').onclick=e=>{
  if(openMediaYoutube(e.target)){ e.preventDefault(); e.stopPropagation(); return; }
  const pst=e.target.closest('[data-plan-id][data-plan-status]');
  if(pst){ setPlanStatus(pst.dataset.planId,pst.dataset.planStatus); render(); return; }
  if(e.target.dataset.close){ sheet=null; render(); return; }
  if(e.target.id==='skip'){
    const uid=sheet.uid;
    live.skipped[uid]=true; sheet=null; persist(); render();
    toast('דולג', ()=>{ delete live.skipped[uid]; persist(); render(); document.getElementById('toast').classList.add('hidden'); });
    return;
  }
  if(e.target.id==='longer' || e.target.id==='shorter'){
    const delta=e.target.id==='longer'?15:-15;
    live.cascade[sheet.uid]=(live.cascade[sheet.uid]||0)+delta;
    persist(); render(); return;
  }
  if(e.target.id==='swap'){ sheet={mode:'swap', uid:sheet.uid, q:''}; render(); return; }
  const pick=e.target.closest('[data-pick]');
  if(pick){
    const p=TRIP.places.find(x=>x.id===pick.dataset.pick);
    const day=activeDay();
    const it=day.items.find(x=>x.uid===sheet.uid);
    if(p && it && day.scope.indexOf(p.city)>=0){
      live.replace[it.uid]={name:p.name, desc:p.desc||'', maps:p.maps||'', kind:p.kind==='food'?'מסעדה / אוכל':it.kind};
      persist();
    }
    sheet=null; render(); return;
  }
};
document.getElementById('sheet').oninput=e=>{
  if(e.target.id==='note' && sheet){ live.notes[sheet.uid]=e.target.value; persist(); }
  if(e.target.id==='swap-q' && sheet){
    sheet.q=e.target.value;
    const list=document.getElementById('swap-list');
    if(list) list.innerHTML=swapCards(swapMatches());
    requestAnimationFrame(hydrateMedia);
  }
};
render();
matchMedia('(min-width:960px)').addEventListener('change', function(){ render(); });
matchMedia('(max-width:759px)').addEventListener('change', function(){ render(); });
const onPill=document.querySelector('.pill.on');
if(onPill && onPill.parentElement){
  const box=onPill.parentElement;
  box.scrollLeft = onPill.offsetLeft - (box.clientWidth-onPill.offsetWidth)/2;
}

</script>
</body>
</html>
