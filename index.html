"maps":"https://www.google.com/maps/search/?api=1&query=Kodai-ji+Japan","booking":"","website":"","kyotoCandidate":true,"info":"Kōdai-ji נוסד בתחילת המאה ה־17 בידי Nene לזכר בעלה Toyotomi Hideyoshi. הגנים, מבני התה והמסלול על הגבעה נותנים חוויה אינטימית יותר מהאתרים הגדולים. במסמכי המקור הוא הופיע כתחנה חזקה במיוחד בין Ninenzaka ל־Yasaka.","kyotoWhy":"בתחילת דצמבר יכול להיות עדיין יפה מאוד בשלכת מאוחרת; כדאי לבדוק מצב עלים קרוב לנסיעה.","kyotoCombine":"Ninenzaka → Kōdai-ji → Yasaka Shrine → Gion.","kyotoSources":["1811"],"youtube":"https://www.youtube.com/results?search_query=Kodai-ji+Kyoto+Japan","kyotoMinutes":75,"kyotoDefaultDay":"3"},{"id":"p_a2e4e280169b","name":"Maruyama Park","city":"קיוטו","area":"Higashiyama + Gion","status":"רוצה","kind":"attraction","desc":"פארק עירוני ירוק ליד Yasaka Shrine.","duration":"30–45 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Maruyama+Park+Japan","booking":"","website":"","kyotoCandidate":true,"info":"הפארק המרכזי ליד Yasaka Shrine משמש מרחב נשימה בין המקדשים לרובע Gion. הוא פחות 'אתר חובה' ויותר מקום טוב לעצירה, אוכל קטן או מעבר ירוק בין אזורים.","kyotoWhy":"אם היום עמוס אפשר לעבור דרכו בלי להקצות זמן נפרד.","kyotoCombine":"Yasaka Shrine + Gion.","kyotoSources":["v79"],"youtube":"https://www.youtube.com/results?search_query=Maruyama+Park+Kyoto+Japan","kyotoMinutes":38},{"id":"p_b339b9da6202","name":"Yasaka Shrine","city":"קיוטו","area":"Higashiyama + Gion","status":"רוצה","kind":"attraction","desc":"מקדש שינטו מרכזי בכניסה ל-Gion.","duration":"30–45 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Yasaka+Shrine+Japan","booking":"","website":"","kyotoCandidate":true,"info":"מקדש שינטו מרכזי בקצה Gion והבית הרוחני של Gion Matsuri. הוא מספק מעבר מעניין מבודהיזם של Kiyomizu/Kōdai-ji לעולם השינטו, וממנו נכנסים ישירות לרובע Gion.","kyotoWhy":"פתוח לאורך היום ולכן קל להשאיר אותו גמיש.","kyotoCombine":"Kōdai-ji / Maruyama Park → Yasaka → Gion.","kyotoSources":["1811"],"youtube":"https: ote":"","maps":"https://www.google.com/maps/search/?api=1&query=Matcha+%2F+Tea+Street+Japan","booking":"","website":"","kyotoCandidate":true,"info":"Uji היא אחת הערים המזוהות ביותר עם תה ירוק איכותי. הרחובות סביב Byōdō-in מלאים חנויות תה, wagashi וקינוחי matcha.","kyotoWhy":"להעדיף מקום שמתמקד בתה ולא רק קינוח אינסטגרמי.","kyotoCombine":"Byōdō-in + tea experience.","kyotoSources":["v79"],"youtube":"https://www.youtube.com/results?search_query=Matcha+%2F+Tea+Street+Kyoto+Japan","kyotoMinutes":75,"kyotoDefaultDay":"2"},{"id":"p_e724aa1758f8","name":"Tea ceremony / matcha experience","city":"קיוטו","area":"Uji","status":"רוצה","kind":"attraction","desc":"חוויה מודרכת של תה יפני או הכנת matcha.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tea+ceremony+%2F+matcha+experience+Japan","booking":"","website":"","kyotoCandidate":true,"info":"חוויה מודרכת של הכנת matcha מאפשרת להבין את הטקס, הכלים והמחוות ולא רק לשתות תה. במסמכי Kyoto 'Living Kyoto' הומלץ להקדיש מקום לחוויה כזו כחלק מהבנת התרבות.","kyotoWhy":"אם עושים טקס תה מלא במרכז Kyoto, אין חובה לעשות גם גרסה מלאה ב-Uji; אפשר לבחור אחת.","kyotoCombine":"Uji Tea Street או Central Kyoto.","kyotoSources":["2211","v79"],"youtube":"https://www.youtube.com/results?search_query=Tea+ceremony+%2F+matcha+experience+Kyoto+Japan","kyotoMinutes":75,"kyotoDefaultDay":"2"},{"id":"p_90be93f4db09","name":"Dotonbori","city":"אוסקה","area":"Namba + Dotonbori + Shinsaibashi","status":"חובה","kind":"attraction","desc":"אזור הבילוי האייקוני של אוסקה עם שלטי ניאון, אוכל וחיי לילה.","duration":"1.5–3 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Dotonbori+Japan","booking":"","website":"","info":"דוטונבורי לא התחיל כאזור אוכל וניאון אלא כפרויקט תשתית מהמאה ה־17. בשנת 1612 החל הסוחר יאסוי דוטון להשקיע מהונו בחפירת תעלה שנועדה לחבר את אזור מינאמי לרשת הנהרות של אוסקה. לאחר מותו המשיכו בני משפחתו את העבודה, והערוץ שנוצר קיבל את שמו. כמה עשרות שנים לאחר מכן החל השוגונאט לרכז לאורך הגדה הדרומית תיאטראות, ובהדרגה הפך האזור לאחד ממרכזי הבידור הגדולים של אוסקה — עם קבוקי, בונראקו, מופעי סיפורים ובתי תה.\n\nמסביב לקהל של התיאטראות צמחו מסעדות ודוכני אוכל, וזה הבסיס לקשר החזק בין דוטונבורי לבין תרבות ה־kuidaore — הרעיון האוסאקאי של ליהנות מאוכל בלי לחשוב יותר מדי על ההוצאה. השלטים הענקיים שמזוהים היום עם האזור הם המשך מודרני לתחרות ההיסטורית על תשומת לבו של הקהל. גם כיום נשאר באזור קשר ישיר לתרבות הבמה: Shochikuza ממשיך להציג קבוקי, והתיאטראות של Namba משמרים את מסורת הבידור והקומדיה של אוסקה. לכן דוטונבורי הוא לא רק רחוב נוצץ; הוא ציר שבו תשתית, תיאטרון, אוכל ותרבות פופ התחברו במשך יותר מארבע מאות שנה.","infoSource":"https://www.osaka-info.jp/en/spot/dotonbori/","historyVerified":true},{"id":"p_30994ccde33a","name":"Glico Sign","city":"אוסקה","area":"Namba + Dotonbori + Shinsaibashi","status":"רוצה","kind":"attraction","desc":"השלט המפורסם על תעלת Dotonbori.","duration":"10–15 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Glico+Sign+Japan","booking":"","website":"","info":"שלט Glico מעל Dotonbori הוא אחד האייקונים המוכרים ביותר של אוסקה. הפרסומת הראשונה של Glico באזור הותקנה בשנת 1935, בתקופה שבה Dotonbori כבר היה מרכז בידור עמוס ותחרותי ושלטי ניאון גדולים הפכו לחלק מזהות הרחוב.\n\nהדמות הרצה בידיים מורמות מבוססת על הרעיון של “300 meters in one piece” — הסיסמה המקורית של סוכריית הקרמל Glico, שנועדה להמחיש את האנרגיה שהיא מספקת. לאורך השנים הוחלף השלט כמה פעמים, עם טכנולוגיות תאורה שונות ועיצובים מתעדכנים.\n\nהשלט הנוכחי הוא דור חדש של אותו סמל, אבל הרציפות מאז שנות ה־30 היא מה שהפך אותו לנקודת ציון תרבותית. הוא מייצג את הצד המסחרי, התיאטרלי והצבעוני של Dotonbori — מקום שבו פרסומת הפכה לחלק מהנוף העירוני והזיכרון הקולקטיבי.","infoSource":"https://www.glico.com/global/contents/glicosign/","historyVerified":true},{"id":"p_cb84d154834e","name":"Tombori River Walk","city":"אוסקה","area":"Namba + Dotonbori + Shinsaibashi","status":"רוצה","kind":"attraction","desc":"טיילת לאורך התעלה בלב Dotonbori.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tombori+River+Walk+Japan","booking":"","website":"","info":"Tombori River Walk הוא הטיילת המודרנית שנבנתה לאורך תעלת Dotonbori, אבל הסיפור שלה מתחיל בתחילת המאה ה־17. התעלה נחפרה כחלק מפרויקט פיתוח עירוני שהחל ב־1612, ונועדה לשפר את התנועה והמסחר באזור הדרומי של אוסקה.\n\nבמהלך תקופת Edo הגדה הדרומית של התעלה התמלאה בתיאטראות, בתי תה ומקומות בילוי. הקשר בין מים, במה ומסחר הפך את Dotonbori לאחד מאזורי הבידור המובילים בעיר.\n\nהטיילת של ימינו היא חלק ממאמץ מודרני להחזיר את התעלה למרכז החיים העירוניים, אחרי עשרות שנים שבהן כבישים ותשתיות הרחיקו אנשים מהמים. לכן ההליכה כאן מחברת בין שני סיפורים: תעלת מסחר בת יותר מ־400 שנה, והתחדשות עירונית שמנסה שוב להפוך את הנהר למרחב ציבורי.","infoSource":"https://osaka-info.jp/en/spot/dotonbori/","historyVerified":true},{"id":"p_9ec025b36670","name":"Shinsaibashi-suji","city":"אוסקה","area":"Namba + Dotonbori + Shinsaibashi","status":"רוצה","kind":"attraction","desc":"רחוב קניות מקורה ארוך ורציף.","duration":"1–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Shinsaibashi-suji+Japan","booking":"","website":"","info":"Shinsaibashi-suji הוא אחד מצירי המסחר הוותיקים ביותר באוסקה. האזור מתועד כאזור קניות כבר מתקופת Edo, והרחוב התפתח לצד גשר Shinsaibashi והדרך שהובילה דרומה אל מרכזי המסחר והבידור של Minami. במשך כ־380 שנה הוא שמר על תפקידו כרחוב שבו אוסקה “רואה ונראית”.\n\nבתקופת Meiji ו־Taishō הרחוב הפך לאחד המקומות הראשונים בעיר שבהם אופנה מערבית, חנויות כלבו ומותגים מודרניים התערבבו עם בתי מסחר מסורתיים. בהמשך נוספה קירוי הארקייד, שאפשר פעילות מסחרית כמעט בכל מזג אוויר.\n\nכיום מדובר בכ־600 מטר של ארקייד שמחבר בין Nagahori-dori לאזור Dotonbori. למרות המותגים הבינלאומיים והחנויות המודרניות, החשיבות שלו היא ברציפות: זהו לא קניון חדש אלא רחוב מסחרי שחי כמעט ארבע מאות שנה ומשקף את השינויים באופנה, צריכה וחיי העיר של אוסקה.","infoSource":"https://osaka-info.jp/en/spot/shinsaibashi-suji-shopping-street/","historyVerified":true},{"id":"p_5216b27a8e7b","name":"Amerikamura","city":"אוסקה","area":"Namba + Dotonbori + Shinsaibashi","status":"רוצה","kind":"attraction","desc":"אזור צעיר עם אופנה, וינטג׳ ותרבות רחוב.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Amerikamura+Japan","booking":"","website":"","info":"Amerikamura, או Amemura, הוא אחד האזורים המזוהים ביותר עם תרבות הצעירים של אוסקה. בתקופת Edo נקרא חלק מהאזור “Sumiyamachi” משום שפחם שהגיע ממפרץ אוסקה דרך Dotonbori נאסף ונמכר כאן.\n\nהזהות המודרנית של Amerikamura נולדה בסוף שנות ה־60 ותחילת שנות ה־70. מחסנים ישנים הוסבו לחנויות, ובעלי עסקים החלו לייבא בגדים, ג׳ינסים, תקליטים וחפצים מהחוף המערבי של ארצות הברית ומהוואי. עם הזמן התרבו חנויות ה־vintage והאופנה, ונולד הכינוי “America Village”.\n\nבשנות ה־80 וה־90 האזור הפך למוקד של מוזיקה, אופנת רחוב, מועדונים ותרבות נוער. Sankaku Park הפך לנקודת מפגש ולבמה בלתי רשמית לאמנים, מוזיקאים וקומיקאים צעירים. גם כיום האזור משמש מעבדת טרנדים עירונית, וההיסטוריה שלו מעניינת דווקא משום שהוא נוצר מלמטה — לא מפרויקט ממשלתי, אלא מחנויות קטנות, צעירים ותרבות יבוא.","infoSource":"https://osaka-info.jp/en/spot/america-mura-american-village/","historyVerified":true},{"id":"p_ac62eaf4c1e0","name":"Kuromon Market","city":"אוסקה","area":"Namba + Dotonbori + Shinsaibashi","status":"רוצה","kind":"attraction","desc":"שוק אוכל פופולרי עם דוכנים ומוצרים מקומיים.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kuromon+Market+Japan","booking":"","website":"","info":"Kuromon Market הוא אחד המקומות הטובים להבין מהם למה אוסקה מזוהה כל כך חזק עם אוכל ומסחר. שורשיו מגיעים לסוף תקופת Edo, סביב 1822–1823, כאשר סוחרים החלו למכור דגים שהגיעו מ־Sakai ומ־Kishu ליד מקדש Enmyōji שבאזור Nipponbashi. ליד המקדש היה שער שחור בולט, ומכאן הגיע בהמשך השם “Kuromon” — השער השחור.\n\nבמשך עשרות שנים נקרא השוק Enmyōji Market. בשנת 1912 שריפה גדולה באזור Namba החריבה את המקדש וחלק מהשוק, ולאחר מכן קיבל השוק את השם Kuromon Market. הוא נהרס שוב בהפצצות של מלחמת העולם השנייה ונבנה מחדש בתקופה שלאחר המלחמה.\n\nכיום הרחוב המקורה משתרע על כ־580 מטר ויש בו בערך 150 חנויות. במשך שנים רבות הוא שירת מסעדות, שפים ותושבים מקומיים — במיוחד בתחום הדגים הטריים, פוגו, ירקות ופירות — ורק בעשורים האחרונים הפך גם לאתר תיירות בינלאומי גדול. לכן מעבר ל־street food, זהו שריד חי למסורת של אוסקה כ“מטבח של יפן”.","infoSource":"https://osaka-info.jp/en/spot/kuromon-market/","historyVerified":true},{"id":"p_e0cd64effcec","name":"Namba Yasaka Shrine","city":"אוסקה","area":"Namba + Dotonbori + Shinsaibashi","status":"חובה","kind":"attraction","desc":"מקדש קטן ומיוחד עם מבנה ענק בצורת ראש אריה.","duration":"30–45 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Namba+Yasaka+Shrine+Japan","booking":"","website":"","info":"Namba Yasaka Shrine הוא אחד המקומות שבהם רואים היטב את השכבות הדתיות של אוסקה. לפי המסורת המקומית, האתר היה ידוע בעבר כ־Naniwa Shita-no-Miya ונחשב למקום שבו סגדו לאל המגן של אזור Namba. במשך מאות שנים התקיימו כאן זה לצד זה יסודות של שינטו ובודהיזם, מצב שהיה נפוץ ביפן עד רפורמות תקופת Meiji, כאשר המדינה הורתה על הפרדה רשמית בין שתי הדתות.\n\nחלק גדול מהמתחם ההיסטורי אבד, והמבנה הראשי נהרס בהפצצות של 1945. המקדש שאנו רואים היום הוא ברובו תוצאה של שיקום שלאחר המלחמה. הסמל הבולט ביותר הוא ה־Shishi-den — מבנה בצורת ראש אריה עצום, בגובה כ־12 מטר. הוא אינו שריד עתיק אלא יצירה מודרנית שמחברת אדריכלות דתית עם פולקלור מקומי. לפי האמונה, פה האריה “בולע” מזל רע ומביא הצלחה. טקס משיכת החבל שנערך במקום קשור למיתוס של Susanoo והנחש Yamata-no-Orochi, והוא הוכר כנכס פולקלורי בלתי מוחשי של העיר. השילוב בין אתר קדום, הרס מלחמתי ושיקום מודרני הופך אותו להרבה יותר מסתם נקודת צילום.","infoSource":"https://osaka-info.jp/en/spot/nanbayasakajinja/","historyVerified":true},{"id":"p_01d4157a7616","name":"Namba Parks","city":"אוסקה","area":"Namba + Dotonbori + Shinsaibashi","status":"רוצה","kind":"attraction","desc":"קניון אדריכלי עם גינות טרסה ירוקות.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Namba+Parks+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"hotel_cross_osaka","name":"Cross Hotel Osaka","city":"אוסקה","area":"Namba + Dotonbori + Shinsaibashi","status":"אולי","kind":"hotel","desc":"מלון 4★ במיקום מצוין בלב Namba/Shinsaibashi, דקה מדוטונבורי וכמה דקות מתחנות Namba. בחירה חזקה אם רוצים לצאת מהמלון ישר לאזורי האוכל והקניות.","duration":"לינה","note":"המלצת מלון 4★ · Namba / Dotonbori","maps":"https://www.google.com/maps/search/?api=1&query=Cross+Hotel+Osaka+Japan","booking":"https://www.booking.com/hotel/jp/cross-osaka.html","website":"","historyNotApplicable":true},{"id":"hotel_monterey_grasmere","name":"Hotel Monterey Grasmere Osaka","city":"אוסקה","area":"Namba + Dotonbori + Shinsaibashi","status":"אולי","kind":"hotel","desc":"מלון 4★ שמחובר ישירות ל-JR Namba Station ובמרחק הליכה מדוטונבורי. נוח במיוחד לנסיעות ולמי שרוצה לינה מרכזית בלי להיות ממש בתוך ההמולה.","duration":"לינה","note":"המלצת מלון 4★ · JR Namba","maps":"https://www.google.com/maps/search/?api=1&query=Hotel+Monterey+Grasmere+Osaka+Japan","booking":"https://www.booking.com/hotel/jp/monterey-grasmere.html","website":"","historyNotApplicable":true},{"id":"food_pivot_base","name":"Pivot BASE Cafe & Bar @ Dotonbori","city":"אוסקה","area":"Namba + Dotonbori + Shinsaibashi","status":"רוצה","kind":"food","desc":"מקום טבעוני בדוטונבורי שמתאים לעצירה קלה או ארוחה, במיקום נוח מאוד בתוך אזור הערב המרכזי.","duration":"45–75 דק׳","note":"טבעוני.","maps":"https://www.google.com/maps/search/?api=1&query=Pivot+BASE+Cafe+Bar+Dotonbori+Osaka","booking":"","website":"https://dotonbori-night.com/pivot/en/","historyNotApplicable":true},{"id":"food_oko_takoyaki","name":"OKO Takoyaki","city":"אוסקה","area":"Namba + Dotonbori + Shinsaibashi","status":"רוצה","kind":"food","desc":"אופציה טבעונית למנות רחוב יפניות כמו takoyaki/kushikatsu — שימושי במיוחד כדי לטעום אוכל בסגנון אוסקה בלי דגים.","duration":"30–60 דק׳","note":"טבעוני.","maps":"https://www.google.com/maps/search/?api=1&query=OKO+Takoyaki+Osaka","booking":"","website":"https://www.instagram.com/oko_tako_osaka/","historyNotApplicable":true},{"id":"p_47942b8199fb","name":"Den Den Town","city":"אוסקה","area":"Nipponbashi + Shinsekai + Tennoji","status":"חובה","kind":"attraction","desc":"רובע גיימינג, אנימה ואלקטרוניקה — גרסת אוסקה ל-Akihabara.","duration":"1.5–3 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Den+Den+Town+Japan","booking":"","website":"","info":"Den Den Town הוא אזור המסחר של Nipponbashi שהתפתח לאורך יותר ממאה שנה ושינה זהות כמה פעמים. בתקופת Edo נקרא האזור Nagamachi ושימש כתחנת מעבר ומסחר לאורך הדרך. בתקופת Meiji הוא התפרסם במיוחד בחנויות ספרים יד שנייה.\n\nאחרי מלחמת העולם השנייה החלו להיפתח באזור חנויות שמתמחות בחלקי רדיו, כלי עבודה וציוד אלקטרוני. מכאן צמח בהדרגה “עיר החשמל” של אוסקה — מקבילה מערבית ל־Akihabara של טוקיו. עם השנים עבר חלק מהמסחר האלקטרוני לרשתות גדולות ולאינטרנט, והאזור המציא את עצמו מחדש סביב מחשבים, משחקים, anime, figures ותרבות otaku.\n\nכיום Den Den Town הוא תערובת של שתי שכבות: Sakaisuji עם חנויות אלקטרוניקה וציוד, ו־Ota Road עם תרבות anime, manga, maid cafés וחנויות אספנות. לכן גם אם מגיעים בעיקר בשביל קניות, מעניין לראות אותו כדוגמה לרובע מסחרי ששינה פונקציה שוב ושוב בהתאם לטכנולוגיה ולטעם הציבור.","infoSource":"https://osaka-info.jp/experience/en/osaka/spot/229","historyVerified":true},{"id":"p_f7d3f1dbc5cd","name":"Retro game stores","city":"אוסקה","area":"Nipponbashi + Shinsekai + Tennoji","status":"רוצה","kind":"attraction","desc":"חנויות משחקי וידאו ישנים, קונסולות ופריטי אספנות.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Retro+game+stores+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_b8a8e7a18719","name":"Shinsekai","city":"אוסקה","area":"Nipponbashi + Shinsekai + Tennoji","status":"רוצה","kind":"attraction","desc":"רובע רטרו צבעוני עם שלטים, אוכל ומגדל Tsutenkaku.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Shinsekai+Japan","booking":"","website":"","info":"Shinsekai — “העולם החדש” — נולד כחזון אורבני עתידני בתחילת המאה ה־20. לאחר התערוכה התעשייתית הלאומית החמישית שנערכה באזור ב־1903, החל פיתוח אינטנסיבי של השטח. החלק המזרחי הפך ל־Tennoji Park, ואילו במערב נבנו בשנת 1912 מגדל Tsutenkaku הראשון ופארק השעשועים Luna Park. התכנון שילב השראות אירופיות ואמריקאיות: המגדל הזכיר שילוב של שער הניצחון ומגדל אייפל, בעוד פארק השעשועים ניסה לשחזר את תחושת הערים המודרניות של המערב.\n\nבשנות ה־20 וה־30 התמלא האזור בתיאטראות, בתי קולנוע, מסעדות ומקומות בילוי. לאחר המלחמה הוא איבד הרבה מהזוהר המקורי שלו, אבל דווקא אז התפתחה הזהות ה“עממית” והמחוספסת שמזוהה עם Shinsekai כיום. המגדל הנוכחי נבנה ב־1956, והאזור סביבו נעשה סמל של Osaka retro — פחות מלוטש מ־Umeda או Namba, אבל עשיר בהיסטוריה של בידור עממי, kushikatsu ותרבות שכונתית. מה שנראה היום כמו שכונת נוסטלגיה “מעוצבת” הוא למעשה שריד של אחד מניסויי העירוניות המודרנית הראשונים של יפן.","infoSource":"https://www.osaka-info.jp/en/spot/shinsekai/","historyVerified":true},{"id":"p_e73983d6dcbc","name":"Tsutenkaku","city":"אוסקה","area":"Nipponbashi + Shinsekai + Tennoji","status":"רוצה","kind":"attraction","desc":"מגדל תצפית רטרו בלב Shinsekai.","duration":"45–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tsutenkaku+Japan","booking":"","website":"","info":"Tsutenkaku הוא סמל של Shinsekai ושל האופן שבו אוסקה דמיינה את העתיד בתחילת המאה ה־20. המגדל הראשון הוקם ב־1912 כחלק ממתחם Luna Park. העיצוב שלו שילב מוטיבים של שער הניצחון ומגדל אייפל, ובגובה 64 מטר הוא נחשב אז למבנה הגבוה מסוגו במזרח אסיה. שמו, שפירושו בקירוב “מגדל המגיע לשמים”, ניתן על ידי המלומד Fujisawa Nangaku.\n\nבמהלך מלחמת העולם השנייה נפגע המגדל, וב־1943 פורק כדי להשתמש במתכת שלו כחומר גלם מלחמתי. רק ב־1956 נבנה המגדל הנוכחי, בגובה 103 מטר. האדריכל היה Tachu Naito, מהמהנדסים הבולטים ביפן בתחום המגדלים. Tsutenkaku הפך שוב לסמל של התאוששות אוסקה אחרי המלחמה. בקומה העליונה מזוהה המקום עם דמות Billiken — “אל המזל” שהגיע במקור מארצות הברית בתחילת המאה ה־20 והוטמע בתרבות Shinsekai. המגדל הוכר כנכס תרבות מוחשי רשום של יפן, ולכן הוא מעניין לא רק כתצפית אלא גם כסיפור על מודרניזציה, מלחמה ושיקום.","infoSource":"https://osaka-info.jp/experience/en/osaka/spot/332","historyVerified":true},{"id":"p_37a4619d359a","name":"Tennoji Park","city":"אוסקה","area":"Nipponbashi + Shinsekai + Tennoji","status":"רוצה","kind":"attraction","desc":"פארק עירוני גדול ליד Shinsekai ו-Abeno.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tennoji+Park+Japan","booking":"","website":"","info":"Tennoji Park יושב על אזור שהיה חשוב באוסקה הרבה לפני שהפך לפארק ציבורי. בתוך השטח נמצא Chausuyama, גבעה הקשורה לקרבות הגדולים בין בית Toyotomi לבית Tokugawa בתחילת המאה ה־17. בחורף 1614 שימשה הגבעה בסיס לכוחות Tokugawa Ieyasu, ובמערכה של קיץ 1615 היא נקשרה לכוחות Sanada Yukimura — אחד הגיבורים המזוהים ביותר עם נפילת בית Toyotomi.\n\nהפארק המודרני התפתח בתקופת Meiji כחלק מהמאמץ להפוך את אוסקה לעיר מודרנית עם מוסדות ציבור. בהמשך נוספו אליו גן החיות Tennoji, שנפתח ב־1915, מוזיאון האמנות של אוסקה וגן Keitakuen. Keitakuen היה בעבר חלק מאחוזת משפחת Sumitomo ונמסר לעיר בשנות ה־20. לכן הפארק משלב שלוש שכבות שונות: אתר הקשור למלחמות הפיאודליות, מוסדות ציבור שנוצרו עם המודרניזציה של יפן, ומרחב ירוק עירוני שנועד לרווחת הציבור.","infoSource":"https://osaka-info.jp/experience/en/osaka/spot/228","historyVerified":true},{"id":"p_ead4ec8da309","name":"Abeno Harukas 300","city":"אוסקה","area":"Nipponbashi + Shinsekai + Tennoji","status":"רוצה","kind":"attraction","desc":"תצפית פנורמית גבוהה מעל אוסקה.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Abeno+Harukas+300+Japan","booking":"","website":"","info":"Abeno Harukas מייצג את אוסקה של המאה ה־21 ולא את העיר ההיסטורית. גורד השחקים, המתנשא לגובה 300 מטר באזור Tennoji/Abeno, נבנה כחלק מפרויקט התחדשות עירונית גדול של קבוצת Kintetsu סביב תחנת Osaka-Abenobashi. כאשר נפתח ב־2014 הוא היה הבניין הגבוה ביותר ביפן, תואר שהחזיק עד השלמת Azabudai Hills בטוקיו.\n\nהשם Harukas נגזר ממילה יפנית ארכאית שמשמעותה “להאיר” או “להבהיר את השמים”. המבנה תוכנן כעיר אנכית: רכבת ותחבורה בתחתית, כלבו, משרדים, מוזיאון, מלון ותצפית בקומות העליונות. Harukas 300 משתרע בקומות 58–60, ומאפשר להבין את אוסקה כמרחב מטרופוליני: מדרום רואים את Sakai והכיוון ל־Kansai Airport, ממערב את מפרץ אוסקה, ומצפון את מרכז העיר ורכס ההרים שמעבר. הסיפור שלו הוא פחות “עבר” ויותר הדוגמה לאופן שבו אוסקה מנסה לרכז תחבורה, מסחר, תרבות ותיירות בתוך מבנה אחד.","infoSource":"https://discover.osaka-info.jp/en/spots/abeno-harukas","historyVerified":true},{"id":"p_239d810b6597","name":"Neko to Cafe Osaka Tennoji rescue cat café","city":"אוסקה","area":"Nipponbashi + Shinsekai + Tennoji","status":"רוצה","kind":"attraction","desc":"בית קפה עם חתולי הצלה/אימוץ.","duration":"60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Neko+to+Cafe+Osaka+Tennoji+rescue+cat+caf%C3%A9+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_9b5747e92663","name":"Nintendo OSAKA","city":"אוסקה","area":"Umeda","status":"רוצה","kind":"attraction","desc":"חנות Nintendo גדולה בתוך Daimaru Umeda.","duration":"45–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Nintendo+OSAKA+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_86b2008c3c2f","name":"Osaka Station City","city":"אוסקה","area":"Umeda","status":"רוצה","kind":"attraction","desc":"מתחם התחנה העצום עם אדריכלות, קניות ותצפיות.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Osaka+Station+City+Japan","booking":"","website":"","info":"Osaka Station City יושב על אתר שקשור להיסטוריה של הרכבת היפנית כמעט מראשיתה. תחנת Osaka הראשונה נפתחה ב־11 במאי 1874 כחלק מקו Osaka–Kobe, שהיה בין קווי הרכבת הראשונים במדינה. באותה תקופה Umeda עדיין הייתה בשולי העיר, והתחנה המערבית החדשה עצמה הפכה לאטרקציה לתושבים.\n\nבמהלך יותר ממאה שנה התחנה נבנתה מחדש כמה פעמים ככל שאוסקה התרחבה והפכה למטרופולין. המתחם הנוכחי הוא למעשה “הדור החמישי” של Osaka Station. South Gate Building נפתח במרץ 2011, תחנת הגשר באפריל, ו־North Gate Building במאי 2011.\n\nהרעיון של Osaka Station City הוא לטשטש את הגבול בין תחנת רכבת לעיר: תחבורה, קניות, מסעדות, קולנוע, משרדים וגנים ציבוריים מחוברים בתוך מבנה אחד. הגג העצום מעל המסילות והכיכרות הרבות משקפים תפיסה יפנית מודרנית שבה תחנת רכבת היא מרכז עירוני שלם, לא רק נקודת מעבר.","infoSource":"https://www.osakastationcity.com/about/gallery/develop.php","historyVerified":true},{"id":"p_f31e51331cd1","name":"Grand Front Osaka","city":"אוסקה","area":"Umeda","status":"רוצה","kind":"attraction","desc":"קניות, אוכל וחללים מודרניים ליד התחנה.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Grand+Front+Osaka+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_4ea296b4ad69","name":"Grand Green Osaka","city":"אוסקה","area":"Umeda","status":"רוצה","kind":"attraction","desc":"פארק ומתחם עירוני חדש וירוק ליד Osaka Station.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Grand+Green+Osaka+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_da3312096d32","name":"HEP FIVE Ferris Wheel","city":"אוסקה","area":"Umeda","status":"רוצה","kind":"attraction","desc":"גלגל ענק אדום על גג מרכז קניות בלב Umeda.","duration":"30–45 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=HEP+FIVE+Ferris+Wheel+Japan","booking":"","website":"","info":"גלגל הענק האדום של HEP FIVE הוא אטרקציה עירונית מודרנית ולא אתר היסטורי עתיק, אבל הוא מעניין מבחינת התפתחות Umeda כמרכז בידור וקניות. HEP FIVE תוכנן כקומפלקס שמחבר מסחר, תרבות צעירה ואטרקציה בולטת לעין בתוך אזור התחנות הצפוף של Umeda.\n\nהגלגל בקוטר כ־75 מטר בנוי ממש כחלק מהמבנה, ונקודת השיא שלו מגיעה לכ־106 מטר מעל הקרקע. כלומר זה אינו גלגל ענק בפארק שעשועים אלא אובייקט אדריכלי שמשולב בקניון. הוא הפך לאחד מסימני ההיכר של Umeda ולדוגמה לתרבות המסחר היפנית של שנות ה־90 וה־2000, שבה מרכזי קניות נבנו כחוויות בילוי מלאות ולא רק כמקומות לקנייה.","infoSource":"https://www.osaka-info.jp/en/spot/hep-five-ferris-wheel/","historyVerified":true},{"id":"p_35ec6700dc48","name":"Umeda Sky Building","city":"אוסקה","area":"Umeda","status":"חובה","kind":"attraction","desc":"בניין אייקוני עם Floating Garden Observatory.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Umeda+Sky+Building+Japan","booking":"","website":"","info":"Umeda Sky Building הוא אחד מסמלי הגל החדש של אדריכלות יפנית בתחילת שנות ה־90. המבנה הושלם ב־1993 כחלק מפרויקט Shin-Umeda City ותוכנן על ידי האדריכל Hiroshi Hara. הוא מורכב משני מגדלים בני 40 קומות המחוברים בחלק העליון באמצעות מבנה עגול גדול — Floating Garden Observatory — כך שהחלל שביניהם נשאר פתוח.\n\nהפרויקט נבנה בתקופה שבה יפן יצאה משנות הבועה הכלכלית, והוא משקף את האמביציה האדריכלית של אותן שנים. התצפית נמצאת בגובה של כ־173 מטר, והדרך אליה — כולל המדרגות הנעות השקופות שתלויות בין שני המגדלים — היא חלק מהחוויה האדריכלית עצמה. עם השנים הפך הבניין לאחד האייקונים המזוהים ביותר עם Umeda, ואף זכה להכרה בינלאומית כדוגמה לאדריכלות יוצאת דופן. זהו מקום שכדאי להסתכל עליו לא רק מלמעלה אלא גם מלמטה: החיבור בין שני המגדלים הוא למעשה ה“סיפור” המרכזי של המבנה.","infoSource":"https://osaka-info.jp/en/spot/umeda-sky-building/","historyVerified":true},{"id":"p_72d8b32d8d1e","name":"Hogoken Cafe Tenjinbashi rescue dog/cat café","city":"אוסקה","area":"Umeda","status":"רוצה","kind":"attraction","desc":"בית קפה עם כלבים וחתולים להצלה/אימוץ.","duration":"60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Hogoken+Cafe+Tenjinbashi+rescue+dog%2Fcat+caf%C3%A9+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"hotel_hankyu_respire","name":"Hotel Hankyu RESPIRE OSAKA","city":"אוסקה","area":"Umeda","status":"אולי","kind":"hotel","desc":"מלון 4★ מרכזי מאוד באומדה, ליד Osaka Station ומרכזי קניות גדולים. מתאים אם מעדיפים תחבורה מעולה וגישה נוחה לשינקנסן/קווים עירוניים.","duration":"לינה","note":"המלצת מלון 4★ · Umeda","maps":"https://www.google.com/maps/search/?api=1&query=Hotel+Hankyu+RESPIRE+OSAKA+Japan","booking":"https://www.booking.com/hotel/jp/hankyu-respire-osaka.html","website":"","historyNotApplicable":true},{"id":"p_c1ebfb120f26","name":"Osaka Aquarium KAIYUKAN","city":"אוסקה","area":"Osaka Bay / Tempozan","status":"חובה","kind":"attraction","desc":"אקווריום ענק ומרשים עם מיכל מרכזי וכרישי לווייתן.","duration":"2–3 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Osaka+Aquarium+KAIYUKAN+Japan","booking":"","website":"","info":"Kaiyukan נפתח ב־20 ביולי 1990 כחלק מפיתוח מחדש של אזור Tempozan במפרץ אוסקה. הוא נולד בתקופה שבה אוסקה השקיעה רבות בהחייאת אזור הנמל ובהפיכת החוף המערבי של העיר למוקד תרבות ותיירות. כבר בתוך 40 יום עבר האקווריום את רף מיליון המבקרים — עדות להצלחה המיידית של הפרויקט.\n\nהרעיון האוצרותי של Kaiyukan מבוסס על “Ring of Fire” ו־“Ring of Life”: הקשר בין חגורת הרי הגעש המקיפה את האוקיינוס השקט לבין ריכוזי החיים והמערכות האקולוגיות שסביבה. התצוגה בנויה כמסע אנכי: עולים תחילה לחלק העליון ואז יורדים בהדרגה סביב מיכל Pacific Ocean הגדול. התפיסה הושפעה גם מה־Gaia hypothesis של James Lovelock, שלפיה כדור הארץ ומערכות החיים שלו פועלים כמערכת משולבת. לכן Kaiyukan אינו רק אוסף של מיכלים; הוא תוכנן לספר סיפור על הקשר בין גאולוגיה, אקלים ובעלי חיים ברחבי האוקיינוס השקט.","infoSource":"https://www.kaiyukan.com/company/about/history/","historyVerified":true},{"id":"p_e01e5903269e","name":"Tempozan Ferris Wheel","city":"אוסקה","area":"Osaka Bay / Tempozan","status":"רוצה","kind":"attraction","desc":"גלגל ענק ליד האקווריום עם נוף למפרץ.","duration":"30–45 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tempozan+Ferris+Wheel+Japan","booking":"","website":"","info":"Tempozan Giant Ferris Wheel נפתח ביולי 1997 כחלק מהפיתוח של Tempozan Harbor Village במפרץ אוסקה. גובהו 112.5 מטר וקוטרו 100 מטר, ובשנים הראשונות הוא נחשב לאחד הגלגלים הענקיים הגדולים בעולם.\n\nהגלגל הוקם בתקופה שבה אוסקה השקיעה רבות בהפיכת אזור הנמל ממוקד תעשייתי למרחב בילוי ותיירות. יחד עם Kaiyukan, Tempozan Marketplace ושאר הפיתוחים באזור, הוא סימל את המעבר של קו המים המערבי של העיר למרחב ציבורי חדש.\n\nפרט מקומי ייחודי הוא שהגלגל משמש גם מעין “לוח מזג אוויר” ענק: התאורה שלו יכולה להציג תחזית ליום הבא. מהתאים רואים את מפרץ אוסקה, גשר Akashi Kaikyō, הרי Rokko ובימים בהירים גם את Kansai Airport. לכן הוא מעניין לא רק כאטרקציה אלא כחלק מהיסטוריית ההתחדשות של Osaka Bay בשנות ה־90.","infoSource":"https://osaka-info.jp/experience/en/osaka/spot/345","historyVerified":true},{"id":"p_4d0f8c6be3da","name":"Tempozan Marketplace","city":"אוסקה","area":"Osaka Bay / Tempozan","status":"רוצה","kind":"attraction","desc":"מתחם אוכל וקניות ליד Kaiyukan.","duration":"45–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tempozan+Marketplace+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_7e47f202edc6","name":"Harbour walk","city":"אוסקה","area":"Osaka Bay / Tempozan","status":"רוצה","kind":"attraction","desc":"הליכה רגועה על קו המים באזור Tempozan.","duration":"30–45 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Harbour+walk+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_46993bd04456","name":"Nagai Botanical Garden","city":"אוסקה","area":"Nagai Botanical Garden","status":"חובה","kind":"attraction","desc":"גן בוטני גדול עם אזורים עונתיים, בריכות ועצים.","duration":"1.5–2.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Nagai+Botanical+Garden+Japan","booking":"","website":"","info":"Nagai Botanical Garden נפתח בשנת 1974 כחלק מ־Nagai Park בדרום אוסקה. הוא הוקם בתקופה שבה ערים יפניות החלו להשקיע יותר בשטחים ירוקים, חינוך סביבתי ומוסדות מדע פתוחים לציבור, לאחר עשרות שנים של תיעוש וצמיחה עירונית מהירה.\n\nהגן משתרע על כ־24 הקטרים ומציג יותר מאלף מיני צמחים, עם גנים נושאיים שונים, בריכות ואזורים המדמים נופים טבעיים. בניגוד לגנים היסטוריים של תקופת Edo, זהו גן בוטני מודרני שנועד גם למחקר, חינוך ושימור. בשנים האחרונות נוסף בשעות הערב פרויקט teamLab Botanical Garden, אבל חשוב להפריד בין השניים: הגן עצמו הוא מוסד עירוני בן עשרות שנים, בעוד teamLab היא שכבה אמנותית עכשווית שמשתמשת בצמחייה הקיימת כחלק מהיצירה.","infoSource":"https://osaka-info.jp/en/spot/nagai-botanical-garden/","historyVerified":true},{"id":"p_b720256269b0","name":"teamLab Botanical Garden Osaka","city":"אוסקה","area":"Nagai Botanical Garden","status":"חובה","kind":"attraction","desc":"מיצגי אור דיגיטליים בלילה בתוך הגן הבוטני.","duration":"1.5–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=teamLab+Botanical+Garden+Osaka+Japan","booking":"","website":"","info":"teamLab Botanical Garden Osaka הוא פרויקט אמנות דיגיטלית קבוע שנפתח בתוך Nagai Botanical Garden. הרעיון המרכזי הוא להשתמש בגן הקיים עצמו כחומר גלם: עצים, רוח, מים, שבילים וצמחייה משתנים באמצעות אור, קול וטכנולוגיה, במקום לבנות חלל תצוגה מנותק.\n\nהפרויקט שייך לסדרת העבודות של teamLab שעוסקות בקשר בין אמנות, טבע והתנהגות אנושית. העבודות מגיבות לעיתים לתנועה של המבקרים ולתנאים הסביבתיים, ולכן החוויה משתנה בין עונות ושעות.\n\nחשוב להבחין בין שני הרבדים: Nagai Botanical Garden עצמו קיים מאז 1974 כמוסד בוטני עירוני; teamLab היא שכבה אמנותית עכשווית שנוספה עשרות שנים אחר כך. החיבור ביניהם הוא בדיוק הרעיון של האתר — לא להחליף את הטבע אלא להדגיש אותו באמצעות טכנולוגיה.","infoSource":"https://www.teamlab.art/e/botanicalgarden/","historyVerified":true},{"id":"p_131e2bccbe35","name":"NIFREL","city":"אוסקה","area":"EXPOCITY + Expo '70 Park","status":"חובה","kind":"attraction","desc":"מוזיאון חי שמשלב אקווריום, בעלי חיים, אור, אמנות ועיצוב.","duration":"2–3 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=NIFREL+Japan","booking":"","website":"","info":"NIFREL נפתח ב־19 בנובמבר 2015 כחלק מ־EXPOCITY ליד Expo ’70 Commemorative Park. הוא נוצר על ידי קבוצת Kaiyukan, אבל מראש הוגדר כמשהו שונה מאקווריום רגיל.\n\nהשם NIFREL נגזר מהמילה היפנית “ni fureru” — “לגעת ב־” או “להיחשף ל־”. במקום לסדר בעלי חיים רק לפי בית גידול, התצוגות נבנו סביב תכונות כמו צבע, צורה, תנועה ויכולת הסוואה. התאורה, המוזיקה, האמנות הדיגיטלית והמרחב האדריכלי הם חלק מהחוויה לא פחות מהחיות עצמן.\n\nהקונספט משקף מגמה חדשה במוזיאונים ואקווריומים יפניים: פחות “ויטרינה מול מבקר”, ויותר חוויה רב־חושית שמחברת מדע, עיצוב ואמנות. NIFREL הוא לכן אתר מודרני, אבל יש לו חשיבות בהבנת האופן שבו מוסדות טבע ביפן משתנים במאה ה־21.","infoSource":"https://www.nifrel.jp/area/exhibition.html","historyVerified":true},{"id":"p_540fcbe377b2","name":"Tower of the Sun","city":"אוסקה","area":"EXPOCITY + Expo '70 Park","status":"חובה","kind":"attraction","desc":"פסל-מבנה אייקוני ומוזר מ-Expo '70, עם חלל פנימי ייחודי.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tower+of+the+Sun+Japan","booking":"","website":"","info":"Tower of the Sun נבנה עבור Expo ’70 — התערוכה העולמית שנערכה באוסקה בשנת 1970, הראשונה מסוגה באסיה. יפן הייתה אז רק 25 שנה אחרי מלחמת העולם השנייה ובשיא תקופת הצמיחה הכלכלית, והתערוכה נועדה להציג לעולם מדינה טכנולוגית, מודרנית ובטוחה בעצמה. האמן Taro Okamoto תכנן את המגדל כתגובה כמעט אנטי־טכנולוגית לרוח העתידנית של התערוכה.\n\nלמגדל שלושה “פנים”: פני זהב בראש מסמלים את העתיד, השמש המרכזית את ההווה והשמש השחורה מאחור את העבר. בתוך המבנה נבנה “Tree of Life”, פסל עצום שמציג את התפתחות החיים. לאחר סיום Expo ’70 רוב הביתנים פורקו, והמגדל כמעט איבד את תפקידו. לבסוף הוחלט לשמר אותו, והוא הפך לזיכרון המרכזי של התערוכה. חלל הפנים היה סגור לציבור במשך שנים רבות, עבר שיקום מקיף ונפתח מחדש ב־2018. היום זהו גם יצירת אמנות וגם מסמך פיזי של האופן שבו יפן דמיינה את העתיד בשנת 1970.","infoSource":"https://osaka-info.jp/en/special/universal/course05/spot1/","historyVerified":true},{"id":"p_12fa2e339592","name":"Expo '70 Commemorative Park","city":"אוסקה","area":"EXPOCITY + Expo '70 Park","status":"רוצה","kind":"attraction","desc":"פארק גדול עם מדשאות, גנים ומוזיאונים.","duration":"1.5–3 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Expo+%2770+Commemorative+Park+Japan","booking":"","website":"","info":"Expo ’70 Commemorative Park נמצא על השטח שבו התקיימה Japan World Exposition 1970, אירוע ענק שסימל את חזרתה של יפן למרכז הבמה הכלכלית והטכנולוגית העולמית. תחת הסיסמה “Progress and Harmony for Mankind” הוקמו כאן ביתנים ממדינות רבות, מבני ניסוי וטכנולוגיות שנתפסו אז כחזון לעתיד. מיליוני מבקרים הגיעו לתערוכה, והיא הפכה לאחד האירועים המזוהים ביותר עם עידן הצמיחה המהירה של יפן.\n\nאחרי סגירת התערוכה פורקו רוב הביתנים. במקום להשאיר מתחם נטוש, החליטה המדינה להפוך את האתר לפארק תרבות וטבע גדול. חלק מהמבנים שרדו, ובראשם Tower of the Sun ו־Steel Pavilion, שמשמש כיום כ־EXPO ’70 Pavilion. גם הגן היפני הוקם במקור כתצוגה ממשלתית עבור התערוכה. לכן הפארק אינו “פארק שהוסיפו בו אנדרטאות”, אלא טרנספורמציה של עיר זמנית עתידנית למרחב ציבורי ירוק — אחד הפרויקטים המעניינים ביפן של שימוש מחדש באתרי Mega Events.","infoSource":"https://osaka-info.jp/en/spot/expo-70-commemorative-park/","historyVerified":true},{"id":"p_55f796508b00","name":"EXPOCITY","city":"אוסקה","area":"EXPOCITY + Expo '70 Park","status":"רוצה","kind":"attraction","desc":"מרכז ענק של קניות ובידור ליד NIFREL.","duration":"1–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=EXPOCITY+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_51af5658a87d","name":"Universal Studios Japan","city":"אוסקה","area":"Universal Studios Japan","status":"חובה","kind":"attraction","desc":"פארק שעשועים גדול עם אזורי Nintendo, Harry Potter ועוד.","duration":"יום מלא","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Universal+Studios+Japan+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_c6a27a46f73e","name":"SUPER NINTENDO WORLD","city":"אוסקה","area":"Universal Studios Japan","status":"חובה","kind":"attraction","desc":"אזור immersive של Mario ו-Donkey Kong בתוך USJ.","duration":"2–4 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=SUPER+NINTENDO+WORLD+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_8d131fd5b1c0","name":"Mario Kart","city":"אוסקה","area":"Universal Studios Japan","status":"רוצה","kind":"attraction","desc":"מתקן AR אינטראקטיבי בתוך SUPER NINTENDO WORLD.","duration":"30–90 דק׳ כולל תור","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Mario+Kart+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_b7e68950ba21","name":"Donkey Kong Country / Mine Cart Madness","city":"אוסקה","area":"Universal Studios Japan","status":"רוצה","kind":"attraction","desc":"אזור Donkey Kong ומתקן רכבת הרים ייחודי.","duration":"45–120 דק׳ כולל תור","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Donkey+Kong+Country+%2F+Mine+Cart+Madness+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_89a0a064d257","name":"Express Pass","city":"אוסקה","area":"Universal Studios Japan","status":"רוצה","kind":"attraction","desc":"כרטיס מקצר תורים; בחלק מהסוגים כולל כניסה מתוזמנת ל-Super Nintendo World.","duration":"—","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Express+Pass+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_bd63e3b11ad0","name":"Nara Park","city":"נארה","area":"Nara","status":"חובה","kind":"attraction","desc":"פארק עצום שבו מאות איילים מסתובבים בחופשיות.","duration":"2–4 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Nara+Park+Japan","booking":"","website":"","info":"Nara Park הוא למעשה מרחב היסטורי עצום שמאחד בתוכו כמה מהאתרים החשובים ביותר של נארה — Tōdai-ji, Kōfuku-ji, Kasuga Taisha, מוזיאונים ושטחי טבע — ולא “פארק עם איילים” במובן הרגיל. האזור משתרע על פני כמה קילומטרים רבועים ונוצר בהדרגה סביב המקדשים והיערות שהיו לב ליבה של הבירה העתיקה.\n\nהאיילים הם חלק מהזהות של נארה כבר יותר מאלף שנה. לפי המסורת של Kasuga Taisha, כאשר האל Takemikazuchi הוזמן לנארה בשנת 768 הוא הגיע מהר Kashima כשהוא רכוב על אייל לבן. מכאן התפתחה התפיסה שהאיילים הם שליחי האלים. במשך מאות שנים הם נחשבו קדושים; עד תקופת Edo פגיעה בהם הייתה עבירה חמורה מאוד. לאחר מלחמת העולם השנייה הם כבר לא הוגדרו רשמית כחיות קדושות, אבל הם עדיין מוגנים ונשארו אחד הסמלים החשובים ביותר של נארה.\n\nלכן ההליכה בפארק מעניינת במיוחד כשמבינים שהאיילים, המקדשים והיער אינם שלושה דברים נפרדים: הם חלק מאותו נוף דתי והיסטורי שהתפתח סביב הבירה הקדומה של יפן.","infoSource":"https://www.visitnara.jp/venues/A00489/","historyVerified":true},{"id":"p_435c5059e26f","name":"Todai-ji","city":"נארה","area":"Nara","status":"חובה","kind":"attraction","desc":"מקדש ענק ובו אחד מפסלי הבודהה הגדולים ביפן.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Todai-ji+Japan","booking":"","website":"","info":"Tōdai-ji הוא אחד האתרים החשובים ביותר להבנת יפן של תקופת Nara. ראשיתו בשנת 728, כאשר הוקם מקדש לזכר בנו של הקיסר Shōmu. בשנת 741 יזם הקיסר מערכת של מקדשים ממלכתיים ברחבי המדינה, ו־Tōdai-ji הפך למקדש המרכזי של המערכת הזאת — מוסד דתי, פוליטי ולימודי שנועד להתפלל לשלום המדינה ולשגשוג העם.\n\nבשנת 743 הורה הקיסר ליצור את פסל ה־Vairocana Buddha העצום. יציקת הפסל הושלמה ב־749 וטקס חנוכתו נערך ב־752. הבודהה והאולם הגדול שסביבו היו פרויקט בקנה מידה לאומי, ששאב כוח אדם וחומרים מאזורים רבים ביפן. לאורך הדורות עבר Tōdai-ji שריפות, רעידות אדמה ומלחמות. בשנת 1180 נהרס חלק גדול מהמתחם, ולאחר מכן שוקם בהובלת הנזיר Chōgen. ב־1567 נשרף שוב ה־Great Buddha Hall, והמבנה הנוכחי הושלם רק ב־1709 — והוא קטן מהאולם המקורי.\n\nהחשיבות של Tōdai-ji אינה רק בגודל הבודהה. זהו מקום שבו אפשר לראות איך הבודהיזם שימש בתקופת Nara ככלי לבניית מדינה מרכזית, לאחדות פוליטית ולהכשרת נזירים ומלומדים. כיום המתחם עדיין משמר טקסים ומבנים היסטוריים רבים מתקופות שונות.","infoSource":"https://www.todaiji.or.jp/en/history/","historyVerified":true},{"id":"p_7c44c667bc84","name":"Nigatsu-do","city":"נארה","area":"Nara","status":"רוצה","kind":"attraction","desc":"אולם מקדש גבוה עם תצפית יפה על נארה.","duration":"30–45 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Nigatsu-do+Japan","booking":"","website":"","info":"Nigatsu-dō הוא אחד האולמות החשובים של מתחם Tōdai-ji. שמו פירושו “אולם החודש השני”, משום שכאן מתקיים טקס Shuni-e — טקס חרטה וטיהור עתיק שנערך במקור בחודש השני של הלוח הירחי. לפי המסורת, האולם נוסד בידי הנזיר Jitchū, תלמידו של Rōben, במאה ה־8.\n\nהטקס החשוב ביותר הקשור למקום הוא Omizutori, מסורת שמתועדת ברציפות יותר מ־1,200 שנה. במהלך הטקס נושאים לפידים עצומים לאורך מרפסת העץ של האולם, והמראה הפך לאחד מסמלי נארה. בשנת 1667 פרצה שריפה בתוך האולם במהלך Shuni-e והמבנה המקורי נהרס. המבנה הקיים היום נבנה מחדש ב־1669.\n\nמעבר להיסטוריה הדתית, Nigatsu-dō מציע גם אחת התצפיות היפות על נארה. בגלל מיקומו על צלע ההר הוא נותן מבט על כל אזור Tōdai-ji והעיר העתיקה — ולכן הוא שווה גם למי שלא מתעמק בטקסים הבודהיסטיים.","infoSource":"https://www.todaiji.or.jp/en/information/nigatsudo/","historyVerified":true},{"id":"p_f5793533e298","name":"Kasuga Taisha","city":"נארה","area":"Nara","status":"חובה","kind":"attraction","desc":"מקדש שינטו מפורסם עם מאות פנסי אבן בתוך יער.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kasuga+Taisha+Japan","booking":"","website":"","info":"Kasuga Taisha נוסד רשמית בשנת 768, בזמן שבו Nara הייתה בירת יפן והמערכת הקיסרית ניסתה לבסס קשר בין פוליטיקה, דת ושושלות האצולה. לפי המסורת, האל Takemikazuchi הובא ל־Mt. Mikasa כדי להגן על הבירה החדשה. בהמשך נבנו במקום מבני המקדש והובאו אלים נוספים, כולל אלים המזוהים עם משפחת Fujiwara — אחת המשפחות החזקות ביותר בהיסטוריה של יפן.\n\nאחד המאפיינים המזוהים ביותר עם המקדש הוא אלפי פנסי האבן והברונזה שנתרמו במשך מאות שנים. הם אינם רק תפאורה; הם עדות לפולחן מתמשך ולתרומות של משפחות אצולה, סמוראים ומאמינים. המקדש גם משמר מסורת של Shikinen Zotai — חידוש תקופתי של המבנים והכלים הטקסיים — שעוזר לשמור על הסגנון העתיק גם כאשר חומרי הבנייה עצמם מוחלפים.\n\nבשנת 1998 נכלל Kasuga Taisha, יחד עם יער Kasugayama ואתרי נארה נוספים, ברשימת המורשת העולמית של UNESCO. היער המקיף אותו הוא חלק מהחוויה הדתית: האדריכלות הכתומה, הפנסים, האיילים והעצים נועדו להיתפס כמכלול אחד ולא כאוסף אלמנטים נפרדים.","infoSource":"https://www.kasugataisha.or.jp/en/about_en/","historyVerified":true},{"id":"p_1ee107621f6c","name":"Isuien Garden","city":"נארה","area":"Nara","status":"רוצה","kind":"attraction","desc":"גן יפני שקט ליד Todai-ji.","duration":"45–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Isuien+Garden+Japan","booking":"","website":"","info":"Isui-en הוא אחד הגנים היפניים המעניינים בנארה דווקא משום שהוא אינו גן שנבנה בבת אחת. הוא מורכב משני חלקים שנוצרו בתקופות שונות לגמרי, ולכן אפשר כמעט “לקרוא” בתוכו שני שלבים בהתפתחות עיצוב הגנים היפני.\n\nה־Front Garden נוצר בשנות ה־1670, בתקופת Edo המוקדמת, בידי Kiyosumi Dosei — סוחר בבד Nara-zarashi שהיה גם בעל תפקיד הקשור לשוגונאט Tokugawa. הוא תכנן את הגן סביב בתי תה ובמטרה ליהנות מ־sencha, תה ירוק חלוט. זהו גן אינטימי יותר, סגור ומאורגן סביב מים, אבנים ובתי תה.\n\nה־Back Garden נוצר הרבה יותר מאוחר, בתקופת Meiji בראשית המאה ה־20. כאן נעשה שימוש ב־shakkei — “נוף שאול”: במקום להסתיר את הסביבה, המתכנן שילב בתוך הקומפוזיציה את ההרים והמבנים שמחוץ לגן. Mt. Wakakusa, Mt. Kasuga והגג של Tōdai-ji הופכים לחלק מהנוף של הגן עצמו. זה מה שנותן ל־Isui-en תחושת עומק יוצאת דופן.\n\nהגן הוכר על ידי ממשלת יפן כ־Place of Scenic Beauty. לכן הביקור כאן הוא פחות “עוד גן יפה” ויותר הזדמנות לראות שתי פילוסופיות שונות של עיצוב נוף יפני בתוך אתר אחד.","infoSource":"https://isuien.or.jp/en/garden","historyVerified":true},{"id":"p_e9c42e102182","name":"Naramachi","city":"נארה","area":"Nara","status":"רוצה","kind":"attraction","desc":"רובע היסטורי עם בתי סוחרים ישנים, קפה וחנויות.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Naramachi+Japan","booking":"","website":"","info":"Naramachi הוא הרובע המסורתי שמדרום־מזרח למרכז נארה, והוא מספר את הסיפור של העיר אחרי שהבירה הקיסרית עברה ממנה. האזור התפתח על השטח שהיה שייך בעבר למתחם הענק של Gangō-ji, אחד המקדשים הבודהיסטיים העתיקים ביפן. עם השנים המקדש איבד חלק ניכר מאדמותיו, ובמקומן צמחו שכונות מגורים ומסחר.\n\nבתקופת Edo התבסס Naramachi כרובע של סוחרים ובעלי מלאכה. רבים מהבתים הם machiya — בתי עיר צרים בחזית ועמוקים מאוד. המבנה הזה נבע בין היתר ממיסוי שהתבסס על רוחב החזית לרחוב: ככל שהחזית הייתה צרה יותר, המס היה נמוך יותר. מאחורי חזית צרה יכלו להסתתר חנות, חצר, מחסנים ומגורים עמוקים.\n\nפרט מקומי מעניין הוא ה־migawarisaru — קמעות בצורת “קוף חלופי” שתולים מחוץ לבתים ונועדו לקחת על עצמם מזל רע במקום בני הבית. כיום הרובע משלב בתים היסטוריים, בתי קפה, גלריות וחנויות מלאכה, אבל התשתית העירונית והסמטאות עדיין משקפות את נארה של תקופת Edo.","infoSource":"https://www.visitnara.jp/destinations/area/naramachi/","historyVerified":true},{"id":"p_c4693fe12c6d","name":"Nakatanidou Mochi","city":"נארה","area":"Nara","status":"רוצה","kind":"food","desc":"חנות מפורסמת בהדגמות הכנת mochi מהירות.","duration":"15–30 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Nakatanidou+Mochi+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_c33a645ed872","name":"Kasugataisha Manyo Botanical Garden","city":"נארה","area":"Nara","status":"אולי","kind":"attraction","desc":"גן בוטני סמוך ל-Kasuga Taisha עם כ-250 מיני צמחים המתוארים בשירה יפנית עתיקה; תוספת טובה אם רוצים יותר טבע.","duration":"45–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kasugataisha+Manyo+Botanical+Garden+Japan","booking":"","website":"","info":"Manyō Botanical Garden של Kasuga Taisha נפתח בשנת 1932, והוא נחשב לגן הוותיק ביותר ביפן שנוצר במיוחד סביב צמחי Manyō. המונח מתייחס לצמחים שמופיעים ב־Man’yōshū — קובץ השירה היפני הקדום הגדול ביותר, שנערך במאה ה־8 וכולל אלפי שירים מתקופת Nara וסביבתה.\n\nהגן נפתח בעזרת מענק מהקיסר Shōwa ונועד לחבר בין ספרות, בוטניקה והיסטוריה. כיום גדלים בו בערך 300 סוגי צמחים המזוהים עם השירים של Man’yōshū. לצד כל צמח מוצגים לעיתים שירים והסברים שמראים כיצד הצמח היה קשור לחיי היום־יום — אוכל, רפואה, צבעים, טקסטיל, בנייה וטקסים.\n\nהגן מחולק לכמה אזורים, כולל Manyō Garden, אזור דגנים, גן קמליות וגן ויסטריה. הוא שייך למתחם Kasuga Taisha, ולכן הוא לא רק גן בוטני אלא גם דרך להבין את העולם התרבותי והטבעי שבו חיו וכתבו אנשי תקופת Nara.","infoSource":"https://www.kasugataisha.or.jp/manyou-s/","historyVerified":true},{"id":"p_b2758cc42835","name":"Kobe Harborland","city":"מסביב לאוסקה","area":"Kobe — אופציונלי","status":"רוצה","kind":"attraction","desc":"אזור נמל מודרני עם קניות, טיילת ואורות בלילה.","duration":"1–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kobe+Harborland+Japan","booking":"","website":"","info":"Kobe Harborland הוא אזור waterfront מודרני שנבנה כחלק מהשינוי שעבר נמל Kobe מאז סוף המאה ה־20. האזור נמצא על שטחים ששימשו בעבר לתעשייה ולתשתיות נמל ורכבת, והפיתוח החדש הפך אותם למרכז מסחר, בילוי וטיילת.\n\nלמרות האופי המודרני, נשארו באזור כמה שרידים שמזכירים את העבר הימי של Kobe. אחד מהם הוא Former Kobe Port Signal Station, שנחשב למבנה העתיק ביותר שנותר בנמל Kobe, ובקרבתו נמצאים גם מחסני לבנים היסטוריים.\n\nהחשיבות של Harborland היא בהקשר הרחב יותר של Kobe: עיר שנבנתה סביב נמל בינלאומי, ספגה פגיעה קשה ברעידת האדמה של 1995 ואז השקיעה מחדש באזור החוף. היום המתחם מחבר קניות ובילוי עם נוף ל־Port Tower, Meriken Park והנמל — כלומר הוא גם יעד תיירותי וגם חלק מתהליך השיקום וההתחדשות של העיר.","infoSource":"https://www.feel-kobe.jp/en/attractions/detail_1008.html","historyVerified":true},{"id":"p_7034ba072e1c","name":"Meriken Park","city":"מסביב לאוסקה","area":"Kobe — אופציונלי","status":"רוצה","kind":"attraction","desc":"פארק נמל עם Kobe Port Tower ונוף למים.","duration":"45–75 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Meriken+Park+Japan","booking":"","website":"","info":"Meriken Park הוא פארק חוף בלב נמל Kobe, והוא מבטא את הזהות של העיר כ“עיר נמל” שנפתחה לעולם במאה ה־19. השם “Meriken” מגיע מהגייה יפנית ישנה של “American”, זכר לתקופה שבה פעל באזור מזח הקשור למסחר בינלאומי.\n\nהפארק המודרני פותח באזור הנמל והיום מאגד כמה מסמלי Kobe: Port Tower, Maritime Museum והטיילת. אחד האלמנטים החשובים באתר הוא אזור שנותר כזיכרון לרעידת האדמה הגדולה של Hanshin-Awaji ב־1995, שהחריבה חלקים גדולים מהעיר והנמל.\n\nבשנת 2017 נוסף בפארק פסל BE KOBE לציון 150 שנה לפתיחת נמל Kobe. הסיסמה עצמה נולדה לציון 20 שנה לרעידת האדמה ומבטאת גאווה אזרחית והתאוששות. לכן Meriken Park הוא גם מרחב פנאי וגם מקום שמספר על פתיחת העיר למערב, על האסון של 1995 ועל השיקום שאחריו.","infoSource":"https://www.feel-kobe.jp/en/attractions/detail_1006.html","historyVerified":true},{"id":"p_86ad1e064c0e","name":"Kobe Nunobiki Herb Gardens","city":"מסביב לאוסקה","area":"Kobe — אופציונלי","status":"רוצה","kind":"attraction","desc":"גן עשבי תיבול גדול על ההר עם רכבל ונוף לעיר.","duration":"2–3 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kobe+Nunobiki+Herb+Gardens+Japan","booking":"","website":"","info":"Kobe Nunobiki Herb Gardens הוא גן הררי שנמצא מעל Shin-Kobe ומחובר לעיר באמצעות ropeway. הגן נפתח כמתחם שמוקדש לצמחי תבלין, פרחים ותרבות אירופית של גנים, תוך שימוש בטופוגרפיה הדרמטית של מדרונות Rokko.\n\nהמתחם כולל כ־75,000 צמחי תבלין ופרחים מכ־200 מינים, המסודרים בכ־12 גנים נושאיים. בגלל הגובה — סביב 400 מטר בנקודות העליונות — הנוף של Kobe והמפרץ הוא חלק מהחוויה לא פחות מהצמחים.\n\nהרכבל עצמו עובר מעל Nunobiki Falls ו־Gohonmatsu Dam, אתר הנדסי שמוכר כנכס תרבות חשוב. כך שהביקור משלב נוף עירוני, תשתית היסטורית וטבע הררי. בחורף ובתקופת חג המולד הגן מקבל גם שכבה עונתית של תאורה ושוק חג מולד, ולכן אופיו משתנה משמעותית בין עונות השנה.","infoSource":"https://www.feel-kobe.jp/en/attractions/detail_1013.html","historyVerified":true},{"id":"p_a635db053fed","name":"Kobe Chinatown / Nankinmachi","city":"מסביב לאוסקה","area":"Kobe — אופציונלי","status":"רוצה","kind":"attraction","desc":"צ'יינהטאון קומפקטי עם אוכל רחוב ורחובות צבעוניים.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Kobe+Chinatown+%2F+Nankinmachi+Japan","booking":"","website":"","info":"Nankinmachi היא אחת משלוש הצ׳יינה־טאונס הגדולות ביפן, לצד Yokohama ו־Nagasaki. שורשיה קשורים לפתיחת נמל Kobe לסחר בינלאומי בשנת 1868, כאשר סוחרים סינים החלו להתיישב באזור Motomachi הסמוך לנמל.\n\nעם הזמן התפתח האזור למרכז מסחר, אוכל וקהילה עבור תושבים ממוצא סיני. השם Nankinmachi — “עיר Nanking” — היה כינוי יפני נפוץ לאזורים שבהם פעלו סוחרים סינים.\n\nבמהלך המאה ה־20 נפגע הרובע ממלחמה וממשברים כלכליים, אבל שוקם והפך בהדרגה לאזור תיירותי ותרבותי מרכזי. חגיגות Lunar New Year ו־Mid-Autumn Festival ממשיכות לקשור אותו למסורות סיניות גם כיום.\n\nהערך של המקום הוא לא רק אוכל רחוב: הוא תזכורת לכך ש־Kobe המודרנית נבנתה כעיר בינלאומית שבה קהילות זרות מילאו תפקיד מרכזי מאז פתיחת הנמל.","infoSource":"https://www.feel-kobe.jp/en/attractions/detail_1040.html","historyVerified":true},{"id":"p_b3a611b481d6","name":"Himeji Castle","city":"מסביב לאוסקה","area":"Himeji — אופציונלי","status":"רוצה","kind":"attraction","desc":"אחת הטירות המקוריות והמרשימות ביפן.","duration":"2–3 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Himeji+Castle+Japan","booking":"","website":"","info":"Himeji Castle הוא אחת הדוגמאות השלמות ביותר ששרדו לאדריכלות טירות יפנית מראשית תקופת Edo. לפי האתר הרשמי, כבר בשנת 1333 נבנה ביצר על גבעת Himeyama, וב־1346 הוקמה במקום טירה משמעותית יותר.\n\nבשנת 1580 נמסרה הטירה ל־Hashiba Hideyoshi, מי שיהפוך בהמשך ל־Toyotomi Hideyoshi, והוא בנה כאן מגדל עוז בן שלוש קומות. אחרי קרב Sekigahara קיבל Ikeda Terumasa את הטירה, ובין 1601 ל־1609 ביצע את השיפוץ הגדול שיצר את מערך המגדלים והביצורים שמזוהה עם המקום כיום. ב־1617 נוספו חלקים נוספים בתקופת Honda Tadamasa.\n\nבאופן יוצא דופן, הטירה שרדה את פירוק הטירות בתקופת Meiji, רעידות אדמה והפצצות מלחמת העולם השנייה בלי להיהרס. ב־1993 הייתה, יחד עם Hōryū-ji, בין האתרים הראשונים ביפן שנרשמו כאתר מורשת עולמית של UNESCO.\n\nהכינוי “White Heron Castle” נובע מהטיח הלבן ומהצללית שנראית כמו אנפה פורשת כנפיים. המתחם אינו רק מגדל אחד אלא מערכת מתוחכמת של שערים, חומות, מסלולים מעוקלים ומלכודות הגנה שנועדו לבלבל תוקפים.","infoSource":"https://www.city.himeji.lg.jp/castle/0000007750.html","historyVerified":true},{"id":"p_633fbac336c0","name":"Koko-en Garden","city":"מסביב לאוסקה","area":"Himeji — אופציונלי","status":"רוצה","kind":"attraction","desc":"גן יפני יפה ממש ליד Himeji Castle.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Koko-en+Garden+Japan","booking":"","website":"","info":"Koko-en הוא גן יפני מודרני יחסית, אבל הוא תוכנן כדי לשחזר אווירה של תקופת Edo על בסיס המבנה ההיסטורי של אזור טירת Himeji. הוא נמצא ממש ממערב לטירה ומשתרע על כ־3.5 הקטרים.\n\nהגן מחולק לתשעה גנים נפרדים, שכל אחד מהם מדגיש סגנון אחר: בריכות, מפלים, במבוק, עצי אורן, פרחים עונתיים ובית תה. חלק מהתכנון נשען על שרידי בתי סמוראים ורחובות שהיו בעבר באזור Nishioyashiki של הטירה.\n\nה־Oyashiki Garden משתמש בסגנון chisen-kaiyu — גן טיול סביב בריכה — בעוד אזור התה כולל את Sojuan, שנבנה בסגנון Sukiya. בגלל האדריכלות והצמחייה שמשחזרות היטב את התחושה ההיסטורית, הגן משמש לעיתים קרובות לצילומי סרטים ודרמות תקופתיות.\n\nלכן למרות שהוא אינו גן מהמאה ה־17, Koko-en הוא דוגמה מעניינת לשימור פרשני: אתר מודרני שנבנה כדי להמחיש את סביבת החיים והאסתטיקה של טירת Himeji בתקופת Edo.","infoSource":"https://himeji-kanko.jp/en-pamphlet/pdf/e.pdf","historyVerified":true},{"id":"p_9c3132dd3fcc","name":"Ueno Park","city":"טוקיו","area":"Ueno + Ameyoko","status":"רוצה","kind":"attraction","desc":"פארק עירוני גדול שמרכז סביבו מוזיאונים, מקדשים ושבילים. בתקופת סתיו מתאים להליכה רגועה בין עצים ומוזיאונים.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Ueno+Park+Japan","booking":"","website":"","info":"Ueno Park יושב על קרקע שהייתה פעם חלק מאחד המתחמים הדתיים והפוליטיים החשובים של Edo. במאה ה־17 הקימה שוגונות Tokugawa כאן את Kan'ei-ji, מקדש גדול שנועד להגן רוחנית על העיר מצפון־מזרח, כיוון שנחשב מסוכן במסורת היפנית. המקדש היה קשור ישירות למשפחת Tokugawa, וחלק מהשוגונים אף נקברו בו. ב־1868, כאשר שלטון Tokugawa קרס, התחולל באזור Battle of Ueno בין לוחמי shōgitai שנשארו נאמנים לשוגון לבין כוחות ממשלת Meiji. הקרב והאש הרסו חלק גדול מ־Kan'ei-ji. במקום לשקם את המתחם בממדיו הישנים, ממשלת Meiji הפכה את השטח לאחד הפארקים הציבוריים הראשונים ביפן ב־1873. זו הייתה החלטה אידאולוגית כמעט: קרקע דתית־פיאודלית הפכה למרחב ציבורי של המדינה החדשה. בהמשך נבנו כאן מוזיאונים, גן חיות, מוסדות אמנות ותערוכות לאומיות, וב־1924 הקיסר Taishō העביר רשמית את הפארק לעיר — מכאן השם Ueno Onshi Park, 'הפארק הקיסרי שהוענק'. לכן יום המוזיאונים שלנו עובר למעשה בשטח שמספר את המעבר משוגונות, דרך מלחמת אזרחים, למדינת Meiji שמקדשת חינוך, מדע ותרבות ציבורית.","infoSource":"https://www.gotokyo.org/en/destinations/northern-tokyo/ueno/index.html"},{"id":"p_3ff2cc2c2491","name":"Ameyoko Market","city":"טוקיו","area":"Ueno + Ameyoko","status":"רוצה","kind":"attraction","desc":"שוק רחוב צבעוני עם אוכל, מתוקים, ביגוד וחנויות. מתאים לשילוב עם Ueno ו-Akihabara.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Ameyoko+Market+Japan","booking":"","website":"","info":"Ameyoko הוא אחד המקומות שבהם אפשר עדיין להרגיש משהו מטוקיו של השנים הראשונות אחרי 1945. האזור הצפוף בין Ueno ל־Okachimachi הפך לאחר המלחמה לשוק שחור שבו אנשים ניסו להשיג מזון, ביגוד ומוצרים שלא היו זמינים דרך מערכת הקיצוב. מקור השם עצמו משקף את התקופה: לפי הסבר אחד ame מגיע מ־ameya, מוכרי ממתקים, משום שבאזור נמכרו כמויות גדולות של sweets; לפי הסבר אחר הוא קוצר מ־America, משום שמוצרים אמריקאיים וצבאיים הגיעו לשוק דרך ערוצים לא רשמיים. עם התאוששות הכלכלה עבר Ameyoko בהדרגה ממקום של הישרדות למרכז מסחר עממי וזול. כיום פועלות לאורך כחצי קילומטר מאות חנויות של דגים, תבלינים, בגדים, קוסמטיקה ומזון בינלאומי. מה שמעניין הוא שהאופי של השוק עדיין שונה מאוד מהסדר של בתי הכלבו היפניים: מוכרים קוראים בקול, שלטים נערמים, וסחורה נשפכת כמעט אל הרחוב. אחרי יום ב־Ueno Park ובמוזיאונים הלאומיים, המעבר ל־Ameyoko הוא כמעט מעבר בין שתי גרסאות של יפן שלאחר המלחמה — מצד אחד מדינה שבונה מוסדות, ומצד אחר אזרחים שבונים מחדש את הכלכלה מלמטה.","infoSource":"https://www.gotokyo.org/en/spot/71/"},{"id":"p_059773fe3b18","name":"National Museum of Nature and Science","city":"טוקיו","area":"Ueno + Ameyoko","status":"רוצה","kind":"attraction","desc":"מוזיאון טבע ומדע גדול עם דינוזאורים, חלל, מדע וטכנולוגיה.","duration":"1.5–2.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=National+Museum+of+Nature+and+Science+Japan","booking":"","website":"","info":"National Museum of Nature and Science נולד כחלק מהמאמץ של יפן בתקופת Meiji ללמוד, למיין ולהציג ידע מדעי באופן מודרני. כבר ב־1871 הוקם ב־Yushima Seidō חלל תצוגה של משרד החינוך, וב־1872 נערכה שם תערוכה ציבורית. בשנת 1877 הוקם ב־Ueno מוסד שנחשב רשמית לנקודת ההתחלה של המוזיאון. הוא עבר שינויים ושמות רבים, אבל המטרה נשארה דומה: לבנות ביפן מוסד לאומי שמחבר טבע, מדע, טכנולוגיה וחינוך. רעידת Kantō של 1923 הייתה קטסטרופה למוזיאון — המבנים והדגימות נפגעו קשות — ובעקבותיה נבנה ב־1931 בניין חדש ב־Ueno, Japan Gallery של היום. המבנה עצמו הפך מאוחר יותר ל־Important Cultural Property. אחרי המלחמה התרחבו המחקר והאוספים, וב־2006–2007 אורגנו התצוגות מחדש ל־Japan Gallery ו־Global Gallery. המוזיאון חשוב משום שהוא מספר לא רק על דינוזאורים או בעלי חיים אלא גם על ההיסטוריה של המדע היפני: כיצד מדינת Meiji אימצה שיטות מחקר מערביות, כיצד יפן בנתה תעשייה וטכנולוגיה, וכיצד חוקרים מקומיים חקרו את הארכיפלג. ביום שלנו כדאי להתרכז ב־Japan Gallery, משום שהיא נותנת הקשר מקומי לטבע, לאנשים ולתעשייה של יפן ולא רק עוד מוזיאון מדע כללי.","infoSource":"https://www.kahaku.go.jp/english/"},{"id":"p_f6d904a563a7","name":"Tokyo National Museum","city":"טוקיו","area":"Ueno + Ameyoko","status":"רוצה","kind":"attraction","desc":"המוזיאון המרכזי לאמנות והיסטוריה יפנית, בתוך Ueno Park.","duration":"1.5–2.5 ש׳","note":"שובץ ביום Ueno לצד National Museum of Nature and Science.","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+National+Museum+Japan","booking":"","website":"https://www.tnm.jp/?lang=en","info":"Tokyo National Museum הוא המוזיאון העתיק ביותר ביפן מסוגו, וההיסטוריה שלו קשורה ישירות לפרויקט המודרניזציה של Meiji. בשנת 1872 ארגן משרד החינוך תערוכה ב־Yushima Seidō; האירוע נחשב ללידת המוזיאון. המטרה הראשונית הייתה רחבה מאוד — לא רק אמנות, אלא גם טבע, תעשייה, ספרייה ואפילו גן חיות — משום שממשלת Meiji ראתה במוזיאון כלי לחינוך הציבור ולהצגת יפן כמדינה מודרנית. ב־1882 עבר המוסד ל־Ueno, על שטח שהיה קודם חלק מ־Kan'ei-ji ונפגע ב־Boshin War. הבניין הראשי הראשון תוכנן בידי האדריכל הבריטי Josiah Conder ונחנך בנוכחות הקיסר Meiji. רעידת Kantō של 1923 פגעה קשות במתחם, וב־1938 נפתח Honkan החדש שאנחנו רואים כיום, בסגנון שמחבר מבנה מודרני עם גג בהשראה יפנית. במהלך המלחמה פונו חלק מהאוצרות כדי להגן עליהם. אחרי 1945 קיבל המוסד את שמו הנוכחי והמשיך להרחיב את האוסף. היום הוא מחזיק National Treasures רבים, פסלים בודהיסטיים, קליגרפיה, קרמיקה, שריון, חרבות וטקסטיל. המוזיאון עצמו הוא לכן חלק מהסיפור שהוא מספר: מקום שבו יפן המודרנית החליטה מה מתוך עברה צריך להיאסף, להישמר ולהפוך ל'מורשת לאומית'.","infoSource":"https://www.tnm.jp/modules/r_free_page/index.php?id=155&lang=en"},{"id":"p_20e5debe1afa","name":"Imperial Palace East Gardens","city":"טוקיו","area":"Imperial Palace + Tokyo Station","status":"רוצה","kind":"attraction","desc":"הגנים המזרחיים של הארמון הקיסרי בטוקיו, עם שרידי חומות, גנים ושבילים בלב העיר.","duration":"60–90 דק׳","note":"שובץ ליום Akihabara כדי לא להעמיס על Ginza ולשמור קרבה יחסית למרכז.","maps":"https://www.google.com/maps/search/?api=1&query=Imperial+Palace+East+Gardens+Japan","booking":"","website":"https://www.kunaicho.go.jp/e-event/higashigyoen02.html","info":"Imperial Palace East Gardens יושבים על הלב של Edo Castle, המקום שממנו שלטה שוגונות Tokugawa ביפן במשך יותר מ־250 שנה. אחרי ש־Tokugawa Ieyasu קבע את בסיסו ב־Edo בסוף המאה ה־16, הורחבה הטירה בהדרגה למערכת עצומה של חפירים, שערים, חומות ומתחמים. Honmaru היה הליבה הפנימית, Ninomaru ו־Sannomaru הקיפו אותו, וכאן חיו ופעלו השוגון, משפחתו והמנגנון המנהלי. ה־tenshu, המגדל הראשי, היה מהגדולים ביפן, אך נשרף ב־1657 ב־Great Fire of Meireki ולא נבנה מחדש; בסיס האבן Tenshudai עדיין נמצא בגן. ב־1868, עם נפילת השוגונות, עבר הקיסר מקיוטו לטוקיו והטירה הפכה לארמון קיסרי. חלקים גדולים נהרסו בשריפות, רעידות אדמה ומלחמה, והארמון המודרני נבנה מחדש אחרי 1945. בשנת 1960 החליטה הממשלה להפוך את חלקי Honmaru, Ninomaru ו־Sannomaru לשטח ציבורי, וה־East Gardens נפתחו ב־1968. לכן זהו מקום שבו דווקא החסר חשוב: אין טירת samurai שלמה, אבל החומות, בתי השמירה, השערים והבסיס העצום מאפשרים להבין את קנה המידה של מרכז הכוח של Edo. כאשר רואים את Otemachi ומגדלי Marunouchi מעבר לחומות, רואים כיצד בירת השוגון הפכה למרכז שלטוני ופיננסי מודרני בלי לשנות את המרכז הגאוגרפי שלה.","infoSource":"https://www.kunaicho.go.jp/en/visit/event/higashigyoen/index.html"},{"id":"p_c1a69e0a9701","name":"Marunouchi","city":"טוקיו","area":"Imperial Palace + Tokyo Station","status":"אולי","kind":"attraction","desc":"האזור האלגנטי בין הארמון לתחנת Tokyo, עם אדריכלות, קניות ובתי קפה.","duration":"30–60 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Marunouchi+Japan","booking":"","website":"","info":"Marunouchi פירושו בערך 'בתוך המעגל', והשם מתייחס למיקומו בתוך מערכת החפירים של Edo Castle. בתקופת Tokugawa האזור בין הטירה לבין מה שהוא היום Tokyo Station היה מלא באחוזות של daimyo שנדרשו לשהות בבירה כחלק ממערכת sankin-kōtai. אחרי רסטורציית Meiji האחוזות נעלמו והשטח הפך לרכוש ממשלתי, עם קסרקטינים ומגרשי אימון של המשמר הקיסרי. בשנת 1890 רכשה Mitsubishi שטח עצום ב־Marunouchi לבקשת הממשלה. Yanosuke Iwasaki, מנהיג החברה, דמיין רובע עסקים בסגנון London ו־Manhattan שיתאים למדינה מודרנית. Mitsubishi Building No. 1 נפתח ב־1894, ובהמשך נבנו עוד מבני לבנים שזכו לכינוי 'London Block'. פתיחת Tokyo Station ב־1914 הפכה את האזור למרכז עסקי לאומי. Marunouchi Building המקורי, שנפתח ב־1923, היה אז בניין ענק וחדשני ושרד הן את רעידת Kantō והן את הפצצות המלחמה לפני שהוחלף ב־2002. היום גורדי זכוכית מסתירים במידה רבה את השכבה הישנה, אבל הגאוגרפיה נשארה: מצד אחד הארמון, מצד שני התחנה ובאמצע מרכז הפיננסים. הליכה קצרה כאן מספרת את המעבר של יפן מאחוזות samurai לקפיטליזם תאגידי תוך פחות ממאה שנה.","infoSource":"https://www.mitsubishi.com/en/profile/history/outline/"},{"id":"p_f4384d076558","name":"Daikanyama T-Site","city":"טוקיו","area":"Daikanyama + Nakameguro + Shimokitazawa","status":"אולי","kind":"attraction","desc":"מתחם מעוצב של ספרים, אמנות, עיצוב ובתי קפה בשכונת Daikanyama.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Daikanyama+T-Site+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_e7b9e8b2a661","name":"Nakameguro + Meguro River","city":"טוקיו","area":"Daikanyama + Nakameguro + Shimokitazawa","status":"אולי","kind":"attraction","desc":"שכונה נעימה עם בוטיקים, בתי קפה והליכה לאורך נהר Meguro.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Nakameguro+%2B+Meguro+River+Japan","booking":"","website":"","info":"Meguro River הוא ציר מים באורך כמעט שמונה קילומטרים שעובר דרך חלקים שונים של דרום־מערב טוקיו לפני שהוא מגיע למפרץ. האזור של Nakameguro היה בעבר הרבה יותר כפרי ותעשייתי מהדימוי האופנתי שלו היום. הנהר שימש לניקוז ולפעילות מקומית, ובמהלך המודרניזציה של טוקיו הוסדרו הגדות והזרימה כדי להתמודד עם הצפות ועם התפשטות העיר. עם התפתחות הרכבות וקישור Nakameguro לשיבויה ולמרכז, השכונה הפכה בהדרגה לאזור מגורים. במחצית השנייה של המאה ה־20 ובמיוחד בעשורים האחרונים הגיעו מעצבים, בתי קפה, מסעדות וגלריות, והנהר הפך ממערכת תשתית למרחב בילוי. נטיעת עצי sakura לאורך הגדות הפכה אותו לאחד מאתרי הפריחה המפורסמים בטוקיו, והפסטיבל השנתי מושך המונים באביב. גם תשתיות הרכבת קיבלו שימוש חדש: ב־2016 פותח Nakameguro Koukashita מתחת למסילה כמסדרון של מסעדות וחנויות. לכן הסיפור של Nakameguro הוא לא של אנדרטה אחת אלא של שינוי עירוני טיפוסי לטוקיו — נהר פונקציונלי ושכונה שקטה שהפכו בהדרגה למרחב ציבורי ולמרכז תרבות עירוני בלי לאבד את קנה המידה המקומי.","infoSource":"https://www.gotokyo.org/en/spot/103/index.html"},{"id":"p_d4046a4ceaec","name":"Starbucks Reserve Roastery Tokyo","city":"טוקיו","area":"Daikanyama + Nakameguro + Shimokitazawa","status":"אולי","kind":"food","desc":"סניף הדגל המרשים של Starbucks לאורך Meguro River, בעיצוב Kengo Kuma.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Starbucks+Reserve+Roastery+Tokyo+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_95e762595bff","name":"Shimokitazawa","city":"טוקיו","area":"Daikanyama + Nakameguro + Shimokitazawa","status":"אולי","kind":"attraction","desc":"שכונת היפסטרים עם וינטג׳, תקליטים, בתי קפה וחנויות קטנות.","duration":"1.5–2.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Shimokitazawa+Japan","booking":"","website":"","info":"Shimokitazawa, או Shimokita, הייתה בעבר אזור חקלאי מחוץ לליבה של טוקיו. הרחובות הצרים והמפותלים שלה הם שריד לתקופה שבה לא תוכננו עבור מכוניות אלא סביב שדות וכפרים. לפי JNTO, ההתפתחות המודרנית של האזור התחזקה אחרי רעידת Kantō של 1923, כאשר תושבים חיפשו מגורים מחוץ למרכז הצפוף והפגוע. אחרי מלחמת העולם השנייה התפתח כאן גם שוק שפנה לחיילים אמריקאים, וההשפעה המערבית הצטרפה לאופי המקומי. כאשר קווי Odakyu ו־Keio חיברו את השכונה בקלות ל־Shinjuku ול־Shibuya, השכירות היחסית נמוכה והמבנים הקטנים משכו סטודנטים, מוזיקאים, שחקנים ועסקים עצמאיים. משנות ה־70 וה־80 נוצרה כאן סצנה חזקה של live houses, תיאטרון קטן, קולנוע וחנויות יד שנייה, והשם Shimokita הפך כמעט למותג של תרבות אלטרנטיבית. בשנים האחרונות הורדת חלק מקו Odakyu מתחת לאדמה יצרה שטחים ציבוריים ומסחריים חדשים, והיה חשש שהפיתוח ימחק את האופי הישן; במקום זאת נוצר שילוב מורכב בין חדש לישן. לכן הרחובות הצרים, חנויות ה־vintage והופעות המוזיקה אינם רק 'וייב היפסטרי' — הם תוצאה של מאה שנה של הגירה פנימית, תרבות אמריקאית אחרי המלחמה וכלכלה שאפשרה ליוצרים לחיות קרוב למרכז.","infoSource":"https://www.japan.travel/en/spot/2108/"},{"id":"p_33e228bf3c4f","name":"Osaka Castle","city":"אוסקה","area":"Osaka Castle + Tenjinbashi","status":"רוצה","kind":"attraction","desc":"הטירה המרכזית של אוסקה והפארק שמסביבה. מתאימה לחצי יום של היסטוריה, גנים ותצפית.","duration":"1.5–2.5 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Osaka+Castle+Japan","booking":"","website":"","info":"Osaka Castle קשור ישירות ל־Toyotomi Hideyoshi ולמאבק על איחוד יפן בסוף המאה ה־16. Hideyoshi החל לבנות את הטירה בשנת 1583 על אתר שבו עמד קודם המתחם המבוצר Ishiyama Hongan-ji. הטירה הייתה אמורה להיות לא רק מבצר אלא הצהרה פוליטית: מרכז חדש לשלטונו של האיש שהצליח לאחד חלק גדול מיפן לאחר עשרות שנים של מלחמות אזרחים.\n\nאחרי מותו של Hideyoshi הפך המתחם לזירת העימות הסופי בין בית Toyotomi לבית Tokugawa. במצור אוסקה של 1614–1615 הובסו ה־Toyotomi והטירה נהרסה. שלטון Tokugawa בנה אותה מחדש בקנה מידה גדול, אך מגדל העוז נהרס שוב מפגיעת ברק ב־1665 ולא נבנה במשך יותר מ־250 שנה. המגדל הנוכחי נבנה ב־1931 מתרומות אזרחי אוסקה — פרט חשוב, כי הוא הופך את המבנה המודרני לסמל עירוני ולא רק לשחזור פיאודלי. בתוך הטירה נמצא כיום מוזיאון שמספר את סיפור Hideyoshi, הקרבות והעיר. הקירות, החפירים והשערים סביב המגדל כוללים חלקים היסטוריים אמיתיים מתקופת Tokugawa.","infoSource":"https://www.osaka-info.jp/en/spot/osaka-castle-main-keep/","historyVerified":true},{"id":"p_db8ec5eeb85a","name":"Osaka Castle Park","city":"אוסקה","area":"Osaka Castle + Tenjinbashi","status":"רוצה","kind":"attraction","desc":"פארק רחב סביב הטירה עם שבילים, עצים ונקודות צילום.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Osaka+Castle+Park+Japan","booking":"","website":"","info":"Osaka Castle Park הוא לא רק “הפארק סביב הטירה”, אלא שכבה היסטורית שלמה של ביצורים, חפירים, שערים ושרידי מתחם השלטון. הטירה המקורית של Toyotomi Hideyoshi הוקמה כאן בסוף המאה ה־16, ואחרי נפילת בית Toyotomi ב־1615 בנה שלטון Tokugawa מערכת ביצורים חדשה על אותו אתר.\n\nרבים מהמבנים שנראים בפארק כיום אינם מתקופת Hideyoshi אלא מתקופת Tokugawa, וחלקם שרדו שריפות, מלחמות והפצצות. בתקופה המודרנית שימש חלק מהאזור גם את הצבא היפני, ולכן מלחמת העולם השנייה השאירה בו נזק משמעותי. לאחר המלחמה עבר השטח תהליך הדרגתי של שיקום והפיכה לפארק ציבורי. ההליכה סביב החפירים והחומות מאפשרת להבין הרבה יותר טוב את קנה המידה של המצודה מאשר ביקור במגדל בלבד — למעשה, החומות העצומות והאבנים הגדולות הן מהשרידים ההיסטוריים המרשימים ביותר באתר.","infoSource":"https://www.osaka-info.jp/en/discover-kansai/osaka-castle/","historyVerified":true},{"id":"p_05aa276494c5","name":"Tenjinbashi-suji Shopping Street","city":"אוסקה","area":"Osaka Castle + Tenjinbashi","status":"רוצה","kind":"attraction","desc":"אחד מרחובות הקניות המקורים הארוכים ביפן, עם אוכל, חנויות מקומיות ואווירה אוסקאית יומיומית.","duration":"1.5–2 ש׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Tenjinbashi-suji+Shopping+Street+Japan","booking":"","website":"","info":"Tenjinbashi-suji הוא רחוב מסחרי באורך כ־2.6 קילומטרים, שהתפתח סביב Osaka Tenmangu — המקדש הגדול של אזור Tenma. העלייה לרגל למקדש יצרה ביקוש לחנויות, אוכל ושירותים, וכך נוצר בהדרגה ציר מסחרי צפוף.\n\nהקרבה ל־Temma Vegetable Market, אחד השווקים הגדולים של אוסקה, חיזקה את הרחוב כמוקד עממי ולא כרחוב יוקרה. לאורך השנים פעלו כאן מאות עסקים קטנים, מסעדות וחנויות שכונתיות.\n\nבשנות ה־30, כאשר נפתחו שווקים סיטונאיים ומרכזים מסחריים גדולים, הרחוב נאלץ להתמודד עם ירידה בתנועה. בעלי העסקים החלו לשווק אותו כ“רחוב הקניות הארוך ביפן” ולהדגיש קשר אישי עם לקוחות. כיום פועלות בו מאות חנויות, והוא עדיין מרגיש יותר מקומי ופחות תיירותי מאשר Shinsaibashi.","infoSource":"https://osaka-info.jp/experience/en/osaka/spot/237","historyVerified":true},{"id":"p_bookoff_super_bazaar_omori","name":"BOOKOFF SUPER BAZAAR SEIYU Omori Store","city":"טוקיו","area":"Omori / Shinagawa","status":"רוצה","kind":"attraction","desc":"סניף BOOKOFF SUPER BAZAAR גדול בטוקיו עם ספרים, CD/DVD/Blu-ray, טלפונים, אלקטרוניקה, מוצרי חשמל, כלי נגינה, אופנה, כרטיסי אספנות, צעצועים, מותגים וכלי בית.","duration":"1.5–2 שעות","note":"לא באקיהברה — מתאים כעצירה נפרדת אם רוצים חוויית BOOKOFF SUPER BAZAAR גדולה.","maps":"https://www.google.com/maps/search/?api=1&query=BOOKOFF+SUPER+BAZAAR+SEIYU+Omori+Store+Tokyo+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_pokemon_center_tokyo_dx","name":"Pokémon Center TOKYO DX","city":"טוקיו","area":"Nihonbashi + Tokyo Station","status":"חובה","kind":"attraction","desc":"Pokémon Center גדול בניהונבאשי, עם מרצ'נדייז רחב, מוצרים בלעדיים ואזור Pokémon Café הסמוך. מתאים לשילוב עם Tokyo Station / Nihonbashi ביום מרכז טוקיו.","duration":"60–90 דק׳","note":"אפשר לשלב עם Pokémon Café אם משיגים הזמנה.","maps":"https://www.google.com/maps/search/?api=1&query=Pokemon+Center+TOKYO+DX+Nihonbashi+Tokyo+Japan","booking":"","website":"","historyNotApplicable":true},{"name":"GINZA SIX + Rooftop Garden","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"מתחם עיצוב, אמנות וקמעונאות בלב גינזה. הדגש אצלנו הוא על האדריכלות, האמנות הציבורית וגינת הגג הגדולה — לא על עוד סבב קניות.","duration":"45–60 דק׳","note":"משתלב טבעית ביום Ginza. גינת הגג היא החלק החשוב.","maps":"https://www.google.com/maps/search/?api=1&query=GINZA+SIX+Tokyo","booking":"","website":"https://ginza6.tokyo/","id":"p_98d0feba9731","info":"GINZA SIX נפתח ב־2017 על מגרש שבו פעל במשך עשרות שנים Matsuzakaya Ginza, בית כלבו שהשורשים של החברה שלו מגיעים עוד לתקופת Edo. הפרויקט החדש איחד כמה חלקות גדולות בלב Ginza ונועד להיות יותר מקניון: האדריכל Yoshio Taniguchi תכנן את המעטפת, ובתוך הבניין שולבו אמנות ציבורית, חללי תרבות, תיאטרון Noh, GINZA TSUTAYA BOOKS וגינת גג גדולה. האטריום מארח עבודות אמנות מתחלפות בקנה מידה עצום, מה שממשיך מסורת ארוכה של בתי כלבו יפניים כנותני חסות לתרבות ולא רק כחנויות. גם הגג חשוב בהקשר של Ginza: זה אחד האזורים היקרים והצפופים במדינה, ובכל זאת הוקצה שטח גדול למרחב פתוח עם צמחייה ותצפית. הבניין מספר משהו על ההיסטוריה המתמשכת של Ginza מאז Meiji — רובע שמנסה בכל דור להציג את הגרסה החדשה ביותר של יפן דרך מסחר, ארכיטקטורה וטכנולוגיה. במקום שבו פעם היה בית כלבו קלאסי נבנה מתחם שמציג אמנות עכשווית ו־design לצד מותגי יוקרה. לכן כשעולים לגג, כדאי לראות את Ginza כמעבדה של מודרניות יפנית יותר מאשר רק אזור קניות.","infoSource":"https://ginza6.tokyo/art_en/"},{"name":"Kabukiza Theatre","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"בית הקבוקי האייקוני של גינזה. במסלול שלנו זו עצירת אדריכלות ותרבות קצרה מבחוץ/בלובי, בלי לבנות את היום סביב הופעה מלאה.","duration":"20–30 דק׳","note":"קרוב מאוד ל-Ginza Mitsukoshi ול-GINZA SIX.","maps":"https://www.google.com/maps/search/?api=1&query=Kabukiza+Theatre+Ginza+Tokyo","booking":"","website":"https://www.kabukiweb.net/theatres/kabukiza/","id":"p_4b5605ad0dd4","info":"Kabukiza נפתח לראשונה בנובמבר 1889, בתקופת Meiji, כאשר יפן ניסתה להגדיר מחדש את התרבות שלה מול המערב. המייסד Fukuchi Gen'ichirō היה עיתונאי ורפורמטור שרצה להעלות את מעמדו של kabuki ולהציג אותו כתיאטרון לאומי מכובד. המבנה הראשון שילב חזית מערבית ופנים יפני, ביטוי מושלם של תקופת Meiji. מאז ההיסטוריה של Kabukiza היא כמעט רצף של אסונות ושיקום. ב־1911 נבנה תיאטרון שני בסגנון יפני מפואר; הוא נשרף ב־1921 בגלל תקלה חשמלית. בזמן הבנייה מחדש פגעה רעידת Kantō של 1923 ועיכבה את הפרויקט. המבנה השלישי נפתח ב־1925 ונכנס ל'תור זהב' של kabuki, אך נהרס בהפצצות טוקיו במאי 1945. למרות מחסור חמור בחומרי בניין אחרי המלחמה, נבנה תיאטרון רביעי על בסיס חלקים ששרדו והוא נפתח ב־1951 — מעשה שהפך לסמל של חזרת התרבות לחיים אחרי ההרס. ב־2010 נסגר המבנה לשיקום מלא, וב־2013 נפתח Kabukiza החמישי, ששומר במכוון על הגגות, הקימורים והחזית המסורתית אך מחובר למגדל משרדים מודרני. לכן גם בלי לראות הצגה, הבניין עצמו מספר את ההיסטוריה של kabuki במאה ה־20: מסורת שעברה שריפה, רעידת אדמה, מלחמה ומודרניזציה ועדיין נמצאת בדיוק באותו מקום.","infoSource":"https://www.kabukiweb.net/about/theatre/history_kabukiza_theatre/"},{"name":"Ginza Mitsukoshi Depachika","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"קומת האוכל התת-קרקעית של Ginza Mitsukoshi — דוגמה מצוינת לתרבות ה-depachika היפנית. אצלנו זו עצירת התרשמות/נשנוש, לא ארוחה עיקרית.","duration":"30–40 דק׳","note":"Art Aquarium נמצא באותו מתחם, ולכן חיברנו אותם ברצף.","maps":"https://www.google.com/maps/search/?api=1&query=Ginza+Mitsukoshi+Tokyo","booking":"","website":"https://cp.mistore.jp/global/en/ginza.html","id":"p_c2afc1121926","info":"ה-Depachika של Ginza Mitsukoshi הוא עולם אוכל שלם בקומות המרתף של כלבו יפני קלאסי. אפשר לראות שם קונדיטוריה, wagashi, מנות מוכנות, חומרי גלם ומתנות אוכל ברמת תצוגה גבוהה מאוד. המטרה אצלנו היא להכיר את תרבות בתי הכלבו היפנית ולעשות סיבוב קצר לפני Art Aquarium שנמצא באותו מתחם."},{"name":"Tsukiji Outer Market","city":"טוקיו","area":"Ginza + Tokyo Station","status":"רוצה","kind":"attraction","desc":"שוק האוכל החיצוני ההיסטורי של צוקיג׳י. השוק הסיטונאי עבר ל-Toyosu, אבל החנויות, הדוכנים והמסעדות של ה-Outer Market ממשיכים לפעול.","duration":"60–75 דק׳","note":"נכנס לבוקר של יום Ginza/Hamarikyu. לצמחוני: לבדוק היטב dashi/fish stock גם במנות שנראות צמחוניות.","maps":"https://www.google.com/maps/search/?api=1&query=Tsukiji+Outer+Market+Tokyo","booking":"","website":"https://www.tsukiji.or.jp/english/","id":"p_6b3bdf9de12d","info":"Tsukiji מתחיל בכלל מאסון. בשנת 1657 החריבה Great Fire of Meireki חלקים עצומים של Edo, והשוגונות החליטה לייבש שטח מן המפרץ כדי ליצור קרקע חדשה — מכאן השם Tsuki-ji, 'אדמה בנויה'. במשך זמן רב האזור כלל מקדשים ובתי samurai ולא היה מזוהה דווקא עם דגים. שוק הדגים הגיע לכאן רק אחרי אסון נוסף: רעידת Kantō של 1923 הרסה את Nihonbashi Fish Market, שפעל במרכז Edo/Tokyo מאות שנים. הממשלה בחרה להעביר את השוק ל־Tsukiji ובנתה מתקן סיטונאי מודרני שנפתח ב־1935. המעבר לא היה פשוט; סוחרים ותיקים נאלצו להסתגל ממבנה מסחרי פרטי למערכת של שוק סיטונאי מפוקח, והוויכוחים סביב זכויות וסדרי מסחר נמשכו שנים. בזמן המלחמה פעילות השוק הוגבלה, ולאחר הכיבוש האמריקאי היא נבנתה מחדש. בתקופת הצמיחה Tsukiji הפך לשוק הדגים הגדול והמפורסם בעולם וסמל בינלאומי של sushi. עם הזמן המבנים הזדקנו והעומס גדל, וב־2018 עבר השוק הסיטונאי ל־Toyosu. אבל מאות חנויות, ספקים ומסעדות מחוץ למתחם הרשמי נשארו — זהו Outer Market של היום. לכן זה לא 'שוק ישן שנשאר אחרי המעבר' אלא שכונה מסחרית שהצליחה לשרוד אובדן של המוסד המרכזי שלה. סכינים, אצות, tea, tamagoyaki וחומרי גלם מספרים את הסיפור לא פחות מהדגים.","infoSource":"https://www.tsukiji.or.jp/english/"},{"id":"ky_nishiki_tenmangu","name":"Nishiki Tenmangū","city":"קיוטו","area":"Central Kyoto","status":"רוצה","kind":"attraction","duration":"20–30 דק׳","kyotoMinutes":25,"desc":"מקדש שינטו קטן בקצה המזרחי של Nishiki Market, מוקדש ל-Sugawara no Michizane.","info":"Nishiki Tenmangū יושב ממש במקום שבו שוק Nishiki מתחבר לאזור Teramachi/Shinkyōgoku. הוא קטן, אבל זו בדיוק הסיבה שהוא שימושי: הוא מוסיף שכבת שינטו וחיי שכונה ליום שמבוסס אחרת על אוכל וקניות. במסמך 1711 הוא הוצג כמעבר טבעי מהשוק אל הארקדות.","kyotoWhy":"כמעט אפס סטייה מהמסלול אם עושים Nishiki; תמורה גבוהה לזמן קצר.","kyotoCombine":"Nishiki Market → Nishiki Tenmangū → Teramachi → Shinkyōgoku.","kyotoSources":["1711"],"maps":"https://www.google.com/maps/search/?api=1&query=Nishiki+Tenmangu+Kyoto","youtube":"https://www.youtube.com/results?search_query=Nishiki+Tenmangu+Kyoto","website":"","kyotoCandidate":true,"note":"","booking":""},{"id":"ky_gion_corner","name":"Gion Corner","city":"קיוטו","area":"Higashiyama + Gion","status":"אולי","kind":"experience","duration":"60–75 דק׳","kyotoMinutes":70,"desc":"מופע מבוא לכמה אמנויות מסורתיות יפניות במקום אחד, בלב Gion.","info":"Gion Corner הופיע בגיליונות המקור כ-POI בקיוטו. היתרון שלו הוא ריכוז של כמה אמנויות במה ומסורות לערב אחד, כך שהוא יכול לתת הקשר למה שרואים ברחובות Gion בלי לחפש מופע מלא של תחום אחד.","kyotoWhy":"טוב אם רוצים ערב תרבותי מובנה במקום עוד שיטוט חופשי.","kyotoCombine":"Gion / Yasaka / Pontocho בערב.","kyotoSources":["Japan 2025"],"maps":"https://www.google.com/maps/search/?api=1&query=Gion+Corner+Kyoto","youtube":"https://www.youtube.com/results?search_query=Gion+Corner+Kyoto+Japan","website":"","kyotoCandidate":true,"note":"","booking":""},{"id":"ky_yasui_konpiragu","name":"Yasui Konpiragu Shrine","city":"קיוטו","area":"Higashiyama + Gion","status":"אולי","kind":"attraction","duration":"20–35 דק׳","kyotoMinutes":30,"desc":"מקדש שינטו קטן ומוזר יחסית, ידוע באבן Enkiri/Enmusubi ובטקסי 'ניתוק קשרים רעים וחיבור קשרים טובים'.","info":"במסמך 'יפן' הופיע תיאור מפורט של טקס שבו כותבים על katashiro מה רוצים לנתק, עוברים דרך פתח באבן ומדביקים את הפתק. זהו Yasui Konpiragu. זו חוויה יפנית מאוד שונה מהאתרים הגדולים ויכולה להיות עצירה קצרה ומעניינת בין Kiyomizu/Gion.","kyotoWhy":"ייחודי, קצר, ומוסיף חוויה פעילה במקום עוד מקדש 'לראות'.","kyotoCombine":"Kōdai-ji / Gion / Kennin-ji.","kyotoSources":["יפן.docx"],"maps":"https://www.google.com/maps/search/?api=1&query=Yasui+Konpiragu+Shrine+Kyoto","youtube":"https://www.youtube.com/results?search_query=Yasui+Konpiragu+Shrine+Kyoto","website":"","kyotoCandidate":true,"note":"","booking":""},{"id":"ky_okazaki_canal","name":"Okazaki Canal","city":"קיוטו","area":"Nanzen-ji + Eikando","status":"אולי","kind":"attraction","duration":"30–45 דק׳","kyotoMinutes":40,"desc":"תעלה באזור Okazaki, קרובה ל-Nanzen-ji ולמוזיאונים; הליכה עירונית נעימה לצד מים.","info":"מאמר אל-על הזכיר את תעלת Okazaki כאחד מנופי קיוטו. היא פחות יעד עצמאי ויותר קטע מעבר מוצלח שמחבר בין Nanzen-ji, אזור המוזיאונים והעיר המודרנית. בתחילת דצמבר הערך תלוי במזג האוויר ובצבעי העונה.","kyotoWhy":"טוב אם רוצים יום מזרח Kyoto פחות צפוף ועם יותר הליכה פתוחה.","kyotoCombine":"Nanzen-ji / Eikandō / Heian-Okazaki area.","kyotoSources":["ELAL"],"maps":"https://www.google.com/maps/search/?api=1&query=Okazaki+Canal+Kyoto","youtube":"https://www.youtube.com/results?search_query=Okazaki+Canal+Kyoto","website":"","kyotoCandidate":true,"note":"","booking":""},{"id":"ky_tofukuji","name":"Tōfuku-ji","city":"קיוטו","area":"Fushimi","status":"רוצה","kind":"attraction","duration":"75–100 דק׳","kyotoMinutes":90,"desc":"מקדש Zen גדול עם גשר Tsūtenkyō, עמק מייפלים וגני Hōjō מודרניים.","info":"במסמך 2111 Tōfuku-ji הוא החוליה המרכזית בין Fushimi Inari לרובע הסאקה. הוא אחד ממקדשי הזן הגדולים בקיוטו ושמו משלב את Tōdai-ji ו-Kōfuku-ji מנארה. Tsūtenkyō חוצה עמק מלא מייפלים, ולכן בסוף נובמבר/תחילת דצמבר המקום יכול להיות מהחזקים בעיר לשלכת.","kyotoWhy":"אם השלכת עדיין טובה ב-1–3 בדצמבר, זו אחת התוספות הכי חזקות למסלול.","kyotoCombine":"Fushimi Inari → Tōfuku-ji → Fushimi Sake District.","kyotoSources":["2111"],"maps":"https://www.google.com/maps/search/?api=1&query=Tofuku-ji+Temple+Kyoto","youtube":"https://www.youtube.com/results?search_query=Tofukuji+Kyoto+autumn","website":"https://tofukuji.jp/english/","kyotoCandidate":true,"note":"","booking":""},{"id":"ky_gekkeikan","name":"Gekkeikan Ōkura Sake Museum","city":"קיוטו","area":"Fushimi","status":"רוצה","kind":"experience","duration":"
