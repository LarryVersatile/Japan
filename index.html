<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07090d">
<title>יפן 2026 · v105 Verified Mobile</title>
<style>
  :root { --bg:#07090d; --card:#141a24; --line:#2a3444; --text:#f4f7fb; --muted:#93a0b3; --blue:#8ebcff; --ink:#071018; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust:100%; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; overflow-x:hidden; max-width:100%; }
  button, a { touch-action:manipulation; }
  button, input, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  a { color:var(--blue); }
  .app { width:min(480px,100%); margin:0 auto; min-height:100dvh; padding: 12px 16px calc(28px + env(safe-area-inset-bottom)); }
  .dow { color:var(--blue); font-size:13px; font-weight:700; }
  h1 { font-size:34px; line-height:1.05; margin:4px 0 0; }
  .sub { color:var(--muted); margin:6px 0 12px; font-size:15px; }
  .days { display:flex; gap:8px; overflow-x:auto; max-width:100%; padding-bottom:8px; margin:0 -16px 14px; padding-inline:16px; scroll-snap-type:x mandatory; overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch; }
  .days::-webkit-scrollbar { display:none; }
  .pill { flex:0 0 auto; scroll-snap-align:start; min-width:72px; min-height:52px; border-radius:16px; border:1px solid var(--line); background:#10151d; color:var(--text); }
  .pill.on { background:var(--blue); color:var(--ink); border-color:var(--blue); }
  .pill b { display:block; font-size:16px; }
  .pill span { font-size:11px; opacity:.75; }
  .now { background:#102033; border:1px solid #3c6288; border-radius:24px; padding:16px; }
  .label { color:#b7d4ff; font-size:13px; font-weight:800; }
  .time { direction:ltr; unicode-bidi:isolate; display:inline-block; margin-top:8px; font-size:22px; font-weight:750; font-variant-numeric:tabular-nums; }
  .now h2, .sheet h2 { margin:4px 0 8px; font-size:26px; line-height:1.2; overflow-wrap:anywhere; }
  .desc { margin:0; color:#d5deea; font-size:16px; line-height:1.45; }
  .next { margin-top:12px; color:#c5d4e6; font-size:15px; }
  .warn { margin-top:8px; color:#ffd98a; font-size:14px; }
  .actions { display:flex; gap:8px; margin-top:14px; }
  .btn { min-height:48px; border-radius:14px; border:0; padding:12px 14px; font-weight:800; text-decoration:none; display:flex; align-items:center; justify-content:center; }
  .primary { background:var(--blue); color:var(--ink); flex:1; }
  .ghost { background:transparent; color:#d7e6f8; border:1px solid #4d6986; }
  .late { width:100%; margin-top:8px; min-height:44px; border-radius:12px; border:1px solid var(--line); background:transparent; color:#c9d6e6; }
  .mymaps-link {
    width:100%; min-height:44px; margin:8px 0 2px; border-radius:12px;
    border:1px solid #315e87; background:#102033; color:#cfe8ff;
    display:flex; align-items:center; justify-content:center; text-decoration:none; font-weight:800;
  }
  .block { margin:18px 0 8px; color:var(--muted); font-size:13px; font-weight:800; }
  .row { width:100%; min-height:58px; display:flex; flex-direction:column; align-items:stretch; gap:2px; text-align:right; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; margin-top:8px; }
  .row-shell, .place-card-shell { position:relative; }
  .row-shell .row, .place-card-shell .card { padding-inline-start:54px; }
  .info-btn {
    position:absolute; left:11px; top:50%; transform:translateY(-50%);
    width:34px; height:34px; min-width:34px; min-height:34px; padding:0;
    border-radius:50%; border:1px solid #56708e; background:#152233; color:#cfe6ff;
    font-family:Georgia,serif; font-size:19px; font-weight:900; line-height:1;
    display:flex; align-items:center; justify-content:center; z-index:3;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
  }
  .info-btn:active { transform:translateY(-50%) scale(.96); }
  .now { position:relative; }
  .now .info-btn.info-current { top:18px; left:16px; transform:none; }
  .now .info-btn.info-current:active { transform:scale(.96); }
  .info-summary {
    margin:12px 0; padding:13px 14px; border-radius:16px;
    background:#0e1824; border:1px solid #29435f; color:#dce8f6;
  }
  .info-summary h3 { margin:0 0 8px; font-size:15px; color:#9fcaff; }
  .info-summary p { margin:0; font-size:16px; line-height:1.55; white-space:pre-line; }
  .info-facts { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .info-fact {
    display:inline-flex; padding:5px 8px; border-radius:999px;
    border:1px solid #33475f; color:#afc1d6; font-size:12px; background:#121c28;
  }
  .info-source {
    display:inline-flex; margin-top:12px; min-height:38px; align-items:center; padding:7px 10px;
    border-radius:10px; border:1px solid #355574; background:#132235; color:#a9d2ff;
    text-decoration:none; font-size:13px; font-weight:800;
  }
  .row .t { direction:ltr; unicode-bidi:isolate; color:var(--blue); font-weight:700; font-size:15px; text-align:left; }
  .row .n { font-weight:700; font-size:17px; overflow-wrap:anywhere; }
  .row.transit .n { color:#b7c3d4; font-weight:650; }
  .row.done-row {
    background:#10281c;
    border-color:#2f7d50;
    color:#dff7e8;
    min-height:52px;
  }
  .row.done-row .t { color:#76d69b; }
  .row.done-row .n { color:#e7fff0; }
  .row.done-row .done-check {
    color:#65d88f;
    font-weight:900;
    margin-left:6px;
  }
  .done-hint { color:#76a98a; font-size:11px; margin-top:2px; }

  .hop { color:var(--muted); font-size:13px; padding:6px 6px 0; }
  .fold { width:100%; margin-top:14px; min-height:44px; border:0; background:transparent; color:var(--muted); text-align:right; }
  .night { margin-top:8px; }
  .night p { color:var(--muted); font-size:14px; margin:0 0 8px; }
  .chip { display:inline-block; margin:0 0 8px 8px; padding:10px 12px; border-radius:999px; background:#161222; color:#e4dcff; border:1px solid #3c345c; font-size:14px; text-decoration:none; }
  .chrome { position:sticky; top:0; z-index:12; background:rgba(7,9,13,.97); backdrop-filter:blur(18px); border-bottom:1px solid var(--line); }
  .modebar { display:flex; gap:6px; padding:calc(7px + env(safe-area-inset-top)) 16px 6px; }
  .modebar button { flex:1; min-height:42px; border-radius:13px; border:1px solid #273447; background:#0e141d; color:#98a9bd; font-weight:850; font-size:14px; }
  .modebar button.on { background:#dbeafe; color:#0a1626; border-color:#dbeafe; box-shadow:0 0 0 1px rgba(255,255,255,.05) inset; }
  .modebar button span { margin-left:5px; }
  .nav { position:static; z-index:10; display:flex; justify-content:center; gap:8px; padding:5px 16px 8px; background:transparent; border-bottom:0; }
  .planning-mode .nav { display:none; }
  .nav button { flex:1; max-width:160px; min-height:48px; border-radius:14px; border:0; background:transparent; color:var(--muted); font-weight:700; }
  .nav button.on { background:#182232; color:#fff; }
  .search { width:100%; min-height:48px; border-radius:14px; border:1px solid var(--line); background:#10151d; padding:0 12px; font-size:16px; }
  .filters { display:flex; gap:8px; overflow-x:auto; margin:12px 0; }
  .filters button { flex:0 0 auto; min-height:40px; border-radius:999px; border:1px solid var(--line); background:#10151d; padding:0 12px; }
  .filters button.on { background:var(--blue); color:var(--ink); border-color:var(--blue); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; margin-top:8px; }
  .card b { font-size:16px; }
  .meta { color:var(--muted); font-size:13px; margin-top:4px; }
  .sheet-back { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; z-index:20; }
  .sheet { width:min(480px,100%); margin:0 auto; background:#121821; border-radius:22px 22px 0 0; padding:12px 16px calc(16px + env(safe-area-inset-bottom)); max-height:86dvh; overflow:auto; }
  .handle { width:42px; height:5px; border-radius:99px; background:#314055; margin:4px auto 12px; }
  textarea { width:100%; min-height:88px; border-radius:14px; border:1px solid var(--line); background:#0d1219; padding:12px; font-size:16px; }
  .menu { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .menu button, .menu a { min-height:44px; border-radius:12px; border:1px solid var(--line); background:#182232; color:#e7eef8; padding:10px 12px; text-decoration:none; }
  .opt { width:100%; text-align:right; background:#101722; border:1px solid var(--line); border-radius:14px; padding:12px; margin-top:8px; }
  .toast { position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:30; background:#182232; border:1px solid var(--line); border-radius:14px; padding:12px; display:flex; justify-content:space-between; align-items:center; gap:8px; }


  /* v77 — Planning mode */
  .plan-wrap { max-width:1180px; margin:0 auto; }
  .plan-hero { padding:4px 0 8px; }
  .plan-hero h1 { margin:0 0 5px; }
  .plan-hero .sub { max-width:820px; }
  .plan-tabs { display:flex; gap:7px; overflow-x:auto; margin:12px 0 14px; padding-bottom:2px; }
  .plan-tabs button { flex:0 0 auto; min-height:42px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:#101722; color:#c4d0df; font-weight:800; }
  .plan-tabs button.on { background:#dbeafe; color:#0a1626; border-color:#dbeafe; }
  .plan-toolbar { display:grid; gap:9px; margin-bottom:14px; }
  .plan-filter-row { display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; }
  .plan-filter-row::-webkit-scrollbar,.plan-tabs::-webkit-scrollbar{display:none}
  .plan-filter-row button { flex:0 0 auto; min-height:38px; padding:0 11px; border:1px solid var(--line); border-radius:999px; background:#101722; color:#b9c7d8; font-weight:750; font-size:13px; }
  .plan-filter-row button.on { background:#24354a; border-color:#496784; color:#fff; }
  .plan-select { width:100%; min-height:46px; border-radius:14px; border:1px solid var(--line); background:#10151d; color:var(--text); padding:0 12px; font-size:15px; }
  .plan-summary { display:flex; flex-wrap:wrap; gap:7px; margin:10px 0 14px; }
  .plan-summary span { padding:6px 9px; border-radius:999px; border:1px solid #2d3c50; background:#101722; color:#aebed2; font-size:12px; font-weight:800; }
  .plan-section-title { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:20px 0 8px; }
  .plan-section-title h2 { font-size:18px; margin:0; }
  .plan-section-title span { color:var(--muted); font-size:12px; }
  .plan-grid { display:grid; grid-template-columns:1fr; gap:10px; }
  .plan-card { position:relative; border:1px solid var(--line); border-radius:18px; background:var(--card); overflow:hidden; }
  /* v85 — restored traffic-light planning priority */

  
  .history-na{margin:10px 0 4px;border:1px dashed #425168;border-radius:11px;padding:9px 10px;color:#8999aa;background:#0d141d;font-size:12px;line-height:1.5}
.card-history{margin:10px 0 4px;border:1px solid #31455e;border-radius:12px;background:#0d1622;overflow:hidden}
  .card-history summary{cursor:pointer;padding:10px 11px;font-weight:900;color:#e5f0fb;list-style:none;display:flex;align-items:center;gap:6px}
  .card-history summary::-webkit-details-marker{display:none}
  .card-history summary::after{content:'＋';margin-right:auto;color:#8ca2ba}
  .card-history[open] summary::after{content:'−'}
  .card-history-body{padding:0 11px 11px;color:#c2d0df;font-size:13px;line-height:1.75}
  .card-history-body p{margin:8px 0}
  .card-history-body .info-source{display:inline-block;margin-top:7px;border:1px solid #45607d;border-radius:9px;padding:6px 8px;text-decoration:none;color:#dcecff;font-weight:850;font-size:12px}
  .plan-card.status-must,
  .kyoto-card.status-must {
    border-color:#22c55e;
    box-shadow:0 0 0 2px rgba(34,197,94,.18) inset, 0 0 18px rgba(34,197,94,.08);
    background:linear-gradient(180deg,rgba(34,197,94,.08),var(--card) 34%);
  }
  .plan-card.status-want,
  .kyoto-card.status-want {
    border-color:#3fae62;
    box-shadow:0 0 0 1px rgba(63,174,98,.10) inset;
    background:linear-gradient(180deg,rgba(63,174,98,.045),var(--card) 30%);
  }
  .plan-card.status-maybe,
  .kyoto-card.status-maybe {
    border-color:#e59b28;
    box-shadow:0 0 0 1px rgba(229,155,40,.10) inset;
    background:linear-gradient(180deg,rgba(229,155,40,.05),var(--card) 30%);
  }
  .plan-card.status-no,
  .kyoto-card.status-no {
    border-color:#d6535b;
    background:linear-gradient(180deg,rgba(214,83,91,.055),var(--card) 30%);
    opacity:.72;
  }
  .plan-card.status-must::before,
  .plan-card.status-want::before,
  .plan-card.status-maybe::before,
  .plan-card.status-no::before,
  .kyoto-card.status-must::before,
  .kyoto-card.status-want::before,
  .kyoto-card.status-maybe::before,
  .kyoto-card.status-no::before {
    content:"";
    position:absolute;
    inset:0 auto 0 0;
    width:5px;
    z-index:2;
  }
  .plan-card.status-must::before,.kyoto-card.status-must::before{background:#22c55e}
  .plan-card.status-want::before,.kyoto-card.status-want::before{background:#3fae62}
  .plan-card.status-maybe::before,.kyoto-card.status-maybe::before{background:#e59b28}
  .plan-card.status-no::before,.kyoto-card.status-no::before{background:#d6535b}
  .plan-card-body { padding:13px; }
  .plan-card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .plan-card-title { margin:0; font-size:18px; line-height:1.25; }
  .plan-card .meta { margin-top:5px; }
  .plan-card-desc { margin:9px 0 0; color:#c9d5e4; font-size:14px; line-height:1.45; }
  .plan-route { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .plan-route span { padding:5px 8px; border-radius:999px; background:#10281c; border:1px solid #2f7d50; color:#c9f6d9; font-size:11px; font-weight:850; }
  .plan-route .not-scheduled { background:#171b22; border-color:#38404b; color:#9ba9ba; }
  .plan-status { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin-top:11px; }
  .plan-status button { min-height:38px; border-radius:10px; border:1px solid #2b384a; background:#101722; color:#aebdd0; font-size:12px; font-weight:850; padding:4px 3px; }
  .plan-status button.on[data-plan-status="חובה"] {
    background:#0f4d2a; border-color:#22c55e; color:#d9ffe6;
    box-shadow:0 0 0 2px rgba(34,197,94,.18) inset;
  }
  .plan-status button.on[data-plan-status="רוצה"] {
    background:#173e26; border-color:#3fae62; color:#ddffe7;
  }
  .plan-status button.on[data-plan-status="אולי"] {
    background:#4a3111; border-color:#e59b28; color:#fff0ca;
  }
  .plan-status button.on[data-plan-status="לא"] {
    background:#4b1d22; border-color:#d6535b; color:#ffdadd;
  }
  .traffic-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:4px;vertical-align:0;background:#64748b}
  .traffic-dot.green{background:#22c55e;box-shadow:0 0 7px rgba(34,197,94,.45)}
  .traffic-dot.orange{background:#e59b28;box-shadow:0 0 7px rgba(229,155,40,.35)}
  .traffic-dot.red{background:#d6535b;box-shadow:0 0 7px rgba(214,83,91,.35)}
  .traffic-legend{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 13px}
  .traffic-legend span{display:inline-flex;align-items:center;gap:3px;padding:6px 9px;border:1px solid #2d3c50;border-radius:999px;background:#101722;color:#c8d5e4;font-size:12px;font-weight:850}
  .traffic-status-badge.must{border-color:#22c55e!important;color:#d9ffe6!important;background:#123a24!important}
  .traffic-status-badge.want{border-color:#3fae62!important;color:#ddffe7!important;background:#173523!important}
  .traffic-status-badge.maybe{border-color:#e59b28!important;color:#fff0ca!important;background:#3a2a13!important}
  .traffic-status-badge.no{border-color:#d6535b!important;color:#ffdadd!important;background:#3c1c20!important}
  .plan-card-actions { display:flex; gap:7px; margin-top:9px; }
  .plan-card-actions a,.plan-card-actions button { min-height:38px; border-radius:10px; border:1px solid var(--line); background:#151e2a; color:#dce8f6; padding:7px 10px; text-decoration:none; font-size:12px; font-weight:800; }
  .plan-info-mini { width:36px; height:36px; min-width:36px; border-radius:50%; border:1px solid #56708e; background:#152233; color:#cfe6ff; font-family:Georgia,serif; font-weight:900; font-size:18px; }
  .plan-day-route { border:1px solid var(--line); border-radius:16px; padding:9px 11px; background:#0d131c; margin-bottom:12px; }
  .plan-day-line { display:grid; grid-template-columns:70px 1fr; gap:8px; padding:7px 0; border-bottom:1px solid #1c2633; }
  .plan-day-line:last-child { border-bottom:0; }
  .plan-day-line .t { direction:ltr; color:#8fbce6; font-size:12px; }
  .plan-day-line .n { font-size:13px; font-weight:750; }
  .plan-note { border:1px solid #32445a; background:#101b29; color:#b9cae0; border-radius:14px; padding:10px 12px; font-size:13px; line-height:1.45; margin:10px 0 14px; }
  .plan-empty { padding:24px 12px; text-align:center; color:var(--muted); border:1px dashed #344153; border-radius:16px; }
  @media(min-width:760px){ .plan-grid{grid-template-columns:repeat(2,minmax(0,1fr));} .plan-toolbar.two{grid-template-columns:1fr 1fr;} }

  /* v69 — Restaurants tab */
  .restaurant-head { margin-bottom:12px; }
  .restaurant-head h1 { margin-bottom:4px; }
  .restaurant-note { color:var(--muted); font-size:13px; line-height:1.45; margin:0 0 12px; }
  .restaurant-search { margin-bottom:10px; }
  .restaurant-filters { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; }
  .restaurant-filters::-webkit-scrollbar { display:none; }
  .restaurant-filters button {
    flex:0 0 auto; min-height:38px; border-radius:999px; padding:0 12px;
    border:1px solid var(--line); background:#10151d; color:var(--text); font-weight:750;
  }
  .restaurant-filters button.on { background:var(--blue); color:var(--ink); border-color:var(--blue); }
  .restaurant-grid { display:grid; grid-template-columns:1fr; gap:12px; }
  .restaurant-card {
    border:1px solid var(--line); border-radius:18px; overflow:hidden; background:var(--card);
  }
  .restaurant-photo-wrap { width:100%; aspect-ratio:16/9; background:#0c1118; overflow:hidden; }
  .restaurant-photo {
    display:block; width:100%; height:100%; object-fit:cover; background:#0c1118;
  }
  .restaurant-body { padding:13px; }
  .restaurant-topline { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .restaurant-name { margin:0; font-size:19px; line-height:1.2; }
  .diet-badge {
    flex:0 0 auto; display:inline-flex; align-items:center; min-height:28px; padding:4px 9px;
    border-radius:999px; font-size:11px; font-weight:900; border:1px solid;
  }
  .diet-vegan { color:#bff6d1; border-color:#2f7d50; background:#10281c; }
  .diet-vegetarian { color:#d5f5c4; border-color:#5d7c39; background:#1b2812; }
  .diet-vegan-options { color:#bfeef0; border-color:#39717a; background:#10282d; }
  .diet-veg-friendly { color:#ffe4a8; border-color:#766031; background:#2a2110; }
  .diet-unknown { color:#c4cfdd; border-color:#435064; background:#171d26; }
  .restaurant-verify { margin-top:8px; color:#88a1bc; font-size:11px; line-height:1.35; }
  .saved-japan { display:inline-flex; align-items:center; margin-inline-start:6px; padding:3px 7px; border-radius:999px; border:1px solid #4b3c63; background:#1b1625; color:#d8c9ef; font-size:10px; font-weight:800; }
  .restaurant-meta { color:var(--muted); font-size:12px; margin-top:5px; }
  .restaurant-desc { color:#d5deea; line-height:1.45; font-size:14px; margin:9px 0 0; }
  .restaurant-diet { margin-top:9px; font-size:13px; line-height:1.42; color:#dce7f4; }
  .restaurant-address {
    margin-top:10px; color:#aebbc9; font-size:12px; line-height:1.35; direction:ltr; text-align:left;
  }
  .restaurant-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:12px; }
  .restaurant-actions a {
    min-height:42px; display:flex; align-items:center; justify-content:center; text-align:center;
    border-radius:11px; border:1px solid var(--line); background:#182232; color:#e9f1fb;

<script id="trip-data" type="application/json">{"days":[{"id":"2026-11-25","date":"25/11","dow":"רביעי","title":"יום ראשון בטוקיו — ריק","subtitle":"","base":"טוקיו","scope":["טוקיו"],"empty":true,"items":[],"night":[]},{"id":"2026-11-26","date":"26/11","dow":"חמישי","title":"Harajuku → Shibuya","subtitle":"טבע, רחובות, שקיעה וקניות","base":"טוקיו","scope":["טוקיו"],"empty":false,"items":[{"uid":"2026-11-26-0","part":"בוקר","time":"09:00–10:15","start":540,"end":615,"name":"Meiji Jingu Shrine","kind":"אטרקציה","desc":"מקדש שינטו חשוב בתוך יער גדול ושקט בלב טוקיו.","maps":"https://www.google.com/maps/search/?api=1&query=Meiji+Jingu+Japan","website":"","hop":"הליכה 0.7 ק״מ","transit":false,"info":"Meiji Jingu הוא אתר צעיר יחסית, אבל כדי להבין אותו צריך לחזור ל־1868 ולרסטורציית Meiji, התקופה שבה יפן סיימה יותר מ־250 שנות שלטון Tokugawa והחלה להפוך במהירות למדינה מודרנית. הקיסר Meiji, ששלט עד מותו ב־1912, הפך בדיעבד לסמל של המעבר הזה: ביטול המבנה הפיאודלי, הקמת צבא לאומי, תיעוש, רכבות, חינוך מודרני והרחבת הקשרים עם המערב. לאחר מותו של הקיסר ושל אשתו, הקיסרית Shōken, עלתה דרישה ציבורית להקים להם מקדש בטוקיו. המקדש הושלם ונחנך ב־1 בנובמבר 1920, אבל אחד הדברים המדהימים ביותר בו הוא דווקא היער. הוא לא היה כאן במשך מאות שנים: כ־100,000 עצים נתרמו מכל רחבי יפן, ועשרות אלפי מתנדבים סייעו בנטיעה. מומחי יערנות תכננו את הצמחייה כך שבתוך כמאה שנה ייווצר יער כמעט עצמאי שלא ידרוש טיפול מתמיד. כלומר, האנשים שתכננו אותו בראשית המאה ה־20 תכננו למעשה את הנוף שאנחנו רואים היום. רוב מבני המקדש המקוריים נשרפו בהפצצות טוקיו ב־1945 ונבנו מחדש ב־1958 בעזרת תרומות ציבוריות, בעוד היער שרד. לאורך הדרך רואים חביות סאקה מול חביות יין צרפתי — שילוב שמזכיר את תקופת Meiji עצמה: יפן שקלטה רעיונות מערביים בלי לוותר על זהותה. לכן מה שנראה כמו מקדש עתיק בתוך יער עתיק הוא למעשה אנדרטה לאומית מהמאה ה־20 שנבנתה בכוונה כדי לחבר בין יפן המודרנית למסורת Shinto עתיקה.","infoSource":"https://www.meijijingu.or.jp/en/about/establishment/"},{"uid":"2026-11-26-1","part":"בוקר","time":"10:20–11:00","start":620,"end":660,"name":"Yoyogi Park","kind":"אטרקציה","desc":"פארק גדול ונעים ליד Meiji Jingu, טוב להפסקה ירוקה.","maps":"https://www.google.com/maps/search/?api=1&query=Yoyogi+Park+Japan","website":"","hop":"הליכה 1.1 ק״מ","transit":false,"info":"Yoyogi Park נראה היום כמו פארק עירוני רגוע, אבל הקרקע שלו עברה כמעט כל שלב אפשרי בהיסטוריה המודרנית של יפן. בשנת 1910 נערכה באזור הטיסה הממונעת הראשונה ביפן, אירוע שסימל את כניסת המדינה לעידן התעופה. בשנות ה־30 וה־40 השתמש הצבא הקיסרי בשטח לאימונים ולמצעדים, כך שהפארק הירוק של היום היה אז חלק מהמנגנון הצבאי של יפן. לאחר הכניעה ב־1945 השתלט הצבא האמריקאי על האזור והקים כאן את Washington Heights, מתחם מגורים גדול לחיילים ולמשפחותיהם. במשך כמעט שני עשורים התקיימה בלב טוקיו שכונה אמריקאית סגורה יחסית, והנוכחות שלה השפיעה גם על Harajuku הסמוכה. לקראת אולימפיאדת טוקיו 1964 פונה המתחם, וחלק מהשטח הפך לכפר האולימפי — רגע שבו יפן רצתה להציג לעולם מדינה חדשה, משוקמת וטכנולוגית. לאחר האולימפיאדה הפך חלק גדול מהאזור ל־Yoyogi Park, שנפתח לציבור. לכן הפארק מספר מסלול יוצא דופן: חלוציות תעופתית, מיליטריזם, כיבוש אמריקאי, אולימפיאדה ואז מרחב ציבורי פתוח. גם תרבות סוף השבוע — מוזיקאים, רקדנים, קבוצות תחביב ו־people watching — מתאימה לסיום הזה: מקום שפעם נשלט בידי צבא הפך לאחד המרחבים הציבוריים החופשיים ביותר במרכז טוקיו.","infoSource":"https://www.gotokyo.org/en/spot/21/"},{"uid":"2026-11-26-2","part":"בוקר","time":"11:15–12:05","start":675,"end":725,"name":"Reissue 3D Latte Art","kind":"מסעדה / אוכל","desc":"בית קפה מפורסם בלאטה-ארט תלת-ממדי שמצויר לפי בקשה.","maps":"https://www.google.com/maps/search/?api=1&query=Reissue+3D+Latte+Art+Japan","website":"","hop":"הליכה 0.7 ק״מ","transit":false},{"uid":"2026-11-26-3","part":"בוקר","time":"12:15–13:15","start":735,"end":795,"name":"Takeshita Street","kind":"אטרקציה","desc":"רחוב צבעוני בהראג'וקו עם אופנה צעירה, מתוקים וחנויות קטנות.","maps":"https://www.google.com/maps/search/?api=1&query=Takeshita+Street+Japan","website":"","hop":"הליכה 0.5 ק״מ","transit":false,"info":"Takeshita-dori הפכה לסמל של Harajuku בעיקר משנות ה־70 וה־80, אבל הסיפור מתחיל כבר אחרי מלחמת העולם השנייה. באזור הסמוך פעל Washington Heights, מתחם מגורים אמריקאי, והמפגש עם חיילים, משפחות אמריקאיות, מוזיקה ומותגים מחו\"ל יצר סביב Harajuku סביבה שונה מאוד משכונות אחרות בטוקיו. אחרי אולימפיאדת 1964 ופתיחת האזור מחדש לציבור, צעירים החלו להגיע לכאן בסופי שבוע. בשנות ה־70 הופיעה תרבות ה־Takenoko-zoku — קבוצות צעירים בלבוש צבעוני שרקדו ברחובות — ובהמשך התפתחו סגנונות כמו Lolita, visual kei, decora וגרסאות שונות של kawaii. Takeshita Street הפכה לגרסה המסחרית והמרוכזת של התהליך הזה: חנויות בגדים זולות, purikura, קרפים, אביזרים, מוזיקה וטרנדים שמתחלפים במהירות. בשנות ה־90 מגזינים יפניים צילמו צעירים ברחובות Harajuku והפיצו את המראה שלהם ברחבי המדינה, ומאוחר יותר האינטרנט הפך את האזור למותג עולמי. כשעוברים ברחוב היום, קל לראות רק את הצפיפות והמתוקים, אבל מאחוריהם יש סיפור של תת־תרבות שנולדה מהרחוב, צברה כוח מסחרי, ולבסוף הפכה לאחד הייצואים התרבותיים המוכרים ביותר של יפן.","infoSource":"https://www.gotokyo.org/en/spot/48/index.html"},{"uid":"2026-11-26-4","part":"צהריים","time":"13:20–13:55","start":800,"end":835,"name":"ALPAKA Harajuku Harakado","kind":"חובה · חנות","desc":"חנות ALPAKA ב־2F של Tokyu Plaza Harajuku “Harakado”. תיקים, EDC ואביזרי נשיאה. שעות פתיחה: 11:00–21:00.","maps":"https://www.google.com/maps/search/?api=1&query=ALPAKA+Tokyu+Plaza+Harajuku+Harakado+Tokyo","website":"https://www.alpakagear.jp/","hop":"הליכה 0.2 ק״מ","transit":false},{"uid":"2026-11-26-5","part":"צהריים","time":"14:00–14:45","start":840,"end":885,"name":"Omotesando","kind":"אטרקציה","desc":"שדרה אלגנטית עם אדריכלות, חנויות דגל ובתי קפה.","maps":"https://www.google.com/maps/search/?api=1&query=Omotesando+Japan","website":"","hop":"הליכה 0.6 ק״מ","transit":false,"info":"Omotesandō פירושו 'דרך הגישה הקדמית', והשם שלה מזכיר שהשדרה נוצרה בראש ובראשונה כדרך הטקסית המובילה אל Meiji Jingu, שנחנך ב־1920. עצי ה־zelkova שלאורך הרחוב והפנסים המסורתיים עדיין משמרים משהו מהתפקיד המקורי הזה. אחרי מלחמת העולם השנייה השתנה האזור במהירות: סמוך ל־Harajuku הוקם Washington Heights עבור הצבא האמריקאי, והנוכחות האמריקאית הכניסה לאזור השפעות של אופנה, מוזיקה וסגנון חיים מערבי. לקראת אולימפיאדת טוקיו 1964, כאשר Washington Heights פונה וחלק מהשטח הפך לכפר האולימפי, Harajuku ו־Omotesando הפכו לחשופים עוד יותר לתיירים, ספורטאים ותרבות בינלאומית. משנות ה־70 וה־80 החלו מותגים ובתי אופנה להשתמש בשדרה כבמת תצוגה, ובהמשך הגיעו אדריכלים מהבולטים בעולם: Tadao Ando תכנן את Omotesando Hills, Herzog & de Meuron את Prada Aoyama, ואחרים יצרו חזיתות שהפכו את הרחוב למעין מוזיאון אדריכלות פתוח. לכן Omotesando מעניינת דווקא בגלל הסתירה שלה: שדרה שנולדה כדרך למקדש לזכר קיסר Meiji הפכה בתוך מאה שנה לאחד המרכזים הבולטים של אופנה, אדריכלות וגלובליזציה ביפן.","infoSource":"https://www.gotokyo.org/en/destinations/western-tokyo/aoyama-and-omotesando/index.html"},{"uid":"2026-11-26-6","part":"צהריים","time":"14:50–15:35","start":890,"end":935,"name":"Cat Street","kind":"אטרקציה","desc":"רחוב אופנתי בין שיבויה להראג'וקו עם בוטיקים, קפה וחנויות מיוחדות.","maps":"https://www.google.com/maps/search/?api=1&query=Cat+Street+Japan","website":"","hop":"הליכה 1.2 ק״מ","transit":false,"info":"Cat Street הוא אחד הרחובות שמספרים בצורה הטובה ביותר את השינוי של Harajuku משכונת מגורים שקטה לאזור המזוהה בעולם עם אופנת רחוב. בניגוד ל־Takeshita Street, שהפכה צפופה, צבעונית ומסחרית מאוד, Cat Street התפתחה כציר צדדי בין Harajuku לשיבויה והפכה עם השנים למקום שבו חנויות עצמאיות, מותגי streetwear, בתי קפה ובוטיקים קטנים יכלו להתקיים מחוץ לשדרה הראשית. בשנות ה־80 וה־90, כאשר מגזיני אופנה יפניים התחילו לתעד צעירים ברחובות Harajuku ולא רק דגמים באולפנים, רחובות הצד באזור קיבלו חשיבות תרבותית: הם היו המקום שבו סגנונות נולדו, נצפו, צולמו והועתקו. Cat Street משקפת את המעבר הזה מתרבות צעירה ספונטנית לתעשיית אופנה שלמה, אבל עדיין נשאר בה משהו פחות רשמי מהחנויות הגדולות של Omotesando. כשעוברים בה, כדאי לראות את הרחוב עצמו כארכיון חי של אופנת Tokyo street: מבנים נמוכים, חללים שהוסבו שוב ושוב, חנויות קטנות ליד מותגים גלובליים, ומעבר הדרגתי מאוד מהאווירה של Harajuku אל Shibuya. זה אינו אתר עם 'אירוע היסטורי אחד', אלא מקום שבו תהליך תרבותי של כמה עשורים התרחש ממש ברחוב.","infoSource":"https://www.gotokyo.org/en/destinations/western-tokyo/harajuku/index.html"},{"uid":"2026-11-26-7","part":"שקיעה + ערב","time":"16:00–17:15","start":960,"end":1035,"name":"Shibuya Sky","kind":"אטרקציה","desc":"תצפית פתוחה מעל שיבויה עם נוף 360° של טוקיו. הכי יפה לקראת שקיעה.","maps":"https://www.google.com/maps/search/?api=1&query=Shibuya+Sky+Japan","website":"","hop":"הליכה 0.8 ק״מ","transit":false,"info":"SHIBUYA SKY הוא אתר צעיר מאוד, אבל הוא יושב על אחד מסיפורי ההתחדשות העירונית הגדולים בטוקיו. במשך עשרות שנים Shibuya הייתה מזוהה עם תחנת רכבת מסובכת, בתי כלבו של Tokyu, אופנת רחוב ותרבות צעירה; בתחילת המאה ה־21 החלה סדרת פרויקטים עצומה שנועדה לבנות מחדש את סביבת התחנה ולחבר טוב יותר את כל מפלסי הרכבות, הכבישים והולכי הרגל. Shibuya Scramble Square, שנפתח ב־2019, היה אחד הסמלים הבולטים של המהלך הזה. בגובה של כ־230 מטר הוא היה בעת פתיחתו הבניין הגבוה ביותר באזור Shibuya, ועל הגג נבנתה SHIBUYA SKY כתצפית פתוחה בגובה של כ־229 מטר. מה שהופך את המקום למעניין הוא לא רק הנוף אלא האפשרות לראות מלמעלה את ההיסטוריה העירונית של שיבויה: הצומת המפורסם נמצא ממש מתחת, תחנת Shibuya מתפצלת לכל הכיוונים, Meiji Jingu ו־Yoyogi נראים כאי ירוק בתוך העיר, וגורדי השחקים של Shinjuku מסמנים מרכז עירוני אחר במרחק קצר. בשקיעה אפשר ממש לראות את טוקיו מחליפה זהות: עיר של כבישים ומבנים הופכת בהדרגה למשטח של אור. במובן הזה SHIBUYA SKY היא תצפית על תהליך — שיבויה שכבר איננה רק בירת אופנת הנוער של שנות ה־80 וה־90, אלא רובע שמנסה להפוך למרכז עסקי וטכנולוגי של המאה ה־21.","infoSource":"https://www.shibuya-scramble-square.com/en/"},{"uid":"2026-11-26-8","part":"שקיעה + ערב","time":"17:25–19:00","start":1045,"end":1140,"name":"Shibuya PARCO — Nintendo, Pokémon, CAPCOM, JUMP, JoJo & SEGA","kind":"חנות","desc":"מרכז גיימינג ותרבות פופ מרוכז ב־6F של Shibuya PARCO. באותה קומה נמצאים Nintendo TOKYO, Pokémon Center Shibuya, CAPCOM STORE TOKYO, JUMP SHOP, THE","maps":"https://www.google.com/maps/search/?api=1&query=Shibuya+PARCO+Tokyo+Japan","website":"","hop":"הליכה 0.6 ק״מ","transit":false},{"uid":"2026-11-26-9","part":"שקיעה + ערב","time":"19:05–20:00","start":1145,"end":1200,"name":"Shunju Shibuya Bunkamuradori","kind":"מסעדה / אוכל","desc":"מסעדה שמתאימה טוב לזוג עם העדפות שונות: יש אפשרויות רגילות לאוכל כללי ובמקביל אפשרות טבעונית/צמחונית שמוצהר עליה ללא fish stock.","maps":"https://www.google.com/maps/search/?api=1&query=Shunju+Shibuya+Bunkamuradori+Tokyo","website":"","hop":"הליכה 0.3 ק״מ","transit":false}],"night":[{"name":"Shibuya Crossing","desc":"מעבר החציה האייקוני של שיבויה, מוקף במסכי ענק ומרכזי קניות.","maps":"https://www.google.com/maps/search/?api=1&query=Shibuya+Crossing+Japan"},{"name":"MEGA Don Quijote","desc":"חנות ענקית עם אוכל, קוסמטיקה, גאדג'טים, מתנות ודברים יפניים מוזרים.","maps":"https://www.google.com/maps/search/?api=1&query=MEGA+Don+Quijote+Japan"}]},{"id":"2026-11-27","date":"27/11","dow":"שישי","title":"Shinjuku","subtitle":"גן ביום, תצפית בשקיעה, לילה + קניות Ikebukuro","base":"טוקיו","scope":["טוקיו"],"empty":false,"items":[{"uid":"2026-11-27-0","part":"בוקר","time":"09:00–11:00","start":540,"end":660,"name":"Shinjuku Gyoen","kind":"אטרקציה","desc":"גן ענק עם גנים יפניים, מדשאות ועצי שלכת. אחד המקומות היפים בסתיו.","maps":"https://www.google.com/maps/search/?api=1&query=Shinjuku+Gyoen+Japan","website":"","hop":"הליכה 1.2 ק״מ","transit":false,"info":"ההיסטוריה של Shinjuku Gyoen מתחילה ב־1590, כאשר Tokugawa Ieyasu העניק שטח עצום באזור ל־Naitō Kiyonari, אחד מאנשיו. משפחת Naitō בנתה כאן אחוזת פרברים וגן, וב־1772 נפתח Tamagawa-en, גן שניזון מעודפי המים של אמת Tamagawa. אחרי רסטורציית Meiji רכשה הממשלה את השטח, וב־1872 הקימה בו תחנת ניסויים חקלאית שנועדה לקדם חקלאות מודרנית: גידלו כאן אלפי זני פירות וירקות, ערכו ניסויים בגידול תולעי משי ובקר, ובהמשך נבנו חממות מודרניות. ב־1879 עבר האתר לבית הקיסרי והפך לגן בוטני קיסרי. בתחילת המאה ה־20 ביקש Fukuba Hayato, איש מפתח בהיסטוריה של הגננות היפנית, מהאדריכל והגנן הצרפתי Henri Martinet לתכנן את הגן מחדש; ב־1906 הושלם הבסיס למראה הנוכחי, שילוב של גן יפני, גן צרפתי פורמלי וגן נוף אנגלי. הגן שימש אירועים קיסריים, וב־1927 הוקם בו Kyu-Goryo-Tei לציון נישואיו של יורש העצר Hirohito. בהפצצות 1945 כמעט כל הגן נשרף, מלבד כמה מבנים, והוא נפתח לציבור כגן לאומי ב־1949. ב־1989 נערכו בו טקסי ההלוויה הממלכתיים של הקיסר Shōwa. לכן כשמטיילים בין שלושת סגנונות הגן, למעשה עוברים דרך ארבע תקופות: Edo הפיאודלית, Meiji המודרנית, יפן הקיסרית ויפן הדמוקרטית שלאחר המלחמה.","infoSource":"https://policies.env.go.jp/national-garden/shinjukugyoen/english/intro/history/"},{"uid":"2026-11-27-1","part":"בוקר","time":"11:15–11:30","start":675,"end":690,"name":"3D Cat Billboard","kind":"אטרקציה","desc":"מסך תלת-ממדי מפורסם עם חתול ענק ליד תחנת שינג'וקו.","maps":"https://www.google.com/maps/search/?api=1&query=3D+Cat+Billboard+Japan","website":"","hop":"הליכה 0.5 ק״מ","transit":false,"info":"ה־3D Cat של שינג'וקו הוא דוגמה לאתר שנולד כמעט בן־לילה והפך לחלק מהזהות של העיר. ביולי 2021 הופיע החתול על Cross Shinjuku Vision, מסך LED ענק ופינתי מול היציאה המזרחית של Shinjuku Station. האפקט אינו הולוגרמה אלא אנימציה אנמורפית: התמונה מתוכננת לזווית צפייה מסוימת, והקיר הפינתי הופך בעין למעין קופסה עמוקה שבה החתול ישן, קם, מיילל ומתקרב לשפה. בתוך ימים הסרטונים שלו התפשטו בעולם, בתקופה שבה יפן עדיין הייתה כמעט סגורה לתיירים בגלל מגפת הקורונה. לכן החתול הפך לסמל מוזר של טוקיו דווקא בזמן שרוב העולם לא יכול היה להגיע אליה. הוא גם מראה שינוי מעניין בתרבות הפרסום היפנית: במקום שלט שמנסה רק למכור מוצר, המסך עצמו הפך לבידור עירוני ולדמות שהציבור מחפש. זהו אתר ללא 'היסטוריה עתיקה', אבל יש לו סיפור מאוד טוקיואי — טכנולוגיית פרסום שהפכה בתוך כמה שבועות לאטרקציה תיירותית ולחלק מהנוף התרבותי של Shinjuku.","infoSource":"https://shinjuku.xspace.tokyo/en/"},{"uid":"2026-11-27-2","part":"בוקר","time":"11:40–12:00","start":700,"end":720,"name":"Godzilla Head","kind":"אטרקציה","desc":"ראש גודזילה ענק על מלון Gracery באזור Kabukicho.","maps":"https://www.google.com/maps/search/?api=1&query=Godzilla+Head+Japan","website":"","hop":"הליכה 0.3 ק״מ","transit":false,"info":"Godzilla Head הוצב ב־2015 על Shinjuku Toho Building, שנבנה על האתר שבו עמד במשך שנים Shinjuku Koma Theater. הראש נמצא בערך 50 מטר מעל הרחוב — בכוונה בגובה של Godzilla בסרט המקורי מ־1954 — ולכן הוא נראה כאילו המפלצת באמת מציצה מעל Kabukicho. אבל כדי להבין למה זה יותר מגימיק צריך לחזור ל־1954: Godzilla נוצר בידי אולפני Toho פחות מעשור אחרי הירושימה ונגסאקי ובאותה שנה שבה תקרית ספינת הדיג Lucky Dragon No. 5 עוררה מחדש ביפן פחד מקרינה גרעינית. הסרט הראשון הפך את המפלצת לדימוי של הרס, נשק אטומי וחרדה מטכנולוגיה בלתי נשלטת. עם השנים Godzilla השתנה מאיום טראומטי גם לגיבור תרבות פופ, אך נשאר אחד היצורים המזוהים ביותר עם הקולנוע היפני. כאשר בניין Toho החדש נפתח ב־2015, עיריית Shinjuku העניקה ל־Godzilla 'תעודת תושב' ומינתה אותו לשגריר תיירות של השכונה. הרחוב המוביל לבניין קיבל ב־2016 את השם Godzilla Road. כך דמות שהרסה את טוקיו שוב ושוב על המסך הפכה רשמית לתושבת העיר ולכלי לקידום התיירות שלה.","infoSource":"https://www.toho.co.jp/en/our-moments/2026/09/2.html"},{"uid":"2026-11-27-3","part":"צהריים","time":"13:25–14:30","start":805,"end":870,"name":"הפסקת צהריים /","kind":"מעבר","desc":"","maps":"","website":"","hop":"","transit":true},{"uid":"2026-11-27-4","part":"שקיעה + ערב","time":"15:30–16:30","start":930,"end":990,"name":"Tokyo Metropolitan Government Observatory","kind":"אטרקציה","desc":"תצפית חינמית מגובה רב על טוקיו.","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+Metropolitan+Government+Observatory+Japan","website":"","hop":"הליכה 1.1 ק״מ","transit":false,"info":"Tokyo Metropolitan Government Building הוא הרבה יותר מתצפית חינמית. הבניין הושלם במרץ 1991, לאחר שהבנייה החלה ב־1988, והוא תוכנן בידי Kenzo Tange — האדריכל היפני שתכנן גם את Yoyogi National Gymnasium לאולימפיאדת 1964 והיה מהדמויות החשובות באדריכלות המודרנית ביפן. הבניין הראשי מגיע לגובה 243 מטר, וכשהושלם היה הגבוה ביפן. זה חשוב משום שהוא נבנה ממש בשיא תקופת 'כלכלת הבועה', כאשר מחירי הקרקע והאמונה בצמיחה היפנית הגיעו לשיא; קנה המידה והצורה הכמעט־קתדרלית שלו משקפים את הביטחון של אותה תקופה. זמן קצר לאחר פתיחתו התפוצצה הבועה הכלכלית, ולכן המבנה הפך בדיעבד גם לאנדרטה לאופטימיות של סוף שנות ה־80. הקומות ה־45, בגובה כ־202 מטר, נפתחו לתצפית על העיר. עוד פרט תרבותי משעשע: הבניין הופיע כמעט מיד בקולנוע היפני ונפגע ב־Godzilla vs. King Ghidorah מ־1991, כאילו טוקיו לא הספיקה אפילו להתרגל אליו לפני שהקולנוע כבר הרס אותו. מהתצפית כדאי לראות את מערב Shinjuku כמכלול — אזור גורדי השחקים שהחל להתפתח בשנות ה־70 והפך לסמל של טוקיו העסקית.","infoSource":"https://www.locationbox.metro.tokyo.lg.jp/english/locatabi_eng/list/530/"},{"uid":"2026-11-27-5","part":"שקיעה + ערב","time":"16:40–17:10","start":1000,"end":1030,"name":"נסיעה Shinjuku → Ikebukuro","kind":"מעבר","desc":"","maps":"","website":"","hop":"","transit":true},{"uid":"2026-11-27-6","part":"שקיעה + ערב","time":"17:20–18:10","start":1040,"end":1090,"name":"Bandai Namco Cross Store","kind":"חנות","desc":"מתחם עם מותגי Bandai Namco, משחקים, דמויות ומרצ׳נדייז.","maps":"https://www.google.com/maps/search/?api=1&query=Bandai+Namco+Cross+Store+Japan","website":"","hop":"הליכה 0.7 ק״מ","transit":false},{"uid":"2026-11-27-7","part":"שקיעה + ערב","time":"18:15–19:15","start":1095,"end":1155,"name":"Animate Ikebukuro","kind":"חנות","desc":"חנות ענקית לאנימה, מנגה ו-merchandise.","maps":"https://www.google.com/maps/search/?api=1&query=Animate+Ikebukuro+Japan","website":"","hop":"","transit":false}],"night":[{"name":"Tokyu Kabukicho Tower","desc":"מתחם בילוי עם אוכל, משחקים, אירועים וחיי לילה.","maps":"https://www.google.com/maps/search/?api=1&query=Tokyu+Kabukicho+Tower+Japan"},{"name":"Omoide Yokocho","desc":"סמטאות קטנות וצפופות עם יקיטורי ואווירת טוקיו ישנה.","maps":"https://www.google.com/maps/search/?api=1&query=Omoide+Yokocho+Japan"},{"name":"Golden Gai","desc":"אזור ברים זעירים וסמטאות לילה מפורסמות.","maps":"https://www.google.com/maps/search/?api=1&query=Golden+Gai+Japan"}]},{"id":"2026-11-28","date":"28/11","dow":"שבת","title":"Asakusa → Ueno · שני המוזיאונים","subtitle":"מקדשים, רחובות, מוזיאון ושוק","base":"טוקיו","scope":["טוקיו"],"empty":false,"items":[{"uid":"2026-11-28-0","part":"בוקר","time":"08:45–09:25","start":525,"end":565,"name":"Sumida River","kind":"אטרקציה","desc":"נהר סומידה עובר לצד Asakusa ונותן נקודות תצפית יפות לכיוון Skytree ו-Asahi Beer Hall. מתאים להליכה קצרה או שיט.","maps":"https://www.google.com/maps/search/?api=1&query=Sumida+River+Japan","website":"","hop":"הליכה 0.7 ק״מ","transit":false,"info":"Sumida River הוא אחד הצירים המרכזיים שעליהם נבנתה Edo, טוקיו שלפני 1868. בתקופה שבה כבישים יבשתיים היו איטיים וצפופים, נהרות ותעלות היו מערכת התחבורה של העיר: אורז, עץ, דגים, סחורות ואנשים נעו במים אל מרכז Edo. הנהר קשור גם לסיפור המיתי של Sensō-ji, משום שלפי המסורת פסל Kannon שעליו נוסד המקדש נמצא בו בשנת 628. אבל במהלך תקופת Edo ה־Sumida היה גם מרחב בילוי. לאורך גדותיו התפתחו בתי תה, אזורי hanami, שיט ופסטיבלים, והנהר מופיע שוב ושוב בהדפסי ukiyo-e של אמנים כמו Hiroshige. מסורת הזיקוקים של Sumida קשורה למאה ה־18: ב־1733 נערכו זיקוקים לאורך הנהר במסגרת טקסים לזכר קורבנות רעב ומגפות, ומכאן התפתחה מסורת קיץ מפורסמת. במאה ה־20 השתנה הנהר עם תיעוש, גשרים מודרניים ופרויקטים של בקרת הצפות, אך הוא נשאר ציר שמחבר בין Asakusa, המפרץ והעיר התחתונה. כשעומדים היום בטיילת ורואים את Tokyo Skytree, הגשרים ואת בנייני Asahi, הנוף נראה מודרני לחלוטין — אבל המים הם אותה תשתית שהפכה את Edo כבר במאה ה־18 לאחת הערים הגדולות בעולם.","infoSource":"https://www.gotokyo.org/en/see-and-do/nature/waterfront/history-by-the-water.html"},{"uid":"2026-11-28-1","part":"בוקר","time":"09:30–09:45","start":570,"end":585,"name":"Kaminarimon","kind":"אטרקציה","desc":"שער הרעם האייקוני בכניסה ל-Senso-ji.","maps":"https://www.google.com/maps/search/?api=1&query=Kaminarimon+Japan","website":"","hop":"הליכה 0.5 ק״מ","transit":false,"info":"Kaminarimon, 'שער הרעם', הוא הכניסה המזוהה ביותר עם Sensō-ji, אבל השער שאנחנו רואים היום הוא רק הפרק האחרון בסדרה ארוכה של בנייה, שריפות ושיקום. לפי מסורת Sensō-ji, השער הראשון הוקם בשנת 942 בידי המפקד Taira no Kinmasa. בשני צדדיו הוצבו Fūjin, אל הרוח, ו־Raijin, אל הרעם, שנועדו להגן על המקדש מפני אסונות טבע. במהלך מאות השנים השער נשרף ונבנה שוב ושוב. השריפה הגדולה האחרונה התרחשה ב־1865, ומאותו רגע נשארה הכניסה ללא השער המפורסם במשך כמעט מאה שנה. רק ב־1960 נבנה Kaminarimon מחדש במימון Konosuke Matsushita, מייסד Matsushita Electric — החברה שנודעה מאוחר יותר כ־Panasonic. לפי הסיפור שמספר המקדש, Matsushita סבל מבעיה רפואית, התפלל ב־Sensō-ji וכאשר מצבו השתפר החליט לממן את השיקום. הפנס האדום העצום במרכז השער הפך מאז לאחד הסמלים המצולמים ביותר של יפן. לכן מה שנראה כמו 'שער מסורתי עתיק' הוא למעשה מבנה מודרני יחסית שממשיך מסורת בת יותר מאלף שנה, וגם מספר סיפור מאוד יפני של שיקום אחרי אסון: ההמשכיות של האתר חשובה יותר מכך שכל חומר פיזי יהיה מקורי.","infoSource":"https://www.senso-ji.jp/english/"},{"uid":"2026-11-28-2","part":"בוקר","time":"09:45–10:55","start":585,"end":655,"name":"Senso-ji","kind":"אטרקציה","desc":"המקדש הבודהיסטי המפורסם באסאקוסה, עם שערים מרשימים ואווירה מסורתית.","maps":"https://www.google.com/maps/search/?api=1&query=Senso-ji+Japan","website":"","hop":"הליכה 0.4 ק״מ","transit":false,"info":"Sensō-ji הוא המקדש הבודהיסטי העתיק ביותר בטוקיו, והסיפור שלו מתחיל לפי המסורת בשנת 628. שני אחים דייגים, Hinokuma Hamanari ו־Takenari, משו מן Sumida River פסל קטן של Kannon, בודהיסטווה של החמלה. ראש הכפר Haji no Nakatomo זיהה את הדמות, הפך את ביתו למקום תפילה, וב־645 בנה הנזיר Shōkai אולם מסודר. לפי מסורת המקדש, Shōkai קיבל בחלום הוראה להסתיר את הפסל, ולכן הדמות המרכזית של Sensō-ji מוגדרת עד היום hibutsu — 'בודהה נסתר' שאינו מוצג לציבור. בתקופת Edo הפך Sensō-ji למוקד עלייה לרגל עצום. המוני מבקרים יצרו סביבו שוק, דוכני מזון, בידור, תיאטרון ומסחר, ולכן המקדש לא רק שרד בתוך Asakusa אלא עזר ממש ליצור את השכונה. גם הקשר לשוגונות חשוב: Tokugawa Ieyasu והשליטים שאחריו ראו במקדש אתר בעל מעמד מרכזי, ותרמו לשיקום מבנים. ההיסטוריה הפיזית של Sensō-ji מלאה באסונות — רעידות אדמה, שריפות ומלחמה. האולם המרכזי והפגודה נחרבו בהפצצות טוקיו ב־10 במרץ 1945 ונבנו מחדש לאחר המלחמה בעזרת תרומות של מאמינים. הפגודה הנוכחית הושלמה ב־1973 ואף כוללת שרידים בודהיסטיים שהוענקו מסרי לנקה. לכן כשעומדים במתחם היום, חשוב להבין שהמסורת היא בת כמעט 1,400 שנה, גם אם חלק מהעץ והבטון סביבנו חדש הרבה יותר.","infoSource":"https://www.senso-ji.jp/english/"},{"uid":"2026-11-28-3","part":"בוקר","time":"11:00–11:45","start":660,"end":705,"name":"Nakamise Street","kind":"אטרקציה","desc":"רחוב קניות מסורתי בין Kaminarimon ל-Senso-ji, עם מזכרות וממתקים.","maps":"https://www.google.com/maps/search/?api=1&query=Nakamise+Street+Japan","website":"","hop":"הליכה 0.8 ק״מ","transit":false,"info":"Nakamise הוא לא סתם רחוב מזכרות בדרך ל־Sensō-ji; הוא תוצאה ישירה של מאות שנות עלייה לרגל למקדש. לפי ההיסטוריה הרשמית של הרחוב, בין 1688 ל־1735 קיבלו תושבים שסייעו בשירותי Sensō-ji זכות מיוחדת להפעיל דוכנים לאורך דרך הגישה. כך נוצר מודל שבו המקדש משך קהל, והקהל יצר כלכלה של תה, ממתקים, צעצועים, חפצי פולחן ומזכרות. בתקופת Edo היו כאן אזורים של בתי תה וחנויות קטנות, והרחוב נחשב לאחד ממרכזי המסחר המסודרים של עיירת־המקדש. רסטורציית Meiji שינתה הכול: הממשלה החדשה החרימה חלק מקרקעות המקדשים וב־1885 הורתה לסוחרי Nakamise לעזוב; באותה שנה נבנו במקומם חנויות לבנים בסגנון מערבי, סמל מובהק של המודרניזציה החדשה. גם המבנים האלה לא שרדו — הם נהרסו ברעידת Kantō של 1923, ונבנו מחדש ב־1925 מבטון מזוין עם חזיתות אדומות בסגנון מסורתי. בפצצות 1945 נשרפו פנים החנויות, ושוב בעלי העסקים המקומיים שיקמו את הרחוב. לכן Nakamise של היום אינו רצף של חנויות בנות 300 שנה, אלא מסורת מסחרית בת מאות שנים ששרדה שינויי משטר, רעידת אדמה ומלחמה באמצעות בנייה מחדש שוב ושוב.","infoSource":"https://www.asakusa-nakamise.jp/e-history.html"},{"uid":"2026-11-28-4","part":"בוקר","time":"11:50–12:40","start":710,"end":760,"name":"Hat Coffee / 3D Foam Art","kind":"מסעדה / אוכל","desc":"קפה באסאקוסה עם קצף תלת-ממדי בעיצובים מיוחדים.","maps":"https://www.google.com/maps/search/?api=1&query=Hat+Coffee+%2F+3D+Foam+Art+Japan","website":"","hop":"הליכה 0.9 ק״מ","transit":false},{"uid":"2026-11-28-5","part":"צהריים","time":"12:50–14:05","start":770,"end":845,"name":"Kappabashi Street","kind":"אטרקציה","desc":"רחוב כלי המטבח של טוקיו: סכינים, כלי קרמיקה ודגמי אוכל מפלסטיק.","maps":"https://www.google.com/maps/search/?api=1&query=Kappabashi+Street+Japan","website":"","hop":"","transit":false,"info":"Kappabashi Dougu Street מספר את ההיסטוריה של טוקיו דרך הכלים שמאחורי המסעדה. לפי אגודת הרחוב הרשמית, סוחרים החלו להתרכז באזור סביב 1912, בתחילת תקופת Taishō, ומכרו כלים ישנים, חומרה וציוד שימושי. עם הגידול העצום של טוקיו ותרבות האוכל העירונית, האזור התפתח בהדרגה למרכז מקצועי של מסעדנים: סכינים, כלי חרס, lacquerware, תנורים, מקררים, שלטים, noren, תבניות, בגדי טבחים, אריזות וכל פרט קטן שמאפשר למסעדה לפעול. אחת התעשיות המזוהות עם Kappabashi היא shokuhin sampuru — דגמי מזון מלאכותיים שנוצרו ביפן במאה ה־20 והפכו לכלי שיווק כמעט בכל מסעדה. גם שם הרחוב עטוף באגדה. לפי אחת הגרסאות, השם קשור ל־kappa — יצורי מים מיתולוגיים — שלכאורה עזרו לסוחר בשם Kihachi לחפור תעלות ניקוז באזור בתחילת המאה ה־19; גרסה אחרת קושרת אותו למעילי גשם, kappa, שיובשו על גשר סמוך. האזור עצמו סבל מהצפות, כולל השיטפון הגדול של 1910, ולכן סיפורי המים אינם מקריים. כשמסתובבים כאן, רואים למעשה תשתית של תרבות האוכל היפנית — לא את המנה על השולחן, אלא את כל המערכת המקצועית שמאפשרת לה להתקיים.","infoSource":"https://www.gotokyo.org/en/destinations/eastern-tokyo/asakusa/"},{"uid":"2026-11-28-6","part":"צהריים","time":"14:05–14:25","start":845,"end":865,"name":"נסיעה / הליכה ל-Ueno","kind":"מעבר","desc":"","maps":"","website":"","hop":"","transit":true},{"uid":"2026-11-28-7","part":"אחה״צ","time":"14:25–14:50","start":865,"end":890,"name":"Ueno Park","kind":"אטרקציה","desc":"פארק אואנו — מעבר ירוק ונעים בין מתחמי התרבות והמוזיאונים.","maps":"https://www.google.com/maps/search/?api=1&query=Ueno+Park+Tokyo","website":"","hop":"הליכה 0.4 ק״מ","transit":false,"info":"Ueno Park יושב על קרקע שהייתה פעם חלק מאחד המתחמים הדתיים והפוליטיים החשובים של Edo. במאה ה־17 הקימה שוגונות Tokugawa כאן את Kan'ei-ji, מקדש גדול שנועד להגן רוחנית על העיר מצפון־מזרח, כיוון שנחשב מסוכן במסורת היפנית. המקדש היה קשור ישירות למשפחת Tokugawa, וחלק מהשוגונים אף נקברו בו. ב־1868, כאשר שלטון Tokugawa קרס, התחולל באזור Battle of Ueno בין לוחמי shōgitai שנשארו נאמנים לשוגון לבין כוחות ממשלת Meiji. הקרב והאש הרסו חלק גדול מ־Kan'ei-ji. במקום לשקם את המתחם בממדיו הישנים, ממשלת Meiji הפכה את השטח לאחד הפארקים הציבוריים הראשונים ביפן ב־1873. זו הייתה החלטה אידאולוגית כמעט: קרקע דתית־פיאודלית הפכה למרחב ציבורי של המדינה החדשה. בהמשך נבנו כאן מוזיאונים, גן חיות, מוסדות אמנות ותערוכות לאומיות, וב־1924 הקיסר Taishō העביר רשמית את הפארק לעיר — מכאן השם Ueno Onshi Park, 'הפארק הקיסרי שהוענק'. לכן יום המוזיאונים שלנו עובר למעשה בשטח שמספר את המעבר משוגונות, דרך מלחמת אזרחים, למדינת Meiji שמקדשת חינוך, מדע ותרבות ציבורית.","infoSource":"https://www.gotokyo.org/en/destinations/northern-tokyo/ueno/index.html"},{"uid":"2026-11-28-8","part":"אחה״צ","time":"14:55–15:55","start":895,"end":955,"name":"Tokyo National Museum","kind":"אטרקציה","desc":"המוזיאון המרכזי לאמנות, עתיקות והיסטוריה חומרית של יפן. ביקור ממוקד של כשעה כדי לראות Highlights בלי להפוך את היום ליום מוזיאונים בלבד.","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+National+Museum+Ueno","website":"https://www.tnm.jp/?lang=en","hop":"הליכה 0.6 ק״מ","transit":false,"info":"Tokyo National Museum הוא המוזיאון העתיק ביותר ביפן מסוגו, וההיסטוריה שלו קשורה ישירות לפרויקט המודרניזציה של Meiji. בשנת 1872 ארגן משרד החינוך תערוכה ב־Yushima Seidō; האירוע נחשב ללידת המוזיאון. המטרה הראשונית הייתה רחבה מאוד — לא רק אמנות, אלא גם טבע, תעשייה, ספרייה ואפילו גן חיות — משום שממשלת Meiji ראתה במוזיאון כלי לחינוך הציבור ולהצגת יפן כמדינה מודרנית. ב־1882 עבר המוסד ל־Ueno, על שטח שהיה קודם חלק מ־Kan'ei-ji ונפגע ב־Boshin War. הבניין הראשי הראשון תוכנן בידי האדריכל הבריטי Josiah Conder ונחנך בנוכחות הקיסר Meiji. רעידת Kantō של 1923 פגעה קשות במתחם, וב־1938 נפתח Honkan החדש שאנחנו רואים כיום, בסגנון שמחבר מבנה מודרני עם גג בהשראה יפנית. במהלך המלחמה פונו חלק מהאוצרות כדי להגן עליהם. אחרי 1945 קיבל המוסד את שמו הנוכחי והמשיך להרחיב את האוסף. היום הוא מחזיק National Treasures רבים, פסלים בודהיסטיים, קליגרפיה, קרמיקה, שריון, חרבות וטקסטיל. המוזיאון עצמו הוא לכן חלק מהסיפור שהוא מספר: מקום שבו יפן המודרנית החליטה מה מתוך עברה צריך להיאסף, להישמר ולהפוך ל'מורשת לאומית'.","infoSource":"https://www.tnm.jp/modules/r_free_page/index.php?id=155&lang=en"},{"uid":"2026-11-28-9","part":"אחה״צ","time":"16:00–16:55","start":960,"end":1015,"name":"National Museum of Nature and Science","kind":"אטרקציה","desc":"מוזיאון מדע וטבע גדול באואנו. נשאר במסלול; הביקור מתקצר מעט כדי לאפשר גם את Tokyo National Museum.","maps":"https://www.google.com/maps/search/?api=1&query=National+Museum+of+Nature+and+Science+Tokyo","website":"","hop":"הליכה 1.0 ק״מ","transit":false,"info":"National Museum of Nature and Science נולד כחלק מהמאמץ של יפן בתקופת Meiji ללמוד, למיין ולהציג ידע מדעי באופן מודרני. כבר ב־1871 הוקם ב־Yushima Seidō חלל תצוגה של משרד החינוך, וב־1872 נערכה שם תערוכה ציבורית. בשנת 1877 הוקם ב־Ueno מוסד שנחשב רשמית לנקודת ההתחלה של המוזיאון. הוא עבר שינויים ושמות רבים, אבל המטרה נשארה דומה: לבנות ביפן מוסד לאומי שמחבר טבע, מדע, טכנולוגיה וחינוך. רעידת Kantō של 1923 הייתה קטסטרופה למוזיאון — המבנים והדגימות נפגעו קשות — ובעקבותיה נבנה ב־1931 בניין חדש ב־Ueno, Japan Gallery של היום. המבנה עצמו הפך מאוחר יותר ל־Important Cultural Property. אחרי המלחמה התרחבו המחקר והאוספים, וב־2006–2007 אורגנו התצוגות מחדש ל־Japan Gallery ו־Global Gallery. המוזיאון חשוב משום שהוא מספר לא רק על דינוזאורים או בעלי חיים אלא גם על ההיסטוריה של המדע היפני: כיצד מדינת Meiji אימצה שיטות מחקר מערביות, כיצד יפן בנתה תעשייה וטכנולוגיה, וכיצד חוקרים מקומיים חקרו את הארכיפלג. ביום שלנו כדאי להתרכז ב־Japan Gallery, משום שהיא נותנת הקשר מקומי לטבע, לאנשים ולתעשייה של יפן ולא רק עוד מוזיאון מדע כללי.","infoSource":"https://www.kahaku.go.jp/english/"},{"uid":"2026-11-28-10","part":"ערב","time":"17:05–18:00","start":1025,"end":1080,"name":"Ameyoko Market","kind":"אטרקציה","desc":"רחוב שוק צפוף ותוסס ליד Ueno עם אוכל, חנויות ואווירת ערב.","maps":"https://www.google.com/maps/search/?api=1&query=Ameyoko+Market+Tokyo","website":"","hop":"","transit":false,"info":"Ameyoko הוא אחד המקומות שבהם אפשר עדיין להרגיש משהו מטוקיו של השנים הראשונות אחרי 1945. האזור הצפוף בין Ueno ל־Okachimachi הפך לאחר המלחמה לשוק שחור שבו אנשים ניסו להשיג מזון, ביגוד ומוצרים שלא היו זמינים דרך מערכת הקיצוב. מקור השם עצמו משקף את התקופה: לפי הסבר אחד ame מגיע מ־ameya, מוכרי ממתקים, משום שבאזור נמכרו כמויות גדולות של sweets; לפי הסבר אחר הוא קוצר מ־America, משום שמוצרים אמריקאיים וצבאיים הגיעו לשוק דרך ערוצים לא רשמיים. עם התאוששות הכלכלה עבר Ameyoko בהדרגה ממקום של הישרדות למרכז מסחר עממי וזול. כיום פועלות לאורך כחצי קילומטר מאות חנויות של דגים, תבלינים, בגדים, קוסמטיקה ומזון בינלאומי. מה שמעניין הוא שהאופי של השוק עדיין שונה מאוד מהסדר של בתי הכלבו היפניים: מוכרים קוראים בקול, שלטים נערמים, וסחורה נשפכת כמעט אל הרחוב. אחרי יום ב־Ueno Park ובמוזיאונים הלאומיים, המעבר ל־Ameyoko הוא כמעט מעבר בין שתי גרסאות של יפן שלאחר המלחמה — מצד אחד מדינה שבונה מוסדות, ומצד אחר אזרחים שבונים מחדש את הכלכלה מלמטה.","infoSource":"https://www.gotokyo.org/en/spot/71/"}],"night":[]},{"id":"2026-11-29","date":"29/11","dow":"ראשון","title":"Imperial Palace East Gardens → Akihabara","subtitle":"מקדש בבוקר, רטרו ביום, קניות בסוף","base":"טוקיו","scope":["טוקיו"],"empty":false,"items":[{"uid":"2026-11-29-0","part":"בוקר","time":"09:00–10:15","start":540,"end":615,"name":"Imperial Palace East Gardens","kind":"אטרקציה","desc":"הגנים המזרחיים של הארמון הקיסרי — שרידי Edo Castle, חומות, גנים ושבילים בלב טוקיו.","maps":"https://www.google.com/maps/search/?api=1&query=Imperial+Palace+East+Gardens+Tokyo","website":"https://www.kunaicho.go.jp/e-event/higashigyoen02.html","hop":"נסיעה קצרה / הליכה ל-Kanda","transit":false,"info":"Imperial Palace East Gardens יושבים על הלב של Edo Castle, המקום שממנו שלטה שוגונות Tokugawa ביפן במשך יותר מ־250 שנה. אחרי ש־Tokugawa Ieyasu קבע את בסיסו ב־Edo בסוף המאה ה־16, הורחבה הטירה בהדרגה למערכת עצומה של חפירים, שערים, חומות ומתחמים. Honmaru היה הליבה הפנימית, Ninomaru ו־Sannomaru הקיפו אותו, וכאן חיו ופעלו השוגון, משפחתו והמנגנון המנהלי. ה־tenshu, המגדל הראשי, היה מהגדולים ביפן, אך נשרף ב־1657 ב־Great Fire of Meireki ולא נבנה מחדש; בסיס האבן Tenshudai עדיין נמצא בגן. ב־1868, עם נפילת השוגונות, עבר הקיסר מקיוטו לטוקיו והטירה הפכה לארמון קיסרי. חלקים גדולים נהרסו בשריפות, רעידות אדמה ומלחמה, והארמון המודרני נבנה מחדש אחרי 1945. בשנת 1960 החליטה הממשלה להפוך את חלקי Honmaru, Ninomaru ו־Sannomaru לשטח ציבורי, וה־East Gardens נפתחו ב־1968. לכן זהו מקום שבו דווקא החסר חשוב: אין טירת samurai שלמה, אבל החומות, בתי השמירה, השערים והבסיס העצום מאפשרים להבין את קנה המידה של מרכז הכוח של Edo. כאשר רואים את Otemachi ומגדלי Marunouchi מעבר לחומות, רואים כיצד בירת השוגון הפכה למרכז שלטוני ופיננסי מודרני בלי לשנות את המרכז הגאוגרפי שלה.","infoSource":"https://www.kunaicho.go.jp/en/visit/event/higashigyoen/index.html"},{"uid":"2026-11-29-1","part":"בוקר","time":"10:15–10:40","start":615,"end":640,"name":"נסיעה / הליכה ל-Akihabara","kind":"נסיעה","desc":"מעבר מאזור הארמון ל-Kanda / Akihabara.","maps":"","website":"","hop":"","transit":true},{"uid":"2026-11-29-2","part":"בוקר","time":"10:40–11:20","start":640,"end":680,"name":"Kanda Myojin","kind":"אטרקציה","desc":"מקדש שינטו היסטורי המזוהה היום גם עם Akihabara ותרבות הטכנולוגיה.","maps":"https://www.google.com/maps/search/?api=1&query=Kanda+Myojin+Tokyo","website":"","hop":"הליכה 0.8 ק״מ","transit":false,"info":"Kanda Myojin הוא אחד האתרים שבהם ההיסטוריה הפיאודלית של טוקיו והתרבות הטכנולוגית של Akihabara מתחברות בצורה כמעט מושלמת. לפי מסורת המקדש הוא נוסד בשנת 730 באזור שנמצא כיום ליד Otemachi. במאה ה־14 נוסף לפולחן Taira no Masakado, לוחם ומורד מהמאה ה־10 שהפך לאחר מותו לדמות רוחנית עוצמתית ומעט מאיימת. סביב קברו של Masakado סופרו במשך דורות סיפורים על אסונות ומזל רע, וב־1309 הוא הונצח במקדש כדי להרגיע את רוחו. הפרק החשוב הבא מגיע בשנת 1600: לפני קרב Sekigahara, Tokugawa Ieyasu התפלל כאן לניצחון. הקרב שהכריע את מאבקי האיחוד התרחש ביום Kanda Matsuri, והניצחון הפך את המקדש לאתר בעל משמעות מיוחדת עבור שוגונות Tokugawa. לאחר הקמת Edo הוא הועבר למיקומו הנוכחי והפך למעין 'מקדש מגן' של העיר. גם הוא נהרס ונבנה מחדש כמה פעמים; המבנה הנוכחי נבנה מבטון מזוין ב־1934, דבר שעזר לו לשרוד את הפצצות המלחמה טוב יותר ממבני עץ רבים. במאה ה־21 נוצרה שכבה חדשה: בגלל הקרבה ל־Akihabara, חברות IT, יזמי טכנולוגיה וחובבי מחשבים מגיעים לבקש ברכה, והמקדש מוכר גם קמעות הקשורים לאבטחת מידע ומכשירים אלקטרוניים. זהו מקום שבו רוחו של מורד מהמאה ה־10 חיה כמה דקות מחנויות גיימינג.","infoSource":"https://www.kandamyoujin.or.jp/profile/"},{"uid":"2026-11-29-3","part":"בוקר","time":"11:30–12:15","start":690,"end":735,"name":"GiGO Arcades","kind":"אטרקציה","desc":"ארקיידים בלב Akihabara — crane games, rhythm games ומשחקי וידאו.","maps":"https://www.google.com/maps/search/?api=1&query=GiGO+Akihabara+Tokyo","website":"","hop":"הליכה 0.4 ק״מ","transit":false,"info":"הארקיידים של GiGO באקיהברה הם פרק חדש בסיפור הרבה יותר ארוך של משחקי הווידאו היפניים. במשך עשרות שנים שלטי SEGA היו חלק כמעט בלתי נפרד מהנוף של Akihabara. SEGA, שהחלה את דרכה בעסקי מכונות בידור ופעלה בעוצמה בעולם הארקייד, הייתה אחראית למכונות ומשחקים ששינו את התחום, מ־Out Run ו־Virtua Fighter ועד מערכות גדולות ואקספרימנטליות. בשנות ה־90 הארקייד היפני היה מקום שבו טכנולוגיה חדישה הגיעה לעיתים לציבור לפני הבית: גרפיקה תלת־ממדית, מכונות מרוצים, משחקי קצב ומערכות רשת. עם ירידת שוק הארקייד והשינויים בעסקי SEGA, פעילות מרכזי הבידור עברה ל־GENDA. בשנת 2022 הוכרז כי סניפי SEGA יעברו בהדרגה למותג GiGO, וגם Akihabara קיבלה את השלטים החדשים. מבחינה תרבותית זה היה רגע כמעט נוסטלגי: אחד הסמלים של 'Electric Town' נעלם, אבל החוויה עצמה נשארה. לכן כשנכנסים ל־GiGO, שווה לעלות מעבר לקומת crane games. בקומות של rhythm games, fighting games ומכונות ייחודיות עדיין מרגישים את המסורת של יפן כמדינה שבה הארקייד היה במשך עשרות שנים מעבדת משחקים, ספורט תחרותי ומקום מפגש חברתי.","infoSource":"https://www.gendagigo.jp/company_profile/history"},{"uid":"2026-11-29-4","part":"צהריים","time":"12:20–15:20","start":740,"end":920,"name":"Akihabara Retro Game Shopping — Surugaya, Trader, Super Potato, Sofmap, Jan-gle, Retro Game Camp & BOOKOFF","kind":"קניות","desc":"בלוק הקניות המרכזי לרטרו וגיימינג. קוצר מעט כדי לפנות מקום לגנים בבוקר.","maps":"https://www.google.com/maps/search/?api=1&query=Akihabara+Tokyo","website":"","hop":"הליכה 0.6 ק״מ","transit":false},{"uid":"2026-11-29-5","part":"אחה״צ","time":"15:25–16:25","start":925,"end":985,"name":"Mandarake Complex","kind":"חנות","desc":"קומפלקס רב-קומות של manga, anime, toys, collectibles ופריטי יד שנייה.","maps":"https://www.google.com/maps/search/?api=1&query=Mandarake+Complex+Akihabara","website":"","hop":"הליכה 0.8 ק״מ","transit":false},{"uid":"2026-11-29-6","part":"אחה״צ","time":"16:30–17:25","start":990,"end":1045,"name":"Radio Kaikan","kind":"חנות","desc":"בניין אייקוני של Akihabara עם חנויות figures, cards, hobby ו-collectibles.","maps":"https://www.google.com/maps/search/?api=1&query=Akihabara+Radio+Kaikan","website":"","hop":"הליכה 0.5 ק״מ","transit":false},{"uid":"2026-11-29-7","part":"ערב","time":"17:30–18:10","start":1050,"end":1090,"name":"Kotobukiya Akihabara","kind":"חנות","desc":"חנות דגל ל-figures, character goods ו-merchandise.","maps":"https://www.google.com/maps/search/?api=1&query=Kotobukiya+Akihabara","website":"","hop":"הליכה 0.7 ק״מ","transit":false},{"uid":"2026-11-29-8","part":"ערב","time":"18:15–18:50","start":1095,"end":1130,"name":"Bic Camera AKIBA","kind":"חנות","desc":"אלקטרוניקה, גיימינג ומוצרים יפניים.","maps":"https://www.google.com/maps/search/?api=1&query=Bic+Camera+AKIBA","website":"","hop":"הליכה 0.8 ק״מ","transit":false},{"uid":"2026-11-29-9","part":"ערב","time":"18:55–20:00","start":1135,"end":1200,"name":"Yodobashi Akiba","kind":"חנות","desc":"מתחם אלקטרוניקה ענק ליד Akihabara Station.","maps":"https://www.google.com/maps/search/?api=1&query=Yodobashi+Akiba","website":"","hop":"","transit":false}],"night":[]},{"id":"2026-11-30","date":"30/11","dow":"שני","title":"Tokyo → Kyoto · יום מעבר / צ׳ק-אין","subtitle" gle.com/maps/search/?api=1&query=teamLab+Borderless+Japan","website":"","hop":"הליכה 0.2 ק״מ","transit":false,"info":"teamLab Borderless נפתח לראשונה ב־Odaiba בשנת 2018 תחת השם MORI Building DIGITAL ART MUSEUM: teamLab Borderless. המוזיאון היה ניסוי שאפתני: במקום לסדר יצירות בתוך חדרים נפרדים, teamLab יצרה עבודות דיגיטליות שיכולות 'לנדוד' מחדר לחדר, לפגוש עבודות אחרות ולהשתנות בהתאם למבקרים. ההצלחה הייתה עצומה, והמקום הפך לאחד מאתרי האמנות הדיגיטלית המזוהים ביותר עם טוקיו. בשנת 2022 הוא נסגר כחלק מהפיתוח מחדש של Odaiba, ובפברואר 2024 נפתח מחדש ב־Azabudai Hills. המעבר עצמו מספר משהו על טוקיו: אטרקציה שנולדה באזור waterfront עתידני הפכה לעוגן תרבותי בפרויקט התחדשות יוקרתי בלב העיר. הרעיון של Borderless — ביטול גבולות בין יצירה ליצירה, בין חלל לצופה ובין אמנות לטכנולוגיה — מתאים גם להיסטוריה של teamLab כקולקטיב שהוקם ב־2001 בידי יוצרים מתחומים שונים. אין כאן מסלול כרונולוגי או 'חדרים שחייבים לסמן'; דווקא האפשרות ללכת לאיבוד היא חלק מהיצירה. מבחינה היסטורית זהו אחד המקומות שממחישים איך יפן של המאה ה־21 הפכה טכנולוגיה דיגיטלית לשפה מוזיאלית בפני עצמה.","infoSource":"https://www.teamlab.art/e/tokyo/"},{"uid":"2026-12-08-1","part":"בוקר","time":"12:05–13:05","start":725,"end":785,"name":"Azabudai Hills","kind":"אטרקציה","desc":"מתחם חדש ומעוצב עם אדריכלות, אוכל, חנויות ושטחים ירוקים.","maps":"https://www.google.com/maps/search/?api=1&query=Azabudai+Hills+Japan","website":"","hop":"הליכה 1.4 ק״מ","transit":false,"info":"Azabudai Hills נפתח בנובמבר 2023, אבל מאחוריו עומד תהליך תכנון ופינוי־בינוי שנמשך יותר משלושים שנה. Mori Building התחילה לעבוד עם בעלי הקרקע באזור כבר בסוף שנות ה־80, בשטח שהיה מורכב מרחובות צרים, בתים קטנים ומגרשים מפוצלים. במקום לבנות מגדל בודד, הפרויקט תוכנן כ־'Modern Urban Village' — עיר בתוך עיר שמחברת מגורים, משרדים, בית ספר, חנויות, תרבות, מרפאות ושטחים ירוקים. Mori JP Tower הפך עם פתיחתו לאחד הבניינים הגבוהים ביפן, אבל האידיאולוגיה של הפרויקט נמצאת דווקא בקרקע: כ־24,000 מ\"ר של שטח ירוק, פי כמה מהמצב שהיה לפני הבנייה. Azabudai הוא חלק מרצף ארוך של Mori Building שהתחיל ב־Roppongi Hills ומנסה לפתור את הצפיפות של טוקיו באמצעות בנייה אנכית וריכוז שימושים. הוא גם קלט לתוכו את teamLab Borderless, שעבר מ־Odaiba, וכך הפך תרבות דיגיטלית לעוגן של שכונת־על חדשה. כשמטיילים כאן, כדאי להבין שהגנים, השבילים והמבנים אינם תוצאה אורגנית אלא עיר שתוכננה כמעט מאפס במשך דור שלם — ניסוי אורבני שמנסה להגדיר כיצד תיראה טוקיו במאה ה־21.","infoSource":"https://www.azabudai-hills.com/about/index.html"},{"uid":"2026-12-08-2","part":"צהריים","time":"13:25–14:35","start":805,"end":875,"name":"21_21 Design Sight","kind":"אטרקציה","desc":"מוזיאון/חלל עיצוב במתחם Tokyo Midtown שתוכנן בשיתוף Tadao Ando, עם תערוכות מתחלפות של עיצוב ותרבות.","maps":"https://www.google.com/maps/search/?api=1&query=21_21+Design+Sight+Japan","website":"","hop":"הליכה 1.1 ק״מ","transit":false,"info":"21_21 DESIGN SIGHT נולד מתוך ויכוח מתמשך ביפן על השאלה מדוע למדינה שמייצרת כל כך הרבה עיצוב, אדריכלות וטכנולוגיה אין מוסד מרכזי שמלמד את הציבור לחשוב על design כחלק מהחיים. Issey Miyake דיבר כבר משנות ה־70 וה־80 עם יוצרים כמו Isamu Noguchi, Ikko Tanaka, Shiro Kuramata ו־Tadao Ando על הצורך במוזיאון כזה. ב־2003 הוא פרסם בעיתון Asahi Shimbun מאמר שקרא להקים 'מוזיאון לעיצוב', והדיון קיבל תנופה מעשית. בעזרת Mitsui Fudosan ותומכים נוספים נפתח 21_21 DESIGN SIGHT ב־Tokyo Midtown במרץ 2007. Tadao Ando תכנן את המבנה, שרובו קבור מתחת לאדמה; הגג נראה כיריעת פלדה ענקית המקופלת כלפי מטה והוא נוצר כמחווה לרעיון A Piece of Cloth של Miyake. אפילו השם בנוי כרעיון: 20/20 הוא ראייה תקינה, ו־21_21 אמור לרמוז ליכולת 'לראות מעבר'. המקום אינו מוזיאון עם אוסף קבוע אלא מעבדה של תערוכות על חיי יום־יום, חומרים, אוכל, שפה, טכנולוגיה ועיצוב. בשנת 2017, לציון עשור, נוסף Gallery 3. בזמן הביקור שלנו בדצמבר 2026 מוצגת לפי התכנית הרשמית תערוכה שמתחילה מן Hōjōki, טקסט יפני מהמאה ה־13 על ארעיות ומגורים, ומחברת אותו לשאלות של ארכיטקטורה קטנה וחיים מודרניים. לכן גם הבניין וגם התערוכה מספרים היסטוריה: ניסיון של מעצבים יפנים להפוך design ממוצר יפה לדרך לחשוב על חברה.","infoSource":"https://www.2121designsight.jp/en/designsight/"},{"uid":"2026-12-08-3","part":"צהריים","time":"14:50–16:15","start":890,"end":975,"name":"Mori Art Museum","kind":"אטרקציה","desc":"מוזיאון לאמנות עכשווית בקומות העליונות של Roppongi Hills.","maps":"https://www.google.com/maps/search/?api=1&query=Mori+Art+Museum+Japan","website":"","hop":"הליכה 0.1 ק״מ","transit":false,"info":"Mori Art Museum נפתח באוקטובר 2003 בראש Mori Tower כחלק מהרעיון של Roppongi Hills כ־'Cultural Heart of the City'. Minoru Mori האמין שמרכז עסקים ומגורים חדש אינו יכול להסתפק במשרדים ובחנויות, ולכן הציב מוזיאון לאמנות עכשווית במקום יוקרתי במיוחד — הקומות העליונות של אחד המגדלים החדשים בעיר. תערוכת הפתיחה, Happiness: A Survival Guide for Art and Life, כבר סימנה את הכיוון: לא מוזיאון שמסתפק באוסף היסטורי, אלא מוסד שבוחן נושאים חברתיים ועכשוויים דרך אמנות. במשך השנים המוזיאון הפך למקום חשוב לאמנות מאסיה וליוצרים בינלאומיים, והוא בחר לפעול בעיקר באמצעות תערוכות מתחלפות ולא לבנות אוסף קבוע ענק. גם שעות הפתיחה המאוחרות יחסית היו חלק מהרעיון — אמנות כחלק מחיי העיר ולא טקס שמסתיים אחר הצהריים. המיקום הגבוה יוצר קשר ישיר עם Tokyo City View הסמוכה: אפשר לעבור מתערוכה שעוסקת בחברה, טכנולוגיה או זהות ולצאת מיד לנוף של המטרופולין עצמו. לכן ההיסטוריה של המוזיאון קשורה פחות ליצירה אחת מפורסמת ויותר לניסוי עירוני: האם מוזיאון יכול להיות חלק טבעי מקניון, מגדל משרדים ושכונת מגורים בלי לאבד רצינות תרבותית.","infoSource":"https://www.mori.art.museum/en/about/index.html"},{"uid":"2026-12-08-4","part":"שקיעה + ערב","time":"16:20–17:10","start":980,"end":1030,"name":"Roppongi Hills","kind":"אטרקציה","desc":"מתחם עירוני עם קניות, אמנות ותצפיות.","maps":"https://www.google.com/maps/search/?api=1&query=Roppongi+Hills+Japan","website":"","hop":"הליכה 1.8 ק״מ","transit":false,"info":"Roppongi Hills נפתח ב־2003 אחרי תהליך פיתוח שנמשך יותר מ־15 שנה וכלל משא ומתן עם מאות בעלי קרקע. Mori Building, בהובלת Minoru Mori, רצתה ליצור 'עיר אנכית' שבה מגורים, עבודה, תרבות, מסחר ופנאי מתקיימים יחד כדי לצמצם נסיעות ולהחזיר חיים למרכז העיר. אבל הקרקע שעליה נבנה הפרויקט נושאת היסטוריה מוקדמת בהרבה. בתקופת Edo היה כאן חלק מאחוזת משפחת Mōri, ואפילו שם הגן Mōri Garden משמר את הקשר הזה. ב־1849 נולד באזור Nogi Maresuke, לימים גנרל מפורסם מתקופת Meiji. במאה ה־20 פעלו באזור מתקני תעשייה ומשרדי TV Asahi, ורק בסוף המאה התחיל האיחוד מחדש של החלקות. עם פתיחת Mori Tower ב־2003 הפך המקום לאחד מסמלי טוקיו של תחילת המאה ה־21 — פרויקט ענק שמשלב מוזיאון לאמנות עכשווית ותצפית בראש מגדל מסחרי. Roppongi Hills גם השפיע על פרויקטים מאוחרים יותר של Mori, כולל Toranomon ו־Azabudai Hills. לכן זהו אתר חשוב להבנת האופן שבו טוקיו מחדשת את עצמה: לא בהכרח על ידי מחיקת שכונה אחת ובניית גורד שחקים יחיד, אלא באמצעות יצירת מערכת עירונית שלמה בתוך מתחם אחד.","infoSource":"https://www.roppongihills.com/green/mohri/history.html"},{"uid":"2026-12-08-5","part":"שקיעה + ערב","time":"17:20–18:00","start":1040,"end":1080,"name":"נסיעה ל-Omori","kind":"מעבר","desc":"","maps":"","website":"","hop":"","transit":true},{"uid":"2026-12-08-6","part":"שקיעה + ערב","time":"18:20–19:50","start":1100,"end":1190,"name":"BOOKOFF SUPER BAZAAR SEIYU Omori Store","kind":"חנות","desc":"סניף BOOKOFF SUPER BAZAAR גדול בטוקיו עם ספרים, CD/DVD/Blu-ray, טלפונים, אלקטרוניקה, מוצרי חשמל, כלי נגינה, אופנה, כרטיסי אספנות, צעצועים, מותגים","maps":"https://www.google.com/maps/search/?api=1&query=BOOKOFF+SUPER+BAZAAR+SEIYU+Omori+Store+Tokyo+Japan","website":"","hop":"","transit":false}],"night":[{"name":"Tokyo City View","desc":"תצפית גבוהה על העיר מ-Roppongi Hills.","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+City+View+Japan"},{"name":"Tokyo Tower","desc":"המגדל האייקוני של טוקיו עם תצפיות ועיצוב רטרו.","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+Tower+Japan"}]},{"id":"2026-12-09","date":"09/12","dow":"רביעי","title":"Autumn Gardens → Ikebukuro","subtitle":"יום יציאה, מסיימים מוקדם","base":"טוקיו · טיסה 23:00","scope":["טוקיו"],"empty":false,"items":[{"uid":"2026-12-09-0","part":"בוקר","time":"09:00–10:00","start":540,"end":600,"name":"Koishikawa Korakuen","kind":"אטרקציה","desc":"אחד הגנים היפניים העתיקים בטוקיו, עם בריכות, גשרים ושלכת.","maps":"https://www.google.com/maps/search/?api=1&query=Koishikawa+Korakuen+Japan","website":"","hop":"רכבת 3.3 ק״מ","transit":false,"info":"Koishikawa Kōrakuen הוא אחד מגני ה־daimyo העתיקים ביותר ששרדו בטוקיו. הוא החל להיבנות ב־1629 עבור Tokugawa Yorifusa, מייסד ענף Mito של משפחת Tokugawa, והושלם בתקופת בנו Tokugawa Mitsukuni — דמות מלומדת שהפכה מאוחר יותר לגיבור תרבות פופ תחת הכינוי Mito Kōmon. Mitsukuni התעניין עמוקות בלימוד ובהיסטוריה והושפע מהמלומד הסיני Zhu Shunshui, פליט משושלת Ming שהגיע ליפן. בהשפעתו שולבו בגן אלמנטים סיניים כמו Full Moon Bridge וייצוג של West Lake. גם השם Kōrakuen מגיע ממשפט קונפוציאני המיוחס ל־Fan Zhongyan: שליט טוב צריך 'לדאוג לפני כולם וליהנות אחרי כולם'. כלומר, אפילו שם הגן היה הצהרה על אידאל של שלטון. הגן בנוי כ־kaiyū, מסלול סביב אגם עם גבעות מלאכותיות, גשרים ונופים שמייצגים מקומות אמיתיים מסין ומיפן. הוא שרד את רעידת Kantō, את המלחמה ואת הפיתוח האורבני העצום סביבו, והיום Tokyo Dome וגורדי שחקים מציצים מעבר לעצים. ההיסטוריה שלו חשובה משום שהיא מזכירה ש־Edo לא הייתה תרבות סגורה בתוך עצמה; האליטה של Tokugawa קראה טקסטים סיניים, הזמינה מלומדים זרים ושילבה רעיונות חיצוניים בתוך נוף יפני.","infoSource":"https://www.tokyo-park.or.jp/teien/en/koishikawa/outline.html"},{"uid":"2026-12-09-1","part":"בוקר","time":"10:25–11:25","start":625,"end":685,"name":"Rikugien Garden","kind":"אטרקציה","desc":"גן יפני קלאסי ומרהיב במיוחד בשלכת, לעיתים עם תאורת ערב עונתית.","maps":"https://www.google.com/maps/search/?api=1&query=Rikugien+Garden+Japan","website":"","hop":"","transit":false,"info":"Rikugien נבנה סביב 1702 בידי Yanagisawa Yoshiyasu, יועץ רב־עוצמה של השוגון החמישי Tokugawa Tsunayoshi. הוא קיבל את הקרקע מהשוגון והקדיש שנים לעיצוב גן kaiyū — גן טיול שבו המבקר נע סביב אגם ונחשף בהדרגה לסצנות שונות. אבל Rikugien אינו רק נוף יפה; הוא בנוי סביב שירת waka. Yoshiyasu יצר בתוך הגן ייצוגים של נופים שהוזכרו בשירה יפנית ובקלאסיקות סיניות, כך שהמבקר המשכיל בתקופת Edo היה אמור לזהות רמזים ספרותיים תוך כדי הליכה. אפילו השם Rikugien מתייחס ל'שש הקטגוריות' של שירה, מושג שמקורו בסין והשפיע על מסורת waka. אחרי נפילת שוגונות Tokugawa הגן עבר ידיים, ובתקופת Meiji רכש אותו Iwasaki Yatarō, מייסד Mitsubishi, והשתמש בו כאחוזה שנייה. משפחת Iwasaki שמרה על המקום ותרמה אותו לעיר טוקיו ב־1938. ב־1953 הוא הוכר כ־Special Place of Scenic Beauty. לכן הגן שאנחנו רואים היום שרד בזכות שילוב יוצא דופן של שוגון, פטרון ספרות מהמאה ה־18 ומשפחת תעשיינים מהמאה ה־19. כשמטיילים סביב האגם, כדאי לזכור שהשבילים נועדו ממש 'לערוך' את הנוף — להסתיר תמונה, לפתוח אחרת ולגרום לטבע להיקרא כמו שיר.","infoSource":"https://www.tokyo-park.or.jp/teien/en/rikugien/outline.html"},{"uid":"2026-12-09-2","part":"בוקר","time":"11:25–11:55","start":685,"end":715,"name":"נסיעה ל-Ikebukuro","kind":"מעבר","desc":"","maps":"","website":"","hop":"","transit":true},{"uid":"2026-12-09-3","part":"צהריים","time":"12:00–13:00","start":720,"end":780,"name":"Neco Republic Ikebukuro rescue cat café","kind":"אטרקציה","desc":"בית קפה עם חתולי הצלה ואימוץ. מתאים יותר למי שמעדיף מודל עם רווחת בעלי חיים.","maps":"https://www.google.com/maps/search/?api=1&query=Neco+Republic+Ikebukuro+rescue+cat+caf%C3%A9+Japan","website":"","hop":"הליכה 0.9 ק״מ","transit":false,"info":"Neco Republic שייך לדור מאוחר יותר של cat cafés ביפן. בתי קפה עם חתולים הפכו לתופעה יפנית מפורסמת במיוחד בשנות ה־2000, בין היתר משום שהם סיפקו לתושבי ערים צפופות אפשרות לבלות עם בעלי חיים גם כאשר חוזי שכירות ודירות קטנות מקשים להחזיק חיית מחמד. עם הזמן עלתה גם ביקורת סביב רווחת בעלי החיים, ומכאן צמחו מודלים שמחברים את בית הקפה להצלה ואימוץ. Neco Republic נבנה סביב הרעיון הזה: החתולים במקום אינם רק 'עובדי בידור' אלא חתולי rescue, והפעילות נועדה לחשוף אנשים לאימוץ, לגייס תמיכה ולהפחית המתות של חתולים ללא בית. מבחינה תרבותית זהו שינוי מעניין בתוך פורמט מאוד יפני: אטרקציה שנולדה מתוך צפיפות עירונית ותרבות kawaii מקבלת תפקיד חברתי. באיקבוקורו, אזור שמלא ב־character cafés, anime ובידור ממותג, המקום יוצר ניגוד — עדיין חוויה נעימה וחמודה, אבל עם מסר על אחריות. לכן בביקור חשוב לכבד את כללי המגע והצילום ולתת לחתולים לבחור אם להתקרב; זה חלק מההבדל בין rescue café לבין מקום שבו בעל החיים הוא רק תפאורה.","infoSource":"https://www.neco-republic.jp/"},{"uid":"2026-12-09-4","part":"צהריים","time":"13:10–14:40","start":790,"end":880,"name":"Sunshine Aquarium","kind":"אטרקציה","desc":"אקווריום עירוני עם פינגווינים, לוטרות ותצוגות יצירתיות.","maps":"https://www.google.com/maps/search/?api=1&query=Sunshine+Aquarium+Japan","website":"","hop":"הליכה 0.1 ק״מ","transit":false,"info":"Sunshine Aquarium נפתח ב־1978 כחלק מ־Sunshine City באיקבוקורו, אחד מפרויקטי ה־mixed-use הגדולים והשאפתניים של טוקיו באותה תקופה. Sunshine 60, המגדל המרכזי, נבנה על האתר שבו עמד בעבר בית הכלא Sugamo — מקום שבו הוחזקו והוצאו להורג גם פושעי מלחמה אחרי 1945 — והפרויקט כולו נועד להפוך את האזור לסמל של טוקיו החדשה. בתוך הקומפלקס נפתח Sunshine International Aquarium על גג World Import Mart. עצם הרעיון היה חריג: אקווריום גדול לא ליד הים אלא גבוה בתוך אזור מסחרי צפוף. בשנת 2010 נסגר המקום לשיפוץ של כמעט שנה ונפתח מחדש באוגוסט 2011 בשם Sunshine Aquarium, עם תפיסה של 'Oasis in the Sky'. אחד הסמלים החדשים הוא Penguins in the Sky, מיכל חיצוני תלוי שבו הפינגווינים נראים כאילו הם שוחים מעל קו הרקיע של Ikebukuro. כך המקום עבר מאקווריום עירוני של שנות ה־70 לחוויה שמנצלת במכוון את הצפיפות והגובה של טוקיו. כשמבקרים, הניגוד הוא החלק המעניין: חיות ימיות ומים מול מגדלים, רכבות ורחובות — טבע שמוצג לא מחוץ לעיר אלא ממש בתוכה.","infoSource":"https://sunshinecity.jp/en/aquarium/area/"},{"uid":"2026-12-09-5","part":"צהריים","time":"14:45–15:45","start":885,"end":945,"name":"NAMJATOWN","kind":"אטרקציה","desc":"פארק indoor קטן ומשונה עם מתקנים, אוכל ודמויות.","maps":"https://www.google.com/maps/search/?api=1&query=NAMJATOWN+Japan","website":"","hop":"הליכה 0.1 ק״מ","transit":false,"info":"NAMJATOWN נפתח ב־6 ביולי 1996 בתוך Sunshine City בשם Sunshine Namja Town, בתקופה שבה חברות המשחקים היפניות חיפשו דרכים להרחיב את העולמות שלהן מעבר למסך. Namco, שהייתה כבר שם ענק בארקיידים ובמשחקים, בנתה כאן פארק מקורה שמבוסס על רחובות, דמויות, חידות ואטרקציות בקנה מידה קטן — לא על רכבות הרים ענקיות. ב־1997 נפתח אזור רוחות ו־yōkai, ובהמשך נוספו אטרקציות ששילבו טכנולוגיה וסיפור. פרק חשוב הגיע ב־2002 עם Ikebukuro Gyoza Stadium, שהיה מהחלוצים של 'food theme parks' ביפן: אוכל אזורי הפך בעצמו לאטרקציה. במשך השנים הפארק הסתגל לעליית anime ו־character collaborations והפך למקום שבו Bandai Namco יכולה להפוך IP דיגיטלי לחלל פיזי. ב־2021 נפתח Nyanja Town של חתולים, ב־2024 נוסף אזור נינג'ה, וב־2026, לציון 30 שנה, נעשה שיפוץ גדול ונוספו אטרקציות חדשות כולל Taiko no Tatsujin בקנה מידה ענק. לכן NAMJATOWN מעניין כהיסטוריה של תעשיית הבידור היפנית עצמה: מארקיידים של שנות ה־80 וה־90, דרך פארקי אוכל ו־character culture, ועד חוויות שמבוססות על IP ומשחקים מוכרים מהטלפון והקונסולה.","infoSource":"https://bandainamco-am.co.jp/tp/namja/NEWS/info/20260618_1.html"},{"uid":"2026-12-09-6","part":"צהריים","time":"15:50–16:20","start":950,"end":980,"name":"Pikachu Sweets by Pokémon Cafe","kind":"מסעדה / אוכל","desc":"דוכן Pokémon Café בסגנון takeaway ליד Pokémon Center MEGA TOKYO, עם משקאות וקינוחים בעיצוב Pokémon.","maps":"https://www.google.com/maps/search/?api=1&query=Pikachu+Sweets+by+Pokemon+Cafe+Sunshine+City+Japan","website":"","hop":"הליכה 0.1 ק״מ","transit":false},{"uid":"2026-12-09-7","part":"צהריים","time":"16:25–17:25","start":985,"end":1045,"name":"Pokémon Center MEGA TOKYO","kind":"אטרקציה","desc":"אחד ממרכזי Pokémon הגדולים בטוקיו, בתוך Sunshine City באיקבוקורו, עם מבחר גדול של מרצ'נדייז ומוצרים בלעדיים.","maps":"https://www.google.com/maps/search/?api=1&query=Pokemon+Center+MEGA+TOKYO+Sunshine+City+Japan","website":"","hop":"","transit":false},{"uid":"2026-12-09-8","part":"יציאה","time":"17:25–18:15","start":1045,"end":1095,"name":"חזרה למלון / איסוף מזוודות","kind":"מעבר","desc":"","maps":"","website":"","hop":"","transit":true},{"uid":"2026-12-09-9","part":"יציאה","time":"18:15","start":1095,"end":1095,"name":"יציאה לשדה התעופה","kind":"מעבר","desc":"","maps":"","website":"","hop":"","transit":true}],"night":[]}],"places":[{"id":"p_4921768b0a22","name":"Shibuya PARCO — Nintendo, Pokémon, CAPCOM, JUMP, JoJo & SEGA","city":"טוקיו","area":"Shibuya + Harajuku","status":"חובה","kind":"attraction","desc":"מרכז גיימינג ותרבות פופ מרוכז ב־6F של Shibuya PARCO. באותה קומה נמצאים Nintendo TOKYO, Pokémon Center Shibuya, CAPCOM STORE TOKYO, JUMP SHOP, THE★JOJO WORLD ו־SEGA STORE TOKYO. מומלץ להקדיש 1.5–2.5 שעות כדי לעבור בין כל החנויות, לקנות מוצרים בלעדיים ולצלם בלי להתרוצץ בין אזורים שונים.","duration":"1.5–2.5 שעות","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Shibuya+PARCO+Tokyo+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_d72692980dd3","name":"Shibuya Crossing","city":"טוקיו","area":"Shibuya + Harajuku","status":"רוצה","kind":"attraction","desc":"מעבר החציה האייקוני של שיבויה, מוקף במסכי ענק ומרכזי קניות.","duration":"15–30 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Shibuya+Crossing+Japan","booking":"","website":"","info":"מעבר החציה של שיבויה הוא סמל של טוקיו העכשווית, אבל הוא מעניין באמת כשמסתכלים עליו כחלק מהתפתחותה של Shibuya מצומת רכבת פרברי למרכז עירוני עצום. תחנת Shibuya נפתחה כבר ב־1885, ובמהלך המאה ה־20 התרחבו אליה קווי רכבת פרטיים, מסחר, בתי כלבו ותרבות צעירה, עד שהאזור הפך לאחד המרכזים החשובים של מערב טוקיו. הצומת עצמו נעשה מפורסם בגלל שיטת ה־scramble, שבה כל תנועת המכוניות נעצרת והולכי הרגל חוצים בו־זמנית מכל הכיוונים, אבל הסיפור האנושי המזוהה ביותר עם המקום נמצא כמה מטרים משם: Hachikō, כלב אקיטה שנהג לחכות מדי יום לבעליו, פרופ' Hidesaburō Ueno. לאחר שאואנו מת ב־1925 ולא חזר עוד ברכבת, Hachikō המשיך להגיע לתחנה כמעט תשע שנים. הסיפור פורסם בעיתונות, והכלב הפך עוד בחייו לסמל לאומי של נאמנות; הפסל הראשון שלו הוצב ב־1934, כאשר Hachikō עצמו עוד היה חי. הפסל של היום הוא גרסה שלאחר המלחמה, והרחבה סביבו הפכה לנקודת המפגש המפורסמת ביותר בשיבויה. לכן כשעומדים בצומת, רואים באותו פריים שני סיפורים שונים של טוקיו: מצד אחד עיר ענקית, דיגיטלית וצפופה, ומצד שני סיפור קטן ואישי משנות ה־20 שהעיר החליטה לזכור.","infoSource":"https://www.gotokyo.org/en/spot/78/index.html"},{"id":"p_3af3a17396e1","name":"Shibuya Sky","city":"טוקיו","area":"Shibuya + Harajuku","status":"חובה","kind":"attraction","desc":"תצפית פתוחה מעל שיבויה עם נוף 360° של טוקיו. הכי יפה לקראת שקיעה.","duration":"60–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=Shibuya+Sky+Japan","booking":"","website":"","info":"SHIBUYA SKY הוא אתר צעיר מאוד, אבל הוא יושב על אחד מסיפורי ההתחדשות העירונית הגדולים בטוקיו. במשך עשרות שנים Shibuya הייתה מזוהה עם תחנת רכבת מסובכת, בתי כלבו של Tokyu, אופנת רחוב ותרבות צעירה; בתחילת המאה ה־21 החלה סדרת פרויקטים עצומה שנועדה לבנות מחדש את סביבת התחנה ולחבר טוב יותר את כל מפלסי הרכבות, הכבישים והולכי הרגל. Shibuya Scramble Square, שנפתח ב־2019, היה אחד הסמלים הבולטים של המהלך הזה. בגובה של כ־230 מטר הוא היה בעת פתיחתו הבניין הגבוה ביותר באזור Shibuya, ועל הגג נבנתה SHIBUYA SKY כתצפית פתוחה בגובה של כ־229 מטר. מה שהופך את המקום למעניין הוא לא רק הנוף אלא האפשרות לראות מלמעלה את ההיסטוריה העירונית של שיבויה: הצומת המפורסם נמצא ממש מתחת, תחנת Shibuya מתפצלת לכל הכיוונים, Meiji Jingu ו־Yoyogi נראים כאי ירוק בתוך העיר, וגורדי השחקים של Shinjuku מסמנים מרכז עירוני אחר במרחק קצר. בשקיעה אפשר ממש לראות את טוקיו מחליפה זהות: עיר של כבישים ומבנים הופכת בהדרגה למשטח של אור. במובן הזה SHIBUYA SKY היא תצפית על תהליך — שיבויה שכבר איננה רק בירת אופנת הנוער של שנות ה־80 וה־90, אלא רובע שמנסה להפוך למרכז עסקי וטכנולוגי של המאה ה־21.","infoSource":"https://www.shibuya-scramble-square.com/en/"},{"id":"p_a58598c2bd69","name":"MEGA Don Quijote","city":"טוקיו","area":"Shibuya + Harajuku","status":"רוצה","kind":"attraction","desc":"חנות ענקית עם אוכל, קוסמטיקה, גאדג'טים, מתנות ודברים יפניים מוזרים.","duration":"45–90 דק׳","note":"","maps":"https://www.google.com/maps/search/?api=1&query=MEGA+Don+Quijote+Japan","booking":"","website":"","historyNotApplicable":true},{"id":"p_c64d09b98edc","name":"Cat Street","city":"טוקיו","area":"Shibuya
