<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07090d">
<title>יפן 2026 · v77</title>
<style>
  :root { --bg:#07090d; --card:#141a24; --line:#2a3444; --text:#f4f7fb; --muted:#93a0b3; --blue:#8ebcff; --ink:#071018; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust:100%; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; overflow-x:hidden; max-width:100%; }
  button, a { touch-action:manipulation; }
  button, input, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  a { color:var(--blue); }
  .app { width:min(480px,100%); margin:0 auto; min-height:100dvh; padding: 12px 16px calc(28px + env(safe-area-inset-bottom)); }
  .dow { color:var(--blue); font-size:13px; font-weight:700; }
  h1 { font-size:34px; line-height:1.05; margin:4px 0 0; }
  .sub { color:var(--muted); margin:6px 0 12px; font-size:15px; }
  .days { display:flex; gap:8px; overflow-x:auto; max-width:100%; padding-bottom:8px; margin:0 -16px 14px; padding-inline:16px; scroll-snap-type:x mandatory; overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch; }
  .days::-webkit-scrollbar { display:none; }
  .pill { flex:0 0 auto; scroll-snap-align:start; min-width:72px; min-height:52px; border-radius:16px; border:1px solid var(--line); background:#10151d; color:var(--text); }
  .pill.on { background:var(--blue); color:var(--ink); border-color:var(--blue); }
  .pill b { display:block; font-size:16px; }
  .pill span { font-size:11px; opacity:.75; }
  .now { background:#102033; border:1px solid #3c6288; border-radius:24px; padding:16px; }
  .label { color:#b7d4ff; font-size:13px; font-weight:800; }
  .time { direction:ltr; unicode-bidi:isolate; display:inline-block; margin-top:8px; font-size:22px; font-weight:750; font-variant-numeric:tabular-nums; }
  .now h2, .sheet h2 { margin:4px 0 8px; font-size:26px; line-height:1.2; overflow-wrap:anywhere; }
  .desc { margin:0; color:#d5deea; font-size:16px; line-height:1.45; }
  .next { margin-top:12px; color:#c5d4e6; font-size:15px; }
  .warn { margin-top:8px; color:#ffd98a; font-size:14px; }
  .actions { display:flex; gap:8px; margin-top:14px; }
  .btn { min-height:48px; border-radius:14px; border:0; padding:12px 14px; font-weight:800; text-decoration:none; display:flex; align-items:center; justify-content:center; }
  .primary { background:var(--blue); color:var(--ink); flex:1; }
  .ghost { background:transparent; color:#d7e6f8; border:1px solid #4d6986; }
  .late { width:100%; margin-top:8px; min-height:44px; border-radius:12px; border:1px solid var(--line); background:transparent; color:#c9d6e6; }
  .mymaps-link {
    width:100%; min-height:44px; margin:8px 0 2px; border-radius:12px;
    border:1px solid #315e87; background:#102033; color:#cfe8ff;
    display:flex; align-items:center; justify-content:center; text-decoration:none; font-weight:800;
  }
  .block { margin:18px 0 8px; color:var(--muted); font-size:13px; font-weight:800; }
  .row { width:100%; min-height:58px; display:flex; flex-direction:column; align-items:stretch; gap:2px; text-align:right; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; margin-top:8px; }
  .row-shell, .place-card-shell { position:relative; }
  .row-shell .row, .place-card-shell .card { padding-inline-start:54px; }
  .info-btn {
    position:absolute; left:11px; top:50%; transform:translateY(-50%);
    width:34px; height:34px; min-width:34px; min-height:34px; padding:0;
    border-radius:50%; border:1px solid #56708e; background:#152233; color:#cfe6ff;
    font-family:Georgia,serif; font-size:19px; font-weight:900; line-height:1;
    display:flex; align-items:center; justify-content:center; z-index:3;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
  }
  .info-btn:active { transform:translateY(-50%) scale(.96); }
  .now { position:relative; }
  .now .info-btn.info-current { top:18px; left:16px; transform:none; }
  .now .info-btn.info-current:active { transform:scale(.96); }
  .info-summary {
    margin:12px 0; padding:13px 14px; border-radius:16px;
    background:#0e1824; border:1px solid #29435f; color:#dce8f6;
  }
  .info-summary h3 { margin:0 0 8px; font-size:15px; color:#9fcaff; }
  .info-summary p { margin:0; font-size:16px; line-height:1.55; white-space:pre-line; }
  .info-facts { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .info-fact {
    display:inline-flex; padding:5px 8px; border-radius:999px;
    border:1px solid #33475f; color:#afc1d6; font-size:12px; background:#121c28;
  }
  .row .t { direction:ltr; unicode-bidi:isolate; color:var(--blue); font-weight:700; font-size:15px; text-align:left; }
  .row .n { font-weight:700; font-size:17px; overflow-wrap:anywhere; }
  .row.transit .n { color:#b7c3d4; font-weight:650; }
  .row.done-row {
    background:#10281c;
    border-color:#2f7d50;
    color:#dff7e8;
    min-height:52px;
  }
  .row.done-row .t { color:#76d69b; }
  .row.done-row .n { color:#e7fff0; }
  .row.done-row .done-check {
    color:#65d88f;
    font-weight:900;
    margin-left:6px;
  }
  .done-hint { color:#76a98a; font-size:11px; margin-top:2px; }

  .hop { color:var(--muted); font-size:13px; padding:6px 6px 0; }
  .fold { width:100%; margin-top:14px; min-height:44px; border:0; background:transparent; color:var(--muted); text-align:right; }
  .night { margin-top:8px; }
  .night p { color:var(--muted); font-size:14px; margin:0 0 8px; }
  .chip { display:inline-block; margin:0 0 8px 8px; padding:10px 12px; border-radius:999px; background:#161222; color:#e4dcff; border:1px solid #3c345c; font-size:14px; text-decoration:none; }
  .chrome { position:sticky; top:0; z-index:12; background:rgba(7,9,13,.97); backdrop-filter:blur(18px); border-bottom:1px solid var(--line); }
  .modebar { display:flex; gap:6px; padding:calc(7px + env(safe-area-inset-top)) 16px 6px; }
  .modebar button { flex:1; min-height:42px; border-radius:13px; border:1px solid #273447; background:#0e141d; color:#98a9bd; font-weight:850; font-size:14px; }
  .modebar button.on { background:#dbeafe; color:#0a1626; border-color:#dbeafe; box-shadow:0 0 0 1px rgba(255,255,255,.05) inset; }
  .modebar button span { margin-left:5px; }
  .nav { position:static; z-index:10; display:flex; justify-content:center; gap:8px; padding:5px 16px 8px; background:transparent; border-bottom:0; }
  .planning-mode .nav { display:none; }
  .nav button { flex:1; max-width:160px; min-height:48px; border-radius:14px; border:0; background:transparent; color:var(--muted); font-weight:700; }
  .nav button.on { background:#182232; color:#fff; }
  .search { width:100%; min-height:48px; border-radius:14px; border:1px solid var(--line); background:#10151d; padding:0 12px; font-size:16px; }
  .filters { display:flex; gap:8px; overflow-x:auto; margin:12px 0; }
  .filters button { flex:0 0 auto; min-height:40px; border-radius:999px; border:1px solid var(--line); background:#10151d; padding:0 12px; }
  .filters button.on { background:var(--blue); color:var(--ink); border-color:var(--blue); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; margin-top:8px; }
  .card b { font-size:16px; }
  .meta { color:var(--muted); font-size:13px; margin-top:4px; }
  .sheet-back { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; z-index:20; }
  .sheet { width:min(480px,100%); margin:0 auto; background:#121821; border-radius:22px 22px 0 0; padding:12px 16px calc(16px + env(safe-area-inset-bottom)); max-height:86dvh; overflow:auto; }
  .handle { width:42px; height:5px; border-radius:99px; background:#314055; margin:4px auto 12px; }
  textarea { width:100%; min-height:88px; border-radius:14px; border:1px solid var(--line); background:#0d1219; padding:12px; font-size:16px; }
  .menu { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .menu button, .menu a { min-height:44px; border-radius:12px; border:1px solid var(--line); background:#182232; color:#e7eef8; padding:10px 12px; text-decoration:none; }
  .opt { width:100%; text-align:right; background:#101722; border:1px solid var(--line); border-radius:14px; padding:12px; margin-top:8px; }
  .toast { position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:30; background:#182232; border:1px solid var(--line); border-radius:14px; padding:12px; display:flex; justify-content:space-between; align-items:center; gap:8px; }


  /* v77 — Planning mode */
  .plan-wrap { max-width:1180px; margin:0 auto; }
  .plan-hero { padding:4px 0 8px; }
  .plan-hero h1 { margin:0 0 5px; }
  .plan-hero .sub { max-width:820px; }
  .plan-tabs { display:flex; gap:7px; overflow-x:auto; margin:12px 0 14px; padding-bottom:2px; }
  .plan-tabs button { flex:0 0 auto; min-height:42px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:#101722; color:#c4d0df; font-weight:800; }
  .plan-tabs button.on { background:#dbeafe; color:#0a1626; border-color:#dbeafe; }
  .plan-toolbar { display:grid; gap:9px; margin-bottom:14px; }
  .plan-filter-row { display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; }
  .plan-filter-row::-webkit-scrollbar,.plan-tabs::-webkit-scrollbar{display:none}
  .plan-filter-row button { flex:0 0 auto; min-height:38px; padding:0 11px; border:1px solid var(--line); border-radius:999px; background:#101722; color:#b9c7d8; font-weight:750; font-size:13px; }
  .plan-filter-row button.on { background:#24354a; border-color:#496784; color:#fff; }
  .plan-select { width:100%; min-height:46px; border-radius:14px; border:1px solid var(--line); background:#10151d; color:var(--text); padding:0 12px; font-size:15px; }
  .plan-summary { display:flex; flex-wrap:wrap; gap:7px; margin:10px 0 14px; }
  .plan-summary span { padding:6px 9px; border-radius:999px; border:1px solid #2d3c50; background:#101722; color:#aebed2; font-size:12px; font-weight:800; }
  .plan-section-title { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:20px 0 8px; }
  .plan-section-title h2 { font-size:18px; margin:0; }
  .plan-section-title span { color:var(--muted); font-size:12px; }
  .plan-grid { display:grid; grid-template-columns:1fr; gap:10px; }
  .plan-card { position:relative; border:1px solid var(--line); border-radius:18px; background:var(--card); overflow:hidden; }
  .plan-card.status-must { border-color:#8a6b2f; box-shadow:0 0 0 1px rgba(240,190,82,.07) inset; }
  .plan-card.status-want { border-color:#315d83; }
  .plan-card.status-maybe { border-color:#4b5360; }
  .plan-card.status-no { opacity:.58; }
  .plan-card-body { padding:13px; }
  .plan-card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .plan-card-title { margin:0; font-size:18px; line-height:1.25; }
  .plan-card .meta { margin-top:5px; }
  .plan-card-desc { margin:9px 0 0; color:#c9d5e4; font-size:14px; line-height:1.45; }
  .plan-route { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .plan-route span { padding:5px 8px; border-radius:999px; background:#10281c; border:1px solid #2f7d50; color:#c9f6d9; font-size:11px; font-weight:850; }
  .plan-route .not-scheduled { background:#171b22; border-color:#38404b; color:#9ba9ba; }
  .plan-status { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin-top:11px; }
  .plan-status button { min-height:38px; border-radius:10px; border:1px solid #2b384a; background:#101722; color:#aebdd0; font-size:12px; font-weight:850; padding:4px 3px; }
  .plan-status button.on[data-plan-status="חובה"] { background:#493816; border-color:#9b7531; color:#ffe5a3; }
  .plan-status button.on[data-plan-status="רוצה"] { background:#102b44; border-color:#3976a6; color:#cdeaff; }
  .plan-status button.on[data-plan-status="אולי"] { background:#292d35; border-color:#606976; color:#e0e6ee; }
  .plan-status button.on[data-plan-status="לא"] { background:#351c20; border-color:#7b3d47; color:#ffc8ce; }
  .plan-card-actions { display:flex; gap:7px; margin-top:9px; }
  .plan-card-actions a,.plan-card-actions button { min-height:38px; border-radius:10px; border:1px solid var(--line); background:#151e2a; color:#dce8f6; padding:7px 10px; text-decoration:none; font-size:12px; font-weight:800; }
  .plan-info-mini { width:36px; height:36px; min-width:36px; border-radius:50%; border:1px solid #56708e; background:#152233; color:#cfe6ff; font-family:Georgia,serif; font-weight:900; font-size:18px; }
  .plan-day-route { border:1px solid var(--line); border-radius:16px; padding:9px 11px; background:#0d131c; margin-bottom:12px; }
  .plan-day-line { display:grid; grid-template-columns:70px 1fr; gap:8px; padding:7px 0; border-bottom:1px solid #1c2633; }
  .plan-day-line:last-child { border-bottom:0; }
  .plan-day-line .t { direction:ltr; color:#8fbce6; font-size:12px; }
  .plan-day-line .n { font-size:13px; font-weight:750; }
  .plan-note { border:1px solid #32445a; background:#101b29; color:#b9cae0; border-radius:14px; padding:10px 12px; font-size:13px; line-height:1.45; margin:10px 0 14px; }
  .plan-empty { padding:24px 12px; text-align:center; color:var(--muted); border:1px dashed #344153; border-radius:16px; }
  @media(min-width:760px){ .plan-grid{grid-template-columns:repeat(2,minmax(0,1fr));} .plan-toolbar.two{grid-template-columns:1fr 1fr;} }

  /* v69 — Restaurants tab */
  .restaurant-head { margin-bottom:12px; }
  .restaurant-head h1 { margin-bottom:4px; }
  .restaurant-note { color:var(--muted); font-size:13px; line-height:1.45; margin:0 0 12px; }
  .restaurant-search { margin-bottom:10px; }
  .restaurant-filters { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; }
  .restaurant-filters::-webkit-scrollbar { display:none; }
  .restaurant-filters button {
    flex:0 0 auto; min-height:38px; border-radius:999px; padding:0 12px;
    border:1px solid var(--line); background:#10151d; color:var(--text); font-weight:750;
  }
  .restaurant-filters button.on { background:var(--blue); color:var(--ink); border-color:var(--blue); }
  .restaurant-grid { display:grid; grid-template-columns:1fr; gap:12px; }
  .restaurant-card {
    border:1px solid var(--line); border-radius:18px; overflow:hidden; background:var(--card);
  }
  .restaurant-photo-wrap { width:100%; aspect-ratio:16/9; background:#0c1118; overflow:hidden; }
  .restaurant-photo {
    display:block; width:100%; height:100%; object-fit:cover; background:#0c1118;
  }
  .restaurant-body { padding:13px; }
  .restaurant-topline { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .restaurant-name { margin:0; font-size:19px; line-height:1.2; }
  .diet-badge {
    flex:0 0 auto; display:inline-flex; align-items:center; min-height:28px; padding:4px 9px;
    border-radius:999px; font-size:11px; font-weight:900; border:1px solid;
  }
  .diet-vegan { color:#bff6d1; border-color:#2f7d50; background:#10281c; }
  .diet-vegetarian { color:#d5f5c4; border-color:#5d7c39; background:#1b2812; }
  .diet-vegan-options { color:#bfeef0; border-color:#39717a; background:#10282d; }
  .diet-veg-friendly { color:#ffe4a8; border-color:#766031; background:#2a2110; }
  .diet-unknown { color:#c4cfdd; border-color:#435064; background:#171d26; }
  .restaurant-verify { margin-top:8px; color:#88a1bc; font-size:11px; line-height:1.35; }
  .saved-japan { display:inline-flex; align-items:center; margin-inline-start:6px; padding:3px 7px; border-radius:999px; border:1px solid #4b3c63; background:#1b1625; color:#d8c9ef; font-size:10px; font-weight:800; }
  .restaurant-meta { color:var(--muted); font-size:12px; margin-top:5px; }
  .restaurant-desc { color:#d5deea; line-height:1.45; font-size:14px; margin:9px 0 0; }
  .restaurant-diet { margin-top:9px; font-size:13px; line-height:1.42; color:#dce7f4; }
  .restaurant-address {
    margin-top:10px; color:#aebbc9; font-size:12px; line-height:1.35; direction:ltr; text-align:left;
  }
  .restaurant-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:12px; }
  .restaurant-actions a {
    min-height:42px; display:flex; align-items:center; justify-content:center; text-align:center;
    border-radius:11px; border:1px solid var(--line); background:#182232; color:#e9f1fb;
    font-size:12px; font-weight:850; text-decoration:none; padding:8px 9px;
  }
  .restaurant-actions a.map { background:#17304a; border-color:#315e87; color:#cfe8ff; }
  .restaurant-actions a.youtube { background:#2a1515; border-color:#6a3535; color:#ffbcbc; }
  .restaurant-actions a.menu { background:#18251a; border-color:#3f6847; color:#cef0d3; }
  .restaurant-actions a.photos { background:#251b32; border-color:#57406f; color:#e5d4ff; }
  @media (min-width: 760px) {
    .restaurant-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  }
  @media (min-width: 1180px) {
    .restaurant-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
  }

  .hidden { display:none !important; }
  @media (min-width: 960px) {
    .nav button[data-tab="places"] { display:none; }
    .app { width:min(1240px,100%); padding:22px 28px 48px; }
    .work { display:grid; grid-template-columns:220px minmax(0,1fr) 320px; gap:22px; align-items:start; }
    .rail, .side { position:sticky; top:76px; max-height:calc(100dvh - 96px); overflow:auto; }
    .rail-title { color:var(--muted); font-size:13px; font-weight:800; margin:0 0 8px; }
    .daylink { width:100%; text-align:right; border:1px solid transparent; background:transparent; border-radius:12px; padding:8px 10px; margin-top:4px; }
    .daylink b { display:block; font-size:15px; }
    .daylink span { display:block; color:var(--muted); font-size:12px; line-height:1.35; }
    .daylink.on { background:#182232; border-color:#3c6288; }
    .work .days { display:none; }
    .work .row { flex-direction:row; align-items:center; gap:14px; }
    .work .row .t { min-width:112px; font-size:15px; }
    .work h1 { font-size:28px; }
    .sheet-back { align-items:center; padding:24px; }
    .sheet { width:min(560px,100%); border-radius:22px; max-height:80dvh; }
  }

  /* v67 — strict attraction image + always-visible YouTube */
  .media-card { margin-top:10px; border:1px solid #2a3444; border-radius:14px; overflow:hidden; background:#0d1219; }
  .media-card.compact { margin-top:8px; }
  .media-image-wrap { display:none; width:100%; aspect-ratio:16/9; background:#0d1219; }
  .media-image-wrap.on { display:block; }
  .media-image { display:block; width:100%; height:100%; object-fit:cover; background:#0d1219; }
  .media-image-note { padding:6px 9px; font-size:10px; color:#8290a4; background:#0d1219; border-top:1px solid #202938; }
  .media-actions { display:flex; gap:8px; padding:8px; background:#111823; }
  .media-youtube, .media-status {
    flex:1; display:flex; align-items:center; justify-content:center;
    min-height:40px; padding:9px 12px; border-radius:11px;
    font-size:12px; font-weight:800; text-align:center;
  }
  .media-youtube { border:1px solid #653737; background:#261313; color:#ffb8b8; cursor:pointer; }
  .media-youtube:active { opacity:.72; }
  .media-status { border:1px solid #2a3444; background:#141c28; color:#96a4b8; }
  .media-card.hero { margin:12px 0 2px; }
  .media-card.hero .media-youtube { min-height:44px; font-size:13px; }

</style>
</head>
<body>
<header class="chrome">
  <div class="modebar" aria-label="מצב עבודה">
    <button type="button" data-mode="execute" class="on"><span>▶</span> ביצוע</button>
    <button type="button" data-mode="plan"><span>◫</span> תכנון</button>
  </div>
  <nav class="nav">
    <button type="button" data-tab="today" class="on">היום</button>
    <button type="button" data-tab="restaurants">מסעדות</button>
    <button type="button" data-tab="places">מקומות</button>
    <button type="button" data-tab="more">עוד</button>
  </nav>
</header>
<div class="app" id="app"></div>
<!-- /app -->
<div id="sheet"></div>

<script id="trip-data" type="application/json">{"days":[{"id":"2026-11-25","date":"25/11","dow":"רביעי","title":"יום ראשון בטוקיו — ריק","subtitle":"","base":"טוקיו","scope":["טוקיו"],"empty":true,"items":[],"night":[]},{"id":"2026-11-26","date":"26/11","dow":"חמישי","title":"Harajuku → Shibuya","subtitle":"טבע, רחובות, שקיעה וקניות","base":"טוקיו","scope":["טוקיו"],"empty":false,"items":[{"uid":"2026-11-26-0","part":"בוקר","time":"09:00–10:15","start":540,"end":615,"name":"Meiji Jingu Shrine","kind":"אטרקציה","desc":"מקדש שינטו חשוב בתוך יער גדול ושקט בלב טוקיו.","maps":"https://www.google.com/maps/search/?api=1&query=Meiji+Jingu+Japan","website":"","hop":"הליכה 0.7 ק״מ","transit":false,"info":"מה זה\nMeiji Jingu הוא מקדש שינטו שהוקם ב-1920 ומוקדש לקיסר Meiji ולקיסרית Shōken. הקיסר Meiji מזוהה עם התקופה שבה יפן עברה משלטון פיאודלי למדינה מודרנית ומתועשת.\n\nלמה זה חשוב\nהיער סביב המקדש נראה עתיק וטבעי, אבל הוא תוכנן וניטע במיוחד לקראת הקמת המקדש. כ-100,000 עצים נתרמו מכל רחבי יפן, והמתכננים בנו \"יער של העתיד\" שאמור היה להתחדש בעצמו במשך מאות שנים. לכן זה לא מקדש עתיק בתוך יער עתיק, אלא יצירה מודרנית המשתמשת בשפה של מסורת עתיקה.\n\nמה לשים לב\nהמעבר דרך שערי ה-torii מסמן מעבר מהעיר למרחב קדוש. חפשו גם את חביות הסאקה ואת חביות היין הצרפתי: יחד הן יוצרות סמל יפה לתקופת Meiji — קליטת השפעות מערביות בלי לוותר על זהות יפנית. במקדש עצמו כדאי להתבונן בטקסי הטהרה, הקידה, המנחה והתפילה ולא להרגיש שחייבים לבצע הכול."},{"uid":"2026-11-26-1","part":"בוקר","time":"10:20–11:00","start":620,"end":660,"name":"Yoyogi Park","kind":"אטרקציה","desc":"פארק גדול ונעים ליד Meiji Jingu, טוב להפסקה ירוקה.","maps":"https://www.google.com/maps/search/?api=1&query=Yoyogi+Park+Japan","website":"","hop":"הליכה 1.1 ק״מ","transit":false,"info":"מה זה\nYoyogi Park הוא אחד הפארקים העירוניים הגדולים במרכז טוקיו. לפני שהפך לפארק, השטח שימש בין היתר בסיס אימונים צבאי, לאחר המלחמה את מתחם Washington Heights האמריקאי, ובאולימפיאדת טוקיו 1964 חלקים ממנו שימשו ככפר האולימפי.\n\nלמה זה חשוב\nהפארק מציג שכבה אחרת לגמרי של טוקיו: לא גן יפני מעוצב ולא אתר דתי, אלא מרחב ציבורי שבו תושבים נפגשים, מתאמנים, רוקדים, עושים פיקניק ומציגים תת-תרבויות שונות.\n\nמה לשים לב\nהחוויה כאן היא בעיקר people-watching. בסופי שבוע במיוחד אפשר לפגוש קבוצות ריקוד, מוזיקאים ואנשים עם תחביבים יוצאי דופן. אצלנו זו עצירה ירוקה וקלה בין Meiji Jingu להרג'וקו."},{"uid":"2026-11-26-2","part":"בוקר","time":"11:15–12:05","start":675,"end":725,"name":"Reissue 3D Latte Art","kind":"מסעדה / אוכל","desc":"בית קפה מפורסם בלאטה-ארט תלת-ממדי שמצויר לפי בקשה.","maps":"https://www.google.com/maps/search/?api=1&query=Reissue+3D+Latte+Art+Japan","website":"","hop":"הליכה 0.7 ק״מ","transit":false},{"uid":"2026-11-26-3","part":"בוקר","time":"12:15–13:15","start":735,"end":795,"name":"Takeshita Street","kind":"אטרקציה","desc":"רחוב צבעוני בהראג'וקו עם אופנה צעירה, מתוקים וחנויות קטנות.","maps":"https://www.google.com/maps/search/?api=1&query=Takeshita+Street+Japan","website":"","hop":"הליכה 0.5 ק״מ","transit":false,"info":"מה זה\nTakeshita-dori הוא רחוב הולכי רגל קצר וצפוף ליד תחנת Harajuku, המזוהה במשך עשרות שנים עם אופנת צעירים, kawaii, תתי-תרבויות, קרפים, purikura וטרנדים חולפים.\n\nלמה זה חשוב\nהרג'וקו לא הפך למרכז תרבות צעירה בגלל קניונים שתכננו זאת מלמעלה. צעירים החלו להתכנס באזור וליצור סגנונות משל עצמם, והמסחר הגיע בעקבות התרבות. הרחוב הוא תוצאה של התהליך הזה.\n\nמה לשים לב\nמעבר לצפיפות, הסתכלו על לבוש, אריזות, גרפיקה ואופן הצגת המוצרים. זו דוגמה טובה לכוח של kawaii כתרבות חזותית ולא רק כמשהו \"חמוד\"."},{"uid":"2026-11-26-4","part":"צהריים","time":"13:20–13:55","start":800,"end":835,"name":"ALPAKA Harajuku Harakado","kind":"חובה · חנות","desc":"חנות ALPAKA ב־2F של Tokyu Plaza Harajuku “Harakado”. תיקים, EDC ואביזרי נשיאה. שעות פתיחה: 11:00–21:00.","maps":"https://www.google.com/maps/search/?api=1&query=ALPAKA+Tokyu+Plaza+Harajuku+Harakado+Tokyo","website":"https://www.alpakagear.jp/","hop":"הליכה 0.2 ק״מ","transit":false},{"uid":"2026-11-26-5","part":"צהריים","time":"14:00–14:45","start":840,"end":885,"name":"Omotesando","kind":"אטרקציה","desc":"שדרה אלגנטית עם אדריכלות, חנויות דגל ובתי קפה.","maps":"https://www.google.com/maps/search/?api=1&query=Omotesando+Japan","website":"","hop":"הליכה 0.6 ק״מ","transit":false,"info":"מה זה\nOmotesando היא שדרה רחבה ומוצלת שהייתה במקור דרך הגישה אל Meiji Jingu. כיום היא אחת משדרות האדריכלות, האופנה והעיצוב החשובות בטוקיו.\n\nלמה זה חשוב\nזהו מקום מצוין לראות כיצד טוקיו משתמשת במסחר כזירה לאדריכלות עכשווית. לאורך הרחוב נמצאים מבנים של אדריכלים בינלאומיים ויפניים, ולכן החוויה היא לא רק חנויות אלא חזיתות, חומרים, חללים וקנה מידה.\n\nמה לשים לב\nהסתכלו כלפי מעלה ולא רק לחלונות הראווה: זכוכית, בטון, גאומטריה לא רגילה ועצי ה-zelkova יוצרים שדרה מאוד שונה מ-Takeshita הסמוכה."},{"uid":"2026-11-26-6","part":"צהריים","time":"14:50–15:35","start":890,"end":935,"name":"Cat Street","kind":"אטרקציה","desc":"רחוב אופנתי בין שיבויה להראג'וקו עם בוטיקים, קפה וחנויות מיוחדות.","maps":"https://www.google.com/maps/search/?api=1&query=Cat+Street+Japan","website":"","hop":"הליכה 1.2 ק״מ","transit":false,"info":"מה זה\nCat Street הוא ציר הולכי רגל המחבר באופן טבעי בין הרג'וקו לשיבויה. הוא פחות צבעוני וצפוף מ-Takeshita Street ויותר מזוהה עם אופנת רחוב, בוטיקים, עיצוב ובתי קפה.\n\nלמה זה חשוב\nהרחוב מדגים שלתרבות הצעירה של טוקיו יש כמה שכבות. Takeshita מייצגת את הצד הקוואי, הזול וההמוני יותר; Cat Street מציגה גרסה בוגרת, עיצובית ואורבנית יותר של אותה סצנה.\n\nמה לשים לב\nאל תתמקדו רק בחנויות. שימו לב לסמטאות הצדדיות, לחזיתות הבניינים ולאופן שבו הרחוב הופך בהדרגה מהרג'וקו לשיבויה."},{"uid":"2026-11-26-7","part":"שקיעה + ערב","time":"16:00–17:15","start":960,"end":1035,"name":"Shibuya Sky","kind":"אטרקציה","desc":"תצפית פתוחה מעל שיבויה עם נוף 360° של טוקיו. הכי יפה לקראת שקיעה.","maps":"https://www.google.com/maps/search/?api=1&query=Shibuya+Sky+Japan","website":"","hop":"הליכה 0.8 ק״מ","transit":false,"info":"מה זה\nSHIBUYA SKY הוא מתחם תצפית בראש Shibuya Scramble Square, בגובה של כ-229 מטר מעל שיבויה. החוויה מחולקת למעבר כלפי מעלה, גלריה פנימית ותצפית גג פתוחה של 360 מעלות.\n\nלמה זה חשוב\nזה המקום שבו אפשר להבין את קנה המידה של טוקיו אחרי יום של הליכה בגובה הרחוב. מלמעלה רואים כיצד שיבויה, הרג'וקו, שינג'וקו והמרכז העירוני מתחברים לרצף עצום של בנייה ותנועה.\n\nמה לשים לב\nהגג הפתוח הוא החלק המרכזי. לקראת שקיעה אפשר לראות את העיר עוברת מאור יום למיליוני אורות. מזג אוויר ורוח יכולים להשפיע על פתיחת אזורי הגג, ולכן שווה להשאיר מעט גמישות."},{"uid":"2026-11-26-8","part":"שקיעה + ערב","time":"17:25–19:00","start":1045,"end":1140,"name":"Shibuya PARCO — Nintendo, Pokémon, CAPCOM, JUMP, JoJo & SEGA","kind":"חנות","desc":"מרכז גיימינג ותרבות פופ מרוכז ב־6F של Shibuya PARCO. באותה קומה נמצאים Nintendo TOKYO, Pokémon Center Shibuya, CAPCOM STORE TOKYO, JUMP SHOP, THE","maps":"https://www.google.com/maps/search/?api=1&query=Shibuya+PARCO+Tokyo+Japan","website":"","hop":"הליכה 0.6 ק״מ","transit":false},{"uid":"2026-11-26-9","part":"שקיעה + ערב","time":"19:05–20:00","start":1145,"end":1200,"name":"Shunju Shibuya Bunkamuradori","kind":"מסעדה / אוכל","desc":"מסעדה שמתאימה טוב לזוג עם העדפות שונות: יש אפשרויות רגילות לאוכל כללי ובמקביל אפשרות טבעונית/צמחונית שמוצהר עליה ללא fish stock.","maps":"https://www.google.com/maps/search/?api=1&query=Shunju+Shibuya+Bunkamuradori+Tokyo","website":"","hop":"הליכה 0.3 ק״מ","transit":false}],"night":[{"name":"Shibuya Crossing","desc":"מעבר החציה האייקוני של שיבויה, מוקף במסכי ענק ומרכזי קניות.","maps":"https://www.google.com/maps/search/?api=1&query=Shibuya+Crossing+Japan"},{"name":"MEGA Don Quijote","desc":"חנות ענקית עם אוכל, קוסמטיקה, גאדג'טים, מתנות ודברים יפניים מוזרים.","maps":"https://www.google.com/maps/search/?api=1&query=MEGA+Don+Quijote+Japan"}]},{"id":"2026-11-27","date":"27/11","dow":"שישי","title":"Shinjuku","subtitle":"גן ביום, תצפית בשקיעה, לילה + קניות Ikebukuro","base":"טוקיו","scope":["טוקיו"],"empty":false,"items":[{"uid":"2026-11-27-0","part":"בוקר","time":"09:00–11:00","start":540,"end":660,"name":"Shinjuku Gyoen","kind":"אטרקציה","desc":"גן ענק עם גנים יפניים, מדשאות ועצי שלכת. אחד המקומות היפים בסתיו.","maps":"https://www.google.com/maps/search/?api=1&query=Shinjuku+Gyoen+Japan","website":"","hop":"הליכה 1.2 ק״מ","transit":false,"info":"מה זה\nShinjuku Gyoen הוא אחד הגנים העירוניים החשובים בטוקיו. ההיסטוריה שלו מתחילה באחוזת משפחת Naito מתקופת Edo, ממשיכה בתחנת ניסויים חקלאית של ממשלת Meiji, גן בוטני קיסרי, גן קיסרי ולבסוף גן לאומי שנפתח לציבור ב-1949.\n\nלמה זה חשוב\nהגן הוא מעין מפה פיזית של המודרניזציה היפנית. במקום אחד נפגשים גן יפני מסורתי, גן צרפתי פורמלי וגן נוף אנגלי. השילוב ממחיש כיצד יפן אימצה רעיונות מערביים בלי למחוק את המסורת המקומית.\n\nמה לשים לב\nהתמקדו בגן היפני, בבריכות, בגשרים וב-Kyu-Goryo-Tei, ואז השוו למבנה הסימטרי של הגן הצרפתי ולמדשאות האנגליות. בסוף נובמבר העלים המשתנים והניגוד בין עצים לגורדי השחקים הם חלק מרכזי מהחוויה."},{"uid":"2026-11-27-1","part":"בוקר","time":"11:15–11:30","start":675,"end":690,"name":"3D Cat Billboard","kind":"אטרקציה","desc":"מסך תלת-ממדי מפורסם עם חתול ענק ליד תחנת שינג'וקו.","maps":"https://www.google.com/maps/search/?api=1&query=3D+Cat+Billboard+Japan","website":"","hop":"הליכה 0.5 ק״מ","transit":false,"info":"מה זה\nמסך ה-3D Cat ליד יציאת East של Shinjuku Station הוא דוגמה מפורסמת לפרסום אנמורפי: האנימציה מותאמת לזווית הצפייה כך שהחתול נראה כאילו הוא יושב בתוך חלל תלת-ממדי ויוצא ממנו.\n\nלמה זה חשוב\nזהו לא אתר היסטורי אלא רגע קטן שמראה עד כמה פרסום, אנימציה, מסכים ותרבות דמויות נטמעים ברחוב היפני. הוא הפך לסמל עכשווי של שינג'וקו בדיוק משום שהוא משתמש בבניין עצמו כחלק מהאשליה.\n\nמה לשים לב\nעמדו בזווית הרחוב שממנה המסך נראה \"עמוק\". האנימציות מתחלפות, ולכן החוויה קצרה; אין צורך לבנות סביבה ביקור ארוך."},{"uid":"2026-11-27-2","part":"בוקר","time":"11:40–12:00","start":700,"end":720,"name":"Godzilla Head","kind":"אטרקציה","desc":"ראש גודזילה ענק על מלון Gracery באזור Kabukicho.","maps":"https://www.google.com/maps/search/?api=1&query=Godzilla+Head+Japan","website":"","hop":"הליכה 0.3 ק״מ","transit":false,"info":"מה זה\nראש Godzilla הענק נמצא מעל מתחם Toho Cinemas/Hotel Gracery בקבוקיצ'ו. הוא הוצב כחלק ממיתוג המתחם סביב אחת הדמויות המזוהות ביותר עם הקולנוע היפני.\n\nלמה זה חשוב\nGodzilla נולד בקולנוע היפני של שנות ה-50 והפך הרבה מעבר למפלצת קולנועית: הוא קשור לחרדות של העידן האטומי, להרס עירוני, לטכנולוגיה ולתרבות הפופ היפנית. לראות אותו מעל רחובות שינג'וקו מחבר בין הקולנוע לבין העיר שבה הדמות שוב ושוב \"הרסה\" את טוקיו על המסך.\n\nמה לשים לב\nהחוויה כאן היא בעיקר הרחוב והקנה מידה. בלילה התאורה והבניינים מסביב הופכים את הראש לחלק טבעי מקו הרקיע של Kabukicho."},{"uid":"2026-11-27-3","part":"צהריים","time":"13:25–14:30","start":805,"end":870,"name":"הפסקת צהריים /","kind":"מעבר","desc":"","maps":"","website":"","hop":"","transit":true},{"uid":"2026-11-27-4","part":"שקיעה + ערב","time":"15:30–16:30","start":930,"end":990,"name":"Tokyo Metropolitan Government Observatory","kind":"אטרקציה","desc":"תצפית חינמית מגובה רב על טוקיו.","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+Metropolitan+Government+Observatory+Japan","website":"","hop":"הליכה 1.1 ק״מ","transit":false,"info":"מה זה\nבניין ממשלת מטרופולין טוקיו בשינג'וקו תוכנן על ידי האדריכל Kenzo Tange. התצפיות במגדלים נמצאות בקומה ה-45, בגובה של כ-202 מטר, והכניסה אליהן חופשית.\n\nלמה זה חשוב\nזהו מבט עירוני שונה מ-SHIBUYA SKY. כאן אתם נמצאים במרכז אזור גורדי השחקים של מערב שינג'וקו, בתוך בניין ממשלתי שמייצג את שאיפות הבנייה של טוקיו בסוף המאה ה-20.\n\nמה לשים לב\nביום בהיר ניתן לראות מרחק רב מאוד, ולעיתים גם את הר פוג'י. בערב חזית הבניין משמשת גם למופע projection mapping בשם Tokyo Night & Light. אצלנו זו תצפית חינמית ומשלימה, לא תחליף ל-SHIBUYA SKY."},{"uid":"2026-11-27-5","part":"שקיעה + ערב","time":"16:40–17:10","start":1000,"end":1030,"name":"נסיעה Shinjuku → Ikebukuro","kind":"מעבר","desc":"","maps":"","website":"","hop":"","transit":true},{"uid":"2026-11-27-6","part":"שקיעה + ערב","time":"17:20–18:10","start":1040,"end":1090,"name":"Bandai Namco Cross Store","kind":"חנות","desc":"מתחם עם מותגי Bandai Namco, משחקים, דמויות ומרצ׳נדייז.","maps":"https://www.google.com/maps/search/?api=1&query=Bandai+Namco+Cross+Store+Japan","website":"","hop":"הליכה 0.7 ק״מ","transit":false},{"uid":"2026-11-27-7","part":"שקיעה + ערב","time":"18:15–19:15","start":1095,"end":1155,"name":"Animate Ikebukuro","kind":"חנות","desc":"חנות ענקית לאנימה, מנגה ו-merchandise.","maps":"https://www.google.com/maps/search/?api=1&query=Animate+Ikebukuro+Japan","website":"","hop":"","transit":false}],"night":[{"name":"Tokyu Kabukicho Tower","desc":"מתחם בילוי עם אוכל, משחקים, אירועים וחיי לילה.","maps":"https://www.google.com/maps/search/?api=1&query=Tokyu+Kabukicho+Tower+Japan"},{"name":"Omoide Yokocho","desc":"סמטאות קטנות וצפופות עם יקיטורי ואווירת טוקיו ישנה.","maps":"https://www.google.com/maps/search/?api=1&query=Omoide+Yokocho+Japan"},{"name":"Golden Gai","desc":"אזור ברים זעירים וסמטאות לילה מפורסמות.","maps":"https://www.google.com/maps/search/?api=1&query=Golden+Gai+Japan"}]},{"id":"2026-11-28","date":"28/11","dow":"שבת","title":"Asakusa → Ueno · שני המוזיאונים","subtitle":"מקדשים, רחובות, מוזיאון ושוק","base":"טוקיו","scope":["טוקיו"],"empty":false,"items":[{"uid":"2026-11-28-0","part":"בוקר","time":"08:45–09:25","start":525,"end":565,"name":"Sumida River","kind":"אטרקציה","desc":"נהר סומידה עובר לצד Asakusa ונותן נקודות תצפית יפות לכיוון Skytree ו-Asahi Beer Hall. מתאים להליכה קצרה או שיט.","maps":"https://www.google.com/maps/search/?api=1&query=Sumida+River+Japan","website":"","hop":"הליכה 0.7 ק״מ","transit":false,"info":"מה זה\nנהר Sumida עובר לצד Asakusa ונשפך למפרץ טוקיו. הוא היה נתיב תחבורה, מסחר, דיג וחיבור למפרץ עוד לפני שטוקיו הפכה למטרופולין המודרני.\n\nלמה זה חשוב\nהנהר מחבר ישירות לסיפור Sensō-ji, משום שלפי המסורת פסל Kannon נמצא בו בשנת 628. מעבר לממד הדתי, נתיבי המים היו חיוניים לצמיחתה של Edo כעיר ענקית.\n\nמה לשים לב\nמהטיילת אפשר לראות את Asahi Beer Hall, Tokyo Skytree וגשרים שונים. אחרי הרחובות הצפופים של Asakusa, הנהר נותן פתאום תחושת מרחב ומראה את העיר מזווית אחרת."},{"uid":"2026-11-28-1","part":"בוקר","time":"09:30–09:45","start":570,"end":585,"name":"Kaminarimon","kind":"אטרקציה","desc":"שער הרעם האייקוני בכניסה ל-Senso-ji.","maps":"https://www.google.com/maps/search/?api=1&query=Kaminarimon+Japan","website":"","hop":"הליכה 0.5 ק״מ","transit":false,"info":"מה זה\nKaminarimon, \"שער הרעם\", הוא השער החיצוני המפורסם של Sensō-ji. לפי המקדש, השער נבנה לראשונה בשנת 942. פסלי Fūjin, אל הרוח, ו-Raijin, אל הרעם, מגינים על הכניסה.\n\nלמה זה חשוב\nהשער אינו רק רקע לצילום. הוא מסמן מעבר מהעיר למסלול העלייה לרגל אל המקדש ומציג כיצד בודהיזם יפני השתלב לאורך הדורות עם דמויות וכוחות טבע ממסורות שונות.\n\nמה לשים לב\nהפנס האדום הענק הוא הסמל המזוהה ביותר עם Asakusa. השער הנוכחי נבנה מחדש ב-1960 לאחר שהקודם נשרף במאה ה-19."},{"uid":"2026-11-28-2","part":"בוקר","time":"09:45–10:55","start":585,"end":655,"name":"Senso-ji","kind":"אטרקציה","desc":"המקדש הבודהיסטי המפורסם באסאקוסה, עם שערים מרשימים ואווירה מסורתית.","maps":"https://www.google.com/maps/search/?api=1&query=Senso-ji+Japan","website":"","hop":"הליכה 0.4 ק״מ","transit":false,"info":"מה זה\nSensō-ji הוא המקדש הבודהיסטי העתיק ביותר בטוקיו ומוקדש ל-Kannon, הבודהיסטווה של החמלה. לפי המסורת, בשנת 628 שני דייגים משו פסל של Kannon מנהר Sumida; ראש הכפר הפך את ביתו למקום תפילה וב-645 נבנה אולם המקדש.\n\nלמה זה חשוב\nהסיפור של Sensō-ji הוא גם הסיפור של Asakusa. זרם עולי הרגל יצר סביב המקדש מסחר, אוכל, מופעים ובתי מלאכה — כלומר, המרכז הדתי עזר לבנות את העיר שסביבו. הדמות הקדושה הראשית היא hibutsu, \"בודהה נסתר\", ולכן המאמינים אינם רואים את הפסל שעליו נבנה כל האתר.\n\nמה לשים לב\nשימו לב לריח הקטורת, לטקסי הטהרה, לאולם המרכזי ולפגודה. המבנים הנוכחיים הם ברובם שחזורים שלאחר מלחמת העולם השנייה — תזכורת לכך שביפן המשכיות של מקום וטקס יכולה להיות חשובה לא פחות מהחומר המקורי."},{"uid":"2026-11-28-3","part":"בוקר","time":"11:00–11:45","start":660,"end":705,"name":"Nakamise Street","kind":"אטרקציה","desc":"רחוב קניות מסורתי בין Kaminarimon ל-Senso-ji, עם מזכרות וממתקים.","maps":"https://www.google.com/maps/search/?api=1&query=Nakamise+Street+Japan","website":"","hop":"הליכה 0.8 ק״מ","transit":false,"info":"מה זה\nNakamise הוא רחוב הגישה המסחרי שבין Kaminarimon ל-Sensō-ji, ונחשב לאחד מרחובות המסחר העתיקים ביפן. שורשיו בתקופת Edo, כאשר מי שסייעו בשירותי המקדש קיבלו זכות להפעיל דוכנים לאורך הדרך.\n\nלמה זה חשוב\nזהו דוגמה ברורה לקשר בין עלייה לרגל למסחר: אנשים באו למקדש, ולכן נוצרה סביבם כלכלה של תה, מתוקים, צעצועים, מזכרות ועבודות יד. כך דת, עיר ומסחר הפכו למערכת אחת.\n\nמה לשים לב\nמעבר למזכרות, חפשו ningyō-yaki, rice crackers, wagashi ומלאכות מסורתיות. הרחוב צפוף מאוד, ולכן עדיף להתייחס אליו כמעבר איטי לכיוון המקדש ולא כמשימת קניות."},{"uid":"2026-11-28-4","part":"בוקר","time":"11:50–12:40","start":710,"end":760,"name":"Hat Coffee / 3D Foam Art","kind":"מסעדה / אוכל","desc":"קפה באסאקוסה עם קצף תלת-ממדי בעיצובים מיוחדים.","maps":"https://www.google.com/maps/search/?api=1&query=Hat+Coffee+%2F+3D+Foam+Art+Japan","website":"","hop":"הליכה 0.9 ק״מ","transit":false},{"uid":"2026-11-28-5","part":"צהריים","time":"12:50–14:05","start":770,"end":845,"name":"Kappabashi Street","kind":"אטרקציה","desc":"רחוב כלי המטבח של טוקיו: סכינים, כלי קרמיקה ודגמי אוכל מפלסטיק.","maps":"https://www.google.com/maps/search/?api=1&query=Kappabashi+Street+Japan","website":"","hop":"","transit":false,"info":"מה זה\nKappabashi Dougu Street הוא רחוב המתמחה בציוד למסעדות ומטבחים. סוחרי כלים החלו להתרכז באזור בראשית המאה ה-20, וכיום הרחוב באורך כ-800 מטר כולל יותר מ-170 עסקים.\n\nלמה זה חשוב\nזה אחד המקומות הטובים להבין שהאוכל היפני הוא גם תעשייה של מלאכה מדויקת: סכינים, כלי חרס, לכה, תבניות, שילוט, וילונות noren ודגמי אוכל מפלסטיק. הרחוב חושף את התשתית שמאחורי המסעדה היפנית.\n\nמה לשים לב\nגם בלי לקנות, הסתכלו על סכיני המטבח ועל דגמי המזון הריאליסטיים. לשם Kappabashi יש אגדות שונות, כולל סיפור על kappa שעזרו בחפירת תעלות ניקוז — ולכן דמויות kappa מופיעות ברחוב."},{"uid":"2026-11-28-6","part":"צהריים","time":"14:05–14:25","start":845,"end":865,"name":"נסיעה / הליכה ל-Ueno","kind":"מעבר","desc":"","maps":"","website":"","hop":"","transit":true},{"uid":"2026-11-28-7","part":"אחה״צ","time":"14:25–14:50","start":865,"end":890,"name":"Ueno Park","kind":"אטרקציה","desc":"פארק אואנו — מעבר ירוק ונעים בין מתחמי התרבות והמוזיאונים.","maps":"https://www.google.com/maps/search/?api=1&query=Ueno+Park+Tokyo","website":"","hop":"הליכה 0.4 ק״מ","transit":false,"info":"מה זה\nUeno Park הוא אחד המרכזים התרבותיים החשובים בטוקיו. האזור היה קשור בעבר למקדש Kan'ei-ji, ולאחר Meiji הפך לאחד הפארקים הציבוריים הראשונים ביפן.\n\nלמה זה חשוב\nהיום הפארק מרכז סביבו מוזיאונים לאומיים, גן חיות, מקדשים, אגם ושטחים ציבוריים. לכן הוא פחות \"פארק\" במובן הרגיל ויותר רובע תרבות פתוח.\n\nמה לשים לב\nאצלנו הוא משמש כרקמת החיבור בין Tokyo National Museum, National Museum of Nature and Science ו-Ameyoko. כדאי לשים לב למעבר השקט יחסית מהפארק אל השוק הצפוף בהמשך."},{"uid":"2026-11-28-8","part":"אחה״צ","time":"14:55–15:55","start":895,"end":955,"name":"Tokyo National Museum","kind":"אטרקציה","desc":"המוזיאון המרכזי לאמנות, עתיקות והיסטוריה חומרית של יפן. ביקור ממוקד של כשעה כדי לראות Highlights בלי להפוך את היום ליום מוזיאונים בלבד.","maps":"https://www.google.com/maps/search/?api=1&query=Tokyo+National+Museum+Ueno","website":"https://www.tnm.jp/?lang=en","hop":"הליכה 0.6 ק״מ","transit":false,"info":"מה זה\nTokyo National Museum נוסד ב-1872 והוא המוזיאון הוותיק ביותר מסוגו ביפן. הוא מחזיק באוסף עצום של אמנות, ארכאולוגיה וחפצי תרבות מיפן וממזרח אסיה.\n\nלמה זה חשוב\nאחרי ביקור במקדשים, גנים ורבעים היסטוריים, כאן אפשר לראות את החפצים עצמם: פסלים בודהיסטיים, קרמיקה, קליגרפיה, שריון, חרבות, טקסטיל וציור. האוסף כולל מספר גדול של National Treasures ו-Important Cultural Properties.\n\nמה לשים לב\nבזמן המוגבל שלנו התמקדו ב-Honkan לאמנות יפנית וב-Heiseikan לארכאולוגיה. המוצגים מתחלפים לעיתים קרובות לצורכי שימור, לכן אין \"רשימת חובה\" קבועה."},{"uid":"2026-11-28-9","part":"אחה״צ","time":"16:00–16:55","start":960,"end":1015,"name":"National Museum of Nature and Science","kind":"אטרקציה","desc":"מוזיאון מדע וטבע גדול באואנו. נשאר במסלול; הביקור מתקצר מעט כדי לאפשר גם את Tokyo National Museum.","maps":"https://www.google.com/maps/search/?api=1&query=National+Museum+of+Nature+and+Science+Tokyo","website":"","hop":"הליכה 1.0 ק״מ","transit":false,"info":"מה זה\nהמוזיאון הלאומי לטבע ומדע באואנו הוא אחד ממוסדות המדע המרכזיים של יפן. שורשיו במוסד מוזיאלי שהחל ב-1870s, והבניין ההיסטורי של Japan Gallery נפתח ב-1931.\n\nלמה זה חשוב\nהמוזיאון מספר שני סיפורים במקביל: הטבע והאבולוציה בעולם, וההתפתחות המדעית והסביבתית של יפן. הוא משלב specimens, שלדים, טכנולוגיה, גאולוגיה, ביולוגיה והיסטוריה של המדע.\n\nמה לשים לב\nמכיוון שיש לנו זמן מוגבל, אין טעם לנסות לראות הכול. עדיף לבחור כמה galleries שמעניינות אתכם במיוחד ולראות את Japan Gallery כמוקד."},{"uid":"2026-11-28-10","part":"ערב","time":"17:05–18:00","start":1025,"end":1080,"name":"Ameyoko Market","kind":"אטרקציה","desc":"רחוב שוק צפוף ותוסס ליד Ueno עם אוכל, חנויות ואווירת ערב.","maps":"https://www.google.com/maps/search/?api=1&query=Ameyoko+Market+Tokyo","website":"","hop":"","transit":false,"info":"מה זה\nAmeyoko הוא שוק רחוב צפוף בין Ueno ל-Okachimachi. הוא מזוהה עם התקופה שלאחר מלחמת העולם השנייה, אז נוצרו באזור דוכנים ושווקים שחורים למזון ולמוצרים שקשה היה להשיג.\n\nלמה זה חשוב\nהשם מקושר לעיתים גם ל-\"ame\" כממתקים וגם ל-\"America\" בשל מוצרים אמריקאיים שהגיעו לשוק. כיום זה מקום כאוטי ותוסס של אוכל, בגדים, דגים, תבלינים ומציאות.\n\nמה לשים לב\nהחוויה היא הקצב: קריאות מוכרים, שלטים צפופים ורחובות צרים. זה סיום מצוין ליום Ueno כי הוא מנוגד כמעט לחלוטין לשקט ולסדר של המוזיאונים."}],"night":[]},{"id":"2026-11-29","date":"29/11","dow":"ראשון","title":"Imperial Palace East Gardens → Akihabara","subtitle":"מקדש בבוקר, רטרו ביום, קניות בסוף","base":"טוקיו","scope":["טוקיו"],"empty":false,"items":[{"uid":"2026-11-29-0","part":"בוקר","time":"09:00–10:15","start":540,"end":615,"name":"Imperial Palace East Gardens","kind":"אטרקציה","desc":"הגנים המזרחיים של הארמון הקיסרי — שרידי Edo Castle, חומות, גנים ושבילים בלב טוקיו.","maps":"https://www.google.com/maps/search/?api=1&query=Imperial+Palace+East+Gardens+Tokyo","website":"https://www.kunaicho.go.jp/e-event/higashigyoen02.html","hop":"נסיעה קצרה / הליכה ל-Kanda","transit":false,"info":"מה זה\nהגנים המזרחיים של הארמון הקיסרי יושבים על החלקים המרכזיים של Edo Castle — Honmaru, Ninomaru ו-Sannomaru — ונפתחו לציבור ב-1968.\n\nלמה זה חשוב\nלפני שטוקיו הייתה עיר מודרנית היא הייתה Edo, בירת השוגונות של Tokugawa. כאן היה המרכז הפוליטי של אותה מערכת. היום אין עוד טירה שלמה, אבל החומות, השערים, בסיס ה-tenshu והטופוגרפיה מאפשרים לדמיין את קנה המידה שלה.\n\nמה לשים לב\nחפשו את Tenshudai, שרידי בתי השמירה, חומות האבן ו-Ninomaru Garden. זה מקום שבו דווקא \"מה שלא נשאר\" חשוב להבנת ההיסטוריה. יש בדיקת תיקים בכניסה."},{"uid":"2026-11-29-1","part":"בוקר","time":"10:15–10:40","start":615,"end":640,"name":"נסיעה / הליכה ל-Akihabara","kind":"נסיעה","desc":"מעבר מאזור הארמון ל-Kanda / Akihabara.","maps":"","website":"","hop":"","transit":true},{"uid":"2026-11-29-2","part":"בוקר","time":"10:40–11:20","start":640,"end":680,"name":"Kanda Myojin","kind":"אטרקציה","desc":"מקדש שינטו היסטורי המזוהה היום גם עם Akihabara ותרבות הטכנולוגיה.","maps":"https://www.google.com/maps/search/?api=1&query=Kanda+Myojin+Tokyo","website":"","hop":"הליכה 0.8 ק״מ","transit":false,"info":"מה זה\nKanda Myojin הוא מקדש שינטו עתיק שמייחס את הקמתו לשנת 730. בתקופת Edo הוא הפך למקדש מגן מרכזי של העיר, והיה קשור גם לבית Tokugawa.\n\nלמה זה חשוב\nהמיקום שלו ליד Akihabara יצר חיבור יוצא דופן בין מסורת לטכנולוגיה. כיום אנשי עסקים, תושבים ואפילו חברות טכנולוגיה מגיעים לבקש ברכה להצלחה, והופיעו בו גם omamori וקמעות הקשורים למחשבים ואלקטרוניקה.\n\nמה לשים לב\nחשוב לראות את הניגוד: כמה דקות מארקיידים ואנימה, ואתם בתוך מקדש עם מאות שנות היסטוריה. זה אחד המקומות הטובים להבין שטוקיו לא מחלקת \"ישן\" ו\"חדש\" לאזורים נפרדים."},{"uid":"2026-11-29-3","part":"בוקר","time":"11:30–12:15","start":690,"end":735,"name":"GiGO Arcades","kind":"אטרקציה","desc":"ארקיידים בלב Akihabara — crane games, rhythm games ומשחקי וידאו.","maps":"https://www.google.com/maps/search/?api=1&query=GiGO+Akihabara+Tokyo","website":"","hop":"הליכה 0.4 ק״מ","transit":false,"info":"מה זה\nGiGO מייצגת את תרבות ה-game center היפנית: קומות של crane games, rhythm games, racing, fighting, photo booths ומשחקי ארקייד שאינם בהכרח נפוצים מחוץ ליפן.\n\nלמה זה חשוב\nAkihabara מזוהה עם אלקטרוניקה, anime ו-otaku, אבל הארקייד הוא החלק הפעיל והחברתי של התרבות הזו. המותג GiGO ירש בשנים האחרונות רבים מהסניפים שהיו מזוהים בעבר עם SEGA.\n\nמה לשים לב\nאל תישארו רק ב-crane games בקומה הראשונה. הקומות העליונות בדרך כלל מעניינות יותר לחובבי משחקי קצב וארקייד יפני. זו חוויה של צליל, אור וקצב לא פחות ממשחק."},{"uid":"2026-11-29-4","part":"צהריים","time":"12:20–15:20","start":740,"end":920,"name":"Akihabara Retro Game Shopping — Surugaya, Trader, Super Potato, Sofmap, Jan-gle, Retro Game Camp & BOOKOFF","kind":"קניות","desc":"בלוק הקניות המרכזי לרטרו וגיימינג. קוצר מעט כדי לפנות מקום לגנים בבוקר.","maps":"https://www.google.com/maps/search/?api=1&query=Akihabara+Tokyo","website":"","hop":"הליכה 0.6 ק״מ","transit":false},{"uid":"2026-11-29-5","part":"אחה״צ","time":"15:25–16:25","start":925,"end":985,"name":"Mandarake Complex","kind":"חנות","desc":"קומפלקס רב-קומות של manga, anime, toys, collectibles ופריטי יד שנייה.","maps":"https://www.google.com/maps/search/?api=1&query=Mandarake+Complex+Akihabara","website":"","hop":"הליכה 0.8 ק״מ","transit":false},{"uid":"2026-11-29-6","part":"אחה״צ","time":"16:30–17:25","start":990,"end":1045,"name":"Radio Kaikan","kind":"חנות","desc":"בניין אייקוני של Akihabara עם חנויות figures, cards, hobby ו-collectibles.","maps":"https://www.google.com/maps/search/?api=1&query=Akihabara+Radio+Kaikan","website":"","hop":"הליכה 0.5 ק״מ","transit":false},{"uid":"2026-11-29-7","part":"ערב","time":"17:30–18:10","start":1050,"end":1090,"name":"Kotobukiya Akihabara","kind":"חנות","desc":"חנות דגל ל-figures, character goods ו-merchandise.","maps":"https://www.google.com/maps/search/?api=1&query=Kotobukiya+Akihabara","website":"","hop":"הליכה 0.7 ק״מ","transit":false},{"uid":"  אימרסיבי ב-Toyosu. חלק מהעבודות דורשות הליכה יחפה במים או דרך חללים שבהם הגבול בין גוף, אור, מראה, צליל וסביבה כמעט נעלם.\n\nלמה זה חשוב\nהעבודה של teamLab אינה מתייחסת לאמנות כאובייקט שתולים על קיר. המבקר עצמו הופך לחלק מהיצירה, והיצירה משתנה בהתאם לתנועה, תאורה וחלל. זה ממשיך רעיון שחוזר במסלול: היחסים בין אדם, טבע וטכנולוגיה.\n\nמה לשים לב\nאל תמהרו לצלם כל דבר. כמה מהחללים עובדים טוב יותר כשפשוט עומדים בהם. לבשו בגדים שמתאימים למים ולרצפות מראה, והגיעו לפי חלון הכניסה המוזמן."},{"uid":"2026-11-30-2","part":"צהריים","time":"12:05–13:20","start":725,"end":800,"name":"Senkyaku Banrai","kind":"אטרקציה","desc":"מתחם בסגנון יפני מסורתי עם אוכל, חנויות ואונסן רגליים/מרחצאות.","maps":"https://www.google.com/maps/search/?api=1&query=Senkyaku+Banrai+Japan","website":"","hop":"רכבת 3.1 ק״מ","transit":false,"info":"מה זה\nToyosu Senkyaku Banrai הוא מתחם אוכל, מסחר ומרחצאות שנפתח ליד Toyosu Market. העיצוב שואב השראה מרחובות Edo ומשלב שוק אוכל עם Tokyo Toyosu Manyo Club.\n\nלמה זה חשוב\nזה לא \"שוק היסטורי\" אלא פרשנות מודרנית ומבויימת לתרבות שוק יפנית. הוא מנסה לחבר את חומרי הגלם של Toyosu עם חוויית אוכל נגישה לקהל הרחב.\n\nמה לשים לב\nהערך עבורנו הוא המעבר בין Toyosu המקצועי והפונקציונלי לבין הרחוב המעוצב והמכוון לתייר. לצמחוני צריך לבדוק היטב dashi ומרכיבים מן החי."},{"uid":"2026-11-30-3","part":"צהריים","time":"13:40–15:30","start":820,"end":930,"name":"Small Worlds","kind":"אטרקציה","desc":"מוזיאון מיניאטורות ענק עם ערים, חלל, אנימה ומערכות מכניות.","maps":"https://www.google.com/maps/search/?api=1&query=Small+Worlds+Japan","website":"","hop":"רכבת 3.2 ק״מ","transit":false,"info":"מה זה\nSMALL WORLDS הוא מוזיאון מיניאטורות ב-Ariake. התצוגות כוללות ערים, שדות תעופה, חלל, Evangelion ועולמות בדיוניים שנבנו בקנה מידה קטן עם תאורה, תנועה והמון פרטים.\n\nלמה זה חשוב\nמיניאטורות הן חיבור בין craft, engineering ו-storytelling. במקום להסתכל על אובייקט בודד, אתם מסתכלים על מערכת שלמה — אנשים, רכבות, מטוסים, בניינים וסיפורים זעירים.\n\nמה לשים לב\nהתכופפו לגובה של הדמויות ונסו לראות את העולם \"מבפנים\". התצוגה מעניינת במיוחד למי שאוהב מודלים, מכניקה ו-Evangelion."},{"uid":"2026-11-30-4","part":"צהריים","time":"15:45–16:20","start":945,"end":980,"name":"Odaiba Seaside Park","kind":"אטרקציה","desc":"טיילת ונוף יפה למפרץ, Rainbow Bridge וטוקיו.","maps":"https://www.google.com/maps/search/?api=1&query=Odaiba+Seaside+Park+Japan","website":"","hop":"הליכה 0.5 ק״מ","transit":false,"info":"מה זה\nOdaiba Seaside Park הוא פארק חוף על מפרץ טוקיו עם חוף מלאכותי, טיילת ותצפיות ל-Rainbow Bridge ולקו הרקיע של העיר.\n\nלמה זה חשוב\nOdaiba בנויה על איים מלאכותיים. המקור של האזור במבצרי חוף שנבנו בשלהי תקופת Edo, ובהמשך הוא הפך לפרויקט ענק של פיתוח waterfront. לכן הנוף כאן הוא נוף \"מתוכנן\" כמעט לחלוטין.\n\nמה לשים לב\nלקראת שקיעה כדאי להאט: אור יום → שקיעה → Rainbow Bridge מואר → קו הרקיע. זה אחד המקומות הנדירים במסלול שבהם טוקיו נראית מרחוק ובגובה העיניים ולא מלמעלה."},{"uid":"2026-11-30-5","part":"צהריים","time":"16:20–16:35","start":980,"end":995,"name":"Statue of Liberty replica","kind":"אטרקציה","desc":"פסל החירות הקטן של Odaiba עם רקע של המפרץ.","maps":"https://www.google.com/maps/search/?api=1&query=Statue+of+Liberty+replica+Japan","website":"","hop":"הליכה 1.0 ק״מ","transit":false,"info":"מה זה\nפסל החירות של Odaiba הוא העתק של פסל בפריז. הפסל הצרפתי הוצב באודאיבה באופן זמני בשנים 1998–1999 במסגרת אירועי ידידות צרפת–יפן, ולאחר הצלחתו נוצר העתק קבוע.\n\nלמה זה חשוב\nהפסל הוא דוגמה משעשעת לאופן שבו Odaiba בנויה מסמלים גלובליים, אדריכלות חדשה ומרחבים מתוכננים. הוא הפך לחלק מהזהות של האי למרות שאין לו קשר היסטורי עמוק ליפן.\n\nמה לשים לב\nהקומפוזיציה הקלאסית היא הפסל, Rainbow Bridge וקו הרקיע מאחור. גובהו עם הבסיס כ-11 מטר, בערך שביעית מפסל ניו יורק."},{"uid":"2026-11-30-6","part":"ערב","time":"16:45–17:45","start":1005,"end":1065,"name":"DiverCity Tokyo Plaza","kind":"אטרקציה","desc":"קניון גדול עם Gundam Base, אופנה, אוכל ובידור.","maps":"https://www.google.com/maps/search/?api=1&query=DiverCity+Tokyo+Plaza+Japan","website":"","hop":"הליכה 0.2 ק״מ","t
